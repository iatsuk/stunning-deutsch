levels:
  - id: a1
    code: A1
    name: Первые шаги
    status: open
    exam: telc Deutsch A1 · Start Deutsch 1
    summary: Понимаете и используете простые фразы, без которых не обойтись в быту. Можете
      представиться, ответить, где живёте и чем занимаетесь, сделать заказ, спросить дорогу и
      цену — если собеседник говорит медленно и готов помочь.
    can:
      - Представиться, назвать по буквам имя и продиктовать номер телефона
      - Задать простой вопрос о семье, работе, еде, времени и ответить на него
      - Понять объявление на вокзале, сообщение на автоответчике, табличку на двери
      - Заполнить анкету и написать записку из трёх-четырёх предложений
    examInfo:
      note: Письменная часть длится около 65 минут, устная — около 15 минут, в группе до четырёх
        человек и без времени на подготовку. Каждый из четырёх модулей даёт до 15 баллов.
        Экзамен сдан, если набрано не меньше 60 % от максимума.
      modules:
        - id: hoeren
          de: Hören
          ru: Аудирование
          minutes: ≈ 20
          parts:
            - id: hoeren-1
              what: Короткие разговоры двух людей — на улице, дома, на работе
              how: 6 заданий · a, b или c · звучит дважды
            - id: hoeren-2
              what: Объявления по громкой связи — вокзал, аэропорт, супермаркет
              how: 4 задания · richtig или falsch · звучит один раз
            - id: hoeren-3
              what: Сообщения на автоответчике — от друзей, из врачебной практики, из фирмы
              how: 5 заданий · a, b или c · звучит дважды
        - id: lesen
          de: Lesen
          ru: Чтение
          minutes: "25"
          parts:
            - id: lesen-1
              what: Две записки или письма — приглашение, просьба, сообщение
              how: 5 заданий · richtig или falsch
            - id: lesen-2
              what: Объявления и сайты — найти, где есть нужная информация
              how: 5 заданий · выбрать одно из двух объявлений, a или b
            - id: lesen-3
              what: Таблички и объявления на дверях
              how: 5 заданий · richtig или falsch
        - id: schreiben
          de: Schreiben
          ru: Письмо
          minutes: "20"
          parts:
            - id: schreiben-1
              what: Анкета — заполнить пять пропусков по тексту о ситуации
              how: 5 баллов, по одному за поле
            - id: schreiben-2
              what: Короткое сообщение около 30 слов по трём пунктам, с обращением и подписью
              how: 10 баллов — по 3 за пункт и 1 за оформление
        - id: sprechen
          de: Sprechen
          ru: Говорение
          minutes: ≈ 15
          parts:
            - id: sprechen-1
              what: Рассказать о себе по ключевым словам, назвать что-то по буквам и продиктовать номер
              how: 3 балла
            - id: sprechen-2
              what: По карточке с темой и словом задать вопрос партнёру и ответить на его вопрос
              how: 6 баллов — по 2 за вопрос и по 1 за ответ
            - id: sprechen-3
              what: По картинке попросить о чём-то и отреагировать на просьбу партнёра
              how: 6 баллов — по 2 за просьбу и по 1 за реакцию
  - id: a2
    code: A2
    name: Повседневность
    status: soon
    exam: telc Deutsch A2 · Start Deutsch 2
    summary: Понимаете частые выражения о семье, покупках, работе и ближайшем окружении. Можете
      коротко рассказать о себе, о прошлом и о планах, справиться с простым обменом
      информацией.
    can:
      - Объяснить причину, предложить вариант и договориться о совместном плане
      - Понять телефонное сообщение, указатель, объявление и короткий связный текст
      - Заполнить анкету и написать сообщение примерно на 40 слов
      - Рассказать о прошлом, учёбе, работе и планах
    examInfo:
      note: "Start Deutsch 2 / telc Deutsch A2: Hören около 20 минут, Lesen и Schreiben вместе 50
        минут; Sprechen около 15 минут, обычно в паре без подготовки. Игры не заменяют
        самостоятельное письмо и разговор."
      modules:
        - id: hoeren
          de: Hören
          ru: Аудирование
          minutes: ≈ 20
          parts:
            - id: a2-hoeren-1
              what: Телефонные заметки
              how: 5 заданий · вписать сведения · дважды
            - id: a2-hoeren-2
              what: Радиосообщения
              how: 5 заданий · a/b/c · один раз
            - id: a2-hoeren-3
              what: Разговор и сопоставление
              how: 5 связей · дважды
        - id: lesen
          de: Lesen
          ru: Чтение
          minutes: "вместе с письмом: 50"
          parts:
            - id: a2-lesen-1
              what: Информационный указатель
              how: 5 заданий · a/b/c
            - id: a2-lesen-2
              what: Связный текст
              how: 5 утверждений · richtig/falsch
            - id: a2-lesen-3
              what: Объявления и ситуации
              how: 5 соответствий · один случай без подходящего объявления
        - id: schreiben
          de: Schreiben
          ru: Письмо
          minutes: "вместе с чтением: 50"
          parts:
            - id: a2-schreiben-1
              what: Анкета
              how: 5 недостающих сведений
            - id: a2-schreiben-2
              what: Короткое письмо
              how: ≈ 40 слов · выбрать 3 из 4 пунктов
        - id: sprechen
          de: Sprechen
          ru: Говорение
          minutes: ≈ 15
          parts:
            - id: a2-sprechen-1
              what: О себе
              how: Представиться
            - id: a2-sprechen-2
              what: Повседневный разговор
              how: Задавать вопросы и отвечать
            - id: a2-sprechen-3
              what: Совместное решение
              how: Предложить, обсудить, договориться
  - id: b1
    code: B1
    name: Самостоятельность
    status: soon
    exam: telc Deutsch B1 · Zertifikat Deutsch
    summary: Учитесь понимать связные тексты, рассказывать о событиях, объяснять своё мнение и
      передавать чужую мысль. Пишете письма, уточняете условия и находите совместное решение.
      В сезоне FördeTreff команда готовит и проводит осеннюю встречу.
    can:
      - Связно рассказать о событии и объяснить причину
      - Понять основную мысль текста и отличить её от отдельного примера
      - Пересказать позицию собеседника и выразить своё мнение
      - Написать связное письмо и договориться о совместном решении
    examInfo:
      note: "Zertifikat Deutsch / telc Deutsch B1: Lesen и Sprachbausteine вместе 90 минут, Hören
        около 30, Schreiben 30; устная пара около 15 минут после 20 минут подготовки. Все 20 уроков,
        входная работа, пять проверок и авторский пробник доступны на странице."
      modules:
        - id: lesen
          de: Lesen
          ru: Чтение
          minutes: "вместе со Sprachbausteine: 90"
          parts:
            - id: b1-lesen-1
              what: Главная мысль
              how: 5 текстов и 10 заголовков
            - id: b1-lesen-2
              what: Детали текста
              how: 5 заданий · a/b/c
            - id: b1-lesen-3
              what: Объявления
              how: 10 ситуаций · соответствия, возможен X
        - id: sprachbausteine
          de: Sprachbausteine
          ru: Лексика и грамматика
          minutes: "вместе с Lesen: 90"
          parts:
            - id: b1-sprachbausteine-1
              what: Грамматика в тексте
              how: 10 пропусков · a/b/c
            - id: b1-sprachbausteine-2
              what: Лексика в тексте
              how: 10 пропусков · банк из 15 слов, каждое не больше одного раза
        - id: hoeren
          de: Hören
          ru: Аудирование
          minutes: ≈ 30
          parts:
            - id: b1-hoeren-1
              what: Основная мысль
              how: 5 коротких текстов · richtig/falsch · один раз
            - id: b1-hoeren-2
              what: Детали разговора
              how: 10 утверждений · richtig/falsch · дважды
            - id: b1-hoeren-3
              what: Короткие сообщения
              how: 5 утверждений · richtig/falsch · дважды
        - id: schreiben
          de: Schreiben
          ru: Письмо
          minutes: "30"
          parts:
            - id: b1-schreiben-1
              what: Ответ на письмо
              how: Все 4 пункта · личное или полуофициальное письмо
        - id: sprechen
          de: Sprechen
          ru: Говорение
          minutes: ≈ 15
          parts:
            - id: b1-sprechen-1
              what: Познакомиться
              how: Обмен информацией и взаимные вопросы
            - id: b1-sprechen-2
              what: Обсудить тему
              how: "Разные тексты: пересказ, мнение, собственный опыт"
            - id: b1-sprechen-3
              what: Составить общий план
              how: Предложения, реакция, согласование
