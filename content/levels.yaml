# Ступени курса и экзамены. Открыта только A1, у остальных пока описание.
# B2 и C1 отложены: их описание лежит в content/later/levels-b2-c1.yaml,
# сборка его не читает. Чтобы вернуть уровень, перенесите блок обратно в levels.
#
# Описания уровней пересказывают общую шкалу CEFR. Формат A1 взят из
# официального описания экзамена Start Deutsch 1 (Prüfungsziele und
# Testbeschreibung): telc Deutsch A1 и Goethe-Zertifikat A1 — это один и тот же
# экзамен, его разрабатывали вместе.

# Главы темы по умолчанию. Тема может задать свои в поле chapters.
chapters:
  - { id: scene, title: Ситуация }
  - { id: words, title: Слова }
  - { id: grammar, title: Грамматика }
  - { id: practice, title: Проверка }
  - { id: exam, title: На экзамене }

levels:
  - id: a1
    code: A1
    name: Первые шаги
    status: open
    exam: telc Deutsch A1 · Start Deutsch 1
    summary: >-
      Понимаете и используете простые фразы, без которых не обойтись в быту.
      Можете представиться, ответить, где живёте и чем занимаетесь, сделать
      заказ, спросить дорогу и цену — если собеседник говорит медленно и
      готов помочь.
    can:
      - Представиться, назвать по буквам имя и продиктовать номер телефона
      - Задать простой вопрос о семье, работе, еде, времени и ответить на него
      - Понять объявление на вокзале, сообщение на автоответчике, табличку на двери
      - Заполнить анкету и написать записку из трёх-четырёх предложений
    examInfo:
      note: >-
        Письменная часть длится около 65 минут, устная — около 15 минут, в
        группе до четырёх человек и без времени на подготовку. Каждый из
        четырёх модулей даёт до 15 баллов. Экзамен сдан, если набрано не
        меньше 60 % от максимума.
      modules:
        - id: hoeren
          de: Hören
          ru: Аудирование
          minutes: ≈ 20
          parts:
            - id: hoeren-1
              what: Короткие разговоры двух людей — на улице, дома, на работе
              how: 6 заданий · a, b или c · звучит дважды
            - id: hoeren-2
              what: Объявления по громкой связи — вокзал, аэропорт, супермаркет
              how: 4 задания · richtig или falsch · звучит один раз
            - id: hoeren-3
              what: Сообщения на автоответчике — от друзей, из врачебной практики, из фирмы
              how: 5 заданий · a, b или c · звучит дважды
        - id: lesen
          de: Lesen
          ru: Чтение
          minutes: "25"
          parts:
            - id: lesen-1
              what: Две записки или письма — приглашение, просьба, сообщение
              how: 5 заданий · richtig или falsch
            - id: lesen-2
              what: Объявления и сайты — найти, где есть нужная информация
              how: 5 заданий · выбрать одно из двух объявлений, a или b
            - id: lesen-3
              what: Таблички и объявления на дверях
              how: 5 заданий · richtig или falsch
        - id: schreiben
          de: Schreiben
          ru: Письмо
          minutes: "20"
          parts:
            - id: schreiben-1
              what: Анкета — заполнить пять пропусков по тексту о ситуации
              how: 5 баллов, по одному за поле
            - id: schreiben-2
              what: Короткое сообщение около 30 слов по трём пунктам, с обращением и подписью
              how: 10 баллов — по 3 за пункт и 1 за оформление
        - id: sprechen
          de: Sprechen
          ru: Говорение
          minutes: ≈ 15
          parts:
            - id: sprechen-1
              what: Рассказать о себе по ключевым словам, назвать что-то по буквам и продиктовать номер
              how: 3 балла
            - id: sprechen-2
              what: По карточке с темой и словом задать вопрос партнёру и ответить на его вопрос
              how: 6 баллов — по 2 за вопрос и по 1 за ответ
            - id: sprechen-3
              what: По картинке попросить о чём-то и отреагировать на просьбу партнёра
              how: 6 баллов — по 2 за просьбу и по 1 за реакцию

  - id: a2
    code: A2
    name: Повседневность
    status: soon
    exam: telc Deutsch A2 · Start Deutsch 2
    summary: >-
      Понимаете частые выражения о семье, покупках, работе и ближайшем
      окружении. Можете коротко рассказать о себе, о прошлом и о планах,
      справиться с простым обменом информацией.

  - id: b1
    code: B1
    name: Самостоятельность
    status: soon
    exam: telc Deutsch B1 · Zertifikat Deutsch
    summary: >-
      Понимаете главное в ясной речи о работе, учёбе и досуге. Справляетесь
      почти с любой ситуацией в поездке, связно рассказываете о событиях и
      планах, объясняете своё мнение.
