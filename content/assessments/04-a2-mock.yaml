      b) Gebrauchte Möbel: kleine Tische und Stühle, Abholung Samstag.
      c) Deutsch am Abend. Gesprächsgruppe Dienstag, 18 Uhr, kostenlos.
      d) Kochkurs. Samstag, vegetarische Gerichte, 25 Euro.
      e) Zimmer für eine Person. Zwei Nächte 90 Euro, ohne Frühstück.
      f) Fotokurs am Sonntag. Kamera mitbringen, 15 Euro.
      g) Musikabend Freitag, Eintritt 8 Euro.
      h) Café am Lernpark. Frühstück täglich ab 9 Uhr.
      x) Kein passendes Angebot.
