title: Авторский пробник Start Deutsch 2
intro: "Новые задания о повседневной жизни вокруг учебного центра. Это тренировка формата telc
  Deutsch A2: самостоятельная письменная попытка и дополнительный устный разговор. Все
  организации, сообщения и предложения вымышлены."
sections:
  - id: listening
    title: Hören
    minutes: 20
    taskIds:
      - phone
      - radio
      - conversation
  - id: reading-writing
    title: Lesen und Schreiben
    minutes: 50
    taskIds:
      - directory
      - article
      - ads
      - form
      - letter
  - id: speaking
    title: Sprechen · дополнительно, в паре
    minutes: 15
    taskIds:
      - self
      - daily
      - plan
tasks:
  phone:
    kind: worksheet
    part: a2-hoeren-1
    format: notes
    title: Teil 1 · Fünf Telefonnotizen
    questions:
      - prompt: "Paket abholen: ab wie viel Uhr?"
        answers:
          - 15:30
          - "15.30"
          - halb vier
          - fünfzehn Uhr dreißig
      - prompt: "Treffen mit Nora: wo?"
        answers:
          - am Seiteneingang
          - Seiteneingang
      - prompt: "Lernfahrt: Preis pro Person"
        answers:
          - "26"
          - 26 Euro
          - sechsundzwanzig Euro
      - prompt: "Kursraum: Nummer"
        answers:
          - "204"
          - zweihundertvier
      - prompt: Jonas kann am Mittwoch nicht. Neuer Tag?
        answers:
          - Donnerstag
    situation: Hören Sie jede Nachricht zweimal und ergänzen Sie die Notizen.
    recordings:
      - text: Guten Tag, hier ist Ihr Lernladen. Ihr Paket ist da. Sie können es heute ab halb vier
          abholen. Wir schließen um neunzehn Uhr. Auf Wiederhören.
        voice: Sandy
      - text: Hallo, hier ist Nora. Der Haupteingang ist heute zu. Ich warte am Seiteneingang auf dich.
          Nicht am Parkplatz. Bis gleich!
        voice: Shelley
      - text: Guten Tag. Sie haben nach unserer Lernfahrt gefragt. Der Preis ist sechsundzwanzig Euro
          pro Person. Das Mittagessen kostet extra. Vielen Dank.
        voice: Eddy
      - text: "Eine Nachricht vom Lernzentrum: Ihr Sprachkurs ist heute nicht in Raum zweihundertdrei,
          sondern in Raum zweihundertvier. Die Uhrzeit bleibt gleich."
        voice: Sandy
      - text: Hallo, hier ist Jonas. Am Mittwoch muss ich länger arbeiten. Können wir uns am Donnerstag
          treffen? Am Freitag bin ich nicht in Kiel. Ruf mich bitte zurück.
        voice: Eddy
  radio:
    kind: worksheet
    part: a2-hoeren-2
    format: radio
    title: Teil 2 · Fünf Radiomeldungen
    questions:
      - prompt: Was kommt um 16 Uhr?
        answers:
          - ein Interview
        options:
          - Musik
          - ein Interview
          - Sport
      - prompt: Wie wird das Wetter am Nachmittag?
        answers:
          - regnerisch
        options:
          - sonnig
          - regnerisch
          - schneereich
      - prompt: Warum fährt der Bus später?
        answers:
          - wegen einer Baustelle
        options:
          - wegen einer Baustelle
          - wegen Schnee
          - wegen eines Konzerts
      - prompt: Welcher Tag ist kostenlos?
        answers:
          - Mittwoch
        options:
          - Dienstag
          - Mittwoch
          - Donnerstag
      - prompt: Was kann man gewinnen?
        answers:
          - einen Kochkurs
        options:
          - ein Fahrrad
          - einen Kochkurs
          - eine Reise
    situation: Hören Sie jede Meldung einmal. Wählen Sie eine Antwort.
    recordings:
      - text: Sie hören Lernradio Küste. Nach der Musik sprechen wir um sechzehn Uhr mit einer Köchin
          über Essen im Alltag. Die Sportnachrichten hören Sie erst um siebzehn Uhr.
        voice: Rocko
      - text: "Das Lernwetter: Am Vormittag scheint noch die Sonne. Ab vierzehn Uhr regnet es. Nehmen
          Sie für den Nachmittag einen Regenschirm mit."
        voice: Shelley
      - text: "Eine Information für unsere Lernbuslinie: Wegen einer Baustelle kommt der Bus heute zehn
          Minuten später. Die Haltestelle bleibt am gleichen Platz."
        voice: Eddy
      - text: "Unser erfundenes Lernmuseum lädt ein: Am Mittwoch ist der Eintritt kostenlos. Am
          Dienstag und Donnerstag kostet er sieben Euro."
        voice: Sandy
      - text: Jetzt unser Lernradio-Spiel. Heute können Sie einen Kochkurs für zwei Personen gewinnen.
          Rufen Sie uns an und nennen Sie Ihr Lieblingsgericht.
        voice: Rocko
