  letter:
    kind: message
    part: a2-schreiben-2
    title: Teil 2 · Besuch am Wochenende
    text: Schreiben Sie eine persönliche Nachricht.
    situation: Eine Freundin möchte Sie am Wochenende besuchen. Schreiben Sie ihr. Schreiben Sie
      ungefähr 40 Wörter. Wählen Sie drei der vier Punkte. Begrüßung und Gruß nicht vergessen.
    choose: 3
    points:
      - Treffpunkt und Uhrzeit vorschlagen
      - Ein gemeinsames Programm vorschlagen
      - Erklären, was bei Regen möglich ist
      - Sagen, was die Freundin mitbringen soll
  self:
    kind: card
    part: a2-sprechen-1
    title: Teil 1 · Sich vorstellen
    word: Name · Herkunft · Wohnort · Arbeit oder Studium · Sprachen · Freizeit
    situation: Stellen Sie sich vor. Eine andere Person fragt danach nach einem Detail. Antworten
      Sie ohne vorbereiteten Text.
  daily:
    kind: card
    part: a2-sprechen-2
    title: Teil 2 · Ein Alltagsgespräch führen
    word: "Thema: Einkaufen und Essen"
    situation: Sprechen Sie über Ihren Alltag. Stellen Sie Fragen und reagieren Sie auf Antworten.
    roles:
      - title: Person A
        text: "Fragen Sie: Wo kaufen Sie ein? Wann? Was kochen Sie gern? Erzählen Sie dann von Ihren
          eigenen Gewohnheiten."
      - title: Person B
        text: "Antworten Sie. Fragen Sie dann: Was essen Sie gern? Mit wem essen Sie? Was haben Sie
          zuletzt gekauft?"
  plan:
    kind: card
    part: a2-sprechen-3
    title: Teil 3 · Etwas aushandeln
    word: Gemeinsam einen freien Nachmittag planen
    situation: Machen Sie Vorschläge, nennen Sie Ihre Bedingungen und bestätigen Sie am Ende einen
      gemeinsamen Plan.
    roles:
      - title: Person A
        text: "Sie können Samstag ab 14 Uhr oder Sonntag ab 11 Uhr. Budget: höchstens 15 Euro. Sie
          möchten gern draußen sein."
      - title: Person B
        text: "Samstag haben Sie erst ab 16 Uhr Zeit. Sonntag können Sie von 11 bis 15 Uhr. Bei Regen
          möchten Sie ins Museum. Museum: 10 Euro. Spaziergang: kostenlos. Café: 5 Euro."
dialogues:
  team:
    title: Vorbereitung im Lernzentrum
    people:
      N:
        name: Nora
        voice: Shelley
      J:
        name: Jonas
        voice: Eddy
    lines:
      - N: Jonas, wer begrüßt heute die Gäste? Ich kann das am Eingang machen.
        ru: Йонас, кто сегодня встречает гостей? Я могу сделать это у входа.
      - J: Gut, Nora. Ich stelle die Tische auf. Kann Mira die Getränke mitbringen?
        ru: Хорошо, Нора. Я расставлю столы. Мира может принести напитки?
      - N: Ja, sie hat schon Wasser und Saft gekauft. Und wer macht die Fotos?
        ru: Да, она уже купила воду и сок. А кто сделает фотографии?
      - J: Herr Petersen bringt seine Kamera mit und fotografiert uns. Frau Berg zeigt den Gästen die
          neuen Bücher.
        ru: Господин Петерсен принесёт камеру и сфотографирует нас. Госпожа Берг покажет гостям новые
          книги.
      - N: Dann brauchen wir heute keine Musik und keinen Kuchen. Die Gäste möchten vor allem sprechen
          und lesen.
        ru: Значит, сегодня музыка и пирог нам не нужны. Гости хотят прежде всего разговаривать и
          читать.
      - J: Genau. Danke, dann haben wir alle Aufgaben verteilt.
        ru: Именно. Спасибо, теперь мы распределили все задачи.
