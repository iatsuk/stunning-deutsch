    format: notes
    title: Teil 1 · Eine Anmeldung ergänzen
    text: Ihre Bekannte Mira Novak möchte einen Kurs buchen. Sie ist am 14. März 1999 geboren,
      wohnt in Kiel und arbeitet im Hotel. Sie spricht Deutsch und Kroatisch. Sie bucht den
      Fotokurs am Sonntag. Ergänzen Sie die fünf fehlenden Angaben im Formular. Vorname Mira
      ist schon eingetragen.
