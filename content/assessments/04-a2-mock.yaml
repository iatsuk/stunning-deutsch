  article:
    kind: worksheet
    part: a2-lesen-2
    format: article
    title: Teil 2 · Ein neuer Treffpunkt
    text: Seit einem Monat besucht Mira eine Gesprächsgruppe im Lernzentrum. Früher traf sich die
      Gruppe jeden Freitag in einem Café. Dort war es oft zu laut. Jetzt nutzt die Gruppe am
      Donnerstag einen ruhigen Raum. Der Raum kostet nichts, aber Getränke müssen die
      Teilnehmer selbst mitbringen. Mira arbeitet donnerstags bis 17 Uhr. Deshalb beginnt das
      Treffen erst um 18 Uhr. Nächste Woche möchte Nora zum ersten Mal kommen. Sie hat noch
      nicht zugesagt, weil sie ihren Arbeitsplan erst am Montag bekommt.
    questions:
      - prompt: Mira besucht die Gruppe seit einem Monat.
        answers:
          - richtig
        options: &a1
          - richtig
          - falsch
      - prompt: Die Gruppe trifft sich jetzt freitags im Café.
        answers:
          - falsch
        options: *a1
      - prompt: Der neue Raum ist kostenlos.
        answers:
          - richtig
        options: *a1
      - prompt: Das Treffen beginnt vor Miras Arbeitsende.
        answers:
          - falsch
        options: *a1
      - prompt: Noras Teilnahme nächste Woche ist schon bestätigt.
        answers:
          - falsch
        options: *a1
    situation: Lesen Sie den Text. Wählen Sie richtig oder falsch.
  ads:
