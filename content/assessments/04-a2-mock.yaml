      machen; f: Kuchen backen; g: Musik auswählen; h: Tickets verkaufen."
  directory:
    kind: worksheet
    part: a2-lesen-1
    format: directory
    title: Teil 1 · Im Lernzentrum
    text: |-
      Erdgeschoss: Empfang, Fundbüro, Anmeldung, Café.
      Erster Stock: Sprachkurse, Leseraum, Computerraum.
      Zweiter Stock: Musikraum, Werkstatt, Ausstellung.
      Garten: Sitzplätze, Spiele. Dies ist ein erfundener Wegweiser.
