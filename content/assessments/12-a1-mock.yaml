  letter:
    kind: message
    part: schreiben-2
    title: Teil 2 · Eine E-Mail an die Lehrerin
    text: Schreiben Sie eine E-Mail.
    situation: Sie können am Freitag nicht zum Deutschkurs kommen. Schreiben Sie Ihrer Lehrerin, Frau
      Berg. Schreiben Sie etwa 30 Wörter. Schreiben Sie etwas zu allen drei Punkten. Anrede und Gruß
      nicht vergessen.
    points:
      - Warum können Sie nicht kommen?
      - Wann kommen Sie wieder?
      - Bitten Sie um die Hausaufgaben.
    sample:
      - Liebe Frau Berg, ich bin krank und kann am Freitag nicht zum Kurs kommen. Am Montag komme ich
        wieder. Können Sie mir bitte die Hausaufgaben schicken? Viele Grüße, Ihr Marek
  self:
    kind: card
    part: sprechen-1
    title: Teil 1 · Sich vorstellen
    word: Name · Alter · Land · Wohnort · Sprachen · Beruf · Hobby
    situation: Stellen Sie sich vor. Buchstabieren Sie dann Ihren Namen und nennen Sie eine
      Telefonnummer.
  ask:
    kind: card
    part: sprechen-2
    title: Teil 2 · Um Informationen bitten
    word: "Thema: Freizeit"
    situation: Stellen Sie zu jedem Wort eine Frage. Antworten Sie auch auf die Fragen von Ihrem
      Partner oder Ihrer Partnerin.
    roles:
      - title: Person A
        text: "Ihre Wörter: Sport · Wochenende"
      - title: Person B
        text: "Ihre Wörter: Kino · Musik"
  please:
    kind: card
    part: sprechen-3
    title: Teil 3 · Bitten formulieren
    word: Eine Bitte zu jedem Bild
    situation: Bitten Sie Ihren Partner oder Ihre Partnerin zu jedem Bild um etwas. Reagieren Sie auch
      auf die Bitten von der anderen Person.
    roles:
      - title: Person A
        text: "Ihre Bilder: 🪟 · ☕"
      - title: Person B
        text: "Ihre Bilder: 📞 · ✏️"
dialogues:
  bus:
    title: An der Haltestelle
    people:
      F:
        name: Frau
        voice: Sandy
      M:
        name: Mann
        voice: Eddy
    lines:
      - F: Entschuldigung, wann fährt der Bus zum Bahnhof?
        ru: Извините, когда идёт автобус до вокзала?
      - M: Um Viertel nach zehn. Jetzt ist es zehn Uhr.
        ru: В четверть одиннадцатого. Сейчас десять часов.
      - F: Danke! Dann habe ich noch Zeit für einen Kaffee.
        ru: Спасибо! Тогда я ещё успею выпить кофе.
  bread:
    title: In der Bäckerei
    people:
      F:
        name: Frau
        voice: Shelley
      M:
        name: Verkäufer
        voice: Reed
    lines:
      - F: Guten Tag. Was kostet das Brot?
        ru: Добрый день. Сколько стоит хлеб?
      - M: Zwei Euro achtzig.
        ru: Два евро восемьдесят.
      - F: Und ein Brötchen?
        ru: А булочка?
      - M: Fünfzig Cent.
        ru: Пятьдесят центов.
  mobile:
    title: Zu Hause
    people:
      F:
        name: Frau
        voice: Anna
      M:
        name: Mann
        voice: Rocko
    lines:
      - F: Wo ist denn mein Handy? Ich finde es nicht.
        ru: Где же мой телефон? Я его не нахожу.
      - M: Ist es nicht in deiner Tasche?
        ru: Он не в твоей сумке?
      - F: Nein, und auf dem Tisch ist es auch nicht.
        ru: Нет, и на столе его тоже нет.
      - M: Ach, hier! Es liegt im Bad.
        ru: А, вот! Он лежит в ванной.
  cinema:
    title: Am Telefon
    people:
      M:
        name: Mann
        voice: Eddy
      F:
        name: Frau
        voice: Sandy
    lines:
      - M: Hast du am Freitag Zeit? Ich möchte ins Kino gehen.
        ru: У тебя есть время в пятницу? Я хочу пойти в кино.
      - F: Am Freitag arbeite ich. Aber am Samstag kann ich.
        ru: В пятницу я работаю. Но в субботу могу.
      - M: Gut, dann gehen wir am Samstag.
        ru: Хорошо, тогда идём в субботу.
  cafe:
    title: Im Café
    people:
      F:
        name: Kellnerin
        voice: Flo
      M:
        name: Mann
        voice: Grandpa
    lines:
      - F: Was möchten Sie trinken?
        ru: Что вы будете пить?
      - M: Einen Tee, bitte. Haben Sie auch Kuchen?
        ru: Чай, пожалуйста. У вас есть пирог?
      - F: Ja, wir haben Apfelkuchen.
        ru: Да, у нас есть яблочный пирог.
      - M: Nein, danke. Dann nur den Tee.
        ru: Нет, спасибо. Тогда только чай.
  way:
    title: Auf der Straße
    people:
      M:
        name: Mann
        voice: Reed
      F:
        name: Frau
        voice: Anna
    lines:
      - M: Entschuldigung, wie komme ich zum Bahnhof?
        ru: Извините, как мне пройти к вокзалу?
      - F: Gehen Sie hier geradeaus und dann links.
        ru: Идите здесь прямо, а потом налево.
      - M: Ist das weit?
        ru: Это далеко?
      - F: Nein, nur fünf Minuten zu Fuß.
        ru: Нет, всего пять минут пешком.
