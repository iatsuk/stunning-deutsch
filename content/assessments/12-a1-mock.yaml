id: a1-mock
level: a1
mode: mock
title: Авторский пробник Start Deutsch 1
intro: "Новые задания о повседневной жизни в Киле и вокруг него. Это тренировка формата telc
  Deutsch A1: самостоятельная письменная попытка и дополнительный устный разговор. Все
  организации, сообщения и предложения вымышлены, люди не связаны с героями курса."
