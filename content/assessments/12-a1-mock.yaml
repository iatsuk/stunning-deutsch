  notices:
    kind: worksheet
    part: hoeren-2
    format: radio
    title: Teil 2 · Durchsagen
    situation: Hören Sie jede Durchsage einmal. Ist die Aussage richtig oder falsch?
    questions:
      - prompt: Der Zug nach Hamburg kommt heute später.
        answers:
          - richtig
        options:
          - richtig
          - falsch
      - prompt: Ein Kilo Äpfel kostet heute 2,99 Euro.
        answers:
          - falsch
        options:
          - richtig
          - falsch
      - prompt: Die Reisenden nach Wien gehen zum Ausgang B 2.
        answers:
          - falsch
        options:
          - richtig
          - falsch
      - prompt: Das Museum ist morgen ab 9 Uhr offen.
        answers:
          - richtig
        options:
          - richtig
          - falsch
    recordings:
      - text: Achtung, eine Durchsage auf Gleis drei. Der Zug nach Hamburg kommt heute zwanzig Minuten
          später.
        voice: Sandy
      - text: "Liebe Kundinnen und Kunden! Heute im Angebot: ein Kilo Äpfel für nur einen Euro
          neunundneunzig."
        voice: Anna
      - text: Die Reisenden nach Wien gehen bitte sofort zum Ausgang B zwölf. Das Flugzeug fliegt gleich
          ab.
        voice: Sandy
      - text: Liebe Gäste, das Museum schließt in fünfzehn Minuten. Bitte gehen Sie jetzt zum Ausgang.
          Morgen sind wir ab neun Uhr wieder für Sie da.
        voice: Anna
  phone:
    kind: worksheet
    part: hoeren-3
    format: radio
    title: Teil 3 · Nachrichten am Telefon
    situation: Hören Sie jede Nachricht zweimal. Wählen Sie die richtige Antwort.
    questions:
      - prompt: Wann beginnt der Kurs heute?
        answers:
          - um 7 Uhr
        options:
          - um 6 Uhr
          - um 7 Uhr
          - um 8 Uhr
      - prompt: Wann soll Frau Krüger kommen?
        answers:
          - am Donnerstag um 10 Uhr
        options:
          - am Donnerstag um 10 Uhr
          - am Dienstag um 10 Uhr
          - am Donnerstag um 12 Uhr
      - prompt: Wie ist die Telefonnummer?
        answers:
          - 0175 4268
        options:
          - 0157 4268
          - 0175 4286
          - 0175 4268
      - prompt: Wie viel muss Herr Aydin bezahlen?
        answers:
          - 35 Euro
        options:
          - 25 Euro
          - 35 Euro
          - 53 Euro
      - prompt: Was soll Maria machen?
        answers:
          - die Kinder abholen
        options:
          - zur Arbeit gehen
          - zum Arzt gehen
          - die Kinder abholen
    recordings:
      - text: Hallo Tom, hier ist Lena. Unser Deutschkurs beginnt heute nicht um sechs, sondern um
          sieben Uhr. Bis später!
        voice: Shelley
      - text: Guten Tag, Frau Krüger. Hier ist die Praxis Doktor Lorenz. Ihr Termin am Dienstag geht
          leider nicht. Können Sie am Donnerstag um zehn Uhr kommen?
        voice: Sandy
      - text: Hallo, hier ist Papa. Ich bin noch im Supermarkt. Brauchst du etwas? Ruf mich bitte an.
          Meine neue Nummer ist null, eins, sieben, fünf, vier, zwei, sechs, acht.
        voice: Grandpa
      - text: Guten Tag, Herr Aydin. Hier ist das Fahrradgeschäft Nord. Ihr Fahrrad ist fertig. Es
          kostet fünfunddreißig Euro. Wir sind bis achtzehn Uhr da.
        voice: Rocko
      - text: Hallo Maria, hier ist Jan. Ich bin krank und kann heute nicht arbeiten. Kannst du bitte
          die Kinder von der Schule abholen? Danke!
        voice: Eddy
  email:
    kind: worksheet
    part: lesen-1
    format: article
    title: Teil 1 · Eine E-Mail
    situation: Lesen Sie die E-Mail. Ist die Aussage richtig oder falsch?
    text: |-
      Liebe Anna,
      ich habe jetzt eine neue Wohnung in Flensburg. Sie ist klein, aber sehr schön. Am Samstag um 15 Uhr mache ich eine kleine Party. Kommst du auch? Bitte bring einen Salat mit. Getränke habe ich schon.
      Viele Grüße
      Katrin
    questions:
