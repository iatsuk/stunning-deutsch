  write:
    kind: message
    part: b1-schreiben-1
    title: Schreiben · Antwort auf eine persönliche Nachricht
    text: Liebe Mira, wir planen einen gemeinsamen Lerntag im Nachbarschaftshaus. Möglich wäre
      Samstag 10–15 Uhr oder Sonntag 12–17 Uhr. Wir möchten Deutsch in kleinen Gruppen benutzen
      und eine längere gemeinsame Pause machen. Du hattest Interesse. Welcher Termin passt dir,
      und was würdest du gern üben? Ich freue mich auch über eine Idee für die Pause. Schreib
      mir bitte, damit ich weiterplanen kann. Liebe Grüße, Nora
    points:
      - Interesse am Lerntag erklären
      - Einen Termin wählen und die Wahl begründen
      - Einen konkreten Lernwunsch mit Beispiel nennen
      - Eine Idee für die gemeinsame Pause und eine Rückfrage formulieren
    situation: Behandeln Sie alle vier Punkte. Schreiben Sie einen zusammenhängenden Brief mit
      Anrede und Gruß. Die Antwort wird nicht automatisch bewertet.
    sample:
      - Liebe Nora, vielen Dank für deine Nachricht. Ich hätte große Lust, gemeinsam mit euch
        Deutsch zu üben. Ich möchte die Sprache gern in Gesprächen benutzen. Für mich passt
        Sonntag von 12 bis 17 Uhr besser. Am Samstag bin ich vormittags beschäftigt und würde
        einen Teil verpassen. Besonders üben möchte ich, in einem Gespräch freundlich
        nachzufragen. Manchmal verstehe ich die Hauptidee, aber eine wichtige Einzelheit fehlt
        mir noch. Wir könnten uns zum Beispiel gegenseitig kurze Nachrichten erklären. Für die
        Pause schlage ich einen Spaziergang vor. Wenn es regnet, könnten wir im Haus gemeinsam
        essen. Sollen wir etwas mitbringen? Ich freue mich auf deine Antwort. Liebe Grüße Mira
  prepareTopic:
    kind: card
    part: b1-sprechen-2
    title: Vorbereitung · Thema für Teil 2
    theme: Lernen mit anderen
    word: Position wiedergeben · eigene Erfahrung · Austausch
    situation: Lesen Sie Ihre eigene Karte. Notieren Sie bei Bedarf einzelne Schlüsselwörter.
