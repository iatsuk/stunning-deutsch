    title: Lesen 1 · Fünf Texte
    text: >-
      1) In einem Nachbarschaftstreff treffen sich einmal im Monat Menschen mit kaputten
      Alltagsgegenständen. Freiwillige schauen mit den Besuchern nach einer möglichen Lösung.
      Es geht nicht darum, dass alles sofort wieder funktioniert. Die Gäste sollen auch
      verstehen, wie man ein Problem beschreibt und welche Hilfe nötig ist. Eine Anmeldung ist
      für kleine Gegenstände nicht nötig; bei größeren Dingen fragt man vorher nach. Besonders
      beliebt sind die Gespräche zwischen Menschen, die sich sonst selten begegnen.


      2) Ein Lernkreis hat seinen Treffpunkt im Sommer nach draußen verlegt. Einmal in der
      Woche gehen die Teilnehmenden durch ihr Viertel und sprechen über Alltagsthemen. Niemand
      hält einen langen Vortrag. Stattdessen bekommt jede Person eine kleine Frage und sucht
      unterwegs ein Beispiel. Bei Regen trifft sich die Gruppe im Lesecafé. Das Angebot ersetzt
      keinen vollständigen Sprachkurs, hilft den Mitgliedern aber, bekannte Wörter in echten
      Gesprächen zu benutzen.


      3) Für eine kleine Gruppe beginnt der Sonntag mit einer Runde durch den Park. Die
      Teilnehmenden haben sehr unterschiedliche Erfahrungen mit Bewegung. Deshalb wird die
      Strecke so gewählt, dass man sowohl langsam gehen als auch an mehreren Stellen warten
      kann. Ein Wettbewerb ist nicht geplant. Nach der Runde sitzen viele noch zusammen. Für
      einige ist das Gespräch wichtiger als die Länge des Weges. Neue Menschen können ohne
      besonderen Leistungsnachweis mitkommen.


      4) In einer kleinen Firma können Beschäftigte seit diesem Jahr eine Stunde pro Woche für
      eine Weiterbildung nutzen. Die Themen werden vorher mit der Leitung vereinbart. Einige
      lernen ein Computerprogramm, andere üben berufliche Kommunikation. Die Zeit liegt
      innerhalb des Arbeitstags. Ein Mitarbeiter berichtet, dass er dadurch regelmäßiger lernt,
      ohne jeden Abend noch einen Kurs zu besuchen. Welche Angebote im nächsten Jahr
      hinzukommen, ist noch offen; zuerst werden die bisherigen Erfahrungen gesammelt.


      5) Eine Familie sortiert nach einer gemeinsamen Reise ihre Fotos. Dabei merkt sie, dass
      dieselben Bilder sehr verschiedene Erinnerungen auslösen. Die Tochter denkt an ein
      Gespräch im Zug, ihr Vater an den Blick aus dem Fenster. Sie schreiben kurze persönliche
      Texte neben die Bilder, ohne sich auf eine einzige richtige Geschichte einigen zu müssen.
      Unklare Angaben wie Eintrittspreise werden nicht ergänzt. Das Album soll ihre Erfahrungen
      zeigen und keine allgemeine Reisebeschreibung ersetzen.
    situation: Ordnen Sie jedem Text eine Überschrift zu. Jede Überschrift höchstens einmal.
