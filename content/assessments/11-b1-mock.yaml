dialogues:
  weiterbildung:
    title: Eine Weiterbildung neben der Arbeit
    ru: Учёба параллельно работе
    place: Вымышленное экзаменационное интервью
    people:
      I:
        name: Moderator
        voice: Eddy
      L:
        name: Lea
        voice: Shelley
    lines:
      - I: Lea, du hast neben deiner Arbeit eine Weiterbildung besucht. Wie sieht dein normaler
          Arbeitstag aus?
        ru: Леа, ты прошла обучение параллельно работе. Как выглядит твой обычный рабочий день?
      - L: Ich arbeite an fünf Tagen in der Woche im Büro, meistens von acht bis sechzehn Uhr. Danach
          möchte ich nicht jeden Abend noch lernen. Trotzdem wollte ich bei beruflichen
          Gesprächen sicherer werden. Deshalb suchte ich einen Kurs mit überschaubaren
          Aufgaben, die ich direkt im Alltag ausprobieren kann.
        ru: Я работаю в офисе пять дней в неделю, обычно с восьми до шестнадцати. Потом не хочу учиться
          каждый вечер. Но хотела увереннее вести рабочие разговоры. Поэтому искала курс с
          небольшими задачами, которые можно сразу попробовать.
      - I: Hat deine Firma dir den Kurs vorgeschrieben oder kam die Idee von dir selbst?
        ru: Курс назначила фирма или это была твоя идея?
      - L: Die Idee kam von mir. Eine Freundin hatte mir von dem Angebot erzählt. Ich sprach dann mit
          meiner Chefin, weil ich wissen wollte, ob die Zeiten zu meiner Arbeit passen. Sie
          fand die Idee gut, aber sie verlangte keinen bestimmten Kurs. Ich konnte selbst
          entscheiden, ob ich mich anmelde.
        ru: Это была моя идея. Подруга рассказала о предложении. Я спросила начальницу, подходят ли
          часы к работе. Ей понравилась идея, но конкретного курса она не требовала. Решение о
          записи было моим.
      - I: Wann fand der Unterricht statt, und musstest du jedes Mal an denselben Ort fahren?
        ru: Когда проходили занятия и нужно ли было каждый раз ехать в одно место?
      - L: Wir trafen uns montags und mittwochs von neunzehn bis zwanzig Uhr dreißig. Von den acht
          Terminen waren sechs im Kursraum und zwei im Videochat. Es waren also nicht nur
          fertige Videos, die man allein anschaut. Auch online konnten wir Fragen stellen und
          in kleinen Gruppen üben.
        ru: "Мы занимались по понедельникам и средам с девятнадцати до двадцати тридцати. Из восьми
          встреч шесть были в аудитории, две в видеочате. Это были не просто готовые видео:
          можно было задавать вопросы и работать группами."
      - I: Welche Aufgabe hat dir für deinen Beruf besonders geholfen?
        ru: Какое задание особенно помогло тебе в работе?
      - L: Wir übten kurze Nachrichten an Kollegen und Kunden. Vorher schrieb ich oft zu viele
          Einzelheiten und vergaß am Ende die eigentliche Frage. Im Kurs mussten wir zuerst das
          Ziel der Nachricht nennen. Seitdem prüfe ich, ob jemand ohne mein Vorwissen versteht,
          was ich brauche und bis wann ich eine Antwort möchte.
        ru: Мы тренировались писать короткие сообщения коллегам и клиентам. Раньше я писала слишком
          много деталей и забывала главный вопрос. На курсе сначала называли цель. Теперь
          проверяю, понятны ли просьба и срок ответа человеку без моего знания ситуации.
      - I: War es leicht für dich, vor anderen nachzufragen, wenn du etwas nicht verstanden hast?
        ru: Легко ли было спрашивать при других, если ты что-то не поняла?
      - L: Am Anfang nicht. Ich dachte, die anderen hätten alles längst verstanden. Dann merkte ich,
          dass viele ähnliche Fragen hatten. Die Kursleiterin wartete bewusst auf Rückfragen.
          Heute frage ich eher nach einem konkreten Beispiel, statt einfach zu sagen, dass
          alles klar ist. Das hilft auch den anderen in der Gruppe.
        ru: Сначала нет. Я думала, остальные давно всё поняли. Потом заметила похожие вопросы у других.
          Преподавательница ждала уточнений. Теперь прошу конкретный пример, вместо того чтобы
          просто говорить, что всё ясно. Это помогает и другим.
      - I: Wer hat die Kosten übernommen?
        ru: Кто оплатил курс?
      - L: Der Kurs kostete hundertzwanzig Euro. Meine Firma gab vierzig Euro dazu, den Rest bezahlte
          ich selbst. Wichtig war mir, dass ich vorher genau wusste, was enthalten ist. Die
          Materialien waren dabei, zusätzliche Einzelstunden nicht. Ich habe deshalb keine
          weiteren Stunden gebucht, sondern erst mit den Übungen aus der Gruppe gearbeitet.
        ru: "Курс стоил сто двадцать евро. Фирма дала сорок, остальное оплатила я. Я заранее уточнила
          состав цены: материалы включены, индивидуальные занятия нет. Дополнительные часы я не
          брала, сначала занималась упражнениями группы."
      - I: Du hast eine Woche gefehlt. Wie konntest du danach weiterarbeiten?
        ru: Ты пропустила неделю. Как продолжила потом?
      - L: In dieser Woche musste ich länger arbeiten und konnte abends nicht teilnehmen. Eine andere
          Teilnehmerin schickte mir ihre Notizen. Es gab keine vollständige Aufnahme des
          Unterrichts. Ich las zuerst die Beispiele und besprach offene Fragen beim nächsten
          Termin. So brauchte ich nicht zu behaupten, dass ich alles allein sofort nachholen
          kann.
        ru: В ту неделю пришлось работать дольше, и я не могла участвовать вечером. Другая участница
          прислала записи. Полной записи урока не было. Я прочитала примеры и задала оставшиеся
          вопросы на следующей встрече.
      - I: Hast du nach dem Kurs eine neue Aufgabe oder eine andere Stelle bekommen?
        ru: Ты получила после курса новую задачу или другую работу?
      - L: Nein, meine Stelle ist dieselbe geblieben. Ich habe eine Teilnahmebescheinigung bekommen,
          aber daraus folgt keine automatische Beförderung. Für mich war zuerst wichtig, dass
          einige Gespräche und Nachrichten leichter wurden. Meine Chefin möchte später mit mir
          besprechen, wo ich das Gelernte noch einsetzen kann. Das ist noch ein offenes
          Gespräch.
        ru: Нет, работа осталась прежней. Я получила подтверждение участия, но не автоматическое
          повышение. Важно было облегчение разговоров и переписки. Начальница позже хочет
          обсудить, где ещё применить знания; разговор пока впереди.
      - I: Was würdest du jemandem sagen, der einen solchen Kurs neben der Arbeit plant?
        ru: Что бы ты сказала человеку, который планирует такой курс параллельно работе?
      - L: Ich würde die Zeit realistisch prüfen und nach kleinen konkreten Aufgaben fragen. Nicht
          jeder Kurs passt zu jeder Woche. Mir half, dass ich sowohl feste Termine als auch
          Möglichkeiten zum eigenen Üben hatte. Außerdem sollte man rechtzeitig sagen, wenn
          eine Aufgabe zu viel wird. Dann kann die Gruppe gemeinsam eine Lösung suchen.
        ru: "Я бы реалистично проверила время и спросила о небольших конкретных заданиях. Мне помогли
          фиксированные встречи и самостоятельная практика. Также стоит вовремя сказать, если
          задания слишком много: группа сможет поискать решение."
      - I: Ist dein nächster Kurs schon gebucht?
        ru: Следующий курс уже забронирован?
      - L: Noch nicht. Ich interessiere mich für einen Workshop am Samstag. Zuerst muss ich aber meine
          freien Tage klären. Wenn der Termin passt, würde ich mich gern anmelden. Im Moment
          ist das eine Möglichkeit und keine bestätigte Buchung. Ich möchte lieber warten, als
          der Gruppe etwas zu versprechen, das ich nicht halten kann.
        ru: Ещё нет. Мне интересен субботний семинар. Сначала нужно уточнить свободные дни. Если срок
          подойдёт, я хотела бы записаться. Пока это возможность, а не подтверждённая запись.
