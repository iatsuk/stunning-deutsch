  voices:
    kind: worksheet
    part: b1-hoeren-1
    format: article
    title: Hören 1 · Fünf Meinungen zum Lernen
    situation: Lesen Sie die fünf Aussagen. Hören Sie jede Stellungnahme einmal.
    recordings:
      - voice: Anna
        text: Ich lerne lieber jeden Tag eine kurze Zeit als nur einmal am Wochenende sehr lange. Zehn
          Minuten mit einer konkreten Aufgabe schaffe ich auch an einem vollen Tag. Dabei
          möchte ich etwas benutzen, zum Beispiel eine Nachricht verstehen oder eine Frage
          stellen. Wenn ein Tag ausfällt, mache ich am nächsten weiter, ohne den ganzen Plan
          aufzugeben.
      - voice: Reed
        text: Allein fange ich manchmal schnell an, höre aber auch schnell wieder auf. In einer kleinen
          Gruppe bleibe ich eher dabei. Mir hilft besonders, dass ich eine Rückfrage stellen
          kann. Trotzdem möchte ich nicht, dass die anderen alles für mich erledigen. Ich
          versuche zuerst selbst eine Lösung und vergleiche sie danach mit den Ideen der
          Gruppe.
      - voice: Sandy
        text: Online-Angebote passen gut zu meinem wechselnden Alltag. Ich kann einen Teil der Aufgaben
          zu Hause erledigen und spare den Weg. Ganz ohne feste Termine funktioniert es bei mir
          aber nicht. Deshalb habe ich sowohl freie Übungen als auch einen wöchentlichen
          Gesprächstermin. Die Möglichkeit, flexibel zu lernen, ersetzt für mich keine eigene
          Planung.
      - voice: Flo
        text: Ich höre gern kurze Gespräche in der Sprache, die ich lerne. Früher wollte ich jedes Wort
          übersetzen, bevor ich weiterhörte. Jetzt frage ich zuerst nach dem Thema und den
          wichtigen Angaben. Unbekannte Wörter prüfe ich später, wenn sie für die Aufgabe
          wirklich nötig sind. Dadurch merke ich besser, was ich bereits verstehen kann.
      - voice: Grandpa
        text: Beim Sprechen habe ich lange auf den perfekten Satz gewartet. Das half mir wenig, denn
          oft sagte ich dann gar nichts. Heute finde ich eine verständliche Rückmeldung
          wichtiger. Wenn jemand nachfragt, sehe ich genauer, was unklar war. Eine korrigierte
          Form versuche ich danach gleich in einem eigenen Beispiel zu verwenden.
    questions:
