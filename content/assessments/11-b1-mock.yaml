      schon abgeschickt. [[5]] ich am Anfang nervös war, gefiel mir die kleine Gruppe. Ich
      arbeitete [[6]] zwei anderen Teilnehmenden zusammen. Das sind Menschen, mit [[7]] ich
      auch nach dem Kurs üben kann. Nächste Woche [[8]] ich eine kurze Geschichte über meinen
      Alltag erzählen. Ich hoffe, [[9]] wir uns bald sehen. Wir freuen [[10]] auf deinen
