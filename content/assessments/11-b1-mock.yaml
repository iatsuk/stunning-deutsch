  article:
    kind: worksheet
    part: b1-lesen-2
    format: article
    title: Lesen 2 · Lernraum am Platz
    text: >-
      Als ein kleiner Laden im Viertel leer stand, hatte Mira zunächst eine klare Idee: Dort
      sollten regelmäßig große Vorträge stattfinden. Sie fragte die Nachbarn nach Themen. Die
      Antworten überraschten sie. Viele wünschten sich keinen weiteren Ort, an dem man nur
      zuhört. Sie wollten kleine praktische Aufgaben lösen und mit anderen ins Gespräch kommen.
      Deshalb änderte Mira den Plan.


      Heute heißt der Ort Lernraum am Platz. Ein Verein übernahm einen Teil der ersten Miete,
      und Freiwillige brachten Tische und Stühle mit. Für ein dauerhaftes Angebot musste die
      Gruppe trotzdem vorsichtig rechnen. Die Arbeit der Helfer wurde nicht als unbegrenzt
      verfügbar eingeplant. Jede Person nennt im Voraus, wann sie Zeit hat.


      Dienstags am Nachmittag kann man ohne Anmeldung vorbeikommen. Es gibt eine ruhige Ecke
      für eigene Aufgaben und einen Tisch für kurze Fragen. Donnerstags am Abend werden kleine
      Workshops angeboten. Dafür meldet man sich vorher an, weil die Zahl der Plätze begrenzt
      ist. Ein Workshop über digitale Kommunikation war schnell voll. Die Besucher wollten vor
      allem wissen, wie sie eine verständliche Nachricht schreiben und Dateien ordentlich
      benennen können.


      Ein Helfer erzählt von einer Teilnehmerin, die eine E-Mail für einen Kurs schreiben
      wollte. Er schrieb die Nachricht nicht für sie. Gemeinsam ordneten sie die Informationen,
      dann formulierte sie selbst. Am Ende las sie den Text laut und prüfte, ob ihre Fragen
      wirklich verständlich waren. Für Mira zeigt dieses Beispiel, was der Lernraum leisten
      soll: Unterstützung beim eigenen Handeln statt einer fertigen Lösung für jede Person.


      Nicht alles funktionierte sofort. Während manche Besucher in Ruhe lesen wollten,
      diskutierten andere laut. Nach einer Rückmeldung teilte die Gruppe den Raum deutlicher in
      zwei Bereiche. Die neue Ordnung wurde zunächst zwei Wochen ausprobiert. Danach fanden die
      meisten Besucher die Situation angenehmer.


      Für die Zukunft gibt es Ideen: Manche wünschen sich eine Öffnung am Samstag. Das ist aber
      noch nicht beschlossen. Zuerst braucht die Gruppe zusätzliche Helfer, die regelmäßig Zeit
      haben. Mira möchte lieber ein kleines verlässliches Angebot erhalten, als zu viel zu
      versprechen. Interessierte können beim nächsten offenen Nachmittag Fragen stellen und
      eine mögliche Aufgabe kennenlernen.
    questions:
      - prompt: Warum änderte Mira ihren ersten Plan?
        options:
          - Die Nachbarn wollten eher praktisch mitmachen.
          - Es durfte keine Vorträge im Viertel geben.
          - Der Laden war schon wieder vermietet.
        answers:
          - Die Nachbarn wollten eher praktisch mitmachen.
      - prompt: Wie wurde der Anfang möglich?
        options:
          - Alle Helfer mussten jeden Tag da sein.
          - Ein Verein half bei der Miete, Freiwillige brachten Möbel.
          - Die Stadt versprach unbegrenztes Geld.
        answers:
          - Ein Verein half bei der Miete, Freiwillige brachten Möbel.
      - prompt: Wann ist eine Anmeldung nötig?
        options:
          - Für jeden offenen Dienstag
          - Nur für eine Frage am Tisch
          - Für die kleinen Workshops am Donnerstag
        answers:
          - Für die kleinen Workshops am Donnerstag
      - prompt: Wie half der Helfer beim Schreiben der E-Mail?
        options:
          - Er unterstützte die Planung, die Teilnehmerin schrieb selbst.
          - Er schrieb und verschickte alles ohne die Teilnehmerin.
          - Er gab nur eine fertige Nachricht zum Kopieren.
        answers:
          - Er unterstützte die Planung, die Teilnehmerin schrieb selbst.
      - prompt: Was gilt für die gewünschte Samstagsöffnung?
        options:
          - Sie ersetzt alle bisherigen Öffnungstage.
          - Sie hängt noch von zusätzlichen Helfern ab.
          - Sie ist ab nächster Woche fest beschlossen.
        answers:
          - Sie hängt noch von zusätzlichen Helfern ab.
  ads:
    kind: worksheet
    part: b1-lesen-3
    format: matching
    uniqueOptions: true
    reusableOptions:
      - x
    title: Lesen 3 · Zehn Situationen
    text: >-
      a) Deutsch nach der Arbeit. Dienstag und Donnerstag 18:30–20 Uhr, kleine Gruppe für
      Alltagsgespräche. Monatsbeitrag 60 Euro. Unterricht vor Ort, keine Online-Teilnahme.


      b) Computerhilfe am Montag.10–12 Uhr werden einzelne Fragen am eigenen Laptop besprochen.
      Für Anfänger geeignet. Keine Programmierkurse und kein Verkauf von Geräten.


      c) Ruhig lernen in der Bibliothek. Sonntag 14–17 Uhr ist ein Arbeitsraum kostenlos
      geöffnet. Bitte leise arbeiten. Es gibt dort keinen Unterricht und keine Kinderbetreuung.


      d) Gemeinsam vegetarisch kochen. Freitag 18 Uhr, 18 Euro einschließlich Zutaten. Alle
      arbeiten mit. Bitte vorher anmelden; nur Essen abholen ist nicht möglich.


      e) Familienbilder im Viertel. Eine Fotoausstellung am Samstag zeigt Alltagserinnerungen
      verschiedener Familien. Kinder können mit ihren Eltern kommen. Die Eltern bleiben während
      des Besuchs dabei.


      f) Schreibwerkstatt am Samstag.10–12 Uhr, höchstens sechs Personen. Wir üben persönliche
      Briefe und E-Mails. Keine amtliche Übersetzung und keine Beratung zu Formularen.


      g) Fahrradtag am Sonntag.11–14 Uhr werden Fahrräder gemeinsam geprüft. Freiwillige
      erklären die Arbeitsschritte. Kein Autoservice. Bei größeren Problemen ist eine spätere
      Werkstatt nötig.


      h) Geschichten von der Küste. Mittwoch 19 Uhr, Vortrag mit Bildern, Eintritt 8 Euro. Die
      Veranstaltung findet im Saal statt. Es gibt keinen Spaziergang und keine Bootsfahrt.


      i) Deutsch beim Spaziergang. Sonntag 10–11:30 Uhr, kostenlos. Wir gehen im Viertel und
      sprechen in kleinen Gruppen. Vor Ort, keine digitale Übertragung. Bei Regen wird der
      Treffpunkt rechtzeitig bekannt gegeben.


      j) Online ins Gespräch kommen. Montag 20–21 Uhr. Menschen aus verschiedenen Städten üben
      Deutsch von zu Hause aus. Ein Computer oder Handy mit Internet ist nötig.


      k) Eine Kamera fürs Wochenende. Abholung Freitag, Rückgabe Montag. Leihpreis 35 Euro,
      zusätzlich 100 Euro Pfand. Nur Verleih, keine Reparatur eigener Kameras.


      l) Theater für Erwachsene. Samstag 15 Uhr, gemeinsame Leseprobe. Anfänger sind
      willkommen. Keine Betreuung für kleine Kinder.


      x) Kein passendes Angebot. Alle Anzeigen beschreiben erfundene Prüfungsbedingungen.
