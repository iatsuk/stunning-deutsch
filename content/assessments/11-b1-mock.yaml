      - voice: Sandy
        text: "Eine Nachricht für die Teilnehmenden des Abendkurses: Wir treffen uns heute in Raum
          hundertacht statt in Raum zweihundertzehn. Der Beginn bleibt um achtzehn Uhr dreißig.
