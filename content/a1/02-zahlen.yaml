id: zahlen
order: 2
title: Wie schreibt man das?
ru: Числа, алфавит, телефон
lede: >-
  Анна записывается на экзамен по телефону: называет фамилию по буквам,
  диктует номер — и выясняет, что немцы читают числа задом наперёд. А в
  перерыве у Марко день рождения, и оказывается, что возраст по-немецки не
  «имеют».
goals:
  - Считать от 0 до 1000 и понимать числа на слух
  - Назвать по буквам имя и фамилию и переспросить, если не расслышали
  - Продиктовать номер телефона и записать чужой без ошибок
  - Спросить «у тебя есть …?» с глаголом *haben* и ответить *ja* или *nein*
  - Назвать свой возраст и спросить чужой
grammar:
  - Числа 0–1000
  - Глагол haben
  - Вопросы да/нет и ответы ja/nein
  - Алфавит и спеллинг
exam: [sprechen-1, hoeren-3, schreiben-1]

dialogues:
  anruf:
    title: Anmeldung am Telefon
    ru: Запись по телефону
    place: Sprachschule, Leipzig
    people:
      A: { name: Anna, voice: Anna }
      W: { name: Frau Weber, voice: Sandy }
    lines:
      - W: Sprachschule Leipzig, Weber, guten Tag!
        ru: Языковая школа Лейпцига, Вебер, добрый день!
      - A: Guten Tag, hier ist Anna Nowak. Ich möchte die A1-Prüfung machen.
        ru: Добрый день, это Анна Новак. Я хотела бы сдать экзамен A1.
      - W: Gern. Nowak – wie schreibt man das?
        ru: Хорошо. Новак — как это пишется?
      - A: N – O – W – A – K. W wie Wilhelm.
        ru: Эн — о — вэ — а — ка. «Вэ», как Вильгельм.
      - W: Danke. Und Ihre Telefonnummer, bitte?
        ru: Спасибо. А ваш номер телефона?
      - A: Null eins sieben sechs – dreiundzwanzig – fünfundvierzig – einundachtzig.
        ru: 0176 — 23 — 45 — 81.
      - W: Null eins sieben sechs – zweiunddreißig …?
        ru: 0176 — 32…?
      - A: Nein, dreiundzwanzig! Zwei – drei.
        ru: Нет, двадцать три! Два — три.
      - W: Ah, dreiundzwanzig! Danke, Frau Nowak. Auf Wiederhören!
        ru: А, двадцать три! Спасибо, госпожа Новак. До свидания!
      - A: Auf Wiederhören!
        ru: До свидания!
  geburtstag:
    title: Alles Gute, Marco!
    ru: С днём рождения, Марко!
    place: Sprachschule, Raum 214
    people:
      A: { name: Anna, voice: Anna }
      M: { name: Marco, voice: Reed }
      S: { name: Herr Schulz, voice: Eddy }
    lines:
      - A: Marco, hast du heute Geburtstag?
        ru: Марко, у тебя сегодня день рождения?
      - M: Ja! Ich habe heute achtundzwanzig Jahre.
        ru: Да! Я «имею» сегодня двадцать восемь лет.
      - A: "Alles Gute! Aber auf Deutsch sagt man: Ich bin achtundzwanzig."
        ru: "Поздравляю! Но по-немецки говорят: «Я — двадцать восемь»."
      - M: Ach so! Ich bin achtundzwanzig Jahre alt. Und du? Bist du auch achtundzwanzig?
        ru: Ах вот как! Мне двадцать восемь лет. А тебе? Тебе тоже двадцать восемь?
      - A: Nein, ich bin fünfundzwanzig.
        ru: Нет, мне двадцать пять.
      - M: Ich habe Kuchen für alle! Habt ihr Zeit?
        ru: У меня торт для всех! У вас есть время?
      - A: Ja, klar! Wir haben jetzt Pause.
        ru: Да, конечно! У нас сейчас перерыв.
      - M: Und Herr Schulz? Hat er auch Zeit?
        ru: А господин Шульц? У него тоже есть время?
      - A: Herr Schulz, haben Sie Zeit? Marco hat Geburtstag!
        ru: Господин Шульц, у вас есть время? У Марко день рождения!
      - S: Ja, natürlich! Alles Gute, Marco!
        ru: Да, конечно! Поздравляю, Марко!

