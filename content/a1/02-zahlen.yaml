        по буквам. Послушайте запись и соберите надпись. Две одинаковые буквы
        тоже нужно поставить на свои места.
      clue: { dialogue: am-steg, lines: [5] }
      label: Название на бирке
      tokens: [S, P, R, O, T, T, E]
