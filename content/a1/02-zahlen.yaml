      wrong: >-
        Матео перечислил два продукта после *wir haben*. Переслушайте и
        уберите лишнее или добавьте недостающее. Торт был в школе, не у лодки.

spy:
  - de: Ich bin achtundzwanzig.
    wrong: Ich habe achtundzwanzig.
    why: "Возраст — с *sein*: *Ich bin 28*. *Ich habe 28* — калька с испанского *tengo 28 años*."
  - de: Wie alt bist du?
    wrong: Wie alt hast du?
    why: "О возрасте спрашивают с *sein*: *Wie alt bist du?*"
  - de: Du hast heute Geburtstag.
    wrong: Du habst heute Geburtstag.
    why: "У *haben* во втором лице выпадает *b*: *du hast*."
  - de: Mateo hat Kuchen für alle.
    wrong: Mateo habt Kuchen für alle.
    why: "*er hat* — без *b* и с окончанием *-t*. *habt* — это форма для *ihr*."
  - de: Der Kurs ist in Raum einundzwanzig.
    wrong: Der Kurs ist in Raum zwanzigeins.
    why: "В немецком сначала единицы: *einundzwanzig* — «один-и-двадцать»."
  - de: Elif wohnt in der Holtenauer Straße sechzehn.
    wrong: Elif wohnt in der Holtenauer Straße sechszehn.
    why: "В *sechzehn* шестёрка теряет *s*."
  - de: Das sind dreißig Euro.
    wrong: Das sind dreizig Euro.
    why: "30 — единственный десяток на *-ßig*: *dreißig*."
  - de: Haben Sie Fragen?
    wrong: Habt Sie Fragen?
    why: "Вежливое *Sie* спрягается как «они»: *Sie haben*."

exercises:
  - type: choice
    q: Как по-немецки 21?
    options: [zwanzigeins, einundzwanzig, einszwanzig]
    answer: 1
    why: "Сначала единицы, потом *und* и десятки: *ein-und-zwanzig*."
  - type: choice
    q: Как по-немецки 16?
    options: [sechszehn, sechzehn, sechzig]
    answer: 1
    why: "В *sechzehn* шестёрка теряет *s*. А *sechzig* — это 60."
  - type: choice
    q: Фрау Петерсен говорит *achtundneunzig*. Какое это число?
    options: ["89", "98", "980"]
    answer: 1
    why: "*acht* — 8, *neunzig* — 90. Единицы звучат первыми: 98."
  - type: gap
    q: Zehn plus zwanzig ist ___.
    answer: [dreißig]
    ru: Десять плюс двадцать — тридцать.
    why: "30 — единственный десяток на *-ßig*: *dreißig*."
  - type: gap
    q: Vierzig plus sieben ist ___.
    answer: [siebenundvierzig]
    ru: Сорок плюс семь — сорок семь.
    why: "Сначала единицы, потом десятки, всё одним словом: *sieben-und-vierzig*."
  - type: choice
    q: Как называется буква *V*?
    options: [We, Vau, Ve]
    answer: 1
    why: "*V* — *Vau* («фау»), а *We* — это буква *W*."
  - type: choice
    q: Дана диктует *Vau – I – E – Er*. Какое слово получилось?
    options: [wier, vier, fier]
    answer: 1
    why: "*Vau* — буква *V*, *I* и *E* — сочетание *ie*. Получилось *vier* — «четыре»."
  - type: choice
    q: Вы не расслышали номер. Что сказать?
    options: ["Noch einmal, bitte.", "Auf Wiederhören!", "Alles Gute!"]
    answer: 0
  - type: gap
    q: Ich ___ heute Geburtstag.
    answer: [habe]
    hint: haben
  - type: gap
    q: ___ du Zeit?
    answer: [Hast]
    hint: haben
    why: "*du hast* — без *b*. В вопросе да/нет глагол стоит первым."
  - type: gap
    q: Mateo ___ Kuchen für alle.
    answer: [hat]
    hint: haben
    why: "*er hat* — тоже без *b*."
  - type: choice
    q: Wie alt ___ du?
    options: [hast, bist, bin]
    answer: 1
    why: "Возраст — с *sein*: *Wie alt bist du?*"
  - type: choice
    q: Ich ___ einunddreißig Jahre alt.
    options: [habe, bin, ist]
    answer: 1
    why: "Не *Ich habe … Jahre*: возраст по-немецки «есть», а не «имеют»."
  - type: order
    ru: У тебя сегодня день рождения?
    de: Hast du heute Geburtstag?
    why: "Вопрос да/нет: глагол на первом месте, *du* — сразу за ним."
  - type: order
    ru: У Вас есть вопросы?
    de: Haben Sie Fragen?
  - type: order
    ru: Мне двадцать восемь лет.
    also: ["Achtundzwanzig Jahre alt bin ich."]
    de: Ich bin achtundzwanzig Jahre alt.
  - type: choice
    q: Йенсен сказал *zweiunddreißig*. Где искать лодку?
    options: [Liegeplatz 23, Liegeplatz 32, Liegeplatz 302]
    answer: 1
    why: "*zwei* + *dreißig* — 2 и 30, то есть 32. Если сомневаетесь, уточните цифры."
  - type: gap
    q: Wir ___ Wasser und Brot.
    answer: [haben]
    hint: haben
    ru: У нас есть вода и хлеб.
    why: "Повторяем *wir haben* в новой ситуации: правило то же, что в *Wir haben Pause*."
  - type: order
    ru: Как называется лодка?
    de: Wie heißt das Boot?
    why: "Повторение темы 1: W-вопрос, затем *heißt*, затем *das Boot*."
  - type: choice
    q: Где ударение в *buchstabieren*?
    options: [buch·sta·BIE·ren, BUCH·sta·bie·ren]
    answer: 0
    why: "Глаголы на *-ieren* всегда ударны на *-ie-*, как *reservieren* и *fotografieren* в следующих темах."
  - type: choice
    q: Где ударение в *der Geburtstag*?
    options: [ge·BURTS·tag, GE·burts·tag]
    answer: 0
    why: "Приставка *ge-* безударна: ударение переходит на корень *Geburt*."
  - type: choice
    q: Как звучит *die Adresse*?
    options: [a·DRES·se, A·dres·se]
    answer: 0
    why: "Не как русское «а́дрес»: по-немецки ударен второй слог."
