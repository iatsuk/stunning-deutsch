steps:
  - id: anruf
    chapter: scene
    title: Звонок в школу
    beats:
      - read: >-
          Дана хочет сдать экзамен A1 и звонит в языковую школу. Трубку в
          Германии берут не со словом «алло», а с названием и фамилией, а в
          Киле — ещё и с *Moin*: *Moin, Sprachschule Förde, Petersen!*
          Звонящий тоже представляется по-особому — не *Ich bin …*, а *Hier
          ist …*, буквально «здесь …»: *Hier ist Dana Ospanowa*. Просьбу Дана
          начинает с готовой фразы *Ich möchte …* — «я хотела бы …».
        point: "По телефону: *Hier ist Dana Ospanowa.* — «Это Дана Оспанова»"
        set: { view: dialogue, dialogue: anruf, reveal: 2 }
      - read: >-
          Фамилию Оспанова немецкое ухо не узнаёт, поэтому звучит главный
          вопрос любого звонка: *Wie schreibt man das?* — «как это пишется?».
          Дана диктует по буквам: *O – S – P – A – N – O – W – A*. По-немецки
          её фамилия пишется через *W*: русское «в» немцы передают именно
          так. Для верности Дана добавляет *W wie Wilhelm*: немцы уточняют
          букву словом, которое с неё начинается.
        point: "*Wie schreibt man das?* — «Как это пишется?»; *W wie Wilhelm* — уточнить букву"
        set: { reveal: 4, focus: [2, 3] }
      - read: >-
          Теперь номер. Код *0176* Дана называет по цифрам, а остальное —
          парами: *dreiundzwanzig*, *fünfundvierzig*, *einundachtzig*. И фрау
          Петерсен тут же ошибается: вместо 23 слышит 32. Это не рассеянность.
          В немецком сначала звучат единицы, потом десятки: *drei-und-zwanzig*
          — «три-и-двадцать». На этом путаются даже сами немцы, особенно по
          телефону.
        point: "*dreiundzwanzig* = 23: сначала единицы, потом десятки"
        set: { reveal: 7, focus: [5, 6] }
      - read: >-
          Дана выручает себя простым приёмом: *Nein, dreiundzwanzig! Zwei –
          drei.* Если число не поняли, назовите его по цифрам — так ошибиться
          невозможно. А прощаются по телефону не *Auf Wiedersehen*, а *Auf
          Wiederhören*: *sehen* — «видеть», *hören* — «слышать». Собеседника
          не видно, поэтому и прощание — «до нового слышания».
        point: "*Auf Wiederhören!* — «до свидания» по телефону"
        set: { reveal: 10, focus: [7, 8, 9] }

  - id: geburtstag
    chapter: scene
    title: Двадцать восемь лет
    beats:
      - read: >-
          Перерыв в аудитории 214. Дана узнаёт, что у Матео день рождения:
          *Hast du heute Geburtstag?* Матео отвечает так, как сказал бы
          по-испански — *tengo veintiocho años*: *Ich habe achtundzwanzig
          Jahre*. Но по-немецки годы не «имеют»: возраст «есть» — *Ich bin
          achtundzwanzig*. Дана поправляет, и Матео строит полную фразу: *Ich
          bin achtundzwanzig Jahre alt*.
        point: "Возраст — с *sein*: *Ich bin 28 Jahre alt*, а не *Ich habe 28 Jahre*"
        set: { view: dialogue, dialogue: geburtstag, reveal: 4, focus: [0, 1, 2, 3] }
      - read: >-
          На вопрос *Bist du auch achtundzwanzig?* Дана отвечает *Nein* — и
          сразу называет своё число: *einunddreißig*. Дальше *haben* звучит
          почти в каждой реплике: *Ich habe Kuchen*, *Habt ihr Zeit?*, *Wir
          haben Pause*, *Hat sie Zeit?* А к преподавательнице, фрау Томсен, —
          на *Sie*: *Haben Sie Zeit?* Где по-русски «у меня есть» или «у нас
          перерыв», немец говорит «я имею», «мы имеем».
        point: "«У меня есть …» — *Ich habe …*: *Ich habe Zeit*, *Wir haben Pause*"
        set: { reveal: 10, focus: [3, 4, 5, 6, 7, 8] }

  - id: wieder-am-wasser
    chapter: scene
    title: Вспомните знакомство — найдите лодку
    beats:
      - read: >-
          Сначала, не открывая прошлую тему, представьтесь Йенсену: имя,
          откуда вы и где живёте. Теперь послушайте Матео. Он ищет ту же
          «Шпротту», но *Liegeplatz* — «место у причала» — получает номер.
          Какой номер называет Йенсен? Запишите цифры до следующего фрагмента.
          Это та же задача, что с номером аудитории или дома: морская
          обстановка меняется, навык остаётся.
        point: "*Liegeplatz* — место у причала; ловим номер, как номер аудитории"
        set: { view: dialogue, dialogue: am-steg, reveal: 2, focus: [0, 1] }
      - read: >-
          Йенсен сказал 32 — *zweiunddreißig*. Матео услышал 23 и
          переспросил: это полезная стратегия, а не провал. После уточнения
          *Drei – zwei* путаница исчезает. Дальше название лодки по буквам
          и знакомое *haben*: *Habt ihr Wasser?* — *Wir haben Wasser und
          Brot*. *Viel Spaß!* — готовое пожелание «хорошо провести время».
          Потренируйтесь отвечать за Матео, прежде чем включать его реплику.
        point: "Не уверены в числе — повторите его и попросите назвать цифры"
        set: { reveal: 8, focus: [1, 2, 3, 4, 5, 6, 7] }

  - id: null-bis-zwoelf
    chapter: words
    title: От нуля до двенадцати
    beats:
      - read: >-
          Первые двенадцать чисел надо просто выучить — дальше всё
          собирается из них, как из конструктора. Следите за произношением:
          *sechs* — «зекс», *sieben* — «зибен», *neun* — «нойн», а *zehn*
          начинается со звука «ц». По телефону вместо *zwei* часто говорят
          *zwo*, чтобы не спутать с *drei*. И не пугайтесь *elf* — это не
          эльф, а одиннадцать.
        point: "0–12 учим наизусть; по телефону *zwo* вместо *zwei*"
        set: { view: words, words: zahlen }

  - id: telefon
    chapter: words
    title: Телефон и адрес
    beats:
      - read: >-
          Слова для звонков и анкет. Все «номера» женского рода, как и сама
          *die Nummer*: *die Telefonnummer*, *die Handynummer*, *die
          Hausnummer*. Мобильный — *das Handy*: слово выглядит английским, но
          в Англии его не поймут. Индекс центра Киля — *24103*, код города —
          *0431*. И три фразы, которые спасают любой разговор: *Wie bitte?*,
          *Noch einmal, bitte.* и *Langsam, bitte.*
        point: "Переспросить: *Wie bitte?* *Noch einmal, bitte.* *Langsam, bitte.*"
        set: { view: words, words: telefon }

  - id: kurs
    chapter: words
    title: Что у кого есть
    beats:
      - read: >-
          После *haben* слово часто идёт без артикля: *Ich habe Zeit*, *Wir
          haben Pause*, *Ich habe heute Geburtstag*. Так говорят о времени,
          перерыве, празднике — о том, что не считают поштучно. А для
          возраста — снова *sein*: *Wie alt bist du?* Слово *Jahre* в ответе
          можно опустить: *Ich bin einunddreißig* — так тоже правильно и
          даже привычнее.
        point: "*Ich habe Zeit*, *Wir haben Pause* — без артикля"
        set: { view: words, words: kurs }

  - id: proviant
    chapter: words
    title: Вода и хлеб — тоже яхтинг
    beats:
      - read: >-
          Прогулка под парусом начинается с обычных вещей: найти место,
          сверить номер, взять воду и хлеб. *Wasser* здесь не считают
          поштучно; у *Brot* форма *Brote* нужна, когда речь о целых буханках
          или видах хлеба. Сейчас достаточно *Wir haben Wasser und Brot*.
          Как заказать еду в кафе, купить продукты и назвать количество,
          разберём в темах о еде и покупках. Новые слова не требуют заранее
          учить винительный падеж.
        point: "*Habt ihr Wasser?* — *Ja, wir haben Wasser und Brot.*"
        set: { view: words, words: proviant }

  - id: zehner
    chapter: grammar
    title: Числа задом наперёд
    beats:
      - read: >-
          С 13 до 19 числа собираются почти как в русском: единица плюс
          *zehn* — *dreizehn*, «три-надцать». Десятки получают *-zig*, как
          наше «-дцать»: *vierzig*, *achtzig*. Ловушек немного, но они
          коварные. *Sechs* и *sieben* укорачиваются: *sechzehn*, *siebzehn*,
          *sechzig*, *siebzig*. Двадцать — *zwanzig*, а не *zweizig*. А
          *dreißig* пишется с *ß* — единственный десяток без *z*.
        point: "13–19: единица + *zehn*, десятки — *-zig*; но *sechzehn*, *siebzig*, *zwanzig*, *dreißig*"
        set: { view: table, table: zehn, focus: [0, 2, 3, 4, 5, 6, 7] }
      - read: >-
          Теперь главная странность. С 21 до 99 немец называет сначала
          единицы, потом десятки, а между ними ставит *und*: *einundzwanzig* —
          «один-и-двадцать». Записывая число на слух, не спешите: услышали
          *drei* — оставьте место слева, услышали *zwanzig* — впишите туда 2.
          И заметьте: в *siebenundsechzig* семёрка полная, укорачивается
          только десяток.
        point: "21–99: единицы + *und* + десятки: *einundzwanzig*, *siebenundsechzig*"
        set: { view: table, table: zwanzig, reveal: 5 }
      - read: >-
          Сотни устроены привычно: *hundert*, *zweihundert*, *dreihundert*, а
          за ними — двузначное число по тому же правилу. 345 —
          *dreihundertfünfundvierzig*: «триста-пять-и-сорок». Пишется всё
          одним словом, каким бы длинным оно ни получилось. 1000 — *tausend*
          или *eintausend*. Номера аудиторий и домов так и читают: *Raum
          zweihundertvierzehn*. А телефонный номер целиком так не называют —
          его диктуют по цифрам или парами.
        point: "Сотни — как в русском, внутри снова сначала единицы; всё одним словом"
        set: { reveal: 9, focus: [5, 6, 7, 8] }

  - id: alphabet
    chapter: grammar
    title: Буквы под другими именами
    beats:
      - read: >-
          Латинские буквы вы знаете, но имена у многих из них в немецком
          свои. Главная ловушка — привычка из английского: *E* по-немецки
          «э», а не «и», *I* — «и», а не «ай». Поэтому фамилию *Petersen*
          диктуют так: «пэ — э — тэ — э — эр — эс — э — эн». *C* называют
          «цэ», *H* — «ха». Слушайте, как произносит буквы собеседник, и
          повторяйте за ним.
        point: "*E* — «э», *I* — «и», *C* — «цэ», *H* — «ха»"
        set: { view: table, table: alphabet, focus: [0, 1, 2, 3] }
      - read: >-
          Ещё пять имён стоит выучить: *J* — «йот», *V* — «фау», *W* — «вэ»,
          *Y* — «ипсилон», *Z* — «цэт». Буквы с точками называют по звуку или
          *A-Umlaut*, *O-Umlaut*, *U-Umlaut*, а *ß* — *Eszett*. Двойную букву
          диктуют со словом *Doppel*: набережная *Kiellinie* — *K – I – E –
          Doppel-L – I – N – I – E*. Если на
          клавиатуре нет *ß* или умлаута, пишут *ss*, *ae*, *oe*, *ue*.
        point: "*J* — «йот», *V* — «фау», *W* — «вэ», *Z* — «цэт»; две *l* — *Doppel-L*"
        set: { focus: [4, 5, 6, 7, 8, 9, 10] }

  - id: betonung
    chapter: grammar
    title: Ударение не на первом слоге
    beats:
      - read: >-
          В теме 1 ударение падало на первый слог корня. В этой теме есть слова, где правило
          не работает. Глаголы на *-ieren* всегда ударны на *-ie-*: *buchstabieren* —
          *buch·sta·BIE·ren*, хотя *der Buchstabe* ударен в начале. Приставка *ge-* никогда не
          бывает ударной, ударение переходит на корень: *der Geburtstag* — *ge·BURTS·tag*.
        point: "*-ieren* всегда ударно: *buch·sta·BIE·ren*; *ge-* безударна: *ge·BURTS·tag*"
        set: { view: table, table: betonung, reveal: 2 }
      - read: >-
          *die Adresse* ударна на втором слоге — не как русское «а́дрес». А сокращения, которые
          читают по буквам, ударны на последней букве: *die USA* — *u·es·A*. Названия букв вы
          уже знаете из алфавита, теперь осталось сделать громче последнюю.
        point: "*a·DRES·se*; сокращение по буквам ударно в конце: *u·es·A*"
        set: { reveal: 4, focus: [2, 3] }

  - id: haben
    chapter: grammar
    title: Глагол *haben*
    beats:
      - read: >-
          *haben* — «иметь» — второй после *sein* глагол, без которого не
          обходится ни один разговор. Он почти правильный, но во втором и
          третьем лице теряет *b*: *ich habe*, но *du hast* и *er hat*. Не
          *du habst* и не *er habt*. Окончания при этом обычные: *-e*, *-st*,
          *-t* — те же, что у *wohnen*.
        point: "*ich habe*, но *du hast*, *er hat* — без *b*"
        set: { view: table, table: haben, reveal: 3 }
      - read: >-
          Во множественном числе *haben* ведёт себя как правильный глагол:
          *wir haben*, *ihr habt*, *sie haben*. Важнее другое. По-русски
          обладатель прячется в «у меня», «у нас». В немецком он подлежащее,
          как в английском I have: *Wir haben Pause* — «у нас перерыв»,
          *Mateo hat Geburtstag* — «у Матео день рождения». Отдельного «у
          меня» в немецком нет — ищите *haben*.
        point: "«У нас перерыв» — *Wir haben Pause*: обладатель — подлежащее"
        set: { reveal: 6, focus: [2, 3, 4, 5] }

  - id: ja-nein
    chapter: grammar
    title: Да или нет
    beats:
      - read: >-
          Вопрос без вопросительного слова вы видели в первой теме — теперь
          разберём его подробнее. Возьмём утверждение: *Du hast heute
          Geburtstag.* Подлежащее *du* стоит на первой позиции, глагол — на
          второй. В русском утверждение превращается в вопрос одной
          интонацией: «У тебя сегодня день рождения?» В немецком этого мало —
          нужно переставить слова.
        point: "Утверждение: *Du hast heute Geburtstag.* — подлежащее, потом глагол"
        set:
          view: sentence
          rows:
            - de: [Du, ha+st, heute Geburtstag., ""]
              ru: У тебя сегодня день рождения.
      - read: >-
          Глагол встаёт в начало, первая позиция пустеет, *du* уходит в
          середину: *Hast du heute Geburtstag?* Отвечают *Ja* или *Nein*, а
          если хочется полнее — после запятой идёт обычное предложение: *Ja,
          ich habe heute Geburtstag.* *Ja* и *nein* стоят вне схемы и места
          не занимают. Поэтому глагол после них не прыгает вперёд: *Nein, ich
          bin einunddreißig*.
        point: "*Ja* / *Nein* + запятая + обычный порядок: *Nein, ich bin 31.*"
        set:
          rows:
            - de: ["", Ha+st, du heute Geburtstag?, ""]
              ru: У тебя сегодня день рождения?
            - de: [Ich, hab+e, heute Geburtstag., ""]
              ru: Да, у меня сегодня день рождения.
      - read: >-
          Теперь — как спросить о возрасте. На первую позицию встаёт *Wie
          alt* — два слова, одна позиция: *Wie alt bist du?* Вежливо — *Wie
          alt sind Sie?*, но незнакомых взрослых об этом в Германии обычно не
          спрашивают. Отвечают с *sein*, а не с *haben*, как Матео: *Ich bin
          achtundzwanzig Jahre alt*. *Jahre alt* можно опустить, глагол —
          нельзя.
        point: "*Wie alt bist du?* — *Ich bin 28 (Jahre alt).* С *sein*, не с *haben*"
        set:
          rows:
            - de: [Wie alt, bist, du?, ""]
              ru: Сколько тебе лет?
            - de: [Ich, bin, achtundzwanzig Jahre alt., ""]
              ru: Мне двадцать восемь лет.

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Фрау Петерсен слышит *zweiunddreißig*. Какое число она записывает?
        read: >-
          32. *zwei* — двойка, *dreißig* — тридцать, но звучат они в обратном
          порядке. Дана сказала *dreiundzwanzig* — 23: те же цифры, только
          наоборот. Такие пары — 23 и 32, 45 и 54 — главный источник ошибок в
          аудировании. Записывайте сначала единицы справа и только потом
          десяток слева. Через неделю тренировки рука начнёт делать это
          сама.
        point: "*zweiunddreißig* = 32, *dreiundzwanzig* = 23"
        set: { view: table, table: zwanzig, focus: [1, 2] }
      - question: Как продиктовать по буквам фамилию *Müller*?
        read: >-
          *M – Ü – Doppel-L – E – R.* Букву *Ü* называют по звуку — «ю» с
          вытянутыми губами — или *U-Umlaut*. Две *l* подряд — *Doppel-L*:
          так короче и понятнее, чем «эль, эль». И не забудьте, что *E* — это
          «э». Если вас переспросят *Mit U-Umlaut?*, ответ — *Ja, mit Ü*. А
          если умлаута на клавиатуре нет, фамилию пишут *Mueller*.
        point: "*Müller*: *M – Ü – Doppel-L – E – R*"
        set: { view: table, table: alphabet, focus: [1, 9] }
      - question: Как спросить Матео, есть ли у него время?
        read: >-
          *Hast du Zeit?* Это вопрос да/нет, поэтому глагол — на первом месте,
          а *du* — сразу за ним. Форма *hast* — без *b*, артикль перед *Zeit*
          не нужен. Матео ответит *Ja, ich habe Zeit* или коротко *Ja, klar!*
          Так же спрашивают о чём угодно: *Hast du Fragen?*, *Hast du
          WhatsApp?*
        point: "*Hast du Zeit?* — *Ja, ich habe Zeit.*"
        before:
          view: sentence
          rows:
            - de: [Du, ha+st, Zeit., ""]
              ru: У тебя есть время.
        set:
          rows:
            - de: ["", Ha+st, du Zeit?, ""]
              ru: У тебя есть время?
            - de: [Ich, hab+e, Zeit., ""]
              ru: Да, у меня есть время.

  - id: erklaeren-und-anwenden
    chapter: practice
    title: Научите напарника читать числа
    beats:
      - question: Напарник путает 23 и 32. Как объяснить разницу без готовой подсказки?
        read: >-
          В *dreiundzwanzig* сначала слышим 3, потом 20: получается 23.
          В *zweiunddreißig* — 2 и 30: получается 32. Объясните это своими
          словами и продиктуйте напарнику ещё одну пару: 45 и 54. Затем
          проверьте, может ли он повторить правило вам. Если занимаетесь
          один, запишите короткое объяснение на диктофон и прослушайте его.
          Называть цифры по одной при затруднении совершенно нормально.
        point: "Умеете объяснить разницу и уточнить число — значит, навык работает"
        set: { view: table, table: zwanzig, focus: [1, 2, 3] }

  - id: sprechen
    chapter: exam
    title: "Устный экзамен: буквы и номер"
    beats:
      - read: >-
          В первой теме вы готовили рассказ о себе. После него экзаменатор
          просит ещё две вещи: назвать по буквам имя, фамилию или город и
          продиктовать номер — телефона, дома или почтовый индекс. В образце
          Элиф диктует *Yıldız*: турецкую *ı* без точки по-немецки называют
          просто *I*. Говорите медленно, каждую букву отдельно, а номер
          надёжнее называть по цифрам.
        point: "Часть 1: после рассказа — фамилия по буквам и номер по цифрам"
        set: { view: task, task: buchstabieren }

  - id: hoeren
    chapter: exam
    title: "Аудирование: автоответчик"
    beats:
      - read: >-
          Третья часть аудирования — пять сообщений на автоответчике: звонят
          друзья, врач, школа, фирма. Каждое звучит дважды, к каждому —
          вопрос и три варианта. Прочитайте вопрос до записи и решите, что
          ловить. Здесь спрашивают *Wo?* — значит, нужен номер аудитории.
          Варианты похожи нарочно: 140, 214 и 241 проверяют тот самый
          обратный порядок.
        point: "Аудирование, часть 3: сначала вопрос, потом запись"
        set: { view: task, task: nachricht }
      - question: Где теперь курс Матео?
        read: >-
          Ответ *b* — *Raum 214*. Фрау Петерсен говорит
          *zweihundertvierzehn* и для верности повторяет по цифрам: *zwei –
          eins – vier*. 241 было бы *zweihunderteinundvierzig*, 140 —
          *hundertvierzig*. В записи звучит ещё одно число — телефон школы с
          кильским кодом *0431*. Лишние числа в аудировании есть почти
          всегда: отвечайте на вопрос, а не на всё подряд.
        point: "Лишние числа в записи — норма: слушайте то, о чём спросили"
        set: { solved: true }

case:
  title: Liegeplatz 23
  ru: Место у причала 23
  intro: >-
    За две недели до Кильской недели в клубе на Kiellinie снова неспокойно.
    Тот самый незнакомец в куртке Kieler Woche звонит начальнику гавани и
    бронирует место у причала — как раз рядом с лодками, которые пойдут в
    регату. Йенсен записывал на ходу и запутался в числах и буквах. Матео
    помогает ему разобраться — с грамматикой этой темы.
  people:
    J: { name: Herr Jensen, voice: Grandpa, role: Hafenmeister }
    X: { name: Der Unbekannte, voice: Eddy, role: Anrufer }
  steps:
    - read: >-
        Фрауке слышала, как незнакомец говорил по телефону у её киоска. Какое
        место у причала он назвал?
      evidence:
        - X: Ja, Liegeplatz dreiundzwanzig. Morgen um acht.
          ru: Да, место у причала двадцать три. Завтра в восемь.
        - J: Zweiunddreißig? Da liegt die „Sprotte“!
          ru: Тридцать два? Там же стоит «Шпротта»!
      question: Какое место у причала забронировал незнакомец?
      options: ["32", "23", "203"]
      answer: 1
      right: >-
        *dreiundzwanzig* — «три-и-двадцать», то есть 23. Йенсен переставил
        цифры, как фрау Петерсен в диалоге, и решил, что речь о месте 32, где
        стоит «Шпротта». Место 23 — у самого выхода в фьорд, рядом с
        лодками регаты.
      wrong:
        - >-
          Это ошибка Йенсена: *zweiunddreißig* — это 32, а незнакомец сказал
          *dreiundzwanzig*. В немецком сначала звучат единицы: *drei* — 3,
          *zwanzig* — 20.
        - null
        - >-
          203 было бы *zweihundertdrei*. В *dreiundzwanzig* нет слова
          *hundert*, а *und* связывает единицы с десятками: 3 и 20.
    - read: >-
        Свою фамилию незнакомец продиктовал по буквам. Йенсен записал
        «Wehrs», но в списке членов клуба такой фамилии нет. Послушайте
        запись ещё раз.
      evidence:
        - X: Mein Name ist Vehrs. Vau – E – Ha – Er – Es.
          ru: Моя фамилия Ферс. Фау — э — ха — эр — эс.
      question: Как на самом деле пишется фамилия?
      options: [Wehrs, Vehrs, Fehrs]
      answer: 1
      right: >-
        *Vau* — это буква *V*, она звучит как «ф». *We* — это *W*. Йенсен
        услышал звук «ф» и по старой привычке написал *W*. Правильно —
        *Vehrs*. Такой фамилии в списке клуба тоже нет: незнакомец не член
        клуба.
      wrong:
        - >-
          *Wehrs* начиналось бы с *We*. А в записи звучит *Vau* — буква *V*.
          Именно так и ошибся Йенсен.
        - null
        - >-
          Звук похож, но буква другая. *F* называют *Ef*, а здесь
          продиктовано *Vau* — это *V*.
    - read: >-
        Для брони нужен телефон. Незнакомец продиктовал номер, и Йенсен
        записал его на клочке бумаги — цифрами, но парами, как услышал.
      evidence:
        - note: |-
            Vehrs – Liegeplatz 23
            Tel.: 0431 – siebenundachtzig – fünfundsechzig
          ru: "Ферс — место 23. Тел.: 0431 — восемьдесят семь — шестьдесят пять."
      question: Какой номер набрать?
      options: [0431 78 56, 0431 87 65, 0431 87 56]
      answer: 1
      right: >-
        *siebenundachtzig* — 87, *fünfundsechzig* — 65. Каждую пару читаем
        справа налево: сначала единицы, потом десятки. Код *0431* — это Киль.
      wrong:
        - >-
          Здесь обе пары переставлены. *siebenundachtzig* — это «семь-и-
          восемьдесят», то есть 87, а не 78.
        - null
        - >-
          Первая пара верна, а во второй ошибка: *fünfundsechzig* — 65, «пять-и-
          шестьдесят».
  ending: >-
    Йенсен набирает номер. Незнакомец отвечает вежливо и обещает прийти
    завтра в восемь. На вопрос о возрасте для анкеты клуба он говорит: *Ich
    habe dreißig Jahre.* По-немецки *Ich bin dreißig*. Но и Матео так
    ошибался: одного окончания для обвинения недостаточно. Йенсен решает
    проверить бронь и документы. Кто же звонил? Продолжение — в
    следующей теме, а находить такие ошибки можно в «Поиске ошибки».

adventure:
  kind: harbor
  title: Найдите «Шпротту»
  intro: >-
    Команда собирается на прогулку к Kieler Woche. Матео встречает вас у
    клуба на Kiellinie. Найдите лодку по указанию Йенсена, позвоните Дане,
    узнайте, в какой аудитории искать Матео после занятий, соберите название
    лодки по буквам и проверьте провизию.
  berths: [23, 32, 203]
  berth: 32
  directions: { dialogue: am-steg, lines: [1] }
  phone: "0176234581"
  phoneClue: { dialogue: anruf, lines: [5] }
  phoneHelp: { dialogue: anruf, lines: [7] }
  roomTask: nachricht
  challenges:
    - id: boat-name
      kind: order
      title: Подпишите бирку для лодки
      intro: >-
