      clue: { dialogue: am-steg, lines: [6] }
      options:
        - { id: wasser, label: Wasser, icon: 💧 }
        - { id: brot, label: Brot, icon: 🍞 }
        - { id: kuchen, label: Kuchen, icon: 🍰 }
