    words: [Familienname?, Telefonnummer?]
    sample:
      - Mein Familienname ist Yıldız.
      - Ypsilon – I – El – De – I – Zett.
      - Meine Handynummer ist null eins fünf neun – drei vier sieben sieben eins zwei.
  nachricht:
    kind: listen
