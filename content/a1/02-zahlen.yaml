    title: Hören, Teil 3
    situation: Sie hören eine Nachricht auf dem Anrufbeantworter.
    voice: Sandy
    text: >-
      Moin, hier ist Kerstin Petersen, Sprachschule Förde. Eine Nachricht für
      Mateo Fernández: Herr Fernández, Ihr Kurs ist jetzt in Raum
