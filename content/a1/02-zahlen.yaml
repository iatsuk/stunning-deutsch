tables:
  zehn:
    title: Von 13 bis 90
    ru: От 13 до 90
    head: [Zahl, Deutsch, Как устроено]
    ruCols: [2]
    rows:
      - ["13", drei+zehn, 3 + 10]
      - ["14", vier+zehn, 4 + 10]
      - ["16", sech+zehn, "*sechs* теряет *s*"]
      - ["17", sieb+zehn, "*sieben* теряет *en*"]
      - ["20", zwan+zig, "не *zweizig*"]
      - ["30", drei+ßig, "единственный десяток на *-ßig*"]
      - ["60", sech+zig, "снова без *s*"]
      - ["70", sieb+zig, "снова без *en*"]
      - ["90", neun+zig, "9 + *-zig*"]
    note: "До 12 у каждого числа своё имя. Дальше — конструктор: единица + *zehn* или *-zig*."
  zwanzig:
    title: "Einundzwanzig: erst die Einer"
    ru: Сначала единицы, потом десятки
    head: [Zahl, Deutsch, Буквально]
    ruCols: [2]
    rows:
      - ["21", "ein*und*zwanzig", один-и-двадцать]
      - ["23", "drei*und*zwanzig", три-и-двадцать]
      - ["32", "zwei*und*dreißig", два-и-тридцать]
      - ["45", "fünf*und*vierzig", пять-и-сорок]
      - ["67", "sieben*und*sechzig", семь-и-шестьдесят]
      - ["100", hundert, "сто, можно и *einhundert*"]
      - ["214", zweihundertvierzehn, двести-четырнадцать]
      - ["345", "dreihundertfünf*und*vierzig", триста-пять-и-сорок]
      - ["1000", tausend, "тысяча, можно и *eintausend*"]
    note: "Число пишется одним словом: *dreihundertfünfundvierzig*. Сотни идут как в русском, а внутри сотни — снова сначала единицы."
  haben:
    title: haben
    ru: иметь
    head: [Person, haben, Beispiel]
    rows:
      - [ich, hab+e, Ich habe Kuchen.]
      - [du, ha+st, Hast du Zeit?]
      - [er / sie / es, ha+t, Mateo hat Geburtstag.]
      - [wir, hab+en, Wir haben Pause.]
      - [ihr, hab+t, Habt ihr Zeit?]
      - [sie / Sie, hab+en, Haben Sie Fragen?]
    note: "В *du hast* и *er hat* буква *b* выпадает. Остальные формы — как у правильного глагола."
  alphabet:
    title: Das Alphabet
    ru: Буквы, которые зовут иначе
    head: [Buchstabe, Name, Звучит]
    ruCols: [2]
    rows:
      - [C, Ce, "«цэ»"]
      - [E, E, "«э» — не «и»"]
      - [I, I, "«и» — не «ай»"]
      - [H, Ha, "«ха»"]
      - [J, Jot, "«йот»"]
      - [V, Vau, "«фау»"]
      - [W, We, "«вэ»"]
      - [Y, Ypsilon, "«ипсилон»"]
      - [Z, Zett, "«цэт»"]
      - ["Ä · Ö · Ü", "A-Umlaut · O-Umlaut · U-Umlaut", "«э» · «ё» · «ю»"]
      - [ß, Eszett, "«эсцэт»"]
    note: "Остальные буквы звучат почти как в русском: *Be*, *De*, *Ka*, *El*, *Em*, *Er*."
  betonung:
    title: Betonung
    ru: Ударение не на первом слоге
    head: [Wort, Звучит]
    rows:
      - [buchstabieren, buch·sta·BIE·ren]
      - [der Geburtstag, ge·BURTS·tag]
      - [die Adresse, a·DRES·se]
      - [die USA, u·es·A]
    note: "*-ieren* ударно всегда, приставка *ge-* — никогда. Заимствования часто ударны не в начале, а сокращения по буквам — на последней букве. Точки делят слово на слоги, большими буквами выделен ударный."

tasks:
