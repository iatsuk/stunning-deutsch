id: zahlen
order: 2
title: Wie schreibt man das?
ru: Числа, алфавит, телефон
lede: >-
  Дана записывается на экзамен по телефону: называет фамилию по буквам,
  диктует номер — и выясняет, что немцы читают числа задом наперёд. А в
  перерыве у Матео день рождения, и оказывается, что возраст по-немецки не
  «имеют». После занятий эти же числа помогают найти место у причала и
  проверить, есть ли вода и хлеб для прогулки под парусом.
goals:
  - Считать от 0 до 1000 и понимать числа на слух
  - Назвать по буквам имя и фамилию и переспросить, если не расслышали
  - Продиктовать номер телефона и записать чужой без ошибок
  - Спросить «у тебя есть …?» с глаголом *haben* и ответить *ja* или *nein*
  - Назвать свой возраст и спросить чужой
grammar:
  - Числа 0–1000
  - Глагол haben
  - Вопросы да/нет и ответы ja/nein
  - Алфавит и спеллинг
  - "Ударение: -ieren, ge- и сокращения"
exam: [sprechen-1, hoeren-3, schreiben-1]

dialogues:
  anruf:
    title: Anmeldung am Telefon
    ru: Запись по телефону
    place: Sprachschule Förde, Kiel
    people:
      D: { name: Dana, voice: Anna }
      P: { name: Frau Petersen, voice: Sandy }
    lines:
      - P: Moin, Sprachschule Förde, Petersen!
        ru: Здравствуйте, языковая школа «Фёрде», Петерсен!
      - D: Moin, hier ist Dana Ospanowa. Ich möchte die A1-Prüfung machen.
        ru: Здравствуйте, это Дана Оспанова. Я хотела бы сдать экзамен A1.
      - P: Gern. Ospanowa – wie schreibt man das?
        ru: Хорошо. Оспанова — как это пишется?
      - D: O – S – P – A – N – O – W – A. W wie Wilhelm.
        ru: О — эс — пэ — а — эн — о — вэ — а. «Вэ», как Вильгельм.
      - P: Danke. Und Ihre Telefonnummer, bitte?
        ru: Спасибо. А ваш номер телефона?
      - D: Null eins sieben sechs – dreiundzwanzig – fünfundvierzig – einundachtzig.
        ru: 0176 — 23 — 45 — 81.
      - P: Null eins sieben sechs – zweiunddreißig …?
        ru: 0176 — 32…?
      - D: Nein, dreiundzwanzig! Zwei – drei.
        ru: Нет, двадцать три! Два — три.
      - P: Ah, dreiundzwanzig! Danke, Frau Ospanowa. Auf Wiederhören!
        ru: А, двадцать три! Спасибо, госпожа Оспанова. До свидания!
      - D: Auf Wiederhören!
        ru: До свидания!
  geburtstag:
    title: Alles Gute, Mateo!
    ru: С днём рождения, Матео!
    place: Sprachschule Förde, Raum 214
    people:
      D: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
      T: { name: Frau Thomsen, voice: Shelley }
    lines:
      - D: Mateo, hast du heute Geburtstag?
        ru: Матео, у тебя сегодня день рождения?
      - M: Ja! Ich habe heute achtundzwanzig Jahre.
        ru: Да! Я «имею» сегодня двадцать восемь лет.
      - D: "Alles Gute! Aber auf Deutsch sagt man: Ich bin achtundzwanzig."
        ru: "Поздравляю! Но по-немецки говорят: «Я — двадцать восемь»."
      - M: Ach so! Ich bin achtundzwanzig Jahre alt. Und du? Bist du auch achtundzwanzig?
        ru: Ах вот как! Мне двадцать восемь лет. А тебе? Тебе тоже двадцать восемь?
      - D: Nein, ich bin einunddreißig.
        ru: Нет, мне тридцать один.
      - M: Ich habe Kuchen für alle! Habt ihr Zeit?
        ru: У меня торт для всех! У вас есть время?
      - D: Ja, klar! Wir haben jetzt Pause.
        ru: Да, конечно! У нас сейчас перерыв.
      - M: Und Frau Thomsen? Hat sie auch Zeit?
        ru: А фрау Томсен? У неё тоже есть время?
      - D: Frau Thomsen, haben Sie Zeit? Mateo hat Geburtstag!
        ru: Фрау Томсен, у вас есть время? У Матео день рождения!
      - T: Ja, natürlich! Alles Gute, Mateo!
        ru: Да, конечно! Поздравляю, Матео!
  am-steg:
    title: Welche Nummer?
    ru: Нужное место у причала
    place: Парусный клуб на Kiellinie, Kiel
    people:
      M: { name: Mateo, voice: Reed }
      J: { name: Herr Jensen, voice: Grandpa }
    lines:
      - M: Moin, Herr Jensen! Wo ist die „Sprotte“?
        ru: Здравствуйте, господин Йенсен! Где «Шпротта»?
      - J: Liegeplatz zweiunddreißig.
        ru: Место у причала тридцать два.
      - M: Dreiundzwanzig?
        ru: Двадцать три?
      - J: Nein, zweiunddreißig. Drei – zwei.
        ru: Нет, тридцать два. Три — два.
      - M: Danke! Wie schreibt man „Sprotte“?
        ru: Спасибо! Как пишется «Шпротта»?
      - J: Es – Pe – Er – O – Te – Te – E. Habt ihr Wasser?
        ru: Эс — пэ — эр — о — тэ — тэ — э. У вас есть вода?
      - M: Ja, wir haben Wasser und Brot.
        ru: Да, у нас есть вода и хлеб.
      - J: Super! Viel Spaß!
        ru: Отлично! Хорошо провести время!

