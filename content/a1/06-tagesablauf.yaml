tables:
  zeitangaben:
    title: Wann?
    ru: "Когда: um, am, von … bis"
    head: [ Что называем, Wort, Beispiel ]
    ruCols: [ 0 ]
    rows:
      - [ время по часам, um, um sechs Uhr / um halb acht ]
      - [ день недели, am, am Montag / am Wochenende ]
      - [ часть дня, am, am Morgen / am Abend ]
      - [ ночь — исключение, in der, in der Nacht ]
      - [ отрезок времени, von … bis, von neun bis zwölf Uhr ]
      - [ без предлога, –, heute / morgen / jetzt ]
    note: "*am* — это слияние *an* и *dem*. Почему так, разберём в теме о жилье."
  trennbar:
    title: Trennbare Verben
    ru: Глаголы с отделяемой приставкой
    head: [ Infinitiv, Beispiel, По-русски ]
    ruCols: [ 2 ]
    rows:
      - [ "*auf*stehen", "Ich stehe um sechs Uhr *auf*.", Я встаю в шесть часов. ]
      - [ "*an*fangen", "Der Kurs fängt um neun *an*.", Курс начинается в девять. ]
      - [ "*auf*hören", "Der Kurs hört um halb eins *auf*.", Курс заканчивается в половине первого. ]
      - [ "*ein*kaufen", "Am Mittag kaufe ich *ein*.", В обед я хожу за покупками. ]
      - [ "*auf*räumen", "Am Samstag räume ich *auf*.", В субботу я убираюсь. ]
      - [ "*fern*sehen", "Am Abend sieht Mateo *fern*.", Вечером Матео смотрит телевизор. ]
      - [ "*an*rufen", "Ich rufe dich morgen *an*.", Я позвоню тебе завтра. ]
    note: "*anfangen* и *fernsehen* меняют гласную корня: *du fängst an*, *er sieht fern*."

