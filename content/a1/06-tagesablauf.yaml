id: tagesablauf
order: 6
title: Wann stehst du auf?
ru: Время и распорядок дня
lede: >-
  Продукты куплены, но без точного времени команда не соберётся. Дана и Матео сравнивают
  распорядок дня, школа меняет начало курса, а Хауке назначает встречу у причала. Учимся
  понимать *halb* и *Viertel*, читать часы работы и удерживать отделяемую приставку в конце
  фразы.
goals:
  - Спросить, который час, и ответить — официально и в разговоре
  - Сказать, когда что происходит — в семь часов, в понедельник, с девяти до пяти
  - Рассказать о своём дне — от «встаю» до «смотрю телевизор»
  - Понять сообщение на автоответчике и табличку с часами работы
grammar:
  - Время на часах
  - Отделяемые приставки
  - Рамка предложения
  - um, am, von … bis
  - Время на первом месте
exam: [ hoeren-3, lesen-3 ]

dialogues:
  spaet:
    title: Zu spät!
    ru: Опять опоздал!
    place: Sprachschule Förde, Kiel
    people:
      A: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
    lines:
      - A: Moin, Mateo! Wie spät ist es?
        ru: Привет, Матео! Который час?
      - M: Hm … Viertel nach neun?
        ru: Хм… четверть десятого?
      - A: Genau. Und der Kurs fängt um neun an!
        ru: Именно. А курс начинается в девять!
      - M: Entschuldigung! Ich stehe immer um halb neun auf.
        ru: Извини! Я всегда встаю в половине девятого.
      - A: Um halb neun? Ich stehe schon um sechs auf.
        ru: В половине девятого? А я встаю уже в шесть.
      - M: Um sechs? Was machst du so früh?
        ru: В шесть? Что ты делаешь так рано?
      - A: Von halb sieben bis sieben jogge ich, dann frühstücke ich.
        ru: С половины седьмого до семи бегаю, потом завтракаю.
      - M: Ich frühstücke nicht. Ich trinke nur schnell einen Kaffee.
        ru: А я не завтракаю. Только быстро выпиваю кофе.
      - A: Morgen stehst du um sieben auf, okay?
        ru: Завтра ты встаёшь в семь, хорошо?
      - M: Okay, okay … um sieben!
        ru: Ладно, ладно… в семь!
  tag:
    title: Mateos Tag
    ru: День Матео
    place: Sprachschule Förde, Kiel
    people:
      A: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
    lines:
      - A: Mateo, wann fängt deine Arbeit an?
        ru: Матео, когда начинается твоя работа?
      - M: Um siebzehn Uhr. Ich arbeite von siebzehn bis dreiundzwanzig Uhr im Restaurant.
        ru: В семнадцать. Я работаю в ресторане с 17 до 23 часов.
      - A: Und was machst du am Vormittag?
        ru: А что ты делаешь до обеда?
      - M: Am Vormittag habe ich Kurs, am Mittag kaufe ich ein.
        ru: До обеда у меня курс, в обед я хожу за покупками.
      - A: Und wann hast du Feierabend?
        ru: А когда у тебя заканчивается рабочий день?
      - M: Um elf. Dann sehe ich noch ein bisschen fern.
        ru: В одиннадцать. Потом ещё немного смотрю телевизор.
      - A: Und am Wochenende?
        ru: А в выходные?
      - M: Am Samstag arbeite ich auch. Aber am Sonntag schlafe ich lange!
        ru: В субботу я тоже работаю. Зато в воскресенье долго сплю!
  hafen:
    title: Wann treffen wir uns?
    ru: Когда встречаемся?
    place: Парусный клуб на Kiellinie, Kiel · учебный план
    people:
      H:
        name: Hauke
        voice: Rocko
      M:
        name: Mateo
        voice: Reed
      D:
        name: Dana
        voice: Anna
    lines:
      - H: Wann fangen wir am Sonntag an?
        ru: Когда мы начинаем в воскресенье?
      - M: Um halb sechs am Nachmittag.
        ru: В половине шестого дня.
      - D: Gut. Um halb sechs bin ich am Steg.
        ru: Хорошо. В половине шестого я буду у причала.
      - H: Ich rufe Mateo am Samstag an.
        ru: Я позвоню Матео в субботу.

