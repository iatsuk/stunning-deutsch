steps:
  - id: spaet
    chapter: scene
    title: Опять опоздал
    beats:
      - read: >-
          Понедельник, четверть десятого. Матео входит в класс, когда урок уже идёт. Дана с
          иронией спрашивает: *Wie spät ist es?* — «который час?», буквально «насколько
          поздно?». Матео неуверенно отвечает: *Viertel nach neun* — «четверть десятого». А
          курс, напоминает Дана, *fängt um neun an* — «начинается в девять». Заметьте: глагол
          *anfangen* распался на две части, и *an* убежало в самый конец.
        point: "*Wie spät ist es?* — «который час?»; *Der Kurs fängt um neun an.*"
        set: { view: dialogue, dialogue: spaet, reveal: 3, focus: [ 0, 1, 2 ] }
      - read: >-
          Матео оправдывается: *Ich stehe immer um halb neun auf* — «я всегда встаю в половине
          девятого». Снова глагол из двух частей: *aufstehen* — «вставать». Спрягается корень
          *stehe*, он стоит на втором месте, а приставка *auf* ждёт в конце. Дана встаёт
          гораздо раньше: *Ich stehe schon um sechs auf.* *schon* здесь — «уже»: в шесть она
          уже на ногах.
        point: "*aufstehen*: *Ich stehe um sechs auf.* — приставка уходит в конец"
        set: { reveal: 5, focus: [ 3, 4 ] }
      - read: >-
          Что Дана делает так рано? *Von halb sieben bis sieben jogge ich* — «с половины
          седьмого до семи бегаю». *von … bis* — «с … до». Потом — *dann frühstücke ich*: после
          *dann* глагол снова сразу второй. *frühstücken* — обычный глагол без приставки, он не
          распадается. А про завтра Дана говорит настоящим временем: *Morgen stehst du um
          sieben auf* — будущее время для этого не нужно.
        point: "*von … bis* — «с … до»; о завтрашнем дне — в настоящем времени"
        set: { reveal: 10, focus: [ 6, 7, 8 ] }

  - id: marco
    chapter: scene
    title: День Матео
    beats:
      - read: >-
          На перемене Дана расспрашивает Матео о его дне. Вечерняя работа в ресторане — с 17 до
          23 часов: *Ich arbeite von siebzehn bis dreiundzwanzig Uhr im Restaurant.*
          Официальная форма исключает путаницу между утром и вечером. *Am Vormittag* — «до
          обеда», *am Mittag* — «в обед». *Einkaufen* распадается на *kaufe … ein*. Когда время
          занимает первую позицию, глагол остаётся вторым, а *ich* переходит за него.
        point: "*am Vormittag*, *am Mittag* — части дня с *am*; *ich kaufe ein*"
        set: { view: dialogue, dialogue: tag, reveal: 4, focus: [ 1, 2, 3 ] }
      - read: >-
          Конец рабочего дня по-немецки — *der Feierabend*, буквально «праздничный вечер». *Um
          elf habe ich Feierabend* — «в одиннадцать я заканчиваю работу». Потом Матео *sieht
          fern* — «смотрит телевизор». У *fernsehen* корень меняет гласную, как у *sehen*: *du
          siehst*, *er sieht*. А в воскресенье Матео отсыпается: *Am Sonntag schlafe ich
          lange.* Дни недели, как и части дня, — с *am*.
        point: "*der Feierabend* — конец рабочего дня; *fernsehen*: *er sieht fern*"
        set: { reveal: 8, focus: [ 4, 5, 7 ] }
  - id: treffen-am-steg
    chapter: scene
    title: Воскресенье у причала
    beats:
      - read: "В субботу Матео тоже работает вечером, поэтому друзья выбирают воскресенье. *Um halb
          sechs am Nachmittag* означает 17:30. Слова *am Nachmittag* убирают путаницу с 05:30.
          Дана подтверждает *Um halb sechs bin ich am Steg*. Хауке обещает звонок: *Ich rufe
          Mateo am Samstag an*. Время встречи и время звонка — разные события: не переносите
          число из одной строки в другую."
        point: Встреча — в воскресенье в 17:30; звонок — в субботу; *ich rufe … an*
        set:
          view: dialogue
          dialogue: hafen
          reveal: 4

  - id: uhr
    chapter: words
    title: Часы и время
    beats:
      - read: >-
          Русское «час» в немецком — два разных слова. Время на часах — *Uhr*: *Es ist acht
          Uhr.* Отрезок времени — *die Stunde*: *Der Kurs dauert drei Stunden* — «курс длится
          три часа». А *die Uhr* — это ещё и сами часы, на руке или на стене. Запомните пару
          вопросов: *Wie spät ist es?* и *Wie viel Uhr ist es?* Оба значат «который час?».
        point: "*acht Uhr* — время на часах, *drei Stunden* — отрезок времени"
        set: { view: words, words: uhr }

  - id: tage
    chapter: words
    title: Части дня и дни недели
    beats:
      - read: >-
          Все части дня — мужского рода, как *der Tag*: *der Morgen*, *der Vormittag*, *der
          Mittag*, *der Nachmittag*, *der Abend*. Поэтому с ними *am*: *am Morgen*, *am Abend*.
          Исключение одно — *die Nacht*, и говорят *in der Nacht* — «ночью». Часть этих слов вы
          уже знаете по приветствиям: *Guten Morgen!*, *Guten Abend!*, *Gute Nacht!*
        point: "Части дня — *der*, поэтому *am Morgen*, *am Abend*; но *in der Nacht*"
        set: { view: words, words: tageszeiten }
      - read: >-
          Дни недели тоже мужского рода, и почти все кончаются на *-tag*. Особняком стоит *der
          Mittwoch* — буквально «середина недели». С днями тоже *am*: *am Montag*, *am
          Wochenende*. И ловушка: *der Morgen* с большой буквы — «утро», а *morgen* с маленькой
          — «завтра». «Завтра утром» — *morgen früh*: так немцы обходят странное *morgen am
          Morgen*.
        point: "*am Montag*; *morgen* — «завтра», *der Morgen* — «утро»"
        set: { view: words, words: woche }

  - id: alltag
    chapter: words
    title: Мой день
    beats:
      - read: >-
          Глаголы распорядка дня. Половина из них — с отделяемой приставкой: *aufstehen*,
          *anfangen*, *einkaufen*, *aufräumen*, *fernsehen*, *anrufen*. В словаре они стоят
          одним словом, а в предложении разделяются: *ich stehe auf*. Ударение всегда падает на
          приставку: *AUFstehen*, *EINkaufen*. Это помогает узнать такой глагол на слух.
          Подсказка под словом показывает, как он выглядит в предложении.
        point: "Отделяемая приставка всегда ударная: *aufstehen*, *einkaufen*"
        set: { view: words, words: alltag }

  - id: uhrzeit
    chapter: grammar
    title: Который час?
    beats:
      - read: >-
          Пройдём по дню Даны вместе с часами. Будильник звонит в шесть. На *Wie spät ist es?*
          отвечают *Es ist sechs Uhr.* А на вопрос «когда?» — *Wann?* или *Um wie viel Uhr?* —
          нужен предлог *um*: *um sechs Uhr*, «в шесть часов». *Uhr* после числа не меняется:
          *sechs Uhr*, а не *sechs Uhren*. В разговоре его часто опускают: *um sechs*.
        point: "*Es ist sechs Uhr.* — который час; *um sechs Uhr* — когда"
        set: { view: clock, time: "06:00" }
      - read: >-
          В половине седьмого Дана выходит на пробежку. По-немецки это *halb sieben*: половина
          пути к семи, то есть 6:30. Русский здесь помогает: «половина седьмого» устроена так
          же. Ошибаются те, кто переводит с английского «half past six» и говорит *halb sechs*
          — это 5:30, на час раньше. Проверка простая: после *halb* всегда стоит следующий час.
          *halb acht* — 7:30, *halb neun* — 8:30.
        point: "*halb sieben* = 6:30, как «половина седьмого»: после *halb* — следующий час"
        set: { time: "06:30" }
      - read: >-
          Без четверти девять Дана уже сидит в классе. *Viertel* — «четверть», *vor* — «до»,
          *nach* — «после». *Viertel vor neun* — 8:45, «без четверти девять». А *Viertel nach
          neun* — 9:15, время, когда пришёл Матео. Вот здесь русский уже подводит: мы говорим
          «четверть десятого», называя следующий час, а немец считает от прошедшего: *nach
          neun* — «после девяти».
        point: "*Viertel vor neun* — 8:45; *Viertel nach neun* — 9:15, «после девяти»"
        set: { time: "08:45" }
      - read: >-
          Спать Дана ложится в половине одиннадцатого. Время называют двумя способами.
          Официально — по радио, на вокзале, в расписании и на табличках — 24 часа и минуты:
          *zweiundzwanzig Uhr dreißig*. В разговоре — 12 часов и *halb*, *Viertel*: *halb elf*.
          На экзамене нужны оба: в объявлениях и на табличках — официальная форма, в сообщениях
          друзей — разговорная.
        point: "Официально — *zweiundzwanzig Uhr dreißig*, в разговоре — *halb elf*"
        set: { time: "22:30" }

  - id: wann
    chapter: grammar
    title: um, am, von … bis
    beats:
      - read: >-
          Русское «в» — «в шесть», «в понедельник», «в обед» — по-немецки распадается на два
          предлога. С часами — *um*: *um sechs Uhr*. С днями и частями дня — *am*: *am Montag*,
          *am Abend*, *am Wochenende*. Отрезок времени — *von … bis*: *von neun bis zwölf*.
          Исключение — *in der Nacht*. А *heute*, *morgen* и *jetzt* обходятся вообще без
          предлога: *Heute habe ich Kurs.*
        point: "*um* + часы, *am* + день или часть дня, *von … bis* — отрезок"
        set: { view: table, table: zeitangaben }

  - id: vorfeld
    chapter: grammar
    title: Время — на первое место
    beats:
      - read: >-
          Немцы очень любят начинать фразу со времени: *Am Vormittag habe ich Kurs.* *Dann
          frühstücke ich.* Правило из первой темы работает и здесь: что бы ни стояло на первой
          позиции, глагол — второй, а подлежащее уходит за него. Типичная ошибка — русский
          порядок слов: *Dann ich frühstücke*. Так нельзя: между первой позицией и глаголом
          ничего не помещается.
        point: "Время на первом месте — глагол всё равно второй: *Dann frühstücke ich.*"
        set:
          view: sentence
          rows:
            - de: [ Am Vormittag, hab+e, ich Kurs., "" ]
              ru: До обеда у меня курс.
            - de: [ Dann, frühstück+e, ich., "" ]
              ru: Потом я завтракаю.

  - id: klammer
    chapter: grammar
    title: Глагол из двух частей
    beats:
      - read: >-
          У *aufstehen*, *anfangen*, *einkaufen* есть приставка, которая в предложении
          отрывается от глагола. Корень спрягается как обычно и стоит на втором месте, а
          приставка уходит в конец. Если корень меняет гласную, он меняет её и здесь: *du
          fängst an*, *er sieht fern*. В словарях такие глаголы часто пишут с чертой:
          *auf|stehen*.
        point: "Корень — на втором месте, приставка — в конце: *Der Kurs fängt um neun an.*"
        set: { view: table, table: trennbar }
      - read: >-
          Вот как это выглядит на схеме. *Ich stehe um sieben Uhr auf.* Корень *stehe* — во
          второй колонке, приставка *auf* — в последней, в поле «конец». Между ними — середина:
          время, место, дополнения. Глагол обнимает середину с двух сторон, и эту конструкцию
          называют рамкой предложения — *Satzklammer*. У *frühstücken* приставки нет, и поле
          «конец» остаётся пустым.
        point: "Рамка: *Ich stehe … auf.* — середина зажата между корнем и приставкой"
        set:
          view: sentence
          rows:
            - de: [ Ich, steh+e, um sieben Uhr, auf. ]
              ru: Я встаю в семь часов.
      - read: >-
          Поставим время первым: *Um sieben Uhr stehe ich auf.* Вперёд переехало время, *ich*
          оказалось за глаголом, а *stehe* и *auf* удерживают рамку. В нейтральном порядке
          урока приставка завершает фразу. В разговоре можно услышать вынесенные уточнения
          после неё, но сначала освоим основную модель: время внутри рамки, приставка в конце.
        point: "*Um sieben Uhr stehe ich auf.* — порядок меняется, рамка остаётся"
        set:
          rows:
            - de: [ Um sieben Uhr, steh+e, ich, auf. ]
              ru: В семь часов я встаю.
      - read: >-
          В вопросах рамка тоже на месте. W-вопрос: *Wann stehst du auf?* — *wann* на первой
          позиции, окончание меняется на *-st*, приставка по-прежнему в конце. Вопрос да/нет
          начинается с глагола: *Stehst du morgen um sieben auf?* Это фраза Даны из диалога,
          только вопросом. Ответить можно коротко, совсем без глагола: *Ja, um sieben!*
        point: "*Wann stehst du auf?* — *Stehst du morgen um sieben auf?*"
        set:
          rows:
            - de: [ Wann, steh+st, du, auf? ]
              ru: Когда ты встаёшь?
            - de: [ "", Steh+st, du morgen um sieben, auf? ]
              ru: Ты завтра встанешь в семь?

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как по-разговорному сказать 7:35?
        read: >-
          *fünf nach halb acht* — «пять минут после половины восьмого». Минуты рядом с
          половиной немцы отсчитывают от *halb*: 7:25 — *fünf vor halb acht*, 7:35 — *fünf nach
          halb acht*. Остальные — от целого часа: 7:10 — *zehn nach sieben*, 7:50 — *zehn vor
          acht*. Запутались — скажите официально: *sieben Uhr fünfunddreißig*. Это всегда верно
          и всегда понятно.
        point: "7:35 — *fünf nach halb acht*; если сомневаетесь — *sieben Uhr fünfunddreißig*"
        before: { view: clock, time: "07:30" }
        set: { time: "07:35" }
      - question: Как спросить Матео, когда он смотрит телевизор?
        read: >-
          *Wann siehst du fern?* Здесь сразу две трудности. Первая — рамка: корень *siehst* на
          втором месте, *fern* в конце. Вторая — корень меняет гласную, как у *sehen*: *ich
          sehe*, но *du siehst*, *er sieht*. Ошибка *Wann sehst du fern?* очень частая. Так же
          ведёт себя *anfangen*: *Wann fängst du an?*
        point: "*Wann siehst du fern?* — *e* → *ie*, приставка в конце"
        set:
          view: sentence
          rows:
            - de: [ Wann, sieh+st, du, fern? ]
              ru: Когда ты смотришь телевизор?
      - question: Почему *Ich rufe dich an*, а не *dir*, как в русском «тебе»?
        read: >-
          *rufen* — «звать», а звать кого? Винительный падеж. Поэтому и *anrufen* требует
          винительного: *Ich rufe dich an*, *Rufst du mich an?* В русском «звонить кому?» —
          дательный, отсюда соблазн сказать *dir*. Местоимение встаёт в середину рамки, сразу
          за подлежащим, а время — за ним: *Ich rufe dich morgen an.*
        point: "*anrufen* + винительный: *Ich rufe dich an*, а не *dir*"
        set:
          rows:
            - de: [ Ich, ruf+e, dich morgen, an. ]
              ru: Я позвоню тебе завтра.

  - id: hoeren
    chapter: exam
    title: "Аудирование: автоответчик"
    beats:
      - read: >-
          В третьей части аудирования звучат пять сообщений на автоответчике: от друзей, из
          врачебного кабинета, из школы. Каждое звучит дважды, к каждому — вопрос с тремя
          вариантами. Чаще всего спрашивают о времени или дне, а в тексте названы два-три
          похожих числа. Прежде чем слушать, прочитайте вопрос и варианты. И запомните прощание
          по телефону: *Auf Wiederhören!* — «до свидания» для тех, кого не видно.
        point: "*Hören*, часть 3: пять сообщений, каждое дважды, a/b/c — чаще всего о времени"
        set: { view: task, task: nachricht }
      - question: Когда в пятницу начинается курс?
        read: >-
          *Um 10.30 Uhr* — вариант b. В сообщении звучат все три времени, и в этом ловушка.
          *Neun Uhr* — обычное время, но в пятницу курс начинается позже. *Ein Uhr* — конец
          урока: *Er hört dann um ein Uhr auf.* А *erst um halb elf* — «только в половине
          одиннадцатого». И ещё: в вопросе *beginnt*, а в тексте *fängt … an*. Экзамен любит
          синонимы.
        point: "*erst um halb elf* — «не раньше»; *beginnt* = *fängt … an*"
        set: { solved: true }

  - id: lesen
    chapter: exam
    title: "Чтение: табличка на двери"
    beats:
      - read: >-
          В третьей части чтения — таблички и объявления: на двери магазина, врача, школы. К
          каждой — утверждение, нужно отметить *richtig* или *falsch*. *Öffnungszeiten* — «часы
          работы», *geöffnet* — «открыто», *geschlossen* — «закрыто». Время на табличках всегда
          официальное: *8.30 – 17.00 Uhr*. Дни недели сокращают: *Mo*, *Di*, *Mi*, *Do*, *Fr*,
          *Sa*, *So*.
        point: "*Öffnungszeiten* — часы работы; *geöffnet* — открыто, *geschlossen* — закрыто"
        set: { view: task, task: buero }
      - question: Правда ли, что в пятницу офис работает до 17 часов?
        read: >-
          *Falsch.* До 17 часов офис открыт с понедельника по четверг, а в пятницу — только до
          13. Это типичная ловушка третьей части: в табличке два похожих времени, и утверждение
          берёт не ту строку. Читайте табличку по порядку: сначала найдите нужный день, потом
          время. *Fr: 8.30 – 13.00 Uhr* — в пятницу после обеда офис закрыт.
        point: "Сначала найдите в табличке нужный день, потом время"
        set: { solved: true }

exercises:
  - type: choice
    q: ___ spät ist es?
    options: [ Wie, Wann, Wo ]
    answer: 0
    why: "*Wie spät ist es?* — «который час?». *Wann?* — «когда?»: *Wann fängt der Kurs an?*"
  - type: choice
    q: "Как сказать 7:30 в разговоре?"
    options: [ halb sieben, halb acht, Viertel nach sieben ]
    answer: 1
    why: "После *halb* — следующий час: *halb acht* — «половина восьмого»."
  - type: choice
    q: "Как сказать 9:45 в разговоре?"
    options: [ Viertel nach neun, Viertel vor neun, Viertel vor zehn ]
    answer: 2
    why: "*Viertel vor zehn* — «без четверти десять»."
  - type: choice
    q: "Как официально сказать 14:15?"
    options: [ vierzehn Uhr fünfzehn, Viertel nach zwei, zwei Uhr fünfzehn ]
    answer: 0
    why: "Официально — 24 часа: *vierzehn Uhr fünfzehn*. *Viertel nach zwei* скажут в разговоре."
  - type: choice
    q: Der Kurs fängt ___ neun Uhr an.
    options: [ am, um, von ]
    answer: 1
    why: "Время по часам — с *um*."
  - type: choice
    q: Wir haben ___ Montag Kurs.
    options: [ um, am, in ]
    answer: 1
    why: "Дни недели — с *am*: *am Montag*."
  - type: gap
    q: Ich arbeite ___ neun ___ fünf.
    answer: [ von, bis ]
    ru: Я работаю с девяти до пяти.
  - type: gap
    q: Ich ___ um sechs Uhr ___.
    answer: [ stehe, auf ]
    hint: aufstehen
    ru: Я встаю в шесть часов.
    why: "Корень *stehe* — на втором месте, приставка *auf* — в конце."
  - type: gap
    q: Wann ___ der Kurs ___?
    answer: [ fängt, an ]
    hint: anfangen
    why: "*anfangen* меняет *a* на *ä*: *du fängst an*, *er fängt an*."
  - type: gap
    q: Am Abend ___ Mateo ___.
    answer: [ sieht, fern ]
    hint: fernsehen
    why: "*sehen* → *er sieht*, приставка *fern* — в конце."
  - type: gap
    q: ___ du heute ___?
    answer: [ Kaufst, ein ]
    hint: einkaufen
    ru: Ты сегодня пойдёшь за покупками?
    why: "Вопрос да/нет: корень первым, *ein* — в конце."
  - type: choice
    q: Ich rufe ___ morgen an.
    options: [ dir, dich, du ]
    answer: 1
    why: "*anrufen* + винительный: *Ich rufe dich an*. «Звоню тебе» по-русски — дательный, отсюда
      ошибка."
  - type: choice
    q: Какое предложение верное?
    options: [ Dann ich frühstücke., Dann frühstücke ich., Ich dann frühstücke. ]
    answer: 1
    why: "После *dann* глагол сразу второй, *ich* — за ним."
  - type: order
    ru: Курс начинается в девять.
    de: Der Kurs fängt um neun an.
    also: [ Um neun fängt der Kurs an. ]
  - type: order
    ru: В субботу я убираюсь.
    de: Am Samstag räume ich auf.
    also: [ Ich räume am Samstag auf. ]
    why: "*Am Samstag* на первом месте — *räume* второй, *auf* в конце."
  - type: order
    ru: Когда ты встаёшь?
    de: Wann stehst du auf?
  - type: order
    ru: В воскресенье мы начинаем в половине шестого.
    de: Am Sonntag fangen wir um halb sechs an.
    also: ["Wir fangen am Sonntag um halb sechs an.", "Um halb sechs fangen wir am Sonntag an."]
    why: "*anfangen*: *fangen* спрягается, *an* завершает рамку."
  - type: choice
    q: Die Freunde treffen sich am Nachmittag um halb sechs. Wann ist das?
    options:
      - 05:30
      - 17:30
      - 18:30
    answer: 1
    why: "*halb sechs* — 5:30, *am Nachmittag* делает это 17:30."
adventure:
  kind: sequence
  title: Не опоздайте к причалу
  intro: Нужно успеть на занятия, сдать анкету и подтвердить воскресную встречу. Настраивайте
    часы по сообщениям и связывайте время с нужным событием. Распорядок и часы работы школы
    здесь вымышлены.
  ending: Будильник настроен, распорядок восстановлен, пятничный курс начинается в 10:30, анкету
    сдаём до урока. Воскресная встреча у причала — в 17:30. Теперь можно выбрать, чем заняться
    вместе.
  challenges:
    - id: alarm
      kind: clock
      title: Поставьте будильник Матео
      intro: Матео согласился завтра встать раньше. Установите на часах новое время подъёма утром, а
        не старое время из оправдания.
      clue:
        dialogue: spaet
        lines:
          - 3
          - 8
          - 9
      initial: 06:00
      answer: 07:00
      minuteStep: 5
      success: Будильник на 07:00. Старое *halb neun* было причиной опоздания; последнее
        подтверждение — *um sieben*.
      wrong: "Нужно последнее договорённое время: Дана предложила *um sieben*, Матео согласился. Это
        утро, поэтому 07:00."
    - id: daily-plan
      kind: match
      title: Кто чем занят?
      intro: Сопоставьте события и интервалы. Вечерняя смена Матео названа в формате 24 часов. Не
        перепутайте время начала с длительностью.
      clue:
        dialogue: spaet
        lines:
          - 4
          - 6
      slots:
        - id: dana-up
          label: Dana · aufstehen
          answer: six
        - id: dana-run
          label: Dana · joggen
          answer: run
      options:
        - id: six
          label: 06:00
        - id: run
          label: 06:30–07:00
        - id: nine
          label: 09:00
        - id: evening
          label: 17:00–23:00
      success: Дана встаёт в 06:00, а с 06:30 до 07:00 бегает. *Von … bis* задаёт интервал, а *um* —
        конкретное время.
      wrong: "*Um sechs* — подъём Даны. *Von halb sieben bis sieben* — её пробежка. Рабочая смена
        Матео к этим двум полям не относится."
      mode: reading
    - id: friday-course
      kind: clock
      title: Переставьте время пятничного курса
      intro: Школа оставила сообщение об изменении. Установите новое время начала курса в пятницу. В
        сообщении есть также старое время и время окончания.
      clue:
        task: nachricht
      initial: 09:00
      answer: 10:30
      minuteStep: 5
      success: "Начало — в 10:30: *erst um halb elf*. 09:00 — старое время, 13:00 — окончание."
      wrong: "Ищите *fängt … an*: начало перенесено на *halb elf*, то есть 10:30. *Hört … auf*
        говорит об окончании."
    - id: office
      kind: select
      title: Сдайте анкету до урока
      intro: Курс начинается в пятницу в 10:30. Выберите время, когда офис открыт и вы ещё успеваете
        до начала занятий.
      mode: reading
      clue:
        task: buero
      options:
        - id: friday-before
          label: Fr · 10:15
        - id: friday-after
          label: Fr · 13:15
        - id: saturday
          label: Sa · 09:00
      answer:
        - friday-before
      success: В пятницу в 10:15 офис открыт, и до курса остаётся четверть часа. После 13:00 офис
        закрыт; в субботу он не работает.
      wrong: "Смотрите строку *Fr*: 8:30–13:00. Кроме часов работы нужно учесть начало курса в
        10:30."
    - id: confirm-meeting
      kind: order
      title: Подтвердите встречу команды
      intro: "Хауке ждёт короткое подтверждение: «В воскресенье мы начинаем в половине шестого».
        Начните с дня недели и сохраните глагольную рамку."
      mode: reading
      clue:
        dialogue: hafen
        lines:
          - 0
          - 1
          - 2
      label: Сообщение Хауке
      tokens:
        - Am Sonntag
        - fangen
        - wir
        - um halb sechs
        - an.
      success: "*Am Sonntag fangen wir um halb sechs an.* Глагол второй, приставка *an* в конце. Из
        контекста встречи понятно: 17:30."
      wrong: После *Am Sonntag* идёт *fangen*, затем *wir*. *Um halb sechs* остаётся внутри рамки,
        *an* — в самом конце.
case:
  title: Zwei Zeiten für ein Treffen
  ru: Два времени одной встречи
  intro: В клубе снова оказались старая и новая записи. Одни люди ждут встречу на час позже, а
    время окончания курса приняли за начало. Восстановите подтверждённый план по сообщениям.
  people:
    J:
      name: Herr Jensen
      voice: Grandpa
    P:
      name: Frau Petersen
      voice: Sandy
  steps:
    - read: В старой записи начало курса — 9:00. Но есть новое сообщение школы.
      evidence:
        - P: Am Freitag fängt der Kurs erst um halb elf an, nicht um neun Uhr.
          ru: В пятницу курс начинается только в половине одиннадцатого, не в девять.
      question: Какое начало курса записать в актуальный план?
      options:
        - 09:00
        - 10:30
        - 13:00
