        исключено."
      wrong:
        - День указан как воскресенье.
        - "*Halb sieben* отменено словом *nicht*."
        - null
    - read: Курс заканчивается в 13:00. Кто-то предложил сдать анкету в офис сразу после него. На
        двери висит табличка.
      evidence:
