id: einkaufen
order: 5
title: Was kostet das?
ru: Покупки и одежда
lede: >-
  Еда для встречи выбрана — теперь нужны покупки. Дана берёт продукты на рынке в Киле, а Матео
  ищет свитер на Holtenauer Straße для прохладного вечера у воды. Учимся понимать цены и
  количество, выбирать размер и не путать *ihn*, *sie* и *es* в сообщениях о покупках.
goals:
  - Спросить цену и понять ответ в евро и центах
  - Купить нужное количество — килограмм, полкило, бутылку
  - Выбрать одежду по размеру и сказать, что она велика или дорога
  - Понять объявление в супермаркете и выбрать подходящее объявление, как на экзамене
grammar:
  - Цены и количества
  - Местоимения ihn, sie, es
  - welcher, welche, welches
  - "Прилагательное после sein: zu groß"
exam: [ hoeren-2, lesen-2, sprechen-3 ]

dialogues:
  markt:
    title: Was kosten die Äpfel?
    ru: На рынке
    place: Рынок в Киле · учебная сцена и цены
    people:
      V: { name: Verkäuferin, voice: Shelley }
      A: { name: Dana, voice: Anna }
    lines:
      - V: Guten Morgen! Bitte schön?
        ru: Доброе утро! Слушаю вас.
      - A: Was kosten die Äpfel?
        ru: Сколько стоят яблоки?
      - V: Zwei Euro fünfzig das Kilo.
        ru: Два евро пятьдесят за кило.
      - A: Dann nehme ich zwei Kilo.
        ru: Тогда я возьму два кило.
      - V: Gern. Welche möchten Sie? Die hier oder die da?
        ru: Хорошо. Какие вам? Вот эти или вон те?
      - A: Die da, bitte. Und ein Pfund Tomaten.
        ru: Вон те, пожалуйста. И полкило помидоров.
      - V: Noch etwas?
        ru: Что-нибудь ещё?
      - A: Nein, danke, das ist alles.
        ru: Нет, спасибо, это всё.
      - V: Das macht sechs Euro achtzig.
        ru: С вас шесть евро восемьдесят.
      - A: Hier sind zehn Euro.
        ru: Вот десять евро.
  kleider:
    title: Wie finden Sie den Pullover?
    ru: В магазине одежды
    place: Вымышленный магазин на Holtenauer Straße, Kiel
    people:
      V: { name: Verkäufer, voice: Rocko }
      M: { name: Mateo, voice: Reed }
      A: { name: Dana, voice: Anna }
    lines:
      - V: Guten Tag! Suchen Sie etwas?
        ru: Добрый день! Вы что-то ищете?
      - M: Ja, einen Pullover.
        ru: Да, свитер.
      - V: Welche Größe haben Sie?
        ru: Какой у вас размер?
      - M: Größe M.
        ru: Размер M.
      - V: Wie finden Sie den Pullover hier?
        ru: Как вам вот этот свитер?
      - M: Hm, ich finde ihn zu groß. Haben Sie ihn auch in S?
        ru: Хм, по-моему, он великоват. А в размере S он у вас есть?
      - V: Ja, hier, bitte.
        ru: Да, вот, пожалуйста.
      - M: Dana, wie findest du ihn?
        ru: Дана, как он тебе?
      - A: Super! Und er ist nicht teuer – nur neunundzwanzig Euro neunzig.
        ru: Супер! И он недорогой — всего двадцать девять девяносто.
      - M: Gut, dann nehme ich ihn!
        ru: Хорошо, тогда беру!
  entscheidung:
    title: Das nehmen wir
    ru: Что берём, а что оставляем
    place: Магазин на Holtenauer Straße · учебная сцена
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
    lines:
      - M: Der Pullover ist gut. Ich nehme ihn.
        ru: Свитер хороший. Я его беру.
      - D: Die Jacke ist zu teuer. Ich kaufe sie nicht.
        ru: Куртка слишком дорогая. Я её не покупаю.
      - M: Das T-Shirt ist schön. Ich nehme es.
        ru: Футболка красивая. Я её беру.
      - D: Die Schuhe sind zu klein. Ich kaufe sie nicht.
        ru: Туфли слишком маленькие. Я их не покупаю.

