    sample:
      - Eine Tüte, bitte!
      - Haben Sie eine Tüte für mich?
      - Ja, gern. Sie kostet zwanzig Cent.
      - Leider habe ich keine Tüte.
  liste:
    kind: message
    part: lesen-1
    title: Einkaufszettel der Freunde
    from: Mateo
    to: Dana
    text: "Für die Fahrt: zwei Kilo Äpfel, ein Pfund Tomaten, drei Flaschen Wasser und 200 Gramm
      Käse. Danke, Dana!"

steps:
  - id: markt
    chapter: scene
    title: Суббота на рынке
    beats:
      - read: >-
          Суббота, утро, учебная сцена на рынке в Киле. Продавщица встречает Дану коротким
          *Bitte schön?* — «слушаю вас». Цену спрашивают *Was kostet …?*, а если товар во
          множественном числе — *Was kosten …?*: *Was kosten die Äpfel?* Ответ *Zwei Euro
          fünfzig das Kilo* — «два пятьдесят за кило». Сначала евро, потом центы, а слово
          *Cent* обычно не произносят.
        point: "*Was kostet …?* / *Was kosten …?* — «сколько стоит / стоят?»"
        set: { view: dialogue, dialogue: markt, reveal: 3, focus: [ 0, 1, 2 ] }
      - read: >-
          *Dann nehme ich zwei Kilo* — заметьте: *zwei Kilo*, без окончания множественного
          числа. Продавщица уточняет: *Welche möchten Sie?* — «какие вам?» — и показывает: *Die
          hier oder die da?* — «вот эти или вон те?». Ещё Дана берёт *ein Pfund Tomaten*.
          *Pfund* — это полкило, на рынке так говорят постоянно. И никакого родительного
          падежа, как в «полкило помидоров»: просто *ein Pfund Tomaten*.
        point: "*zwei Kilo*, *ein Pfund Tomaten* — количество прямо перед словом"
        set: { reveal: 6, focus: [ 3, 4, 5 ] }
      - read: >-
          Завершение покупки: *Noch etwas?* — «что-нибудь ещё?», *Nein, danke, das ist alles* —
          «нет, спасибо, это всё». Сумму называют как в кафе: *Das macht sechs Euro achtzig*.
          Дана даёт 10 евро. В игре нужно будет отличить цену за килограмм от общего счёта и
          проверить сдачу. Все цены в сцене учебные; они не описывают действующее предложение
          конкретного продавца.
        point: "*Noch etwas?* — *Nein, danke, das ist alles.* — *Das macht …*"
        set: { reveal: 10, focus: [ 6, 7, 8, 9 ] }

  - id: kleider
    chapter: scene
    title: Свитер для Матео
    beats:
      - read: >-
          Матео ищет свитер в вымышленном магазине на Holtenauer Straße: вечером у воды нужен
          тёплый слой. Продавец сначала спрашивает размер: *Welche Größe haben Sie?* —
          *welche*, потому что *die Größe*. Потом показывает свитер: *Wie finden Sie den
          Pullover hier?* *finden* здесь значит не «находить», а «считать»: «как вам свитер?».
          Матео отвечает *Ich finde ihn zu groß*. *ihn* — это и есть свитер: *den Pullover*
          превратился в *ihn*.
        point: "*Wie finden Sie …?* — «как вам …?»; *Ich finde ihn zu groß.*"
        set: { view: dialogue, dialogue: kleider, reveal: 6, focus: [ 2, 4, 5 ] }
      - read: >-
          С Даной Матео на «ты»: *Wie findest du ihn?* У *finden* основа кончается на *d*,
          поэтому перед окончанием появляется *e* — *du findest*. Дана хвалит: *Er ist nicht
          teuer*. После *sein* прилагательное не меняется, в отличие от русского «недорогой,
          недорогая». И финал: *Dann nehme ich ihn!* По-русски скажут просто «беру», а в
          немецком местоимение *ihn* опускать нельзя.
        point: "*Ich nehme ihn.* — местоимение не опускают, как в русском «беру»"
        set: { reveal: 10, focus: [ 7, 8, 9 ] }
  - id: entscheidung
    chapter: scene
    title: Что действительно купили?
    beats:
      - read: "У кассы важно понять последнее решение, а не просто услышать название вещи. Матео берёт
          свитер: *Ich nehme ihn*. Дана отказывается от куртки: *Ich kaufe sie nicht*. Потом
          Матео выбирает футболку — *Ich nehme es*, а туфли остаются из-за размера. В конце
          игры вы соберёте пакет только из подтверждённых покупок. *Ihn*, *sie* и *es* заменяют
          уже названный предмет, поэтому слушайте реплику целиком."
        point: "*ihn* — свитер, *sie* — куртка или туфли, *es* — футболка; *nicht* отменяет покупку"
        set:
          view: dialogue
          dialogue: entscheidung
          reveal: 4

  - id: mengen
    chapter: words
    title: Сколько?
    beats:
      - read: >-
          Килограмм — *ein Kilo*, полкило — *ein Pfund*. Для покупок в нашей сцене *ein Pfund
          Tomaten* означает 500 граммов. Упаковки — *die Flasche*, *die Packung*, *die Dose*,
          *die Tüte*. Во множественном числе: *zwei Flaschen*, *zwei Packungen*. Когда продавец
          спрашивает *Brauchen Sie eine Tüte?*, решите, нужен ли пакет, а затем уточните цену.
          В игре количество придётся выставить в корзине, а не просто узнать слово.
        point: "*ein Pfund* = 500 г; *die Flasche*, *die Dose*, *die Tüte* — мн. ч. на *-n*"
        set: { view: words, words: mengen }

  - id: obst
    chapter: words
    title: Фрукты и овощи
    beats:
      - read: >-
          Род фруктов и овощей почти никогда не совпадает с русским. «Банан», «помидор» и
          «огурец» у нас мужского рода, а в немецком — *die Banane*, *die Tomate*, *die Gurke*.
          «Яблоко» среднего рода, а *der Apfel* — мужского, и во множественном у него умлаут:
          *die Äpfel*. Хорошая новость: большинство слов на *-e* — женского рода, и
          множественное у них на *-n*: *die Tomaten*.
        point: "Слова на *-e* обычно *die*, мн. ч. на *-n*: *die Tomate — die Tomaten*"
        set: { view: words, words: markt }

  - id: kleidung
    chapter: words
    title: Одежда
    beats:
      - read: >-
          С одеждой та же история. «Брюки» у нас во множественном числе, а *die Hose* — одна
          вещь в единственном. Поэтому *Die Hose ist zu lang*, а не *sind*. «Рубашка» — *das
          Hemd*, среднего рода, «платье» — тоже *das Kleid*, а «юбка» — *der Rock*, мужского.
          *Schuhe* почти всегда во множественном: их ведь покупают парой.
        point: "*die Hose* — брюки, но в ед. ч.: *Die Hose ist zu lang.*"
        set: { view: words, words: kleidung }

  - id: einkaufen
    chapter: words
    title: Покупаем
    beats:
      - read: >-
          *kosten* и *finden* — правильные глаголы, но их основа кончается на *t* и *d*, и
          перед окончанием появляется *e*: *es kostet*, *du findest*, *er findet*. *brauchen* —
          «нуждаться»: *Ich brauche eine Jacke* — «мне нужна куртка». Прилагательные учите
          парами: *billig* и *teuer*, *groß* и *klein*, *lang* и *kurz*. А *zu* перед ними
          значит «слишком».
        point: "*es kostet*, *du findest* — с *e*; *Ich brauche …* — «мне нужно …»"
        set: { view: words, words: einkaufen }

  - id: preise
    chapter: grammar
    title: Цены
    beats:
      - read: >-
          Цены пишут через запятую — *2,50 €*, — а читают так: сначала евро, потом центы,
          причём слово *Cent* обычно проглатывают: *zwei Euro fünfzig*. Если евро нет, говорят
          *neunundneunzig Cent*. И помните из второй темы: единицы идут перед десятками —
          *neunundzwanzig*, «девять-и-двадцать». С ценами это главная ловушка на слух: *29,90*
          легко принять за 92.
        point: "*2,50 €* — *zwei Euro fünfzig*; *0,99 €* — *neunundneunzig Cent*"
        set: { view: table, table: preise }

  - id: mengen-grammatik
    chapter: grammar
    title: Кило яблок
    beats:
      - read: >-
          В русском после меры нужен родительный падеж: «кило яблок», «бутылка молока». В
          немецком второе слово остаётся как есть: *ein Kilo Äpfel*, *eine Flasche Milch* — без
          предлога и без падежа. Ещё одна разница: меры веса и деньги после числа не получают
          множественного — *zwei Kilo*, *200 Gramm*, *drei Euro*. А *Flasche* — получает: *zwei
          Flaschen Wasser*.
        point: "*eine Flasche Milch* — без падежа; *zwei Kilo*, но *zwei Flaschen*"
        set: { view: table, table: mengen, focus: [ 0, 1, 3, 4, 5 ] }

  - id: pronomen
    chapter: grammar
    title: Свитер — он — его
    beats:
      - read: >-
          Когда предмет уже назван, его заменяют местоимением — как в русском: «свитер? он
          велик, я его не беру». В немецком местоимение выбирают по роду слова. *der Pullover*
          — мужского рода, поэтому в именительном он *er*, а в винительном, как дополнение, —
          *ihn*. Сначала посмотрите на полную фразу: *den Pullover* занимает середину
          предложения.
        point: "Местоимение выбирают по роду: *der Pullover* → *er* → *ihn*"
        set:
          view: sentence
          rows:
            - de: [ Ich, find+e, d+en Pullover zu groß., "" ]
              ru: По-моему, свитер великоват.
      - read: >-
          Теперь *den Pullover* сжимается в одно слово — *ihn*, а *zu groß* остаётся на месте.
          Сравните: *der* → *den* и *er* → *ihn* — в винительном меняется только мужской род, и
          у артикля, и у местоимения. Ошибка *Ich finde er zu groß* очень частая: проверяйте,
          кто действует, а кто дополнение. Действует *ich*, свитер — дополнение, значит, *ihn*.
        point: "*Ich finde ihn zu groß.* — *er* → *ihn*, как *der* → *den*"
        set:
          rows:
            - de: [ Ich, find+e, ihn zu groß., "" ]
              ru: По-моему, он великоват.
      - read: >-
          Женский, средний род и множественное число не меняются: *die Jacke* → *sie*, *das
          T-Shirt* → *es*, *die Schuhe* → *sie*. Заменяйте по немецкому роду, а не по русскому:
          *das Hemd* — «рубашка», но местоимение *es*: *Ich nehme es*. А *sie* бывает и «она»,
          и «они» — различить помогает глагол: *sie ist*, но *sie sind*.
        point: "*die Jacke* → *sie*, *das Hemd* → *es*, *die Schuhe* → *sie*"
        set: { view: table, table: pronomen, focus: [ 1, 2, 3 ] }

  - id: welch
    chapter: grammar
    title: Какой именно?
    beats:
      - read: >-
          Вопрос «который из них?» — это *welch-* плюс существительное. Вместе они занимают
          первую позицию: *Welche Größe* — одна позиция, глагол — вторая, как в любом
          W-вопросе. Окончание зависит от рода и падежа: *die Größe* → *welche*, а *der
          Pullover* в роли дополнения — *welchen*. Отвечают часто одним указанием: *den hier* —
          «вот этот», с тем же *-en*.
        point: "*Welche Größe haben Sie?* — *welch-* вместе с существительным на первой позиции"
        set:
          view: sentence
          rows:
            - de: [ Welch+e Größe, hab+en, Sie?, "" ]
              ru: Какой у вас размер?
            - de: [ Welch+en Pullover, nehm+en, Sie?, "" ]
              ru: Какой свитер вы берёте?
            - de: [ Ich, nehm+e, d+en hier., "" ]
              ru: Я беру вот этот.
      - read: >-
          Окончания *welch-* повторяют артикль: *der* → *welcher*, *den* → *welchen*, *die* →
          *welche*, *das* → *welches*. Знаете род слова — знаете и форму вопроса. Не путайте
          *welch-* с *wie*: в русском оба могут быть «какой». *Welcher Pullover?* — «который из
          этих?», а *Wie ist der Pullover?* — «какой он, хороший или нет?».
        point: "*welcher* — «который из»; *wie* — «каков»: *Wie ist der Pullover?*"
        set: { view: table, table: welch, focus: [ 0 ] }

  - id: adjektiv
    chapter: grammar
    title: Слишком большой
    beats:
      - read: >-
          После *sein* прилагательное никогда не меняется: свитер, куртка, рубашка и ботинки —
          у всех *groß*. В русском «велик, велика, велики» подстраиваются под слово, в немецком
          — нет. *zu* значит «слишком», и это всегда минус: *zu groß* — «велик», *zu teuer* —
          «дорого для меня». Если хотите похвалить, говорите *sehr*: *Die Jacke ist sehr
          schön*.
        point: "*Der Pullover / Die Jacke ist zu groß.* — прилагательное не меняется; *zu* — «слишком»"
        set:
          view: sentence
          rows:
            - de: [ Der Pullover, ist, zu groß., "" ]
              ru: Свитер велик.
            - de: [ Die Jacke, ist, zu groß., "" ]
              ru: Куртка велика.
            - de: [ Das Hemd, ist, zu groß., "" ]
              ru: Рубашка велика.
            - de: [ Die Schuhe, sind, zu groß., "" ]
              ru: Ботинки велики.

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как спросить, сколько стоят брюки — *die Hose*?
        read: >-
          *Was kostet die Hose?* В русском «брюки» во множественном числе, а в немецком *die
          Hose* — одна вещь, поэтому и глагол в единственном: *kostet*. Для настоящего
          множественного — *kosten*: *Was kosten die Schuhe?* Перед окончанием *-t* у *kosten*
          появляется *e*: основа сама кончается на *t*, и без гласной форму было бы не
          выговорить.
        point: "*Was kostet die Hose?* — ед. ч.; *Was kosten die Schuhe?* — мн. ч."
        set:
          view: sentence
          rows:
            - de: [ Was, kost+et, die Hose?, "" ]
              ru: Сколько стоят брюки?
            - de: [ Was, kost+en, die Schuhe?, "" ]
              ru: Сколько стоят ботинки?
      - question: "Продавец: *Wie finden Sie das Kleid?* Как ответить «по-моему, оно коротковато»?"
        read: >-
          *Ich finde es zu kurz.* *das Kleid* — среднего рода, поэтому местоимение *es*; здесь
          роды в двух языках совпали, «платье» тоже «оно». *es* в винительном не меняется.
          Посмотрите на схему: глагол *finden* остаётся на второй позиции и только меняет
          окончание, *es* встаёт сразу за глаголом, а *zu kurz* — после местоимения.
        point: "*das Kleid* → *es*: *Ich finde es zu kurz.*"
        before:
          view: sentence
          rows:
            - de: [ Wie, find+en, Sie das Kleid?, "" ]
              ru: Как вам платье?
        set:
          rows:
            - de: [ Ich, find+e, es zu kurz., "" ]
              ru: По-моему, оно коротковато.
      - question: Как прочитать цену *12,49 €*?
        read: >-
          *zwölf Euro neunundvierzig*. Сначала евро, потом центы, а слово *Cent* не называют. В
          *neunundvierzig* единицы идут первыми: «девять-и-сорок». На кассе это прозвучит как
          *Das macht zwölf Euro neunundvierzig* — «с вас двенадцать сорок девять». Прочитайте
          вслух и сверьтесь с записью: на экзамене цены надо узнавать на слух.
        point: "*12,49 €* — *zwölf Euro neunundvierzig*"
        set:
          rows:
            - de: [ Das, mach+t, zwölf Euro neunundvierzig., "" ]
              ru: С вас двенадцать евро сорок девять.

  - id: hoeren
    chapter: exam
    title: "Аудирование: часть 2"
    beats:
      - read: >-
          Во второй части аудирования звучат объявления: на вокзале, в аэропорту, в
          супермаркете. Каждое — один раз, повторения не будет. Перед записью прочитайте
          утверждение и решите, что ловить: здесь это товар и цена. В супермаркете объявляют
          скидки: *im Angebot* — «по акции», *nur* — «всего». Послушайте и решите: *richtig*
          или *falsch*?
        point: "Часть 2: объявление звучит один раз — заранее прочитайте утверждение"
        set: { view: task, task: durchsage }
      - question: "*Richtig* или *falsch*? Почему?"
        read: >-
          *Falsch*. Цена *zwei Euro zwanzig* в объявлении есть, но это цена помидоров.
          Апельсины стоят *zwei Euro neunzig*. Составители часто берут настоящее число из
          текста и приписывают его другому товару. Поэтому слушайте пары «товар — цена» и
          записывайте цифры прямо на листе с заданием, пока звучит запись.
        point: "Цифра из текста — ещё не ответ: проверьте, к какому товару она относится"
        set: { solved: true }

  - id: lesen
    chapter: exam
    title: "Чтение: часть 2"
    beats:
      - read: >-
          Во второй части чтения — ситуация и два коротких объявления или страницы сайтов.
          Нужно выбрать, где человек найдёт то, что ему нужно. Читать всё подряд не
          обязательно: выпишите из ситуации два-три ключевых слова — здесь это *Jacke*,
          *Winter* и *40 Euro* — и ищите их в объявлениях. Совпасть должны все ключи сразу, а
          не один.
        point: "Часть 2: найдите в ситуации 2–3 ключевых слова и ищите их в объявлениях"
        set: { view: task, task: anzeigen }
      - question: Какое объявление подходит — a или b?
        read: >-
          *b*. В объявлении *a* есть приманка — *alles 50 % billiger*, «всё на 50 % дешевле»,
          но там только летние вещи: футболки, платья и брюки. Курток нет. В *b* — куртки и
          пальто к зиме, и цена подходит: *ab 35 €* — «от 35 евро». Скидка — ещё не ответ, если
          нужного товара в магазине нет.
        point: "Скидка — не ответ: сначала проверьте, есть ли нужный товар"
        set: { solved: true }

  - id: sprechen
    chapter: exam
    title: "Устный экзамен: часть 3"
    beats:
      - read: >-
          Третья часть устного экзамена знакома вам по прошлой теме: картинка, просьба,
          реакция. На картинке пакет — просите пакет: *Eine Tüte, bitte!* или *Haben Sie eine
          Tüte für mich?* В реакции пригодится местоимение: *Sie kostet zwanzig Cent* — *sie*,
          потому что *die Tüte*. Если пакета нет — *Leider habe ich keine Tüte*.
        point: "Просьба: *Eine Tüte, bitte!* Реакция: *Ja, gern.* / *Leider habe ich keine Tüte.*"
        set: { view: task, task: tuete, reveal: 4 }

