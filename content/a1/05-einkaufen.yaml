      evidence:
        - note: Zwei Kilo Äpfel und ein Pfund Tomaten.
          ru: Два килограмма яблок и полкило помидоров.
      question: Какая строка должна остаться в списке?
      options:
        - Äpfel 2 kg · Tomaten 500 g
        - Äpfel 2 kg · Tomaten 2 kg
        - Äpfel 500 g · Tomaten 2 kg
      answer: 0
