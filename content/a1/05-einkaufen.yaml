case:
  title: Der doppelte Einkaufszettel
  ru: Два списка покупок
  intro: В клуб принесли две версии списка и чек с лишней одеждой. Сверьте количества, цены и
    окончательные решения друзей. Важно восстановить покупки, прежде чем кто-то оплатит лишнее
    от имени команды.
  people:
    M:
      name: Mateo
      voice: Reed
    D:
      name: Dana
      voice: Anna
  steps:
    - read: В подлинной записке Даны указаны яблоки и помидоры. На копии вместо полкило появилась
