    ru: Который? Какой из них?
    head: [ Род, Nominativ, Akkusativ, Beispiel ]
    ruCols: [ 0 ]
    rows:
      - [ мужской, welch+er, welch+en, Welch+en Pullover nehmen Sie? ]
      - [ женский, welch+e, welch+e, Welch+e Größe haben Sie? ]
      - [ средний, welch+es, welch+es, Welch+es T-Shirt kaufst du? ]
      - [ мн. ч., welch+e, welch+e, Welch+e Schuhe sind billig? ]
    note: "Окончания как у артикля: *der* → *welcher*, *den* → *welchen*, *das* → *welches*."

tasks:
  durchsage:
    kind: listen
    part: hoeren-2
    title: Hören, Teil 2
    situation: Sie hören eine Durchsage. Ist die Aussage richtig oder falsch? Sie hören den Text einmal.
    voice: Flo
    text: >-
      Liebe Kundinnen und Kunden! Heute im Angebot: Tomaten aus Italien, das Kilo nur zwei Euro
      zwanzig. Und Orangen aus Spanien: Das Kilo kostet heute nur zwei Euro neunzig. Das
      Angebot gibt es nur heute. Vielen Dank für Ihren Einkauf!
    statement: Ein Kilo Orangen kostet heute 2,20 €.
    answer: false
  anzeigen:
    kind: ads
    part: lesen-2
    title: Lesen, Teil 2
    situation: Sie brauchen eine Jacke für den Winter. Sie haben nur 40 Euro. Welches Geschäft passt?
    options:
      - title: Mode Lena
        text: "Sommer-Sale!

          T-Shirts, Kleider und Hosen

          alles 50 % billiger

          nur bis Samstag"
      - title: Kaufhaus Schulze
        text: "Neu: Jacken und Mäntel für den Winter

          Jacken ab 35 €

          Größen S bis XXL"
    answer: 1
  tuete:
    kind: card
    part: sprechen-3
