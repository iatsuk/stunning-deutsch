tables:
  akkusativ:
    title: Nominativ und Akkusativ
    ru: Именительный и винительный падеж
    head: [Род, Nominativ, Akkusativ]
    ruCols: [0]
    rows:
      - [мужской, "d+er / ein / kein Kaffee", "d+en / ein+en / kein+en Kaffee"]
      - [женский, "die / eine / keine Suppe", "die / eine / keine Suppe"]
      - [средний, "das / ein / kein Ei", "das / ein / kein Ei"]
      - [мн. ч., "die / – / keine Eier", "die / – / keine Eier"]
    note: "Меняется только мужской род: *der* → *den*, *ein* → *einen*, *kein* → *keinen*."
  moechten:
    title: möchten
    ru: хотел бы
    head: [Person, möchten, Beispiel]
    rows:
      - [ich, möcht+e, Ich möchte ein+en Tee.]
      - [du, möcht+est, Möchtest du ein+en Kaffee?]
      - [er / sie / es, möcht+e, Marco möchte ein Stück Kuchen.]
      - [wir, möcht+en, Wir möchten die Speisekarte.]
      - [ihr, möcht+et, Möchtet ihr eine Pizza?]
      - [sie / Sie, möcht+en, Was möchten Sie?]
    note: "У *ich* и *er / sie / es* формы совпадают: *er möchte* — без *-t*."
  negation:
    title: nicht oder kein?
    ru: Отрицание
    head: [Что отрицаем, Negation, Beispiel]
    ruCols: [0]
    rows:
      - [существительное с неопределённым артиклем, kein, Ich möchte kein+en Kaffee.]
      - [существительное без артикля, kein, Ich esse kein Fleisch.]
      - [глагол или наречие, nicht, Ich koche nicht gern.]
      - [прилагательное, nicht, Die Suppe ist nicht warm.]
      - [существительное с определённым артиклем, nicht, Ich esse den Kuchen nicht.]
    note: "*kein* склоняется как *ein*: *keinen Kaffee*, *keine Suppe*, *kein Fleisch*."
  verben:
    title: "essen, nehmen, trinken"
    ru: Глаголы за столом
    head: [Person, essen, nehmen, trinken]
    rows:
      - [ich, ess+e, nehm+e, trink+e]
      - [du, iss+t, nimm+st, trink+st]
      - [er / sie / es, iss+t, nimm+t, trink+t]
      - [wir, ess+en, nehm+en, trink+en]
      - [ihr, ess+t, nehm+t, trink+t]
      - [sie / Sie, ess+en, nehm+en, trink+en]
    note: "*essen* и *nehmen* меняют *e* на *i* только у *du* и *er / sie / es* — как *sprechen*."

