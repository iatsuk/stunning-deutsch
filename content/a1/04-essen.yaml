id: essen
order: 4
title: "Einen Kaffee, bitte!"
ru: Еда и напитки
lede: >-
  После занятий Анна и Марко идут в кафе, а вечером Марко готовит ужин.
  Учимся заказывать, платить и рассказывать, что мы любим и чего не едим, —
  и знакомимся с винительным падежом, который меняет артикль мужского рода.
goals:
  - Заказать еду и напитки в кафе и расплатиться — вместе или раздельно
  - Рассказать, что вы любите, а чего не едите и не пьёте
  - Выбрать правильное отрицание — *nicht* или *kein*
  - Попросить о чём-то по картинке и ответить на просьбу, как на устном экзамене
grammar:
  - "Винительный падеж: den, einen, keinen"
  - Глагол möchten
  - nicht или kein
  - gern
exam: [sprechen-2, sprechen-3, hoeren-1]

dialogues:
  cafe:
    title: Im Café
    ru: В кафе
    place: Café am Markt, Leipzig
    people:
      K: { name: Kellner, voice: Eddy }
      A: { name: Anna, voice: Anna }
      M: { name: Marco, voice: Reed }
    lines:
      - K: Guten Tag! Was möchten Sie?
        ru: Добрый день! Что желаете?
      - A: Ich möchte einen Tee, bitte.
        ru: Мне, пожалуйста, чай.
      - M: Und ich nehme einen Kaffee und ein Stück Apfelkuchen.
        ru: А я возьму кофе и кусок яблочного пирога.
      - K: Möchten Sie auch ein Stück Kuchen?
        ru: Вы тоже будете пирог?
      - A: Nein, danke. Ich habe keinen Hunger.
        ru: Нет, спасибо. Я не голодна.
      - M: Zahlen, bitte!
        ru: Рассчитайте нас, пожалуйста!
      - K: Zusammen oder getrennt?
        ru: Вместе или раздельно?
      - M: Zusammen. Heute zahle ich!
        ru: Вместе. Сегодня плачу я!
      - K: Das macht elf Euro.
        ru: С вас одиннадцать евро.
      - M: Zwölf, bitte.
        ru: Возьмите двенадцать.
  kochen:
    title: Was isst du gern?
    ru: Что ты любишь есть?
    place: Goethestraße, Leipzig
    people:
      M: { name: Marco, voice: Reed }
      A: { name: Anna, voice: Anna }
    lines:
      - M: Heute koche ich! Isst du gern Pasta?
        ru: Сегодня готовлю я! Ты любишь пасту?
      - A: Ja, sehr gern! Aber ich esse kein Fleisch.
        ru: Да, очень! Но я не ем мяса.
      - M: Kein Problem. Dann mache ich Pasta mit Tomaten und Käse.
        ru: Не проблема. Тогда я сделаю пасту с помидорами и сыром.
      - A: Super! Kochst du oft?
        ru: Супер! Ты часто готовишь?
      - M: Ja, ich koche sehr gern. Und du?
        ru: Да, я очень люблю готовить. А ты?
      - A: Ich koche nicht gern. Aber ich backe gern Kuchen.
        ru: Я не люблю готовить. Зато люблю печь пироги.
      - M: Und was trinkst du? Ein Glas Wein?
        ru: А что ты будешь пить? Бокал вина?
      - A: Nein, danke. Ich trinke keinen Alkohol. Ein Wasser, bitte.
        ru: Нет, спасибо. Я не пью алкоголь. Воды, пожалуйста.
  hoeren:
    title: Im Restaurant
    ru: В ресторане
    people:
      K: { name: Kellner, voice: Eddy }
      F: { name: Frau, voice: Sandy }
    lines:
      - K: Guten Tag! Was trinken Sie? Einen Kaffee?
        ru: Добрый день! Что будете пить? Кофе?
      - F: Nein, danke, ich trinke keinen Kaffee.
        ru: Нет, спасибо, я не пью кофе.
      - K: Vielleicht einen Tee?
        ru: Может быть, чай?
      - F: Ja, gern. Einen Tee, bitte.
        ru: Да, с удовольствием. Чай, пожалуйста.
      - K: Mit Milch?
        ru: С молоком?
      - F: Nein, ohne Milch. Und ein Glas Wasser, bitte.
        ru: Нет, без молока. И стакан воды, пожалуйста.

