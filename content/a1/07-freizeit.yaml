tables:
  modal:
    title: können und wollen
    ru: уметь, мочь и хотеть
    head: [ Person, können, wollen ]
    rows:
      - [ ich, kann, will ]
      - [ du, kann+st, will+st ]
      - [ er / sie / es, kann, will ]
      - [ wir, könn+en, woll+en ]
      - [ ihr, könn+t, woll+t ]
      - [ sie / Sie, könn+en, woll+en ]
    note: "В единственном числе меняется гласная, а у *ich* и *er* нет окончания: *ich kann*, *er
      kann*."
  gern:
    title: gern – lieber – am liebsten
    ru: люблю — больше люблю — больше всего люблю
    head: [ Wort, Beispiel, По-русски ]
    ruCols: [ 2 ]
    rows:
      - [ gern, Ich schwimme gern., Я люблю плавать. ]
      - [ lieber, Ich spiele lieber Tennis., Я больше люблю теннис. ]
      - [ am liebsten, Am liebsten lese ich., Больше всего я люблю читать. ]
      - [ nicht gern, Ich koche nicht gern., Я не люблю готовить. ]
    note: "Как «хорошо — лучше — лучше всего»: формы не образуются по правилу, их надо запомнить."
  verabreden:
    title: Verabredungen
    ru: Договориться о встрече
    head: [ Vorschlag, Ja, Nein ]
    rows:
      - [ Hast du am Samstag Zeit?, "Ja, gern!", Leider nicht. ]
      - [ Kommst du mit?, Gute Idee!, "Schade, ich kann nicht." ]
      - [ Wollen wir zusammen kochen?, "Ja, das passt.", Am Samstag kann ich leider nicht. ]
      - [ Um sieben?, "Ja, um sieben!", Lieber um acht. ]
    note: "Отказываясь, назовите причину или другой день: *Leider nicht. Aber am Freitag habe ich
      Zeit.*"

tasks:
  kursfest:
    kind: message
    part: lesen-1
    title: Lesen, Teil 1
    situation: Lesen Sie die E-Mail. Ist die Aussage richtig oder falsch?
    from: Frau Petersen
    to: Kurs A1
    subject: Kursfest am Freitag
    text: |
      Liebe Kursteilnehmerinnen und Kursteilnehmer,
      am Freitag machen wir ein Kursfest! Es fängt um 18 Uhr an und hört um 21 Uhr auf.
      Wer kann einen Salat oder einen Kuchen mitbringen? Die Getränke kauft die Schule.
      Viele Grüße
      Kerstin Petersen
    statement: Die Kursteilnehmer kaufen die Getränke.
    answer: false
  antwort:
    kind: message
    part: schreiben-2
    title: Schreiben, Teil 2
    situation: >-
      Ihre Freundin Elif schreibt Ihnen. Sie können am Samstag nicht kommen. Antworten Sie
      Elif. Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie
      Anrede und Gruß nicht.
    from: Elif
    subject: Party am Samstag
    text: |
      Hallo Dana!
      Am Samstag habe ich Geburtstag. Ich mache um 19 Uhr eine Party. Kommst du?
      Liebe Grüße
      Elif
    points:
      - Dank für die Einladung
      - Warum können Sie nicht kommen?
      - "Neuer Termin: Tag und Uhrzeit"
    sample:
      - Liebe Elif,
      - danke für die Einladung!
      - Leider kann ich am Samstag nicht kommen.
      - Mein Bruder aus Kasachstan besucht mich.
      - Wollen wir am Sonntag zusammen frühstücken?
      - Um zehn Uhr habe ich Zeit.
      - Viele Grüße
      - Dana
  karte:
    kind: card
    part: sprechen-2
    title: Sprechen, Teil 2
    situation: Fragen Sie Ihren Partner und antworten Sie.
    theme: Freizeit
    word: Wochenende
    sample:
      - Was machst du am Wochenende?
      - Am Samstag arbeite ich. Am Sonntag spiele ich Tennis.
  teamplan:
    kind: message
    part: lesen-1
    title: Zeit für die Freunde
    from: Gruppenchat
    text: |-
      Dana: Am Sonntag habe ich von 17 bis 20 Uhr Zeit.
      Mateo: Am Samstag arbeite ich. Am Sonntag kann ich von 17 bis 19 Uhr kommen.
      Elif: Am Sonntag habe ich ab 17.30 Uhr Zeit.
      Treffpunkt: Kiellinie.

steps:
  - id: plaene
    chapter: scene
    title: Планы на выходные
    beats:
      - read: >-
          Четверг, перемена. Дана спрашивает Матео о планах: *Was machst du am Wochenende?* В
          субботу Матео, как мы уже знаем, работает, а в воскресенье свободен. Дана зовёт его
          плавать: *Ich will am Sonntag schwimmen. Kommst du mit?* Заметьте: *will* — «хочу» —
          стоит на втором месте, а *schwimmen* — в самом конце. И знакомый по прошлой теме
          глагол с приставкой: *mitkommen* — *Kommst du mit?*
        point: "*Ich will am Sonntag schwimmen.* — *will* второй, *schwimmen* в конце"
        set: { view: dialogue, dialogue: wochenende, reveal: 3, focus: [ 0, 2 ] }
      - read: >-
          Но плавать Матео почти не умеет: *Ich kann nicht gut schwimmen* — «я плохо плаваю»,
          буквально «не умею хорошо плавать». Тогда Дана предлагает теннис: *Kannst du Tennis
          spielen?* *können* здесь значит «уметь». А Матео отвечает с *gern*: *Tennis spiele
          ich sehr gern* — «в теннис я играю очень охотно». Чтобы сказать «люблю что-то
          делать», немцы не берут глагол «любить», а добавляют *gern*.
        point: "*Kannst du Tennis spielen?* — «умеешь?»; *gern* — «люблю делать»"
        set: { reveal: 6, focus: [ 3, 4, 5 ] }
      - read: >-
          Осталось договориться о времени. *Wollen wir um zehn Uhr spielen?* — так по-немецки
          звучит «давай сыграем в десять?». Но в десять Матео ещё спит: по воскресеньям он
          отсыпается. Он предлагает своё: *Lieber um zwölf* — «лучше в двенадцать». *lieber* —
          сравнительная степень от *gern*. Дана соглашается: *Gut, um zwölf. Bis Sonntag!* —
          «до воскресенья!».
        point: "*Wollen wir …?* — «давай …?»; *Lieber um zwölf.* — «лучше в двенадцать»"
        set: { reveal: 9, focus: [ 6, 7, 8 ] }

  - id: telefon
    chapter: scene
    title: Звонок Хауке
    beats:
      - read: >-
          Вечером Дане звонит Хауке — знакомый по клубу и языковому тандему. Он представляется:
          *Hallo Dana, hier ist Hauke* — и спрашивает *Hast du am Samstag Zeit?* Хауке зовёт на
          барбекю. Дана отвечает *Am Samstag kann ich leider nicht. Mein Bruder besucht mich.*
          Это обычный вежливый отказ: способность и свободное время здесь важнее буквального
          перевода «могу».
        point: "*Hast du am Samstag Zeit?* Отказ: *Am Samstag kann ich leider nicht.*"
        set: { view: dialogue, dialogue: telefon, reveal: 4, focus: [ 0, 2, 3 ] }
      - read: >-
          Дана предлагает альтернативу: *Aber am Sonntag habe ich Zeit. Wollen wir zusammen
          kochen?* Хауке отвечает *Gute Idee!* Они договариваются на *Um sieben* — воскресный
          вечер, после встречи команды у воды. Уточнять время полезнее, чем угадывать по одному
          числу. Вежливый отказ может сопровождаться причиной и новым предложением; это удобная
          схема для экзаменационного сообщения, а не обязательное правило поведения для всех
          немцев.
        point: "*Aber am Freitag habe ich Zeit.* — после отказа предложите другой день"
        set: { reveal: 9, focus: [ 5, 6, 7, 8 ] }
  - id: am-wasser
    chapter: scene
    title: Что выберем для всей команды?
    beats:
      - read: "У Матео есть опыт паруса: *Ich kann segeln*. Но его план на воскресенье другой: *Ich
          will lieber fotografieren*. Дана тоже выбирает фотографии у воды, Элиф говорит *Am
          liebsten fotografiere ich am Wasser*. Здесь важно различить три вещи: что человек
          умеет, что любит вообще и что хочет сейчас. Для общей встречи на Kiellinie в 17:30
          друзья выбирают фотографии; теннис в полдень и вечерняя встреча — разные события."
        point: "*kann* — возможность; *will lieber* — текущий выбор; *am liebsten* — предпочтение"
        set:
          view: dialogue
          dialogue: hafen
          reveal: 3

  - id: hobbys
    chapter: words
    title: Хобби
    beats:
      - read: >-
          Хобби по-немецки — чаще всего глагол или пара «существительное + глагол»:
          *schwimmen*, *Tennis spielen*, *Fahrrad fahren*. Обратите внимание: «играть в теннис»
          и «играть на гитаре» — одно и то же *spielen*, без всяких предлогов: *Tennis
          spielen*, *Gitarre spielen*. А у *lesen*, *fahren* и *treffen* в единственном числе
          меняется гласная: *du liest*, *er fährt*, *du triffst*.
        point: "*Tennis spielen*, *Gitarre spielen* — без предлогов, в отличие от русского"
        set: { view: words, words: hobbys }

  - id: orte
    chapter: words
    title: Куда пойти
    beats:
      - read: >-
          Где проводят свободное время — в кино, в бассейне, в парке. Род опять не совпадает с
          русским: *das Kino*, *das Konzert*, *das Schwimmbad* — среднего рода. Слова из
          английского — *das Hobby*, *die Party* — образуют множественное число на *-s*:
          *Hobbys*, *Partys*. А «пойти в кино» удобнее выучить целиком, как готовую фразу: *ins
          Kino gehen*.
        point: "*das Kino*, *das Konzert*, *das Schwimmbad*; *Hobbys*, *Partys* — мн. ч. на *-s*"
        set: { view: words, words: freizeit }

  - id: wiegern
    chapter: words
    title: Как охотно и как часто
    beats:
      - read: >-
          «Люблю» о занятиях по-немецки говорят не глаголом, а наречием *gern*: *Ich schwimme
          gern* — «я люблю плавать», буквально «плаваю охотно». Сравнительная степень —
          *lieber*, превосходная — *am liebsten*. Это другие слова, как «хорошо — лучше».
          Частоту называют словами *immer*, *oft*, *manchmal*, *nie*. Они, как и *gern*, обычно
          стоят в середине: *Ich spiele oft Tennis.*
        point: "*Ich schwimme gern.* — «люблю плавать»; *gern*, *lieber*, *am liebsten*"
        set: { view: words, words: wiegern }

  - id: verabredung
    chapter: words
    title: Слова для встречи
    beats:
      - read: >-
          *Hast du Zeit?* — «ты свободен?». *mitkommen* — «пойти вместе» — глагол с отделяемой
          приставкой, как в прошлой теме: *Kommst du mit?* *einladen* — «приглашать» — тоже с
          приставкой и со сменой гласной: *er lädt ein*. *Das passt* — «мне подходит». А если
          не получается, пригодятся *leider* и *schade* — «к сожалению» и «жаль». И два новых
          глагола темы: *können* и *wollen*.
        point: "*Hast du Zeit?* — *Kommst du mit?* — *Das passt.* / *Leider nicht.*"
        set: { view: words, words: treffen }

  - id: modal
    chapter: grammar
    title: Уметь, мочь и хотеть
    beats:
      - read: >-
          *können* закрывает сразу два русских глагола: «уметь» — *Ich kann schwimmen* — и
          «мочь» — *Am Samstag kann ich nicht*. В единственном числе гласная меняется: не
          *könn-*, а *kann*. И главное отличие от обычных глаголов: у *ich* и *er* нет
          окончания, обе формы — просто *kann*. Сказать *er kannt* по образцу *er kommt* —
          очень частая ошибка. Это то же семейство, что *möchte* из темы о еде: *ich möchte* —
          *er möchte*, тоже без *-t*.
        point: "*können* — «уметь» и «мочь»: *ich kann*, *du kannst*, *er kann*"
        set: { view: table, table: modal, reveal: 3 }
      - read: >-
          *wollen* — «хотеть», и устроен так же: *ich will*, *du willst*, *er will*, во
          множественном — *wollen*. Осторожно с английским: *will* здесь не будущее время, а
          «хочу». И ещё нюанс: *Ich will* звучит твёрдо, почти требовательно. В кафе или в
          магазине вежливее *Ich möchte* из темы о еде. А о планах с друзьями — *Ich will am
          Sonntag schwimmen* — говорить нормально.
        point: "*ich will*, *du willst*, *er will*; просьба вежливее — *Ich möchte …*"
        set: { reveal: 6 }

  - id: ende
    chapter: grammar
    title: Инфинитив — в конец
    beats:
      - read: >-
          Возьмём простое предложение: *Ich spiele Tennis.* Глагол *spiele* на второй позиции,
          поле «конец» пустое — это вы знаете с первой темы. Теперь Матео хочет сказать, что
          умеет играть. В русском мы просто поставим «умею» перед «играть», и оба глагола
          окажутся рядом. Смотрите на схему: в немецком второй глагол рядом с первым не
          останется.
        point: "*Ich spiele Tennis.* — один глагол, поле «конец» пустое"
        set:
          view: sentence
          rows:
            - de: [ Ich, spiel+e, Tennis., "" ]
              ru: Я играю в теннис.
      - read: >-
          *Ich kann Tennis spielen.* На второе место встаёт модальный глагол *kann* — он и
          спрягается. А *spielen* уезжает в самый конец и теряет личное окончание: было
          *spiel+e*, стало *spiel+en*. Получается такая же рамка, как с отделяемой приставкой:
          *Ich stehe um sieben auf* — *Ich kann Tennis spielen*. Типичная ошибка — *Ich kann
          spielen Tennis*, по-русски или по-английски.
        point: "*Ich kann Tennis spielen.* — модальный глагол второй, инфинитив в конце"
        set:
          rows:
            - de: [ Ich, kann, Tennis, spiel+en. ]
              ru: Я умею играть в теннис.
      - read: >-
          В вопросах рамка сохраняется. Вопрос да/нет начинается с модального глагола: *Kannst
          du Tennis spielen?* — «ты умеешь играть в теннис?». В W-вопросе первым идёт
          вопросительное слово: *Was willst du am Sonntag machen?* — «что ты хочешь делать в
          воскресенье?». Всё, что между двумя глаголами, — середина: подлежащее, время,
          дополнение. Инфинитив всегда замыкает предложение.
        point: "*Kannst du Tennis spielen?* — *Was willst du am Sonntag machen?*"
        set:
          rows:
            - de: [ "", Kann+st, du Tennis, spiel+en? ]
              ru: Ты умеешь играть в теннис?
            - de: [ Was, will+st, du am Sonntag, mach+en? ]
              ru: Что ты хочешь делать в воскресенье?
      - read: >-
          *nicht* стоит перед инфинитивом: *Ich kann nicht gut schwimmen.* А в отказе инфинитив
          часто опускают совсем — и так понятно, о чём речь: *Am Samstag kann ich leider
          nicht.* Поле «конец» пустеет, рамки нет. По-русски тоже говорят просто «не могу».
          Добавьте *leider* — и отказ прозвучит вежливо.
        point: "*Ich kann nicht gut schwimmen.* Отказ: *Am Samstag kann ich leider nicht.*"
        set:
          rows:
            - de: [ Ich, kann, nicht gut, schwimm+en. ]
              ru: Я плохо плаваю.
            - de: [ Am Samstag, kann, ich leider nicht., "" ]
              ru: В субботу я, к сожалению, не могу.

  - id: gern
    chapter: grammar
    title: Люблю, больше люблю, больше всего
    beats:
      - read: >-
          К глаголу добавляем *gern*: *Ich schwimme gern*. Сравнение — *lieber*, предпочтение
          среди всех вариантов — *am liebsten*. Матео предлагает *Lieber um zwölf*, когда
          выбирает время тенниса. Не нужно механически заменять «люблю» на *lieben*: для
          обычных предпочтений проще *gern*. Если *lieben* относится к занятию, у него другая
          конструкция; её разберём позже. «Не люблю готовить» — *Ich koche nicht gern*.
        point: "*gern* — люблю, *lieber* — больше люблю, *am liebsten* — больше всего"
        set: { view: table, table: gern }

  - id: verabreden
    chapter: grammar
    title: Предложить, согласиться, отказаться
    beats:
      - read: >-
          Для встречи нужны предложение, ответ и подтверждение. Предложить: *Hast du am Samstag
          Zeit?*, *Kommst du mit?*, *Wollen wir …?* Согласиться: *Ja, gern!*, *Gute Idee!*,
          *Das passt.* Отказаться: *Leider nicht.* Если хотите продолжить общение, добавьте
          причину или предложите другой день: *Mein Bruder besucht mich. Aber am Sonntag habe
          ich Zeit.* Не считайте умение человека согласием: *Ich kann segeln* ещё не
          приглашение выйти под парусом.
        point: "Отказ = *leider* + причина + новый день: *Aber am Freitag habe ich Zeit.*"
        set: { view: table, table: verabreden }

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как сказать «К сожалению, я не могу пойти с вами»?
        read: >-
          *Ich kann leider nicht mitkommen.* Помните *Kommst du mit?* — там приставка *mit*
          стоит в конце отдельно. С модальным глаголом *mitkommen* уходит в конец целиком и
          снова пишется одним словом: инфинитив не разрывается. *leider* и *nicht* — в
          середине, перед инфинитивом. Так же: *Ich will um sechs aufstehen*, *Kannst du heute
          einkaufen?*
        point: "С модальным глаголом приставка не отрывается: *Ich kann nicht mitkommen.*"
        before:
          view: sentence
          rows:
            - de: [ "", Komm+st, du, mit? ]
              ru: Ты пойдёшь с нами?
        set:
          view: sentence
          rows:
            - de: [ "", Komm+st, du, mit? ]
              ru: Ты пойдёшь с нами?
            - de: [ Ich, kann, leider nicht, mitkomm+en. ]
              ru: К сожалению, я не могу пойти с вами.
      - question: Как сказать «Больше всего я люблю читать»?
        read: >-
          *Am liebsten lese ich.* «Люблю» снова передаёт наречие, а не глагол. Для
          выразительности немцы охотно ставят *am liebsten* на первое место, и тогда глагол,
          как всегда, второй, а *ich* уходит за него. Можно сказать и спокойнее: *Ich lese am
          liebsten.* А вот *Am liebsten ich lese* — ошибка: между первой позицией и глаголом
          ничего не помещается.
        point: "*Am liebsten lese ich.* — на первом месте, глагол всё равно второй"
        set:
          rows:
            - de: [ Am liebsten, les+e, ich., "" ]
              ru: Больше всего я люблю читать.
      - question: "Как предложить: «Давай в воскресенье поиграем в теннис»?"
        read: >-
          *Wollen wir am Sonntag Tennis spielen?* Русское «давай…» по-немецки — вопрос с
          *wollen*: модальный глагол первым, потом *wir*, инфинитив в конце. Это не «хотим ли
          мы?», а приглашение, и отвечают на него *Ja, gern!* или *Gute Idee!* Сравните с
          утверждением: *Wir wollen am Sonntag Tennis spielen* — «мы хотим в воскресенье
          поиграть в теннис».
        point: "«Давай …?» — *Wollen wir am Sonntag Tennis spielen?*"
        set:
          rows:
            - de: [ "", Woll+en, wir am Sonntag Tennis, spiel+en? ]
              ru: Давай в воскресенье поиграем в теннис?

  - id: lesen
    chapter: exam
    title: "Чтение: записка"
    beats:
      - question: Правда ли, что напитки для праздника покупают участники курса?
        read: >-
          *Falsch.* В первой части чтения — две короткие записки или письма и утверждения к
          ним: *richtig* или *falsch*. Ловушка обычно в деталях: слова те же, но речь о другом
          человеке или дне. Здесь есть и *kaufen*, и *Getränke*, но покупает их школа: *Die
          Getränke kauft die Schule.* Первым стоит дополнение, а подлежащее — после глагола.
          Участники приносят салат или пирог.
        point: "*Die Getränke kauft die Schule.* — подлежащее ищите и после глагола"
        before: { view: task, task: kursfest }
        set: { solved: true }

  - id: schreiben
    chapter: exam
    title: "Письмо: ответ на приглашение"
    beats:
      - read: >-
          Вторая часть письменного экзамена — короткое сообщение, около 30 слов. В задании
          описана ситуация и даны три пункта, *Leitpunkte*. На каждый — одно-два предложения.
          Пропустите пункт — потеряете баллы: за каждый дают до трёх, ещё один — за оформление.
          Оформление — это обращение и подпись: *Liebe Elif,* или *Lieber Mateo,* в начале,
          *Viele Grüße* в конце.
        point: "*Schreiben*, часть 2: около 30 слов, три пункта, обращение и подпись"
        set: { view: task, task: antwort, reveal: 0 }
      - read: >-
          Образец закрывает все три пункта. Благодарность: *danke für die Einladung!* Причина:
          *Leider kann ich am Samstag nicht kommen. Mein Bruder aus Kasachstan besucht mich.*
          Новый день и время: *Wollen wir am Sonntag zusammen frühstücken? Um zehn Uhr habe ich
          Zeit.* Модальный глагол на втором месте, инфинитив в конце. Длинные фразы не нужны:
          оценивают, понятно ли и всё ли вы сказали.
        point: "Спасибо + причина + новый день — по одному-два предложения на пункт"
        set: { reveal: 8 }

  - id: sprechen
    chapter: exam
    title: "Устный экзамен: часть 2"
    beats:
      - read: >-
          Во второй части устного экзамена каждый тянет карточку: сверху тема, в центре слово.
          По этому слову нужно задать вопрос партнёру, а потом ответить на его вопрос. Тема
          здесь — *Freizeit*, слово — *Wochenende*. За вопрос дают два балла, за ответ — один.
          Вопрос должен быть настоящим вопросом и содержать слово с карточки.
        point: "*Sprechen*, часть 2: по слову с карточки задать вопрос и ответить партнёру"
        set: { view: task, task: karte }
      - question: Какой вопрос задать по карточке *Wochenende*?
        read: >-
          Самый простой — *Was machst du am Wochenende?* Слово с карточки стоит в вопросе,
          глагол на втором месте. Можно и с модальным глаголом: *Was willst du am Wochenende
          machen?* Отвечайте коротко, но полным предложением: *Am Sonntag spiele ich Tennis.*
          Если партнёр говорит с вами на *Sie*, отвечайте так же: *Was machen Sie am
          Wochenende?*
        point: "*Was machst du am Wochenende?* — слово с карточки прямо в вопросе"
        set: { solved: true }

exercises:
  - type: choice
    q: Ich ___ leider nicht kommen.
    options: [ kann, kanne, kannt ]
    answer: 0
    why: "*ich kann* — без окончания, как и *er kann*."
  - type: gap
    q: ___ du Tennis spielen?
    answer: [ Kannst ]
    hint: können
    ru: Ты умеешь играть в теннис?
  - type: gap
    q: Dana ___ am Sonntag schwimmen.
    answer: [ will ]
    hint: wollen
    why: "*er / sie will* — без окончания, как и *ich will*."
  - type: gap
    q: ___ ihr am Freitag kommen?
    answer: [ Könnt ]
    hint: können
    why: "*ihr könnt* — во множественном числе возвращается *ö*."
  - type: gap
    q: Was ___ du am Wochenende machen?
    answer: [ willst ]
    hint: wollen
    why: "*du willst* — *i* в единственном числе и окончание *-st*."
  - type: choice
    q: Mateo kann nicht gut ___.
    options: [ schwimmt, schwimmen, schwimme ]
    answer: 1
    why: "После модального глагола — инфинитив, и он стоит в конце."
  - type: choice
    q: Какое предложение верное?
    options: [ Ich will spielen Tennis., Ich will Tennis spielen., Ich Tennis spielen will. ]
    answer: 1
    why: "Инфинитив — в самом конце: *Ich will Tennis spiel+en.*"
  - type: order
    ru: Я умею играть на гитаре.
    also: ["Gitarre spielen kann ich.", "Gitarre kann ich spielen."]
    de: Ich kann Gitarre spielen.
  - type: order
    ru: В субботу я хочу почитать.
    de: Am Samstag will ich lesen.
    also: ["Ich will am Samstag lesen.", "Lesen will ich am Samstag."]
    why: "*Am Samstag* на первом месте — *will* второй, *ich* за ним, *lesen* в конце."
  - type: order
    ru: К сожалению, я не могу пойти с вами.
    de: Ich kann leider nicht mitkommen.
    also: [ Leider kann ich nicht mitkommen. ]
  - type: choice
    q: Как сказать «В футбол я люблю играть больше» (чем в теннис)?
    options: [ Ich spiele gern Fußball., Ich spiele lieber Fußball., Ich spiele am liebsten Fußball. ]
    answer: 1
    why: "*lieber* — «больше люблю»: сравниваем два занятия. *am liebsten* — «больше всего», из
      всех."
  - type: choice
    q: ___ lese ich. Das ist mein Hobby Nummer eins!
    options: [ Gern, Lieber, Am liebsten ]
    answer: 2
    why: "*am liebsten* — «больше всего», лучшее из всех."
  - type: choice
    q: Hast du am Freitag Zeit? – ___ Da arbeite ich.
    options: [ Gute Idee!, Leider nicht., "Ja, gern!" ]
    answer: 1
    why: "Отказ — *Leider nicht.* — и сразу причина: *Da arbeite ich.*"
  - type: choice
    q: Как предложить другу вместе приготовить ужин?
    options: [ Wollen wir zusammen kochen?, Wir wollen zusammen kochen., Willst du kochen zusammen? ]
    answer: 0
    why: "*Wollen wir …?* — «давай …?»: глагол первым, инфинитив в конце."
  - type: gap
    q: Am Samstag ___ ich leider nicht. Mein Bruder ___ mich.
    answer: [ kann, besucht ]
    hint: können / besuchen
    ru: В субботу я, к сожалению, не могу. Ко мне приезжает брат.
  - type: choice
    q: Mateo kann segeln, aber er will lieber fotografieren. Was möchte er jetzt machen?
    options:
      - fotografieren
      - segeln
      - schlafen
    answer: 0
    why: "*kann* — умение, *will lieber* — нынешнее предпочтение."
  - type: order
    ru: Мы хотим вместе фотографировать.
    also: ["Zusammen wollen wir fotografieren.", "Fotografieren wollen wir zusammen."]
    de: Wir wollen zusammen fotografieren.
