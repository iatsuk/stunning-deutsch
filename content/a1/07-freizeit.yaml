id: freizeit
order: 7
title: Hast du am Samstag Zeit?
ru: Досуг и встречи
lede: >-
  Воскресная встреча назначена на 17:30. Теперь нужно выбрать занятие, которое подходит
  друзьям: парус, фотографии у воды или что-то ещё. Дана и Матео сравнивают желания и
  возможности, Хауке звонит с приглашением, а Элиф ждёт ответа на своё. Учимся соглашаться,
  отказываться и предлагать другой план.
goals:
  - Рассказать, что вы умеете и хотите делать в свободное время
  - Сказать, что вы любите, что любите больше и что больше всего
  - Предложить встречу, согласиться или вежливо отказаться и назвать другой день
  - Написать короткий ответ на приглашение, как во второй части письменного экзамена
grammar:
  - Модальные глаголы können и wollen
  - Инфинитив в конце
  - gern, lieber, am liebsten
  - Предложить, согласиться, отказаться
exam: [ schreiben-2, sprechen-2, lesen-1 ]

dialogues:
  wochenende:
    title: Was machst du am Wochenende?
    ru: Что ты делаешь в выходные?
    place: Sprachschule Förde, Kiel
    people:
      A: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
    lines:
      - A: Mateo, was machst du am Wochenende?
        ru: Матео, что ты делаешь в выходные?
      - M: Am Samstag arbeite ich. Aber am Sonntag habe ich Zeit.
        ru: В субботу я работаю. Но в воскресенье я свободен.
      - A: Ich will am Sonntag schwimmen. Kommst du mit?
        ru: Я хочу в воскресенье поплавать. Пойдёшь со мной?
      - M: Schwimmen? Hm … ich kann nicht gut schwimmen.
        ru: Плавать? Хм… я плохо плаваю.
      - A: Und Tennis? Kannst du Tennis spielen?
        ru: А теннис? Ты умеешь играть в теннис?
      - M: Ja! Tennis spiele ich sehr gern.
        ru: Да! В теннис я играю с большим удовольствием.
      - A: Super! Wollen wir um zehn Uhr spielen?
        ru: Супер! Давай сыграем в десять?
      - M: Um zehn? Da schlafe ich noch! Lieber um zwölf.
        ru: В десять? Я тогда ещё сплю! Лучше в двенадцать.
      - A: Gut, um zwölf. Bis Sonntag!
        ru: Хорошо, в двенадцать. До воскресенья!
  telefon:
    title: Am Telefon
    ru: По телефону
    people:
      J:
        name: Hauke
        voice: Rocko
      A: { name: Dana, voice: Anna }
    lines:
      - J: Hallo Dana, hier ist Hauke. Hast du am Samstag Zeit?
        ru: Привет, Дана, это Хауке. Ты свободна в субботу?
      - A: Hallo Hauke! Warum?
        ru: Привет, Хауке! А что?
      - J: Wir wollen am Samstag grillen. Kommst du mit?
        ru: Мы хотим в субботу устроить барбекю. Пойдёшь с нами?
      - A: Am Samstag kann ich leider nicht. Mein Bruder besucht mich.
        ru: В субботу я, к сожалению, не могу. Ко мне приезжает брат.
      - J: Oh, schade!
        ru: Ой, жаль!
      - A: Aber am Sonntag habe ich Zeit. Wollen wir zusammen kochen?
        ru: Но в пятницу я свободна. Давай вместе что-нибудь приготовим?
      - J: Gute Idee! Um wie viel Uhr?
        ru: Отличная идея! Во сколько?
      - A: Um sieben?
        ru: В семь?
      - J: Ja, das passt. Bis Sonntag!
        ru: Да, мне подходит. До пятницы!
  hafen:
    title: Können und wollen
    ru: Уметь и хотеть — разные вещи
    place: Парусный клуб на Kiellinie · учебный план
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
    lines:
      - D: Ich will am Sonntag lieber am Wasser fotografieren.
        ru: Я хочу в воскресенье лучше пофотографировать у воды.
      - M: Ich kann segeln. Aber am Sonntag will ich lieber fotografieren.
        ru: Я умею ходить под парусом. Но в воскресенье я лучше пофотографирую.
      - E: Ich fotografiere sehr gern. Am liebsten fotografiere ich am Wasser.
        ru: Я очень люблю фотографировать. Больше всего — у воды.

