tables:
  possessiv:
    title: Possessivartikel
    ru: Чей? — притяжательные слова
    head: [Person, "der · das", "die · Plural", По-русски]
    ruCols: [3]
    rows:
      - [ich, mein, mein+e, "мой, моя, мои"]
      - [du, dein, dein+e, твой]
      - [er / es, sein, sein+e, его]
      - [sie, ihr, ihr+e, её]
      - [wir, unser, unser+e, наш]
      - [ihr, euer, eur+e, "ваш — друзьям"]
      - [sie, ihr, ihr+e, их]
      - [Sie, Ihr, Ihr+e, "Ваш — вежливо"]
    note: "Корень — по владельцу, окончание — по слову после него: *sein Sohn*, *seine Tochter*."
  einkein:
    title: "ein, kein, mein"
    ru: Артикли и отрицание
    head: [Артикль, der Bruder, die Schwester, das Kind, die Kinder]
    ruCols: [0]
    rows:
      - [определённый, der, die, das, die]
      - [неопределённый, ein, ein+e, ein, "–"]
      - [отрицание, kein, kein+e, kein, kein+e]
      - [притяжательный, mein, mein+e, mein, mein+e]
    note: "*kein* и *mein* изменяются как *ein*, но у них есть множественное число: *keine Kinder*, *meine Kinder*."
  plural:
    title: Plural
    ru: Множественное число
    head: [Singular, Plural, Как образуется]
    ruCols: [2]
    rows:
      - [der Hund, die Hund+e, "*-e*"]
      - [der Sohn, "die S*ö*hn+e", "умлаут + *-e*"]
      - [das Kind, die Kind+er, "*-er*"]
      - [der Mann, "die M*ä*nn+er", "умлаут + *-er*"]
      - [die Schwester, die Schwester+n, "*-n*"]
      - [die Frau, die Frau+en, "*-en*"]
      - [der Bruder, "die Br*ü*der", только умлаут]
      - [der Onkel, die Onkel, без изменений]
      - [das Foto, die Foto+s, "*-s*"]
    note: "Во множественном числе артикль всегда *die*. Форму учите вместе со словом: *der Bruder — die Brüder*."

