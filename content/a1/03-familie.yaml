id: familie
order: 3
title: Das ist meine Familie.
ru: Семья
lede: >-
  Анна показывает Марко фотографию семьи из Польши, а Марко рассказывает о
  сёстрах в Риме. Учимся говорить «мой», «твой», «её» и «наш», отвечать
  «нет» с *kein* и разбираемся, как немецкие существительные образуют
  множественное число.
goals:
  - Представить свою семью по фотографии
  - Спросить о семье собеседника — на «ты» и на «Вы»
  - Сказать, кто у вас есть, а кого нет
  - Образовать множественное число самых нужных слов
  - Задать вопрос по карточке на устном экзамене и понять короткое письмо
grammar:
  - Притяжательные mein, dein, sein, ihr …
  - ein / eine и kein / keine
  - Множественное число
exam: [sprechen-2, lesen-1]

dialogues:
  foto:
    title: Das ist meine Familie
    ru: Это моя семья
    place: Café, Leipzig
    people:
      A: { name: Anna, voice: Anna }
      M: { name: Marco, voice: Reed }
    lines:
      - M: Anna, ist das ein Foto aus Polen?
        ru: Анна, это фото из Польши?
      - A: Ja, das ist meine Familie. Das sind meine Eltern, Marta und Tomasz.
        ru: Да, это моя семья. Это мои родители, Марта и Томаш.
      - M: Und wer ist das? Dein Bruder?
        ru: А это кто? Твой брат?
      - A: Ja, das ist mein Bruder Piotr. Und das ist Jan. Ich habe zwei Brüder.
        ru: Да, это мой брат Пётр. А это Ян. У меня два брата.
      - M: Und hast du auch eine Schwester?
        ru: А сестра у тебя тоже есть?
      - A: Nein, ich habe keine Schwester.
        ru: Нет, сестры у меня нет.
      - M: Und der Hund? Ist das euer Hund?
        ru: А собака? Это ваш пёс?
      - A: Ja, das ist unser Hund Burek. Er ist schon zwölf Jahre alt.
        ru: Да, это наш пёс Бурек. Ему уже двенадцать лет.
  marco:
    title: Drei Schwestern und ein Baby
    ru: Три сестры и малыш
    place: Café, Leipzig
    people:
      A: { name: Anna, voice: Anna }
      M: { name: Marco, voice: Reed }
    lines:
      - A: Und du, Marco? Hast du Geschwister?
        ru: А ты, Марко? У тебя есть братья и сёстры?
      - M: Ja, ich habe drei Schwestern. Das ist Giulia, meine Schwester in Rom.
        ru: Да, у меня три сестры. Это Джулия, моя сестра в Риме.
      - A: Und wer ist das? Ist das ihr Mann?
        ru: А это кто? Это её муж?
      - M: Ja, das ist Luca, ihr Mann. Und das ist ihr Baby.
        ru: Да, это Лука, её муж. А это её малыш.
      - A: Ein Baby! Ist das ein Junge oder ein Mädchen?
        ru: Малыш! Это мальчик или девочка?
      - M: Ein Mädchen – Sofia. Ich bin jetzt Onkel!
        ru: Девочка — София. Я теперь дядя!
      - A: Toll! Und deine Eltern? Wohnen sie auch in Rom?
        ru: Здорово! А твои родители? Они тоже живут в Риме?
      - M: Ja, unsere Familie ist in Rom. Nur ich bin hier in Leipzig.
        ru: Да, наша семья в Риме. Только я здесь, в Лейпциге.

