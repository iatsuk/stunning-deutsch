  challenges:
    - id: jensen-question
      kind: order
      title: Первое знакомство с Йенсеном
      intro: >-
        Матео знакомит вас с начальником гавани. Вы хотите спросить Йенсена,
        откуда он родом. Вы ещё не знакомы — соберите вежливый вопрос на «Вы».
      label: Ваш вопрос
      tokens: [Woher, kommen, Sie?]
      success: >-
        *Woher kommen Sie?* — вежливый вопрос готов. Йенсен улыбается:
        знакомство началось!
      wrong: >-
        Сначала вопросительное слово «откуда», затем глагол, затем вежливое
        местоимение. Форма глагола с *Sie* — *kommen*.
    - id: dana-languages
      kind: pack
      title: Языковые бейджи для Даны
      intro: >-
        На встрече друзья будут искать собеседников по языковым бейджам.
        Послушайте Дану и прикрепите к её карточке все языки, которые она
        назвала. Даже «немного» — повод попробовать поговорить.
      clue: { dialogue: kurs, lines: [6] }
      options:
        - { id: kasachisch, label: Kasachisch }
        - { id: russisch, label: Russisch }
        - { id: englisch, label: Englisch }
        - { id: deutsch, label: Deutsch }
        - { id: spanisch, label: Spanisch }
        - { id: turkisch, label: Türkisch }
      answer: [kasachisch, russisch, englisch, deutsch]
      success: >-
        Бейджи на месте! Дана сможет найти собеседников на казахском, русском,
        английском и немного на немецком. Команда готова к знакомству.
      wrong: >-
        Нужны все языки из реплики Даны, включая *ein bisschen Deutsch*.
        Испанский назвал Матео, турецкий в этой реплике не звучит.

spy:
  - de: Ich bin Dana.
    wrong: Ich Dana.
    why: "Связку *sein* не пропускают: по-русски «я Дана», а по-немецки *Ich bin Dana*."
  - de: Elif kommt aus der Türkei.
    wrong: Elif kommt aus Türkei.
    why: "*die Türkei* — страна с артиклем: *aus der Türkei*. Без артикля ошибаются те, в чьём языке артиклей нет."
  - de: Ich komme aus Kasachstan.
    wrong: Ich bin von Kasachstan.
    why: "Откуда родом — *kommen aus*: *Ich komme aus Kasachstan*. *von* здесь не подходит, это калька с английского *from*."
  - de: Er spricht Spanisch.
    wrong: Er sprecht Spanisch.
    why: "*sprechen* меняет *e* на *i*: *du sprichst*, *er spricht*."
  - de: Wie heißen Sie?
    wrong: Wie heißt Sie?
    why: "Вежливое *Sie* спрягается как «они»: *Sie heißen*."
  - de: Du heißt Mateo.
    wrong: Du heißst Mateo.
    why: "Основа на *ß*: во втором лице только *-t*, поэтому *du heißt*."
  - de: Wir sind im Kurs.
    wrong: Wir seid im Kurs.
    why: "*wir sind*, *ihr seid* — формы *sein* надо запомнить."
  - de: Seid ihr aus Argentinien?
    wrong: Sind ihr aus Argentinien?
    why: "С *ihr* — *seid*: *Seid ihr aus Argentinien?*"

