steps:
  - id: treffen
    chapter: scene
    title: Первая встреча
    beats:
      - read: >-
          Первый день на курсе немецкого в Киле. Дана садится рядом с Матео и
          начинает с самого простого. *Moin!* — так на севере Германии
          здороваются в любое время суток: утром, днём и вечером, с соседом и
          с продавцом. Дальше имя: *Ich bin Dana* — «я Дана». И встречный
          вопрос: *Und wer bist du?* — «а ты кто?».
        point: "*Moin!* — северное «привет» в любое время, *Ich bin …* — «я …»"
        set: { view: dialogue, dialogue: kurs, reveal: 1 }
      - read: >-
          Матео отвечает по-другому: *Ich heiße Mateo* — «меня зовут Матео»,
          буквально «я зовусь». Есть и третий вариант, чуть официальнее:
          *Mein Name ist Mateo Fernández.* Все три верные — выберите один и
          используйте его, пока он не начнёт выскакивать сам.
        point: "Имя: *Ich bin …*, *Ich heiße …*, *Mein Name ist …*"
        set: { reveal: 2, focus: 1 }
      - read: >-
          Теперь — откуда человек. *Woher kommst du?* — «откуда ты?»
          Отвечаем с предлогом *aus*: *Ich komme aus Argentinien, aus Buenos
          Aires.* Тот же *aus* работает со страной и с городом. Короткое *Und
          du?* — «а ты?» — возвращает вопрос, и разговор идёт дальше.
        point: "*Woher kommst du?* — *Ich komme aus …*"
        set: { reveal: 4, focus: [2, 3] }
      - read: >-
          Дана родом из Казахстана, но живёт в Киле, в районе Гаарден: *ich
          wohne in Kiel*. Где живёшь — *wohnen in*, откуда родом — *kommen
          aus*. Последний вопрос про языки: *Welche Sprachen sprichst du?*
          Названия языков чаще всего кончаются на *-isch*: *Kasachisch*,
          *Russisch*, *Englisch*. Исключение — *Deutsch*.
        point: "*wohnen in* — где живёшь, *kommen aus* — откуда родом"
        set: { reveal: 8, focus: [4, 5, 6, 7] }

  - id: buero
    chapter: scene
    title: Теперь официально
    beats:
      - read: >-
          В офисе школы Элиф записывается на курс. Сотрудница, фрау Петерсен,
          обращается к ней на *Sie* — вежливое «Вы», всегда с большой буквы.
          Вопросы те же, но у глагола другое окончание: *Wie heißen Sie?*,
          *Woher kommen Sie?* К незнакомым взрослым обращаются *Herr* или
          *Frau* плюс фамилия: *Frau Yıldız*, *Frau Petersen*.
        point: "*Sie* — вежливое «Вы»; *Herr* / *Frau* + фамилия"
        set: { view: dialogue, dialogue: buero, reveal: 3, focus: [0, 2] }
      - read: >-
          Ответы можно давать коротко: *Aus der Türkei.* — *In Kiel.* Это
          нормально и в жизни, и на экзамене. *die Türkei* — одна из немногих
          стран с артиклем, поэтому *aus der Türkei*. А прощаются в офисе *Auf
          Wiedersehen*. *Tschüss* на севере услышите и от кассира, но в
          официальном разговоре надёжнее *Auf Wiedersehen*.
        point: "*Auf Wiedersehen!* — официально; *Tschüss!* — привычно на севере"
        set: { reveal: 8, focus: [3, 5, 6, 7] }

  - id: hafen
    chapter: scene
    title: Теперь — в парусном клубе
    beats:
      - read: >-
          После курса Матео знакомится с Хауке на Kiellinie. Место другое,
          но вопросы те же: имя, откуда вы и где живёте. Прежде чем открыть
          следующие реплики, ответьте за себя на вопрос *Wohnst du jetzt in
          Kiel?* Настоящий ответ полезнее заученной биографии Матео.
          *Ich segle gern* — готовая фраза «я люблю ходить под парусом»;
          *gern* подробнее разберём в теме о еде.
        point: "На курсе и в клубе: *Wie heißt du? Woher kommst du? Wo wohnst du?*"
        set: { view: dialogue, dialogue: hafen, reveal: 4, focus: [0, 1, 2, 3] }
      - read: >-
          *heißen* подходит не только людям: *Wie heißt das Boot?* — «как
          называется лодка?». Ответ — *Das Boot heißt Sprotte*. У *segeln*
          запомните короткое *ich segle*; с *wir* всё привычно: *wir segeln*.
          Теперь сыграйте сцену ещё раз: представьтесь Хауке от своего имени,
          назовите свой город и язык. Лодку и парусный опыт выдумывать не нужно.
        point: "*Wie heißt das Boot?* — название спрашивают тем же *heißen*, что и имя"
        set: { reveal: 8, focus: [3, 4, 5, 6, 7] }

  - id: hallo
    chapter: words
    title: Здороваемся и прощаемся
    beats:
      - read: >-
          В учебниках приветствие зависит от времени суток: *Guten Morgen!*
          — примерно до десяти-одиннадцати, *Guten Tag!* — днём, *Guten
          Abend!* — вечером. В Киле всё проще: *Moin!* подходит всегда. *Gute
          Nacht!* — это не приветствие, а «спокойной ночи». На *Wie geht's?*
          не рассказывают о жизни: хватит *Danke, gut!*
        point: "*Moin!* — всегда; *Guten Morgen / Tag / Abend!* — по времени суток"
        set: { view: words, words: hallo }

  - id: person
    chapter: words
    title: Слова о себе
    beats:
      - read: >-
          У каждого немецкого существительного есть род, и его показывает
          артикль: *der* — мужской, *die* — женский, *das* — средний. Род
          часто не совпадает с русским: *das Land* — «страна» среднего рода.
          Поэтому учите слово сразу с артиклем и формой множественного числа:
          *der Name — die Namen*. Цвет карточки подсказывает род.
        point: "Учите слово с артиклем и мн. ч.: *der Name — die Namen*"
        set: { view: words, words: person }
      - read: >-
          Названия стран почти всегда без артикля: *aus Kasachstan*, *in
          Deutschland*. Но есть исключения, которые нужно запомнить: *die
          Türkei*, *die Ukraine*, *die Schweiz* и *die USA* во множественном
          числе. После *aus* артикль меняется: *aus der Türkei*, *aus den USA*
          — почему, разберём в следующих темах. До Дании от Киля рукой подать,
          поэтому *Dänemark* тоже в списке.
        point: "Страны без артикля, кроме *die Türkei*, *die Ukraine*, *die Schweiz*, *die USA*"
        set: { view: words, words: laender }
      - read: >-
          Шесть вопросительных слов закрывают почти весь разговор при
          знакомстве. Все они начинаются на *W* — поэтому такие вопросы и
          называют W-вопросами. Будьте внимательны с парой *wo* — «где» и
          *woher* — «откуда».
        point: "*wo?* — где, *woher?* — откуда"
        set: { view: words, words: fragen }

  - id: am-wasser
    chapter: words
    title: Пять слов для береговой жизни
    beats:
      - read: >-
          Для первой встречи у воды не нужны названия снастей. Достаточно
          пяти слов: гавань, лодка, ходить под парусом, кафе и пляж. Они
          пригодятся и в обычной прогулке по Килю. *Das Boot* — общее слово
          «лодка», а *die Jolle* из дела темы — небольшая парусная лодка.
          Учите прежде всего слова с карточек; незнакомую морскую деталь
          сюжета пока достаточно понять из контекста.
        point: "Береговая жизнь: *der Hafen, das Boot, segeln, das Café, der Strand*"
        set: { view: words, words: am-wasser }

  - id: betonung
    chapter: words
    title: Где ударение?
    beats:
      - read: >-
          В немецком слове ударение почти всегда падает на первый слог корня, а это обычно и
          первый слог слова: *heißen*, *wohnen*, *der Hafen*. Ударный слог звучит громко и ясно,
          безударные — коротко и бегло: в *heißen* второй слог почти проглатывается. В сложном
          слове ударна первая часть: *der Vorname*. В русском ударение надо запоминать для
          каждого слова, а в немецком оно почти всегда в начале — на это можно опереться.
        point: "Ударение — на первом слоге корня: *HEI·ßen*, *WOH·nen*, *HA·fen*"
        set: { view: table, table: betonung, reveal: 4 }
      - read: >-
          Исключения есть, и два из них уже встретились в этой теме. Вопрос *woher* ударен на
          второй части: *wo·HER*. Заимствования часто ударны в конце, как и в русском: *das
          Café* — «кафе́». Остальные исключения разберём, когда появятся нужные слова: глаголы
          на *-ieren* — в теме 2, безударные приставки *ge-* и *be-* — в темах 2 и 4.
        point: "Исключения: *wo·HER*, *ca·FÉ*"
        set: { reveal: 6, focus: [4, 5] }

  - id: pronomen
    chapter: grammar
    title: Кто есть кто
    beats:
      - read: >-
          Местоимения почти как в русском, с двумя ловушками. *sie* — это и
          «она», и «они», а *Sie* с большой буквы — вежливое «Вы». Различить
          их помогает глагол и контекст. Второе: *ihr* — это «вы», когда вы
          на «ты» с каждым из собеседников, например с друзьями.
        point: "*sie* — она/они, *Sie* — вежливое «Вы», *ihr* — вы-друзья"
        set: { view: table, table: pronomen, focus: [4, 5, 6] }

  - id: endungen
    chapter: grammar
    title: Окончания глагола
    beats:
      - read: >-
          Немецкий глагол меняет окончание по лицам, как русский. Берём
          инфинитив *wohnen*, отрезаем *-en* — остаётся основа *wohn-*. Дальше
          добавляем окончание: *ich wohn+e*, *du wohn+st*, *er wohn+t*. В
          единственном числе всего три окончания: *-e*, *-st*, *-t*.
        point: "Единственное число: ich *-e*, du *-st*, er/sie/es *-t*"
        set: { view: table, table: endungen, reveal: 3 }
      - read: >-
          Во множественном — ещё проще. *wir* и *sie / Sie* совпадают с
          инфинитивом: *wir wohnen*, *Sie wohnen*. *ihr* получает *-t*, как
          *er*. Поэтому вежливое *Wie heißen Sie?* звучит так же, как «как их
          зовут?» — разница только в заглавной букве.
        point: "*wir*, *sie*, *Sie* — как инфинитив; *ihr* — *-t*"
        set: { reveal: 6, focus: [3, 5] }
      - read: >-
          *sein* — «быть» — живёт по своим правилам, его формы надо выучить:
          *ich bin*, *du bist*, *er ist*, *wir sind*, *ihr seid*, *sie sind*.
          В отличие от русского, связку «быть» в настоящем времени не
          пропускают: «я Дана» — *Ich bin Dana*.
        point: "*ich bin, du bist, er ist, wir sind, ihr seid, sie sind*"
        set: { view: table, table: sein }

  - id: wortstellung
    chapter: grammar
    title: Глагол — на втором месте
    beats:
      - read: >-
          Главное правило немецкого предложения: спрягаемый глагол стоит на
          второй позиции. Позицию занимает не одно слово, а целая группа: *in
          Kiel* — одна позиция. На схеме четыре поля: позиция 1,
          глагол, середина и конец. Конец пока пуст, он понадобится позже.
        point: Спрягаемый глагол — всегда вторая позиция
        set:
          view: sentence
          rows:
            - de: [Ich, wohn+e, in Kiel., ""]
              ru: Я живу в Киле.
      - read: >-
          Поставим на первое место *in Kiel*. Глагол остаётся на месте — а
          подлежащее *ich* уходит в середину, сразу после глагола. Порядок «В
          Киле я живу» по-немецки невозможен: глагол не сдвигается со второй
          позиции, что бы ни стояло первым.
        point: "Что угодно на первом месте — глагол всё равно второй: *In Kiel wohne ich.*"
        set:
          rows:
            - de: [In Kiel, wohn+e, ich., ""]
              ru: В Киле живу я.
      - read: >-
          В вопросе с W-словом на первое место встаёт само W-слово: *Wo
          wohnst du?* А если ответ — «да» или «нет», первая позиция пустеет и
          предложение начинается с глагола: *Wohnst du in Kiel?* Глагол при
          этом по-прежнему стоит в своей колонке.
        point: "W-вопрос: *Wo wohnst du?* Вопрос да/нет: *Wohnst du …?*"
        set:
          rows:
            - de: [Wo, wohn+st, du?, ""]
              ru: Где ты живёшь?
            - de: ["", Wohn+st, du in Kiel?, ""]
              ru: Ты живёшь в Киле?

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как спросить пожилую соседку, откуда она родом?
        read: >-
          С незнакомым взрослым — на *Sie*: *Woher kommen Sie?* Глагол в
          форме *kommen* — как инфинитив, местоимение *Sie* — с большой
          буквы. Вариант *Woher kommst du?* прозвучит фамильярно, хотя вас,
          конечно, поймут.
        point: "Вежливо: *Woher kommen Sie?*"
        set:
          view: sentence
          rows:
            - de: [Woher, komm+en, Sie?, ""]
              ru: Откуда Вы?
      - question: Матео говорит *Ich komme aus Argentinien*. Как начать фразу с *Aus Argentinien…*?
        read: >-
          *Aus Argentinien komme ich.* Группа *aus Argentinien* занимает
          первую позицию, глагол *komme* остаётся второй, а *ich* переходит в
          середину. Так говорят, когда хотят подчеркнуть, откуда именно.
        point: "*Aus Argentinien komme ich.* — подлежащее уходит за глагол"
        before:
          view: sentence
          rows:
            - de: [Ich, komm+e, aus Argentinien., ""]
              ru: Я из Аргентины.
        set:
          rows:
            - de: [Ich, komm+e, aus Argentinien., ""]
              ru: Я из Аргентины.
            - de: [Aus Argentinien, komm+e, ich., ""]
              ru: Из Аргентины я родом.
      - question: Почему *du heißt*, а не *du heißst*?
        read: >-
          Если основа кончается на *s*, *ß* или *z*, во втором лице
          добавляется только *-t*: *du heiß+t*, *du tanz+t*. Звук *с* уже есть
          в основе, второй не нужен. Поэтому *du heißt* и *er heißt*
          совпадают.
        point: "Основа на *-s*, *-ß*, *-z*: *du heißt*, *du tanzt*"
        set: { view: table, table: endungen, focus: [1, 2] }

  - id: selbst-erklaeren
    chapter: practice
    title: Объясните Хауке — потом скажите о себе
    beats:
      - question: Почему *In Kiel ich wohne* не подходит? Объясните до открытия ответа.
        read: >-
          *In Kiel* — одна группа на первой позиции. Спрягаемый глагол
          *wohne* должен быть вторым, поэтому *ich* переходит за него:
          *In Kiel wohne ich*. Объясните это своими словами, будто помогаете
          новичку разобраться в немецком. Затем закройте пример и скажите
          два правдивых предложения о себе: сначала с *Ich*, потом с городом.
          Если назвать правило трудно, вернитесь к схеме, а не перечитывайте
          весь урок.
        point: "Объясните правило своими словами и составьте свой пример"
        before:
          view: sentence
          rows:
            - de: [Ich, wohn+e, in Kiel., ""]
              ru: Я живу в Киле.
        set:
          rows:
            - de: [Ich, wohn+e, in Kiel., ""]
              ru: Я живу в Киле.
            - de: [In Kiel, wohn+e, ich., ""]
              ru: В Киле живу я.

  - id: sprechen
    chapter: exam
    title: "Устный экзамен: часть 1"
    beats:
      - read: >-
          Устная часть начинается с рассказа о себе. На столе лежит лист с
          ключевыми словами — имя, возраст, страна, город, языки, профессия,
          хобби. На каждого участника — около полутора минут. Потом
          экзаменатор попросит назвать что-то по буквам и продиктовать номер:
          это в следующей теме.
        point: "Часть 1: рассказ по ключевым словам + буквы + номер"
        set: { view: task, task: vorstellen, reveal: 0 }
      - read: >-
          Образец — рассказ Матео: простые предложения, глагол на втором
          месте. Не нужно использовать все слова и строить сложные фразы:
          оценивают, понятно ли вас. Возраст — *Ich bin … Jahre alt*,
          профессия — *Ich bin … von Beruf*. Хобби в Киле часто морское: *Mein
          Hobby ist Segeln.* Подготовьте свой рассказ заранее и проговорите
          его вслух.
        point: Подготовьте рассказ о себе заранее — 6–7 простых предложений
        set: { reveal: 7 }

  - id: schreiben
    chapter: exam
    title: "Письменный экзамен: анкета"
    beats:
      - read: >-
          Первая часть письменного экзамена — анкета. В тексте описана
          ситуация: вы помогаете подруге записаться на курс. Пять полей
          пустые, вся информация для них есть в тексте. Переписывайте
          аккуратно: ошибка в названии улицы или страны может стоить балла.
        point: "Анкета: 5 пустых полей, все ответы есть в тексте"
        set: { view: task, task: anmeldung, reveal: 0 }
      - question: Что написать в поле «Herkunftsland»?
        read: >-
          *Türkei*. *Herkunft* — «происхождение», *Land* — «страна»: страна,
          откуда человек родом. Не путайте с *Wohnort* — местом, где он живёт
          сейчас, это *Kiel*. В анкете страну пишут без артикля, хотя в
          предложении говорят *aus der Türkei*. Остальные поля заполняются так
          же: найдите в тексте слово и перенесите его без изменений.
        point: "*Herkunftsland* — откуда родом, *Wohnort* — где живёт"
        set: { reveal: 5 }

case:
  title: Wo ist die „Sprotte“?
  ru: Где «Шпротта»?
  intro: >-
    Утро перед занятием. Матео заходит в парусный клуб на Kiellinie и застаёт
    начальника гавани, господина Йенсена, в панике: со стоянки исчезла клубная
    шлюпка «Шпротта». До Кильской недели — меньше месяца. Йенсен просит
    помочь: свидетели говорят по-немецки, а на двери висит записка. Каждую
    улику решает грамматика этой темы.
  people:
    J: { name: Herr Jensen, voice: Grandpa, role: Hafenmeister }
    F: { name: Frauke, voice: Sandy, role: Fischbrötchen-Kiosk }
    H: { name: Hauke, voice: Rocko, role: Segler }
    L: { name: Lars, voice: Eddy, role: Student }
  steps:
    - read: >-
        Первая свидетельница — Фрауке из киоска с рыбными булочками. Вчера
        она работала допоздна. Слушайте внимательно: важно, сколько людей было
        на причале.
      evidence:
        - J: Moin! Die „Sprotte“ ist weg!
          ru: Привет! «Шпротта» пропала!
        - F: Um zehn Uhr am Abend sind sie hier. Dann segeln sie.
          ru: В десять вечера они здесь. Потом они выходят под парусом.
      question: Кто был на причале в десять вечера?
      options: [Одна женщина, Двое или больше, Один мужчина]
      answer: 1
      right: >-
        *sie sind*, *sie segeln* — форма *sind* и окончание *-en* бывают
        только у «они» и у вежливого *Sie*. Про одну женщину Фрауке сказала
        бы *sie ist hier*, *sie segelt*. Значит, людей было минимум двое.
      wrong:
        - >-
          Вы прочитали *sie* как «она». Но у «она» глагол другой: *sie ist*,
          *sie segelt*. Здесь *sind* и *segeln* — это «они». Йенсен уже
          собрался звонить соседке, которая ходит под парусом одна, — зря.
        - null
        - >-
          Мужчину назвали бы *er*: *er ist hier*, *er segelt*. А в показаниях
          Фрауке нет ни одного *er*.
    - read: >-
        На двери офиса гавани Йенсен находит записку. Почерк незнакомый. Кто
        её писал — друзья Йенсена или люди, которые знают его плохо?
      evidence:
        - note: |-
            Herr Jensen,
            sind Sie morgen um neun hier?
            Die „Sprotte“ ist in Holtenau.
            Wir sind Freunde von Hauke.
          ru: >-
            Господин Йенсен, вы будете здесь завтра в девять? «Шпротта» в
            Хольтенау. Мы друзья Хауке.
      question: Кто писал записку?
      options: [Близкие друзья Йенсена, "Люди, которые знают Йенсена плохо", Сам Хауке]
      answer: 1
      right: >-
        *Sind Sie* — вежливое *Sie* с большой буквы и обращение *Herr Jensen*.
        Так пишут человеку, с которым на «Вы». Подпись — *Wir sind Freunde von
        Hauke*, «мы друзья Хауке»: авторов несколько, и с Йенсеном они не
        дружат. А шлюпка — в Хольтенау, у шлюзов канала.
      wrong:
        - >-
          Друзья написали бы на «ты»: *Bist du morgen hier?* А здесь *Sind Sie*
          — вежливая форма для малознакомого человека.
        - null
        - >-
          Хауке написал бы *ich*, а не *wir*. И себя он не назвал бы со
          стороны: *Freunde von Hauke* — это «друзья Хауке».
    - read: >-
        У клуба Йенсен застаёт троих: Хауке и двух студентов. Каждый
        представляется. Кто из них живёт там, где сейчас стоит «Шпротта»?
      evidence:
        - H: Moin! Ich bin Hauke. Ich komme aus Kiel, aber ich wohne jetzt in Hamburg.
          ru: Привет! Я Хауке. Я из Киля, но сейчас живу в Гамбурге.
        - L: Moin! Wir sind Lars und Merle. Wir wohnen in Holtenau.
          ru: Привет! Мы Ларс и Мерле. Мы живём в Хольтенау.
      question: Кого нужно расспросить первым по этим уликам?
      options: [Хауке, Ларс и Мерле, Фрауке из киоска]
      answer: 1
      right: >-
        Первыми расспросим Ларса и Мерле: в записке *wir* — авторов несколько.
        Шлюпка в Хольтенау, а они *wohnen in Holtenau* — живут там. А Хауке
        *kommt aus Kiel* — родом из Киля, но *wohnt in Hamburg*: живёт он в
        Гамбурге. Это зацепки для разговора, а не доказательство: жить в
        Хольтенау может и кто-то ещё. Что случилось, узнаем из их объяснения.
      wrong:
        - >-
          *Ich komme aus Kiel* значит «я родом из Киля», а не «я живу в Киле».
          Живёт Хауке в Гамбурге: *ich wohne jetzt in Hamburg*. И он один, а в
          записке *wir*.
        - null
        - >-
          Фрауке — свидетельница, а не подозреваемая. В десять вечера она
          стояла у киоска и рассказывала о других: *sie sind hier*.
  ending: >-
    Ларс и Мерле во всём признаются: они тренировались к Кильской неделе,
    ночью поднялся ветер, и они оставили «Шпротту» у шлюзов в Хольтенау.
    Утром хотели всё объяснить — отсюда вежливое *Sind Sie morgen um neun
    hier?* Йенсен ворчит, но прощает. Дело закрыто… почти. Вечером у клуба
    крутится незнакомец в куртке Kieler Woche и говорит Йенсену: *Moin! Ich
    wohnen in Kiel.* Правильно *ich wohne*: его рассказ стоит проверить.
    Ошибка сама по себе не делает человека шпионом — ошибаются и ученики.
    Кто он?
    Находить такие ошибки можно в «Поиске ошибки» в тренажёре, продолжение дела
    — в следующей теме.

adventure:
  kind: crew
  title: Соберите команду
  intro: >-
    До Kieler Woche ещё есть время. Хауке собирает друзей для прогулки на
    «Шпротте», но карточки команды пока пустые. Познакомьтесь с каждым,
    разложите сведения, найдите помощника, подготовьте вопрос Йенсену и
    языковые бейджи для знакомства.
  origins: [Kasachstan, Argentinien, Türkei, Kiel, Hamburg]
  places: [Gaarden, Holtenau, Holtenauer Straße, Kiel, Hamburg]
  members:
    - id: dana
      name: Dana
      origin: Kasachstan
      home: Gaarden
      clue: { dialogue: kurs, lines: [4] }
    - id: mateo
      name: Mateo
      origin: Argentinien
      home: Holtenau
      clue: { dialogue: kurs, lines: [3, 5] }
    - id: elif
      name: Elif
      origin: Türkei
      home: Holtenauer Straße
      clue: { dialogue: buero, lines: [3, 5] }
    - id: hauke
      name: Hauke
      origin: Kiel
      home: Hamburg
      clue: { caseStep: 2, evidence: 0 }
  contact:
    question: >-
      Хауке занят. Кто из команды живёт в Holtenau? Найдите этого человека
      по собранным карточкам: он поможет встретиться с Йенсеном и найти лодку.
    answer: mateo
    success: >-
      Матео поможет с лодкой, вопрос для Йенсена готов, а языковые бейджи Даны
      собраны. Вы сможете познакомить друзей друг с другом. В следующей теме
      пригодятся числа: нужно будет понять номер места и позвонить Дане.
    wrong: >-
      Здесь нужен не город, откуда человек родом, а место, где он живёт.
