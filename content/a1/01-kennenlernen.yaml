      - { de: England, ru: Англия, note: Englisch }
      - { de: die Schweiz, ru: Швейцария, pl: "-", note: aus der Schweiz }
      - { de: die Türkei, ru: Турция, pl: "-", note: aus der Türkei }
      - { de: die Ukraine, ru: Украина, pl: "-", note: "aus der Ukraine — Ukrainisch" }
