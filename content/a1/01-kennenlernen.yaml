tables:
  pronomen:
    title: Personalpronomen
    ru: Личные местоимения
    head: [Deutsch, По-русски]
    ruCols: [1]
    rows:
      - [ich, я]
      - [du, ты]
      - [er / sie / es, он / она / оно]
      - [wir, мы]
      - [ihr, "вы — друзьям, родным, детям"]
      - [sie, они]
      - [Sie, "Вы — вежливо, одному или нескольким"]
  endungen:
    title: "Präsens: regelmäßige Verben"
    ru: Настоящее время, правильные глаголы
    head: [Person, wohnen, kommen, heißen]
    rows:
      - [ich, wohn+e, komm+e, heiß+e]
      - [du, wohn+st, komm+st, heiß+t]
      - [er / sie / es, wohn+t, komm+t, heiß+t]
      - [wir, wohn+en, komm+en, heiß+en]
      - [ihr, wohn+t, komm+t, heiß+t]
      - [sie / Sie, wohn+en, komm+en, heiß+en]
    note: Основа — инфинитив без -en. К ней добавляется окончание лица.
  sein:
    title: sein
    ru: быть
    head: [Person, sein, Beispiel]
    rows:
      - [ich, bin, Ich bin Dana.]
      - [du, bist, Bist du Mateo?]
      - [er / sie / es, ist, Das ist Frau Petersen.]
      - [wir, sind, Wir sind im Kurs.]
      - [ihr, seid, Seid ihr aus Argentinien?]
      - [sie / Sie, sind, Sind Sie Frau Yıldız?]
    note: Неправильный глагол — формы надо просто запомнить.
  betonung:
    title: Betonung
    ru: Ударение
    head: [Wort, Звучит]
    rows:
      - [heißen, HEI·ßen]
      - [wohnen, WOH·nen]
      - [der Hafen, HA·fen]
      - [der Vorname, VOR·na·me]
      - [woher, wo·HER]
      - [das Café, ca·FÉ]
    note: "Ударение — на первом слоге корня, в сложном слове — на первой части. Исключения: вопросы на *wo-* и заимствования. Точки делят слово на слоги, большими буквами выделен ударный; так пишут только в подсказке, в тексте — как обычно: *woher*, *das Café*."

