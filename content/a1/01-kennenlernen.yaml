id: kennenlernen
order: 1
title: Moin! Ich bin Dana.
ru: Знакомство
lede: >-
  Первый день на курсах немецкого в Киле. Здесь здороваются коротким *Moin* —
  и утром, и вечером. Учимся называть себя, говорить, откуда вы и где живёте, —
  и сразу видим главное правило немецкого предложения: глагол стоит на втором
  месте. После занятий знакомимся в парусном клубе на Kiellinie: то же
  правило помогает представить и себя, и лодку.
goals:
  - Поздороваться и попрощаться — с соседом, с другом и в официальном офисе
  - Назвать имя, страну, город и языки, на которых вы говорите
  - Спросить то же самое у собеседника — на «ты» и на «Вы»
  - Рассказать о себе по ключевым словам, как в начале устного экзамена
grammar:
  - Личные местоимения
  - Глагол в настоящем времени
  - Глагол sein
  - Вопросы с W-словом и без
  - Глагол на втором месте
  - "Ударение: первый слог корня"
exam: [sprechen-1, schreiben-1]

dialogues:
  kurs:
    title: Der erste Kurstag
    ru: Первый день на курсе
    place: Sprachschule Förde, Kiel
    people:
      D: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
    lines:
      - D: Moin! Ich bin Dana. Und wer bist du?
        ru: Привет! Я Дана. А ты кто?
      - M: Moin, Dana! Ich heiße Mateo.
        ru: Привет, Дана! Меня зовут Матео.
      - D: Woher kommst du, Mateo?
        ru: Откуда ты, Матео?
      - M: Ich komme aus Argentinien, aus Buenos Aires. Und du?
        ru: Я из Аргентины, из Буэнос-Айреса. А ты?
      - D: Ich komme aus Kasachstan. Aber ich wohne jetzt hier in Kiel, in Gaarden.
        ru: Я из Казахстана. Но сейчас я живу здесь, в Киле, в Гаардене.
      - M: Ich wohne auch in Kiel, in Holtenau! Welche Sprachen sprichst du?
        ru: Я тоже живу в Киле, в Хольтенау! На каких языках ты говоришь?
      - D: Kasachisch, Russisch, Englisch und ein bisschen Deutsch.
        ru: На казахском, русском, английском и немного на немецком.
      - M: Ich spreche Spanisch und Englisch – und auch ein bisschen Deutsch!
        ru: Я говорю по-испански и по-английски — и тоже немного по-немецки!
  buero:
    title: Im Büro der Sprachschule
    ru: В офисе языковой школы
    place: Sprachschule Förde, Kiel
    people:
      P: { name: Frau Petersen, voice: Sandy }
      E: { name: Elif, voice: Flo }
    lines:
      - P: Moin! Wie heißen Sie, bitte?
        ru: Здравствуйте! Как вас зовут?
      - E: Mein Name ist Elif Yıldız.
        ru: Меня зовут Элиф Йылдыз.
      - P: Und woher kommen Sie, Frau Yıldız?
        ru: А откуда вы, госпожа Йылдыз?
      - E: Aus der Türkei, aus Izmir.
        ru: Из Турции, из Измира.
      - P: Wo wohnen Sie?
        ru: Где вы живёте?
      - E: In Kiel, in der Holtenauer Straße.
        ru: В Киле, на Хольтенауэр-штрассе.
      - P: Danke schön. Auf Wiedersehen, Frau Yıldız!
        ru: Большое спасибо. До свидания, госпожа Йылдыз!
      - E: Auf Wiedersehen!
        ru: До свидания!
  hafen:
    title: Moin an der Kiellinie!
    ru: Знакомство у воды
    place: Парусный клуб на Kiellinie, Kiel
    people:
      M: { name: Mateo, voice: Reed }
      H: { name: Hauke, voice: Rocko }
    lines:
      - H: Moin! Ich bin Hauke. Wie heißt du?
        ru: Привет! Я Хауке. Как тебя зовут?
      - M: Ich heiße Mateo. Ich komme aus Argentinien.
        ru: Меня зовут Матео. Я из Аргентины.
      - H: Wohnst du jetzt in Kiel?
        ru: Ты сейчас живёшь в Киле?
      - M: Ja, ich wohne in Holtenau. Ich segle gern. Und du?
        ru: Да, я живу в Хольтенау. Я люблю ходить под парусом. А ты?
      - H: Ich segle auch gern. Das ist die „Sprotte“.
        ru: Я тоже люблю ходить под парусом. Это «Шпротта».
      - M: Die „Sprotte“? Wie heißt das Boot?
        ru: «Шпротта»? Как называется лодка?
      - H: Das Boot heißt „Sprotte“. Wir segeln hier in Kiel.
        ru: Лодка называется «Шпротта». Мы ходим под парусом здесь, в Киле.
      - M: Super! Tschüss, Hauke!
        ru: Здорово! Пока, Хауке!

