id: kennenlernen
order: 1
title: Hallo! Ich bin Anna.
ru: Знакомство
lede: >-
  Первый день на курсах немецкого в Лейпциге. Учимся здороваться, называть
  себя, говорить, откуда вы и где живёте, — и сразу видим главное правило
  немецкого предложения: глагол стоит на втором месте.
goals:
  - Поздороваться и попрощаться — с другом и с незнакомым человеком
  - Назвать имя, страну, город и языки, на которых вы говорите
  - Спросить то же самое у собеседника — на «ты» и на «Вы»
  - Рассказать о себе по ключевым словам, как в начале устного экзамена
grammar:
  - Личные местоимения
  - Глагол в настоящем времени
  - Глагол sein
  - Вопросы с W-словом и без
  - Глагол на втором месте
exam: [sprechen-1, schreiben-1]

dialogues:
  kurs:
    title: Der erste Kurstag
    ru: Первый день на курсе
    place: Sprachschule, Leipzig
    people:
      A: { name: Anna, voice: Anna }
      M: { name: Marco, voice: Reed }
    lines:
      - A: Hallo! Ich bin Anna. Und wer bist du?
        ru: Привет! Я Анна. А ты кто?
      - M: Hallo, Anna! Ich heiße Marco.
        ru: Привет, Анна! Меня зовут Марко.
      - A: Woher kommst du, Marco?
        ru: Откуда ты, Марко?
      - M: Ich komme aus Italien, aus Rom. Und du?
        ru: Я из Италии, из Рима. А ты?
      - A: Ich komme aus Polen. Aber ich wohne jetzt hier in Leipzig.
        ru: Я из Польши. Но сейчас я живу здесь, в Лейпциге.
      - M: Ich wohne auch in Leipzig! Welche Sprachen sprichst du?
        ru: Я тоже живу в Лейпциге! На каких языках ты говоришь?
      - A: Polnisch, Englisch und ein bisschen Deutsch.
        ru: На польском, английском и немного на немецком.
      - M: Ich auch – ein bisschen!
        ru: Я тоже — немного!
  buero:
    title: Im Büro der Sprachschule
    ru: В офисе языковой школы
    place: Sprachschule, Leipzig
    people:
      W: { name: Frau Weber, voice: Sandy }
      M: { name: Marco, voice: Reed }
    lines:
      - W: Guten Morgen! Wie heißen Sie, bitte?
        ru: Доброе утро! Как вас зовут?
      - M: Mein Name ist Marco Rossi.
        ru: Меня зовут Марко Росси.
      - W: Und woher kommen Sie, Herr Rossi?
        ru: А откуда вы, господин Росси?
      - M: Aus Italien.
        ru: Из Италии.
      - W: Wo wohnen Sie?
        ru: Где вы живёте?
      - M: In Leipzig, in der Goethestraße.
        ru: В Лейпциге, на Гётештрассе.
      - W: Danke schön. Auf Wiedersehen, Herr Rossi!
        ru: Большое спасибо. До свидания, господин Росси!
      - M: Auf Wiedersehen!
        ru: До свидания!

