id: wohnen
order: 8
title: "Zwei Zimmer, Küche, Bad"
ru: Жильё
lede: >-
  Лусия и Диего обсуждают более долгий визит в Киль. Матео помогает найти жильё для гостей:
  читает объявления с Даной и осматривает квартиру на Holtenauer Straße. Учимся сравнивать
  условия, понимать сложные слова и находить вещи по описаниям *im Keller*, *in der Küche*,
  *auf dem Balkon*.
goals:
  - "Назвать комнаты, мебель и технику в квартире"
  - "Сказать, где что стоит: im Keller, in der Küche, auf dem Balkon"
  - "Описать квартиру: большая, светлая, тихая, недорогая"
  - "Прочитать объявление о квартире со всеми сокращениями"
  - "Назвать этаж: im ersten Stock — по-нашему второй этаж"
  - "Образовать любое порядковое число: der siebte, der zwanzigste"
grammar:
  - "Сложные слова: род по последней части"
  - "Дательный после in и auf на вопрос «где?»"
  - "im = in dem"
  - "Прилагательное после sein"
  - "Порядковые числа: до 19 -te, с 20 -ste; im ersten Stock"
exam: [ lesen-2, lesen-3 ]

dialogues:
  anzeige:
    title: Eine Wohnung für die Gäste
    ru: Жильё для гостей
    place: Café Brunswik, Kiel · учебные объявления и цены
    people:
      M: { name: Mateo, voice: Reed }
      A: { name: Dana, voice: Anna }
    lines:
      - M: Dana, Lucía und Diego suchen eine Wohnung. Ihr Zimmer ist zu klein.
        ru: Дана, Лусия и Диего ищут квартиру. Их комната слишком маленькая.
      - A: "Hier ist eine Anzeige: zwei Zimmer, Küche, Bad und Balkon!"
        ru: Вот объявление — две комнаты, кухня, ванная и балкон!
      - M: Klingt gut! Was kostet die Wohnung?
        ru: Звучит неплохо! Сколько стоит квартира?
      - A: "450 Euro kalt, plus 130 Euro Nebenkosten."
        ru: 450 евро «холодными» плюс 130 евро коммунальных.
      - M: Kalt? Was bedeutet das?
        ru: «Холодными»? Что это значит?
      - A: Hier ist die Kaltmiete nur die Miete. Heizung und Wasser kosten extra.
        ru: Здесь холодная аренда — только плата за квартиру. Отопление и вода оплачиваются отдельно.
      - M: Und wo ist die Wohnung?
        ru: А где квартира?
      - A: In der Holtenauer Straße, im zweiten Stock. Das ist nicht weit.
        ru: На Holtenauer Straße, на третьем этаже. Это недалеко.
      - M: Super, ich rufe gleich an!
        ru: Супер, сейчас же позвоню!
  besichtigung:
    title: Die Wohnungsbesichtigung
    ru: Смотрим квартиру
    place: Вымышленная квартира на Holtenauer Straße, Kiel
    people:
      K: { name: Herr Krüger, voice: Eddy }
      M: { name: Mateo, voice: Reed }
    lines:
      - K: Guten Tag, Herr Fernández! Hier ist der Flur, und links ist das Wohnzimmer.
        ru: Добрый день, господин Фернандес! Вот прихожая, а слева гостиная.
      - M: Oh, das Wohnzimmer ist groß und hell!
        ru: О, гостиная большая и светлая!
      - K: Ja, und hier ist der Balkon. Auf dem Balkon haben Sie am Nachmittag Sonne.
        ru: Да, а вот балкон. После обеда на балконе солнце.
      - M: Toll! Und wo ist die Küche?
        ru: Здорово! А где кухня?
      - K: Hier rechts. In der Küche gibt es einen Herd und einen Kühlschrank.
        ru: Здесь, справа. На кухне есть плита и холодильник.
      - M: Und die Waschmaschine? Ist sie im Bad?
        ru: А стиральная машина? Она в ванной?
      - K: Nein, sie steht im Keller. Das Bad ist klein, aber modern.
        ru: Нет, она стоит в подвале. Ванная маленькая, но современная.
      - M: Ist das Schlafzimmer ruhig?
        ru: А в спальне тихо?
      - K: Ja, sehr ruhig. Im Schlafzimmer steht auch ein Kleiderschrank.
        ru: Да, очень тихо. И в спальне стоит платяной шкаф.
      - M: Ich finde sie gut. Ich rufe Lucía und Diego an.
        ru: Квартира мне нравится. Я позвоню Лусии и Диего.

