steps:
  - id: anzeige
    chapter: scene
    title: Марко ищет квартиру
    beats:
      - read: >-
          Марко живёт в общежитии, и комната ему тесна: *Mein Zimmer im
          Wohnheim ist zu klein.* Анна тут же находит объявление: *zwei
          Zimmer, Küche, Bad und Balkon*. Так в Германии описывают квартиру —
          числом комнат. Кухня и ванная в это число не входят: *2-Zimmer-Wohnung*
          — это две жилые комнаты плюс кухня и ванная, по-нашему «двушка».
        point: "*2-Zimmer-Wohnung* — две комнаты; кухня и ванная не в счёт"
        set: { view: dialogue, dialogue: anzeige, reveal: 2 }
      - read: >-
          Главный вопрос — цена. *450 Euro kalt* — это «холодная» аренда, *die
          Kaltmiete*: плата только за саму квартиру. Отопление, вода и вывоз
          мусора — *die Nebenkosten*, их платят сверху. Вместе получается *die
          Warmmiete*, «тёплая» аренда. Сравнивайте объявления всегда по ней: у
          Марко выйдет 580 евро в месяц, а не 450.
        point: "*Kaltmiete* + *Nebenkosten* = *Warmmiete*"
        set: { reveal: 6, focus: [3, 4, 5] }
      - read: >-
          Где квартира? *In Gohlis, in der Lindenstraße* — в районе Голис, на
          Линденштрассе. По-русски мы живём «на улице», а немцы — «в улице»:
          *in der Straße*. Вы уже видели это в первой теме: *in der
          Goethestraße*. Почему *der*, если улица — *die Straße*, — главный
          вопрос этой темы. А Марко не теряет времени: *Ich rufe gleich an!*
        point: "Улица — *in der …straße*: по-немецки «в улице», а не «на»"
        set: { reveal: 9, focus: [6, 7, 8] }

  - id: besichtigung
    chapter: scene
    title: Смотрим квартиру
    beats:
      - read: >-
          Хозяин квартиры, господин Крюгер, показывает комнаты: *der Flur* —
          прихожая, *das Wohnzimmer* — гостиная. Марко доволен: *Das
          Wohnzimmer ist groß und hell!* Прилагательное после *ist* остаётся в
          словарной форме — вы уже видели это в теме о покупках: *zu groß*,
          *zu teuer*. По-русски «гостиная светлая», но «балкон светлый», а
          по-немецки и то и другое — просто *hell*.
        point: "После *sein* прилагательное без окончания: *Das Zimmer ist hell.*"
        set: { view: dialogue, dialogue: besichtigung, reveal: 2 }
      - read: >-
          Теперь ответы на вопрос «где?». *Auf dem Balkon* — на балконе, *in
          der Küche* — на кухне. После *in* и *auf* артикль меняет форму: *der
          Balkon* превращается в *dem Balkon*, *die Küche* — в *der Küche*. Это
          дательный падеж. Заметьте и разницу с русским: кухня у немцев тоже
          «внутри» — *in der Küche*, а не «на».
        point: "*auf dem Balkon* — на балконе, *in der Küche* — на кухне"
        set: { reveal: 5, focus: [2, 4] }
      - read: >-
          Стиральной машины в ванной нет: *sie steht im Keller*. *im* — это
          *in dem*, слитые в одно слово. Во многих немецких домах стиральные
          машины стоят в общем подвале. Мебель и технику немцы описывают
          глаголом *stehen* — «стоять»: *Im Schlafzimmer steht ein
          Kleiderschrank.* А в конце Марко решается: *Ich nehme sie* — «беру
          её». *sie* — это *die Wohnung*.
        point: "*im* = *in dem*: *im Keller*, *im Bad*, *im Schlafzimmer*"
        set: { reveal: 10, focus: [5, 6, 8, 9] }

  - id: raeume
    chapter: words
    title: Комнаты
    beats:
      - read: >-
          Посмотрите на род: *das Wohnzimmer*, *das Schlafzimmer* — средний,
          как *das Zimmer*, хотя по-русски «гостиная» и «спальня» женского
          рода. Ванную называют коротко *das Bad* или полностью *das
          Badezimmer*. Не путайте *die Wohnung* — квартиру — и *das Haus* —
          дом, здание. У *Zimmer* множественное число совпадает с
          единственным: *ein Zimmer, zwei Zimmer*.
        point: "*das Wohnzimmer*, *das Schlafzimmer* — средний род, как *das Zimmer*"
        set: { view: words, words: wohnung }

  - id: moebel
    chapter: words
    title: Мебель и техника
    beats:
      - read: >-
          Немецкий охотно склеивает слова. *der Kühlschrank* — «холодный
          шкаф», то есть холодильник. *der Kleiderschrank* — «шкаф для
          одежды», *der Schreibtisch* — «стол для письма». Где русский берёт
          прилагательное или суффикс, немецкий просто ставит слова подряд. А
          *die Möbel* — «мебель» — обычно употребляют во множественном числе:
          *Die Möbel sind neu.*
        point: "*der Kühlschrank* = *kühl* + *der Schrank*: немецкий склеивает слова"
        set: { view: words, words: moebel }

  - id: eigenschaften
    chapter: words
    title: Какая квартира?
    beats:
      - read: >-
          Прилагательные удобно учить парами: *groß – klein*, *hell –
          dunkel*, *ruhig – laut*. О цене в объявлениях пишут *günstig* —
          «недорогой», «выгодный». *billig* тоже значит «дешёвый», но часто с
          оттенком «дешёвка», поэтому о квартире так говорят редко. *möbliert*
          — «с мебелью»: в такую квартиру можно въехать, не купив ни одного
          стула.
        point: "*günstig* — недорогой, *billig* — дешёвый, часто с оттенком «дешёвка»"
        set: { view: words, words: eigenschaften }

  - id: miete
    chapter: words
    title: Аренда
    beats:
      - read: >-
          В Германии квартиры чаще снимают, чем покупают. *mieten* —
          «снимать», *der Vermieter* — хозяин, который сдаёт квартиру, *die
          Miete* — плата за неё. Площадь считают в квадратных метрах: *der
          Quadratmeter*, в объявлениях — *m²* или *qm*. И ловушка с этажами:
          *das Erdgeschoss* — это наш первый этаж, а *1. OG* — уже второй.
        point: "*das Erdgeschoss* (*EG*) — наш первый этаж, *1. OG* — второй"
        set: { view: words, words: miete }

  - id: komposita
    chapter: grammar
    title: Слово из слов
    beats:
      - read: >-
          В сложном слове главная — последняя часть. Она называет предмет и
          даёт ему род: *das Haus* + *die Tür* = *die Haustür*, ведь это
          дверь, а не дом. И наоборот: *die Treppe* + *das Haus* = *das
          Treppenhaus*, лестничная клетка. Множественное число — тоже по
          последней части: *die Kühlschränke*, как *die Schränke*. А ударение
          падает на первую: *KÜHLschrank*.
        point: "Род и мн. ч. — по последней части: *die Haustür*, *das Treppenhaus*"
        set: { view: table, table: komposita, focus: [5, 6] }

  - id: wo
    chapter: grammar
    title: Где? — дательный падеж
    beats:
      - read: >-
          На вопрос *Wo?* — «где?» — после *in* и *auf* артикль меняет форму.
          Это дательный падеж, *der Dativ*. Мужской и средний род получают
          *dem*: *der Balkon* → *auf dem Balkon*, *das Haus* → *in dem Haus*.
          Русский тоже меняет окончание — «на балконе», «в доме». Разница в
          том, что немецкий меняет не само слово, а артикль перед ним.
        point: "*Wo?* + *in* / *auf* → дательный: *der*, *das* → *dem*"
        set: { view: table, table: dativ, reveal: 3, focus: [0, 1] }
      - read: >-
          Самая коварная строка — женский род: *die Küche* → *in der Küche*.
          Да, *der* — тот же артикль, что у мужского рода в именительном
          падеже. Не пугайтесь: *der Tisch* — «стол», а *in der Küche* — «на
          кухне», после предлога путаницы не бывает. Главное — не говорить
          *in die Küche* на вопрос «где?»: это значит «на кухню», куда.
        point: "Женский род: *die* → *der*: *in der Küche*, *in der Lindenstraße*"
        set: { focus: [2] }
      - read: >-
          С неопределённым артиклем окончания те же: *-em* для мужского и
          среднего рода, *-er* для женского. *ein Haus* → *in einem Haus*,
          *eine Wohnung* → *in einer Wohnung*. Сравните пары: *d+em* —
          *ein+em*, *d+er* — *ein+er*. Запомните два окончания, *-em* и *-er*,
          — и дательный падеж в единственном числе у вас в руках.
        point: "*ein+em* — мужской и средний род, *ein+er* — женский: *in einer Wohnung*"
        set: { reveal: 6, focus: [3, 4, 5] }

  - id: im
    chapter: grammar
    title: im = in dem
    beats:
      - read: >-
          *in dem* немцы почти всегда сливают в одно слово: *im Keller*, *im
          Bad*, *im Wohnzimmer*. Полную форму вы услышите редко. С *auf*
          такого слияния нет — *auf dem Balkon*, и с женским родом тоже — *in
          der Küche*. А *am* вы уже знаете по *am Montag*: это тоже слияние,
          *an dem*. Тот же механизм, только с другим предлогом.
        point: "*in dem* → *im*, *an dem* → *am*; *auf dem* и *in der* не сливаются"
        set: { view: table, table: kurz }

  - id: satz
    chapter: grammar
    title: Место в предложении
    beats:
      - read: >-
          Ответ на вопрос «где?» — целая группа: *im Keller*, *in der Küche*,
          *auf dem Balkon*. В предложении она занимает одну позицию — как *in
          Leipzig* в первой теме. Обычно группа стоит в середине, после
          глагола: *Die Waschmaschine steht im Keller.* Вещи в квартире,
          кстати, «стоят»: шкаф, кровать и машина *stehen*, а не просто
          *sind*.
        point: "Место — одна позиция: *Die Waschmaschine steht im Keller.*"
        set:
          view: sentence
          rows:
            - de: [Die Waschmaschine, steht, im Keller., ""]
              ru: Стиральная машина стоит в подвале.
      - read: >-
          Поставим *im Keller* в начало — так говорил господин Крюгер: *Im
          Schlafzimmer steht auch ein Kleiderschrank.* Группа переезжает
          целиком, глагол *steht* остаётся на второй позиции, а подлежащее
          уходит в середину. Так удобно описывать квартиру: сначала место,
          потом то, что там есть. Разделить группу нельзя: *im* и *Keller*
          всегда вместе.
        point: "*Im Keller steht die Waschmaschine.* — место первым, глагол второй"
        set:
          rows:
            - de: [Im Keller, steht, die Waschmaschine., ""]
              ru: В подвале стоит стиральная машина.

  - id: adjektiv
    chapter: grammar
    title: Какая она?
    beats:
      - read: >-
          Посмотрите на русский перевод: «большой», «большая», «большое»,
          «большие» — прилагательное согласуется с существительным. В
          немецком после *sein* оно не меняется вообще: *groß* для любого рода
          и числа. Меняется только глагол — *ist* или *sind*. Окончания у
          прилагательного появятся, когда оно встанет перед существительным,
          но это уже другая тема.
        point: "После *sein* — без окончаний: *Der Balkon ist groß. Die Zimmer sind groß.*"
        set:
          view: sentence
          rows:
            - de: [Der Balkon, ist, groß., ""]
              ru: Балкон большой.
            - de: [Die Küche, ist, groß., ""]
              ru: Кухня большая.
            - de: [Das Fenster, ist, groß., ""]
              ru: Окно большое.
            - de: [Die Zimmer, sind, groß., ""]
              ru: Комнаты большие.

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как сказать, что кровать стоит в спальне?
        read: >-
          *Das Bett steht im Schlafzimmer.* *das Schlafzimmer* — средний род,
          как *das Zimmer*, поэтому *in dem*, а вместе — *im*. Глагол —
          *steht*: кровать, как и шкаф, «стоит». Две частые ошибки: *in das
          Schlafzimmer* — артикль не изменился, и *auf dem Schlafzimmer* — в
          комнате по-немецки всегда *in*. *auf* оставьте для поверхностей:
          *auf dem Tisch*, *auf dem Balkon*.
        point: "*Das Bett steht im Schlafzimmer.* — комната всегда с *in*"
        set:
          view: sentence
          rows:
            - de: [Das Bett, steht, im Schlafzimmer., ""]
              ru: Кровать стоит в спальне.
      - question: Как спросить хозяина, тихая ли спальня?
        read: >-
          *Ist das Schlafzimmer ruhig?* Это вопрос да/нет, поэтому глагол
          *ist* встаёт в начало, а первая позиция пустеет. Прилагательное
          *ruhig* остаётся без окончания и стоит в конце. Можно спросить и
          короче: *Ist es ruhig?* — *es* заменяет *das Schlafzimmer*, потому
          что слово среднего рода. А о кухне спросите *Ist sie groß?* — *die
          Küche* женского рода.
        point: "*Ist das Schlafzimmer ruhig?* — глагол первым, прилагательное без окончания"
        before:
          view: sentence
          rows:
            - de: [Das Schlafzimmer, ist, ruhig., ""]
              ru: Спальня тихая.
        set:
          rows:
            - de: ["", Ist, das Schlafzimmer ruhig?, ""]
              ru: Спальня тихая?
      - question: Какой род у слова *Schreibtischlampe*?
        read: >-
          *die Schreibtischlampe* — настольная лампа. Слово из трёх частей:
          *schreiben* + *der Tisch* + *die Lampe*. Длина не важна: род всегда
          даёт последняя часть, а это *die Lampe*. Длинные слова разбирайте с
          конца — так быстрее понять, что это за предмет. Немцы склеивают и
          четыре, и пять частей, а правило остаётся тем же.
        point: "*die Schreibtischlampe* — род по последней части, *die Lampe*"
        set: { view: words, words: moebel, focus: [10, 11] }

  - id: lesen2
    chapter: exam
    title: "Чтение, часть 2: объявления"
    beats:
      - read: >-
          Объявления о квартирах экономят место, поэтому почти всё в них
          сокращено. Типичная строка: *2-Zi.-Whg., 55 m², Blk., KM 520 €*.
          Сокращений немного, и они повторяются из объявления в объявление.
          Самые важные — про деньги: *KM*, *NK* и *WM*. Выучите эту таблицу —
          и любое объявление читается за полминуты.
        point: "*Zi.* — комната, *Whg.* — квартира, *Blk.* — балкон, *KM* / *NK* / *WM* — аренда"
        set: { view: table, table: abk }
      - read: >-
          Во второй части чтения — объявления и сайты. Сверху ситуация: кто вы
          и что ищете. Ниже два объявления, *a* и *b*, и подходит только одно.
          Сначала выделите в ситуации все требования — здесь их два: *mit
          Balkon* и *maximal 600 Euro warm*. Потом проверяйте каждое
          объявление по обоим пунктам, а не только по первому.
        point: "Выпишите из ситуации все требования и проверьте по ним оба объявления"
        set: { view: task, task: anzeigen }
      - question: Какое объявление подходит — *a* или *b*?
        read: >-
          *b*. В объявлении *a* балкон стоит прямо в заголовке, и на этом
          легко остановиться. Но там указана холодная аренда: *KM 520 €* и *NK
          150 €* — вместе 670 евро, больше, чем можно. В объявлении *b* сразу
          тёплая аренда, *WM 590 €*, и балкон тоже есть. Деньги всегда
          считайте в тёплой аренде.
        point: "*KM* + *NK* = *WM*: сравнивайте объявления по тёплой аренде"
        set: { solved: true }

  - id: lesen3
    chapter: exam
    title: "Чтение, часть 3: правила дома"
    beats:
      - read: >-
          Третья часть чтения — таблички и объявления: на двери, в подъезде, в
          магазине. Здесь — правила дома, *die Hausordnung*. Их вешают почти в
          каждом немецком подъезде. *Ruhezeit* — «время тишины»: с 22 до 6
          часов шуметь нельзя, и соседи за этим следят. Дательный падеж тут
          почти в каждой строке: *im Keller*, *im Treppenhaus*, *im Hof*.
        point: "*die Hausordnung* — правила дома, *die Ruhezeit* — время тишины"
        set: { view: task, task: hausordnung }
      - question: "*Ihr Fahrrad kann im Treppenhaus stehen.* — *richtig* или *falsch*?"
        read: >-
          *Falsch.* На табличке ясно сказано: *Fahrräder bitte nur im Keller
          abstellen, nicht im Treppenhaus!* Всё решают два коротких слова:
          *nur* — «только» и *nicht* — «не». На экзамене такие слова стоит
          подчёркивать: они переворачивают смысл. И заметьте: *das
          Treppenhaus* среднего рода — по последней части, *das Haus*. Слово
          *abstellen* — «ставить, оставлять» — на табличках встречается
          постоянно.
        point: "Ищите короткие слова, которые меняют смысл: *nur*, *nicht*, *kein*"
        set: { solved: true }

exercises:
  - type: choice
    q: ___ Schlafzimmer ist klein.
    options: [Der, Die, Das]
    answer: 2
    why: "*das Zimmer* → *das Schlafzimmer*: род по последней части."
  - type: choice
    q: ___ Haustür ist offen.
    options: [Der, Die, Das]
    answer: 1
    why: "*das Haus* + *die Tür* = *die Haustür*. Решает последняя часть."
  - type: gap
    q: Die Waschmaschine steht ___ Keller.
    answer: [im]
    hint: in + dem
    why: "*der Keller* → *in dem Keller* → *im Keller*."
  - type: gap
    q: Der Herd ist in ___ Küche.
    answer: [der]
    hint: die Küche
    why: "Женский род в дательном: *die* → *der*. *in die Küche* — это «на кухню», куда."
  - type: gap
    q: Wir sitzen auf ___ Balkon.
    answer: [dem]
    hint: der Balkon
    why: "*der Balkon* → *auf dem Balkon*. *auf dem* не сливается."
  - type: choice
    q: Marco wohnt jetzt in ___ Wohnung in Gohlis.
    options: [eine, einer, einem]
    answer: 1
    why: "*eine Wohnung* → *in einer Wohnung*: у женского рода *-er*."
  - type: gap
    q: Meine Schwester wohnt in ___ Haus in Rom.
    answer: [einem]
    hint: ein Haus
    why: "*das Haus* — средний род: *in einem Haus*."
  - type: choice
    q: Wo ist das Bett? – ___ Schlafzimmer.
    options: [Im, In der, Auf dem]
    answer: 0
    why: "*das Schlafzimmer* → *in dem* → *im*. В комнате — всегда *in*, не *auf*."
  - type: choice
    q: Die Küche ist ___.
    options: [klein, kleine, kleiner]
    answer: 0
    why: "После *sein* прилагательное без окончания — для любого рода."
  - type: gap
    q: Die Zimmer ___ hell und ruhig.
    answer: [sind]
    hint: sein
    why: "Множественное число — *sind*, а прилагательные не меняются."
  - type: choice
    q: Что значит *NK* в объявлении о квартире?
    options: [Nebenkosten, Nähe Kino, neue Küche]
    answer: 0
    why: "*NK* — *Nebenkosten*: вода, отопление, мусор. *KM* + *NK* = *WM*."
  - type: choice
    q: "В объявлении: *KM 450 €, NK 130 €*. Сколько составит *Warmmiete*?"
    options: [450 €, 580 €, 320 €]
    answer: 1
    why: "*Warmmiete* = *Kaltmiete* + *Nebenkosten*: 450 + 130 = 580 евро."
  - type: order
    ru: Холодильник стоит на кухне.
    de: Der Kühlschrank steht in der Küche.
    why: "*die Küche* → *in der Küche*. По-русски «на кухне», по-немецки — *in*."
  - type: order
    ru: В спальне стоит шкаф.
    de: Im Schlafzimmer steht ein Schrank.
    why: "Место на первой позиции, глагол второй, подлежащее — за ним."
  - type: order
    ru: Ванная маленькая, но современная.
    de: Das Bad ist klein, aber modern.
