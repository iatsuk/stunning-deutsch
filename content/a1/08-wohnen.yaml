case:
  title: Der Schlüssel und das falsche Zimmer
  ru: Ключ и неверная комната
  intro: Гостям передали карточку квартиры с перепутанными комнатами и ценами. Сверьте исходное
    объявление и сообщения хозяина, прежде чем направлять людей не туда.
  people:
    K:
      name: Herr Krüger
      voice: Eddy
  steps:
    - read: Один листок указывает только 450 евро. В полном учебном предложении есть ещё одна строка.
      evidence:
        - note: Kaltmiete 450 Euro. Nebenkosten 130 Euro. Zusammen 580 Euro.
          ru: Базовая аренда 450 евро. Дополнительные платежи 130 евро. Вместе 580 евро.
      question: Какую указанную сумму нужно записать для этой задачи?
      options:
        - 450 €
        - 580 €
        - 130 €
      answer: 1
      right: "В этой смете обе строки складываются: 450 + 130 = 580."
      wrong:
        - Здесь не учтены названные дополнительные платежи.
        - null
        - Это только дополнительные платежи, не вся названная сумма.
    - read: В карточке нарисовали машину в ванной. Хозяин говорит другое.
      evidence:
        - K: Die Waschmaschine steht im Keller, nicht im Bad.
          ru: Стиральная машина стоит в подвале, не в ванной.
      question: Куда направить гостя к стиральной машине?
      options:
        - Im Keller
        - Im Bad
        - Auf dem Balkon
      answer: 0
      right: "*Im Keller* — нужное место. Ванную исключает *nicht*."
      wrong:
        - null
        - Это место прямо исключено.
        - Балкон не назван местом машины.
    - read: На конверте подписано *Hausschlüssel*. Не спутайте длинное слово с названием помещения.
      evidence:
        - note: Der Hausschlüssel ist auf dem Tisch im Wohnzimmer.
          ru: Ключ от дома на столе в гостиной.
      question: Что ищут гости и где?
      options:
        - Ключ — на столе в гостиной
        - Дом — в спальне
        - Стол — в подвале
      answer: 0
      right: "Последняя часть *Schlüssel* называет предмет. Две группы места уточняют: на столе, в
        гостиной."
      wrong:
        - null
        - В слове главная часть — ключ, не дом.
        - Ни предмет, ни комната не совпадают с запиской.
    - read: Осталось проверить строку о велосипедах. В неверной копии пропущено одно короткое слово.
      evidence:
        - note: Fahrräder bitte nur im Keller abstellen, nicht im Treppenhaus!
          ru: Велосипеды, пожалуйста, оставляйте только в подвале, не на лестнице!
      question: Какую инструкцию передать гостям?
      options:
        - Велосипед можно оставить в любом месте
        - Велосипед — в подвале; лестница исключена
        - Велосипед нужно оставить на балконе
      answer: 1
      right: "*Nur* ограничивает место, *nicht* исключает лестницу. Без этих слов копия меняет
        правило."
      wrong:
        - Это убирает ключевые ограничения оригинала.
        - null
        - Балкон в инструкции не назван.
  ending: "Карточка исправлена: сумма указана полностью, техника и ключ находятся в правильных
    местах, правила переданы без пропусков. В неверной копии терялись короткие слова и
    уточнения. Теперь гости готовы идти в клуб — осталось разобраться в маршруте по Килю."
