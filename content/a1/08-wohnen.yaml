tables:
  komposita:
    title: Zusammengesetzte Wörter
    ru: Сложные слова
    head: [ Wort 1, Wort 2, Kompositum, По-русски ]
    ruCols: [ 3 ]
    rows:
      - [ schlafen, das Zimmer, das Schlaf*zimmer*, спальня ]
      - [ wohnen, das Zimmer, das Wohn*zimmer*, гостиная ]
      - [ kühl, der Schrank, der Kühl*schrank*, холодильник ]
      - [ die Kleider, der Schrank, der Kleider*schrank*, платяной шкаф ]
      - [ waschen, die Maschine, die Wasch*maschine*, стиральная машина ]
      - [ das Haus, die Tür, die Haus*tür*, входная дверь ]
      - [ die Treppe, das Haus, das Treppen*haus*, лестничная клетка ]
    note: Род и множественное число — по последней части. Ударение — на первой.
  dativ:
    title: "in / auf + Dativ"
    ru: Где? — дательный падеж
    head: [ Род, "Wer? Was?", "Wo?" ]
    ruCols: [ 0 ]
    rows:
      - [ мужской, der Balkon, auf d+em Balkon ]
      - [ средний, das Haus, in d+em Haus ]
      - [ женский, die Küche, in d+er Küche ]
      - [ мужской, ein Balkon, auf ein+em Balkon ]
      - [ средний, ein Haus, in ein+em Haus ]
      - [ женский, eine Küche, in ein+er Küche ]
    note: "Во множественном числе — *den*, а к слову добавляется *-n*: *in den Zimmern*."
  kurz:
    title: im = in dem
    ru: Предлог и артикль сливаются
    head: [ Präposition + Artikel, Form, Beispiel ]
    rows:
      - [ in + d+em, im, Die Waschmaschine steht im Keller. ]
      - [ an + d+em, am, Am Montag besichtigt Mateo die Wohnung. ]
      - [ auf + d+em, auf dem, Wir sitzen auf dem Balkon. ]
      - [ in + d+er, in der, Der Herd ist in der Küche. ]
    note: "*in* и *an* сливаются с *dem*. *auf dem* и *in der* остаются как есть."
  abk:
    title: Abkürzungen in Wohnungsanzeigen
    ru: Сокращения в объявлениях
    head: [ Abkürzung, Bedeutung, По-русски ]
    ruCols: [ 2 ]
    rows:
      - [ Zi., Zimmer, комната ]
      - [ Whg., Wohnung, квартира ]
      - [ Kü. / EBK, Küche / Einbauküche, кухня / встроенная кухня с техникой ]
      - [ Blk., Balkon, балкон ]
      - [ m² / qm, Quadratmeter, квадратный метр ]
      - [ KM, Kaltmiete, аренда без коммунальных ]
      - [ NK, Nebenkosten, коммунальные платежи ]
      - [ WM, Warmmiete, аренда вместе с коммунальными ]
      - [ EG / 1. OG, Erdgeschoss / 1. Obergeschoss, наш 1-й этаж / наш 2-й этаж ]
      - [ ab sof., ab sofort, сразу ]
      - [ möbl., möbliert, с мебелью ]
  stock:
    title: Der erste, zweite, dritte Stock
    ru: Этажи и порядковые числа
    head: [ Anzeige, Welcher Stock?, Wo?, По-русски ]
    ruCols: [ 3 ]
    rows:
      - [ EG, das Erdgeschoss, im Erdgeschoss, первый этаж ]
      - [ 1. OG, der erst+e Stock, im erst+en Stock, второй этаж ]
      - [ 2. OG, der zwei+te Stock, im zwei+ten Stock, третий этаж ]
      - [ 3. OG, der dritt+e Stock, im dritt+en Stock, четвёртый этаж ]
      - [ 4. OG, der vier+te Stock, im vier+ten Stock, пятый этаж ]
      - [ 5. OG, der fünf+te Stock, im fünf+ten Stock, шестой этаж ]
    note: "Порядковое число — число + *-te*: *zwei+te*, *vier+te*; исключения — *erste* и *dritte*. После *im* окончание *-en*: *im zweiten Stock*."
  ordinal:
    title: Erste, zweite, dritte …
    ru: Порядковые числа целиком
    head: [ Zahl, Ordinalzahl, "im …", По-русски ]
    ruCols: [ 3 ]
    rows:
      - [ "1.", der erst+e, im erst+en, первый ]
      - [ "2.", der zwei+te, im zwei+ten, второй ]
      - [ "3.", der dritt+e, im dritt+en, третий ]
      - [ "4.", der vier+te, im vier+ten, четвёртый ]
      - [ "7.", der sieb+te, im sieb+ten, седьмой ]
      - [ "8.", der acht+e, im acht+en, восьмой ]
      - [ "19.", der neunzehn+te, im neunzehn+ten, девятнадцатый ]
      - [ "20.", der zwanzig+ste, im zwanzig+sten, двадцатый ]
      - [ "31.", der einunddreißig+ste, im einunddreißig+sten, тридцать первый ]
    note: "До 19 — число + *-te*, с 20 — *-ste*. Исключений четыре: *erste*, *dritte*, *siebte*, *achte*. После *im* — *-en*. Точка после цифры — порядковое число: *7.* = *siebte*."

tasks:
  anzeigen:
    kind: ads
    part: lesen-2
    title: Wohnungsanzeigen
    situation: Sie suchen eine Wohnung mit Balkon. Sie möchten maximal 600 Euro warm bezahlen.
    options:
      - title: "Wik: 2-Zi.-Whg. mit Blk."
        text: |-
          55 m², 2. OG, EBK
          KM 520 €, NK 150 €
          ab sofort frei
          Tel. 0431 / 56 23 89
      - title: 2-Zi.-Whg. nahe Holtenauer Straße
        text: |-
          48 m², 1. OG, Blk.
          ruhig und hell
          WM 580 €
          ab sofort frei
          Tel. 0431 / 98 47 12
    answer: 1
  hausordnung:
    kind: sign
