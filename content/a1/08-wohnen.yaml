    text: Der Hausschlüssel ist auf dem Tisch im Wohnzimmer, nicht im Schlafzimmer. Das Sofa ist
      auch im Wohnzimmer.

steps:
  - id: anzeige
    chapter: scene
    title: Жильё для Лусии и Диего
    beats:
      - read: >-
          Гости Матео ищут квартиру: *Lucía und Diego suchen eine Wohnung. Ihr Zimmer ist zu
          klein.* Сам Матео по-прежнему живёт в Holtenau и помогает с чтением объявления. Дана
          находит *zwei Zimmer, Küche, Bad und Balkon*. В таком объявлении *2-Zimmer-Wohnung*
          означает две жилые комнаты; кухня и ванная указаны отдельно. Все объявления и цены в
          теме вымышлены для языковых задач.
        point: "*2-Zimmer-Wohnung* — две комнаты; кухня и ванная не в счёт"
        set: { view: dialogue, dialogue: anzeige, reveal: 2 }
      - read: >-
          В этой учебной смете *450 Euro kalt* — базовая плата за квартиру. Указанные *130 Euro
          Nebenkosten* прибавляются отдельно: получается 580 евро. Так читаем связь
          *Kaltmiete*, *Nebenkosten*, *Warmmiete* в данном объявлении. Не считайте слово *warm*
          обещанием включить абсолютно любые расходы: для задачи учитываем именно названные
          строки. Это пример чтения объявления, а не описание текущих цен аренды в Киле.
        point: "*Kaltmiete* + *Nebenkosten* = *Warmmiete*"
        set: { reveal: 6, focus: [ 3, 4, 5 ] }
      - read: >-
          Квартира находится *in der Holtenauer Straße, im zweiten Stock*. По-русски живут «на
          улице», а здесь нужен *in der Straße*. Почему *der*, если слово *die Straße*, — вопрос
          этой темы. *im zweiten Stock* — это наш третий этаж: немцы считают этажи над землёй,
          об этом — во фрагменте «На каком этаже?». Матео говорит *Ich rufe gleich an*:
          сначала он уточнит условия, затем передаст информацию Лусии и Диего. Решение о жилье
          остаётся за гостями.
        point: "Улица — *in der …straße*: по-немецки «в улице», а не «на»"
        set: { reveal: 9, focus: [ 6, 7, 8 ] }

  - id: besichtigung
    chapter: scene
    title: Смотрим квартиру
    beats:
      - read: >-
          Хозяин квартиры, господин Крюгер, показывает комнаты: *der Flur* — прихожая, *das
          Wohnzimmer* — гостиная. Матео доволен: *Das Wohnzimmer ist groß und hell!*
          Прилагательное после *ist* остаётся в словарной форме — вы уже видели это в теме о
          покупках: *zu groß*, *zu teuer*. По-русски «гостиная светлая», но «балкон светлый», а
          по-немецки и то и другое — просто *hell*.
        point: "После *sein* прилагательное без окончания: *Das Zimmer ist hell.*"
        set: { view: dialogue, dialogue: besichtigung, reveal: 2 }
      - read: >-
          Теперь ответы на вопрос «где?». *Auf dem Balkon* — на балконе, *in der Küche* — на
          кухне. После *in* и *auf* артикль меняет форму: *der Balkon* превращается в *dem
          Balkon*, *die Küche* — в *der Küche*. Это дательный падеж. Заметьте и разницу с
          русским: кухня у немцев тоже «внутри» — *in der Küche*, а не «на».
        point: "*auf dem Balkon* — на балконе, *in der Küche* — на кухне"
        set: { reveal: 5, focus: [ 2, 3, 4 ] }
      - read: >-
          Стиральной машины в ванной нет: *sie steht im Keller*. *Im* — это *in dem*, слитые в
          одно слово. В этой квартире машина стоит в подвале, а шкаф — в спальне: *Im
          Schlafzimmer steht auch ein Kleiderschrank*. В конце Матео говорит *Ich finde sie
          gut. Ich rufe Lucía und Diego an.* *Sie* заменяет *die Wohnung*. Он передаёт гостям
          впечатление, а не принимает за них окончательное решение.
        point: "*im* = *in dem*: *im Keller*, *im Bad*, *im Schlafzimmer*"
        set: { reveal: 10, focus: [ 5, 6, 8, 9 ] }

  - id: raeume
    chapter: words
    title: Комнаты
    beats:
      - read: >-
          Посмотрите на род: *das Wohnzimmer*, *das Schlafzimmer* — средний, как *das Zimmer*,
          хотя по-русски «гостиная» и «спальня» женского рода. Ванную называют коротко *das
          Bad* или полностью *das Badezimmer*. Не путайте *die Wohnung* — квартиру — и *das
          Haus* — дом, здание. У *Zimmer* множественное число совпадает с единственным: *ein
          Zimmer, zwei Zimmer*.
        point: "*das Wohnzimmer*, *das Schlafzimmer* — средний род, как *das Zimmer*"
        set: { view: words, words: wohnung }

  - id: moebel
    chapter: words
    title: Мебель и техника
    beats:
      - read: >-
          Немецкий охотно склеивает слова. *der Kühlschrank* — «холодный шкаф», то есть
          холодильник. *der Kleiderschrank* — «шкаф для одежды», *der Schreibtisch* — «стол для
          письма». Где русский берёт прилагательное или суффикс, немецкий просто ставит слова
          подряд. А *die Möbel* — «мебель» — обычно употребляют во множественном числе: *Die
          Möbel sind neu.*
        point: "*der Kühlschrank* = *kühl* + *der Schrank*: немецкий склеивает слова"
        set: { view: words, words: moebel }

  - id: eigenschaften
    chapter: words
    title: Какая квартира?
    beats:
      - read: >-
          При описании квартиры полезны пары *groß – klein*, *hell – dunkel*, *ruhig – laut*.
          *Günstig* — «недорогой» или «выгодный», *billig* — «дешёвый»; оттенок зависит от
          контекста. *Möbliert* сообщает о мебели, но конкретный набор ищут в тексте
          объявления. В игре нельзя выбрать вариант только по одному привлекательному слову:
          должны совпасть условия.
        point: "*günstig* — недорогой, *billig* — дешёвый, часто с оттенком «дешёвка»"
        set: { view: words, words: eigenschaften }

  - id: miete
    chapter: words
    title: Аренда
    beats:
      - read: >-
          *Mieten* — снимать жильё, *der Vermieter* — тот, кто его сдаёт, *die Miete* — плата.
          Площадь обозначают *m²* или *qm*: *der Quadratmeter*. *Erdgeschoss*, сокращённо *EG*,
          — этаж на уровне земли; *1. OG* — следующий над ним. Это помогает понимать объявления
          и находить нужный этаж. Наши герои используют вымышленные предложения, а не выбирают
          реальный договор.
        point: "*das Erdgeschoss* (*EG*) — наш первый этаж, *1. OG* — второй"
        set: { view: words, words: miete }

  - id: komposita
    chapter: grammar
    title: Слово из слов
    beats:
      - read: >-
          В сложном слове главная — последняя часть. Она называет предмет и даёт ему род: *das
          Haus* + *die Tür* = *die Haustür*, ведь это дверь, а не дом. И наоборот: *die Treppe*
          + *das Haus* = *das Treppenhaus*, лестничная клетка. Множественное число — тоже по
          последней части: *die Kühlschränke*, как *die Schränke*. А ударение падает на первую:
          *KÜHLschrank*.
        point: "Род и мн. ч. — по последней части: *die Haustür*, *das Treppenhaus*"
        set: { view: table, table: komposita, focus: [ 2, 5, 6 ] }

  - id: wo
    chapter: grammar
    title: Где? — дательный падеж
    beats:
      - read: >-
          На вопрос *Wo?* — «где?» — после *in* и *auf* артикль меняет форму. Это дательный
          падеж, *der Dativ*. Мужской и средний род получают *dem*: *der Balkon* → *auf dem
          Balkon*, *das Haus* → *in dem Haus*. Русский тоже меняет окончание — «на балконе», «в
          доме». Разница в том, что немецкий меняет не само слово, а артикль перед ним.
        point: "*Wo?* + *in* / *auf* → дательный: *der*, *das* → *dem*"
        set: { view: table, table: dativ, reveal: 3, focus: [ 0, 1 ] }
      - read: >-
          Самая коварная строка — женский род: *die Küche* → *in der Küche*. Да, *der* — тот же
          артикль, что у мужского рода в именительном падеже. Не пугайтесь: *der Tisch* —
          «стол», а *in der Küche* — «на кухне», после предлога путаницы не бывает. Главное —
          не говорить *in die Küche* на вопрос «где?»: это значит «на кухню», куда.
        point: "Женский род: *die* → *der*: *in der Küche*, *in der Holtenauer Straße*"
        set: { focus: [ 2 ] }
      - read: >-
          С неопределённым артиклем окончания те же: *-em* для мужского и среднего рода, *-er*
          для женского. *ein Haus* → *in einem Haus*, *eine Wohnung* → *in einer Wohnung*.
          Сравните пары: *d+em* — *ein+em*, *d+er* — *ein+er*. Запомните два окончания, *-em* и
          *-er*, — и дательный падеж в единственном числе у вас в руках.
        point: "*ein+em* — мужской и средний род, *ein+er* — женский: *in einer Wohnung*"
        set: { reveal: 6, focus: [ 3, 4, 5 ] }

  - id: im
    chapter: grammar
    title: im = in dem
    beats:
      - read: >-
          *in dem* немцы почти всегда сливают в одно слово: *im Keller*, *im Bad*, *im
          Wohnzimmer*. Полную форму вы услышите редко. С *auf* такого слияния нет — *auf dem
          Balkon*, и с женским родом тоже — *in der Küche*. А *am* вы уже знаете по *am
          Montag*: это тоже слияние, *an dem*. Тот же механизм, только с другим предлогом.
        point: "*in dem* → *im*, *an dem* → *am*; *auf dem* и *in der* не сливаются"
        set: { view: table, table: kurz }

  - id: stock
    chapter: grammar
    title: На каком этаже?
    beats:
      - read: >-
          Немцы считают этажи над землёй: *das Erdgeschoss* — наш первый этаж, а *der erste
          Stock* — уже второй. Поэтому квартира *im zweiten Stock* — на нашем третьем этаже.
          *erste*, *zweite* — порядковые числа: к числу добавляется *-te*, *vier* → *vierte*.
          Исключения — *erste* и *dritte*. После *im* у числа окончание *-en*: *im ersten
          Stock*, как *im Keller*, только с числом посередине.
        point: "*im ersten Stock* — наш второй этаж; *zwei* → *zweite*, но *erste*, *dritte*"
        set: { view: table, table: stock }
      - read: >-
          Дана читает Матео объявление: *im zweiten Stock*. В самом объявлении то же написано
          цифрой с точкой — *2. OG*. Точка после числа и значит «-й»: *der 2. Stock* читается
          *der zweite Stock*. Так же потом будут записываться даты: *der 2. Juni*. Дома в
          Киле невысокие, но правило одно на все порядковые числа — его стоит выучить сразу целиком.
        point: "*2. OG* = *der zweite Stock*: точка после цифры — порядковое число"
        set: { view: dialogue, dialogue: anzeige, reveal: 7, focus: [ 6 ] }
      - read: >-
          Всё правило умещается в две строки. До 19 к числу добавляется *-te*: *vierte*,
          *neunzehnte*. С 20 окончание длиннее — *-ste*: *zwanzigste*, *einunddreißigste*.
          Исключений четыре: *erste*, *dritte*, *siebte* — у *sieben* выпадает *-en* — и
          *achte*: у *acht* уже есть своё *t*. После *im* у порядкового числа окончание *-en*.
          С этим правилом потом не придётся ничего доучивать: в дороге и в датах оно то же.
        point: "До 19 — *-te*, с 20 — *-ste*; исключения: *erste*, *dritte*, *siebte*, *achte*"
        set: { view: table, table: ordinal }

  - id: satz
    chapter: grammar
    title: Место в предложении
    beats:
      - read: >-
          Ответ на вопрос «где?» — целая группа: *im Keller*, *in der Küche*, *auf dem Balkon*.
          В предложении она занимает одну позицию — как *in Kiel* в первой теме. Обычно группа
          стоит в середине, после глагола: *Die Waschmaschine steht im Keller.* Вещи в
          квартире, кстати, «стоят»: шкаф, кровать и машина *stehen*, а не просто *sind*.
        point: "Место — одна позиция: *Die Waschmaschine steht im Keller.*"
        set:
          view: sentence
          rows:
            - de: [ Die Waschmaschine, steht, im Keller., "" ]
              ru: Стиральная машина стоит в подвале.
      - read: >-
          Поставим *im Keller* в начало — так говорил господин Крюгер: *Im Schlafzimmer steht
          auch ein Kleiderschrank.* Группа переезжает целиком, глагол *steht* остаётся на
          второй позиции, а подлежащее уходит в середину. Так удобно описывать квартиру:
          сначала место, потом то, что там есть. Разделить группу нельзя: *im* и *Keller*
          всегда вместе.
        point: "*Im Keller steht die Waschmaschine.* — место первым, глагол второй"
        set:
          rows:
            - de: [ Im Keller, steht, die Waschmaschine., "" ]
              ru: В подвале стоит стиральная машина.

  - id: adjektiv
    chapter: grammar
    title: Какая она?
    beats:
      - read: >-
          Посмотрите на русский перевод: «большой», «большая», «большое», «большие» —
          прилагательное согласуется с существительным. В немецком после *sein* оно не меняется
          вообще: *groß* для любого рода и числа. Меняется только глагол — *ist* или *sind*.
          Окончания у прилагательного появятся, когда оно встанет перед существительным, но это
          уже другая тема.
        point: "После *sein* — без окончаний: *Der Balkon ist groß. Die Zimmer sind groß.*"
        set:
          view: sentence
          rows:
            - de: [ Der Balkon, ist, groß., "" ]
              ru: Балкон большой.
            - de: [ Die Küche, ist, groß., "" ]
              ru: Кухня большая.
            - de: [ Das Fenster, ist, groß., "" ]
              ru: Окно большое.
            - de: [ Die Zimmer, sind, groß., "" ]
              ru: Комнаты большие.

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как сказать, что кровать стоит в спальне?
        read: >-
          *Das Bett steht im Schlafzimmer.* *das Schlafzimmer* — средний род, как *das Zimmer*,
          поэтому *in dem*, а вместе — *im*. Глагол — *steht*: кровать, как и шкаф, «стоит».
          Две частые ошибки: *in das Schlafzimmer* — артикль не изменился, и *auf dem
          Schlafzimmer* — в комнате по-немецки всегда *in*. *auf* оставьте для поверхностей:
          *auf dem Tisch*, *auf dem Balkon*.
        point: "*Das Bett steht im Schlafzimmer.* — комната всегда с *in*"
        set:
          view: sentence
          rows:
            - de: [ Das Bett, steht, im Schlafzimmer., "" ]
              ru: Кровать стоит в спальне.
      - question: Как спросить хозяина, тихая ли спальня?
        read: >-
          *Ist das Schlafzimmer ruhig?* Это вопрос да/нет, поэтому глагол *ist* встаёт в
          начало, а первая позиция пустеет. Прилагательное *ruhig* остаётся без окончания и
          стоит в конце. Можно спросить и короче: *Ist es ruhig?* — *es* заменяет *das
          Schlafzimmer*, потому что слово среднего рода. А о кухне спросите *Ist sie groß?* —
          *die Küche* женского рода.
        point: "*Ist das Schlafzimmer ruhig?* — глагол первым, прилагательное без окончания"
        before:
          view: sentence
          rows:
            - de: [ Das Schlafzimmer, ist, ruhig., "" ]
              ru: Спальня тихая.
        set:
          rows:
            - de: [ "", Ist, das Schlafzimmer ruhig?, "" ]
              ru: Спальня тихая?
      - question: Какой род у слова *Schreibtischlampe*?
        read: >-
          *die Schreibtischlampe* — настольная лампа. Слово из трёх частей: *schreiben* + *der
          Tisch* + *die Lampe*. Длина не важна: род всегда даёт последняя часть, а это *die
          Lampe*. Длинные слова разбирайте с конца — так быстрее понять, что это за предмет.
          Немцы склеивают и четыре, и пять частей, а правило остаётся тем же.
        point: "*die Schreibtischlampe* — род по последней части, *die Lampe*"
        set: { view: words, words: moebel, focus: [ 1, 10, 11 ] }

  - id: lesen2
    chapter: exam
    title: "Чтение, часть 2: объявления"
    beats:
      - read: >-
          Объявления экономят место: *2-Zi.-Whg., 55 m², Blk., KM 520 €*. Сокращения
          повторяются, поэтому таблица — справочник для действия. Найдите число комнат, наличие
          балкона и способ указания цены. Не нужно заучивать всё до чтения: в игре вы вернётесь
          к нужным сокращениям, чтобы выбрать подходящее объявление.
        point: "*Zi.* — комната, *Whg.* — квартира, *Blk.* — балкон, *KM* / *NK* / *WM* — аренда"
        set: { view: table, table: abk }
      - read: >-
          Во второй части чтения — объявления и сайты. Сверху ситуация: кто вы и что ищете.
          Ниже два объявления, *a* и *b*, и подходит только одно. Сначала выделите в ситуации
          все требования — здесь их два: *mit Balkon* и *maximal 600 Euro warm*. Потом
          проверяйте каждое объявление по обоим пунктам, а не только по первому.
        point: "Выпишите из ситуации все требования и проверьте по ним оба объявления"
        set: { view: task, task: anzeigen }
      - question: Какое объявление подходит — *a* или *b*?
        read: >-
          *b*. В объявлении *a* балкон стоит прямо в заголовке, и на этом легко остановиться.
          Но там указана холодная аренда: *KM 520 €* и *NK 150 €* — вместе 670 евро, больше,
          чем можно. В объявлении *b* сразу тёплая аренда, *WM 580 €*, и балкон тоже есть. Для
          этой задачи сравниваем указанные расходы: у *a* — 670 евро, у *b* — 580.
        point: "*KM* + *NK* = *WM*: сравнивайте объявления по тёплой аренде"
        set: { solved: true }

  - id: lesen3
    chapter: exam
    title: "Чтение, часть 3: правила дома"
    beats:
      - read: >-
          На табличке — *die Hausordnung*, правила конкретного дома. В нашем примере *Ruhezeit*
          указана с 22 до 6 часов. Это не универсальное расписание для всех домов: на экзамене
          читают именно предъявленный текст. В строках много мест с дательным: *im Keller*, *im
          Treppenhaus*, *im Hof*. Важны и ограничения *nur* и *nicht*: они показывают, где
          можно оставить велосипед.
        point: "*die Hausordnung* — правила дома, *die Ruhezeit* — время тишины"
        set: { view: task, task: hausordnung }
      - question: "*Ihr Fahrrad kann im Treppenhaus stehen.* — *richtig* или *falsch*?"
        read: >-
          *Falsch.* На табличке ясно сказано: *Fahrräder bitte nur im Keller abstellen, nicht
          im Treppenhaus!* Всё решают два коротких слова: *nur* — «только» и *nicht* — «не». На
          экзамене такие слова стоит подчёркивать: они переворачивают смысл. И заметьте: *das
          Treppenhaus* среднего рода — по последней части, *das Haus*. Слово *abstellen* —
          «ставить, оставлять» — на табличках встречается постоянно.
        point: "Ищите короткие слова, которые меняют смысл: *nur*, *nicht*, *kein*"
        set: { solved: true }

spy:
  - de: "Das Bett steht im Schlafzimmer."
    wrong: "Das Bett steht in Schlafzimmer."
    why: "*in* и *dem* сливаются в *im*: без артикля здесь нельзя."
  - de: "Der Kühlschrank steht in der Küche."
    wrong: "Der Kühlschrank steht in die Küche."
    why: "На вопрос *Wo?* нужен дательный падеж: *in der Küche*."
  - de: "Die Küche ist klein."
    wrong: "Die Küche ist kleine."
    why: "После *sein* прилагательное стоит без окончания: *klein*."
  - de: "Das Schlafzimmer ist klein."
    wrong: "Die Schlafzimmer ist klein."
    why: "Род сложного слова даёт последняя часть: *das Zimmer*, значит *das Schlafzimmer*."

exercises:
  - type: choice
    q: ___ Schlafzimmer ist klein.
    options: [ Der, Die, Das ]
    answer: 2
    why: "*das Zimmer* → *das Schlafzimmer*: род по последней части."
  - type: choice
    q: ___ Haustür ist offen.
    options: [ Der, Die, Das ]
    answer: 1
    why: "*das Haus* + *die Tür* = *die Haustür*. Решает последняя часть."
  - type: gap
    q: Die Waschmaschine steht ___ Keller.
    answer: [ im ]
    hint: in + dem
    why: "*der Keller* → *in dem Keller* → *im Keller*."
  - type: gap
    q: Der Herd ist in ___ Küche.
    answer: [ der ]
    hint: die Küche
    why: "Женский род в дательном: *die* → *der*. *in die Küche* — это «на кухню», куда."
  - type: gap
    q: Wir sitzen auf ___ Balkon.
    answer: [ dem ]
    hint: der Balkon
    why: "*der Balkon* → *auf dem Balkon*. *auf dem* не сливается."
  - type: choice
    q: Mateo wohnt jetzt in ___ Wohnung in Holtenau.
    options: [ eine, einer, einem ]
    answer: 1
    why: "*eine Wohnung* → *in einer Wohnung*: у женского рода *-er*."
  - type: gap
    q: Meine Schwester wohnt in ___ Haus in Buenos Aires.
    answer: [ einem ]
    hint: ein Haus
    why: "*das Haus* — средний род: *in einem Haus*."
  - type: choice
    q: Wo ist das Bett? – ___ Schlafzimmer.
    options: [ Im, In der, Auf dem ]
    answer: 0
    why: "*das Schlafzimmer* → *in dem* → *im*. В комнате — всегда *in*, не *auf*."
  - type: choice
    q: Die Küche ist ___.
    options: [ klein, kleine, kleiner ]
    answer: 0
    why: "После *sein* прилагательное без окончания — для любого рода."
  - type: gap
    q: Die Zimmer ___ hell und ruhig.
    answer: [ sind ]
    hint: sein
    why: "Множественное число — *sind*, а прилагательные не меняются."
  - type: choice
    q: Что значит *NK* в объявлении о квартире?
    options: [ Nebenkosten, Nähe Kino, neue Küche ]
    answer: 0
    why: "*NK* — *Nebenkosten*: вода, отопление, мусор. *KM* + *NK* = *WM*."
  - type: choice
    q: "В объявлении: *KM 450 €, NK 130 €*. Сколько составит *Warmmiete*?"
    options: [ 450 €, 580 €, 320 € ]
    answer: 1
    why: "*Warmmiete* = *Kaltmiete* + *Nebenkosten*: 450 + 130 = 580 евро."
  - type: order
    ru: Холодильник стоит на кухне.
    also: ["In der Küche steht der Kühlschrank."]
    de: Der Kühlschrank steht in der Küche.
    why: "*die Küche* → *in der Küche*. По-русски «на кухне», по-немецки — *in*."
  - type: order
    ru: В спальне стоит шкаф.
    also: ["Ein Schrank steht im Schlafzimmer."]
    de: Im Schlafzimmer steht ein Schrank.
    why: "Место на первой позиции, глагол второй, подлежащее — за ним."
  - type: order
    ru: Ванная маленькая, но современная.
    also: ["Klein, aber modern ist das Bad."]
    de: Das Bad ist klein, aber modern.
  - type: choice
    q: Die Wohnung ist im ___ Stock.
    ru: Квартира на третьем этаже.
    options: [ zweiten, dritten, zweite ]
    answer: 0
    why: "Наш третий этаж — *im zweiten Stock*: немцы считают над *Erdgeschoss*. После *im* — *-en*."
  - type: gap
    q: Der Keller ist unten, das Bad ist im ___ Stock.
    answer: [ ersten ]
    hint: "1."
    why: "*eins* → *der erste*: исключение. После *im* — *im ersten Stock*."
  - type: choice
    q: Как прочитать *3. OG* в объявлении?
    options: [ der dritte Stock, der dreite Stock, drei Stock ]
    answer: 0
    why: "*drei* → *dritte*: исключение, как *erste*. Точка после цифры — порядковое число."
  - type: choice
    q: Как сказать «седьмой этаж»?
    options: [ der siebte Stock, der siebenste Stock, der siebzehnte Stock ]
    answer: 0
    why: "У *sieben* выпадает *-en*: *der siebte* (реже говорят *der siebente*). *-ste* — только с 20, а *siebzehnte* — семнадцатый."
  - type: choice
    q: Как сказать «двадцатый»?
    options: [ der zwanzigste, der zwanzigte, der zwanzigeste ]
    answer: 0
    why: "С 20 окончание *-ste*: *der zwanzigste*, *der einunddreißigste*."
  - type: choice
    q: Как сказать «на восьмом этаже»?
    options: [ im achten Stock, im achtten Stock, im acht Stock ]
    answer: 0
    why: "У *acht* уже есть *t*: *der achte*. После *im* — *-en*: *im achten Stock*."
adventure:
  kind: sequence
  title: Подготовьте жильё для гостей
  intro: Помогите Лусии и Диего разобраться в вымышленных объявлениях, найти нужные комнаты и
    понять правила дома. Задачи проверяют чтение и язык; цены и условия не являются реальными
    предложениями аренды.
  ending: Объявление укладывается в заданные условия, комнаты и техника найдены, правила переданы
    гостям, ключ обнаружен. Теперь нужно объяснить, как добраться от жилья до набережной и
    клуба.
  challenges:
    - id: choose-flat
      kind: select
      title: Выберите подходящее объявление
      intro: Гостям нужен балкон, а указанная общая плата должна быть не выше 600 евро. Сравните обе
        записи, включая дополнительные платежи.
      mode: reading
      clue:
        task: anzeigen
      options:
        - id: a
