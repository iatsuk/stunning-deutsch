id: arbeit
order: 11
title: Was sind Sie von Beruf?
ru: Работа и профессии
lede: >-
  Матео уже работает в Fördeblick, а перед праздником команда вспоминает, как он нашёл это
  место. Вернитесь к знакомству и собеседованию, восстановите опыт Даны и Матео и разберите,
  что уже сделано для клуба. Новая грамматика — Perfekt с *haben*, формы *war* и *hatte*,
  названия профессий.
goals:
  - Назвать профессию — свою и чужую, мужчины и женщины
  - Рассказать, где и кем вы работали раньше
  - Спросить, что человек делал, и понять ответ в Perfekt
  - "Сказать «был» и «было»: *Ich war Koch*, *ich hatte viel Arbeit*"
  - Понять письмо коллеги и рассказать о профессии на устном экзамене
grammar:
  - Профессии на -in
  - Perfekt с haben
  - "Partizip II: ge-…-t и ge-…-en"
  - "Präteritum: war и hatte"
exam: [ sprechen-1, lesen-1, schreiben-1 ]

dialogues:
  pause:
    title: In der Pause
    ru: В перерыве
    place: Sprachschule Förde, Kiel · воспоминание о первых занятиях
    people:
      A: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
    lines:
      - M: Dana, was bist du eigentlich von Beruf?
        ru: Дана, а кто ты, собственно, по профессии?
      - A: Ich bin Ärztin. In Kasachstan habe ich in einem Krankenhaus gearbeitet.
        ru: Я врач. В Казахстане я работала в больнице.
      - M: Ach so! Dann bist du ja wirklich „Frau Doktor“!
        ru: Вот как! Значит, ты и правда «фрау доктор»!
      - A: Genau. Aber ich hatte immer viel Stress. Und du? Du warst Koch, oder?
        ru: Точно. Но у меня всегда было много стресса. А ты? Ты ведь был поваром?
      - M: Ja, sechs Jahre. Ich habe in Buenos Aires Fisch und Pasta gekocht.
        ru: Да, шесть лет. Я готовил в Буэнос-Айресе рыбу и пасту.
      - A: Und hier? Hast du schon eine Stelle als Koch gefunden?
        ru: А здесь? Ты уже нашёл работу поваром?
      - M: "Noch nicht. Aber gestern habe ich eine Anzeige gelesen: Ein Restaurant sucht einen Koch!"
        ru: "Пока нет. Но вчера я прочитал объявление: ресторан ищет повара!"
      - A: Super! Hast du schon eine E-Mail geschrieben?
        ru: Здорово! Ты уже написал письмо?
      - M: Ja, gestern Abend. Und morgen habe ich ein Vorstellungsgespräch!
        ru: Да, вчера вечером. А завтра у меня собеседование!
      - A: Toll! Viel Glück!
        ru: Отлично! Удачи!
  gespraech:
    title: Das Vorstellungsgespräch
    ru: Собеседование
    place: Вымышленный Restaurant Fördeblick, Kiel · воспоминание о собеседовании
    people:
      S: { name: Herr Wagner, voice: Eddy }
      M: { name: Mateo, voice: Reed }
    lines:
      - S: Guten Tag, Herr Fernández! Bitte nehmen Sie Platz.
        ru: Добрый день, господин Фернандес! Присаживайтесь, пожалуйста.
      - M: Guten Tag, Herr Wagner. Danke.
        ru: Добрый день, господин Вагнер. Спасибо.
      - S: Sie sind Koch. Wo haben Sie gearbeitet?
        ru: Вы повар. Где вы работали?
      - M: In Buenos Aires, im Restaurant „La Ribera“. Ich habe dort sechs Jahre gearbeitet.
        ru: В Буэнос-Айресе, в ресторане «Ла Рибера». Я проработал там шесть лет.
      - S: Und was haben Sie gekocht?
        ru: А что вы готовили?
      - M: Pasta, Fisch und Fleisch. Und ich habe auch Desserts gemacht.
        ru: Пасту, рыбу и мясо. И десерты тоже делал.
      - S: Haben Sie schon in Deutschland gearbeitet?
        ru: Вы уже работали в Германии?
      - M: Ja, hier in Kiel, als Kellner in einem Café. Und mein Deutschkurs ist am Vormittag.
        ru: Да, здесь, в Киле, официантом в кафе. А курс немецкого у меня до обеда.
      - S: Kein Problem, die Arbeit ist am Abend. Können Sie am Samstag einen Probetag machen?
        ru: Не страшно, работа вечером. Можете в субботу выйти на пробный день?
      - M: Ja, gern! Vielen Dank!
        ru: Да, с удовольствием! Большое спасибо!

