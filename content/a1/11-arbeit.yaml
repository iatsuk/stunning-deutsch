tables:
  beruf:
    title: "Beruf: er und sie"
    ru: Профессии мужчин и женщин
    head: [ Mann, Frau, Frauen ]
    rows:
      - [ der Lehrer, die Lehrer+in, die Lehrer+innen ]
      - [ der Verkäufer, die Verkäufer+in, die Verkäufer+innen ]
      - [ der Kellner, die Kellner+in, die Kellner+innen ]
      - [ der Student, die Student+in, die Student+innen ]
      - [ der Arzt, die Ärzt+in, die Ärzt+innen ]
      - [ der Koch, die Köch+in, die Köch+innen ]
      - [ der Hausmann, "die Haus*frau*", "die Haus*frauen*" ]
    note: Женская форма — мужская плюс *-in*. Во множественном — *-innen* с двумя *n*.
  perfekt:
    title: Perfekt mit haben
    ru: haben + Partizip II
    head: [ Infinitiv, Partizip II, Beispiel ]
    rows:
      - [ machen, "*ge*mach+t", "Was *hast* du *gemacht*?" ]
      - [ kochen, "*ge*koch+t", "Er *hat* Pasta *gekocht*." ]
      - [ lernen, "*ge*lern+t", "Wir *haben* Deutsch *gelernt*." ]
      - [ arbeiten, "*ge*arbeit+et", "Ich *habe* in Buenos Aires *gearbeitet*." ]
      - [ lesen, "*ge*les+en", "Ich *habe* eine Anzeige *gelesen*." ]
      - [ schreiben, "*ge*schrieb+en", "*Hast* du eine E-Mail *geschrieben*?" ]
      - [ finden, "*ge*fund+en", "Er *hat* eine Stelle *gefunden*." ]
      - [ sprechen, "*ge*sproch+en", "Wir *haben* Deutsch *gesprochen*." ]
    note: Формы нужны для рассказа о сделанных делах. Возвращайтесь к таблице во время чтения
      отчёта. Здесь показаны частые глаголы с ge-.
  praeteritum:
    title: "Präteritum: war und hatte"
    ru: Прошедшее время sein и haben
    head: [ Person, sein, haben ]
    rows:
      - [ ich, war, hatt+e ]
      - [ du, war+st, hatt+est ]
      - [ er / sie / es, war, hatt+e ]
      - [ wir, war+en, hatt+en ]
      - [ ihr, war+t, hatt+et ]
      - [ sie / Sie, war+en, hatt+en ]
    note: У *ich* и *er / sie / es* — одна и та же форма.

tasks:
  mail:
    kind: message
    part: lesen-1
    title: "Die erste Arbeitswoche · Rückblick"
    situation: Lesen Sie die E-Mail. Ist die Aussage richtig oder falsch?
    from: Julia Becker
    to: Mateo Fernández
    subject: Dein Probetag
    text: |
      Hallo Mateo,
      der Probetag am Samstag war super! Die Gäste haben alles gegessen. Und Herr Wagner sagt: Die Stelle ist für dich!
      Du arbeitest von Dienstag bis Samstag, immer von 17 bis 23 Uhr. Am Sonntag und am Montag hast du frei.
      Komm bitte am Dienstag schon um 16 Uhr. Dann lernst du die Kollegen kennen.
      Bis Dienstag!
      Julia
    statement: Mateo muss am Dienstag um 17 Uhr im Restaurant sein.
    answer: false
  vorstellen:
    kind: keywords
    part: sprechen-1
    title: "Sprechen, Teil 1"
    situation: Stellen Sie sich vor.
    words: [ Name?, Alter?, Land?, Wohnort?, Sprachen?, "*Beruf?*", Hobby? ]
    sample:
      - Mein Name ist Mateo Fernández.
      - Ich bin 28 Jahre alt.
      - Ich komme aus Argentinien und wohne jetzt in Kiel.
      - Ich spreche Spanisch, Englisch und ein bisschen Deutsch.
      - Ich bin Koch von Beruf.
      - In Buenos Aires habe ich sechs Jahre in einem Restaurant gearbeitet.
      - Jetzt arbeite ich im Restaurant „Fördeblick“.
      - Mein Hobby ist Segeln.
  done:
    kind: message
    part: lesen-1
    title: Vorbereitung für den Club
    from: Mateo
    text: Gestern habe ich Suppe gekocht. Dana hat eine E-Mail geschrieben. Elif hat die Anzeige
      gelesen. Den Kuchen habe ich noch nicht gemacht.
  past:
    kind: message
    part: lesen-1
    title: Früher und gestern
    from: Dana
    text: Früher war ich Ärztin in Almaty. Ich hatte viel Arbeit. Gestern habe ich Deutsch gelernt.
      Ich hatte Zeit für den Kurs.
  formular:
    kind: form
    part: schreiben-1
    title: Anmeldung zum Berufskurs
    situation: Mateo Fernández ist 28 Jahre alt. Er kommt aus Argentinien und wohnt in Kiel. Er ist
      Koch und spricht Spanisch und Englisch. Helfen Sie ihm bei der Anmeldung.
    fields:
