        value: Fernández
        given: true
      - label: Vorname
        value: Mateo
      - label: Alter
        value: "28"
      - label: Herkunftsland
        value: Argentinien
      - label: Wohnort
        value: Kiel
        given: true
      - label: Beruf
        value: Koch
      - label: Sprachen
        value: Spanisch, Englisch

steps:
  - id: pause
    chapter: scene
    title: В перерыве
    beats:
      - read: >-
          Перед Kieler Woche команда вспоминает первые занятия. Это сцена из прошлого: Матео
          ещё только собирался устроиться в Fördeblick. Теперь мы знаем результат, но
          послушаем, как он рассказывал об опыте. Дана отвечает *Ich bin Ärztin*. При простом
          названии профессии обычно обходятся без артикля. Женская форма *Ärztin* отличается и
          окончанием *-in*, и умлаутом.
        point: "Профессия — без артикля: *Ich bin Ärztin.* *-in* — женская форма"
        set: { view: dialogue, dialogue: pause, reveal: 2, focus: [ 0, 1 ] }
      - read: >-
          Дальше Дана и Матео говорят о прошлом. *In Kasachstan habe ich in einem Krankenhaus
          gearbeitet* — «в Казахстане я работала в больнице». Это Perfekt: *habe* плюс особая
          форма глагола в конце, *gearbeitet*. А «был» и «было» звучат короче: *Du warst Koch*
          — «ты был поваром», *Ich hatte immer viel Stress* — «у меня всегда было много
          стресса».
        point: "О прошлом: *ich habe … gearbeitet*, *ich war*, *ich hatte*"
        set: { reveal: 5, focus: [ 1, 3, 4 ] }
      - read: >-
          В воспоминании Матео ещё ищет место: *Hast du schon eine Stelle als Koch gefunden?* —
          *Noch nicht.* Он уже прочитал объявление и написал письмо: *gelesen*, *geschrieben*.
          Сейчас он работает в Fördeblick, поэтому эта сцена не отменяет сведения предыдущих
          тем. Важно научиться отделять прошлую ситуацию от нынешней — это пригодится и для
          папки подготовки клуба.
        point: "*schon* — «уже», *noch nicht* — «ещё нет»; *gefunden*, *gelesen*, *geschrieben*"
        set: { reveal: 10, focus: [ 1, 5, 6, 7, 8 ] }

  - id: gespraech
    chapter: scene
    title: Собеседование
    beats:
      - read: >-
          Следующая сцена тоже воспоминание: собеседование в Fördeblick. *Wo haben Sie
          gearbeitet?* — *In Buenos Aires, im Restaurant „La Ribera“.* Названия ресторанов и
          обстоятельства вымышлены. W-слово стоит первым, *haben* — вторым, *gearbeitet* — в
          конце. Опыт Матео длится шесть лет. На первом месте ответа может быть место, но рамка
          Perfekt сохраняется.
        point: "*Wo haben Sie gearbeitet?* — *haben* второй, причастие в конце"
        set: { view: dialogue, dialogue: gespraech, reveal: 4, focus: [ 2, 3 ] }
      - read: >-
          *Was haben Sie gekocht?* — *Ich habe auch Desserts gemacht.* У *kochen* и *machen*
          получается *ge-…-t*. Вопрос *Haben Sie schon in Deutschland gearbeitet?* начинается с
          *haben*. Матео рассказывает о прежней работе в кафе в Киле; господин Вагнер
          предлагает пробный день. Это сюжет конкретного вымышленного собеседования, а не
          описание условий найма.
        point: "*kochen → gekocht*, *machen → gemacht*: *ge-* + основа + *-t*"
        set: { reveal: 10, focus: [ 4, 5, 6, 8 ] }

  - id: berufe
    chapter: words
    title: Профессии
    beats:
      - read: >-
          Почти у каждой профессии две формы. Мужская — основная, женская получается из неё с
          окончанием *-in*: *der Lehrer — die Lehrerin*. Женская форма всегда с артиклем *die*.
          Иногда в корне появляется умлаут: *der Arzt — die Ärztin*, *der Koch — die Köchin*.
          Во множественном у женской формы *-innen* с двумя *n*: *die Lehrerinnen*.
        point: "*der Lehrer — die Lehrerin — die Lehrerinnen*"
        set: { view: words, words: berufe }
      - read: >-
          Ещё несколько профессий. Женская форма — в подсказке под словом, правило то же:
          *Ingenieur — Ingenieurin*, *Student — Studentin*. Особый случай — слова на *-mann*: у
          них вместо *-in* появляется *-frau*. *Der Hausmann* — «домохозяин», *die Hausfrau* —
          «домохозяйка». И это вполне нормальный ответ на экзаменационный вопрос *Beruf?*.
          Следите и за множественным числом: *die Studenten* с *-en*, а *die Informatiker* —
          без изменений.
        point: "*-mann → -frau*: *der Hausmann — die Hausfrau*"
        set: { view: words, words: mehr }
      - read: >-
          Где работаете — *in einer Firma*, *im Krankenhaus*. Кем работаете — с *als* и без
          артикля: *Ich arbeite als Koch*. Не путайте *der Beruf* — профессию и *die Stelle* —
          конкретное место работы. *Ein Restaurant sucht einen Koch* — так начинаются
          объявления о вакансиях, *Anzeigen*. А *Vorstellungsgespräch* — длинное, но очень
          нужное слово: «собеседование».
        point: "*Ich arbeite als Koch.* — с *als* и без артикля"
        set: { view: words, words: arbeit }
      - read: >-
          Чтобы рассказывать о прошлом, нужны слова времени. *Gestern* — вчера, *früher* —
          раньше, в прошлой жизни. *Letzte Woche* и *letztes Jahr* выучите как готовые
          выражения: окончания прилагательных разберём позже. Пару *schon* — «уже» и *noch
          nicht* — «ещё нет» часто слышат в вопросах в Perfekt: *Hast du schon …?* — *Nein,
          noch nicht.*
        point: "*Hast du schon …?* — *Nein, noch nicht.*"
        set: { view: words, words: zeit }

  - id: maennlich-weiblich
    chapter: grammar
    title: Он и она
    beats:
      - read: >-
          Правило простое: к мужской форме добавляем *-in*, во множественном — *-innen*.
          Мужская форма во множественном часто не меняется: *die Lehrer*, *die Verkäufer*.
          Умлаут в женской форме запоминайте вместе со словом: *Ärztin*, *Köchin*. Если в
          группе и мужчины, и женщины, в объявлениях и речах обычно называют обе формы:
          *Lehrerinnen und Lehrer*.
        point: "Женщина: *+in*, женщины: *+innen*; умлаут — *Ärztin*, *Köchin*"
        set: { view: table, table: beruf }

  - id: perfekt
    chapter: grammar
    title: "Perfekt: что я делал"
    beats:
      - read: >-
          В разговорном немецком о прошлом почти всегда говорят в Perfekt. Он состоит из двух
          частей — как предложение с *müssen* из прошлой темы. Возьмём простое *Ich arbeite in
          Buenos Aires* — «я работаю в Буэнос-Айресе». Глагол стоит на втором месте, конец
          предложения пуст. Посмотрите, что произойдёт, когда мы перенесём это предложение в
          прошлое.
        point: Perfekt — главное прошедшее время в разговоре
        set:
          view: sentence
          rows:
            - de: [ Ich, arbeit+e, in Buenos Aires., "" ]
              ru: Я работаю в Буэнос-Айресе.
      - read: >-
          На второе место встаёт *habe* — обычная форма *haben*. А смысловой глагол уходит в
          конец и превращается в причастие, Partizip II: *gearbeitet*. Получается та же рамка,
          что с *muss … bleiben*. По-русски всё сказано одним словом «работал», а по-немецки
          работа разделена: лицо показывает *habe*, а смысл — *gearbeitet*.
        point: "*Ich habe in Buenos Aires gearbeitet.* — *haben* второй, причастие в конце"
        set:
          rows:
            - de: [ Ich, hab+e, in Buenos Aires, "*ge*arbeit+et." ]
              ru: Я работал в Буэнос-Айресе.
      - read: >-
          Рамка держится при любом порядке слов. Поставим *in Buenos Aires* на первое место:
          *habe* остаётся вторым, *ich* уходит за него, а причастие — по-прежнему в конце. В
          вопросе да/нет первым встаёт *hast*: *Hast du schon eine Stelle gefunden?* Частая
          ошибка — поставить причастие сразу за *haben*: *Ich habe gearbeitet in Buenos Aires*.
          Так нельзя.
        point: "Причастие всегда в конце: *In Buenos Aires habe ich gearbeitet.*"
        set:
          rows:
            - de: [ In Buenos Aires, hab+e, ich, "*ge*arbeit+et." ]
              ru: В Буэнос-Айресе я работал.
            - de: [ "", Hast, du schon eine Stelle, "*ge*fund+en?" ]
              ru: Ты уже нашёл работу?
      - read: >-
          Как получить причастие? У большинства глаголов — по формуле *ge-* + основа + *-t*:
          *machen → gemacht*, *kochen → gekocht*, *lernen → gelernt*. Если основа кончается на
          *-t* или *-d*, перед окончанием появляется *e*: *arbeiten → gearbeitet*. Иначе не
          выговорить. Такие глаголы называют слабыми, и их большинство. По той же формуле:
          *wohnen → gewohnt*, *spielen → gespielt*, *kaufen → gekauft*.
        point: "Слабые: *ge-* + основа + *-t*: *gemacht*; после *-t* — *-et*: *gearbeitet*"
        set: { view: table, table: perfekt, reveal: 4 }
      - read: >-
          У сильных глаголов причастие часто оканчивается на *-en*: *gelesen*, *geschrieben*.
          Может меняться гласная: *finden → gefunden*, *sprechen → gesprochen*. Вместо списка
          для зубрёжки в игре прочитайте отчёт и решите, что уже сделано. Повторное
          употребление форм поможет их узнавать; таблица остаётся справочником. Отсутствие
          *ge-* и другие группы разберём позже.
        point: "Сильные: *ge-* + основа + *-en*, гласная может меняться: *gefunden*"
        set: { reveal: 8, focus: [ 4, 5, 6, 7 ] }

  - id: war-hatte
    chapter: grammar
    title: "*war* и *hatte*"
    beats:
      - read: >-
          Для *sein* и *haben* о прошлом говорят иначе — короткой формой, Präteritum. *Ich war
          Koch* — «я был поваром», *Ich hatte viel Stress* — «у меня было много стресса». Формы
          *ich* и *er* совпадают: *ich war*, *er war*, *ich hatte*, *sie hatte*, — как у *ich
          möchte* — *er möchte* и *ich kann* — *er kann*. Остальные окончания вам знакомы: *du
          warst*, *wir waren*, *ihr hattet*.
        point: "*ich war, du warst, er war* · *ich hatte, du hattest, er hatte*"
        set: { view: table, table: praeteritum }
      - read: >-
          В этой теме для *sein* и *haben* тренируем частые короткие формы *war* и *hatte*. У
          них нет рамки с причастием: *Ich war Koch*, *Ich hatte viel Arbeit*. Сравните с *Ich
          habe gearbeitet*. Это удобная опора для первых рассказов о прошлом, а не запрет на
          Perfekt этих глаголов: формы *ist gewesen* и *hat gehabt* тоже существуют.
        point: "«Был», «было» — *war*, *hatte*; остальные глаголы — Perfekt"
        set:
          view: sentence
          rows:
            - de: [ Ich, war, Koch in Buenos Aires., "" ]
              ru: Я был поваром в Буэнос-Айресе.
            - de: [ Ich, hab+e, in Buenos Aires, "*ge*arbeit+et." ]
              ru: Я работал в Буэнос-Айресе.

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Матео — *Koch*. Как сказать о женщине «она повар»?
        read: >-
          *Sie ist Köchin.* Артикля нет — это профессия, как и в мужской форме *Er ist Koch*. К
          основе добавляется *-in*, а в корне появляется умлаут: *o* → *ö*. Так же *Arzt* →
          *Ärztin*. Если сказать *Kochin*, вас поймут, но это ошибка, поэтому женскую форму
          учите вместе с мужской.
        point: "*Koch → Köchin*, *Arzt → Ärztin* — с умлаутом"
        set: { view: table, table: beruf, focus: [ 5 ] }
      - question: Как спросить друга «Что ты делал вчера?» и ответить «Я учил немецкий»?
        read: >-
          *Was hast du gestern gemacht?* W-слово первым, *hast* — вторым, причастие *gemacht* —
          в конце, а *du gestern* — в середине. Русское «делал» распадается на две части:
          *hast* показывает лицо, *gemacht* — смысл. Ответ строится так же: *Ich habe Deutsch
          gelernt.* Оба глагола слабые: *ge-* + основа + *-t*. А *gestern* можно поставить и
          первым: *Gestern habe ich Deutsch gelernt.*
        point: "*Was hast du gestern gemacht?* — *Ich habe Deutsch gelernt.*"
        set:
          view: sentence
          rows:
            - de: [ Was, hast, du gestern, "*ge*mach+t?" ]
              ru: Что ты делал вчера?
            - de: [ Ich, hab+e, Deutsch, "*ge*lern+t." ]
              ru: Я учил немецкий.
      - question: Как сказать «Вчера у меня не было времени»?
        read: >-
          *Gestern hatte ich keine Zeit.* Для «было» берём *hatte* — без рамки и без причастия.
          *Gestern* на первом месте, поэтому *ich* уходит за глагол. А «не было времени» — это
          *keine Zeit*: перед существительным отрицание — *kein*, как в четвёртой теме.
          По-русски «у меня не было», по-немецки — «я не имел»: *ich hatte keine*.
        point: "*Gestern hatte ich keine Zeit.* — *hatte* + *kein*"
        set:
          view: sentence
          rows:
            - de: [ Gestern, hatt+e, ich keine Zeit., "" ]
              ru: Вчера у меня не было времени.

  - id: lesen
    chapter: exam
    title: "Чтение: письмо от коллеги"
    beats:
      - read: >-
          В первой части чтения нужно сопоставлять утверждение с письмом. Здесь Юлия Беккер,
          коллега Матео в Fördeblick, пишет после того самого пробного дня. Письмо сохранено в
          старой папке: оно показывает, как начиналась его работа, а не сообщает о новой смене
          работодателя сейчас. Обычная смена с 17 до 23 часов и особая просьба прийти во
          вторник в 16:00 — разные сведения.
        point: "Чтение, часть 1: сначала утверждение, потом нужное место в тексте"
        set: { view: task, task: mail }
      - question: Утверждение верное или нет?
        read: >-
          *Falsch.* Число 17 в письме есть, но это начало обычной смены: *immer von 17 bis 23
          Uhr*. Во вторник Юлия просит прийти раньше: *Komm bitte am Dienstag schon um 16 Uhr.*
          Слово *schon* — «уже», здесь «пораньше» — и есть ключ. Составители любят такие
          ловушки: в тексте те же числа, но в другой связи.
        point: "Ловушка: число из текста, но в другой связи"
        set: { solved: true }

  - id: sprechen
    chapter: exam
    title: "Устный экзамен: профессия"
    beats:
      - read: >-
          Помните лист с ключевыми словами из первой темы? Пункт *Beruf?* теперь можно раскрыть
          подробнее. Женщины называют женскую форму: *Ich bin Lehrerin von Beruf*. Если вы
          сейчас не работаете, это тоже ответ: *Ich bin Studentin*, *Ich bin Hausmann*. Та же
          форма нужна и в анкете — в первой части письменного экзамена поле *Beruf* встречается
          часто.
        point: "*Ich bin … von Beruf.* Женщины — форма на *-in*"
        set: { view: task, task: vorstellen, reveal: 5 }
      - read: >-
          А дальше — одно-два предложения о прошлом, и рассказ звучит живее: *In Buenos Aires
          habe ich sechs Jahre in einem Restaurant gearbeitet.* Потом — о настоящем: *Jetzt
          arbeite ich im Restaurant „Fördeblick“.* Сложные конструкции не нужны: одно
          предложение в Perfekt уже показывает, что вы умеете говорить о прошлом. Подготовьте
          такое предложение о себе заранее.
        point: "Добавьте прошлое: *Ich habe … gearbeitet.* *Früher war ich …*"
        set: { reveal: 8 }
  - id: formular
    chapter: exam
    title: "Анкета: опыт не заменяет профессию"
    beats:
      - read: Для первой части письма перенесите сведения в пять незаполненных полей анкеты. *Beruf*
          требует названия профессии *Koch*, а не места работы или целого рассказа в Perfekt.
          Фамилия и город уже заполнены; допишите имя, возраст, страну, профессию и языки. Это
          отдельная практика точного переноса сведений, не заявление в настоящую организацию.
        point: "*Beruf* — профессия; в поле достаточно *Koch*"
        set:
          view: task
          task: formular
          reveal: 0
      - question: "Что записать в поле Beruf: Koch, Fördeblick или gearbeitet?"
        read: "*Koch.* *Fördeblick* — название места работы, *gearbeitet* — причастие «работал».
          Переносим в анкету нужную категорию сведений, а не первое знакомое слово. Остальные
          пять полей проверьте по тексту задания."
        point: Профессия — *Koch*, место работы — *Fördeblick*
        before:
          view: task
          task: formular
          reveal: 0
        set:
          solved: true
          reveal: 5

exercises:
  - type: choice
    q: Dana ist ___ von Beruf.
    options: [ Arzt, Ärztin, eine Ärztin ]
    answer: 1
    why: "Женщина — форма на *-in*; профессия — без артикля."
  - type: gap
    q: Mateo ist Koch, und Maria ist auch ___.
    answer: [ Köchin ]
    hint: Koch
    ru: Матео повар, и Мария тоже.
    why: "*Koch → Köchin*: окончание *-in* и умлаут."
  - type: choice
    q: Julia und Paula sind ___.
    options: [ Kellnerin, Kellnerinnen, Kellnerinen ]
    answer: 1
    why: "Женщины во множественном числе — *-innen* с двумя *n*."
  - type: choice
    q: Was ___ Sie von Beruf?
    options: [ sind, haben, arbeiten ]
    answer: 0
    why: "О профессии спрашивают с *sein*: *Was sind Sie von Beruf?*"
  - type: gap
    q: Ich habe sechs Jahre in Buenos Aires ___.
    answer: [ gearbeitet ]
    hint: arbeiten
    why: "Основа на *-t*, поэтому перед окончанием *e*: *gearbeit+et*."
  - type: gap
    q: Was hast du gestern ___?
    answer: [ gemacht ]
    hint: machen
  - type: gap
    q: Wir ___ im Kurs viel gelernt.
    answer: [ haben ]
    hint: haben
    ru: Мы много выучили на курсе.
  - type: gap
    q: Gestern habe ich eine Anzeige ___.
    answer: [ gelesen ]
    hint: lesen
    why: "*lesen* — сильный глагол: *ge-…-en*."
  - type: gap
    q: ___ du schon eine E-Mail ___?
    answer: [ Hast, geschrieben ]
    hint: schreiben
    why: "Вопрос да/нет: *hast* первым, причастие *geschrieben* — в конце."
  - type: choice
    q: Er hat eine Stelle ___.
    options: [ gefindet, gefunden, findet ]
    answer: 1
    why: "*finden → gefunden*: окончание *-en* и другая гласная."
  - type: order
    ru: В Буэнос-Айресе я работал шесть лет.
    de: In Buenos Aires habe ich sechs Jahre gearbeitet.
    also: ["Ich habe in Buenos Aires sechs Jahre gearbeitet.", "Ich habe sechs Jahre in Buenos Aires gearbeitet.", "Sechs Jahre habe ich in Buenos Aires gearbeitet."]
    why: "*habe* — на втором месте, причастие — всегда в конце."
  - type: gap
    q: Früher ___ ich Koch in Buenos Aires.
    answer: [ war ]
    hint: sein
  - type: gap
    q: Gestern ___ wir keine Zeit.
    answer: [ hatten ]
    hint: haben
    why: "*wir hatt+en*: у *wir* окончание *-en*, как в настоящем времени."
  - type: choice
    q: ___ du gestern im Kurs?
    options: [ Warst, Hattest, Bist ]
    answer: 0
    why: "«Ты был?» — *Warst du …?* Со словом *gestern* нужно прошедшее время."
  - type: order
    ru: Что ты делал вчера?
    de: Was hast du gestern gemacht?
  - type: order
    ru: Вчера у меня было много работы.
    de: Gestern hatte ich viel Arbeit.
    also: ["Ich hatte gestern viel Arbeit.", "Viel Arbeit hatte ich gestern."]
