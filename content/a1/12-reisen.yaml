id: reisen
order: 12
title: Wir sind nach Hamburg gefahren.
ru: Поездки, погода, даты
lede: >-
  Перед финалом Kieler Woche Дана и Матео вспоминают поездку в Гамбург в начале июня: отель,
  дождь, прогулка по порту и звонок Элиф из Киля. Помогите восстановить даты и события, понять
  объявление и закрыть историю неверных копий. Учимся Perfekt с *sein*, погоде и порядковым
  числам в датах.
goals:
  - Рассказать о поездке в прошлом и не перепутать haben и sein
  - Поговорить о погоде — сегодня и вчера
  - Назвать месяц, время года и дату — например, am ersten Mai
  - Снять номер в отеле и заполнить бланк бронирования
  - Написать короткое сообщение и понять объявление на вокзале
grammar:
  - Perfekt с sein
  - haben или sein
  - Погода с es
  - Месяцы и времена года
  - Порядковые числа и дата
exam: [ schreiben-2, schreiben-1, hoeren-2 ]

dialogues:
  empfang:
    title: Im Hotel Elbblick
    ru: У стойки регистрации
    place: Вымышленный Hotel Elbblick, Hamburg · воспоминание о начале июня
    people:
      K: { name: Herr Hansen, voice: Eddy }
      A: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
    lines:
      - K: Guten Abend! Willkommen im Hotel Elbblick.
        ru: Добрый вечер! Добро пожаловать в отель «Эльбблик».
      - A: Guten Abend! Haben Sie noch zwei Einzelzimmer frei?
        ru: Добрый вечер! У вас есть ещё два свободных одноместных номера?
      - K: Für wie viele Nächte?
        ru: На сколько ночей?
      - M: Für zwei Nächte, vom zweiten bis zum vierten Juni.
        ru: На две ночи, со второго по четвёртое июня.
      - K: Ja, das geht. Ein Einzelzimmer kostet 80 Euro pro Nacht, mit Frühstück.
        ru: Да, это возможно. Одноместный номер стоит 80 евро за ночь, с завтраком.
      - A: Gut, dann nehmen wir die Zimmer.
        ru: Хорошо, тогда мы их берём.
      - K: Wie war die Reise? Sind Sie mit dem Zug gekommen?
        ru: Как доехали? Вы приехали на поезде?
      - M: Ja, aber der Zug ist erst um acht Uhr angekommen. Er hatte eine Stunde Verspätung.
        ru: Да, но поезд прибыл только в восемь. Он опоздал на час.
      - K: Oh, das tut mir leid! Hier sind Ihre Schlüssel – Zimmer 12 und 14.
        ru: Ох, сочувствую! Вот ваши ключи — номера 12 и 14.
      - M: Vielen Dank! Bis morgen!
        ru: Большое спасибо! До завтра!
  telefon:
    title: Ein Anruf aus Kiel
    ru: Звонок из Киля
    place: Am Telefon
    people:
      L:
        name: Elif
        voice: Flo
      A: { name: Dana, voice: Anna }
    lines:
      - L: Hallo, Dana! Na, wie ist es in Hamburg?
        ru: Привет, Дана! Ну как там, в Гамбурге?
      - A: Super! Aber das Wetter ist nicht so gut. Es ist kalt und windig.
        ru: Супер! Но погода не очень. Холодно и ветрено.
      - L: Wirklich? Hier in Kiel scheint die Sonne. Es sind 25 Grad!
        ru: Правда? А здесь, в Киле, светит солнце. 25 градусов!
      - A: Und hier hat es heute Morgen geregnet. Wir haben einen Regenschirm gekauft.
        ru: А здесь сегодня утром шёл дождь. Мы купили зонт.
      - L: Was habt ihr gestern gemacht?
        ru: А что вы делали вчера?
      - A: Wir sind am Abend angekommen und dann zum Hafen gegangen.
        ru: Мы приехали вечером, а потом пошли в порт.
      - L: Und heute?
        ru: А сегодня?
      - A: Heute sind wir mit dem Schiff gefahren – zwei Stunden auf der Elbe!
        ru: Сегодня мы катались на кораблике — два часа по Эльбе!
      - L: Toll! Kommt morgen gut nach Hause! Und viele Grüße an Mateo!
        ru: Здорово! Хорошо вам доехать завтра! И привет Матео!
      - A: Danke, Elif! Tschüss!
        ru: Спасибо, Элиф! Пока!

