tables:
  hilfsverb:
    title: haben oder sein?
    ru: С каким глаголом строится Perfekt
    head: [Infinitiv, Perfekt, Почему]
    ruCols: [2]
    rows:
      - [fahren, ist *ge*fahr*en*, "движение: из А в Б"]
      - [fliegen, ist *ge*flog*en*, движение]
      - [gehen, ist *ge*gang*en*, движение]
      - [ankommen, ist an*ge*komm*en*, движение]
      - [aufstehen, ist auf*ge*stand*en*, смена состояния]
      - [bleiben, ist *ge*blieb*en*, исключение — запомнить]
      - [machen, hat *ge*mach*t*, нет движения]
      - [kaufen, hat *ge*kauf*t*, нет движения]
      - [regnen, hat *ge*regn*et*, погода — нет движения]
    note: "Сами *sein* и *haben* в прошлом обычно звучат как *war* и *hatte*: *Wie war die Reise?*"
  monate:
    title: Die Monate
    ru: Месяцы по временам года
    head: [Frühling, Sommer, Herbst, Winter]
    rows:
      - [März, Juni, September, Dezember]
      - [April, Juli, Oktober, Januar]
      - [Mai, August, November, Februar]
    note: "Все месяцы — мужского рода: *der Mai*, *im Mai*. Но с датой — *am*: *am ersten Mai*."
  datum:
    title: Ordinalzahlen und Datum
    ru: Порядковые числа и дата
    head: [Datum, "Heute ist …", Wann?]
    rows:
      - ["1. Mai", der erst+e Mai, am erst+en Mai]
      - ["2. Mai", der zwei+te Mai, am zwei+ten Mai]
      - ["3. Mai", der dritt+e Mai, am dritt+en Mai]
      - ["4. Mai", der vier+te Mai, am vier+ten Mai]
      - ["7. Mai", der sieb+te Mai, am sieb+ten Mai]
      - ["8. Mai", der acht+e Mai, am acht+en Mai]
      - ["19. Mai", der neunzehn+te Mai, am neunzehn+ten Mai]
      - ["20. Mai", der zwanzig+ste Mai, am zwanzig+sten Mai]
      - ["31. Mai", der einunddreißig+ste Mai, am einunddreißig+sten Mai]
    note: "До 19 — *-te*, с 20 — *-ste*. После *am*, *vom* и *bis zum* окончание *-en*."

tasks:
  antwort:
    kind: message
    part: schreiben-2
    title: Schreiben, Teil 2
    situation: >-
      Der Deutschkurs ist zu Ende. Frau Weber von der Sprachschule schreibt an
      alle im Kurs. Sie waren am Wochenende in Hamburg. Antworten Sie Frau
      Weber. Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter).
      Vergessen Sie nicht die Anrede und den Gruß.
    from: Sabine Weber
    to: Kurs A1
    subject: Der Kurs ist zu Ende!
    text: |
      Liebe Kursteilnehmerinnen und Kursteilnehmer,
      der Kurs ist zu Ende – vielen Dank! Wie war Ihr Wochenende? Was machen Sie im Sommer? Schreiben Sie mir!
      Herzliche Grüße
      Sabine Weber
    points:
      - Wohin sind Sie gefahren?
      - Wie war das Wetter?
      - Was machen Sie im Juli?
    sample:
      - "Liebe Frau Weber,"
      - Marco und ich sind am Wochenende mit dem Zug nach Hamburg gefahren.
      - Das Wetter war leider nicht so gut. Es hat oft geregnet.
      - Im Juli fliege ich nach Polen und besuche meine Familie.
      - Viele Grüße
      - Anna
  buchung:
    kind: form
    part: schreiben-1
    title: Zimmerreservierung – Hotel Elbblick
    situation: >-
      Marco Rossi und seine Schwester Giulia möchten im August nach Hamburg
      fahren. Sie kommen am 8. August an und fahren am 10. August zurück. Sie
      möchten zwei Einzelzimmer. Frühstück brauchen sie nicht – sie frühstücken
      gern im Café. Marco reserviert die Zimmer im Internet. Er braucht Ihre
      Hilfe. Füllen Sie das Formular aus.
    fields:
      - { label: Familienname, value: Rossi, given: true }
      - { label: Vorname, value: Marco, given: true }
      - { label: Anreise, value: "8. August" }
      - { label: Abreise, value: "10. August" }
      - { label: Personen, value: "2" }
      - { label: Zimmer, value: 2 Einzelzimmer }
      - { label: Frühstück, value: nein }
  durchsage:
    kind: listen
    part: hoeren-2
    title: Hören, Teil 2
    situation: >-
      Sie sind am Hauptbahnhof in Hamburg und hören eine Durchsage. Ist die
      Aussage richtig oder falsch? Sie hören den Text einmal.
    voice: Rocko
    text: >-
      Achtung an Gleis 8! Der Intercity nach Leipzig, Abfahrt 17 Uhr 46, fährt
      heute nicht von Gleis 8, sondern von Gleis 12 ab. Der Zug hat circa 20
      Minuten Verspätung. Wir bitten um Entschuldigung.
    statement: Der Zug nach Leipzig fährt von Gleis 8 ab.
    answer: false

steps:
  - id: empfang
    chapter: scene
    title: Вечер в отеле
    beats:
      - read: >-
          Курс A1 позади, и Анна с Марко отмечают это поездкой: выходные в
          Гамбурге. Вечер пятницы, стойка регистрации в отеле. Номер заранее
          не забронирован, поэтому Анна спрашивает: *Haben Sie noch zwei
          Einzelzimmer frei?* — «у вас есть ещё два одноместных номера?» Марко
          называет даты: *vom zweiten bis zum vierten Juni* — «со второго по
          четвёртое июня». Числа здесь порядковые, как и в русском: «второе»,
          а не «два».
        point: "*Haben Sie noch ein Zimmer frei?* — есть свободный номер?"
        set: { view: dialogue, dialogue: empfang, reveal: 4, focus: [1, 3] }
      - read: >-
          Номер есть: *80 Euro pro Nacht, mit Frühstück*. Господин Хансен
          спрашивает о дороге: *Sind Sie mit dem Zug gekommen?* — «вы приехали
          на поезде?» Заметьте: не *haben*, а *sind*. Марко отвечает так же:
          *Der Zug ist erst um acht Uhr angekommen.* Глаголы движения строят
          Perfekt с *sein* — это главная грамматика темы. А опоздание — через
          знакомое *hatte*: *Er hatte eine Stunde Verspätung*, буквально «у
          него был час опоздания».
        point: "Движение в прошлом — с *sein*: *Sind Sie mit dem Zug gekommen?*"
        set: { reveal: 10, focus: [4, 6, 7] }

  - id: telefon
    chapter: scene
    title: Звонок из Лейпцига
    beats:
      - read: >-
          В субботу Анне звонит подруга из Лейпцига, Лена. Первым делом —
          погода. В Гамбурге *kalt und windig*, а в Лейпциге светит солнце:
          *Hier in Leipzig scheint die Sonne.* Обратите внимание на *Es ist
          kalt*: по-русски просто «холодно», а у немецкой фразы обязательно
          есть подлежащее — маленькое *es*. И *Es sind 25 Grad* — глагол во
          множественном числе, потому что градусов много.
        point: "*Es ist kalt.* — «холодно»: без *es* по-немецки нельзя"
        set: { view: dialogue, dialogue: telefon, reveal: 3, focus: [1, 2] }
      - read: >-
          Потом Анна рассказывает, что было, — и тут слушайте вспомогательный
          глагол. *Es hat geregnet*, *wir haben einen Regenschirm gekauft* — с
          *haben*, как в прошлой теме. Но *wir sind angekommen*, *wir sind zum
          Hafen gegangen*, *wir sind mit dem Schiff gefahren* — с *sein*.
          Почему одни глаголы выбирают *haben*, а другие *sein*, разберём в
          грамматике. А *Kommt morgen gut nach Hause!* — повелительное
          наклонение на *ihr*.
        point: "*hat geregnet*, *haben gekauft* — но *sind gegangen*, *sind gefahren*"
        set: { reveal: 10, focus: [3, 5, 7, 8] }

  - id: unterwegs
    chapter: words
    title: В дороге
    beats:
      - read: >-
          Слова для дороги. Транспорт — с предлогом *mit* и дательным падежом:
          *mit dem Zug*, *mit dem Flugzeug*. Путь на вокзале — *das Gleis*:
          *Der Zug fährt von Gleis 12 ab.* Опоздание по-немецки «имеют»: *Der
          Zug hat 20 Minuten Verspätung.* А *die Durchsage* — объявление по
          громкой связи. На экзамене их будет четыре — на вокзале, в аэропорту
          или в магазине.
        point: "*mit dem Zug*; опоздание «имеют»: *Der Zug hat 20 Minuten Verspätung.*"
        set: { view: words, words: unterwegs }

  - id: hotel
    chapter: words
    title: Номер в отеле
    beats:
      - read: >-
          Номер в отеле — это *das Zimmer*, а *die Nummer* — только число на
          двери: *Zimmer Nummer 12*. *das Einzelzimmer* — на одного, *das
          Doppelzimmer* — на двоих; род, как всегда у сложных слов, — по
          последней части. *die Anreise* и *die Abreise* — день приезда и день
          отъезда, они есть в каждом бланке. И осторожно с *reservieren*:
          глаголы на *-ieren* строят Perfekt без *ge-*: *Ich habe ein Zimmer
          reserviert.*
        point: "*das Einzelzimmer*, *das Doppelzimmer*; *reservieren — hat reserviert*, без *ge-*"
        set: { view: words, words: hotel }

  - id: wetter
    chapter: words
    title: Какая погода?
    beats:
      - read: >-
          О погоде говорят все и всегда — с соседом, с коллегой, с
          администратором в отеле. Почти каждая фраза начинается с *es*: *Es
          regnet*, *Es schneit*, *Es ist kalt*. Исключение — солнце, у него
          своё подлежащее: *Die Sonne scheint.* Прилагательные получаются из
          существительных: *die Sonne — sonnig*, *der Wind — windig*. А *Grad*
          после числа не меняется: *Es sind 20 Grad.*
        point: "*Es regnet. Es ist kalt.* — но *Die Sonne scheint.*"
        set: { view: words, words: wetter }

  - id: jahr
    chapter: words
    title: Времена года
    beats:
      - read: >-
          Времена года — мужского рода: *der Frühling*, *der Sommer*, *der
          Herbst*, *der Winter*, хотя «весна», «осень» и «зима» в русском —
          женского. На вопрос «когда?» отвечаем с *im*: *im Sommer*, *im
          Winter*. А с днями — *am*: *am Wochenende*. День рождения немцы
          «имеют»: *Ich habe im Mai Geburtstag.* И *die Ferien* бывают только
          во множественном числе, совсем как русские «каникулы».
        point: "*der Sommer* — *im Sommer*; *Ich habe im Mai Geburtstag.*"
        set: { view: words, words: jahr }

  - id: perfekt
    chapter: grammar
    title: Perfekt с sein
    beats:
      - read: >-
          Perfekt с *haben* вы уже знаете: *Wir haben im Hotel gefrühstückt.*
          Но о поездке Анна говорит *Wir sind nach Hamburg gefahren.* Рамка та
          же: вспомогательный глагол на втором месте, причастие в самом конце.
          Меняется только вспомогательный глагол — с глаголами движения это
          *sein*. По-русски «мы поехали» — одно слово, а по-немецки — два, и
          между ними помещается вся середина предложения.
        point: "Perfekt: *haben* или *sein* на 2-м месте + причастие в конце"
        set:
          view: sentence
          rows:
            - de: [Wir, hab+en, im Hotel, gefrühstückt.]
              ru: Мы позавтракали в отеле.
            - de: [Wir, sind, nach Hamburg, gefahren.]
              ru: Мы поехали в Гамбург.
      - read: >-
          Поставим на первое место *am Freitag*. *sind* остаётся вторым, *wir*
          уходит в середину, а *gefahren* по-прежнему замыкает предложение.
          Всё новое — когда, на чём, куда — встаёт внутрь рамки, между *sind*
          и *gefahren*. Типичная ошибка — тянуть причастие к вспомогательному
          глаголу, как в русском: *Wir sind gefahren nach Hamburg.* Так по-немецки
          не говорят.
        point: "Всё новое — внутрь рамки: *Am Freitag sind wir mit dem Zug nach Hamburg gefahren.*"
        set:
          rows:
            - de: [Wir, hab+en, im Hotel, gefrühstückt.]
              ru: Мы позавтракали в отеле.
            - de: [Am Freitag, sind, wir mit dem Zug nach Hamburg, gefahren.]
              ru: В пятницу мы поехали в Гамбург на поезде.
          focus: [1]

  - id: haben-sein
    chapter: grammar
    title: haben или sein?
    beats:
      - read: >-
          Как понять, какой глагол нужен? Правило для A1: *sein* — если
          человек перемещается из точки А в точку Б: *fahren*, *fliegen*,
          *gehen*, *ankommen*. Или если меняется состояние: *aufstehen* —
          лежал, а теперь на ногах. И одно исключение, его нужно просто
          запомнить: *bleiben* — «оставаться». Все остальные глаголы —
          *machen*, *kaufen* и даже погода *regnen* — идут с *haben*.
        point: "*sein* — движение и смена состояния, плюс *bleiben*; остальное — *haben*"
        set: { view: table, table: hilfsverb }

  - id: angekommen
    chapter: grammar
    title: Причастие с приставкой
    beats:
      - read: >-
          Теперь глагол с отделяемой приставкой. В настоящем времени приставка
          уходит в конец предложения: *Der Zug kommt um acht Uhr an.* Это вы
          помните по теме о распорядке дня. Но в Perfekt в конец должно встать
          причастие — а место уже занято приставкой. Что же произойдёт с *an*?
          Посмотрите на схему и прокрутите дальше.
        point: "Сейчас: *Der Zug kommt um acht Uhr an.* — приставка в конце"
        set:
          view: sentence
          rows:
            - de: [Der Zug, komm+t, um acht Uhr, an.]
              ru: Поезд прибывает в восемь часов.
      - read: >-
          Приставка остаётся на месте, а причастие вырастает из неё: *an* +
          *ge* + *kommen* — *angekommen*, одним словом. Место глагола занимает
          *ist*: прибытие — тоже движение. Так же *abfahren — ist abgefahren*,
          *aufstehen — ist aufgestanden*. Частые ошибки — *geankommen* и
          *angekommt*: *ge* никогда не встаёт перед отделяемой приставкой, а
          причастие от *kommen* кончается на *-en*.
        point: "*ankommen — ist angekommen*: *ge* — между приставкой и корнем"
        set:
          rows:
            - de: [Der Zug, ist, um acht Uhr, an+gekommen.]
              ru: Поезд прибыл в восемь часов.

  - id: es-regnet
    chapter: grammar
    title: Погода и es
    beats:
      - read: >-
          Вернёмся к погоде. По-русски «идёт дождь» — без подлежащего, а
          по-немецки подлежащее нужно всегда, поэтому есть формальное *es*. Если
          первым стоит *heute*, *es* уходит за глагол, но не исчезает: *Heute
          regnet es*, а не *Heute regnet*. В Perfekt погода идёт с *haben* —
          дождь ведь никуда не едет: *Gestern hat es geregnet.* О вчерашней
          погоде можно сказать и через *war*: *Gestern war es kalt.*
        point: "*Heute regnet es.* *Gestern hat es geregnet.* — *es* не пропадает"
        set:
          view: sentence
          rows:
            - de: [Heute, regn+et, es., ""]
              ru: Сегодня идёт дождь.
            - de: [Gestern, hat, es, geregnet.]
              ru: Вчера шёл дождь.

  - id: monate
    chapter: grammar
    title: Месяцы
    beats:
      - read: >-
          Месяцы почти все похожи на русские — труднее с буквами: *März* с
          умлаутом, *Mai* через *ai*. *Juni* и *Juli* легко спутать на слух,
          поэтому по телефону немцы часто говорят *Juno* и *Julei*. Все месяцы
          — мужского рода, и с ними тот же предлог, что с временами года: *im
          Juni*. Теперь у вас есть все три предлога времени: *um acht Uhr*,
          *am Freitag*, *im Juni*.
        point: "*um* — время, *am* — день и дата, *im* — месяц и время года"
        set: { view: table, table: monate }

  - id: datum
    chapter: grammar
    title: Какое сегодня число?
    beats:
      - read: >-
          Дата — это порядковое число: «первое мая», «второе июня». До 19
          немецкие порядковые числа образуются просто: к числу добавляется
          *-te*: *zwei — der zweite*, *vier — der vierte*. Запомните четыре
          исключения: *der erste*, *der dritte*, *der siebte* и *der achte* —
          у *acht* уже есть своё *t*, второе не нужно. На письме порядковое
          число обозначают точкой: *der 2. Juni*.
        point: "До 19 — *-te*: *der zweite*; исключения: *erste*, *dritte*, *siebte*, *achte*"
        set: { view: table, table: datum, reveal: 6, focus: [0, 2, 4, 5] }
      - read: >-
          С 20 окончание длиннее — *-ste*: *der zwanzigste*, *der
          einunddreißigste*. Последний шаг — «когда?». По-русски «первого мая»
          — родительный падеж, а по-немецки *am* и окончание *-en*: *am ersten
          Mai*. После *vom* и *bis zum* — тоже *-en*, поэтому Марко и сказал
          *vom zweiten bis zum vierten Juni*. Спросить дату можно так: *Welches
          Datum ist heute?*
        point: "С 20 — *-ste*; «когда?» — *am …-en*: *am ersten Mai*, *am zwanzigsten Mai*"
        set: { reveal: 9, focus: [0, 6, 7, 8] }

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как начать *Der Zug ist um acht Uhr angekommen* со слов *Um acht Uhr*?
        read: >-
          *Um acht Uhr ist der Zug angekommen.* Время встаёт на первую
          позицию, *ist* остаётся вторым, *der Zug* уходит в середину. А
          *angekommen* не двигается: конец рамки занят причастием, что бы ни
          происходило в начале. В этом и смысл Perfekt — две опоры, второе
          место и конец, а всё остальное переставляется между ними.
        point: "*Um acht Uhr ist der Zug angekommen.* — причастие остаётся в конце"
        before:
          view: sentence
          rows:
            - de: [Der Zug, ist, um acht Uhr, an+gekommen.]
              ru: Поезд прибыл в восемь часов.
        set:
          rows:
            - de: [Um acht Uhr, ist, der Zug, an+gekommen.]
              ru: В восемь часов поезд прибыл.
      - question: Как сказать «Мы остались в Гамбурге на два дня»?
        read: >-
          *Wir sind zwei Tage in Hamburg geblieben.* Логика подсказывает
          *haben*: никто никуда не едет. Но *bleiben* — исключение, оно идёт с
          *sein*, как глаголы движения. Ошибка *Wir haben geblieben* — одна из
          самых частых, поэтому учите парой: *fahren — ist gefahren*, *bleiben
          — ist geblieben*. Порядок в середине привычный: сначала «сколько
          времени», потом «где».
        point: "*bleiben — ist geblieben*: движения нет, а глагол — *sein*"
        set:
          view: sentence
          rows:
            - de: [Wir, sind, zwei Tage in Hamburg, geblieben.]
              ru: Мы остались в Гамбурге на два дня.
      - question: Как сказать, что у вас день рождения 3 марта?
        read: >-
          *Ich habe am dritten März Geburtstag.* День рождения «имеют»:
          *Geburtstag haben*, и *Geburtstag* стоит в конце, без артикля. Дата —
          с *am* и окончанием *-en*. И помните об исключении: «третий» —
          *dritte*, а не *dreite*. Ответ может быть и короче: *Am dritten
          März.* А спросить друга можно так: *Wann hast du Geburtstag?*
        point: "*Ich habe am dritten März Geburtstag.* — *Wann hast du Geburtstag?*"
        set: { view: table, table: datum, focus: [2] }

  - id: schreiben-2
    chapter: exam
    title: "Письменный экзамен: сообщение"
    beats:
      - read: >-
          Вторая часть письменного экзамена — короткое сообщение, около 30
          слов. В задании три пункта, *Leitpunkte*, и на каждый нужно ответить
          одним-двумя предложениями: за пункт дают до 3 баллов и ещё 1 — за
          оформление. Здесь фрау Вебер из языковой школы пишет всей группе, а
          Анна ей отвечает. Пишем на «Вы»: *Liebe Frau Weber* в начале и
          *Viele Grüße* в конце.
        point: "Сообщение: ~30 слов, 3 пункта, обращение и подпись"
        set: { view: task, task: antwort, reveal: 0 }
      - read: >-
          Образец отвечает на пункты по очереди. Куда и на чём — Perfekt с
          *sein*: *sind … gefahren*. Погода в прошлом — *war* и *hat
          geregnet*. Планы на июль — просто настоящее время: *Im Juli fliege
          ich nach Polen.* Немцы так и говорят о будущем, если в предложении
          есть слово времени. Не усложняйте: проверяющий ищет ответ на каждый
          пункт и понятные фразы, а не красивый стиль.
        point: "На пункт — 1–2 предложения; планы — в настоящем: *Im Juli fliege ich …*"
        set: { reveal: 6 }

  - id: schreiben-1
    chapter: exam
    title: "Письменный экзамен: бланк"
    beats:
      - read: >-
          Первая часть письменного экзамена — бланк. Марко снова едет в
          Гамбург, теперь с сестрой, и бронирует номера на сайте отеля. Вы
          заполняете за него пять пустых полей, всё нужное есть в тексте.
          Обратите внимание на даты: они записаны цифрой с точкой, *am 8.
          August*. Точка значит, что число порядковое, и читается это *am
          achten August*.
        point: "Дата цифрой: *8. August* = *der achte August*"
        set: { view: task, task: buchung, reveal: 0 }
      - question: Что написать в поле «Frühstück»?
        read: >-
          *Nein.* Слова *nein* в тексте нет, зато есть *Frühstück brauchen sie
          nicht*. В бланке так бывает часто: ответ нужно не переписать, а
          понять. Даты переносите как в тексте, цифрой с точкой: *Anreise — 8.
          August*, *Abreise — 10. August*. *Anreise* — приезд, *Abreise* —
          отъезд: перепутать их легко, а балл потерять обидно.
        point: "Ответ не всегда дословный: *brauchen sie nicht* → *Frühstück: nein*"
        set: { reveal: 5 }

  - id: hoeren
    chapter: exam
    title: "Аудирование: объявление на вокзале"
    beats:
      - question: Поезд в Лейпциг отходит от пути 8 — *richtig* или *falsch*?
        read: >-
          *Falsch.* Сначала звучит *Gleis 8*, и рука сама тянется к *richtig*.
          Но дальше: *nicht von Gleis 8, sondern von Gleis 12*. Конструкция
          *nicht …, sondern …* — «не …, а …» — любимая ловушка второй части
          аудирования: верно то, что после *sondern*. Запись звучит только
          один раз, поэтому прочитайте утверждение заранее и слушайте номер
          пути, время и опоздание.
        point: "*nicht …, sondern …* — верна вторая часть; запись звучит один раз"
        before: { view: task, task: durchsage }
        set: { solved: true }

  - id: weiter
    chapter: exam
    title: Что дальше
    beats:
      - read: >-
          Это последняя тема уровня A1. Оглянитесь назад: вы умеете
          представиться, назвать цену и время, заказать еду, спросить дорогу,
          записаться к врачу и рассказать, что было, — с *haben* и *sein*. С
          этим можно идти на экзамен Start Deutsch 1. На A2 появятся
          придаточные предложения с *weil* и *dass* и сравнения вроде *größer
          als*. А пока — *Sie haben es geschafft!*
        point: "A1 пройден: о себе, о быте и о прошлом — с *haben* и *sein*"
        set:
          view: sentence
          rows:
            - de: [Sie, hab+en, es, geschafft!]
              ru: У вас получилось!

exercises:
  - type: choice
    q: Wir ___ am Freitag nach Hamburg gefahren.
    options: [haben, sind, seid]
    answer: 1
    why: "*fahren* — движение из А в Б, поэтому *sein*: *wir sind gefahren*."
  - type: choice
    q: Am Samstag ___ es in Hamburg geregnet.
    options: [ist, hat, war]
    answer: 1
    why: "Погода — без движения: *es hat geregnet*."
  - type: gap
    q: Ich ___ heute um sechs Uhr aufgestanden.
    answer: [bin]
    hint: haben / sein
    why: "*aufstehen* — смена состояния, поэтому *sein*: *ich bin aufgestanden*."
  - type: gap
    q: Wir ___ zwei Nächte im Hotel geblieben.
    answer: [sind]
    hint: haben / sein
    why: "*bleiben* — исключение: движения нет, а глагол *sein*."
  - type: gap
    q: ___ ihr mit dem Zug gekommen?
    answer: [Seid]
    hint: sein
    why: "*ihr seid*; в вопросе да/нет вспомогательный глагол стоит первым."
  - type: gap
    q: Der Zug ist um acht Uhr ___.
    answer: [angekommen]
    hint: ankommen
    why: "*ge* — между приставкой и корнем: *an-ge-kommen*."
  - type: gap
    q: Marco ___ in Hamburg einen Regenschirm ___.
    answer: [hat, gekauft]
    hint: kaufen
    why: "*kaufen* — без движения: *hat gekauft*, причастие в конце."
  - type: choice
    q: Marco ist im März von Rom nach Leipzig ___.
    options: [geflogt, geflogen, fliegen]
    answer: 1
    why: "*fliegen — ist geflogen*: неправильный глагол, причастие на *-en*."
  - type: choice
    q: Heute ist der ___ Juni.
    options: [dreite, dritte, drei]
    answer: 1
    why: "Исключение: *drei — der dritte*."
  - type: gap
    q: Ich habe am ___ Mai Geburtstag.
    answer: [zwanzigsten]
    hint: "20."
    ru: У меня день рождения 20 мая.
    why: "С 20 — *-ste*, после *am* — *-en*: *am zwanzigsten*."
  - type: choice
    q: Wann fährst du nach Italien? – ___ Juli.
    options: [Am, Im, Um]
    answer: 1
    why: "Месяц — с *im*: *im Juli*. *am* — с датой: *am ersten Juli*."
  - type: choice
    q: Wie ist das Wetter? – ___ kalt und windig.
    options: [Ist, Es ist, Er ist]
    answer: 1
    why: "У погоды всегда есть подлежащее *es*: *Es ist kalt.*"
  - type: choice
    q: Как записать дату «8 августа» в бланке?
    options: ["8 August", "8. August", "8te August"]
    answer: 1
    why: "Точка после числа делает его порядковым: *8. August* — *der achte August*."
  - type: order
    ru: В пятницу мы поехали в Гамбург.
    de: Am Freitag sind wir nach Hamburg gefahren.
    why: "Время на первом месте: *sind* второй, *wir* за ним, *gefahren* в конце."
  - type: order
    ru: Когда прибыл поезд?
    de: Wann ist der Zug angekommen?
  - type: order
    ru: Вчера было холодно и ветрено.
    de: Gestern war es kalt und windig.
    also: [Gestern war es windig und kalt.]
