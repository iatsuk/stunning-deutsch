tables:
  hilfsverb:
    title: haben oder sein?
    ru: С каким глаголом строится Perfekt
    head: [ Infinitiv, Perfekt, Почему ]
    ruCols: [ 2 ]
    rows:
      - [ fahren, ist *ge*fahr*en*, "движение: из А в Б" ]
      - [ fliegen, ist *ge*flog*en*, движение ]
      - [ gehen, ist *ge*gang*en*, движение ]
      - [ ankommen, ist an*ge*komm*en*, движение ]
      - [ aufstehen, ist auf*ge*stand*en*, смена состояния ]
      - [ bleiben, ist *ge*blieb*en*, исключение — запомнить ]
      - [ machen, hat *ge*mach*t*, нет движения ]
      - [ kaufen, hat *ge*kauf*t*, нет движения ]
      - [ regnen, hat *ge*regn*et*, погода — нет движения ]
    note: "Сами *sein* и *haben* в прошлом обычно звучат как *war* и *hatte*: *Wie war die Reise?*"
  monate:
    title: Die Monate
    ru: Месяцы по временам года
    head: [ Frühling, Sommer, Herbst, Winter ]
    rows:
      - [ März, Juni, September, Dezember ]
      - [ April, Juli, Oktober, Januar ]
      - [ Mai, August, November, Februar ]
    note: "Все месяцы — мужского рода: *der Mai*, *im Mai*. Но с датой — *am*: *am ersten Mai*."
  datum:
    title: Ordinalzahlen und Datum
    ru: Порядковые числа и дата
    head: [ Datum, "Heute ist …", Wann? ]
    rows:
      - [ "1. Mai", der erst+e Mai, am erst+en Mai ]
      - [ "2. Mai", der zwei+te Mai, am zwei+ten Mai ]
      - [ "3. Mai", der dritt+e Mai, am dritt+en Mai ]
      - [ "4. Mai", der vier+te Mai, am vier+ten Mai ]
      - [ "7. Mai", der sieb+te Mai, am sieb+ten Mai ]
      - [ "8. Mai", der acht+e Mai, am acht+en Mai ]
      - [ "19. Mai", der neunzehn+te Mai, am neunzehn+ten Mai ]
      - [ "20. Mai", der zwanzig+ste Mai, am zwanzig+sten Mai ]
      - [ "31. Mai", der einunddreißig+ste Mai, am einunddreißig+sten Mai ]
    note: "До 19 — *-te*, с 20 — *-ste*. После *am*, *vom* и *bis zum* окончание *-en*."

tasks:
  antwort:
    kind: message
    part: schreiben-2
    title: Schreiben, Teil 2
    situation: >-
      Der Deutschkurs ist bald zu Ende. Frau Thomsen schreibt an alle im Kurs. Sie waren in
      Hamburg. Antworten Sie Frau Thomsen. Schreiben Sie zu jedem Punkt ein bis zwei Sätze
      (circa 30 Wörter). Vergessen Sie nicht die Anrede und den Gruß.
    from: Frau Thomsen
    to: Kurs A1
    subject: Bald ist der Kurs zu Ende
    text: |
      Liebe Kursteilnehmerinnen und Kursteilnehmer,
      der Kurs ist bald zu Ende. Vielen Dank! Wie war Ihr Wochenende? Was machen Sie im Sommer? Schreiben Sie mir!
      Herzliche Grüße
      Frau Thomsen
    points:
      - Wohin sind Sie gefahren?
      - Wie war das Wetter?
      - Was machen Sie im Juli?
    sample:
      - "Liebe Frau Thomsen,"
      - Mateo und ich sind am Wochenende mit dem Zug nach Hamburg gefahren.
      - Das Wetter war leider nicht so gut. Es hat oft geregnet.
      - Im Juli fahre ich nach Eckernförde und gehe zum Strand.
      - Viele Grüße
      - Dana
  buchung:
    kind: form
    part: schreiben-1
    title: Zimmerreservierung – Hotel Elbblick
    situation: >-
      Mateo Fernández und sein Freund Hauke möchten im August nach Hamburg fahren. Sie kommen
      am 8. August an und fahren am 10. August zurück. Sie möchten zwei Einzelzimmer. Frühstück
      brauchen sie nicht – sie frühstücken gern im Café. Mateo reserviert die Zimmer im
      Internet. Helfen Sie ihm mit dem Formular.
    fields:
      - { label: Familienname, value: Fernández, given: true }
      - { label: Vorname, value: Mateo, given: true }
      - { label: Anreise, value: "8. August" }
      - { label: Abreise, value: "10. August" }
      - { label: Personen, value: "2" }
      - { label: Zimmer, value: 2 Einzelzimmer }
      - { label: Frühstück, value: nein }
  durchsage:
    kind: listen
    part: hoeren-2
    title: Hören, Teil 2
    situation: >-
      Sie sind am Hauptbahnhof in Hamburg und hören eine Durchsage. Ist die Aussage richtig
      oder falsch? Sie hören den Text einmal.
    voice: Rocko
    text: >-
      Achtung an Gleis 8! Der Intercity nach Kiel, Abfahrt 17 Uhr 46, fährt heute nicht von
      Gleis 8, sondern von Gleis 12 ab. Der Zug hat circa 20 Minuten Verspätung. Wir bitten um
      Entschuldigung.
    statement: Der Zug nach Kiel fährt von Gleis 8 ab.
    answer: false
  wetterplan:
    kind: message
    part: lesen-1
    title: Spaziergang in Hamburg
    from: Dana
    text: Heute ist es kalt und windig. Es hat am Morgen geregnet. Für den Spaziergang nehmen wir
      einen Regenschirm und eine Jacke mit. Die Sonnenbrille bleibt im Hotel.

steps:
  - id: empfang
    chapter: scene
    title: Вечер в отеле
    beats:
      - read: >-
          Перед финалом в Киле друзья рассматривают фотографии поездки в Гамбург в начале июня.
          Матео заранее согласовал свободные дни; обычный график работы из темы 11 не
          изменился. В воспоминании они спрашивают *Haben Sie noch zwei Einzelzimmer frei?* и
          называют *vom zweiten bis zum vierten Juni*. Отель, цена и расписание вымышлены.
          Июньская поездка и августовский бланк ниже — разные ситуации; даты нельзя переносить
          из одной в другую.
        point: "*Haben Sie noch ein Zimmer frei?* — есть свободный номер?"
        set: { view: dialogue, dialogue: empfang, reveal: 4, focus: [ 1, 3 ] }
      - read: >-
          Номер есть: *80 Euro pro Nacht, mit Frühstück*. Господин Хансен спрашивает о дороге:
          *Sind Sie mit dem Zug gekommen?* — «вы приехали на поезде?» Заметьте: не *haben*, а
          *sind*. Матео отвечает так же: *Der Zug ist erst um acht Uhr angekommen.* Глаголы
          движения строят Perfekt с *sein* — это главная грамматика темы. А опоздание — через
          знакомое *hatte*: *Er hatte eine Stunde Verspätung*, буквально «у него был час
          опоздания».
        point: "Движение в прошлом — с *sein*: *Sind Sie mit dem Zug gekommen?*"
        set: { reveal: 10, focus: [ 4, 6, 7 ] }

  - id: telefon
    chapter: scene
    title: Звонок Элиф из Киля
    beats:
      - read: >-
          На следующий день Элиф звонит Дане из Киля. В Гамбурге *kalt und windig*, а в её
          рассказе о Киле *Hier in Kiel scheint die Sonne. Es sind 25 Grad!* Это погода учебной
          сцены, не прогноз. Для безличного «холодно» используем *Es ist kalt*. После *heute*
          местоимение сохраняется: *Heute ist es kalt*. Не обобщайте погоду одного дня на весь
          город или сезон.
        point: "*Es ist kalt.* — «холодно»: без *es* по-немецки нельзя"
        set: { view: dialogue, dialogue: telefon, reveal: 3, focus: [ 1, 2 ] }
      - read: >-
          Потом Дана рассказывает, что было, — и тут слушайте вспомогательный глагол. *Es hat
          geregnet*, *wir haben einen Regenschirm gekauft* — с *haben*, как в прошлой теме. Но
          *wir sind angekommen*, *wir sind zum Hafen gegangen*, *wir sind mit dem Schiff
          gefahren* — с *sein*. Почему одни глаголы выбирают *haben*, а другие *sein*, разберём
          в грамматике. А *Kommt morgen gut nach Hause!* — повелительное наклонение на *ihr*.
        point: "*hat geregnet*, *haben gekauft* — но *sind gegangen*, *sind gefahren*"
        set: { reveal: 10, focus: [ 3, 5, 7, 8 ] }

  - id: unterwegs
    chapter: words
    title: В дороге
    beats:
      - read: >-
          Слова для дороги. Транспорт — с предлогом *mit* и дательным падежом: *mit dem Zug*,
          *mit dem Flugzeug*. Путь на вокзале — *das Gleis*: *Der Zug fährt von Gleis 12 ab.*
          Опоздание по-немецки «имеют»: *Der Zug hat 20 Minuten Verspätung.* А *die Durchsage*
          — объявление по громкой связи. На экзамене их будет четыре — на вокзале, в аэропорту
          или в магазине.
        point: "*mit dem Zug*; опоздание «имеют»: *Der Zug hat 20 Minuten Verspätung.*"
        set: { view: words, words: unterwegs }

  - id: hotel
    chapter: words
    title: Номер в отеле
    beats:
      - read: >-
          Номер в отеле — это *das Zimmer*, а *die Nummer* — только число на двери: *Zimmer
          Nummer 12*. *das Einzelzimmer* — на одного, *das Doppelzimmer* — на двоих; род, как
          всегда у сложных слов, — по последней части. *die Anreise* и *die Abreise* — день
          приезда и день отъезда, они есть в каждом бланке. И осторожно с *reservieren*:
          глаголы на *-ieren* строят Perfekt без *ge-*: *Ich habe ein Zimmer reserviert.*
        point: "*das Einzelzimmer*, *das Doppelzimmer*; *reservieren — hat reserviert*, без *ge-*"
        set: { view: words, words: hotel }

  - id: wetter
    chapter: words
    title: Какая погода?
    beats:
      - read: >-
          О погоде говорят все и всегда — с соседом, с коллегой, с администратором в отеле.
          Почти каждая фраза начинается с *es*: *Es regnet*, *Es schneit*, *Es ist kalt*.
          Исключение — солнце, у него своё подлежащее: *Die Sonne scheint.* Прилагательные
          получаются из существительных: *die Sonne — sonnig*, *der Wind — windig*. А *Grad*
          после числа не меняется: *Es sind 20 Grad.*
        point: "*Es regnet. Es ist kalt.* — но *Die Sonne scheint.*"
        set: { view: words, words: wetter }

  - id: jahr
    chapter: words
    title: Времена года
    beats:
      - read: >-
          Времена года — мужского рода: *der Frühling*, *der Sommer*, *der Herbst*, *der
          Winter*, хотя «весна», «осень» и «зима» в русском — женского. На вопрос «когда?»
          отвечаем с *im*: *im Sommer*, *im Winter*. А с днями — *am*: *am Wochenende*. День
          рождения немцы «имеют»: *Ich habe im Mai Geburtstag.* И *die Ferien* бывают только во
          множественном числе, совсем как русские «каникулы».
        point: "*der Sommer* — *im Sommer*; *Ich habe im Mai Geburtstag.*"
        set: { view: words, words: jahr }

  - id: perfekt
    chapter: grammar
    title: Perfekt с sein
    beats:
      - read: >-
          Perfekt с *haben* вы уже знаете: *Wir haben im Hotel gefrühstückt.* Но о поездке Дана
          говорит *Wir sind nach Hamburg gefahren.* Рамка та же: вспомогательный глагол на
          втором месте, причастие в самом конце. Меняется только вспомогательный глагол — с
          глаголами движения это *sein*. По-русски «мы поехали» — одно слово, а по-немецки —
          два, и между ними помещается вся середина предложения.
        point: "Perfekt: *haben* или *sein* на 2-м месте + причастие в конце"
        set:
          view: sentence
          rows:
            - de: [ Wir, hab+en, im Hotel, gefrühstückt. ]
              ru: Мы позавтракали в отеле.
            - de: [ Wir, sind, nach Hamburg, gefahren. ]
              ru: Мы поехали в Гамбург.
      - read: >-
          Поставим на первое место *am Freitag*. *sind* остаётся вторым, *wir* уходит в
          середину, а *gefahren* по-прежнему замыкает предложение. Всё новое — когда, на чём,
          куда — встаёт внутрь рамки, между *sind* и *gefahren*. Типичная ошибка — тянуть
          причастие к вспомогательному глаголу, как в русском: *Wir sind gefahren nach
          Hamburg.* Так по-немецки не говорят.
        point: "Всё новое — внутрь рамки: *Am Freitag sind wir mit dem Zug nach Hamburg gefahren.*"
        set:
          rows:
            - de: [ Wir, hab+en, im Hotel, gefrühstückt. ]
              ru: Мы позавтракали в отеле.
            - de: [ Am Freitag, sind, wir mit dem Zug nach Hamburg, gefahren. ]
              ru: В пятницу мы поехали в Гамбург на поезде.
          focus: [ 1 ]

  - id: haben-sein
    chapter: grammar
    title: haben или sein?
    beats:
      - read: >-
          Для показанных глаголов есть полезная опора: перемещение в другое место — *ist
          gefahren*, *ist gegangen*, *ist angekommen*; изменение состояния — *ist
          aufgestanden*. Отдельно запоминаем *ist geblieben*. Остальные глаголы этой таблицы —
          *hat gemacht*, *hat gekauft*, *hat geregnet*. Это рабочая схема для наших примеров
          A1, а не правило без исключений обо всех немецких глаголах. В игре нужно восстановить
          целые события поездки.
        point: "В наших примерах: *ist gefahren / gegangen / geblieben*, но *hat gekauft / geregnet*"
        set: { view: table, table: hilfsverb }

  - id: angekommen
    chapter: grammar
    title: Причастие с приставкой
    beats:
      - read: >-
          Теперь глагол с отделяемой приставкой. В настоящем времени приставка уходит в конец
          предложения: *Der Zug kommt um acht Uhr an.* Это вы помните по теме о распорядке дня.
          Но в Perfekt в конец должно встать причастие — а место уже занято приставкой. Что же
          произойдёт с *an*? Посмотрите на схему и прокрутите дальше.
        point: "Сейчас: *Der Zug kommt um acht Uhr an.* — приставка в конце"
        set:
          view: sentence
          rows:
            - de: [ Der Zug, komm+t, um acht Uhr, an. ]
              ru: Поезд прибывает в восемь часов.
      - read: >-
          Приставка остаётся на месте, а причастие вырастает из неё: *an* + *ge* + *kommen* —
          *angekommen*, одним словом. Место глагола занимает *ist*: прибытие — тоже движение.
          Так же *abfahren — ist abgefahren*, *aufstehen — ist aufgestanden*. Частые ошибки —
          *geankommen* и *angekommt*: *ge* никогда не встаёт перед отделяемой приставкой, а
          причастие от *kommen* кончается на *-en*.
        point: "*ankommen — ist angekommen*: *ge* — между приставкой и корнем"
        set:
          rows:
            - de: [ Der Zug, ist, um acht Uhr, an+gekommen. ]
              ru: Поезд прибыл в восемь часов.

  - id: es-regnet
    chapter: grammar
    title: Погода и es
    beats:
      - read: >-
          В русском «идёт дождь» подлежащее — «дождь». Немецкая фраза устроена иначе: *Es
          regnet*, с формальным *es*. Если первым стоит *heute*, *es* уходит за глагол: *Heute
          regnet es*. В прошедшем — *Gestern hat es geregnet*, а описание состояния — *Gestern
          war es kalt*. Для понимания отчёта важно отделить дождь сегодня утром от того, что
          было вчера вечером.
        point: "*Heute regnet es.* *Gestern hat es geregnet.* — *es* не пропадает"
        set:
          view: sentence
          rows:
            - de: [ Heute, regn+et, es., "" ]
              ru: Сегодня идёт дождь.
            - de: [ Gestern, hat, es, geregnet. ]
              ru: Вчера шёл дождь.

  - id: monate
    chapter: grammar
    title: Месяцы
    beats:
      - read: >-
          Месяцы почти все похожи на русские — труднее с буквами: *März* с умлаутом, *Mai*
          через *ai*. *Juni* и *Juli* легко спутать на слух, поэтому по телефону немцы часто
          говорят *Juno* и *Julei*. Все месяцы — мужского рода, и с ними тот же предлог, что с
          временами года: *im Juni*. Теперь у вас есть все три предлога времени: *um acht Uhr*,
          *am Freitag*, *im Juni*.
        point: "*um* — время, *am* — день и дата, *im* — месяц и время года"
        set: { view: table, table: monate }

  - id: datum
    chapter: grammar
    title: Какое сегодня число?
    beats:
      - read: >-
          Порядковые числа вы уже встречали: *im zweiten Stock*, *die zweite Straße links*.
          Дата — тоже порядковое число: «первое мая», «второе июня». До 19 к числу добавляется
          *-te*: *zwei — der zweite*, *vier — der vierte*. Исключений четыре: к знакомым *der
          erste* и *der dritte* добавляются *der siebte* и *der achte* — у *acht* уже есть своё
          *t*, второе не нужно. На письме порядковое число обозначают точкой: *der 2. Juni*.
        point: "До 19 — *-te*: *der zweite*; исключения: *erste*, *dritte*, *siebte*, *achte*"
        set: { view: table, table: datum, reveal: 6, focus: [ 0, 2, 4, 5 ] }
      - read: >-
          С 20 окончание длиннее — *-ste*: *der zwanzigste*, *der einunddreißigste*. Последний
          шаг — «когда?». По-русски «первого мая» — родительный падеж, а по-немецки *am* и
          окончание *-en*: *am ersten Mai*. После *vom* и *bis zum* — тоже *-en*, поэтому Матео
          и сказал *vom zweiten bis zum vierten Juni*. Спросить дату можно так: *Welches Datum
          ist heute?*
        point: "С 20 — *-ste*; «когда?» — *am …-en*: *am ersten Mai*, *am zwanzigsten Mai*"
        set: { reveal: 9, focus: [ 0, 6, 7, 8 ] }

  - id: check
    chapter: practice
    title: Проверьте себя
    beats:
      - question: Как начать *Der Zug ist um acht Uhr angekommen* со слов *Um acht Uhr*?
        read: >-
          *Um acht Uhr ist der Zug angekommen.* Время встаёт на первую позицию, *ist* остаётся
          вторым, *der Zug* уходит в середину. А *angekommen* не двигается: конец рамки занят
          причастием, что бы ни происходило в начале. В этом и смысл Perfekt — две опоры,
          второе место и конец, а всё остальное переставляется между ними.
        point: "*Um acht Uhr ist der Zug angekommen.* — причастие остаётся в конце"
        before:
          view: sentence
          rows:
            - de: [ Der Zug, ist, um acht Uhr, an+gekommen. ]
              ru: Поезд прибыл в восемь часов.
        set:
          rows:
            - de: [ Um acht Uhr, ist, der Zug, an+gekommen. ]
              ru: В восемь часов поезд прибыл.
      - question: Как сказать «Мы остались в Гамбурге на два дня»?
        read: >-
          *Wir sind zwei Tage in Hamburg geblieben.* Логика подсказывает *haben*: никто никуда
          не едет. Но *bleiben* — исключение, оно идёт с *sein*, как глаголы движения. Ошибка
          *Wir haben geblieben* — одна из самых частых, поэтому учите парой: *fahren — ist
          gefahren*, *bleiben — ist geblieben*. Порядок в середине привычный: сначала «сколько
          времени», потом «где».
        point: "*bleiben — ist geblieben*: движения нет, а глагол — *sein*"
        set:
          view: sentence
          rows:
            - de: [ Wir, sind, zwei Tage in Hamburg, geblieben. ]
              ru: Мы остались в Гамбурге на два дня.
      - question: Как сказать, что у вас день рождения 3 мая?
        read: >-
          *Ich habe am dritten Mai Geburtstag.* День рождения «имеют»: *Geburtstag haben*, и
          *Geburtstag* стоит в конце, без артикля. Дата — с *am* и окончанием *-en*. И помните
          об исключении: «третий» — *dritte*, а не *dreite*. Ответ может быть и короче: *Am
          dritten Mai.* А спросить друга можно так: *Wann hast du Geburtstag?*
        point: "*Ich habe am dritten Mai Geburtstag.* — *Wann hast du Geburtstag?*"
        set: { view: table, table: datum, focus: [ 2 ] }

  - id: schreiben-2
    chapter: exam
    title: "Письменный экзамен: сообщение"
    beats:
      - read: >-
          В конце курса фрау Томсен спрашивает о поездке и летних планах. Для короткого
          сообщения нужны три ответа: куда ездили, какая была погода и что планируется в июле.
          Начните *Liebe Frau Thomsen,* и завершите *Viele Grüße*. В игре вы уже
          восстанавливали факты, теперь попробуйте выразить их сами. Образец — опора для
          проверки, а не обязательный текст для заучивания.
        point: "Сообщение: ~30 слов, 3 пункта, обращение и подпись"
        set: { view: task, task: antwort, reveal: 0 }
      - read: >-
          Поездка — *sind … gefahren*, прошедшая погода — *war* и *hat geregnet*. План Даны на
          июль — *Im Juli fahre ich nach Eckernförde und gehe zum Strand*. Настоящее время со
          словом будущего времени подходит для простого плана. Это не бронь и не прогноз
          погоды. На каждый пункт достаточно понятного ответа; затем проверьте обращение,
          подпись и порядок слов.
        point: "На пункт — 1–2 предложения; планы — в настоящем: *Im Juli fliege ich …*"
        set: { reveal: 6 }

  - id: schreiben-1
    chapter: exam
    title: "Письменный экзамен: бланк"
    beats:
      - read: >-
          Августовский бланк — отдельная планируемая поездка Матео и Хауке. В задаче нужны пять
          полей: приезд, отъезд, число людей, тип и количество комнат, завтрак. Даты *8.
          August* и *10. August* относятся только к этой брони, а не к июньскому воспоминанию.
          Подробности поездки целиком вымышлены; вы тренируете перенос сведений в форму.
        point: "Дата цифрой: *8. August* = *der achte August*"
        set: { view: task, task: buchung, reveal: 0 }
      - question: Что написать в поле «Frühstück»?
        read: >-
          *Nein.* Слова *nein* в тексте нет, зато есть *Frühstück brauchen sie nicht*. В бланке
          так бывает часто: ответ нужно не переписать, а понять. Даты переносите как в тексте,
          цифрой с точкой: *Anreise — 8. August*, *Abreise — 10. August*. *Anreise* — приезд,
          *Abreise* — отъезд: перепутать их легко, а балл потерять обидно.
        point: "Ответ не всегда дословный: *brauchen sie nicht* → *Frühstück: nein*"
        set: { reveal: 5 }

  - id: hoeren
    chapter: exam
    title: "Аудирование: объявление на вокзале"
    beats:
      - question: Поезд в Киль отходит от пути 8 — *richtig* или *falsch*?
        read: >-
          *Falsch.* Сначала звучит *Gleis 8*, и рука сама тянется к *richtig*. Но дальше:
          *nicht von Gleis 8, sondern von Gleis 12*. Конструкция *nicht …, sondern …* — «не …,
          а …» — любимая ловушка второй части аудирования: верно то, что после *sondern*.
          Запись звучит только один раз, поэтому прочитайте утверждение заранее и слушайте
          номер пути, время и опоздание.
        point: "*nicht …, sondern …* — верна вторая часть; запись звучит один раз"
        before: { view: task, task: durchsage }
        set: { solved: true }

  - id: weiter
    chapter: exam
    title: Финал A1 и следующий шаг
    beats:
      - read: >-
          Это последняя тема маршрута A1. Вы прошли бытовые ситуации, игры и дела: знакомство,
          кафе, покупки, время, жильё, дорога, здоровье, работа и поездка. В финальном деле
          пригодятся даты, Perfekt и разница между движением и местом. Прохождение страниц само
          по себе не гарантирует готовность к экзамену: следующий шаг — пробный тест со
          временем, самостоятельное письмо и разговор. После этого можно переходить к A2 и
          новым поездкам по региону.
        point: "Маршрут A1 завершён; готовность проверяем пробным экзаменом и самостоятельной речью"
        set:
          view: sentence
          rows:
            - de: [ Sie, hab+en, es, geschafft! ]
              ru: У вас получилось!

exercises:
  - type: choice
    q: Wir ___ am Freitag nach Hamburg gefahren.
    options: [ haben, sind, seid ]
    answer: 1
    why: "*fahren* — движение из А в Б, поэтому *sein*: *wir sind gefahren*."
  - type: choice
    q: Am Samstag ___ es in Hamburg geregnet.
    options: [ ist, hat, war ]
    answer: 1
    why: "Погода — без движения: *es hat geregnet*."
  - type: gap
    q: Ich ___ heute um sechs Uhr aufgestanden.
    answer: [ bin ]
    hint: haben / sein
    why: "*aufstehen* — смена состояния, поэтому *sein*: *ich bin aufgestanden*."
  - type: gap
    q: Wir ___ zwei Nächte im Hotel geblieben.
    answer: [ sind ]
    hint: haben / sein
    why: "*bleiben* — исключение: движения нет, а глагол *sein*."
  - type: gap
    q: ___ ihr mit dem Zug gekommen?
    answer: [ Seid ]
    hint: sein
    why: "*ihr seid*; в вопросе да/нет вспомогательный глагол стоит первым."
  - type: gap
    q: Der Zug ist um acht Uhr ___.
    answer: [ angekommen ]
    hint: ankommen
    why: "*ge* — между приставкой и корнем: *an-ge-kommen*."
  - type: gap
    q: Mateo ___ in Hamburg einen Regenschirm ___.
    answer: [ hat, gekauft ]
    hint: kaufen
    why: "*kaufen* — без движения: *hat gekauft*, причастие в конце."
  - type: choice
    q: Mateo ist im März von Buenos Aires nach Hamburg ___.
    options: [ geflogt, geflogen, fliegen ]
    answer: 1
    why: "*fliegen — ist geflogen*: неправильный глагол, причастие на *-en*."
  - type: choice
    q: Heute ist der ___ Juni.
    options: [ dreite, dritte, drei ]
    answer: 1
    why: "Исключение: *drei — der dritte*."
  - type: gap
    q: Ich habe am ___ Mai Geburtstag.
    answer: [ zwanzigsten ]
    hint: "20."
    ru: У меня день рождения 20 мая.
    why: "С 20 — *-ste*, после *am* — *-en*: *am zwanzigsten*."
  - type: choice
    q: Wann fährst du nach Dänemark? – ___ Juli.
    options: [ Am, Im, Um ]
    answer: 1
    why: "Месяц — с *im*: *im Juli*. *am* — с датой: *am ersten Juli*."
  - type: choice
    q: Wie ist das Wetter? – ___ kalt und windig.
    options: [ Ist, Es ist, Er ist ]
    answer: 1
    why: "У погоды всегда есть подлежащее *es*: *Es ist kalt.*"
  - type: choice
    q: Как записать дату «8 августа» в бланке?
    options: [ "8 August", "8. August", "8te August" ]
    answer: 1
    why: "Точка после числа делает его порядковым: *8. August* — *der achte August*."
  - type: order
    ru: В пятницу мы поехали в Гамбург.
    also: ["Wir sind am Freitag nach Hamburg gefahren.", "Nach Hamburg sind wir am Freitag gefahren."]
    de: Am Freitag sind wir nach Hamburg gefahren.
    why: "Время на первом месте: *sind* второй, *wir* за ним, *gefahren* в конце."
  - type: order
    ru: Когда прибыл поезд?
    de: Wann ist der Zug angekommen?
  - type: order
    ru: Вчера было холодно и ветрено.
    de: Gestern war es kalt und windig.
    also: ["Gestern war es windig und kalt.", "Es war gestern kalt und windig.", "Es war gestern windig und kalt."]
adventure:
  kind: sequence
  title: Сверьте поездку перед финалом
  intro: Друзья собирают альбом июньской поездки и планируют отдельный визит в августе. Отделите
    даты, вещи для прогулки и уже случившиеся события. Все брони и расписания учебные.
  ending: Бланк заполнен по своей ситуации, вещи выбраны по сообщению, события восстановлены в
    Perfekt, актуальный путь найден. Команда возвращается в Киль и готова к финальной сверке
    папки на Kieler Woche.
  challenges:
    - id: booking
      kind: match
      title: Не перепутайте две поездки
      intro: Заполните краткую карточку будущего августовского визита. Июньские даты из диалога здесь
        не подходят.
      clue:
        task: buchung
      slots:
        - id: arrival
          label: Anreise
          answer: eighth
        - id: departure
          label: Abreise
          answer: tenth
        - id: people
          label: Personen
          answer: two
        - id: rooms
          label: Zimmer
          answer: single
        - id: breakfast
          label: Frühstück
          answer: no
      options:
        - id: eighth
          label: 8. August
        - id: tenth
          label: 10. August
        - id: two
          label: "2"
        - id: single
          label: 2 Einzelzimmer
        - id: no
          label: nein
        - id: june
          label: 2. Juni
        - id: double
          label: 1 Doppelzimmer
      success: "Августовская карточка совпала с заданием: 8–10 августа, два человека, два одноместных
        номера, без завтрака."
      wrong: Проверяйте каждый пункт именно по августовской ситуации, а не по памяти о первом
        диалоге.
      mode: reading
    - id: walk-bag
      kind: pack
      title: Соберите вещи для прогулки по сообщению
      intro: "Выберите весь названный набор. Здесь не нужно оценивать условия выхода в море: друзья
        собираются на городскую прогулку."
      mode: reading
      clue:
        task: wetterplan
      options:
        - id: umbrella
          label: der Regenschirm
          icon: ☂️
        - id: jacket
          label: die Jacke
          icon: 🧥
        - id: glasses
          label: die Sonnenbrille
          icon: 🕶️
        - id: ticket
          label: die Fahrkarte
          icon: 🎫
      answer:
        - umbrella
        - jacket
      success: По сообщению нужны зонт и куртка. Очки остаются в отеле, билет в этом наборе не назван.
      wrong: В тексте прямо названы *einen Regenschirm und eine Jacke*. Не добавляйте предмет только
        потому, что он полезен в поездках.
    - id: trip-verbs
      kind: match
      title: Подпишите события альбома
      intro: Выберите вспомогательный глагол для четырёх событий. Один вариант может подходить
        нескольким карточкам.
      clue:
        dialogue: telefon
        lines:
          - 3
          - 5
          - 7
      slots:
        - id: rain
          label: Es … geregnet.
          answer: hat
        - id: buy
          label: Wir … einen Regenschirm gekauft.
          answer: haben
        - id: arrive
          label: Wir … angekommen.
          answer: sind
        - id: ship
          label: Wir … mit dem Schiff gefahren.
          answer: sind
      options:
        - id: hat
          label: hat
        - id: haben
          label: haben
        - id: sind
          label: sind
        - id: ist
          label: ist
      success: "Дождь и покупка — с *haben*, прибытие и поездка — с *sein*. Форма зависит от
        подлежащего: *es hat*, *wir haben / sind*."
      wrong: Проверьте и глагол события, и подлежащее. Для двух карточек *wir* нужен один и тот же
        вариант *sind*.
    - id: trip-sentence
      kind: order
      title: Расскажите о прогулке на кораблике
      intro: "Соберите подпись к фотографии: «Мы катались на кораблике»."
      label: Фотография из порта
      tokens:
        - Wir
        - sind
        - mit dem Schiff
        - gefahren.
      success: "*Wir sind mit dem Schiff gefahren.* Вспомогательный глагол и причастие держат рамку."
      wrong: Начните *Wir sind*, внутри рамки *mit dem Schiff*, в конце *gefahren.*
    - id: home-platform
      kind: select
      title: Найдите путь для возвращения
      intro: В учебном объявлении названы два пути. К какому нужно идти после изменения?
      clue:
        task: durchsage
      options:
        - id: eight
          label: Gleis 8
        - id: twelve
          label: Gleis 12
        - id: twenty
          label: Gleis 20
      answer:
        - twelve
      success: "*Nicht von Gleis 8, sondern von Gleis 12.* Двадцать — минуты задержки, а не номер
        пути."
      wrong: После *sondern* назван актуальный путь 12. Первое число и задержка — ловушки.
case:
  title: Die letzte Kopie
  ru: Последняя копия
  intro: Позднее, в конце июня, команда встречается в клубе на Kieler Woche. Йенсен собрал
    исходные сообщения, старые копии и объяснение Ферса. Финал решают факты о поездке и
    содержимое документов, а не ошибки в немецком.
  people:
    J:
      name: Herr Jensen
      voice: Grandpa
    X:
      name: Herr Vehrs
      voice: Eddy
  steps:
    - read: На последней копии перепутаны июньская поездка и августовский план. Возьмите только
