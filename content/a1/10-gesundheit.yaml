id: gesundheit
order: 10
title: Gute Besserung, Marco!
ru: Здоровье и врач
lede: >-
  Марко просыпается с температурой и звонит во врачебную практику, а в
  перерыве между занятиями Анна звонит ему и даёт советы. Учимся говорить, что болит, записываться к
  врачу, разбираем *müssen* и *dürfen* и повелительное наклонение для «ты» и
  для компании друзей.
goals:
  - Назвать части тела и сказать, что у вас болит
  - Записаться к врачу по телефону и понять, когда приходить
  - Сказать, что нужно и что нельзя делать, — с *müssen* и *dürfen*
  - "Дать совет другу или друзьям: *Trink viel Tee!* *Bleibt zu Hause!*"
  - Понять сообщение из практики и написать преподавателю, что вы заболели
grammar:
  - Части тела
  - Ich habe …schmerzen
  - Модальные глаголы müssen и dürfen
  - Повелительное наклонение на du и ihr
exam: [hoeren-3, schreiben-2, sprechen-3]

dialogues:
  praxis:
    title: Ein Termin beim Arzt
    ru: Запись к врачу
    place: Arztpraxis Dr. Hoffmann, Leipzig
    people:
      P: { name: Frau Klein, voice: Shelley }
      M: { name: Marco, voice: Reed }
    lines:
      - P: Praxis Dr. Hoffmann, guten Morgen!
        ru: Практика доктора Хофман, доброе утро!
      - M: Guten Morgen, hier ist Marco Rossi. Ich brauche einen Termin, bitte.
        ru: Доброе утро, это Марко Росси. Мне нужно записаться на приём.
      - P: Was haben Sie denn, Herr Rossi?
        ru: А что у вас, господин Росси?
      - M: Ich habe Halsschmerzen und Kopfschmerzen. Und ich habe Fieber.
        ru: У меня болит горло и голова. И у меня температура.
      - P: Können Sie heute um Viertel nach elf kommen?
        ru: Можете прийти сегодня в четверть двенадцатого?
      - M: Ja, das geht. Muss ich etwas mitbringen?
        ru: Да, могу. Мне нужно что-то взять с собой?
      - P: Ja, bringen Sie bitte Ihre Versichertenkarte mit.
        ru: Да, возьмите, пожалуйста, вашу карту медицинской страховки.
      - M: Gut. Vielen Dank!
        ru: Хорошо. Большое спасибо!
      - P: Gute Besserung, Herr Rossi. Bis später!
        ru: Выздоравливайте, господин Росси. До встречи!
  tipps:
    title: Gute Besserung!
    ru: Выздоравливай!
    place: Am Telefon
    people:
      A: { name: Anna, voice: Anna }
      M: { name: Marco, voice: Reed }
    lines:
      - A: Hallo, Marco! Du bist heute nicht im Kurs. Bist du krank?
        ru: Привет, Марко! Тебя сегодня нет на курсе. Ты заболел?
      - M: Ja, leider. Ich habe Fieber, und mein Hals tut weh.
        ru: Да, к сожалению. У меня температура, и болит горло.
      - A: Oh nein! Und was sagt der Arzt?
        ru: О нет! А что говорит врач?
      - M: Ich muss drei Tage im Bett bleiben. Und ich darf keinen Sport machen.
        ru: Мне нужно три дня лежать в постели. И спортом заниматься нельзя.
      - A: Oh, du Armer! Trink viel Tee und schlaf viel! Und nimm die Tabletten!
        ru: Ох, бедняга! Пей много чая и побольше спи! И принимай таблетки!
      - M: Ja, Frau Doktor!
        ru: Слушаюсь, доктор!
      - A: Lena und ich kommen morgen. Wir bringen Suppe mit.
        ru: Мы с Леной завтра придём. Принесём суп.
      - M: Super, danke! Kommt um vier! Und bringt bitte auch Schokolade mit!
        ru: Супер, спасибо! Приходите в четыре! И принесите, пожалуйста, ещё шоколад!
      - A: Schokolade? Na gut. Gute Besserung, Marco!
        ru: Шоколад? Ну ладно. Выздоравливай, Марко!

