id: gesundheit
order: 10
title: Gute Besserung, Mateo!
ru: Здоровье и врач
lede: >-
  До Kieler Woche ещё есть время, но Матео заболел и отменяет участие в подготовке. Помогите
  ему точно передать симптомы, разобраться с переносом записи и сообщить преподавательнице об
  отсутствии. Медицинские сцены вымышлены: здесь учимся понимать немецкий, а не выбирать
  лечение.
goals:
  - Назвать части тела и сказать, что у вас болит
  - Записаться к врачу по телефону и понять, когда приходить
  - Сказать, что нужно и что нельзя делать, — с *müssen* и *dürfen*
  - "Дать совет другу или друзьям: *Trink viel Tee!* *Bleibt zu Hause!*"
  - Понять сообщение из практики и написать преподавателю, что вы заболели
grammar:
  - Части тела
  - Ich habe …schmerzen
  - Модальные глаголы müssen и dürfen
  - Повелительное наклонение на du и ihr
exam: [ hoeren-3, schreiben-2, sprechen-3 ]

dialogues:
  praxis:
    title: Ein Termin beim Arzt
    ru: Запись к врачу
    place: Вымышленная Praxis Dr. Hoffmann, Kiel
    people:
      P: { name: Frau Klein, voice: Shelley }
      M: { name: Mateo, voice: Reed }
    lines:
      - P: Praxis Dr. Hoffmann, guten Morgen!
        ru: Практика доктора Хофман, доброе утро!
      - M: Guten Morgen, hier ist Mateo Fernández. Ich brauche einen Termin, bitte.
        ru: Доброе утро, это Матео Фернандес. Мне нужно записаться на приём.
      - P: Was haben Sie denn, Herr Fernández?
        ru: А что у вас, господин Фернандес?
      - M: Ich habe Halsschmerzen und Kopfschmerzen. Und ich habe Fieber.
        ru: У меня болит горло и голова. И у меня температура.
      - P: Können Sie heute um Viertel nach elf kommen?
        ru: Можете прийти сегодня в четверть двенадцатого?
      - M: Ja, das geht. Muss ich etwas mitbringen?
        ru: Да, могу. Мне нужно что-то взять с собой?
      - P: Ja, bringen Sie bitte Ihre Versichertenkarte mit.
        ru: Да, возьмите, пожалуйста, вашу карту медицинской страховки.
      - M: Gut. Vielen Dank!
        ru: Хорошо. Большое спасибо!
      - P: Gute Besserung, Herr Fernández. Bis später!
        ru: Выздоравливайте, господин Фернандес. До встречи!
  tipps:
    title: Gute Besserung!
    ru: Выздоравливай!
    place: Am Telefon
    people:
      A: { name: Dana, voice: Anna }
      M: { name: Mateo, voice: Reed }
    lines:
      - A: Hallo, Mateo! Du bist heute nicht im Kurs. Bist du krank?
        ru: Привет, Матео! Тебя сегодня нет на курсе. Ты заболел?
      - M: Ja, leider. Ich habe Fieber, und mein Hals tut weh.
        ru: Да, к сожалению. У меня температура, и болит горло.
      - A: Oh nein! Und was sagt der Arzt?
        ru: О нет! А что говорит врач?
      - M: Ich muss drei Tage im Bett bleiben. Und ich darf keinen Sport machen.
        ru: Мне нужно три дня лежать в постели. И спортом заниматься нельзя.
      - A: Oh, du Armer! Ruf bitte in der Praxis an! Und nimm deine Karte mit!
        ru: Ох, бедняга! Позвони, пожалуйста, в практику! И возьми свою карту!
      - M: Ja, danke für deine Hilfe!
        ru: Да, спасибо за помощь!
      - A: Elif und ich bringen morgen Suppe mit. Geht das?
        ru: Мы с Элиф завтра принесём суп. Так можно?
      - M: Ja, danke! Kommt um vier! Und bringt bitte auch Brot mit!
        ru: Да, спасибо! Приходите в четыре! И принесите, пожалуйста, ещё хлеб!
      - A: Brot, alles klar. Gute Besserung, Mateo!
        ru: Хлеб, понятно. Выздоравливай, Матео!

