id: stadt
order: 9
title: Wie komme ich zum Bahnhof?
ru: Город и транспорт
lede: >-
  Гости готовятся идти к клубу, а Дана учится разбираться в дороге: спрашивает путь к вокзалу
  перед поездкой в Любек, слушает смену пути и уточняет, как добраться к Матео в Holtenau. В
  игре нужно выполнить инструкции по учебной схеме, услышать окончательное решение и передать
  гостям точный маршрут.
goals:
  - "Спросить дорогу и понять ответ: прямо, налево, у светофора"
  - "Сказать, на чём, куда и откуда вы едете"
  - "Вежливо попросить или посоветовать — повелительным наклонением на Sie"
  - "Различать «дома» и «домой»: zu Hause и nach Hause"
  - "Понять объявление на вокзале и табличку на двери"
grammar:
  - "Предлоги с дательным: mit, zu, bei, von, aus, nach"
  - "zum, zur, beim, vom"
  - "Повелительное наклонение на Sie"
  - "zu Hause и nach Hause"
exam: [ hoeren-2, hoeren-1, lesen-3 ]

dialogues:
  weg:
    title: Wie komme ich zum Hauptbahnhof?
    ru: Как пройти к вокзалу?
    place: Kiel · условная учебная схема, не реальный маршрут
    people:
      A: { name: Dana, voice: Anna }
      P: { name: Kieler Passant, voice: Grandpa }
    lines:
      - A: Entschuldigung! Wie komme ich zum Hauptbahnhof?
        ru: Извините! Как мне пройти к главному вокзалу?
      - P: Zum Hauptbahnhof? Das ist nicht weit. Gehen Sie hier geradeaus.
        ru: К главному вокзалу? Это недалеко. Идите здесь прямо.
      - A: Geradeaus – und dann?
        ru: Прямо — а потом?
      - P: Dann gehen Sie an der Ampel links. Da sehen Sie schon den Bahnhof.
        ru: Потом у светофора налево. Там вы уже увидите вокзал.
      - A: Kann ich auch mit dem Bus fahren?
        ru: А можно поехать на автобусе?
      - P: Mit dem Bus geht es auch. Aber zu Fuß sind es nur zehn Minuten.
        ru: На автобусе тоже можно. Но пешком всего десять минут.
      - A: Dann gehe ich zu Fuß. Vielen Dank!
        ru: Тогда я пойду пешком. Большое спасибо!
      - P: Gern geschehen!
        ru: Не за что!
  abends:
    title: Bist du schon zu Hause?
    ru: Ты уже дома?
    place: Телефон · учебные времена и путь, не расписание
    people:
      M: { name: Mateo, voice: Reed }
      A: { name: Dana, voice: Anna }
    lines:
      - M: Hallo, Dana! Bist du schon zu Hause?
        ru: Привет, Дана! Ты уже дома?
      - A: Nein, ich bin noch in Lübeck, bei Mira.
        ru: Нет, я ещё в Любеке, у Миры.
      - M: Wann fährst du nach Hause?
        ru: Когда ты поедешь домой?
      - A: Mein Zug fährt um acht. Um zehn bin ich zu Hause.
        ru: Мой поезд в восемь. В десять я буду дома.
      - M: Morgen sind die Gäste bei mir in Holtenau. Kommst du auch?
        ru: Завтра гости будут у меня в Holtenau. Ты тоже придёшь?
      - A: Ja, gern! Wie komme ich zu dir?
        ru: Да, с удовольствием! Как мне добраться к тебе?
      - M: Du fährst mit dem Bus nach Holtenau. Von der Haltestelle sind es nur zwei Minuten.
        ru: Едешь на автобусе в Holtenau. От остановки всего две минуты.
      - A: Super! Dann bis morgen!
        ru: Супер! Тогда до завтра!
      - M: Bis morgen! Gute Fahrt nach Hause!
        ru: До завтра! Хорошей дороги домой!
  treffpunkt:
    title: Wo treffen wir uns?
    ru: Где встретимся?
    people:
      L:
        name: Elif
        voice: Flo
      T:
        name: Hauke
        voice: Rocko
    lines:
      - L: Hallo, Hauke! Wo treffen wir uns morgen? Am Bahnhof?
        ru: Привет, Хауке! Где мы встретимся завтра? У вокзала?
      - T: Am Bahnhof ist es so voll. Lieber vor dem Kino.
        ru: На вокзале так людно. Лучше перед кинотеатром.
      - L: Vor dem Kino? Gut. Und wann?
        ru: Перед кинотеатром? Хорошо. А когда?
      - T: Um halb sieben. Der Film fängt um sieben an.
        ru: В половине седьмого. Фильм начинается в семь.
      - L: Super. Ich komme mit dem Fahrrad. Bis morgen!
        ru: Супер. Я приеду на велосипеде. До завтра!

