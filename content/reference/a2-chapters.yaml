# Раскладка сезона A2 по главам (A2-PLOT.md): тема, ведущая линия, грамматика и новые слова главы.
# Слова — новые слова эталона A2 (start-deutsch-2.yaml: слова и группы, которых нет в эталоне A1) и слова A1
# со статусом «закрепит A2» (A1-INDEX.md). Каждое слово и каждый пункт грамматики A2 стоят ровно в одной главе:
# это проверяет scripts/a2-chapters.test.mjs. Тематические слова стоят в главе своей темы, общие (связки,
# наречия, частые глаголы) выравнивают главы по объёму; при написании главы их можно переставлять.

# Игры глав — мини-игры, которые стоят в главе хотя бы раз (A2-PLOT.md, «Частота механик»). Постоянные
# механики (речь, письмо, замок) стоят в каждой главе и в списке не повторяются, игры возвращения расставляет
# планировщик. Новые виды, которых ещё нет в движке, перечислены в newGames.

newGames:
  note: "телефонная заметка: вписать сведения (Hören 1)"
  negotiation: "договориться о совместном плане (Sprechen 3)"
  alternatives: "объявления, в одном случае «ничего не подходит» (Lesen 3)"
  labels: "ценники и этикетки: окончания прилагательных"
  workshop: "мастерская: что делается (Passiv)"

