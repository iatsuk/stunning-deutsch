# Переводы слов экзамена A1, которых нет ни в словаре уроков A1, ни в выражениях истории
# (src/story/data.ts). Справочник A1 (#/a1/reference) показывает их вместе с остальными словами.
# Ключ — слово так, как оно записано в эталоне start-deutsch-1.yaml; de — как его показать и озвучить,
# если ключ — основа с дефисом или одна форма из нескольких («jed-» → «jeder, jede, jedes»). pl — как у слов урока:
# множественное число существительного без артикля, «-» — его нет, «pl» — слово только во мн. ч.
# Слова строятся и озвучиваются как слова урока, но в игры и повторение не идут.
