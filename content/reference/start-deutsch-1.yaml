# Эталон A1 для индекса покрытия (A1-PLAN.md): Goethe-Zertifikat A1 / telc Start Deutsch 1.
# Только заголовочные слова и пункты перечня грамматики, без примеров из источника; сайт файл не читает.
# Словарь: Goethe-Institut, Start Deutsch 1, Wortliste (VS_02_280312), алфавитный список и группы.
# Грамматика: Prüfungsziele, Testbeschreibung (VS_08_190422), с. 100–106; пункты уроков A1 добавлены.
