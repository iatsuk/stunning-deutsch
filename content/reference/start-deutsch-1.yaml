# words — запись словаря: строка или { de, of — основная запись для производной, skip — причина
# пропуска, forms — формы, которые правила не порождают }. groups — тематические группы словаря.
# grammar — { id, group — раздел перечня, title, rules — фрагменты разбора, find — признаки в немецком тексте (регулярные
# выражения JavaScript, границы слов добавляются сами; @plurals — множественное слов уроков) }.

