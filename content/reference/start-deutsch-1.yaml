grammar:
  - id: praesens
    group: Глагол
    title: "Präsens, окончания по лицам"
    rules: [kennenlernen/endungen-1, kennenlernen/endungen-2, kennenlernen/endungen-3]
    find: ['(ich|du|er|sie|es|wir|ihr|Sie) [a-zäöüß]+(e|st|t|en)']
  - id: praesens-stamm
    group: Глагол
    title: "Präsens со сменой корня (e → i, a → ä)"
    find: ['fährt|fährst|isst|nimmt|nimmst|spricht|sprichst|liest|sieht|siehst|schläft|schläfst|gibt|gibst|hilft|hilfst|trifft|triffst|läuft|läufst|trägt|weiß|weißt|vergisst']
  - id: sein
    group: Глагол
    title: "sein"
    rules: [kennenlernen/endungen-2]
    find: ['bin|bist|ist|sind|seid']
  - id: haben
    group: Глагол
    title: "haben"
    rules: [zahlen/haben-1, zahlen/check-3]
    find: ['habe|hast|hat|habt']
  - id: trennbar
    group: Глагол
    title: "Отделяемые приставки и рамка предложения"
    rules: [tagesablauf/klammer-1, tagesablauf/klammer-2, tagesablauf/klammer-4]
    find:
      - '(stehe|stehst|steht|stehen|rufe|rufst|ruft|rufen|kaufe|kaufst|kauft|kaufen|fange|fängt|fangen|komme|kommst|kommt|kommen|mache|machst|macht|machen|räume|räumst|räumt|sehe|siehst|sieht|sehen|hole|holst|holt|holen|fahre|fährst|fährt|fahren|steige|steigst|steigt|steigen|nehme|nimmst|nimmt|nehmen|höre|hörst|hört|hören|gehe|gehst|geht|gehen|ziehe|ziehst|zieht|ziehen|packe|packt|rufe|bringe|bringt)[^.!?]{0,40} (auf|an|ein|mit|ab|aus|zu|zurück|fern|um|vor|los|weg)[.!?]'
      - '(auf|an|ein|mit|ab|aus|zurück|um|fern|vor|los|weg)ge[a-zäöü]+(t|en)'
  - id: perfekt-haben
    group: Глагол
    title: "Perfekt с haben"
    rules: [arbeit/perfekt-2, arbeit/perfekt-3, arbeit/perfekt-4, arbeit/perfekt-5]
    find: ['(habe|hast|hat|haben|habt)[^.!?]{0,40} [a-zäöü]*ge[a-zäöü]+(t|en)[.!?,]']
  - id: perfekt-sein
    group: Глагол
    title: "Perfekt с sein"
    rules: [reisen/angekommen-2, reisen/perfekt-1, reisen/perfekt-2, reisen/haben-sein-1]
    find: ['(bin|bist|ist|sind|seid)[^.!?]{0,40} (gefahren|gegangen|gekommen|geflogen|angekommen|abgefahren|geblieben|gelaufen|gewesen|passiert|aufgestanden|eingestiegen|ausgestiegen|umgestiegen|zurückgekommen|mitgekommen|gestorben|geschwommen|gesegelt|gewandert|losgefahren|weggefahren|umgezogen)']
  - id: war-hatte
    group: Глагол
    title: "Präteritum war и hatte"
    rules: [arbeit/war-hatte-1, arbeit/war-hatte-2]
    find: ['war|warst|waren|wart|hatte|hattest|hatten|hattet']
  - id: moechten
    group: Глагол
    title: "möchten"
    rules: [essen/moechten-1]
    find: ['möchte|möchtest|möchten|möchtet']
  - id: konj2-haette-wuerde
    group: Глагол
    title: "Ich hätte gern …, Ich würde gern … как готовые выражения"
    find: ['hätte|hättest|hätten|würde|würdest|würden|würdet']
  - id: koennen
    group: Глагол
    title: "können"
    rules: [freizeit/modal-1, freizeit/modal-2]
    find: ['kann|kannst|können|könnt']
  - id: wollen
    group: Глагол
    title: "wollen"
    rules: [freizeit/modal-1, freizeit/modal-2]
    find: ['will|willst|wollen|wollt']
  - id: muessen
