steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Kieler Woche закончилась. Дана, Матео, Элиф и Хауке начинают общий дневник поездок. Для
          первой записи нужно восстановить вчерашние события, проверить сообщение и понять, что
          уже организовано, а что ещё предстоит. Все нужные условия даны в сцене: знания
          географии, настоящих цен или расписаний не требуются. Сначала попробуйте понять,
          какого результата добиваются друзья, затем слушайте реплики. На новом уровне важно не
          только найти число или знакомое слово, но и связать несколько сведений."
        point: Новый дневник команды
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: В разговоре есть завершённые действия и незавершённое дело. *Aufgeräumt*, *eingekauft*,
          *sortiert* относятся к тому, что сделано; *noch nicht reserviert* — к тому, что ещё
          не сделано. Слушайте отрицание вместе с причастием. Ответ о возвращении гостей
          использует знакомое *sind … gekommen*. Новый сезон не требует заново угадывать
          биографии друзей.
        point: "Perfekt: приставки и последовательность"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Для дневника нужны действия с понятным результатом: прибраться, купить, отсортировать,
          позвонить, организовать. Слова *zuerst*, *dann*, *danach*, *zum Schluss* связывают
          события. Они не меняют форму причастия, но могут занять первую позицию: тогда личная
          форма глагола остаётся второй. В игре порядок событий понадобится для передачи ключа,
          а не для пересказа списка слов."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "Perfekt: приставки и последовательность"
    beats:
      - read: "У знакомого *aufräumen* приставка отделяется в настоящем времени: *Wir räumen auf*. В
          Perfekt она соединяется с причастием: *aufgeräumt*. Частица *ge* находится между
          приставкой и основой. Это та же модель, что у *angekommen* из A1, но вспомогательный
          глагол здесь *haben*: мы не перемещаемся в другое место."
        point: "Отделяемая приставка: auf + ge + räumt."
        set:
          view: table
          table: rule
          focus:
            - 0
      - read: "У *sortieren*, *organisieren*, *reservieren* причастие без *ge*: *sortiert*,
          *organisiert*, *reserviert*. Их легко узнать по окончанию инфинитива. Это не повод
          убирать *ge* у любого длинного слова: *eingekauft* строится иначе. Найдите на
          странице формы, с которыми можно подтвердить готовность, и формы с отрицанием."
        point: У глаголов на -ieren нет ge-.
        set:
          view: table
          table: rule
          focus:
            - 1
      - read: "У *bestätigen* приставка *be-* не отделяется; причастие — *bestätigt*. Из A1 знакомы
          *besuchen*, *bekommen*. Не нужно придумывать форму по длине слова: смотрите,
          отделяется ли приставка, и возвращайтесь к образцу. Подтверждение времени — отдельное
          действие: обсуждённый вариант ещё не становится договорённостью."
        point: "Неотделяемая приставка: bestätigt, без ge-."
        set:
          view: table
          table: rule
          focus:
            - 2
      - read: "Если *danach* стоит первым, за ним следует *haben*, затем *wir*, а причастие закрывает
          предложение. Такие слова помогают связать несколько коротких реплик в рассказ. Не
          перепутайте порядок слов с порядком событий: последовательность устанавливается по
          источнику, а не по тому, какое предложение прочитано первым."
        point: После Danach личная форма остаётся второй.
        set:
          view: table
          table: rule
          focus:
            - 3
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Сравните предложение с начальным временем. Сначала *Danach*, затем *haben*, середина
          *wir die Fahrt*, в конце *organisiert*. Вспомогательный глагол выражает лицо и число,
          причастие — действие. Уберите обстоятельство: получится *Wir haben die Fahrt
          organisiert*. Рамка сохраняется в обоих случаях."
        point: "*Danach haben wir die Fahrt organisiert.*"
        set:
          view: sentence
          rows:
            - de:
                - Danach
                - haben
                - wir die Fahrt
                - organisiert.
              ru: После этого мы организовали поездку.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Нужно ли ge- в причастии от reservieren?
        read: "Нет: *reserviert*. Окончание *-ieren* помогает узнать модель. Но *noch nicht reserviert*
          означает, что бронирования пока нет. Для итогового дневника важны и форма, и
          отрицание. Не отмечайте дело выполненным только потому, что видите причастие."
        point: "*reservieren → reserviert*, но *noch nicht* отменяет готовность."
        set:
          view: table
          table: rule
      - question: "Как сказать: «Потом мы позвонили гостям»?"
        read: "*Dann haben wir die Gäste angerufen.* *Haben* остаётся вторым, а *anrufen* превращается
          в *angerufen*. Если начать с *Wir*, получится *Wir haben dann die Gäste angerufen*.
          Оба порядка подходят; в игре специально заданное начальное слово помогает
          потренировать перестройку."
        point: "*Dann haben wir die Gäste angerufen.*"
        set:
          view: table
          table: rule
  - id: exam-note
    chapter: exam
    title: Telefonnotiz für Dana
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: note
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: note
        set:
          view: task
          task: note
          solved: true
