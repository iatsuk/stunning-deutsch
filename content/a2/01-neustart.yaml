id: a2-neustart
order: 1
title: Was haben wir schon organisiert?
ru: Новый дневник команды
lede: Kieler Woche закончилась. Дана, Матео, Элиф и Хауке начинают общий дневник поездок. Для
  первой записи нужно восстановить вчерашние события, проверить сообщение и понять, что уже
  организовано, а что ещё предстоит.
goals:
  - Восстановить последовательность событий по сообщениям
  - Узнать причастия с отделяемой приставкой и без ge-
  - Заполнить телефонную заметку после прослушивания
  - Рассказать о себе и о прошедшем дне
grammar:
  - "Perfekt: приставки и последовательность"
exam:
  - a2-hoeren-1
  - a2-lesen-2
  - a2-sprechen-1
  - a2-schreiben-1
dialogues:
  scene:
    title: Was haben wir schon organisiert?
    ru: Новый дневник команды
    place: Club auf der Kiellinie, Kiel · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - H: Die Kieler Woche ist zu Ende. Was haben wir gestern gemacht?
        ru: Кильская неделя закончилась. Что мы делали вчера?
      - D: Zuerst haben wir im Club aufgeräumt.
        ru: Сначала мы прибрались в клубе.
      - M: Dann habe ich Brot und Wasser eingekauft.
        ru: Потом я купил хлеб и воду.
      - E: Ich habe die Fotos sortiert. Die Tickets habe ich noch nicht reserviert.
        ru: Я рассортировала фотографии. Билеты я ещё не забронировала.
      - H: Habt ihr die Gäste angerufen?
        ru: Вы позвонили гостям?
      - D: Ja. Lucía und Diego sind gut nach Hause gekommen.
        ru: Да. Лусия и Диего хорошо добрались домой.
      - M: Und wer hat die neue Fahrt organisiert?
        ru: А кто организовал новую поездку?
      - E: Noch niemand. Wir können am Sonntag zusammen planen.
        ru: Пока никто. Можем вместе спланировать в воскресенье.
