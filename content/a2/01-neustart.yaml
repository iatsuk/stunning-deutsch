case:
  title: Der erste Eintrag
  ru: Первый отчёт
  intro: В дневнике оказались две версии сообщения. Установите, что подтверждено первоисточником.
    Вывод зависит от языка, а не от личности автора.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Zuerst haben wir aufgeräumt. Danach haben wir die Gäste angerufen.
          ru: Сначала мы прибрались. После этого позвонили гостям.
      question: Что было раньше?
      options:
        - Уборка
