case:
  title: Für wen ist das Ticket?
  ru: Кому нужен билет
  intro: В дневнике оказались две версии сообщения. Установите, что подтверждено первоисточником.
    Вывод зависит от языка, а не от личности автора.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Mateo braucht das Ticket. Ich gebe es ihm.
          ru: Матео нужен билет. Я даю его ему.
      question: Кто получатель?
      options:
        - Матео
        - Билет
        - Элиф
      answer: 0
      right: "*Ihm* заменяет названного Матео."
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die Gäste sind da. Wir bringen ihnen Wasser.
          ru: Гости здесь. Мы приносим им воду.
      question: Кого заменяет ihnen?
      options:
        - Одного Хауке
        - Гостей
        - Элиф
      answer: 1
      right: "*Ihnen* здесь дательный множественного числа."
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Elif bekommt die Kamera. Mateo bekommt das Ticket.
          ru: Элиф получает камеру. Матео получает билет.
      question: Можно поменять получателей без изменения смысла?
      options:
        - Да
        - Нет
        - Только если предмет женского рода
      answer: 1
      right: Род вещи не определяет её получателя.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Запись исправлена по источникам. В следующей главе команда воспользуется
    подтверждёнными сведениями для нового решения.
adventure:
  kind: sequence
  title: Передайте вещи адресатам
  intro: Перед поездкой в клубе лежат билеты, камера и ключи. Элиф готовит список, Дана раздаёт
    вещи, Матео помогает гостям. Чтобы ничего не потерять, нужно понять не только что передают,
    но и кому.
  ending: "Адресаты проверены: вещи переданы по сообщениям, а не по догадкам. В Плёне нужно будет
    разобраться, где встречаться и куда поставить сумки."
  challenges:
    - id: recipients
      kind: match
      title: Кому передать?
      intro: Сначала выберите предмет, затем получателя. Несколько вещей могут достаться одному
        человеку.
      mode: reading
      clue:
        task: note
      slots:
        - id: ticket
          label: Ticket
          answer: mateo
        - id: camera
          label: Kamera
          answer: elif
        - id: bag
          label: Tasche
          answer: elif
      options:
        - id: mateo
          label: Mateo
        - id: elif
          label: Elif
        - id: hauke
          label: Hauke
      success: Билет передан Матео, камера и сумка — Элиф.
      wrong: Сверьте все три предмета с сообщением.
    - id: request
      kind: order
      title: Попросите о помощи
      intro: "Обратитесь к одному другу: «Можешь мне помочь?»"
      label: Реплика для команды
      tokens:
        - Kannst
        - du mir
        - helfen?
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: water
      kind: select
      title: Помогите гостям
      intro: Выберите действие для гостей, не для Хауке.
      mode: reading
      clue:
        task: note
      options:
        - id: o0
          label: Ich bringe ihnen Wasser.
        - id: o1
          label: Ich gebe ihm den Schlüssel.
        - id: o2
          label: Ich bringe ihr die Kamera.
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: ticket
      kind: order
      title: Назовите получателя билета
      intro: "Скажите: «Я даю ему билет»."
      label: Реплика для команды
      tokens:
        - Ich
        - gebe
        - ihm
        - das Ticket.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: key
      kind: select
      title: Не ищите уже переданное
      intro: Ключ не нужно передавать повторно. Кто уже его получил?
      mode: reading
      clue:
        task: note
      options:
        - id: o0
          label: Hauke
        - id: o1
          label: Dana
        - id: o2
          label: Die Gäste
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
