spy:
  - de: "Kannst du mir helfen?"
    wrong: "Kannst du mich helfen?"
    why: "*helfen* требует дательного падежа: *mir*."
  - de: "Ich gebe ihm das Ticket."
    wrong: "Ich gebe ihn das Ticket."
    why: "Кому дать? Дательный падеж: *ihm*."
  - de: "Wir helfen ihnen."
    wrong: "Wir helfen sie."
    why: "После *helfen* нужен дательный падеж: *ihnen*."
  - de: "Gib mir bitte die Liste!"
    wrong: "Gib mich bitte die Liste!"
    why: "Кому дать? Дательный падеж: *mir*."

