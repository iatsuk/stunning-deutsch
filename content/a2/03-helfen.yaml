id: a2-helfen
order: 3
title: Kannst du mir helfen?
ru: Кому нужна вещь
lede: Перед поездкой в клубе лежат билеты, камера и ключи. Элиф готовит список, Дана раздаёт
  вещи, Матео помогает гостям. Чтобы ничего не потерять, нужно понять не только что передают,
  но и кому.
goals:
  - Понять адресата действия по местоимению
  - Попросить о помощи и отреагировать
  - Различить предмет в Akkusativ и получателя в Dativ
  - Сопоставить людей и сведения из разговора
grammar:
