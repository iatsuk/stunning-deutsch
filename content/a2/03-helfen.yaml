steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Перед поездкой в клубе лежат билеты, камера и ключи. Элиф готовит список, Дана раздаёт
          вещи, Матео помогает гостям. Чтобы ничего не потерять, нужно понять не только что
          передают, но и кому. Все нужные условия даны в сцене: знания географии, настоящих цен
          или расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Кому нужна вещь
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "*Ihm* отсылает к Матео, *ihr* — к Элиф, *ihnen* — к гостям. Получатель может повторяться
          у нескольких предметов. Вопрос *Wer bekommt die Kamera?* помогает установить адресата
          по имени, а следующая реплика уже использует местоимение. Не определяйте получателя
          по роду вещи: женское *die Kamera* не делает владельца женщиной — это разные связи."
        point: "Dativ: mir, dir, ihm, ihr, uns, euch, ihnen"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: Для действия нужны глаголы *helfen*, *geben*, *bringen*, *bekommen*. Они описывают разные
          стороны передачи. В просьбе *Gib mir die Liste* получатель — говорящий, а список —
          предмет. *Die Gäste* во множественном числе заменяются *ihnen*. В игре сначала
          установите, кто назван в сообщении, затем найдите подходящее местоимение и действие.
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "Dativ: mir, dir, ihm, ihr, uns, euch, ihnen"
    beats:
      - read: "После *helfen* адресат стоит в дательном: *mir helfen*, *dir helfen*. Это не форма
          *mich*, знакомая по Akkusativ. Смысл просьбы — кому нужна помощь. Местоимение
          позволяет не повторять имя в соседних репликах, но сначала должно быть понятно, о ком
          идёт речь. Если адресат неясен, уточните имя."
        point: "helfen требует Dativ: mir, dir, ihm, ihr."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "У *geben* часто есть два участника: то, что дают, и человек, которому дают. В нашем
          примере билет передают Матео: *ihm*. Билет остаётся предметом в Akkusativ. Для первых
          шагов используйте порядок «получатель — предмет»: он помогает удерживать обе связи и
          не менять их местами по смыслу."
        point: ihm — получатель; das Ticket — предмет.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Нескольким гостям соответствуют *ihnen*. Когда говорящий включает себя в группу,
          используется *uns*. Когда обращается к нескольким друзьям — *euch*. Вежливое *Ihnen*
          пишется с большой буквы. Не смешивайте его с обычным *ihnen*: контекст разговора и
          обращение помогают различить формы."
        point: Гости → ihnen; команда → uns / euch.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Вопрос начинается с *Kannst*, после него *du*, затем адресат *mir*, в конце *helfen*.
          Инфинитив сохраняет рамку модального глагола из A1. Новая часть здесь — падеж
          получателя. Можно ответить *Ja, gern* и уточнить задачу: это реакция на просьбу, а не
          автоматическое обещание передать любую вещь."
        point: "*Kannst du mir helfen?* — просьба о помощи."
        set:
          view: sentence
          rows:
            - de:
                - ""
                - Kannst
                - du mir
                - helfen?
              ru: Можешь мне помочь?
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Матео нужен билет. Кого заменяет ihm?
        read: В этом контексте *ihm* заменяет Матео. Род местоимения связан с человеком, а не с
          билетом. Сначала найдите предыдущую реплику, где адресат назван прямо. Если бы билет
          передавали Элиф, было бы *ihr das Ticket*. Сам билет от этого не меняет род.
        point: Получатель определяется по контексту, не по предмету.
        set:
          view: table
          table: rule
      - question: Как попросить друга помочь вам?
        read: "*Kannst du mir bitte helfen?* Получатель помощи — вы, поэтому *mir*. Если помощь нужна
          нескольким людям вместе с вами, используйте *uns*. В ответе можно уточнить, что
          требуется. Это безопаснее, чем угадывать действие по одному знакомому слову."
        point: "*mir* — мне; *uns* — нам."
        set:
          view: table
          table: rule
  - id: exam-matching
    chapter: exam
    title: Wer bekommt was?
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: matching
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: matching
        set:
          view: task
          task: matching
          solved: true
  - id: exam-talk
    chapter: exam
    title: Hilfe im Alltag
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: talk
          reveal: 0
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
