  - a2-sprechen-2
  - a2-lesen-2
dialogues:
  scene:
    title: Kannst du mir helfen?
    ru: Кому нужна вещь
    place: Kiel · клуб перед поездкой · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - E: Dana, kannst du mir bitte helfen?
        ru: Дана, можешь мне помочь?
      - D: Ja, gern. Was brauchst du?
        ru: Да, охотно. Что тебе нужно?
      - E: Gib mir bitte die Liste. Mateo braucht sein Ticket.
        ru: Дай мне список. Матео нужен его билет.
      - D: Ich gebe ihm das Ticket. Und wer bekommt die Kamera?
        ru: Я дам ему билет. А кто получит камеру?
      - M: Die Kamera ist für Elif. Bring ihr bitte auch die Tasche.
        ru: Камера для Элиф. Принеси ей ещё и сумку.
      - H: Die Gäste brauchen Wasser. Können wir ihnen helfen?
        ru: Гостям нужна вода. Можем им помочь?
      - M: Ja. Ich bringe ihnen zwei Flaschen.
        ru: Да. Я принесу им две бутылки.
      - D: Danke! Dann fehlt uns nur noch der Schlüssel.
        ru: Спасибо! Тогда нам не хватает только ключа.
  assignment:
    title: Die Verteilung
    place: Kiel · отдельное распределение перед отправлением
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
    lines:
      - D: Mateo, wer bekommt die Liste und die Kamera?
        ru: Матео, кто получает список и камеру?
      - M: Elif bekommt beides. Ich brauche nur mein Ticket.
        ru: Элиф получает и то и другое. Мне нужен только мой билет.
      - D: Und was bekommen die Gäste?
        ru: А что получают гости?
      - M: Sie bekommen Wasser. Hauke hat den Schlüssel schon.
        ru: Они получают воду. Ключ у Хауке уже есть.
      - D: Gut. Dann nehme ich das Fotoalbum.
        ru: Хорошо. Тогда я возьму фотоальбом.
