      b) Stadtcafé: Frühstück von 8 bis 11 Uhr, ruhiger Innenraum, 8 Euro.
      c) Abendcafé: ab 17 Uhr, Musik, kein Frühstück.
      d) Stadtspaziergang: kostenlos, Treffpunkt 14 Uhr.
      x) Keine passende Anzeige.
