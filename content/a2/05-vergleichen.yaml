id: a2-vergleichen
order: 5
title: Welcher Plan passt besser?
ru: Сравниваем варианты
lede: Для поездки в Любек друзья сравнивают кафе, музей и прогулку. Нужно учитывать цену,
  расстояние и интересы, а затем согласовать подходящий план. Все предложения и суммы в уроке
  вымышлены.
goals:
  - Сравнить два варианта и назвать отличие
  - Понять превосходную степень частых слов
  - Выбрать несколько допустимых планов по условиям
  - Сопоставить объявление и запрос, включая отсутствие подходящего
grammar:
  - "Komparativ: günstiger als, so … wie, am liebsten"
exam:
  - a2-lesen-3
  - a2-hoeren-2
  - a2-sprechen-3
dialogues:
  scene:
    title: Welcher Plan passt besser?
    ru: Сравниваем варианты
    place: Lübeck · вымышленные предложения · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Welches Café ist günstiger?
        ru: Какое кафе дешевле?
      - M: Café B ist günstiger als Café A.
        ru: Кафе B дешевле кафе A.
      - E: Ist es auch näher am Museum?
        ru: А оно ближе к музею?
      - H: Ja. Café A ist weiter weg, aber genauso ruhig wie Café B.
        ru: Да. Кафе A дальше, но такое же тихое, как B.
      - D: Ich möchte am liebsten ins Museum.
        ru: Я больше всего хочу в музей.
      - M: Mit Café B kostet unser Plan zwanzig Euro. Das passt.
        ru: С кафе B наш план стоит двадцать евро. Подходит.
      - E: Ein Spaziergang ist noch günstiger.
        ru: Прогулка ещё дешевле.
      - H: Beides ist möglich. Was gefällt euch besser?
        ru: Возможны оба варианта. Что вам нравится больше?
