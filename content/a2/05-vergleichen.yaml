    kind: message
    part: a2-lesen-3
    title: Angebote für den Ausflug
    text: "Lernangebote: Café A kostet 10 Euro, Café B 8 Euro. Beide sind ruhig. Café B ist näher
      am Museum. Museum: Eintritt 12 Euro. Spaziergang: kostenlos. Wählen Sie ein Café und eine
      Aktivität. Budget: maximal 20 Euro."
  offers15:
    kind: message
    part: a2-lesen-3
    title: Neuer Tag, anderes Budget
    text: "Café A: 10 Euro. Café B: 8 Euro. Museum: 12 Euro. Spaziergang: kostenlos. Wählen Sie
      genau ein Café und eine Aktivität. Heute haben Sie maximal 15 Euro."
