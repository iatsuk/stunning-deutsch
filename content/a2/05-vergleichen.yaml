          - c
          - d
          - x
        answers:
          - d
      - prompt: Eine Ausstellung ansehen
        options:
          - a
          - b
          - c
          - d
          - x
        answers:
          - a
      - prompt: Abends Musik hören
        options:
          - a
          - b
          - c
          - d
          - x
        answers:
          - c
      - prompt: Um 6 Uhr morgens im Café frühstücken
        options:
          - a
          - b
          - c
          - d
          - x
