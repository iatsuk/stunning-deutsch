steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Для поездки в Любек друзья сравнивают кафе, музей и прогулку. Нужно учитывать цену,
          расстояние и интересы, а затем согласовать подходящий план. Все предложения и суммы в
          уроке вымышлены. Все нужные условия даны в сцене: знания географии, настоящих цен или
          расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Сравниваем варианты
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Разница в цене не делает один план обязательным для всех. Дана предпочитает музей, но
          прогулка тоже может подходить бюджету. В сообщениях сравниваются конкретные
          параметры: дешевле, ближе, дальше, такой же тихий. Для решения сначала проверяют
          жёсткие условия, затем обсуждают предпочтения. В игре несколько сочетаний будут
          признаны верными."
        point: "Komparativ: günstiger als, so … wie, am liebsten"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "В поездке полезно сравнивать *günstig*, *nah*, *weit*, *ruhig*, а не только говорить
          «хорошо» и «плохо». Формы *besser* и *lieber* уже частично знакомы из A1. Здесь они
          помогают объяснить выбор. Название кафе само по себе ничего не сообщает о качестве:
          вся нужная информация дана в учебных карточках."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "Komparativ: günstiger als, so … wie, am liebsten"
    beats:
      - read: "К частому прилагательному добавляется *-er*: *günstig → günstiger*. Если называем второй
          объект сравнения, используется *als*. Не смешивайте *als* и *wie*: они выражают
          разные отношения. Цена B ниже цены A, поэтому здесь есть различие. Фраза описывает
          только цену, а не все достоинства места."
        point: "Сравнительная степень: -er + als."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "При равной степени признака используем *so … wie* или *genauso … wie*. Оба кафе могут
          быть одинаково тихими, но иметь разные цены и расстояния. Для игры это отдельные
          условия. Не переносите равенство одного свойства на все остальные: одинаково тихо не
          означает одинаково дорого."
        point: "Равенство: so / genauso … wie."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Некоторые частые слова имеют особые формы. У *gut* это *besser*, у *nah* — *näher*, у
          *gern* — *lieber*. Превосходная форма в наших примерах: *am besten*, *am nächsten*,
          *am liebsten*. Лучше употреблять их в выборе конкретного действия, чем запоминать без
          контекста. Таблица остаётся опорой во время сравнения."
        point: Частые формы сравнения меняются заметнее.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: В сравнении *Café B ist günstiger als Café A* личная форма *ist* сохраняет вторую
          позицию. Степень сравнения меняет прилагательное и связь между объектами, но не
          переносит глагол в конец. Если добавляется причина с *weil*, у неё будет собственный
          порядок. Сначала потренируем простое сравнение, затем объединим его с выбором.
        point: "*Café B ist günstiger als Café A.*"
        set:
          view: sentence
          rows:
            - de:
                - Café B
                - ist
                - günstiger als Café A.
                - ""
              ru: Кафе B дешевле кафе A.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Для равенства нужен als или wie?
        read: "*Wie*: *genauso ruhig wie*. *Als* используется после сравнительной степени, когда
          выражается различие: *günstiger als*. Проверьте, есть ли в тексте равенство или
          преимущество по конкретному параметру. Уверенная интонация собеседника не заменяет
          эту связь."
        point: "Различие: *-er als*; равенство: *so … wie*."
        set:
          view: table
          table: rule
      - question: Всегда ли самый дешёвый план — единственный верный?
        read: Нет. Если несколько планов удовлетворяют бюджету и другим обязательным условиям, каждый
          допустим. Предпочтение музея или прогулки обсуждается отдельно. В игре требуется
          доказать соответствие условиям, а не угадать любимый вариант составителя.
        point: Проверяйте условия, затем сравнивайте предпочтения.
        set:
          view: table
          table: rule
  - id: exam-offers
    chapter: exam
    title: Angebote für den Ausflug
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: offers
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: offers
        set:
          view: task
          task: offers
          solved: true
