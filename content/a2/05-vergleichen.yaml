  rule:
    title: "Komparativ: günstiger als, so … wie, am liebsten"
    ru: Опора для решения
    head:
      - Beispiel
      - Смысл и форма
    ruCols:
      - 1
    rows:
      - - Café B ist günstiger als Café A.
        - "Сравнительная степень: -er + als."
