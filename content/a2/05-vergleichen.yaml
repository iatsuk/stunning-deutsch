adventure:
  kind: sequence
  title: Выберите план по условиям
  intro: Для поездки в Любек друзья сравнивают кафе, музей и прогулку. Нужно учитывать цену,
    расстояние и интересы, а затем согласовать подходящий план. Все предложения и суммы в уроке
    вымышлены.
  ending: Выбор объяснён сравнением и подтверждён условиями. В следующем уроке планы придётся
    согласовать с курсом и рабочими сменами.
  challenges:
    - id: cheaper
      kind: select
      title: Сравните цену кафе
      intro: Какое кафе дешевле по объявлению?
      mode: reading
      clue:
        task: offers
      options:
        - id: o0
          label: Café A
        - id: o1
          label: Café B
        - id: o2
          label: Beide kosten gleich viel.
      answer:
        - o1
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: compare
      kind: order
      title: Объясните разницу
      intro: «Кафе B дешевле кафе A».
      label: Реплика для команды
      tokens:
        - Café B
        - ist
        - günstiger als
        - Café A.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: budget
      kind: pack
      title: Соберите подходящий план
      intro: Выберите ровно одно кафе и одно занятие. Общая цена не выше 20 евро. Подходит несколько
        сочетаний; игра принимает каждое.
      mode: reading
      clue:
        task: offers
      options: &a1
        - id: a
          label: Café A · 10 €
        - id: b
          label: Café B · 8 €
        - id: museum
          label: Museum · 12 €
        - id: walk
          label: Spaziergang · 0 €
      answer: &a2
        - a
        - walk
      alternatives:
        - - b
          - walk
        - - b
          - museum
      success: "Соблюдены бюджет и состав плана: одно кафе и одно занятие. Подходящий вариант не
        обязан совпадать с выбором автора."
      wrong: Нужны ровно одно кафе и одно занятие; сумма должна укладываться в 20 евро.
      variants:
        - id: budget-fifteen
          kind: pack
          title: Соберите подходящий план
          intro: "Новый день, новый бюджет: не выше 15 евро. Выберите ровно одно кафе и одно занятие."
          mode: reading
          clue:
            task: offers15
          options: *a1
          answer: *a2
          alternatives:
            - - b
              - walk
          success: "Соблюдены бюджет и состав плана: одно кафе и одно занятие. Подходящий вариант не
            обязан совпадать с выбором автора."
          wrong: При бюджете 15 евро музей вместе с любым из кафе уже не подходит.
    - id: equal
      kind: select
      title: Что у кафе одинаково?
      intro: Не переносите одинаковое качество на цену.
      mode: reading
      clue:
        task: offers
      options:
        - id: o0
          label: Beide sind ruhig.
        - id: o1
          label: Beide kosten 8 Euro.
        - id: o2
          label: Beide sind gleich weit weg.
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: no-match
      kind: select
      title: Не выбирайте заведомо неподходящее
      intro: Гости хотят завтрак в шесть утра. Найдите подходящее объявление или отметьте его
        отсутствие.
      mode: reading
      clue:
        task: ads
      options:
        - id: o0
          label: a
        - id: o1
          label: b
        - id: o2
          label: x
      answer:
        - o2
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
