steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "В Плёне друзья готовят место для пикника у воды. На условной схеме нужно найти встречу,
          поставить вещи и объяснить, где они теперь находятся. Знание настоящей карты не
          требуется: все ориентиры даны в сообщениях. Все нужные условия даны в сцене: знания
          географии, настоящих цен или расписаний не требуются. Сначала попробуйте понять,
          какого результата добиваются друзья, затем слушайте реплики. На новом уровне важно не
          только найти число или знакомое слово, но и связать несколько сведений."
        point: Место и направление
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Предмет может быть неподвижен или перемещаться к новому месту. *Auf den Tisch*
          описывает, куда ставят сумку; *auf dem Tisch* — где лежит камера. Одного наличия
          движения недостаточно: прогулка внутри парка тоже может отвечать на *Wo?*. В этой
          теме решает вопрос к месту, а не правило «любой глагол движения требует Akkusativ»."
        point: Wo + Dativ, Wohin + Akkusativ
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "*Stellen* и *legen* обозначают размещение, *stehen* и *liegen* — положение. Сумку можно
          поставить, билет — положить. Сначала поймите, о каком действии просит сообщение.
          Потом выберите форму артикля. Учебный указатель помогает искать место по функции,
          даже если формулировка вопроса не повторяет подпись дословно."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: Wo + Dativ, Wohin + Akkusativ
    beats:
      - read: "Если спрашиваем, где находится вещь, после *auf* используем дательный падеж: *auf dem
          Tisch*. Это знакомая модель из A1. Слово *liegen* описывает положение камеры. Чтобы
          найти предмет, не нужно заново перемещать его. В сообщении важно отличить текущее
          место от инструкции, которую ещё предстоит выполнить."
        point: Где? → auf dem Tisch, Dativ.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Когда сумку ставят на стол, возникает новое место назначения: *Wohin?*. У мужского рода
          *der Tisch* становится *den Tisch*. Смысл не сводится к движению рук: немецкая форма
          показывает, какое место становится результатом. Сравните команду и отчёт после
          выполнения, чтобы не перепутать действие с положением."
        point: Куда? → auf den Tisch, Akkusativ.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: У женского рода направление сохраняет форму *die*, а место выражается через *der*. После
          выполнения просьбы можно сообщить *Die Tickets sind in der Tasche*. В обоих
          предложениях участвуют те же билеты и сумка, но вопросы разные. Смена артикля
          помогает прочитать этап действия.
        point: Куда? in die Tasche; где? in der Tasche.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "*An* работает по той же схеме. В нашем примере сначала идём к месту, потом находимся
          там. Слияние *am* означает *an dem*. Другие предлоги этой группы — *neben*, *unter*,
          *vor*, *hinter*, *zwischen*, *über*. Не учите их как случайный список: используйте
          для поиска и размещения на понятной схеме."
        point: К озеру → an den See; у озера → am See.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Сначала прочитайте инструкцию: *Wir legen die Tickets in die Tasche*. Вторая фраза
          описывает результат: *Jetzt sind die Tickets in der Tasche*. Артикль меняется, потому
          что вопрос изменился с «куда?» на «где?». В игре нужно выбрать нужное сообщение для
          текущего этапа, а не переставлять одну букву без понимания."
        point: "*in die Tasche* → после действия *in der Tasche*."
        set:
          view: sentence
          rows:
            - de:
                - Jetzt
                - sind
                - die Tickets in der Tasche.
                - ""
              ru: Теперь билеты в сумке.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Камера уже на столе. Нужен den или dem?
        read: "*Auf dem Tisch*: камера уже находится там, вопрос *Wo?*. Для просьбы положить её на стол
          понадобилось бы *auf den Tisch*. Не ориентируйтесь только на слово «стол»:
          установите, сообщает ли реплика положение или новое место назначения."
        point: "*Wo? auf dem Tisch*; *Wohin? auf den Tisch*."
        set:
          view: table
          table: rule
      - question: Всегда ли движение означает Akkusativ после in?
        read: Нет. Важно направление к новому месту или нахождение внутри него. *Wir gehen im Park
          spazieren* описывает прогулку в парке, а *Wir gehen in den Park* — вход в парк. В
          первом случае вопрос о месте прогулки, во втором — о том, куда идут.
        point: Вопрос к месту важнее самого наличия движения.
        set:
          view: table
          table: rule
  - id: exam-directory
    chapter: exam
    title: Wegweiser im Gästehaus
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: directory
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
