adventure:
  kind: sequence
  title: Подготовьте место встречи
  intro: "В Плёне друзья готовят место для пикника у воды. На условной схеме нужно найти встречу,
    поставить вещи и объяснить, где они теперь находятся. Знание настоящей карты не требуется:
    все ориентиры даны в сообщениях."
  ending: Вещи размещены, их новое положение описано, место встречи найдено по схеме. Следующая
    задача — сравнить несколько вариантов поездки.
  challenges:
    - id: meeting
      kind: select
      title: Найдите встречу по схеме
      intro: Клуб прислал условные ориентиры.
      mode: reading
      clue:
        task: map
      options:
        - id: o0
          label: neben dem Museum
        - id: o1
          label: im Museum
        - id: o2
          label: hinter dem Bahnhof
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: objects
      kind: match
      title: Выполните инструкции с вещами
      intro: Сопоставьте каждую вещь с указанным местом. Для сумки дана команда, для камеры — уже
        известное положение.
      mode: reading
      clue:
        task: map
      slots:
        - id: bag
          label: Tasche · stellen
          answer: under
        - id: camera
          label: Kamera · liegt
          answer: table
        - id: tickets
          label: Tickets · legen
          answer: inside
      options:
        - id: under
          label: unter den Tisch
        - id: table
          label: auf dem Tisch
        - id: inside
          label: in die Tasche
        - id: wrong
          label: auf den Tisch
      success: Команда на размещение и описание положения не перепутаны.
      wrong: Сумка — под стол, камера уже на столе, билеты — в сумку.
    - id: report
      kind: order
      title: Сообщите результат
      intro: "Скажите: «Теперь билеты в сумке»."
      label: Реплика для команды
      tokens:
        - Jetzt
        - sind
        - die Tickets
        - in der Tasche.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: key
      kind: select
      title: Найдите оставленный ключ
      intro: Выберите текущее место ключа, не команду переместить его.
      mode: reading
      clue:
        task: map
      options:
        - id: o0
          label: in der Jacke
        - id: o1
          label: in die Jacke
        - id: o2
          label: neben das Museum
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: lake
      kind: order
      title: Объясните, куда идут дальше
      intro: «Потом мы идём к озеру».
      label: Реплика для команды
      tokens:
        - Danach
        - gehen
        - wir
        - an den See.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
