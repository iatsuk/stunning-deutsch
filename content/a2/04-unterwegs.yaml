order: 4
title: Wo liegt die Tasche? Wohin kommt sie?
ru: Место и направление
lede: "В Плёне друзья готовят место для пикника у воды. На условной схеме нужно найти встречу,
  поставить вещи и объяснить, где они теперь находятся. Знание настоящей карты не требуется:
  все ориентиры даны в сообщениях."
