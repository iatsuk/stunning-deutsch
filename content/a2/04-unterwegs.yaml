    lines:
      - D: Wo treffen wir uns in Plön?
        ru: Где мы встречаемся в Плёне?
      - H: Auf unserem Lernplan liegt der Treffpunkt neben dem Museum.
        ru: На нашей учебной схеме встреча рядом с музеем.
      - M: Ich stelle die Tasche auf den Tisch.
        ru: Я ставлю сумку на стол.
      - E: Die Kamera liegt schon auf dem Tisch.
        ru: Камера уже лежит на столе.
      - D: Wohin legen wir die Tickets?
        ru: Куда положим билеты?
      - H: Legt sie bitte in die Tasche. Der Schlüssel bleibt in der Jacke.
        ru: Положите их в сумку. Ключ остаётся в куртке.
      - M: Gut. Jetzt sind die Tickets in der Tasche.
        ru: Хорошо. Теперь билеты в сумке.
      - E: Dann gehen wir an den See. Am See machen wir eine Pause.
        ru: Тогда идём к озеру. У озера сделаем перерыв.
