steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Во время поездки в Гамбург Матео получает синюю куртку другого размера. Нужно сравнить
          подтверждение заказа и вещь, описать проблему и подобрать подходящий вариант. Цены и
          действия магазина вымышлены; речь идёт о языковой задаче. Все нужные условия даны в
          сцене: знания географии, настоящих цен или расписаний не требуются. Сначала
          попробуйте понять, какого результата добиваются друзья, затем слушайте реплики. На
          новом уровне важно не только найти число или знакомое слово, но и связать несколько
          сведений."
        point: Объясняем проблему с покупкой
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Матео не говорит просто «всё плохо»: он называет проверяемое расхождение — заказан M,
          получен S. Затем просит проверить подтверждение и уточняет нужные условия. *Zu klein*
          означает, что размер не подходит, а *groß genug* — что его достаточно для цели. В
          игре несколько моделей могут удовлетворять условиям; цена сама по себе не заменяет
          размер."
        point: welch-; zu klein, groß genug; вежливое уточнение
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "*Bestellen* — заказать, *bekommen* — получить. Эти действия относятся к разным этапам,
          поэтому важно сверить оба. *Die Größe* и *die Farbe* помогают назвать нужную вещь без
          длинного описания. *Anprobieren* возвращает отделяемую приставку: *Ich probiere die
          Jacke an*. Вместо обвинения собеседника используем конкретную просьбу проверить
          данные."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: welch-; zu klein, groß genug; вежливое уточнение
    beats:
      - read: "В вопросе о предмете покупки мужской род получает *welchen*, женский — *welche*, средний
          — *welches*. Это знакомая модель выбора из A1, теперь она нужна для уточнения
          проблемы. Вопрос должен указывать на нужную категорию: размер, цвет или конкретную
          вещь. Не отвечайте только цветом, если спросили размер."
        point: welch- согласуется с родом и падежом.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "*Zu klein* — не просто «маленькая», а «слишком маленькая», то есть не подходит.
          Дательный *mir* сообщает, кому именно. Это не универсальная оценка вещи: другому
          человеку она может подойти. В разговоре назовите критерий и предложите проверяемое
          уточнение вместо общего недовольства."
        point: "zu + прилагательное: слишком для цели."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "После прилагательного используем *groß genug*, *warm genug*. Перед существительным —
          *genug Zeit*, *genug Platz*. Позиция помогает понять, что именно достаточно. В игре
          условия заданы явно: размер M и цена не выше бюджета. «Достаточно большой» не
          означает автоматически «самый большой из всех»."
        point: genug после прилагательного, перед существительным.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "В просьбе *Könnten Sie die Bestellung bitte prüfen?* личная форма стоит первой,
          инфинитив *prüfen* — в конце. Эта вежливая модель уже знакома по гостинице. Меняется
          предмет просьбы: теперь проверяем заказ. Повтор полезен именно потому, что готовый
          способ уточнения переносится в новую бытовую ситуацию."
        point: "*Könnten Sie die Bestellung bitte prüfen?*"
        set:
          view: sentence
          rows:
            - de:
                - ""
                - Könnten
                - Sie die Bestellung bitte
                - prüfen?
              ru: Не могли бы вы проверить заказ?
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Zu klein означает просто маленький?
        read: "Нет. *Zu klein* обозначает, что размера недостаточно для нужной цели или человека.
          *Klein* без *zu* просто описывает признак. Чтобы попросить замену или проверку,
          полезно указать своё условие: заказан M, а на полученной вещи написано S."
        point: "*zu klein* — слишком мал, не подходит по условию."
        set:
          view: table
          table: rule
      - question: Можно ли выбрать любую самую дешёвую куртку?
        read: Нет, сначала должны совпасть размер, цвет и другие обязательные условия. Только после
          этого сравниваем цену. Дешёвый вариант S не подходит запросу M. Если два варианта M
          укладываются в бюджет, оба допустимы — это не угадывание единственного ответа автора.
        point: Сначала обязательные условия, затем предпочтения.
        set:
          view: table
          table: rule
  - id: exam-order
    chapter: exam
    title: Bestätigung und Lieferung
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: order
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
