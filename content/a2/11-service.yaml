case:
  title: Bestellt M, geliefert S
  ru: Сверка дневника
  intro: В записи о покупке цвет совпадает, но размер — нет. Установите реальную проблему и не
    заменяйте её догадкой о цене.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: "Bestellt: blau, M. Geliefert: blau, S."
          ru: "Заказано: синий, M. Получено: синий, S."
      question: Что не совпало?
      options:
        - Цвет
        - Размер
        - И цвет, и размер
      answer: 1
      right: Синий цвет совпал, размер отличается.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: "Modell A: M, 45 Euro. Modell B: M, 55 Euro. Budget: 60 Euro."
          ru: "Модель A: M, 45 евро. Модель B: M, 55 евро. Бюджет 60."
      question: Какие модели укладываются в условие?
      options:
        - Обе
        - Только самая дешёвая
        - Ни одна
      answer: 0
      right: Обе имеют нужный размер и не превышают бюджет.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Diese Jacke ist mir zu klein. Könnten Sie die Bestellung prüfen?
          ru: Эта куртка мне слишком мала. Не могли бы вы проверить заказ?
      question: О чём просит покупатель?
      options:
        - Проверить заказ
        - Забронировать номер
        - Купить ещё две куртки
      answer: 0
      right: Запрос касается проверки конкретного заказа; другие действия не названы.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
