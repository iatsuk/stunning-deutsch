spy:
  - de: "Welchen Stuhl nehmen Sie?"
    wrong: "Welcher Stuhl nehmen Sie?"
    why: "*Stuhl* здесь дополнение, мужской род: *welchen*."
  - de: "Welche Jacke brauchen Sie?"
    wrong: "Welches Jacke brauchen Sie?"
    why: "*die Jacke* — женский род: *welche*."
  - de: "Die Jacke ist groß genug."
    wrong: "Die Jacke ist genug groß."
    why: "*genug* ставится после прилагательного: *groß genug*."
  - de: "Diese Jacke ist mir zu klein."
    wrong: "Diese Jacke ist mich zu klein."
    why: "Кому мала? Дательный падеж: *mir*."

