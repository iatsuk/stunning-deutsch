id: a2-service
order: 11
title: Diese Jacke ist mir zu klein.
ru: Объясняем проблему с покупкой
lede: Во время поездки в Гамбург Матео получает синюю куртку другого размера. Нужно сравнить
  подтверждение заказа и вещь, описать проблему и подобрать подходящий вариант. Цены и действия
  магазина вымышлены; речь идёт о языковой задаче.
goals:
  - Точно назвать расхождение между заказом и вещью
  - Использовать welchen, welche, welches в знакомых падежах
  - Различить zu klein и groß genug
  - Вежливо попросить проверить заказ
grammar:
  - welch-; zu klein, groß genug; вежливое уточнение
exam:
  - a2-lesen-2
  - a2-lesen-3
  - a2-sprechen-2
dialogues:
  scene:
    title: Diese Jacke ist mir zu klein.
    ru: Объясняем проблему с покупкой
    place: Hamburg · вымышленный магазин · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      K:
        name: Frau Schulz
        voice: Sandy
    lines:
      - M: Guten Tag. Ich habe eine blaue Jacke in Größe M bestellt.
        ru: Добрый день. Я заказал синюю куртку размера M.
      - K: Welche Jacke haben Sie bekommen?
        ru: Какую куртку вы получили?
      - M: Diese hier ist Größe S. Sie ist mir zu klein.
        ru: Вот эта размера S. Она мне слишком мала.
      - K: Haben Sie die Bestätigung dabei?
        ru: У вас с собой есть подтверждение?
      - M: Ja. Könnten Sie die Bestellung bitte prüfen?
        ru: Да. Не могли бы вы проверить заказ?
      - K: Gern. Welche Größe brauchen Sie?
        ru: Охотно. Какой размер вам нужен?
      - M: Größe M. Die Jacke soll groß genug und nicht zu teuer sein.
        ru: Размер M. Куртка должна быть достаточно большой и не слишком дорогой.
      - K: Wir haben zwei Modelle in M. Möchten Sie sie anprobieren?
        ru: У нас есть две модели M. Хотите их примерить?
