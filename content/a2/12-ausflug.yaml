      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: time-meanings
      kind: match
      title: Разнесите три временных смысла
      intro: Одно число может отвечать на разные вопросы. Сопоставьте целые выражения.
      mode: reading
