tasks:
  article:
    kind: worksheet
    part: a2-lesen-2
    format: article
    title: Haithabu früher und heute
    text: Haithabu liegt in Busdorf bei Schleswig. Früher war Haithabu ein wichtiger Handelsplatz
      mit einem Hafen. Heute gibt es dort ein Museum und rekonstruierte Häuser. Die Häuser
      zeigen einen Teil des früheren Lebens. Haithabu und das Danewerk gehören seit 2018 zum
      UNESCO-Welterbe. Die Gruppe plant ihren Besuch seit Montag. Ihre Zeiten im Lernplan sind
      Beispiele, keine Öffnungszeiten.
    questions:
      - prompt: Haithabu liegt bei Schleswig.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Früher gab es dort einen Handelsplatz.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Die heutigen Häuser sind alle unveränderte Originalhäuser.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Seit 2018 gehören Haithabu und Danewerk zum Welterbe.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Die Zeiten der Gruppe sind offizielle Öffnungszeiten.
        options:
          - richtig
          - falsch
        answers:
          - falsch
  directory:
    kind: worksheet
    part: a2-lesen-1
    format: directory
    title: Übungswegweiser · kein Gebäudeplan
    text: |-
      Lernbereich A: Information, Tickets, Treffpunkt.
      Lernbereich B: Ausstellung, Lesetexte, Karten.
      Lernbereich C: Modelle der Häuser, Werkzeuge.
      Lernbereich D: Pause, Getränke, Sitzplätze.
    questions:
      - prompt: Eine Frage zum Ticket stellen
        options:
          - A
          - B
          - Anderer Bereich
        answers:
          - A
      - prompt: Karten und Lesetexte ansehen
        options:
          - A
          - B
          - Anderer Bereich
        answers:
          - B
      - prompt: Ein Hausmodell suchen
        options:
          - A
          - B
          - Anderer Bereich
        answers:
          - Anderer Bereich
      - prompt: Getränke für die Pause finden
        options:
          - A
          - B
          - Anderer Bereich
        answers:
          - Anderer Bereich
      - prompt: Die Gruppe am Treffpunkt suchen
        options:
          - A
          - B
          - Anderer Bereich
        answers:
          - A
  plan:
    kind: message
    part: a2-lesen-2
    title: Unser Lernplan
    from: Elif
    text: "Seit Montag planen wir die Fahrt. Vor zwei Wochen haben wir die Idee besprochen.
      Lernplan: 10–12 Uhr Ausstellung, 12–13 Uhr draußen. Um 13 Uhr treffen wir uns wieder. Das
      ist unser eigener Plan, nicht das Programm des Museums."
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Команда готовит поездку в Хайтабу рядом со Шлезвигом. В коротком тексте есть история
          торгового поселения, музей и реконструированные дома. Нужно отделить события прошлого
          от того, что продолжается сейчас, и составить свой учебный план посещения. Все нужные
          условия даны в сцене: знания географии, настоящих цен или расписаний не требуются.
          Сначала попробуйте понять, какого результата добиваются друзья, затем слушайте
          реплики. На новом уровне важно не только найти число или знакомое слово, но и связать
          несколько сведений."
        point: Поездка в Хайтабу
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "*Vor zwei Wochen* указывает на завершённый момент в прошлом: тогда друзья впервые
          заговорили о поездке. *Seit Montag planen wir* сообщает, что работа началась в
          понедельник и продолжается. Исторические сведения относятся к Хайтабу; часы посещения
          — к отдельному учебному плану команды, а не к официальным часам работы музея."
        point: vor и seit; длительность и продолжающееся действие
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Морская тема здесь связана с обычным посещением музея: порт, торговля, выставка, дома и
          время прогулки. *Der Hafen* знаком по Килю, а *der Handelsplatz* объясняет прошлое
          места. Для решения задач не нужно знать историю заранее: прочитайте предъявленный
          текст, затем найдите точное подтверждение ответа."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: vor и seit; длительность и продолжающееся действие
    beats:
      - read: "*Vor zwei Wochen* отвечает, сколько времени отделяет нас от события. В нашем сообщении
          разговор уже произошёл, поэтому используется Perfekt. Это не обещание провести две
          недели в музее и не дата начала продолжающегося действия. Удерживайте вопрос: когда
          произошло, с какого времени продолжается или как долго запланировано."
        point: "vor + срок: насколько давно произошло событие."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "С *seit* продолжающееся действие обычно выражаем настоящим временем: *Seit Montag planen
          wir*. По-русски тоже можно сказать «планируем с понедельника», но легко по привычке
          выбрать немецкое прошедшее. Проверяйте, продолжается ли действие в момент сообщения.
          Само слово *seit* не означает, что работа закончена."
        point: "seit: началось раньше и продолжается сейчас."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: Сравните *seit einer Stunde*, *vor einer Woche*, *seit einem Jahr*. Здесь нужен дательный
          падеж. Число сообщает длительность, но предлог меняет связь со временем. В игре вы
          сопоставите сообщение о прошедшем событии и продолжающемся состоянии, а не будете
          выбирать падеж без смыслового вопроса.
        point: После seit и vor в этих временных группах — Dativ.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Два часа в учебном плане — отведённое время на выставку. Это не «два часа назад» и не
          «уже два часа». Отсутствие *vor* и *seit* важно так же, как наличие предлога. Не
          переносите эти числа в реальное расписание музея: для задачи используем только
          собственный план группы."
        point: Длительность плана не равна сроку начала.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "В начале стоит *Seit Montag*, затем личная форма *planen*, после неё *wir*. Настоящее
          время подчёркивает продолжающуюся работу. Сравните с *Vor zwei Wochen haben wir
          gesprochen*: там появляется рамка Perfekt и завершённое событие. Начальное
          обстоятельство в обоих случаях занимает первую позицию, глагол — вторую."
        point: "*Seit Montag planen wir die Fahrt.*"
        set:
          view: sentence
          rows:
            - de:
                - Seit Montag
                - planen
                - wir die Fahrt.
                - ""
              ru: С понедельника мы планируем поездку.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Seit Montag planen wir — работа уже закончена?
        read: "Нет. Фраза сообщает о начавшемся раньше и продолжающемся планировании. Чтобы подтвердить
          завершение, понадобится отдельное сообщение о результате. В дневнике отмечайте
          процесс и выполненное действие раздельно: иначе команда может принять ещё обсуждаемый
          вариант за готовую бронь."
        point: "*Seit* задаёт начало продолжающегося состояния или действия."
        set:
          view: table
          table: rule
      - question: Vor zwei Wochen — это на две недели или две недели назад?
        read: "Две недели назад. Для длительности поездки нужен другой контекст, например *zwei Wochen
          Urlaub*. В этой теме полезно каждый раз задавать один из трёх вопросов: когда
          произошло, с какого времени продолжается, сколько времени отведено. Предлог помогает
          выбрать нужную связь."
        point: "*vor* — назад; *seit* — начиная с, до сих пор."
        set:
          view: table
          table: rule
  - id: exam-article
    chapter: exam
    title: Haithabu früher und heute
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: article
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
