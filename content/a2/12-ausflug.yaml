adventure:
  kind: sequence
  title: Соберите посещение из разных времён
  intro: Команда готовит поездку в Хайтабу рядом со Шлезвигом. В коротком тексте есть история
    торгового поселения, музей и реконструированные дома. Нужно отделить события прошлого от
    того, что продолжается сейчас, и составить свой учебный план посещения.
  ending: История места, продолжающееся планирование и часы группы разделены. Дневник готов к
    новой встрече во Фленсбурге, где понадобится уточнять ещё не известные сведения.
  challenges:
    - id: history
      kind: select
      title: Найдите подтверждённый факт
      intro: Прочитайте текст, не опираясь на прежнее знание истории.
      mode: reading
