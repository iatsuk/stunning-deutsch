id: a2-ausflug
order: 12
title: Seit Montag planen wir den Ausflug.
ru: Поездка в Хайтабу
lede: Команда готовит поездку в Хайтабу рядом со Шлезвигом. В коротком тексте есть история
  торгового поселения, музей и реконструированные дома. Нужно отделить события прошлого от
  того, что продолжается сейчас, и составить свой учебный план посещения.
goals:
  - Различить когда-то раньше и с какого-то времени до сих пор
  - Использовать seit с настоящим временем
  - Прочитать информационный текст и условный указатель
  - Согласовать длительность двух частей посещения
grammar:
  - vor и seit; длительность и продолжающееся действие
exam:
  - a2-lesen-2
  - a2-lesen-1
dialogues:
  scene:
    title: Seit Montag planen wir den Ausflug.
    ru: Поездка в Хайтабу
    place: Busdorf bei Schleswig · Haithabu · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Seit Montag planen wir unseren Ausflug nach Haithabu.
        ru: С понедельника мы планируем поездку в Хайтабу.
      - M: Vor zwei Wochen haben wir zum ersten Mal darüber gesprochen.
        ru: Две недели назад мы впервые об этом говорили.
      - E: Was war dort früher?
        ru: Что там было раньше?
      - H: Haithabu war ein Handelsplatz mit einem Hafen.
        ru: Хайтабу было торговым поселением с портом.
      - D: Heute gibt es dort ein Museum und rekonstruierte Häuser.
        ru: Сегодня там есть музей и реконструированные дома.
      - M: Wie lange bleiben wir nach unserem Lernplan dort?
        ru: Сколько мы там пробудем по нашему учебному плану?
      - E: Zwei Stunden für die Ausstellung und danach eine Stunde draußen.
        ru: Два часа на выставку, потом час снаружи.
      - H: Gut. Seit gestern haben wir auch die Liste für den Ausflug.
        ru: Хорошо. Со вчерашнего дня у нас есть и список для поездки.
