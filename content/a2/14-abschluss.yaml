case:
  title: Der letzte Eintrag
  ru: Сверка дневника
  intro: "Перед завершением дневника проверьте три утверждения: день, запасной вариант и открытый
    вопрос."
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Am Samstag muss Mateo arbeiten. Am Sonntag hat er frei.
          ru: В субботу Матео работает, в воскресенье свободен.
      question: Какой день подходит его условию?
      options:
        - Суббота
        - Воскресенье
        - Ни один
      answer: 1
      right: Воскресенье названо свободным днём.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wenn es regnet, besuchen wir das Museum. Die Zeit bleibt gleich.
          ru: Если дождь, посетим музей. Время остаётся прежним.
      question: Что меняется?
      options:
        - Занятие
        - Время встречи
        - День недели
      answer: 0
      right: Условие меняет занятие, время явно сохранено.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
