tasks:
  plans:
    kind: message
    part: a2-lesen-2
    title: Drei Lernpläne für Sonntag
    text: "Alle können am Sonntag ab 11 Uhr. Budget: höchstens 20 Euro pro Person. Elif möchte
      höchstens zwei Stunden wandern. A: Beginn 11 Uhr, Wanderung 2 Stunden, 18 Euro. B: Beginn
      12 Uhr, Wanderung 1 Stunde, 20 Euro. C: Beginn 10 Uhr, Wanderung 3 Stunden, 12 Euro. Wenn
      es regnet, besucht die Gruppe statt der Wanderung ein Lernmuseum. Zeit und Preis bleiben
      gleich."
  radio:
    kind: worksheet
    part: a2-hoeren-2
    format: radio
    title: Fünf Nachrichten zum Tagesplan
    recordings:
      - text: Am Sonntag regnet es in unserem Lerngebiet. Am Nachmittag bleibt es auch nass.
      - text: Der Bus zum Treffpunkt fährt heute von Platz B, nicht von Platz A.
      - text: Das Lernmuseum öffnet am Sonntag um elf Uhr. Die Cafeteria öffnet erst um zwölf.
      - text: Im Lerncafé sind heute nur draußen Plätze frei. Drinnen ist alles besetzt.
      - text: Die Rückfahrt der Lerngruppe ist um siebzehn Uhr. Bitte seien Sie fünf Minuten früher am
          Bus.
    questions:
      - prompt: Wie ist das Wetter?
        options:
          - regnerisch
          - trocken
          - heiß
        answers:
          - regnerisch
      - prompt: Wo fährt der Bus ab?
        options:
          - Platz A
          - Platz B
          - Platz C
        answers:
          - Platz B
      - prompt: Wann öffnet das Museum?
        options:
          - 10 Uhr
          - 11 Uhr
          - 12 Uhr
        answers:
          - 11 Uhr
      - prompt: Wo sind Plätze frei?
        options:
          - drinnen
          - draußen
          - nirgends
        answers:
          - draußen
      - prompt: Wann ist die Rückfahrt?
        options:
          - 16 Uhr
          - 17 Uhr
          - 18 Uhr
        answers:
          - 17 Uhr
  article:
    kind: worksheet
    part: a2-lesen-2
    format: article
    title: Ein Eintrag zum Abschluss
    text: Seit Montag plant die Gruppe ihre letzte Fahrt im August. Am Samstag arbeitet Mateo. Die
      Gruppe hat Sonntag gewählt, weil Mateo dann frei hat. Hauke kann ab elf Uhr. Elif möchte
      nicht länger als zwei Stunden wandern. Bei Regen besucht die Gruppe ein Lernmuseum. Dana
      weiß noch nicht, ob im Café Plätze frei sind. Am Abend möchten alle den letzten Eintrag
      im Küstenlogbuch schreiben.
    questions:
      - prompt: Die Gruppe hat Sonntag gewählt.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Mateo hat am Samstag frei.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Hauke kann schon um zehn Uhr.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Bei Regen ist ein Museum geplant.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Dana hat die Plätze im Café schon bestätigt.
        options:
          - richtig
          - falsch
        answers:
          - falsch
  letter:
    kind: message
    part: a2-schreiben-2
    title: Die letzte Einladung
    text: Schreiben Sie an eine Freundin oder einen Freund.
    situation: Sie planen einen gemeinsamen Ausflug. Schreiben Sie ungefähr 40 Wörter. Wählen Sie
      drei von vier Punkten. Schreiben Sie eine Begrüßung und einen Gruß.
    choose: 3
    points:
      - Wohin und wann?
      - Warum dieser Ausflug?
      - Was bei Regen?
      - Was mitbringen?
    sample:
      - Liebe Mia, wir fahren am Sonntag in die Lüneburger Heide. Wir treffen uns um elf Uhr.
        Ich freue mich auf den Ausflug, weil wir zusammen Zeit haben. Wenn es regnet, besuchen
        wir ein Museum. Kommst du mit? Viele Grüße, Dana
  pair:
    kind: card
    part: a2-sprechen-3
    title: Gemeinsam entscheiden
    theme: Ausflug planen
    word: Tag – Uhrzeit – Preis – Plan bei Regen
    situation: "Person A: Sonntag ab 11 Uhr, Budget 20 Euro. Person B: höchstens zwei Stunden
      wandern, bei Regen lieber Museum. Machen Sie Vorschläge, fragen Sie nach und bestätigen
      Sie einen gemeinsamen Plan."
    sample:
      - Passt Sonntag um elf Uhr für dich?
      - Ja, aber ich möchte höchstens zwei Stunden wandern.
      - Wenn es regnet, gehen wir ins Museum.
      - Abgemacht. Wir treffen uns um elf Uhr.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "В конце августа команда заканчивает Küstenlogbuch. Для последней поездки в Люнебургскую
          пустошь нужно совместить время, бюджет и интересы. Теперь читатель сам собирает
          решение из нескольких источников. Даты, дорога, цены и погода в заданиях вымышлены.
          Все нужные условия даны в сцене: знания географии, настоящих цен или расписаний не
          требуются. Сначала попробуйте понять, какого результата добиваются друзья, затем
          слушайте реплики. На новом уровне важно не только найти число или знакомое слово, но
          и связать несколько сведений."
        point: Завершаем общий дневник
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Последняя тема не вводит большой новый блок грамматики. В разговоре встречаются *seit*,
          модальный глагол, сравнение, *wenn* и вопрос с *ob*. Каждая форма выполняет знакомую
          работу: назвать начало, ограничение, условие или неизвестное. Сначала составьте общее
          решение, затем отдельно отметьте сведения, которые ещё нужно подтвердить."
        point: "Повтор: причины, условия, уточнение и совместный план"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "В дневнике полезны выражения *gemeinsam entscheiden*, *einen Vorschlag machen*,
          *bestätigen*. Не обязательно запоминать их списком: используйте одно, когда
          предлагаете план, второе — когда сравниваете варианты, третье — когда фиксируете
          ответ. *Noch offen* означает, что вопрос пока не решён, а не что место обязательно
          открыто для посетителей."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "Повтор: причины, условия, уточнение и совместный план"
    beats:
      - read: "С *weil* личный глагол остаётся в конце. Воскресенье подходит Матео, потому что он
          свободен. Этого факта ещё недостаточно для всех: нужно проверить время Хауке,
          длительность прогулки для Элиф и общий бюджет. Объяснение одного предпочтения не
          подтверждает согласие всей команды."
        point: Причина объясняет выбор, а не заменяет условие.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: После придаточной части с *wenn* главная начинается с глагола. Здесь дождь меняет
          занятие, но сам по себе не переносит день и время встречи. Когда приходит новое
          сообщение, изменяйте только то, к чему оно относится. Если перенос не назван, не
          добавляйте его от себя.
        point: Условие меняет часть плана.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: Вопрос с *ob* сохраняет глагол в конце и запрашивает ответ да или нет. В итоговой заметке
          отделите подтверждённые данные от открытого вопроса. Команда согласовала прогулку, но
          наличие мест в кафе ещё нужно узнать. Это полезнее уверенной записи, основанной
          только на предположении.
        point: Вопрос остаётся открытым до ответа.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Вы уже умеете сказать и причину, и условие. Соберите знакомую рамку *Wenn es regnet,
          gehen wir ins Museum*. Личная форма придаточного *regnet* стоит перед запятой, а
          *gehen* сразу после неё. Произнесите собственный вариант с кафе вместо музея и
          проверьте, что порядок слов сохранился.
        point: "*Wenn es regnet, gehen wir ins Museum.*"
        set:
          view: sentence
          rows:
            - de:
                - Wenn es regnet,
                - gehen
                - wir ins Museum.
                - ""
              ru: Если будет дождь, мы пойдём в музей.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Один дешёвый вариант автоматически подходит всей команде?
        read: "Нет. Сначала проверяем обязательные ограничения: день, начало, длительность и
          максимальную цену. После этого можно выбирать по предпочтениям. В нашей задаче два
          варианта проходят все условия. Игра принимает любой из них: решение не должно
          зависеть от того, какой вариант больше нравится автору."
        point: Любой вариант, соблюдающий все условия, допустим.
        set:
          view: table
          table: rule
      - question: Дождь обязательно переносит встречу на другое время?
        read: Нет. В сообщении сказано, что меняется занятие. Время осталось прежним, пока отдельная
          реплика не сообщает перенос. Так же вопрос о местах в кафе не доказывает наличие
          мест. В итоговом дневнике каждое утверждение должно иметь свой источник.
        point: Изменяйте только подтверждённую часть плана.
        set:
          view: table
          table: rule
  - id: exam-plans
    chapter: exam
    title: Drei Lernpläne für Sonntag
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: plans
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
