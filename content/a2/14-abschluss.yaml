    самостоятельную работу.
adventure:
  kind: sequence
  title: Согласуйте последнюю запись Küstenlogbuch
  intro: В конце августа команда заканчивает Küstenlogbuch. Для последней поездки в Люнебургскую
    пустошь нужно совместить время, бюджет и интересы. Теперь читатель сам собирает решение из
    нескольких источников. Даты, дорога, цены и погода в заданиях вымышлены.
  ending: "Общий дневник закончен: у команды есть проверенный план, запасной вариант и список
    открытых вопросов. Следующий шаг — самостоятельные задания A2: понять новый текст, написать
    своё сообщение и договориться без готовых реплик."
  challenges:
    - id: plan
      kind: select
      title: Выберите общий план
      intro: Проверьте день, начало, длительность и бюджет. Два решения допустимы.
      mode: reading
      clue:
        task: plans
      options:
        - id: a
          label: Plan A · 11 Uhr · 2 Stunden · 18 €
        - id: b
          label: Plan B · 12 Uhr · 1 Stunde · 20 €
        - id: c
          label: Plan C · 10 Uhr · 3 Stunden · 12 €
      answer:
        - a
      alternatives:
        - - b
      success: Все ограничения соблюдены. A и B подходят по исходным данным.
      wrong: Дешёвый C нарушает и начало после 11, и предел двух часов.
    - id: weather
      kind: order
      title: Объясните запасной вариант
      intro: Соберите условие с главным предложением.
      label: Реплика для команды
      tokens:
        - Wenn es regnet,
        - gehen
        - wir
        - ins Museum.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: negotiate
      kind: negotiation
      title: Проверьте выбранный план с Хауке
      intro: В предыдущем шаге подошли A и B. Уточните, соблюдает ли выбранный вами вариант
        ограничение Хауке.
      start: start
      success: "Хауке подтвердил: оба допустимых варианта учитывают его время."
      wrong: Учтите ограничение собеседника.
      nodes:
        - id: start
          text: "Hauke: Ich kann erst ab elf Uhr. Wann treffen wir uns?"
          choices:
            - label: Ab elf Uhr passen beide Pläne.
              next: weather
              feedback: Ограничение учтено.
            - label: Wir treffen uns um zehn Uhr.
              next: retry
              feedback: Хауке не может в десять.
        - id: retry
          text: "Hauke: Um zehn geht es nicht. Erst ab elf."
          choices:
            - label: Dann nehmen wir A oder B, beide beginnen ab elf.
              next: weather
              feedback: Время исправлено.
        - id: weather
          text: "Hauke: Und wenn es regnet?"
          choices:
            - label: Dann gehen wir ins Museum. Die Zeit bleibt gleich.
              next: end
              feedback: Изменилось занятие, время сохранено.
        - id: end
          text: "Hauke: Gut, A oder B passt für mich!"
          terminal: true
          choices: []
    - id: list
      kind: match
      title: Разделите подтверждённое и неизвестное
      intro: Сопоставьте записи дневника с их статусом.
      mode: reading
      clue:
        task: article
      slots:
        - id: day
          label: Sonntag gewählt
          answer: yes
        - id: cafe
          label: Plätze im Café
          answer: open
        - id: rain
          label: Museum bei Regen
          answer: condition
      options:
        - id: yes
          label: день подтверждён
        - id: open
          label: пока нужно уточнить
        - id: condition
          label: запасной вариант при условии
      success: В дневнике нет выдуманного подтверждения кафе.
      wrong: Вопрос о местах ещё не получил ответа.
    - id: final
      kind: select
      title: Оставьте точную запись
      intro: Завершите дневник тем, что действительно известно.
      mode: reading
      clue:
        task: article
      options:
        - id: o0
          label: Sonntag ist gewählt; die Plätze im Café sind noch nicht bestätigt.
        - id: o1
          label: Alle Plätze im Café sind schon bestätigt.
        - id: o2
          label: Mateo hat am Samstag frei.
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
