id: a2-abschluss
order: 14
title: Welcher Plan passt für uns alle?
ru: Завершаем общий дневник
lede: В конце августа команда заканчивает Küstenlogbuch. Для последней поездки в Люнебургскую
  пустошь нужно совместить время, бюджет и интересы. Теперь читатель сам собирает решение из
  нескольких источников. Даты, дорога, цены и погода в заданиях вымышлены.
goals:
  - Сопоставить ограничения нескольких людей
  - Предложить и подтвердить общий план
  - Обновить решение после сообщения о погоде
  - Самостоятельно написать приглашение и обсудить поездку
grammar:
  - "Повтор: причины, условия, уточнение и совместный план"
exam:
  - a2-lesen-2
  - a2-hoeren-2
  - a2-schreiben-2
  - a2-sprechen-3
dialogues:
  scene:
    title: Welcher Plan passt für uns alle?
    ru: Завершаем общий дневник
    place: Kiel · план поездки в Lüneburger Heide · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Wir planen seit Montag unsere letzte Fahrt im August.
        ru: Мы с понедельника планируем последнюю поездку в августе.
      - M: Am Sonntag habe ich frei. Am Samstag muss ich arbeiten.
        ru: В воскресенье я свободен. В субботу мне нужно работать.
      - E: Ich möchte wandern, aber nicht länger als zwei Stunden.
        ru: Я хочу погулять пешком, но не дольше двух часов.
      - H: Ich kann am Sonntag ab elf Uhr. Wo treffen wir uns?
        ru: В воскресенье я могу с одиннадцати. Где встречаемся?
      - D: Unser Lernplan A beginnt um elf Uhr. Er kostet achtzehn Euro pro Person.
        ru: Наш учебный план A начинается в одиннадцать. Он стоит восемнадцать евро с человека.
      - E: Das passt. Wenn es regnet, gehen wir ins Lernmuseum.
        ru: Подходит. Если будет дождь, пойдём в учебный музей.
      - M: Können wir dort auch etwas essen?
        ru: Мы можем там и поесть?
      - D: Ja. Ich frage noch, ob im Café Plätze frei sind.
        ru: Да. Я ещё спрошу, есть ли свободные места в кафе.
