steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Дана звонит в вымышленную гостевую гостиницу в Бюзуме. Друзьям нужны два одноместных
          номера на две ночи без завтрака. Предложение нужно не просто услышать, а уточнить и
          получить подтверждение. Все нужные условия даны в сцене: знания географии, настоящих
          цен или расписаний не требуются. Сначала попробуйте понять, какого результата
          добиваются друзья, затем слушайте реплики. На новом уровне важно не только найти
          число или знакомое слово, но и связать несколько сведений."
        point: Уточняем бронирование
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: Дана использует вежливые формы, но сохраняет конкретную цель каждой просьбы. Сначала тип
          комнат, затем даты и завтрак, потом итоговая цена и подтверждение. Фраза *Ich würde
          gern reservieren* ещё не означает, что бронь оформлена. В игре нужно дойти до явного
          подтверждения условий и не заменить итоговую сумму ценой одной ночи.
        point: "Вежливые просьбы: könnte, hätte gern, würde gern"
        set:
          reveal: 9
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "*Pro Nacht* относится к одной ночи; *insgesamt* — к общей сумме. *Bestätigung* сообщает
          о подтверждении, *Anfrage* — о запросе. Слова похожи по ситуации, но описывают разные
          этапы. Уточнение по электронной почте помогает сверить даты и количество комнат; это
          учебная задача, а не настоящее бронирование."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "Вежливые просьбы: könnte, hätte gern, würde gern"
    beats:
      - read: "Форма *könnten* делает вопрос мягче. Инфинитив *nennen* остаётся в конце, как после
          знакомого модального глагола. Для этого урока достаточно готовой модели *Könnten Sie
          …?*: мы не изучаем всю систему нереальных условий. Содержимое просьбы должно быть
          конкретным — цену, дату или подтверждение нужно назвать прямо."
        point: Könnten Sie …? — вежливая просьба.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Для вежливого желания используем *würde gern*. В конце находится действие:
          *reservieren*. Это вариант просьбы, а не указание на уже оформленную бронь. После
          него собеседник должен проверить доступность и условия. В задании отделяйте намерение
          от ответа гостиницы: иначе в итоговую карточку попадёт ещё неподтверждённое
          предложение."
        point: würde gern + инфинитив в конце.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "После *hätte gern* можно назвать то, что хотите получить: *eine Bestätigung*. Нового
          инфинитива здесь не требуется. Это близко к готовому *Ich möchte …*, знакомому из A1.
          Сравните мягкость формы и конкретность содержания. Вежливость не должна скрывать
          важные детали: письменно повторите даты и количество комнат."
        point: hätte gern + предмет просьбы.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: В вопросе сначала *Könnten*, затем *Sie*, середина *mir die Buchung bitte*, в конце
          *bestätigen*. Дательный *mir* уже знаком по третьему уроку. Новая вежливая форма не
          меняет адресата просьбы и не отменяет рамку. Попробуйте заменить только действие на
          *den Preis nennen*, сохранив порядок.
        point: "*Könnten Sie mir die Buchung bestätigen?*"
        set:
          view: sentence
          rows:
            - de:
                - ""
                - Könnten
                - Sie mir die Buchung bitte
                - bestätigen?
              ru: Не могли бы вы подтвердить мне бронирование?
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Ich würde gern reservieren — это уже подтверждённая бронь?
        read: Нет, это желание забронировать. Подтверждение должно прийти от гостиницы с проверенными
          условиями. Не отмечайте действие завершённым раньше ответа. В игре последняя реплика
          просит повторить даты и тип комнат, чтобы стороны согласились именно с одним и тем же
          вариантом.
        point: Запрос и подтверждение — разные этапы.
        set:
          view: table
          table: rule
      - question: 45 евро за ночь — это итог для двух комнат на две ночи?
        read: "Нет. В источнике 45 евро относится к одной комнате и одной ночи. Для двух комнат на две
          ночи сотрудница назвала 180 евро. Здесь не нужно угадывать дополнительные сборы:
          решение опирается только на явно заданные учебные условия."
        point: "*pro Zimmer und Nacht* отличается от *insgesamt*."
        set:
          view: table
          table: rule
  - id: exam-offer
    chapter: exam
    title: Ihr Angebot
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: offer
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: offer
        set:
          view: task
          task: offer
          solved: true
