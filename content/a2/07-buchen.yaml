adventure:
  kind: sequence
  title: Доведите запрос до подтверждения
  intro: Дана звонит в вымышленную гостевую гостиницу в Бюзуме. Друзьям нужны два одноместных
    номера на две ночи без завтрака. Предложение нужно не просто услышать, а уточнить и
    получить подтверждение.
  ending: Количество комнат, даты, завтрак и цена согласованы. Подтверждение можно внести в
    дневник. Теперь друзья подготовят комнату для следующего гостя в Киле.
  challenges:
    - id: room
      kind: select
      title: Сверьте тип комнат
      intro: Не замените два одноместных одной двухместной комнатой.
      mode: reading
      clue:
        task: offer
      options:
        - id: o0
          label: zwei Einzelzimmer
        - id: o1
          label: ein Doppelzimmer
        - id: o2
          label: zwei Doppelzimmer
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: price
      kind: note
      title: Запишите итоговую цену
      intro: Прослушайте ответ гостиницы. Запишите общую сумму, а не стоимость одной комнаты за ночь.
      clue:
        task: phone
      fields:
        - label: Gesamtpreis
          answers:
            - "180"
            - 180 Euro
        - label: Anreise ab
          answers:
            - 15:00
            - 15 Uhr
            - fünfzehn Uhr
      success: Итог — 180 евро, приезд с 15:00.
      wrong: Общая сумма 180 евро, заселение с пятнадцати часов.
    - id: polite
      kind: order
      title: Уточните подтверждение вежливо
      intro: Обратитесь к сотруднице на Sie.
      label: Реплика для команды
      tokens:
        - Könnten
        - Sie mir
        - die Buchung
        - bestätigen?
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: confirm
      kind: negotiation
      title: Подтвердите согласованные условия
      intro: Сотрудница предлагает завтрак отдельно. Сохраните исходный запрос и подтвердите даты.
      start: a
      nodes:
        - id: a
          text: "Martens: Möchten Sie Frühstück dazu?"
          choices:
            - label: Nein, danke. Ohne Frühstück, bitte.
              next: b
              feedback: Сохранено условие без завтрака.
            - label: Ist das Frühstück schon im Preis?
              next: c
              feedback: Вы уточнили состав цены.
        - id: c
          text: "Martens: Nein, das Frühstück kostet extra."
          choices:
            - label: Dann möchten wir kein Frühstück.
              next: b
              feedback: Вы вернулись к согласованному условию.
        - id: b
          text: "Martens: Zwei Einzelzimmer vom 14. bis 16. Juli, insgesamt 180 Euro. Stimmt das?"
          choices:
            - label: Ja, das stimmt. Bitte schicken Sie die Bestätigung.
              next: end
              feedback: Условия явно подтверждены.
        - id: end
          text: "Martens: Gern. Ihre Buchung ist bestätigt."
          terminal: true
          choices: []
      success: Вы подтвердили именно предложенные даты и комнаты, без добавленного завтрака.
      wrong: Уточните условия до согласия.
    - id: dates
      kind: select
      title: Внесите правильный период
      intro: Выберите даты из предложения, не другие планы команды.
      mode: reading
      clue:
        task: offer
      options:
        - id: o0
          label: 14.–16. Juli
        - id: o1
          label: 14.–16. August
        - id: o2
          label: 16.–18. Juli
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
