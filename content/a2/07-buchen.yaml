id: a2-buchen
order: 7
title: Könnten Sie die Buchung bitte bestätigen?
ru: Уточняем бронирование
lede: Дана звонит в вымышленную гостевую гостиницу в Бюзуме. Друзьям нужны два одноместных
  номера на две ночи без завтрака. Предложение нужно не просто услышать, а уточнить и получить
  подтверждение.
goals:
  - Вежливо уточнить цену и условия
  - Отделить просьбу от подтверждённой брони
  - Заполнить анкету и телефонную заметку
  - Найти объявление под заданные условия
grammar:
  - "Вежливые просьбы: könnte, hätte gern, würde gern"
exam:
  - a2-lesen-3
  - a2-hoeren-1
  - a2-schreiben-1
  - a2-sprechen-3
dialogues:
  scene:
    title: Könnten Sie die Buchung bitte bestätigen?
    ru: Уточняем бронирование
    place: Büsum · вымышленная Lernpension Küstenhaus · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      K:
        name: Frau Martens
        voice: Sandy
    lines:
      - K: Lernpension Küstenhaus, Martens, guten Tag!
        ru: Учебная гостиница Кюстенхаус, Мартенс, добрый день!
      - D: Guten Tag. Ich würde gern zwei Einzelzimmer reservieren.
        ru: Добрый день. Я хотела бы забронировать два одноместных номера.
      - K: Für welchen Zeitraum?
        ru: На какой период?
      - D: Vom vierzehnten bis zum sechzehnten Juli, ohne Frühstück.
        ru: С четырнадцатого по шестнадцатое июля, без завтрака.
      - K: Das geht. Ein Zimmer kostet 45 Euro pro Nacht.
        ru: Это возможно. Один номер стоит 45 евро за ночь.
      - D: Könnten Sie mir den Gesamtpreis nennen?
        ru: Не могли бы вы назвать мне общую цену?
      - K: Zwei Zimmer für zwei Nächte kosten insgesamt 180 Euro.
        ru: Два номера на две ночи стоят всего 180 евро.
      - D: Gut. Ich hätte gern eine Bestätigung per E-Mail.
        ru: Хорошо. Я хотела бы получить подтверждение по электронной почте.
      - K: Gern. Bitte geben Sie mir Ihren Namen.
        ru: Охотно. Назовите, пожалуйста, ваше имя.
