case:
  title: Anfrage oder Bestätigung?
  ru: Запрос или подтверждение
  intro: В дневнике оказались две версии сообщения. Установите, что подтверждено первоисточником.
    Вывод зависит от языка, а не от личности автора.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Zwei Einzelzimmer, ohne Frühstück.
          ru: Два одноместных номера, без завтрака.
      question: Какая карточка совпадает?
      options:
        - Один двухместный с завтраком
        - Два одноместных без завтрака
        - Два двухместных
      answer: 1
      right: Совпадают и количество, и тип, и завтрак.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: "45 Euro pro Zimmer und Nacht. Zwei Zimmer, zwei Nächte: 180 Euro."
