spy:
  - de: "Ich fühle mich nicht gut."
    wrong: "Ich fühle sich nicht gut."
    why: "С *ich* нужно *mich*: *sich* только для третьего лица."
  - de: "Du meldest dich an."
    wrong: "Du meldest sich an."
    why: "С *du* нужно *dich*."
  - de: "Wir möchten uns anmelden."
    wrong: "Wir möchten sich anmelden."
    why: "С *wir* нужно *uns*."
  - de: "Ich soll zuerst anrufen."
    wrong: "Ich soll zuerst rufe an."
    why: "После *soll* нужен инфинитив: *anrufen*."

