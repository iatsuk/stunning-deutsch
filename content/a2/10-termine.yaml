tables:
  rule:
    title: sich anmelden, sich fühlen; sollen
    ru: Опора для решения
    head:
      - Beispiel
      - Смысл и форма
    ruCols:
      - 1
    rows:
      - - Ich fühle mich nicht gut. Du fühlst dich müde.
        - ich → mich; du → dich.
      - - Er meldet sich an. Wir melden uns an.
        - er / sie → sich; wir → uns; ihr → euch.
      - - Ich möchte mich anmelden.
        - "После модального инфинитив в конце: anmelden."
      - - Ich soll zuerst anrufen.
        - sollen передаёт полученное указание.
tasks:
  message:
    kind: message
    part: a2-lesen-2
    title: Neuer Termin · Lernnachricht
    from: Frau Klein
    text: Der alte Termin am Dienstag um 9 Uhr passt nicht. Ein neuer Termin ist am Mittwoch um
      10:30 Uhr möglich. Bitte rufen Sie zuerst an und bestätigen Sie ihn. Bringen Sie Ihre
      Karte mit. Melden Sie sich am Empfang an.
  radio:
    kind: worksheet
    part: a2-hoeren-2
    format: radio
    title: Fünf kurze Lernmeldungen
    situation: Hören Sie jede Meldung einmal. Wählen Sie a, b oder c.
    recordings:
      - voice: Shelley
        text: Die Anmeldung in der Praxis ist heute am Empfang im Erdgeschoss. Bitte gehen Sie nicht in
          den ersten Stock.
      - voice: Rocko
        text: Die Besprechung im Club beginnt heute um fünfzehn Uhr, nicht um vierzehn Uhr.
      - voice: Sandy
        text: Unser Café öffnet am Sonntag erst um zehn Uhr. Frühstück gibt es bis zwölf Uhr.
      - voice: Eddy
        text: Unser Lernmuseum ist heute geschlossen. Morgen können Sie uns wieder besuchen.
      - voice: Flo
        text: Elif sucht ihre blaue Tasche. Sie liegt nicht im Kursraum. Bitte schauen Sie am Empfang
          nach.
    questions:
      - prompt: Anmeldung ist
        options:
          - am Empfang
          - im ersten Stock
          - im Café
        answers:
          - am Empfang
      - prompt: Besprechung beginnt um
        options:
          - 14 Uhr
          - 15 Uhr
          - 16 Uhr
        answers:
          - 15 Uhr
      - prompt: Café öffnet um
        options:
          - 9 Uhr
          - 10 Uhr
          - 12 Uhr
        answers:
          - 10 Uhr
      - prompt: Besuch im Lernmuseum wieder möglich
        options:
          - heute
          - morgen
          - nächste Woche
        answers:
          - morgen
      - prompt: Wo soll man nach der Tasche schauen?
        options:
          - am Empfang
          - im Kursraum
          - im Zug
        answers:
          - am Empfang
  letter:
    kind: message
    part: a2-schreiben-2
    title: Später zum Kurs
    from: Frau Thomsen
    text: Bitte schreiben Sie mir, wenn sich Ihr Plan ändert.
    situation: Sie haben einen neuen Termin. Wählen Sie drei von vier Punkten und schreiben Sie
      circa 40 Wörter mit Anrede und Gruß.
    choose: 3
    points:
      - Warum später?
      - Wann ist der Termin?
      - Wann kommen Sie zum Kurs?
      - Hausaufgaben?
    sample:
      - Liebe Frau Thomsen,
      - ich kann am Mittwoch nicht pünktlich zum Kurs kommen, weil ich um 10:30 Uhr einen
        Termin habe. Welche Hausaufgaben soll ich machen? Bitte schicken Sie mir die Aufgaben.
        Ich möchte sie zu Hause machen. Vielen Dank für Ihre Hilfe.
      - Viele Grüße
  talk:
    kind: card
    part: a2-sprechen-2
    title: Einen Termin ändern
    theme: Termine
    word: Wann? Warum? Was mitbringen?
    sample:
      - Ich möchte meinen Termin verschieben.
      - Wann passt es Ihnen?
      - Ich soll zuerst anrufen und die Zeit bestätigen.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Матео переносит учебную запись в практику и сообщает об этом преподавательнице. Нужно
          понять новое время, кому перезвонить и что взять с собой. Медицинское состояние —
          часть вымышленной сцены; игрок не выбирает диагноз или лечение. Все нужные условия
          даны в сцене: знания географии, настоящих цен или расписаний не требуются. Сначала
          попробуйте понять, какого результата добиваются друзья, затем слушайте реплики. На
          новом уровне важно не только найти число или знакомое слово, но и связать несколько
          сведений."
        point: Запись и переданное указание
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Сотрудница предлагает новое время и просит подтвердить его звонком. Матео пересказывает
          поручение: *Ich soll zuerst anrufen*. Это не его собственная рекомендация другому
          человеку, а передача полученного указания. Формы *mich* и *sich* связываются с тем же
          человеком, который действует. В этой теме работа с сообщениями заменяет любые догадки
          о лечении."
        point: sich anmelden, sich fühlen; sollen
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Возвратный глагол часто учат вместе с местоимением: *sich anmelden*, *sich fühlen*. В
          конкретной реплике форма меняется: *ich melde mich an*, *Sie melden sich an*. Не
          переводите любое русское «-ся» механически: здесь рассматриваются конкретные полезные
          выражения. Для записи важны также *verschieben*, *bestätigen*, *zuerst* — этапы не
          взаимозаменяемы."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: sich anmelden, sich fühlen; sollen
    beats:
      - read: В этих выражениях местоимение относится к тому же человеку, что и подлежащее. *Ich fühle
          mich*, *du fühlst dich*. Нельзя просто оставить инфинитивное *sich* после любого
          лица. Сначала определите, о ком говорится, затем подберите форму. В диалоге это
          описание состояния персонажа, а не основание для медицинского вывода.
        point: ich → mich; du → dich.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "У третьего лица используем *sich*, у группы с говорящим — *uns*, у нескольких друзей —
          *euch*. Приставка *an* в главном предложении отделяется: *Wir melden uns an*. У
          вежливого *Sie* форма тоже *sich*. Контекст и обращение помогают понять, говорит
          человек о себе или даёт инструкцию посетителю."
        point: er / sie → sich; wir → uns; ihr → euch.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "С модальным глаголом приставка не отделяется от инфинитива: *möchte mich anmelden*.
          Местоимение находится внутри рамки. Сравните с обычным *Ich melde mich an*. Обе
          модели выражают регистрацию, но одна сообщает желание, другая действие. В игре нужно
          собрать подходящую реплику для своего этапа."
        point: "После модального инфинитив в конце: anmelden."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Матео пересказывает просьбу сотрудницы: сначала позвонить. Личная форма *soll* стоит
          второй, инфинитив *anrufen* — в конце. Это отличается от *Ich will anrufen*,
          собственного желания. В задании важно сохранить источник поручения и его порядок;
          назначение лечения или оценку здоровья здесь не делаем."
        point: sollen передаёт полученное указание.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: У *Ich soll mich am Empfang anmelden* личная форма *soll* занимает вторую позицию.
          Местоимение *mich* остаётся в середине, инфинитив *anmelden* завершает рамку. Реплика
          пересказывает инструкцию на стойке. Если говорящий уже регистрируется, можно сказать
          *Ich melde mich am Empfang an* — это другой этап.
        point: "*Ich soll mich am Empfang anmelden.*"
        set:
          view: sentence
          rows:
            - de:
                - Ich
                - soll
                - mich am Empfang
                - anmelden.
              ru: Мне сказали зарегистрироваться у стойки.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Ich melde sich an — верно?
        read: "Нет: *Ich melde mich an*. *Sich* относится к третьему лицу и вежливому *Sie* в наших
          примерах. У первого лица нужна форма *mich*. С модальным глаголом получится *Ich
          möchte mich anmelden*: приставка вернётся к инфинитиву в конце."
        point: "*ich melde mich an*, но *er meldet sich an*."
        set:
          view: table
          table: rule
      - question: Новое предложенное время уже подтверждено?
        read: "В сообщении просят сначала перезвонить и подтвердить. Пока это не сделано, мы не можем
          выдать предложение за завершённое согласование. В игре нужно сохранить
          последовательность: услышать новые данные, перезвонить, подтвердить, затем сообщить
          об изменении преподавателю."
        point: Указанный следующий шаг — часть сообщения, а не необязательная деталь.
        set:
          view: table
          table: rule
  - id: exam-message
    chapter: exam
    title: Neuer Termin · Lernnachricht
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: message
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: message
        set:
          view: task
          task: message
          solved: true
