id: a2-termine
order: 10
title: Ich soll zuerst anrufen.
ru: Запись и переданное указание
lede: Матео переносит учебную запись в практику и сообщает об этом преподавательнице. Нужно
  понять новое время, кому перезвонить и что взять с собой. Медицинское состояние — часть
  вымышленной сцены; игрок не выбирает диагноз или лечение.
goals:
  - Использовать частые возвратные глаголы
  - Пересказать указание с sollen
  - Отличить перенос записи от отмены всех планов
  - Написать короткое сообщение о переносе
grammar:
  - sich anmelden, sich fühlen; sollen
exam:
  - a2-lesen-2
  - a2-hoeren-2
  - a2-schreiben-2
  - a2-sprechen-2
dialogues:
  scene:
    title: Ich soll zuerst anrufen.
    ru: Запись и переданное указание
    place: Kiel · вымышленная Praxis Dr. Hoffmann · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      K:
        name: Frau Klein
        voice: Shelley
    lines:
      - M: Guten Tag. Ich fühle mich nicht gut und möchte meinen Termin verschieben.
        ru: Добрый день. Я плохо себя чувствую и хочу перенести свою запись.
      - K: Guten Tag, Herr Fernández. Ihr Termin ist am Dienstag um neun Uhr, richtig?
        ru: Добрый день, господин Фернандес. Ваша запись во вторник в девять, верно?
      - M: Ja. Könnten Sie mir einen anderen Termin geben?
        ru: Да. Не могли бы вы предложить другое время?
      - K: Am Mittwoch um halb elf ist ein Termin frei. Bitte rufen Sie uns zuerst an und bestätigen
          Sie ihn.
        ru: В среду в 10:30 есть свободное время. Пожалуйста, сначала позвоните нам и подтвердите его.
      - M: Gut. Ich soll also zuerst anrufen. Was soll ich mitbringen?
        ru: Хорошо. Значит, мне сначала нужно позвонить. Что мне взять с собой?
      - K: Bringen Sie bitte Ihre Karte mit. Im Haus melden Sie sich am Empfang an.
        ru: Возьмите, пожалуйста, свою карту. В здании отметьтесь у стойки регистрации.
      - D: Ich schreibe Frau Thomsen, dass du später zum Kurs kommst.
        ru: Я напишу фрау Томсен, что ты придёшь на курс позже.
      - M: Danke. Ich kümmere mich um den Anruf.
        ru: Спасибо. Я займусь звонком.
