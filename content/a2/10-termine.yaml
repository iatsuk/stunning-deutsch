adventure:
  kind: sequence
  title: Передайте изменение точно
  intro: Матео переносит учебную запись в практику и сообщает об этом преподавательнице. Нужно
    понять новое время, кому перезвонить и что взять с собой. Медицинское состояние — часть
    вымышленной сцены; игрок не выбирает диагноз или лечение.
  ending: Новое время и следующий шаг записаны, сообщение преподавательнице подготовлено. В
    следующей теме понадобится так же точно объяснить проблему с покупкой.
  challenges:
    - id: new-time
      kind: clock
      title: Поставьте новое время
      intro: Старую запись нужно заменить предложенным временем среды. День подтверждаем отдельно.
      mode: reading
      clue:
        task: message
      answer: 10:30
      initial: 09:00
      minuteStep: 5
      success: Среда 10:30, не вторник 9:00.
      wrong: Новое предложение — среда в 10:30.
    - id: reflexive
      kind: match
      title: Кто регистрируется?
      intro: Соедините подлежащее с нужным местоимением.
      mode: reading
      slots:
        - id: ich
          label: Ich melde … an.
          answer: mich
        - id: du
          label: Du meldest … an.
          answer: dich
        - id: wir
          label: Wir melden … an.
          answer: uns
      options:
        - id: mich
          label: mich
        - id: dich
          label: dich
        - id: uns
          label: uns
        - id: sich
          label: sich
      success: Форма местоимения согласована с действующим лицом.
      wrong: У *ich* — *mich*, у *du* — *dich*, у *wir* — *uns*.
    - id: instruction
      kind: order
      title: Перескажите указание
      intro: «Мне сказали сначала позвонить».
      label: Реплика для команды
      tokens:
        - Ich
        - soll
        - zuerst
        - anrufen.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: next
      kind: select
      title: Выберите следующий шаг
      intro: Что прямо просят сделать перед подтверждением?
      mode: reading
      clue:
        task: message
      options:
        - id: o0
          label: zuerst anrufen
        - id: o1
          label: ohne Bestätigung direkt kommen
        - id: o2
          label: den Termin ignorieren
