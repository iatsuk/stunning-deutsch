spy:
  - de: "Mateo sagt, dass er frei hat."
    wrong: "Mateo sagt, dass er hat frei."
    why: "После *dass* спрягаемый глагол уходит в конец."
  - de: "Gestern musste ich arbeiten."
    wrong: "Gestern muss ich arbeiten."
    why: "*gestern* — прошлое, нужна форма *musste*."
  - de: "Ich wollte kommen, aber ich hatte keine Zeit."
    wrong: "Ich wolle kommen, aber ich hatte keine Zeit."
    why: "Прошедшее время модального глагола: *wollte*."
  - de: "Konntest du die Liste lesen?"
    wrong: "Konntet du die Liste lesen?"
    why: "С *du* окончание *-st*: *konntest*."

