tasks:
  work:
    kind: message
    part: a2-lesen-2
    title: Nachricht von Herrn Wagner
    from: Herr Wagner
    to: Mateo Fernández
    text: Hallo Mateo, am Freitag beginnt deine Schicht wie immer um 17 Uhr. Komm bitte schon um 16
      Uhr zur Besprechung. Am Sonntag hast du frei. Die Liste für das Restaurant habe ich schon
      gelesen. Die Einkaufsliste für den Club ist eine andere Liste.
  phone:
    kind: worksheet
    part: a2-hoeren-1
    format: notes
    title: Telefonnotiz aus dem Restaurant
    voice: Eddy
    text: Guten Tag, Herr Fernández. Hier ist Wagner vom Restaurant Fördeblick. Unsere Besprechung
      ist am Freitag um sechzehn Uhr im Restaurant. Ihre Schicht beginnt um siebzehn Uhr.
      Bringen Sie bitte die Liste mit. Am Sonntag haben Sie frei.
    questions:
      - prompt: Besprechung am
        answers:
          - Freitag
          - am Freitag
      - prompt: Besprechung um
        answers:
          - 16:00
          - 16 Uhr
          - sechzehn Uhr
      - prompt: Ort
        answers:
          - Restaurant
          - im Restaurant
          - Fördeblick
      - prompt: Schichtbeginn
        answers:
          - 17:00
          - 17 Uhr
          - siebzehn Uhr
      - prompt: Mitbringen
        answers:
          - Liste
          - die Liste
