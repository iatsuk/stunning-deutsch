id: a2-arbeit
order: 9
title: Mateo sagt, dass er am Sonntag frei hat.
ru: Работа и сообщения
lede: Матео продолжает работать в Fördeblick. Перед новой встречей команды он пересказывает
  сообщение руководителя и объясняет, почему вчера не смог помочь. Нужно отделить чужое
  сообщение, личное желание и реально выполненную задачу.
goals:
  - Передать содержание сообщения с dass
  - Распознать мог, должен был и хотел
  - Понять особое время из рабочего сообщения
  - Рассказать о профессии и заполнить сведения об опыте
grammar:
  - dass; konnte, musste, wollte
exam:
  - a2-lesen-2
  - a2-hoeren-1
  - a2-schreiben-1
  - a2-sprechen-1
dialogues:
  scene:
    title: Mateo sagt, dass er am Sonntag frei hat.
    ru: Работа и сообщения
    place: Sprachschule Förde, Kiel · перед занятием A2 · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Mateo, kannst du am Sonntag zum Club kommen?
        ru: Матео, сможешь в воскресенье прийти в клуб?
      - M: Ja. Herr Wagner sagt, dass ich am Sonntag frei habe.
        ru: Да. Господин Вагнер говорит, что в воскресенье у меня выходной.
      - D: Und warum warst du gestern nicht da?
        ru: А почему тебя вчера не было?
      - M: Ich wollte kommen, aber ich musste arbeiten.
        ru: Я хотел прийти, но должен был работать.
      - D: Konntest du die Liste trotzdem lesen?
        ru: Ты всё же смог прочитать список?
      - M: Ja. Ich habe gelesen, dass wir um sechzehn Uhr im Club sein sollen.
        ru: Да. Я прочитал, что мы должны быть в клубе в шестнадцать.
      - D: Für Sonntag stimmt das. Am Freitag hast du aber ein Treffen im Restaurant.
        ru: Для воскресенья верно. Но в пятницу у тебя встреча в ресторане.
      - M: Genau. Herr Wagner schreibt, dass ich am Freitag schon um sechzehn Uhr kommen soll.
        ru: Именно. Господин Вагнер пишет, чтобы я в пятницу пришёл уже в шестнадцать.
