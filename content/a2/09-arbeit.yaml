steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Матео продолжает работать в Fördeblick. Перед новой встречей команды он пересказывает
          сообщение руководителя и объясняет, почему вчера не смог помочь. Нужно отделить чужое
          сообщение, личное желание и реально выполненную задачу. Все нужные условия даны в
          сцене: знания географии, настоящих цен или расписаний не требуются. Сначала
          попробуйте понять, какого результата добиваются друзья, затем слушайте реплики. На
          новом уровне важно не только найти число или знакомое слово, но и связать несколько
          сведений."
        point: Работа и сообщения
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "В разговоре два события с одинаковым временем: пятница в ресторане и воскресенье в
          клубе. Совпадение числа не делает события одинаковыми. *Dass* вводит содержание того,
          что сказано или написано. Формы *wollte* и *musste* объясняют прошлую ситуацию:
          желание прийти не означает, что Матео действительно пришёл."
        point: dass; konnte, musste, wollte
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "*Sagen*, *schreiben*, *lesen* помогают назвать источник сообщения. После них можно
          сообщить содержание с *dass*. *Konnte*, *musste*, *wollte* относятся к прошлому. Они
          не заменяют друг друга по смыслу: возможность, необходимость и желание — разные
          сведения для отчёта команды."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: dass; konnte, musste, wollte
    beats:
      - read: "В главной части назван источник: *Er sagt*. После *dass* сообщается содержание: *er am
          Sonntag frei hat*. Личная форма *hat* стоит в конце придаточного. Это не причина и не
          условие: не подменяйте *dass* знакомыми *weil* или *wenn*. В отчёте полезно
          сохранить, кто именно сообщил сведения."
        point: dass передаёт содержание; глагол в конце.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "У этих частых модальных глаголов в прошлом используется короткая форма. Инфинитив
          остаётся в конце своей части: *wollte kommen*, *musste arbeiten*. Желание не равно
          выполнению. Из фразы нельзя сделать вывод, что человек успел и прийти, и отработать:
          в контексте он объясняет отсутствие."
        point: wollte — хотел; musste — должен был.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Формы *konnte*, *musste*, *wollte* не имеют умлаута, в отличие от инфинитивов *können* и
          *müssen*. У *du* появляется окончание: *konntest*, *musstest*, *wolltest*. В вопросе
          да/нет личная форма стоит первой, инфинитив в конце. Сначала определите, о какой
          возможности спрашивают, затем проверяйте форму."
        point: konnte — мог; konntest — мог ты.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "В сообщении *soll* передаёт, что требуется по просьбе другого человека. Здесь это
          рабочая встреча: руководитель просит прийти раньше. Для первого шага воспринимаем
          *soll* как частую модель пересказа поручения. Более подробно её разберём в теме о
          записях и указаниях; не трактуем любое такое сообщение как собственный совет
          говорящего."
        point: sollen передаёт поручение или ожидаемое действие.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "В прямой фразе было бы *Ich habe am Sonntag frei*. При пересказе после *dass* личная
          форма *habe* уходит в конец. Если меняется говорящий, меняется местоимение: *Mateo
          sagt, dass er …*. Сохраняйте источник и человека, о котором говорится, иначе
          грамматически верный пересказ может приписать выходной другому участнику."
        point: "*Mateo sagt, dass er am Sonntag frei hat.*"
        set:
          view: sentence
          rows:
            - de:
                - Mateo
                - sagt,
                - dass er am Sonntag frei hat.
                - ""
              ru: Матео говорит, что в воскресенье у него выходной.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Ich wollte kommen доказывает, что человек пришёл?
        read: Нет. Это сообщение о желании в прошлом. Для подтверждения прихода нужно другое действие
          или факт, например *Ich bin gekommen*. В нашем разговоре следующая часть *aber ich
          musste arbeiten* как раз объясняет отсутствие. Не превращайте намерение в завершённое
          дело при заполнении отчёта.
        point: Желание, возможность и выполненное действие — разные факты.
        set:
          view: table
          table: rule
      - question: После dass форма habe остаётся на втором месте?
        read: "Нет: *dass ich am Sonntag frei habe*. Знакомая рамка главного предложения здесь
          меняется. После союза начинается придаточное, и личная форма завершает его. В начале
          пересказа можно назвать источник: кто говорит, пишет или что вы прочитали."
        point: "*dass ich … frei habe* — глагол в конце."
        set:
          view: table
          table: rule
  - id: exam-work
    chapter: exam
    title: Nachricht von Herrn Wagner
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: work
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
