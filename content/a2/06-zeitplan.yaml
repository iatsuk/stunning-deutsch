        - id: o1
          label: das Treffen absagen
        - id: o2
          label: schon um 12 Uhr gehen
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: note
      kind: note
      title: Запишите подтверждение
      intro: Телефонное сообщение уточняет место. Запишите время и место, не возвращайтесь к
        обсуждённому вокзалу.
      clue:
        task: phone
      fields:
        - label: Uhrzeit
          answers:
            - 14:00
            - 14 Uhr
