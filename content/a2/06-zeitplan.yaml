  letter:
    kind: message
    part: a2-schreiben-2
    title: Treffen bestätigen
    from: Hauke
    text: Bitte bestätige unser Treffen und deinen Plan für schlechtes Wetter.
    situation: Wählen Sie drei von vier Punkten. Schreiben Sie circa 40 Wörter mit Anrede und Gruß.
    choose: 3
    points:
      - Tag und Uhrzeit
      - Treffpunkt
      - Plan bei Regen
      - Was bringen Sie mit?
    sample:
      - Hallo Hauke,
      - Sonntag um 14 Uhr passt für mich. Ich komme ins Café. Wenn es regnet, bleiben wir dort.
        Wir können unsere nächste Fahrt planen und Fotos ansehen. Bitte sag Elif Bescheid. Ich
        freue mich auf unser Treffen.
      - Viele Grüße
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "У команды есть свободное окно, но время друзей не совпадает целиком. Нужно найти общую
          часть расписаний и договориться о запасном месте. Новый план должен учитывать и
          время, и условие на случай дождя. Все нужные условия даны в сцене: знания географии,
          настоящих цен или расписаний не требуются. Сначала попробуйте понять, какого
          результата добиваются друзья, затем слушайте реплики. На новом уровне важно не только
          найти число или знакомое слово, но и связать несколько сведений."
        point: План с условием
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Для встречи недостаточно выбрать время одного человека. Элиф свободна только после
          курса, Дана — до шестнадцати, Матео будет в клубе с тринадцати. Общее окно начинается
          в четырнадцать и заканчивается в шестнадцать. Затем друзья обсуждают условие: дождь
          меняет место, но не отменяет договорённое время."
        point: "wenn: условие и порядок слов"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "*Ab* обозначает начало доступности, *bis* — её конец. *Danach* связывает занятие с
          последующим свободным временем. *Bestätigen* возвращается из первого урока:
          обсуждение и подтверждение — разные действия. В игре придётся связать расписания и
          новое сообщение, а не просто найти первое число."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "wenn: условие и порядок слов"
    beats:
      - read: "Придаточное с *wenn* задаёт условие. В нём *regnet* стоит в конце, как знакомая личная
          форма после *weil*. Но смысл другой: *weil* объясняет причину, а *wenn* сообщает, при
          каком условии выбирается действие. В нашем плане дождь ещё не объявлен фактом —
          друзья заранее договариваются о варианте."
        point: После wenn личная форма в конце.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Всё начальное придаточное занимает первую позицию главного предложения. Поэтому после
          запятой сразу идёт *bleiben*, затем *wir*. Не добавляйте лишнюю первую позицию: *Wenn
          es regnet, wir bleiben …* не соответствует этой модели. Сначала произнесите условие
          целиком, потом назовите действие."
        point: "После начального придаточного: bleiben wir."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: Хорошая погода ведёт к прогулке, дождь — к кафе. Оба варианта относятся к одному
          согласованному времени. Если сообщение меняет только место, не переносите вместе с
          ним часы или день без основания. В заданиях часто проверяют именно то, что
          изменилось, и то, что осталось прежним.
        point: Условие выбирает ветку, а не новое время.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Посмотрите, как условие занимает начало: *Wenn es regnet*. Личная форма главной части
          *bleiben* оказывается сразу после него, а подлежащее *wir* следует за глаголом. После
          *wenn* внутри условия глагол *regnet* уже стоит последним. В одном предложении
          действуют два порядка, каждый в своей части."
        point: "*Wenn es regnet, bleiben wir im Café.*"
        set:
          view: sentence
          rows:
            - de:
                - Wenn es regnet,
                - bleiben
                - wir im Café.
                - ""
              ru: Если идёт дождь, мы остаёмся в кафе.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: После Wenn es regnet идёт wir bleiben или bleiben wir?
        read: "*Bleiben wir*: всё придаточное уже заняло первую позицию. Порядок относится к главной
          части, а не к одному слову *wenn*. Если поставить условие в конец, получится *Wir
          bleiben im Café, wenn es regnet*. Смысл сохраняется, устройство начала меняется."
        point: Начальное придаточное → глагол, затем подлежащее.
        set:
          view: table
          table: rule
      - question: Если из-за дождя выбрано кафе, встреча отменена?
        read: "Нет. В этом плане дождь меняет место на кафе. Чтобы сделать вывод об отмене, нужно
          отдельное сообщение. Сопоставляйте действие и условие: не добавляйте к источнику то,
          что кажется привычным или логичным в другой ситуации."
        point: Меняйте только те условия, которые названы в сообщении.
        set:
          view: table
          table: rule
  - id: exam-schedule
    chapter: exam
    title: Zeiten für Sonntag
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: schedule
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
