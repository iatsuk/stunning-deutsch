case:
  title: Nur das Wetter ändert sich
  ru: Дождь меняет только место
  intro: В дневнике оказались две версии сообщения. Установите, что подтверждено первоисточником.
    Вывод зависит от языка, а не от личности автора.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Elif hat ab 14 Uhr Zeit. Dana hat bis 16 Uhr Zeit.
          ru: Элиф свободна с 14:00. Дана свободна до 16:00.
      question: Какое время входит в общее окно?
      options:
        - 13:00
        - 14:30
        - 17:00
      answer: 1
      right: 14:30 находится после начала Элиф и до конца Даны.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wenn es regnet, bleiben wir im Café. Das Treffen beginnt um 14 Uhr.
          ru: Если идёт дождь, остаёмся в кафе. Встреча начинается в 14:00.
      question: Что меняет дождь?
      options:
        - Место
        - День
        - Время
      answer: 0
      right: В условии названо действие в кафе, время не изменено.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wir treffen uns im Café, nicht am Bahnhof.
          ru: Мы встречаемся в кафе, не у вокзала.
      question: Где искать команду?
      options:
        - У вокзала
        - В кафе
        - У музея
      answer: 1
      right: "*Nicht* прямо исключает вокзал."
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Запись исправлена по источникам. В следующей главе команда воспользуется
    подтверждёнными сведениями для нового решения.
adventure:
  kind: sequence
  title: Согласуйте время и запасной вариант
  intro: У команды есть свободное окно, но время друзей не совпадает целиком. Нужно найти общую
    часть расписаний и договориться о запасном месте. Новый план должен учитывать и время, и
    условие на случай дождя.
  ending: Встреча подтверждена, запасное место связано с условием, время сохранено. Теперь можно
    уточнять бронирование для следующей поездки.
  challenges:
    - id: window
      kind: clock
      title: Найдите начало общего окна
      intro: Поставьте самое раннее время, когда все трое свободны. Учитывайте и начало, и конец
        доступности.
      mode: reading
      clue:
        task: schedule
      answer: 14:00
      initial: 12:00
      minuteStep: 5
      success: С 14:00 все свободны; Дана остаётся доступна до 16:00.
      wrong: Элиф свободна лишь с 14:00. Более раннее время не подходит всей группе.
    - id: condition
      kind: order
      title: Соберите условный план
      intro: «Если идёт дождь, мы остаёмся в кафе».
      label: Реплика для команды
      tokens:
        - Wenn es regnet,
        - bleiben
        - wir
        - im Café.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: rain
      kind: select
      title: Выберите ветку для дождя
      intro: В новом сообщении подтвердили дождь. Что делать по плану?
      mode: reading
      clue:
        task: schedule
      options:
        - id: o0
