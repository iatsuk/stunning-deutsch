    kind: message
    part: a2-lesen-2
    title: Zeiten für Sonntag
    from: Hauke
    text: "Dana: 12–16 Uhr. Mateo: ab 13 Uhr. Elif: ab 14 Uhr. Treffen: 14–15 Uhr. Wenn es regnet,
      bleiben wir im Café. Bei gutem Wetter gehen wir an die Förde. Die Zeit bleibt gleich."
  phone:
    kind: worksheet
    part: a2-hoeren-1
