      - M: Ich habe am Sonntag frei. Ab dreizehn Uhr bin ich im Club.
        ru: В воскресенье у меня выходной. С тринадцати я в клубе.
      - E: Mein Kurs ist bis vierzehn Uhr. Danach habe ich Zeit.
        ru: Мой курс до четырнадцати. Потом у меня есть время.
      - H: Dann treffen wir uns um vierzehn Uhr.
