spy:
  - de: "Ich frage, ob Plätze frei sind."
    wrong: "Ich frage, ob sind Plätze frei."
    why: "В косвенном вопросе глагол уходит в конец: *frei sind*."
  - de: "Wissen Sie, wann der Kurs beginnt?"
    wrong: "Wissen Sie, wann beginnt der Kurs?"
    why: "В косвенном вопросе глагол уходит в конец: *der Kurs beginnt*."
  - de: "Können Sie mir sagen, wie lange der Kurs dauert?"
    wrong: "Können Sie mir sagen, wie lange dauert der Kurs?"
    why: "В косвенном вопросе глагол уходит в конец: *der Kurs dauert*."
  - de: "Ich frage, ob sie Zeit haben."
    wrong: "Ich frage, wenn sie Zeit haben."
    why: "Вопрос «ли» вводит *ob*, а не *wenn*."

