id: a2-kontakte
order: 13
title: Wissen Sie, ob der Kurs stattfindet?
ru: Уточняем сведения и знакомимся
lede: Элиф хочет познакомиться с участниками клуба во Фленсбурге и пригласить друзей на
  встречу. В объявлении не хватает времени. Вместо догадки команда задаёт вопрос и ждёт
  подтверждения. Все клубы, адреса и предложения в заданиях вымышлены.
goals:
  - Отличить вопрос от подтверждённого факта
  - Вежливо спросить неизвестное время или условие
  - Поставить глагол в конец косвенного вопроса
  - Найти объявление либо признать отсутствие подходящего
grammar:
  - Косвенные вопросы с W-словом и ob
exam:
  - a2-lesen-2
  - a2-lesen-3
  - a2-schreiben-2
  - a2-sprechen-2
  - a2-hoeren-3
dialogues:
  scene:
    title: Wissen Sie, ob der Kurs stattfindet?
    ru: Уточняем сведения и знакомимся
    place: Flensburg · вымышленный клуб · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      K:
        name: Frau Hansen
        voice: Sandy
    lines:
      - E: Guten Tag. Können Sie mir sagen, wann der Fotokurs beginnt?
        ru: Добрый день. Не могли бы вы сказать, когда начинается фотокурс?
      - K: Am Samstag um elf Uhr.
        ru: В субботу в одиннадцать.
      - E: Wissen Sie, ob noch Plätze frei sind?
        ru: Вы знаете, есть ли ещё свободные места?
      - K: Ja, zwei Plätze sind noch frei.
        ru: Да, ещё два места свободны.
      - E: Und wie lange dauert der Kurs?
        ru: А сколько длится курс?
      - K: Zwei Stunden. Bitte bringen Sie eine Kamera mit.
        ru: Два часа. Пожалуйста, принесите камеру.
      - E: Danke. Ich frage meine Freunde, ob sie Zeit haben.
        ru: Спасибо. Я спрошу друзей, есть ли у них время.
      - K: Gern. Bitte melden Sie sich bis Freitag an.
        ru: Охотно. Пожалуйста, запишитесь до пятницы.
