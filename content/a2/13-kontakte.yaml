        - id: start
          text: Fotokurs am Samstag. Die Uhrzeit fehlt.
          choices:
            - label: Können Sie mir sagen, wann der Kurs beginnt?
              next: reply
              feedback: Вы запросили недостающее время.
            - label: Der Kurs beginnt um zehn Uhr.
              next: retry
              feedback: В источнике нет десяти часов. Это догадка.
        - id: retry
          text: Bitte fragen Sie nach der Uhrzeit.
          choices:
            - label: Wann beginnt der Kurs?
              next: reply
              feedback: Теперь это вопрос, а не утверждение.
        - id: reply
          text: Am Samstag um elf Uhr. Zwei Plätze sind frei.
          choices:
            - label: Danke. Jetzt kenne ich die Uhrzeit.
              next: end
              feedback: Время подтверждено ответом.
        - id: end
          text: "Подтверждение записано: Samstag, 11 Uhr."
          terminal: true
          choices: []
