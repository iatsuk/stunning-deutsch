steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Элиф хочет познакомиться с участниками клуба во Фленсбурге и пригласить друзей на
          встречу. В объявлении не хватает времени. Вместо догадки команда задаёт вопрос и ждёт
          подтверждения. Все клубы, адреса и предложения в заданиях вымышлены. Все нужные
          условия даны в сцене: знания географии, настоящих цен или расписаний не требуются.
          Сначала попробуйте понять, какого результата добиваются друзья, затем слушайте
          реплики. На новом уровне важно не только найти число или знакомое слово, но и связать
          несколько сведений."
        point: Уточняем сведения и знакомимся
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Элиф сначала задаёт косвенный вопрос с *wann*, затем с *ob*. Первый запрашивает
          конкретное время, второй — ответ да или нет. Сам вопрос ещё ничего не подтверждает:
          наличие двух мест известно только из ответа сотрудницы. В игре нельзя считать фразу
          «есть ли места?» сообщением «места есть»."
        point: Косвенные вопросы с W-словом и ob
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "*Sich anmelden* уже знакомо по записи на приём; теперь это регистрация на курс. *Frei*
          рядом с *Plätze* означает свободные места, а *kostenlos* — отсутствие платы. Эти
          условия нельзя подменять друг другом. Сначала проверьте занятие и время, затем
          узнайте число мест и срок регистрации."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: Косвенные вопросы с W-словом и ob
    beats:
      - read: Прямой вопрос начинается с *wann*, а глагол *beginnt* стоит сразу за ним. После вводной
          просьбы *Können Sie mir sagen* начинается придаточная часть с тем же W-словом. В ней
          личная форма стоит в конце. Это знакомый принцип из *weil* и *dass*, теперь он
          помогает вежливо получить неизвестные сведения.
        point: W-слово остаётся, глагол уходит в конец.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Если у прямого вопроса нет W-слова и можно ответить да или нет, в косвенном вопросе
          используем *ob*. Не заменяем его на *wenn*: сейчас спрашиваем, верно ли условие, а не
          строим план «если». В конце стоит личная форма *sind*. Содержание вопроса само по
          себе ещё не является ответом."
        point: ob вводит вопрос с ответом да или нет.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: После *wie lange* поставьте подлежащее *der Kurs*, а *dauert* перенесите в конец. Вся
          фраза с *Ich frage* является сообщением, поэтому заканчивается точкой. Готовая
          просьба *Können Sie mir sagen …?* остаётся вопросом. Сначала соберите смысл, затем
          проверьте рамку предложения.
        point: Внутри косвенного вопроса нет вопросительной инверсии.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Знакомую главную часть *Ich frage* дополняем вопросом *ob sie Zeit haben*. Внутри него
          местоимение стоит перед дополнением, а личный глагол — в конце. Если друзья ещё не
          ответили, не записывайте их участие как подтверждённое. Грамматика помогает сохранить
          границу между вопросом и полученной информацией.
        point: "*Ich frage, ob sie Zeit haben.*"
        set:
          view: sentence
          rows:
            - de:
                - Ich
                - frage,
                - ob sie Zeit
                - haben.
              ru: Я спрашиваю, есть ли у них время.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: «Wissen Sie, ob Plätze frei sind?» подтверждает свободные места?
        read: Нет. Это запрос информации. Подтверждением будет ответ вроде *Ja, zwei Plätze sind frei*.
          В дневнике отметьте сначала вопрос, затем отдельный ответ. Если ответа нет, сведения
          остаются неизвестными. Такой навык полезен и в разговоре, и при чтении объявлений.
        point: Вопрос с *ob* не является подтверждением.
        set:
          view: table
          table: rule
      - question: Почему не «wann beginnt der Kurs» внутри просьбы?
        read: "Это порядок прямого вопроса. После *Können Sie mir sagen* нужна придаточная часть: *wann
          der Kurs beginnt*. W-слово сохраняется, но личный глагол уходит в конец. Сравните оба
          варианта вслух и найдите границу частей по запятой."
        point: "Косвенный вопрос: W-слово → подлежащее → … → глагол."
        set:
          view: table
          table: rule
  - id: exam-reply
    chapter: exam
    title: Die Antwort des Lernclubs
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: reply
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: reply
        set:
