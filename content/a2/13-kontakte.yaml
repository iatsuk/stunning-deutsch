adventure:
  kind: sequence
  title: От вопроса к подтверждённой встрече
  intro: Элиф хочет познакомиться с участниками клуба во Фленсбурге и пригласить друзей на
    встречу. В объявлении не хватает времени. Вместо догадки команда задаёт вопрос и ждёт
    подтверждения. Все клубы, адреса и предложения в заданиях вымышлены.
  ending: "Команда отделила вопросы от ответов и выбрала подходящий курс. В дневнике осталось
    последнее общее дело: договориться о поездке в конце лета."
  challenges:
    - id: clarify
      kind: negotiation
      title: Получите недостающее время
      intro: В коротком сообщении сказано только «Fotokurs am Samstag». Выберите вопрос о неизвестном
        времени.
      success: Уточнение получено и подтверждено ответом.
      wrong: Неизвестное время нужно спросить, а не придумать.
      start: start
