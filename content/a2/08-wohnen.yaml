steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "В гостевой комнате клуба готовят место для приезжего участника. Друзья выбирают
          небольшой стол, синий стул и светлую лампу. В объявлениях похожие предметы, поэтому
          нужно читать описание целиком и не путать, что уже есть, а что ещё требуется. Все
          нужные условия даны в сцене: знания географии, настоящих цен или расписаний не
          требуются. Сначала попробуйте понять, какого результата добиваются друзья, затем
          слушайте реплики. На новом уровне важно не только найти число или знакомое слово, но
          и связать несколько сведений."
        point: Комната для гостя
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Сначала Элиф называет то, что требуется, а потом Матео уточняет: лампа уже есть.
          Итоговый список должен учесть это изменение. Описание *ein kleiner Tisch* и покупка
          *einen kleinen Tisch* относятся к одному предмету, но его роль в предложении
          меняется. В игре важны и признаки вещи, и последнее уточнение о наличии."
        point: "Прилагательные: der kleine Tisch, ein kleiner Tisch, einen kleinen Tisch"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Предметы различаются размером, цветом и состоянием: маленький стол, синий стул, новая
          лампа. Не нужно запоминать всю систему склонения прилагательных за один урок. Здесь
          работаем с именительным и винительным в знакомых коротких описаниях. Дательный места
          уже известен, но полную таблицу новых окончаний в нём пока не добавляем."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "Прилагательные: der kleine Tisch, ein kleiner Tisch, einen kleinen Tisch"
    beats:
      - read: "Прилагательное между артиклем и существительным получает окончание. В этой модели
          артикль *der* уже показывает мужской род, а прилагательное имеет *-e*: *der kleine
          Tisch*. Это отличается от *Der Tisch ist klein*, где прилагательное стоит после
          *sein* и окончания не получает. Сначала установите положение прилагательного."
        point: "После der в Nom: der kleine Tisch."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "У *ein* здесь нет отдельного родового окончания, поэтому оно появляется у
          прилагательного: *kleiner*. Сравните с *eine helle Lampe* и *ein kleines Regal*. Это
          три частые опоры для первого описания предмета. В игре определите вещь по смыслу,
          затем проверьте, как она названа в сообщении."
        point: "После ein в Nom м. р.: ein kleiner Tisch."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Когда стол — предмет покупки или потребности, используется Akkusativ: *einen kleinen
          Tisch*, *den kleinen Tisch*. Мужской артикль меняется на *einen / den*,
          прилагательное получает *-en*. У женского в наших примерах остаётся *eine helle
          Lampe*, у среднего — *ein kleines Regal*. Не переносите мужскую форму на все роды."
        point: "Akk м. р.: einen / den kleinen Tisch."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Две фразы описывают тот же размер, но устроены по-разному. После *ist* прилагательное не
          склоняется. Перед *Tisch* оно согласуется с формой именной группы. В короткой просьбе
          можно использовать уже определённую вещь: *den kleinen Tisch*. На первом шаге
          полезнее уверенно различать эти модели, чем пытаться охватить все окончания сразу."
        point: После sein — klein; перед существительным — окончание.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: В предложении *Ich nehme den kleinen Tisch* подлежащее — *Ich*, личная форма — *nehme*,
          предмет покупки — вся группа *den kleinen Tisch*. Окончания внутри группы не
          переставляют глагол и не меняют смысл на действие самого стола. Скажите вслух, что
          покупаете, затем добавьте признак, отличающий предмет от другого.
        point: "*Ich nehme den kleinen Tisch.*"
        set:
          view: sentence
          rows:
            - de:
                - Ich
                - nehme
                - den kleinen Tisch.
                - ""
              ru: Я беру маленький стол.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Ein klein Tisch или ein kleiner Tisch?
        read: "*Ein kleiner Tisch*, если речь о предмете в именительном падеже. В просьбе купить его
          будет *einen kleinen Tisch*. Изменяется роль именной группы; размер остаётся тем же.
          Артикль и окончание рассматриваем вместе, а не выбираем случайное окончание по
          последней букве слова."
        point: "*ein kleiner Tisch* → *einen kleinen Tisch*."
        set:
          view: table
          table: rule
      - question: После Der Tisch ist нужно klein или kleine?
        read: "*Klein*. Здесь прилагательное стоит после *sein*, как в знакомом описании *Das Zimmer
          ist hell*. Окончания появляются в сочетании перед существительным: *der kleine
          Tisch*. Не считайте любой артикль в предложении причиной изменить прилагательное."
        point: "*Der Tisch ist klein*, но *der kleine Tisch*."
        set:
          view: table
          table: rule
  - id: exam-list
    chapter: exam
    title: Die letzte Einkaufsliste
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: list
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
