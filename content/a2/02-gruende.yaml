steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Для первой поездки команда выбирает пляж или кафе в Эккернфёрде. У друзей разные желания
          и свободное время. Нужно не просто сказать «нет», а объяснить причину и предложить
          подходящий вариант. Все нужные условия даны в сцене: знания географии, настоящих цен
          или расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Выбор с объяснением
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Матео отказывается не от поездки, а от субботы: причина — работа. Предложение
          воскресенья учитывает это ограничение. Дальше друзья не выбирают между двумя
          несовместимыми желаниями: завтрак и прогулка могут идти друг за другом. Слово *weil*
          связывает желание или решение с причиной. Для игры важно сохранить и само действие, и
          то, почему его выбрали."
        point: "weil: причина и глагол в конце"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Причина отвечает на *Warum?*. Уточнение *Passt das?* помогает проверить, согласен ли
          собеседник. *Zuerst* и *danach* возвращаются из дневника: они позволяют совместить
          два желания в один план. Эти слова полезны и без поездки — когда вы выбираете время
          курса, встречу в кафе или день покупки продуктов."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 12
  - id: grammar
    chapter: grammar
    title: "weil: причина и глагол в конце"
    beats:
      - read: "В главной части *Ich kann nicht* глагол стоит вторым. После *weil* порядок другой: *ich
          arbeiten muss*. Личная форма *muss* завершает придаточное. Инфинитив *arbeiten* стоит
          перед ней. Не переносите привычную рамку главного предложения без изменений. Запятая
          помогает увидеть границу двух частей, а причина объясняет отказ."
        point: После weil личная форма в конце.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Сама поездка и причина выбора транспорта — разные сведения. В этом сообщении отсутствие
          машины объясняет поезд, а работа Матео объясняет отказ от субботы. Чтобы правильно
          ответить, найдите связь целых частей. Одного узнавания *Auto* или *arbeiten*
          недостаточно: важно, на какой вопрос отвечает причина."
        point: Причина относится к выбранному действию.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "*Denn* тоже может вводить причину, но за ним остаётся обычное *ich muss arbeiten*. Для
          первого шага A2 сравнивайте две модели: *weil ich arbeiten muss* и *denn ich muss
          arbeiten*. Не заменяйте союз механически, оставляя тот же порядок. В играх можно
          опереться на короткие готовые причины, прежде чем строить свои."
        point: После denn сохраняется обычный порядок.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "В первой части личная форма *kann* занимает вторую позицию. Во второй показана причина с
          *weil*: *ich am Samstag arbeiten muss*. Последняя позиция принадлежит личной форме
          модального глагола. Произнесите сначала короткое решение, потом причину. Когда это
          получается, объедините их с запятой."
        point: "*Ich kann nicht, weil ich arbeiten muss.*"
        set:
          view: sentence
          rows:
            - de:
                - Ich
                - kann
                - nicht, weil ich arbeiten muss.
                - ""
              ru: Я не могу, потому что должен работать.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Где стоит muss после weil?
        read: "В конце: *weil ich arbeiten muss*. Если сказать *weil ich muss arbeiten*, получится
          порядок главного предложения. В этой теме тренируем стандартную письменную модель.
          После *denn* порядок другой: *denn ich muss arbeiten*. Сначала определите союз, затем
          собирайте оставшуюся часть."
        point: "*weil … arbeiten muss*, но *denn … muss arbeiten*."
        set:
          view: table
          table: rule
      - question: Отказ от субботы означает отказ от всей поездки?
        read: Нет. Матео назвал ограничение субботы, а на воскресенье согласился. В живом разговоре
          полезно предложить другой день и спросить *Passt das?*. Подходящий ответ сохраняет
          общий замысел, но меняет условие, которое не устраивает собеседника.
        point: Уточняйте ограничение и предлагайте альтернативу.
        set:
          view: table
          table: rule
  - id: exam-plan
    chapter: exam
    title: Unser Sonntagsplan
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: plan
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
