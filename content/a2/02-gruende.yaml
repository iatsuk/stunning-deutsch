adventure:
  kind: sequence
  title: Согласуйте первый выходной
  intro: Для первой поездки команда выбирает пляж или кафе в Эккернфёрде. У друзей разные желания
    и свободное время. Нужно не просто сказать «нет», а объяснить причину и предложить
    подходящий вариант.
  ending: Воскресенье выбрано по общему времени, причины сохранены, завтрак и прогулка
    объединены. Дальше нужно распределить вещи между участниками.
  challenges:
    - id: day
      kind: select
      title: Найдите общий день
      intro: Учитывайте рабочий день Матео.
