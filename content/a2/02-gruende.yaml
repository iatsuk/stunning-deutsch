id: a2-gruende
order: 2
title: Warum fahren wir nach Eckernförde?
ru: Выбор с объяснением
lede: Для первой поездки команда выбирает пляж или кафе в Эккернфёрде. У друзей разные желания
  и свободное время. Нужно не просто сказать «нет», а объяснить причину и предложить подходящий
  вариант.
goals:
  - Понять, почему собеседнику не подходит предложение
  - Соединить решение и причину с weil
  - Сделать предложение и согласовать альтернативу
  - Написать короткий ответ по трём выбранным пунктам
grammar:
  - "weil: причина и глагол в конце"
exam:
  - a2-lesen-2
  - a2-schreiben-2
  - a2-sprechen-3
dialogues:
  scene:
    title: Warum fahren wir nach Eckernförde?
    ru: Выбор с объяснением
    place: Kiel · план поездки в Eckernförde · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Fahren wir am Samstag nach Eckernförde?
        ru: Поедем в субботу в Эккернфёрде?
      - M: Am Samstag kann ich nicht, weil ich arbeiten muss.
        ru: В субботу я не могу, потому что должен работать.
      - E: Dann fahren wir am Sonntag. Möchtest du an den Strand?
        ru: Тогда поедем в воскресенье. Хочешь на пляж?
      - M: Ja, gern. Ich möchte aber auch ins Café, weil ich dort frühstücken möchte.
        ru: Да, с удовольствием. Но хочу и в кафе, потому что хочу там позавтракать.
      - H: Wir können zuerst frühstücken und danach spazieren gehen.
        ru: Сначала можем позавтракать, потом погулять.
      - D: Gut. Wir fahren mit dem Zug, weil wir kein Auto haben.
        ru: Хорошо. Поедем поездом, потому что у нас нет машины.
      - E: Und wann treffen wir uns?
        ru: А когда встречаемся?
      - H: Am Sonntag um neun am Bahnhof. Passt das?
        ru: В воскресенье в девять у вокзала. Подходит?
