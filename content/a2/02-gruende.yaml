    part: a2-schreiben-2
    title: Antwort an Elif
    situation: Elif fragt nach Ihrem Ausflug. Wählen Sie drei von vier Punkten. Schreiben Sie circa
      40 Wörter, mit Anrede und Gruß.
    from: Elif
    text: Hallo! Kommen wir am Wochenende zusammen weg? Schreib mir bitte deinen Vorschlag!
