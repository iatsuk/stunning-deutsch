    Вывод зависит от языка, а не от личности автора.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Ich fahre am Sonntag mit, weil ich am Samstag arbeiten muss.
          ru: Я поеду в воскресенье, потому что в субботу должен работать.
      question: Почему выбран другой день?
      options:
        - Работа в субботу
        - Работа в воскресенье
        - Нет поезда
      answer: 0
      right: Причина названа в придаточном с *weil*.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
