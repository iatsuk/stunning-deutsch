    title: Unser Sonntagsplan
    from: Hauke
    text: Mateo arbeitet am Samstag. Am Sonntag hat er frei. Dana möchte frühstücken, Elif möchte
      spazieren gehen. Wir treffen uns am Sonntag um neun am Bahnhof. Zuerst gehen wir ins
