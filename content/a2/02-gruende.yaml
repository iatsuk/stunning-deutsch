          ru: Сначала идём в кафе. Затем на пляж.
      question: Что запланировано?
      options:
        - Только кафе
        - Оба занятия по очереди
        - Выбор ещё не сделан
      answer: 1
      right: "*Zuerst / danach* объединяют занятия в последовательность."
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
