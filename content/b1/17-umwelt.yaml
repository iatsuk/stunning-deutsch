tasks:
  headlines:
    kind: worksheet
    part: b1-lesen-1
    format: matching
    uniqueOptions: true
    title: Fünf Alltagstexte, zehn Überschriften
    text: >-
      1) Nora nimmt ihren Becher gern selbst mit. Für sie ist wichtig, dass sie unterwegs nicht
      jedes Mal einen neuen braucht. Wenn sie ihn zu Hause vergisst, kauft sie trotzdem ein
      Getränk. Eine Gewohnheit soll ihr helfen und nicht den ganzen Tag bestimmen.


      2) Jonas fährt oft mit dem Fahrrad. Bei starkem Regen oder viel Gepäck nimmt er den Bus.
      Er findet es sinnvoll, eine Alternative zu haben. Für einen gemeinsamen Ausflug möchte er
      vorher wissen, ob alle den Weg gut schaffen können.


      3) Karin plant Essen gern gemeinsam. Sie bietet sowohl ein vegetarisches Gericht als auch
      Wasser und Tee an. Trotzdem sollen Gäste selbst entscheiden, was sie mögen. Wer nur
      Wasser trinkt, muss nichts erklären. Eine Auswahl ist für sie eine Einladung und keine
      Pflicht.


      4) Ben leiht Dinge lieber aus, wenn er sie nur selten braucht. Für ein kleines Treffen
      holt er Becher bei einem Nachbarn. Dafür muss er die Rückgabe zuverlässig planen. Der
      niedrige Preis allein reicht ihm nicht, wenn die Abholung zu viel Zeit kostet.


      5) Eine Gruppe vergleicht vor einem Fest unterschiedliche Wünsche. Eine Person möchte
      günstig einkaufen, eine andere wenig tragen. Sie wählen einen Plan, der beides
      berücksichtigt. Dabei behaupten sie nicht, für jede Veranstaltung dieselbe beste Lösung
      gefunden zu haben.
    questions:
      - prompt: Text 1
        options:
          - Eine hilfreiche Gewohnheit ohne Zwang
          - Ein anderer Weg bleibt möglich
          - Auswahl anbieten und Vorlieben respektieren
          - Ausleihen braucht auch einen Rückgabeplan
          - Mehrere Bedürfnisse gemeinsam beachten
          - Nie wieder ein Getränk kaufen
          - Radfahren muss für alle passen
          - Jeder muss Wasser und Tee trinken
