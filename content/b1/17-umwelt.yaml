spy:
  - de: "Wir nehmen entweder den Bus oder das Fahrrad."
    wrong: "Wir nehmen entweder den Bus und das Fahrrad."
    why: "Парный союз: *entweder … oder*."
  - de: "Wir brauchen sowohl die Mappe als auch die Becher."
    wrong: "Wir brauchen sowohl die Mappe oder die Becher."
    why: "Парный союз: *sowohl … als auch*."
  - de: "Wir bieten sowohl Wasser als auch Tee an."
    wrong: "Wir anbieten sowohl Wasser als auch Tee."
    why: "Отделяемая приставка уходит в конец: *bieten … an*."
  - de: "Elif hat die Becher bereits abgeholt."
    wrong: "Elif hat die Becher bereits geabholt."
    why: "У отделяемого глагола *ge-* стоит внутри слова: *abgeholt*."

exercises:
  - type: choice
    q: Entweder Bus ___ Fahrrad.
    options:
      - auch
      - oder
      - als
    answer: 1
    why: Парная альтернатива.
  - type: choice
    q: Sowohl Wasser ___ auch Tee.
    options:
      - aber
      - als
      - oder
    answer: 1
    why: Sowohl ... als auch.
  - type: choice
    q: Wir bieten sowohl Wasser als auch Tee ___.
    options:
      - zu
      - mit
      - an
    answer: 2
    why: Anbieten — отделяемая рамка.
  - type: choice
    q: Нужны и папка, и стаканы. Только папка подходит?
    options:
      - Только в автобусе
      - Нет
      - Да
    answer: 1
    why: Обязательны оба предмета.
  - type: choice
    q: Два напитка предлагаются, значит каждый пьёт оба?
    options:
      - Только гости
      - Нет
      - Да
    answer: 1
    why: Предложение не равно действию гостя.
  - type: choice
    q: 70 базовых + 8 на транспорт при бюджете 80…
    options:
      - Не подходит
      - Ровно 80
      - Подходит
    answer: 2
    why: 78 меньше 80.
  - type: order
    de: Wir nehmen entweder den Bus oder das Fahrrad.
    ru: Возьмём либо автобус, либо велосипед.
    also: ["Wir nehmen entweder das Fahrrad oder den Bus.", "Entweder nehmen wir den Bus oder das Fahrrad.", "Entweder nehmen wir das Fahrrad oder den Bus.", "Entweder den Bus oder das Fahrrad nehmen wir."]
  - type: order
    de: Wir brauchen sowohl die Mappe als auch die Becher.
    ru: Нам нужны и папка, и стаканы.
    also: ["Wir brauchen sowohl die Becher als auch die Mappe.", "Sowohl die Mappe als auch die Becher brauchen wir."]
  - type: order
    de: Wir bieten sowohl Wasser als auch Tee an.
    ru: Мы предлагаем и воду, и чай.
    also: ["Wir bieten sowohl Tee als auch Wasser an.", "Sowohl Wasser als auch Tee bieten wir an."]
  - type: order
    de: Jeder Gast kann selbst entscheiden.
    ru: Каждый гость может решить сам.
    also: ["Selbst entscheiden kann jeder Gast."]
  - type: order
    de: Elif hat die Becher bereits abgeholt.
    ru: Элиф уже получила стаканы.
    also: ["Die Becher hat Elif bereits abgeholt.", "Elif hat bereits die Becher abgeholt."]
  - type: order
    de: Wir planen sowohl die Abholung als auch die Rückgabe.
    ru: Мы планируем и получение, и возврат.
    also: ["Wir planen sowohl die Rückgabe als auch die Abholung.", "Sowohl die Abholung als auch die Rückgabe planen wir."]
case:
  title: "Beides anbieten heißt nicht: Alle müssen beides nehmen"
  ru: Сверка дневника
  intro: Проверьте предмет альтернативы, реальный статус стаканов и выбор гостя.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Für den Materialtransport entweder Bus oder Fahrrad. Sowohl Mappe als auch Becher müssen
            mit.
          ru: Для доставки либо автобус, либо велосипед. Нужны и папка, и стаканы.
      question: Какой полный набор допустим?
      options:
        - Только папка
        - Велосипед, папка и стаканы
        - Автобус и велосипед без стаканов
      answer: 1
      right: Одно средство и оба предмета.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: "Elif: Die Mehrwegbecher habe ich abgeholt. Sie sind jetzt bei mir."
          ru: "Элиф: Стаканы я получила. Они теперь у меня."
      question: Получение ещё только обещано?
      options:
        - Нет, подтверждено выполнение
        - Да
        - Они потеряны
      answer: 0
      right: Есть сообщение о выполненном действии.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wir bieten sowohl Wasser als auch Tee an. Jeder kann wählen.
          ru: Предлагаем и воду, и чай. Каждый может выбрать.
      question: Гость обязан пить оба?
      options:
        - Да
        - Только если пришёл на велосипеде
        - Нет
      answer: 2
      right: Anbieten описывает доступные варианты.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Сохранены обязательные материалы, допустимый выбор и подтверждённое получение.
    Предпочтения не стали выдуманными обязанностями.
adventure:
  kind: sequence
  title: Одно средство, оба материала, разные вкусы
  intro: Элиф уже получила многоразовые стаканы. Теперь команда выбирает, как доставить их и
    фотографии к Raum C. Люди по-разному относятся к транспорту и еде. Нужно предложить выбор,
    сохранить обязательный набор материалов и не объявлять личное предпочтение правилом для
    всех.
  ending: Выбран один подходящий способ доставки с обоими материалами. Стаканы уже получены, а
    возврат запланирован на понедельник. Предложение воды и чая оставляет гостям личный выбор.
  challenges:
    - id: logic
      kind: match
      title: Альтернатива или добавление?
      intro: Определите, какие элементы связывает конструкция.
      slots:
        - id: a
          label: entweder Bus oder Fahrrad
          answer: one
        - id: b
          label: sowohl Mappe als auch Becher
          answer: both
        - id: c
          label: entweder Montag oder Dienstag
          answer: one
      options:
        - id: one
          label: альтернатива в этом выборе
        - id: both
          label: оба элемента
      success: Различены два способа связи.
      wrong: Entwederoder предлагает альтернативы; sowohlalsauch добавляет оба.
    - id: drinks
      kind: order
      title: Предложите два напитка
      intro: Сохраните рамку anbieten.
      label: Реплика для команды
      tokens:
        - Wir bieten
        - sowohl Wasser
        - als auch Tee
        - an.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: kit
      kind: pack
      title: Соберите доставку материалов
      intro: Ровно одно средство доставки; обязательно и папка, и стаканы. Учитывайте общие 80 евро.
      mode: reading
      clue:
        task: plan
      options:
        - id: bus
          label: Bus · 8 €
        - id: bike
          label: Fahrrad · 0 €
        - id: mappe
          label: Fotomappe
        - id: becher
          label: Mehrwegbecher
      answer:
        - bus
        - mappe
        - becher
      alternatives:
        - - bike
          - mappe
          - becher
      success: Один транспорт и оба материала. Сумма укладывается в 80.
      wrong: Не берите оба транспорта и не оставляйте один из материалов.
    - id: meaning
      kind: select
      title: Что важно четвёртому автору?
      intro: Прочитайте четвёртый текст.
      mode: reading
      clue:
        task: headlines
      options:
        - id: o0
          label: Учесть получение и возврат одолженных вещей
        - id: o1
          label: Смотреть только на самую низкую цену
        - id: o2
          label: Покупать всё новое
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: guest
      kind: negotiation
      title: Не превращайте выбор в обязанность
      intro: Гость выбирает один напиток.
      start: a
      nodes:
        - id: a
          text: "Gast: Ich trinke keinen Tee. Muss ich hier beides nehmen?"
          choices:
            - label: Nein. Wir bieten beides an, aber Sie können selbst wählen.
              next: b
              feedback: Уточнено значение предложения двух вариантов.
        - id: b
          text: "Gast: Dann nehme ich gern nur Wasser."
          choices:
            - label: Gern. Das passt genauso.
              next: end
              feedback: Предпочтение принято без дополнительного условия.
        - id: end
          text: "Gast: Danke, jetzt habe ich das Angebot verstanden."
          terminal: true
          choices: []
      success: Оба напитка доступны, выбор гостя сохранён.
      wrong: Предлагать два варианта не означает требовать оба.
