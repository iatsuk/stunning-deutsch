  voices:
    kind: worksheet
    part: b1-hoeren-1
    format: article
    title: Fünf persönliche Gewohnheiten
    recordings:
      - voice: Anna
        text: Ich gehe im Alltag viel zu Fuß. Wenn ich schwere Sachen mitnehme, wähle ich aber ein
          anderes Verkehrsmittel. Mir hilft ein Plan, der sowohl die Zeit als auch das Gepäck
          berücksichtigt.
      - voice: Reed
        text: Beim gemeinsamen Essen möchte ich eine Auswahl anbieten. Ich koche oft vegetarisch.
          Trotzdem verlange ich nicht, dass alle Menschen immer genau wie ich essen. Ich frage
          lieber nach den Wünschen der Gruppe.
      - voice: Flo
        text: Für seltene Treffen leihe ich Becher aus. Dafür brauche ich einen klaren Rückgabetermin.
          Wenn die Abholung überhaupt nicht in meinen Alltag passt, suche ich eine andere
          Lösung statt einfach zuzusagen.
      - voice: Grandpa
        text: Ich fahre gern mit dem Fahrrad, aber nicht bei jedem Wetter. Für den Transport großer
          Sachen nehme ich manchmal den Bus. Eine Alternative zu haben, ist mir wichtiger als
          immer bei einer einzigen Gewohnheit zu bleiben.
      - voice: Shelley
        text: Ich finde kleine Schritte im Alltag hilfreich. Bei einem Fest muss für mich nicht alles
          perfekt sein. Wichtig ist, dass die Gruppe zuverlässig zusammenarbeitet und die
          geliehenen Dinge wieder zurückbringt.
