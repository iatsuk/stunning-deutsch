id: b1-umwelt
order: 17
title: Wir bieten sowohl Wasser als auch Tee an.
ru: Соединяем альтернативы и совместные требования
lede: Элиф уже получила многоразовые стаканы. Теперь команда выбирает, как доставить их и
  фотографии к Raum C. Люди по-разному относятся к транспорту и еде. Нужно предложить выбор,
  сохранить обязательный набор материалов и не объявлять личное предпочтение правилом для всех.
goals:
  - Различить альтернативу и добавление двух условий
  - Собрать один из допустимых наборов
  - Передать мнение с примером
  - Уважить различие потребностей при совместном плане
grammar:
  - entweder … oder / sowohl … als auch
exam:
  - b1-lesen-1
  - b1-lesen-2
  - b1-sprachbausteine-2
  - b1-hoeren-1
  - b1-sprechen-2
dialogues:
  scene:
    title: Wir bieten sowohl Wasser als auch Tee an.
    ru: Соединяем альтернативы и совместные требования
    place: Kiel · транспорт, напитки и многоразовые вещи · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - E: Die Mehrwegbecher habe ich abgeholt. Sie sind jetzt bei mir.
        ru: Многоразовые стаканы я получила. Теперь они у меня.
      - H: Für den Materialtransport nehmen wir entweder den Bus oder das Fahrrad.
        ru: Для перевозки материалов возьмём либо автобус, либо велосипед.
      - D: Wir brauchen sowohl die Fotomappe als auch die Becher.
        ru: Нам нужны и папка с фотографиями, и стаканы.
      - M: Beim Treff bieten wir sowohl Wasser als auch Tee an.
        ru: На встрече предложим и воду, и чай.
      - E: Dann muss aber niemand beides trinken. Jeder kann wählen.
        ru: Но никому не нужно пить и то и другое. Каждый может выбрать.
      - D: Genau. Ein Angebot mit zwei Möglichkeiten ist keine Pflicht für jeden Gast.
        ru: Верно. Предложение двух вариантов не является обязанностью для каждого гостя.
      - H: Raum und Essen kosten zusammen siebzig Euro. Für den Transport bleiben höchstens zehn.
        ru: Помещение и еда вместе стоят семьдесят евро. На перевозку остаётся не больше десяти.
      - M: Gut. Dann passen beide Wege, wenn alle Materialien mitkommen.
        ru: Хорошо. Тогда подходят оба способа, если все материалы будут доставлены.
