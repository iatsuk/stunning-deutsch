  opinions:
    kind: card
    part: b1-sprechen-2
    title: Was passt in Ihren Alltag?
    theme: Gewohnheit und praktische Möglichkeit
    word: Meinung · Beispiel · Grenze · Nachfrage
    situation: Geben Sie die Position wieder und vergleichen Sie mit Ihrem Alltag. Fragen Sie, wann
      eine gute Gewohnheit für den Partner schwierig wird.
    roles:
      - title: Person A · Nora
        text: Ich leihe gern Dinge aus, statt sie nur für einen Abend zu kaufen. Dafür plane ich sowohl
          die Abholung als auch die Rückgabe. Ohne diese Organisation wird aus der guten Idee
          schnell eine zusätzliche Belastung.
      - title: Person B · Jonas
        text: Ich möchte im Alltag flexibel bleiben. Entweder gehe ich zu Fuß oder ich nehme den Bus;
          das hängt von Zeit und Gepäck ab. Eine Regel, die für einen Menschen gut passt, muss
          nicht für alle gleich praktisch sein.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Элиф уже получила многоразовые стаканы. Теперь команда выбирает, как доставить их и
          фотографии к Raum C. Люди по-разному относятся к транспорту и еде. Нужно предложить
          выбор, сохранить обязательный набор материалов и не объявлять личное предпочтение
          правилом для всех. Все нужные условия даны в сцене: знания географии, настоящих цен
          или расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Соединяем альтернативы и совместные требования
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Парные союзы соединяют не только слова, но и требования задачи. Entweder ... oder
          разделяет альтернативы: в нашем плане нужно выбрать одно средство доставки. Sowohl
          ... als auch добавляет оба элемента: папку и стаканы. Но тот же союз в предложении
          напитков описывает доступный выбор, а не обязанность каждого выпить всё. Смысл
          зависит от действия, которое связывает элементы."
        point: entweder … oder / sowohl … als auch
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "В этой теме важны обычные решения для маленькой встречи: одолженные стаканы,
          своевременный возврат, посильная доставка и разные вкусы. Персонажи объясняют свои
          предпочтения как собственный опыт. Упражнения не требуют объявлять один способ
          передвижения лучшим для всех. В игре два набора выполняют условия, поэтому нужно
          проверить весь состав, а не угадывать любимый вариант автора."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: entweder … oder / sowohl … als auch
    beats:
      - read: "Парные части показывают два варианта одного решения. В нашей игре требуется ровно одно
          средство перевозки, поэтому нельзя выбрать одновременно автобус и велосипед. Сначала
          найдите, к какому действию относятся варианты. Не переносите это ограничение на всё
          сообщение: папка и стаканы соединены другим союзом и нужны вместе. У каждого
          требования свой смысл."
        point: "entweder … oder: альтернативы; здесь выбираем одну."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Эта конструкция добавляет два элемента без выбора одного вместо другого. В материальном
          наборе нужны оба. Пропуск слова auch делает привычную парную модель неполной.
          Сравните с напитками: *Wir bieten sowohl Wasser als auch Tee an* означает наличие
          обоих предложений, но не обязывает одного гостя выбрать оба напитка. Найдите основной
          глагол до вывода."
        point: "sowohl … als auch: оба названных элемента."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Порядок главного предложения сохраняется: wir bieten ... an. Оба объекта находятся
          внутри одной рамки. Не переносите личный глагол в конец только потому, что встретили
          союз: это правило придаточных, например с obwohl. В нашей схеме действие предлагают
          гостям, а парные слова соединяют два дополнения. Сначала соберите простую рамку,
          потом добавьте второй элемент."
        point: Парные союзы не превращают часть в придаточную.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Глагол anbieten отделяемый: bieten стоит вторым, an закрывает рамку. Между ними
          находятся оба напитка с парным союзом. Если один элемент удалить, предложение уже не
          передаст полный набор предложения. Но гостю по-прежнему можно выбрать только воду:
          грамматика описывает наличие вариантов на столе, а не действие каждого человека."
        point: "*Wir bieten sowohl Wasser als auch Tee an.*"
        set:
          view: sentence
          rows:
            - de:
                - Wir bieten
                - sowohl Wasser
                - als auch Tee
                - an.
              ru: Мы предлагаем и воду, и чай.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: В наборе нужны sowohl Mappe als auch Becher. Можно взять только папку?
