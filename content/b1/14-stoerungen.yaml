case:
  title: "Absage heißt nicht: Alles ist abgesagt"
  ru: Сверка дневника
  intro: В дневнике перепутали предмет отмены, старое время и место встречи.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die Bootsfahrt um elf wurde abgesagt. Über andere Fahrten steht nichts in der Nachricht.
          ru: Отменили катер в 11. О других поездках ничего не сказано.
      question: Что можно уверенно записать?
      options:
        - Все автобусы отменены
        - Отменена названная прогулка
        - Весь порт закрыт
      answer: 1
      right: Границы сообщения названы прямо.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die Tickets wurden bereits erstattet.
          ru: Оплату билетов уже вернули.
      question: Возврат ещё только обещают?
      options:
        - Нет, сообщают о выполненном возврате
        - Да
        - Он заменяет билет в музей
      answer: 0
      right: Bereits и прошедшее действие сообщают результат.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Bus 15:40, Hafenstraße. Gruppe 15:25 am Halt.
          ru: Автобус 15:40, Hafenstraße. Группа у остановки 15:25.
      question: Где и когда собирается группа?
      options:
        - Markt в 15:10
        - В Raum C в 11:00
        - Hafenstraße в 15:25
      answer: 2
      right: Приход группы отделён от отправления и старого плана.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Исправлены предмет отмены, статус возврата и новый маршрут. В проектный дневник не
    перенесены изменения из другой поездки.
adventure:
  kind: sequence
  title: Спасите день после отмены
  intro: В учебной поездке в Бюзум запланированную прогулку на катере отменили из-за сильного
    ветра. Друзья уже получили сообщение о возврате билетов, но новый дневной план нужно
    согласовать. Встреча FördeTreff в Киле остаётся в подтверждённом Raum C и к этой отмене не
    относится.
  ending: Отмена одной прогулки не отменила весь день. Запасной план согласован, группе переданы
    новый Halt Hafenstraße и автобус 15:40. Подтверждённая встреча в Raum C остаётся без
    изменений.
  challenges:
    - id: scope
      kind: select
      title: Что отменено по источнику?
      intro: Не расширяйте сообщение на все услуги города.
      mode: reading
      clue:
        task: update
      options:
        - id: o0
          label: Прогулка на катере в 11:00
        - id: o1
          label: Все поездки города
        - id: o2
          label: Встреча в Raum C
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: number
      kind: match
      title: Согласуйте прошедшее действие
      intro: Найдите форму по числу предмета.
      slots:
        - id: a
          label: Die Fahrt … abgesagt.
          answer: one
        - id: b
          label: Die Tickets … erstattet.
          answer: many
        - id: c
          label: Die Haltestelle … verlegt.
          answer: one
      options:
        - id: one
          label: wurde
        - id: many
          label: wurden
      success: Wurde и wurden согласованы с подлежащим.
      wrong: Одна поездка и одна остановка; несколько билетов.
    - id: past
      kind: order
      title: Передайте уже принятое изменение
      intro: Соберите Passiv Präteritum.
      label: Реплика для команды
      tokens:
        - Die Bootsfahrt
        - wurde
        - wegen des Windes
        - abgesagt.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: bus
      kind: clock
      title: Установите новое время автобуса
      intro: Учитывайте, что старое время заменено.
      mode: reading
      clue:
        task: update
      answer: 15:40
      initial: 15:10
      minuteStep: 5
      success: Новое время 15:40, приход группы 15:25.
      wrong: 15:10 было старым временем.
    - id: talk
      kind: negotiation
      title: Согласуйте запасной план и уведомление
      intro: Учтите просьбу о паузе и обратное время.
      start: a
      nodes:
        - id: a
          text: "Mateo: Ich brauche zuerst eine warme Pause. Danach können wir gern ins Museum."
          choices:
            - label: Dann zuerst Café, danach Museum. Zusammen sind das 14 Euro.
              next: b
              feedback: Просьба о паузе и бюджет учтены.
        - id: b
          text: "Elif: Gut. Wer informiert die Gruppe über den neuen Bus?"
          choices:
            - label: "Ich schreibe allen: 15:25 Hafenstraße, Abfahrt 15:40."
              next: end
              feedback: Переданы место, приход группы и отправление.
        - id: end
          text: "Elif: Einverstanden. Dann warten wir nicht am alten Halt."
          terminal: true
          choices: []
      success: Новый план и информация согласованы.
      wrong: Сохраните паузу, бюджет и новый Halt.
