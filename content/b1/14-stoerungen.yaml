steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "В учебной поездке в Бюзум запланированную прогулку на катере отменили из-за сильного
          ветра. Друзья уже получили сообщение о возврате билетов, но новый дневной план нужно
          согласовать. Встреча FördeTreff в Киле остаётся в подтверждённом Raum C и к этой
          отмене не относится. Все нужные условия даны в сцене: знания географии, настоящих цен
          или расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Рассказываем об отмене и находим замену
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "В предыдущей главе Passiv описывал происходящее: wird renoviert. Здесь речь о уже
          принятом изменении: wurde abgesagt. Wurde и wurden показывают прошлое время, а
          причастие называет действие. Важно отдельно понять границы сообщения. Отмена нашей
          прогулки на катере не доказывает, что закрыт весь порт, отменены все автобусы или
          изменена встреча в Киле."
        point: "Passiv Präteritum: wurde / wurden + Partizip II"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Объявления об отменах содержат несколько связанных сведений: что отменили, вернули ли
          оплату, куда идти и какое время теперь действует. Эти условия в уроке вымышлены.
          Слова морской поездки нужны для обычных действий путешественника: выбрать тёплую
          паузу, договориться о музее, предупредить друзей и вовремя прийти к автобусу."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Passiv Präteritum: wurde / wurden + Partizip II"
    beats:
      - read: "Вспомогательный глагол werden переходит в Präteritum: wurde. Причастие abgesagt
          сохраняется. Сравните *Die Fahrt wird abgesagt* и *Die Fahrt wurde abgesagt*. Вторая
          форма сообщает о прошлом действии, но сама по себе не говорит, вернули ли деньги или
          предложили замену. Для этих выводов нужны отдельные сведения источника."
        point: "Прошлое Passiv: wurde + Partizip II."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: Число подлежащего остаётся важным в прошлом времени. Одна Fahrt wurde abgesagt, несколько
          Tickets wurden erstattet. Причастие не меняется из-за числа. Если в сообщении много
          деталей, сначала выделите предмет каждого действия. Тогда будет легче не перепутать
          отменённую услугу с возвращёнными билетами или перенесённой остановкой.
        point: "Множественное число: wurden, не wurde."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "В знакомом рассказе из Экенфьорде *Es wurde heller* означало «стало светлее». Причастия
          действия там нет: heller — сравнительная форма прилагательного. В *wurde abgesagt*
          есть Partizip II, поэтому конструкция пассивная. Смотрите на вторую часть рамки, а не
          только на одно слово wurde. Так вы различите изменение состояния и действие над
          предметом."
        point: "Не каждое wurde — Passiv: ищите Partizip II."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Автобус — предмет изменения, wurde показывает прошлое время, verschoben называет перенос.
          Между ними стоит новое время. Старое значение не нужно сохранять как действующее,
          если источник прямо заменяет его новым. В игре затем установите часы на 15:40, а в
          разговоре отдельно согласуйте более раннее прибытие группы к остановке.
        point: "*Der Bus wurde auf fünfzehn Uhr vierzig verschoben.*"
        set:
          view: sentence
          rows:
            - de:
                - Der Bus
                - wurde
                - auf fünfzehn Uhr vierzig
                - verschoben.
              ru: Автобус перенесли на 15:40.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Wurde всегда означает, что действие пассивное?
        read: "Нет. Сравните *Es wurde heller* и *Die Fahrt wurde abgesagt*. В первом случае сообщают
          об изменении состояния, во втором — о действии над поездкой. Найдите причастие,
          которое закрывает рамку Passiv. Если его нет, не определяйте конструкцию только по
          вспомогательному слову: нужен смысл всего предложения."
        point: Проверяем всю рамку, включая причастие.
        set:
          view: table
          table: rule
      - question: Отмена катера в 11:00 доказывает отмену всех прогулок?
        read: Нет. Сообщение ограничено нашей поездкой и её временем. О других рейсах в источнике
          ничего не сказано. Нельзя расширять один факт до всего дня или города. Для нового
          плана достаточно знать, что исходный пункт недоступен, а музей, кафе и автобус
          описаны отдельно. Их статус проверяется по собственным сообщениям.
        point: У изменения есть точный предмет и границы.
        set:
          view: table
          table: rule
  - id: exam-update
    chapter: exam
    title: Nachrichten zur Fahrt · Ausschnitt
    beats:
      - read: "Найдите отдельный статус каждого пункта: отменённый катер, возвращённая оплата, открытый
          музей и изменённый автобус. Сравните старое и новое время. Карточка даёт данные для
          игры, а не настоящие расписания Бюзума. Для общего плана важно не только куда пойти,
          но и когда предупредить остальных участников."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: update
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: update
        set:
          view: task
          task: update
          solved: true
  - id: exam-gaps
    chapter: exam
    title: Ein Bericht über die Änderungen
    beats:
      - read: "Рассказ связывает прошлые изменения и обычные причины. Для двух первых пропусков
          определите число подлежащего. Потом сравните уступку, причину и две разные формы
          связи с главной частью. Выбор должен сохранить понятную историю: несмотря на отмену,
          у группы был хороший день. В конце проверьте порядок слов, а не только знакомое
          окончание."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: gaps
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: gaps
        set:
          view: task
          task: gaps
          solved: true
  - id: exam-notices
    chapter: exam
    title: Fünf Mitteilungen aus Büsum
    beats:
      - read: Слушайте пять сообщений дважды. Формулировка о переносе экскурсии по музею не обязательно
          закрывает весь музей. Аналогично возврат оплаты может уже быть выполнен, а не
          требовать нового посещения кассы. Ищите подтверждение каждого утверждения в
          соответствующей записи. Учебный текст открывайте после своей попытки.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: notices
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: notices
        set:
          view: task
          task: notices
          solved: true
  - id: exam-talk
    chapter: exam
    title: Nach einer Absage gemeinsam weiterplanen
    beats:
      - read: "Сообщите партнёру об отмене и новом автобусе. Затем предложите выполнимую
          последовательность, учитывая просьбу о тёплой паузе. В итоге назовите место и время
          встречи группы и того, кто её предупредит. Расходы считайте вместе: музей и кафе
          стоят четырнадцать, а не только стоимость одного пункта."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: talk
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: talk
        set:
          view: task
          task: talk
          solved: true
spy:
  - de: "Die Fahrt wurde gestern abgesagt."
    wrong: "Die Fahrt wird gestern abgesagt."
    why: "*gestern* — прошлое, нужна форма *wurde*."
  - de: "Die Tickets wurden bereits erstattet."
    wrong: "Die Tickets wurde bereits erstattet."
    why: "Подлежащее во мн. ч.: *wurden*."
  - de: "Die Haltestelle wurde verlegt."
    wrong: "Die Haltestelle wurde verlegte."
    why: "В Passiv нужно причастие: *verlegt*."
  - de: "Die Bootsfahrt wurde wegen des Windes abgesagt."
    wrong: "Die Bootsfahrt wurde wegen das Windes abgesagt."
    why: "*wegen* требует родительного падежа: *des Windes*."

