id: b1-stoerungen
order: 14
title: Die Fahrt wurde abgesagt. Wir ändern den Plan.
ru: Рассказываем об отмене и находим замену
lede: В учебной поездке в Бюзум запланированную прогулку на катере отменили из-за сильного
  ветра. Друзья уже получили сообщение о возврате билетов, но новый дневной план нужно
  согласовать. Встреча FördeTreff в Киле остаётся в подтверждённом Raum C и к этой отмене не
  относится.
goals:
  - Понять уже произошедшее изменение в Passiv Präteritum
  - Различить wurde и wurden
  - Отделить отмену одной услуги от остального дня
  - Передать обновлённый план и время возвращения
grammar:
  - "Passiv Präteritum: wurde / wurden + Partizip II"
exam:
  - b1-lesen-2
  - b1-sprachbausteine-1
  - b1-hoeren-3
  - b1-sprechen-3
dialogues:
  scene:
    title: Die Fahrt wurde abgesagt. Wir ändern den Plan.
    ru: Рассказываем об отмене и находим замену
    place: Büsum · порт и запасной маршрут · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - H: Die Bootsfahrt wurde wegen des starken Windes abgesagt.
        ru: Прогулку на катере отменили из-за сильного ветра.
      - D: Wurden die anderen Fahrten auch abgesagt?
        ru: Другие поездки тоже отменили?
      - H: Die Nachricht betrifft nur unsere Fahrt um elf. Über andere Fahrten steht dort nichts.
        ru: Сообщение касается только нашей прогулки в одиннадцать. О других ничего не сказано.
      - E: Die Tickets wurden bereits erstattet. Wir könnten stattdessen ins Museum gehen.
        ru: Деньги за билеты уже вернули. Вместо этого мы могли бы пойти в музей.
      - M: Ich brauche vorher eine warme Pause. Danach komme ich gern mit.
        ru: Сначала мне нужен тёплый перерыв. Потом с удовольствием пойду.
      - D: Der Rückfahrtbus wurde auf fünfzehn Uhr vierzig verschoben.
        ru: Обратный автобус перенесли на пятнадцать сорок.
      - H: Dann sollten wir um fünfzehn Uhr fünfundzwanzig an der neuen Haltestelle sein.
        ru: Тогда нам стоит быть на новой остановке в пятнадцать двадцать пять.
      - E: Gut. Wir informieren die Gruppe über die Änderung, bevor jemand zum alten Halt geht.
        ru: Хорошо. Сообщим группе об изменении, прежде чем кто-то пойдёт на старую остановку.
