adventure:
  kind: sequence
  title: Подготовьте запрос, на который можно ответить
  intro: Хауке готовит запрос на помещение для осенней встречи. Предлагаемый срок — воскресенье
    18 октября, 15–18 часов, 18 гостей. Это учебный календарь. Команда должна назвать условия и
    получить ответ, прежде чем сообщать гостям окончательный адрес.
  ending: В запросе есть цель, срок, число гостей и вопросы. Администрация получила письмо и
    проверяет условия. В дневнике отмечена отправка; место встречи пока не объявлено.
  challenges:
    - id: facts
      kind: pack
      title: Что обязательно включить?
      intro: Выберите три сведения о запросе.
      mode: reading
      clue:
        task: request
      options:
        - id: o0
          label: 18 гостей
        - id: o1
          label: 18 октября, 15–18
        - id: o2
          label: Запросить кухню и цену
        - id: o3
          label: Бесплатный зал уже получен
      answer:
        - o0
        - o1
        - o2
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: zu
      kind: order
      title: Сформулируйте намерение
      intro: Соберите предложение.
      label: Реплика для команды
      tokens:
        - Wir
        - haben vor,
        - ein Treffen
        - zu organisieren.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: parts
      kind: match
      title: Свяжите выражение и форму
      intro: Выберите продолжение.
      slots:
        - id: a
          label: Wir versuchen, die Anfrage …
          answer: zu
        - id: b
          label: Wir müssen die Anfrage …
          answer: plain
        - id: c
          label: Ich habe Zeit, das Programm …
          answer: prepare
      options:
        - id: zu
          label: zu schreiben
        - id: plain
          label: schreiben
        - id: prepare
          label: vorzubereiten
      success: Форма зависит от управляющего слова.
      wrong: После müssen нет zu; у vorbereiten оно внутри.
    - id: status
      kind: select
      title: Как обновить дневник?
      intro: Прочитайте полученный ответ.
      mode: reading
      clue:
        task: reply
      options:
        - id: o0
          label: Запрос получен; ждём условий
        - id: o1
          label: Помещение забронировано
        - id: o2
          label: Кухня бесплатна
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: guests
      kind: note
      title: Проверьте число перед отправкой
      intro: Введите число гостей из задания письма.
      mode: reading
      clue:
        task: request
      fields:
        - label: Zahl der Gäste
          answers:
            - "18"
            - achtzehn
      success: Число совпадает с запросом.
      wrong: В условии указано 18 гостей.
