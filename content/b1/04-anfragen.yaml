id: b1-anfragen
order: 4
title: Wir haben vor, ein Treffen zu organisieren.
ru: Запрашиваем помещение и уточняем условия
lede: Хауке готовит запрос на помещение для осенней встречи. Предлагаемый срок — воскресенье 18
  октября, 15–18 часов, 18 гостей. Это учебный календарь. Команда должна назвать условия и
  получить ответ, прежде чем сообщать гостям окончательный адрес.
goals:
  - Связать намерение с инфинитивом zu
  - Составить запрос с четырьмя обязательными пунктами
  - Отделить просьбу от подтверждения
  - Согласовать содержание письма
