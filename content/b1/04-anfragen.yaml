exercises:
  - type: choice
    q: Ich versuche, pünktlich ___ kommen.
    options:
      - um
      - "-"
      - zu
    answer: 2
    why: Versuchen + zu.
  - type: choice
    q: Wir müssen den Raum ___.
    options:
      - zu suchen
      - sucht
      - suchen
    answer: 2
    why: Модальный глагол без zu.
  - type: choice
    q: Ich habe Zeit, alles ___.
    options:
      - vorzubereiten
      - zu vorbereiten
      - vorbereite
    answer: 0
    why: Zu внутри отделяемого глагола.
  - type: choice
    q: Es ist wichtig, die Zahl ___ nennen.
    options:
