tasks:
  headlines:
    kind: worksheet
    part: b1-lesen-1
    format: matching
    uniqueOptions: true
    title: Fünf Texte über gute freie Zeit
    text: >-
      1) Nora besuchte Flensburg an einem grauen Sonntag. Obwohl es regnete, ging sie eine
      kurze Runde am Hafen. Danach saß sie lange im Café. Für sie war der Wechsel wichtig:
      frische Luft und eine warme Pause. Einen ganzen Tag draußen wollte sie nicht verbringen.


      2) Jonas wollte im Café Deutsch üben. Die Karte war in der erfundenen Situation
      zweisprachig, trotzdem fragte er auf Deutsch nach einer Empfehlung. Die Mitarbeiterin
      antwortete langsam. Er verstand nicht jedes Wort, konnte aber selbst bestellen. Perfekt
      musste das Gespräch für ihn nicht sein.


      3) Karin geht gern mit Freunden in Museen. Obwohl nicht alle dieselben Bilder mögen,
      findet sie gemeinsame Besuche interessant. Nachher sprechen sie über unterschiedliche
      Eindrücke. Für sie ist eine andere Meinung ein guter Anfang für ein Gespräch und kein
      Grund für Streit.


      4) Ben reist lieber mit wenig Programm. Früher wollte er jede freie Stunde nutzen.
      Trotzdem hatte er nach solchen Tagen oft das Gefühl, kaum etwas wirklich gesehen zu
      haben. Heute wählt er ein Ziel und lässt Zeit für eine Pause. Er kommt lieber noch einmal
      wieder.


      5) Eine kleine Gruppe testet vor der Ausstellung ihre Texte. Ein Gast kennt viele Orte
      der Region, ein anderer ist erst seit kurzem hier. Obwohl ihre Erfahrungen verschieden
      sind, finden beide dieselbe Kartenmarkierung schwer. Die Gruppe verbessert das Material,
      statt die Gäste miteinander zu vergleichen.
    questions:
      - prompt: Text 1
        options: &a1
          - Kurzer Hafenweg und warme Pause
          - Deutsch sprechen trotz einer Hilfe
          - Verschiedene Meinungen verbinden
          - Weniger Ziele, mehr Zeit
          - Ein Test zeigt eine konkrete Schwierigkeit
          - Ein ganzer Tag nur im Regen
          - Zweisprachige Karten verbieten Deutsch
          - Im Museum muss jeder dasselbe mögen
          - Jede Minute verplanen
          - Nur Ortskundige verstehen die Karte
        answers:
          - Kurzer Hafenweg und warme Pause
      - prompt: Text 2
        options: *a1
        answers:
          - Deutsch sprechen trotz einer Hilfe
      - prompt: Text 3
        options: *a1
        answers:
          - Verschiedene Meinungen verbinden
      - prompt: Text 4
        options: *a1
        answers:
          - Weniger Ziele, mehr Zeit
      - prompt: Text 5
        options: *a1
        answers:
          - Ein Test zeigt eine konkrete Schwierigkeit
  offers:
    kind: message
    part: b1-lesen-2
    title: Zwei Aktivitäten, zwei Pausen · Ausschnitt
    text: >-
      Hafenrunde: 20 Minuten, 0 Euro. Museum: 30 Minuten, 6 Euro. Café A: 20 Minuten, 8 Euro. Café B: 20 Minuten, 4 Euro. Wählen Sie genau eine Aktivität und genau eine Pause. Zeit höchstens 60 Minuten, Budget höchstens 10 Euro pro Person. Alle Angebote sind erfunden.
