adventure:
  kind: sequence
  title: Найдите подходящий план, а не единственный любимый
  intro: Во Фленсбурге друзья выбирают короткую прогулку у гавани, музей и кафе. Погода,
    усталость и разные интересы не дают одного идеального ответа. Нужно объяснить своё решение
    и услышать другое мнение. Цены, кафе и расписание внутри урока — вымышленные условия игры.
  ending: Выбран допустимый набор занятия и паузы. Разные предпочтения объяснены; погода и
    усталость сохранены в рассказе, а не вычеркнуты ради решения.
  challenges:
    - id: relations
      kind: match
      title: Причина или уступка?
      intro: Определите связь между частями.
      slots:
        - id: a
          label: Weil es regnet, bleibe ich drinnen.
          answer: cause
        - id: b
          label: Obwohl es regnet, gehe ich hinaus.
          answer: contrast
        - id: c
          label: Es regnet. Trotzdem gehe ich hinaus.
          answer: contrast
      options:
        - id: cause
          label: причина выбора
        - id: contrast
          label: действие вопреки обстоятельству
      success: Один факт может участвовать в разных смысловых связях.
      wrong: Weil объясняет причину; obwohl и trotzdem сохраняют препятствие.
    - id: trotzdem
      kind: order
      title: Сохраните дождь и решение
      intro: Две главные части.
      label: Реплика для команды
      tokens:
        - Es regnet.
        - Trotzdem
        - machen wir
        - eine kurze Runde.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: budget
      kind: pack
      title: Выберите занятие и тёплую паузу
      intro: Ровно одно занятие и одна пауза; не больше 60 минут и 10 евро. Все допустимые наборы
        принимаются.
      mode: reading
      clue:
        task: offers
      options:
        - id: harbor
          label: Hafenrunde · 20 мин · 0€
        - id: museum
          label: Museum · 30 мин · 6€
        - id: a
          label: Café A · 20 мин · 8€
        - id: b
          label: Café B · 20 мин · 4€
      answer:
        - harbor
        - a
      alternatives:
        - - harbor
          - b
        - - museum
          - b
      success: Полный набор укладывается и во время, и в бюджет.
      wrong: Нужны одно занятие и одна пауза. Музей с Café A превышает 10 евро.
    - id: main
      kind: select
      title: Что на самом деле важно пятому автору?
      intro: Прочитайте последний текст чтения.
      mode: reading
      clue:
        task: headlines
      options:
        - id: o0
          label: Исправить конкретную трудность карты
        - id: o1
          label: Сравнить способности двух гостей
        - id: o2
          label: Оставить всё без изменений
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: meaning
      kind: note
      title: Сохраните оба факта в заметке
      intro: Что сообщает «Obwohl ich müde bin»? Введите состояние Даны.
      fields:
        - label: Dana ist …
          answers:
            - müde
      success: Усталость остаётся фактом, несмотря на решение гулять.
      wrong: В исходной реплике Dana ist müde.
