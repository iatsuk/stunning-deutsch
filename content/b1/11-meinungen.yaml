id: b1-meinungen
order: 11
title: Obwohl es regnet, machen wir eine kurze Runde.
ru: Объясняем выбор и сравниваем мнения
lede: Во Фленсбурге друзья выбирают короткую прогулку у гавани, музей и кафе. Погода, усталость
  и разные интересы не дают одного идеального ответа. Нужно объяснить своё решение и услышать
  другое мнение. Цены, кафе и расписание внутри урока — вымышленные условия игры.
goals:
  - Выразить уступку с obwohl
  - Сохранить вторую позицию после trotzdem
  - Различить причину и препятствие
  - Принять несколько допустимых решений по бюджету
grammar:
  - "obwohl / trotzdem: уступка и неожиданный результат"
exam:
  - b1-lesen-1
  - b1-lesen-2
  - b1-sprachbausteine-1
  - b1-hoeren-1
  - b1-sprechen-2
dialogues:
  scene:
    title: Obwohl es regnet, machen wir eine kurze Runde.
    ru: Объясняем выбор и сравниваем мнения
    place: Flensburg · Hafen и тёплая пауза · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Obwohl ich müde bin, möchte ich noch eine kurze Runde am Hafen machen.
        ru: Хотя я устала, я хотела бы ещё немного пройтись у гавани.
      - M: Es regnet. Trotzdem möchtest du nach draußen?
        ru: Идёт дождь. И всё же ты хочешь на улицу?
      - D: Ja, aber nur zwanzig Minuten. Danach brauche ich eine warme Pause.
        ru: Да, но только на двадцать минут. Потом мне нужна тёплая пауза.
      - E: Ich gehe lieber ins Museum, weil ich die Bilder sehen möchte.
        ru: Я предпочитаю музей, потому что хочу увидеть картины.
      - H: Beides ist möglich. Wir vergleichen die Zeit und die Kosten.
        ru: Возможны оба варианта. Сравним время и стоимость.
      - M: Die Speisekarte im Café ist zweisprachig. Trotzdem bestelle ich auf Deutsch.
        ru: Меню в кафе двуязычное. И всё же я закажу на немецком.
      - E: Gut. Obwohl ich nicht alle Wörter kenne, frage ich selbst nach.
        ru: Хорошо. Хотя я знаю не все слова, спрошу сама.
      - H: Dann wählen wir einen Plan mit einer Pause, nicht möglichst viele Ziele.
        ru: Тогда выберем план с перерывом, а не как можно больше мест.
