  voices:
    kind: worksheet
    part: b1-hoeren-1
    format: article
    title: Was macht einen Ausflug gut?
    recordings:
      - voice: Anna
        text: Ich brauche nach einer Arbeitswoche Bewegung. Obwohl ich manchmal müde bin, gehe ich gern
          kurz ans Wasser. Danach tut mir eine ruhige Pause gut. Ein voller Tagesplan ist mir
          zu viel.
      - voice: Reed
        text: Wenn ich unterwegs bin, möchte ich etwas Neues probieren. Eine bekannte Speisekarte gibt
          mir Sicherheit. Trotzdem bestelle ich gern auf Deutsch und frage nach, wenn ich ein
          Wort nicht verstehe.
      - voice: Flo
        text: Für mich machen Menschen einen Ausflug besonders. Ich muss nicht jedes Museum sehen.
          Obwohl wir unterschiedliche Interessen haben, finde ich mit meinen Freunden meistens
          einen gemeinsamen Plan.
      - voice: Grandpa
        text: Ich reise gern langsam. Früher wollte ich viel an einem Tag sehen. Heute suche ich mir
          ein Ziel aus und bleibe länger dort. Eine zusätzliche Sehenswürdigkeit lasse ich ohne
          schlechtes Gefühl weg.
      - voice: Shelley
        text: Ein günstiger Ausflug ist für mich wichtig. Trotzdem wähle ich nicht automatisch das
          billigste Angebot. Wenn ein ruhiger Raum oder eine passende Uhrzeit etwas mehr
          kostet, kann das für mich sinnvoll sein.
    questions:
      - prompt: Die erste Person möchte nach der Arbeit einen vollen Tagesplan.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Die zweite Person bestellt gern auf Deutsch.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Die dritte Person verlangt von allen dieselben Interessen.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Die vierte Person nimmt sich heute mehr Zeit für ein Ziel.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Die fünfte Person wählt immer das billigste Angebot.
        options:
          - richtig
          - falsch
        answers:
          - falsch
  opinions:
    kind: card
    part: b1-sprechen-2
    title: Wie viel Programm brauchen Sie?
    theme: Freizeit planen
    word: Text wiedergeben · eigene Entscheidung · Nachfrage
    situation: Geben Sie die Position Ihrer Person wieder und sprechen Sie über eigene Erfahrungen.
      Reagieren Sie auf eine andere Vorliebe, ohne sie als Fehler zu behandeln.
    roles:
      - title: Person A · Nora
        text: Ich plane vor einer Reise gern genau. Dann verschwende ich vor Ort keine Zeit und weiß,
          wann ein Museum geöffnet ist. Trotzdem lasse ich eine Stunde frei. Wenn mir ein Café
          besonders gut gefällt, möchte ich länger bleiben können.
      - title: Person B · Jonas
        text: Ich plane wenig. Obwohl ich dadurch manchmal eine Ausstellung verpasse, entdecke ich oft
          etwas Unerwartetes. Nur die Rückfahrt prüfe ich vorher. Ohne Pause möchte ich keinen
          Ausflug machen.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Во Фленсбурге друзья выбирают короткую прогулку у гавани, музей и кафе. Погода,
          усталость и разные интересы не дают одного идеального ответа. Нужно объяснить своё
          решение и услышать другое мнение. Цены, кафе и расписание внутри урока — вымышленные
          условия игры. Все нужные условия даны в сцене: знания географии, настоящих цен или
          расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Объясняем выбор и сравниваем мнения
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: Уступка связывает обстоятельство и результат, который на его фоне может показаться
          неожиданным. Дана устала, но хочет короткую прогулку. Это не отменяет её усталость и
          не обязывает всех любить дождь. Obwohl вводит придаточную часть, trotzdem связывает
          главные предложения. Сначала определите две мысли, затем выберите конструкцию и
          порядок глагола.
        point: "obwohl / trotzdem: уступка и неожиданный результат"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Для общего решения нужны не только числа, но и личные потребности: отдых, интерес к
          картине, желание говорить самому. Подходящий вариант может быть не один. В игре
          каждый полный набор проверяется по условию: одно занятие, одна пауза и бюджет до
          десяти евро на человека. Любимый автором маршрут не становится единственным
          правильным."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "obwohl / trotzdem: уступка и неожиданный результат"
    beats:
      - read: "Усталость сохраняется как факт, но действие идёт вопреки обычному ожиданию. В части с
          obwohl личный глагол bin стоит в конце. Если всё придаточное стоит первым, главное
          предложение сразу начинается с личного глагола gehe. Не вставляйте второе подлежащее
          перед ним. Проверяйте обе стороны связи: обстоятельство не исчезает из-за
          неожиданного решения."
        point: "obwohl: личный глагол в конце придаточного."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Trotzdem не начинает придаточное предложение. В новой главной части после него стоит
          личный глагол, затем подлежащее: trotzdem gehe ich. По структуре это знакомая модель
          deshalb, но связь другая. Deshalb выражает следствие причины, trotzdem — действие
          вопреки обстоятельству. Выберите смысл до перестановки слов, иначе правильная форма
          может передать противоположную мысль."
        point: trotzdem занимает первую позицию; затем личный глагол.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: Дождь может объяснять решение остаться внутри. Тот же дождь может быть препятствием,
          несмотря на которое человек выходит. Поэтому один факт допускает разные решения и
          союзы. Нельзя решить задачу по слову regnet без остального предложения. Для
          собственного мнения объясните и обстоятельство, и выбранное действие, не объявляя
          другой вкус неправильным.
        point: Причина ведёт к действию; уступка показывает препятствие.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Две главные части передают уступку без obwohl. После точки начинается новая
          грамматическая рамка: trotzdem занимает место перед глаголом. Соберите *Trotzdem gehe
          ich* и только затем добавьте, куда и зачем. Это поможет не перенести в эту
          конструкцию порядок придаточного предложения, который вы использовали с obwohl."
        point: "*Es regnet. Trotzdem machen wir eine kurze Runde.*"
        set:
          view: sentence
          rows:
            - de:
                - Es regnet.
                - Trotzdem
                - machen wir
                - eine kurze Runde.
              ru: Идёт дождь. Всё же мы сделаем короткую прогулку.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: В «Obwohl ich müde bin» усталость отрицается?
        read: "Нет. Человек действительно устал. Уступка описывает, что при таком обстоятельстве он всё
          же выбирает действие. Если убрать усталость из пересказа, связь теряет смысл: решение
          уже не будет «несмотря на это». Передавайте обе мысли, даже если вторая вам кажется
          важнее или ближе к собственному опыту."
        point: Уступка сохраняет оба факта.
        set:
          view: table
          table: rule
      - question: Правильно ли «Trotzdem ich gehe ins Café»?
        read: "В этой модели нет. Trotzdem начинает главную часть, поэтому сразу после него нужен
          личный глагол: *Trotzdem gehe ich ins Café*. Если нужен союз с глаголом в конце,
          используется obwohl: *Obwohl ich müde bin*. Сравните два варианта и проверьте, где
          находится личный глагол, прежде чем добавлять обстоятельства."
        point: "*Trotzdem gehe ich …*"
        set:
          view: table
          table: rule
  - id: exam-headlines
    chapter: exam
    title: Fünf Texte über gute freie Zeit
    beats:
      - read: Пять текстов показывают разные идеи хорошего отдыха. Сначала сформулируйте главную мысль
          каждого своими словами. Заголовок не должен добавлять крайность вроде «весь день» или
          «только». Каждый используйте один раз. В отдельных текстах уступка помогает понять
          отношение автора, но одно слово obwohl ещё не раскрывает главную тему.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: headlines
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: headlines
        set:
          view: task
          task: headlines
          solved: true
  - id: exam-offers
    chapter: exam
    title: Zwei Aktivitäten, zwei Pausen · Ausschnitt
    beats:
      - read: "Эта карточка даёт вымышленные цены и длительности для игры, а не настоящие предложения
          Фленсбурга. Выберите одно занятие и одну паузу. Проверяйте полный набор: дешёвый
          музей сам по себе может подходить, но вместе с дорогим кафе выйти за бюджет.
          Несколько сочетаний допустимы, и игра должна принять каждое."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
