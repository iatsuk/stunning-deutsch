exercises:
  - type: choice
    q: Obwohl es regnet, ___ wir hinaus.
    options:
      - geht
      - gehen
      - wir gehen
    answer: 1
    why: Главный глагол сразу после придаточного.
  - type: choice
    q: Es regnet. Trotzdem ___ wir hinaus.
    options:
      - gehe
      - gehen
      - wir gehen
    answer: 1
    why: Trotzdem + V2.
  - type: choice
    q: Ich bleibe drinnen, ___ es regnet.
    options:
      - trotzdem
      - um
      - weil
    answer: 2
    why: Указана причина.
  - type: choice
    q: ___ ich müde bin, gehe ich kurz spazieren.
    options:
      - Deshalb
      - Obwohl
      - Trotzdem
    answer: 1
    why: Придаточное с глаголом в конце.
  - type: choice
    q: Trotzdem ich gehe — правильно?
    options:
      - Только в письме
      - Нет
      - Да
    answer: 1
    why: "Нужен V2: trotzdem gehe ich."
  - type: choice
    q: Музей 6 + кафе 8 при бюджете 10…
    options:
      - Подходит
      - Стоит10
      - Не подходит
    answer: 2
    why: Сравнивается полный набор.
  - type: order
    de: Obwohl ich müde bin, gehe ich kurz spazieren.
    ru: Хотя я устала, немного прогуляюсь.
  - type: order
    de: Es regnet. Trotzdem machen wir eine kurze Runde.
    ru: Идёт дождь. Всё же сделаем короткую прогулку.
  - type: order
    de: Ich gehe ins Café, weil ich eine Pause brauche.
    ru: Я иду в кафе, потому что нужен перерыв.
  - type: order
    de: Wir haben unterschiedliche Interessen.
    ru: У нас разные интересы.
  - type: order
    de: Trotzdem können wir uns einigen.
    ru: И всё же мы можем договориться.
  - type: order
    de: Ich bestelle selbst auf Deutsch.
    ru: Я закажу сама на немецком.
case:
  title: "Trotzdem heißt nicht: Das Hindernis ist weg"
  ru: Сверка дневника
  intro: В пересказе исчезли обстоятельства и появились оценки чужих предпочтений.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Obwohl Dana müde ist, möchte sie zwanzig Minuten spazieren gehen.
          ru: Хотя Дана устала, она хочет прогуляться 20 минут.
      question: Дана больше не устала?
      options:
        - Она отменяет прогулку
        - Нет, усталость сохраняется
        - Да
      answer: 1
      right: Уступка сохраняет оба факта.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
