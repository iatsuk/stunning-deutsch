    title: Fünf Texte, zehn Überschriften
    text: >-
      1) Als Dana zum ersten Mal nach Eckernförde fuhr, war der Himmel grau. Am Strand wurde es
      heller. Sie blieb lange am Wasser und machte erst danach eine Pause im Café. Die Reise
      war für sie eine gute Unterbrechung nach einer anstrengenden Woche.


      2) Mateo fährt gern mit anderen Menschen an die Küste. Wenn er früher am Sonntag frei
      hatte, nahm er oft Essen für alle mit. Diesmal kaufte die Gruppe unterwegs Brot. Mateo
      fand das gemeinsame Frühstück wichtiger als ein langes Programm.


      3) Elif besuchte eine kleine Fotoausstellung. Der Eintritt kostete wenig. Sie sah nicht
      nur Bilder vom Meer, sondern auch Porträts von Menschen aus der Stadt. Für das Album
      wählte sie ein eigenes Foto vom Strand.


      4) Hauke wollte mit dem Bus zurückfahren. Als die Gruppe an der Haltestelle ankam, war
      die Straße gesperrt. Ein Hinweis führte sie zur Ersatzhaltestelle. Der Bus kam dort
      pünktlich.


      5) Ein Nachbar schrieb nach dem Ausflug: Früher reiste ich fast immer allein. Jetzt freue
      ich mich, wenn Freunde mitkommen. Ich brauche nicht viele Sehenswürdigkeiten. Ein gutes
      Gespräch unterwegs reicht mir oft.
