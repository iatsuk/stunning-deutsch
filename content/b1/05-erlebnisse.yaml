id: b1-erlebnisse
order: 5
title: Als wir am Strand ankamen, wurde es heller.
ru: Рассказываем о поездке и привычках
lede: Для альбома FördeTreff друзья вспоминают поездку в Экенфьорде. Важно отделить одно
  событие от обычной привычки и восстановить порядок остановок. Пока администрация проверяет
  запрос на помещение, команда собирает истории, которые можно показать на встрече.
goals:
  - Отличить одно прошлое событие от повторяющегося
  - Понять частые формы Präteritum в рассказе
  - Подобрать заголовок к смыслу текста
  - Пересказать мнение и добавить свой опыт
grammar:
  - als / wenn в прошлом; war, hatte, ging, kam, fand
exam:
  - b1-lesen-1
  - b1-hoeren-2
  - b1-sprachbausteine-1
  - b1-sprechen-2
dialogues:
  scene:
    title: Als wir am Strand ankamen, wurde es heller.
    ru: Рассказываем о поездке и привычках
    place: Eckernförde · воспоминание для альбома · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Als wir am Strand ankamen, wurde es heller.
        ru: Когда мы приехали на пляж, стало светлее.
      - H: Vorher war der Himmel ganz grau.
        ru: До этого небо было совсем серым.
      - E: Wir gingen zuerst ans Wasser und danach ins Café.
        ru: Сначала мы пошли к воде, а потом в кафе.
      - M: Wenn ich früher am Sonntag frei hatte, nahm ich oft Essen mit.
        ru: Когда раньше у меня было свободно в воскресенье, я часто брал еду с собой.
      - D: Diesmal kauften wir Brot unterwegs.
        ru: В этот раз мы купили хлеб по дороге.
      - E: Ich fand die kleine Ausstellung interessant.
        ru: Мне показалась интересной маленькая выставка.
      - H: Als wir zurückfahren wollten, war die Straße gesperrt.
        ru: Когда мы хотели ехать обратно, улица была перекрыта.
      - M: Zum Glück kam der Bus an der Ersatzhaltestelle pünktlich.
        ru: К счастью, автобус пришёл на временную остановку вовремя.
  interview:
    title: Rückblick mit Dana
    ru: Воспоминание Даны
    place: Kiel · учебное интервью
    people:
      H:
        name: Hauke
        voice: Rocko
      D:
        name: Dana
        voice: Anna
    lines:
      - H: War der Ausflug trotz der grauen Wolken gut?
        ru: Поездка удалась, несмотря на серые облака?
      - D: Ja. Als ich ankam, dachte ich zuerst an Regen. Dann wurde es heller. Am Wasser konnte ich
          mich gut erholen.
        ru: Да. Когда я приехала, то сначала подумала о дожде. Потом стало светлее. У воды я смогла
          хорошо отдохнуть.
      - H: Warst du allein?
        ru: Ты была одна?
      - D: Nein, wir waren zu viert. Früher fuhr ich manchmal allein ans Meer. Wenn ich wenig Zeit
          hatte, blieb ich nur kurz. Diesmal hatten wir den ganzen Vormittag.
        ru: Нет, нас было четверо. Раньше я иногда ездила к морю одна. Если было мало времени,
          оставалась ненадолго. В этот раз у нас была вся первая половина дня.
      - H: Was hat dir besonders gefallen?
        ru: Что тебе особенно понравилось?
      - D: Das Gespräch am Strand. Die Ausstellung war auch interessant, aber ich brauchte vor allem
          eine Pause.
        ru: Разговор на пляже. Выставка тоже была интересной, но мне прежде всего нужен был отдых.
      - H: Und die Rückfahrt?
        ru: А обратная дорога?
      - D: Die Haltestelle war verlegt. Wir fanden den Hinweis und kamen pünktlich nach Kiel.
        ru: Остановку перенесли. Мы нашли указатель и вовремя приехали в Киль.
