steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Для альбома FördeTreff друзья вспоминают поездку в Экенфьорде. Важно отделить одно
          событие от обычной привычки и восстановить порядок остановок. Пока администрация
          проверяет запрос на помещение, команда собирает истории, которые можно показать на
          встрече. Все нужные условия даны в сцене: знания географии, настоящих цен или
          расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Рассказываем о поездке и привычках
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Вспоминать поездку можно с Perfekt, а в письменном рассказе часто встречается
          Präteritum. Здесь вы узнаёте несколько частых форм по смыслу, а не учите всю систему
          сразу. *Als* связывает части одного прошлого эпизода. *Wenn* подходит для
          повторяющихся случаев. Слово *früher* само по себе не выбирает союз: важно, было ли
          это однажды или повторялось."
        point: als / wenn в прошлом; war, hatte, ging, kam, fand
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: Друзья выбирают для альбома разные впечатления. Для Даны важен отдых у воды, для Матео —
          общая еда, для Элиф — фотографии. Заголовок должен передавать основную мысль, а не
          случайное слово. Сначала решите, почему автор вообще рассказал этот эпизод. Затем
          используйте отдельные детали для проверки своего выбора.
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: als / wenn в прошлом; war, hatte, ging, kam, fand
    beats:
      - read: "Для одного события в прошлом используйте als. Действие может длиться долго: важна
          неповторяемость описываемого периода, а не его длина. В примере придаточная часть
          заканчивается *ankamen*. После запятой сразу идёт личный глагол главной части.
          Сравните с привычкой: она может повторяться каждый свободный воскресный день."
        point: "als: один прошлый эпизод, глагол в конце придаточного."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Если ситуация повторялась, подходит wenn: всякий раз, когда было свободное воскресенье.
          *Oft* помогает увидеть повторение. Не переносите русское «когда» автоматически в один
          немецкий союз. Сначала определите, описывает ли автор один эпизод или обычный порядок
          действий. Затем проверьте глагол в конце придаточного и начало главной части."
        point: "wenn: повторяющиеся случаи, также в прошлом."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: В письменных рассказах вы встретите *war* вместо *ist gewesen*, *ging* вместо *ist
          gegangen*. Это не меняет факт события. Формы *sein* и *haben* уже знакомы из
          разговорных ситуаций. Здесь добавляем узнавание *ging, kam, fand*; в собственном
          устном рассказе можно пользоваться знакомым Perfekt. Для понимания важнее связать
          событие и его участника.
        point: "Частые Präteritum: sein, haben, gehen, kommen, finden."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Придаточная часть занимает первую позицию целиком. Поэтому после запятой идёт *wurde*, а
          не ещё одно подлежащее перед глаголом. Это тот же принцип главного предложения,
          который вы уже применяли после weil. Здесь союз передаёт время, а не причину.
          Назовите по-русски связь событий до сборки немецкой фразы.
        point: "*Als wir ankamen, wurde es heller.*"
        set:
          view: sentence
          rows:
            - de:
                - Als wir
                - ankamen,
                - wurde
                - es heller.
              ru: Когда мы приехали, стало светлее.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: "«Каждое свободное воскресенье раньше»: als или wenn?"
        read: "Wenn: речь идёт о повторяющихся случаях. Даже если все они были в прошлом, повторение
          остаётся важным. Сравните *Als ich zum ersten Mal dort war* — один первый визит — и
          *Wenn ich dort war, ging ich ans Wasser* — привычка при посещениях. Выбор зависит от
          картины событий, а не только от времени глагола."
        point: "Повторение в прошлом: *wenn*."
        set:
          view: table
          table: rule
      - question: «Sie ging ins Café» означает будущее действие?
        read: Нет. Ging — форма Präteritum глагола gehen, то есть действие в прошлом. Увидев незнакомую
          форму, свяжите её с соседними указателями времени и действиями. В рассказе группа
          сначала была у воды, потом пошла в кафе. Не нужно переводить форму отдельно, если
          последовательность помогает восстановить смысл.
        point: "*ging* = прошедшая форма *gehen*."
        set:
          view: table
          table: rule
  - id: exam-headlines
    chapter: exam
    title: Fünf Texte, zehn Überschriften
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: headlines
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: headlines
        set:
          view: task
          task: headlines
          solved: true
  - id: exam-interview
    chapter: exam
    title: Ein Rückblick · gekürztes Interview
