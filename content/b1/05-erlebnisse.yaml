spy:
  - de: "Als ich zum ersten Mal dort war, regnete es."
    wrong: "Wenn ich zum ersten Mal dort war, regnete es."
    why: "Однократное событие в прошлом вводит *als*."
  - de: "Wenn ich früher frei hatte, fuhr ich oft ans Meer."
    wrong: "Als ich früher frei hatte, fuhr ich oft ans Meer."
    why: "Повторяющееся в прошлом вводит *wenn*: на это указывает *oft*."
  - de: "Wir gingen danach ins Café."
    wrong: "Wir gehten danach ins Café."
    why: "*gehen* — сильный глагол: *gingen*."
  - de: "Ich fand die Ausstellung interessant."
    wrong: "Ich findete die Ausstellung interessant."
    why: "*finden* — сильный глагол: *fand*."

exercises:
  - type: choice
    q: ___ ich zum ersten Mal dort war, regnete es.
    options:
      - Ob
      - Als
      - Wenn
    answer: 1
    why: Один первый визит.
  - type: choice
    q: ___ ich früher frei hatte, fuhr ich oft ans Meer.
    options:
      - Dass
      - Wenn
      - Als
    answer: 1
    why: Повторение.
  - type: choice
    q: "Präteritum от gehen:"
    options:
      - ginge
      - gegangen
      - ging
    answer: 2
    why: ging — прошедшая форма.
  - type: choice
    q: "Präteritum от finden:"
    options:
      - gefunden
      - fand
      - findet
    answer: 1
    why: fand.
  - type: choice
    q: Als wir ankamen, ___ es heller.
    options:
      - werden
      - wurde
      - es wurde
    answer: 1
    why: Личный глагол сразу после запятой.
  - type: choice
    q: Die Straße war gesperrt. Значит…
    options:
      - Автобус отменён
      - Город закрыт
      - Улица была перекрыта
    answer: 2
    why: Не расширяйте сообщение.
  - type: order
    de: Als wir ankamen, wurde es heller.
    ru: Когда мы приехали, стало светлее.
    also: ["Es wurde heller, als wir ankamen."]
  - type: order
    de: Wenn ich frei hatte, nahm ich Essen mit.
    ru: Когда у меня было свободно, я брал еду.
    also: ["Ich nahm Essen mit, wenn ich frei hatte."]
  - type: order
    de: Wir gingen danach ins Café.
    ru: Потом мы пошли в кафе.
    also: ["Danach gingen wir ins Café.", "Ins Café gingen wir danach."]
  - type: order
    de: Ich fand die Ausstellung interessant.
    ru: Мне показалась интересной выставка.
    also: ["Die Ausstellung fand ich interessant.", "Interessant fand ich die Ausstellung."]
  - type: order
    de: Der Bus kam pünktlich.
    ru: Автобус пришёл вовремя.
    also: ["Pünktlich kam der Bus."]
  - type: order
    de: Diesmal hatten wir viel Zeit.
    ru: В этот раз у нас было много времени.
    also: ["Wir hatten diesmal viel Zeit.", "Viel Zeit hatten wir diesmal."]
case:
  title: Ein grauer Morgen ist kein Regentag
  ru: Сверка дневника
  intro: В пересказ добавили сведения, которых нет в источниках.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Als wir ankamen, war der Himmel grau. Danach wurde es heller.
          ru: Когда приехали, небо было серым. Потом стало светлее.
      question: Весь день шёл дождь?
      options:
        - Поездка отменена
        - Это не сказано
        - Да
      answer: 1
      right: Серое небо ещё не доказывает дождь весь день.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wenn Mateo früher frei hatte, nahm er oft Essen mit. Diesmal kaufte die Gruppe Brot.
          ru: Раньше в свободные дни Матео часто брал еду. В этот раз группа купила хлеб.
      question: Что относится именно к этой поездке?
      options:
        - Купили хлеб
        - Матео всегда готовил
        - Каждый ел один
      answer: 0
      right: Diesmal выделяет конкретный эпизод.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Der Bus kam an der Ersatzhaltestelle pünktlich.
          ru: Автобус пришёл на временную остановку вовремя.
      question: Что изменилось?
      options:
        - Время прибытия
        - Город назначения
        - Остановка
      answer: 2
      right: Изменилось место остановки, не пунктуальность.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Запись исправлена по источникам. В следующей главе команда воспользуется
    подтверждёнными сведениями для нового решения.
adventure:
  kind: sequence
  title: Stellen Sie die Reisegeschichte wieder her
  intro: Для альбома FördeTreff друзья вспоминают поездку в Экенфьорде. Важно отделить одно
    событие от обычной привычки и восстановить порядок остановок. Пока администрация проверяет
    запрос на помещение, команда собирает истории, которые можно показать на встрече.
  ending: Die Gruppe unterscheidet einzelne Erlebnisse und frühere Gewohnheiten. Die Erinnerungen
    sind für das Album sortiert; ein grauer Morgen wird im Tagebuch nicht mehr zum vollständig
    verregneten Tag.
  challenges:
    - id: title
      kind: select
      title: Finden Sie den passenden Blickwinkel
      intro: Что является главной мыслью первого текста?
      mode: reading
      clue:
        task: headlines
      options:
        - id: o0
          label: Отдых после трудной недели
        - id: o1
          label: Отмена всей поездки
        - id: o2
          label: Открытие ресторана
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: time
      kind: match
      title: Один раз или повторение?
      intro: Соедините начало со значением.
      slots:
        - id: a
          label: Als ich zum ersten Mal dort war, …
          answer: once
        - id: b
          label: Wenn ich sonntags frei hatte, …
          answer: often
        - id: c
          label: Als wir an der Haltestelle ankamen, …
          answer: once
      options:
        - id: once
          label: один прошлый эпизод
        - id: often
          label: повторяющиеся случаи
      success: Союз показывает, один эпизод перед нами или привычка.
      wrong: Первый визит и конкретное прибытие — отдельные события.
    - id: als
      kind: order
      title: Соберите воспоминание
      intro: Начните с прибытия.
      label: Реплика для команды
      tokens:
        - Als wir
        - ankamen,
        - wurde
        - es heller.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: route
      kind: pack
      title: Что действительно произошло?
      intro: Отберите подтверждённые детали текстов.
      mode: reading
      clue:
        task: headlines
      options:
        - id: o0
          label: Сначала вода, потом кафе
        - id: o1
          label: Автобус пришёл вовремя
        - id: o2
          label: Весь день шёл дождь
        - id: o3
          label: Группа купила хлеб
      answer:
        - o0
        - o1
        - o3
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: stop
      kind: note
      title: Сохраните полезную деталь
      intro: Где группа села на обратный автобус? Используйте текст 4.
      mode: reading
      clue:
        task: headlines
      fields:
        - label: Haltestelle für die Rückfahrt
          answers:
            - Ersatzhaltestelle
            - an der Ersatzhaltestelle
            - zur Ersatzhaltestelle
      success: Временная остановка сохранена в заметке.
      wrong: В тексте названо Ersatzhaltestelle.
