id: b1-finale
order: 20
title: Wir haben es gemeinsam organisiert. Was bleibt für das nächste Mal?
ru: Проводим встречу и передаём подтверждённый итог
lede: Встреча FördeTreff состоялась в Raum C. Утром пошёл дождь, поэтому материалы привезли
  автобусом; поезд Хауке пришёл вовремя. Теперь команда сверяет итог и вспоминает ключевые
  действия дня. Нужно объяснить гостю альбом, сохранить роли и передать результат без лишних
  обещаний.
goals:
  - Согласовать сведения из разных источников
  - Понятно объяснить и уточнить в живом разговоре
  - Отличить запланированное от выполненного
  - Написать связный итог и совместно спланировать новое дело
grammar:
  - "Интеграция B1: объяснение, изменение, мнение и общий план"
exam:
  - b1-lesen-2
  - b1-schreiben-1
  - b1-sprechen-3
dialogues:
  scene:
    title: Wir haben es gemeinsam organisiert. Was bleibt für das nächste Mal?
    ru: Проводим встречу и передаём подтверждённый итог
    place: Kiel · FördeTreff в Raum C · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      G:
        name: Lina
        voice: Sandy
    lines:
      - H: Mein Zug war pünktlich. Ich habe den Schlüssel um halb drei abgeholt.
        ru: Мой поезд пришёл вовремя. Я получил ключ в половине третьего.
      - D: Am Nachmittag regnete es. Deshalb haben wir die Materialien mit dem Bus gebracht.
        ru: Днём шёл дождь. Поэтому материалы привезли автобусом.
      - E: Sowohl die Fotomappe als auch die Mehrwegbecher waren rechtzeitig in Raum C.
        ru: И папка, и многоразовые стаканы были вовремя в помещенииC.
      - M: Für Essen und Getränke haben wir zusammen dreißig Euro bezahlt.
        ru: За еду и напитки вместе мы заплатили тридцать евро.
      - G: Am Anfang verstand ich eine Bildunterschrift nicht. Danach konnte ich selbst eine Frage zur
          Reise stellen.
        ru: Сначала я не поняла одну подпись. Потом смогла сама задать вопрос о поездке.
      - D: Die Hafenfotos kamen aus Flensburg. Die Bilder der Stadt zeigten Lübeck. Darüber haben wir
          gesprochen.
        ru: Фотографии гавани были из Фленсбурга, снимки города — из Любека. Об этом мы говорили.
      - H: Wir haben den Raum um sechs verlassen und den Schlüssel um zehn nach sechs zurückgegeben.
        ru: Мы вышли из помещения в шесть и вернули ключ в десять минут седьмого.
      - E: Gut. Jetzt schreiben wir einen kurzen Rückblick und fragen, was wir beim nächsten Mal besser
          machen können.
        ru: Хорошо. Теперь напишем короткий итог и спросим, что можно улучшить в следующий раз.
