spy:
  - de: "Es regnete. Deshalb nahmen wir den Bus."
    wrong: "Es regnete. Deshalb wir nahmen den Bus."
    why: "*deshalb* занимает первую позицию, глагол идёт сразу за ним."
  - de: "Die Materialien wurden mit dem Bus gebracht."
    wrong: "Die Materialien wurde mit dem Bus gebracht."
    why: "Подлежащее во мн. ч.: *wurden*."
  - de: "Die Gäste, mit denen wir sprachen, waren zufrieden."
    wrong: "Die Gäste, mit den wir sprachen, waren zufrieden."
    why: "Относительное местоимение в дательном падеже мн. ч. — *denen*."
  - de: "Wir hätten gern mehr Zeit, um zu sprechen."
    wrong: "Wir hätten gern mehr Zeit, um sprechen."
    why: "В конструкции *um … zu* перед инфинитивом нужно *zu*."

exercises:
  - type: choice
    q: Es regnete. ___ nahmen wir den Bus.
    options:
      - Weil
      - Deshalb
      - Obwohl
    answer: 1
    why: Следствие в главной части.
  - type: choice
    q: Die Materialien ___ mit dem Bus gebracht.
    options:
      - wird
      - wurden
      - wurde
    answer: 1
    why: Прошлое Passiv, множественное.
  - type: choice
    q: Die Gäste, mit ___ wir sprachen.
    options:
      - den
      - die
      - denen
    answer: 2
    why: Mit Dativ множественного.
  - type: choice
    q: Wir hätten gern mehr Zeit, um ___.
    options:
      - gesprochen
      - zu sprechen
      - sprechen
    answer: 1
    why: Цель с umzu.
  - type: choice
    q: Ich werde morgen noch einmal ___.
    options:
      - fragte
      - nachfragen
      - nachgefragt
    answer: 1
    why: Futur I.
  - type: choice
    q: Die Becher werden am Montag zurückgegeben. Это…
    options:
      - Следующее запланированное действие
      - Уже выполненный возврат
      - Отмена встречи
    answer: 0
    why: По отчёту ключ вернули, а возврат стаканов ещё запланирован.
  - type: order
    de: Deshalb haben wir die Materialien mit dem Bus gebracht.
    ru: Поэтому мы привезли материалы автобусом.
    also: ["Wir haben deshalb die Materialien mit dem Bus gebracht.", "Wir haben die Materialien deshalb mit dem Bus gebracht.", "Die Materialien haben wir deshalb mit dem Bus gebracht.", "Mit dem Bus haben wir deshalb die Materialien gebracht."]
  - type: order
    de: Wir haben den Schlüssel rechtzeitig zurückgegeben.
    ru: Мы вовремя вернули ключ.
    also: ["Den Schlüssel haben wir rechtzeitig zurückgegeben.", "Rechtzeitig haben wir den Schlüssel zurückgegeben.", "Wir haben rechtzeitig den Schlüssel zurückgegeben."]
  - type: order
    de: Die Hafenfotos stammen aus Flensburg.
    ru: Фотографии гавани из Фленсбурга.
    also: ["Aus Flensburg stammen die Hafenfotos."]
  - type: order
    de: Ich habe das so verstanden. Stimmt das?
    ru: Я понял это так. Верно?
    also: ["So habe ich das verstanden. Stimmt das?", "Das habe ich so verstanden. Stimmt das?"]
  - type: order
    de: Wir könnten mehr Zeit für Gespräche einplanen.
    ru: Мы могли бы предусмотреть больше времени для разговоров.
    also: ["Mehr Zeit für Gespräche könnten wir einplanen.", "Für Gespräche könnten wir mehr Zeit einplanen."]
  - type: order
    de: Was würdest du beim nächsten Mal ändern?
    ru: Что ты изменил бы в следующий раз?
case:
  title: Was wurde wirklich abgeschlossen?
  ru: Сверка дневника
  intro: В финальной записи не смешивайте факт, срок и следующее действие.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Haukes Zug war pünktlich. Er holte den Schlüssel selbst.
          ru: Поезд Хауке был вовремя. Он сам получил ключ.
      question: Запасной вариант с Даной точно использовали?
      options:
        - Встречу отменили
        - Нет
        - Да
      answer: 1
      right: Условие задержки не наступило.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Raum 40, Essen und Getränke 30, Transport 8. Insgesamt 78. Budget 80.
          ru: Зал 40, еда и напитки 30, транспорт 8. Всего 78. Бюджет 80.
      question: Подтверждённые расходы в пределах бюджета?
      options:
        - Да, остаётся 2 евро
        - Нет, 82
        - Кухня оплачивается ещё раз
      answer: 0
      right: 40+30+8=78; кухня уже включена.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Schlüssel 18:10 zurück, Frist 18:15. Becher zurück am Montag geplant.
          ru: Ключ вернули 18:10, срок 18:15. Стаканы запланировано вернуть в понедельник.
      question: Что уже выполнено?
      options:
        - Возврат стаканов в понедельник
        - Все будущие встречи
        - Возврат ключа в срок
      answer: 2
      right: Возврат ключа подтверждён, стаканы ещё ждут следующего действия.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Финальный итог сохраняет события, сумму и сроки. Дальше — новая ситуация, где понимание
    придётся применить самостоятельно.
adventure:
  kind: sequence
  title: Соедините план, разговор и подтверждённый результат
  intro: Встреча FördeTreff состоялась в Raum C. Утром пошёл дождь, поэтому материалы привезли
    автобусом; поезд Хауке пришёл вовремя. Теперь команда сверяет итог и вспоминает ключевые
    действия дня. Нужно объяснить гостю альбом, сохранить роли и передать результат без лишних
    обещаний.
  ending: Встреча состоялась, сведения понятны новому гостю, расходы и возврат ключа сверены. У
    команды есть не только воспоминания, но и конкретный вопрос для следующего совместного
    дела.
  challenges:
    - id: room
      kind: select
      title: С чего начинается точная сверка?
      intro: Сохраните действующее помещение.
      mode: reading
      clue:
        task: plan
      options:
        - id: o0
          label: Raum C с включённой кухней
        - id: o1
          label: Снова Raum B
        - id: o2
          label: Любой зал без подтверждения
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: roles
      kind: match
      title: Сохраните распределение
      intro: Кто отвечает за действие по плану?
      mode: reading
      clue:
        task: plan
      slots:
        - id: h
          label: Hauke
          answer: key
        - id: d
          label: Dana
          answer: welcome
        - id: m
          label: Mateo
          answer: food
        - id: e
          label: Elif
          answer: photos
      options:
        - id: key
          label: Schlüssel
        - id: welcome
          label: Begrüßung
        - id: food
          label: Essen und Getränke
        - id: photos
          label: Fotos und Becher
      success: Роли соответствуют общему плану.
      wrong: Сверьте каждое имя, а не только знакомое действие.
    - id: guest
      kind: negotiation
      title: Помогите новому гостю включиться
      intro: Лина хочет понять подпись и поделиться своей поездкой.
      mode: reading
      clue:
        task: album
      start: a
      nodes:
        - id: a
          text: "Lina: Sind die Fotos des Hafens aus Lübeck?"
          choices:
            - label: Die Hafenfotos sind aus Flensburg. Die Stadtbilder zeigen Lübeck.
              next: b
              feedback: Места уточнены без сложного монолога.
        - id: b
          text: "Lina: Verstanden. Ich war einmal in einer ruhigen Landschaft. Die Heidebilder erinnern
            mich daran."
          choices:
            - label: Was hat dir bei deinem Ausflug besonders gefallen?
              next: c
              feedback: Вы задаёте встречный вопрос вместо новой лекции.
        - id: c
          text: "Lina: Dass wir Zeit für eine lange Pause hatten."
          choices:
            - label: Das kenne ich. Man braucht nicht immer viele Ziele für einen schönen Tag.
              next: end
              feedback: Есть реакция на услышанный личный опыт.
        - id: end
          text: "Lina: Genau. Jetzt kann ich die Bilder mit meiner eigenen Erfahrung verbinden."
          terminal: true
          choices: []
      success: Уточнение превратилось в взаимный разговор.
      wrong: Ответьте на вопрос и отреагируйте на опыт гостя.
    - id: key
      kind: clock
      title: Запишите фактическое время возврата
      intro: Нужно выполненное время, а не крайний срок.
