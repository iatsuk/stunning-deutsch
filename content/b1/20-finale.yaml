tasks:
  plan:
    kind: message
    part: b1-lesen-2
    title: Plan vor der Öffnung · Ausschnitt
    text: Raum C mit Küche, 18. Oktober 15–18 Uhr. Hauke holt den Schlüssel 14:30 und gibt ihn bis
      18:15 zurück. Dana begrüßt die Gäste. Mateo organisiert Essen und Getränke. Elif bringt
      Fotos und geliehene Becher. Bei Regen kommen die Materialien mit dem Bus. Gemeinsames
      Aufräumen ab 17:40; Raum verlassen 18:00.
  album:
    kind: message
    part: b1-lesen-2
    title: Kleine Hilfe zum Album · Ausschnitt
    text: "Lübeck: Stadtbilder, Museumsbesuch und Pause am Wasser. Flensburg: Hafenbilder und ein
      persönliches Cafégespräch auf Deutsch. Lüneburger Heide: Danas Erinnerung an eine ruhige
      Landschaft. Verschiedene persönliche Eindrücke dürfen nebeneinander stehen."
  result:
    kind: message
    part: b1-lesen-2
    title: Bestätigter Rückblick · Ausschnitt
    text: "Der Treff fand in Raum C statt. Haukes Zug war pünktlich; er holte den Schlüssel 14:30.
      Wegen des Regens wurden die Materialien mit dem Bus gebracht. Sowohl Mappe als auch
      Becher waren da. Kosten: Raum mit Küche 40 Euro, Essen und Getränke 30 Euro,
      Materialtransport 8 Euro. Die Becher waren eine kostenlose Leihgabe. Insgesamt 78 Euro
      bei 80 Euro Budget. Der Raum wurde 18:00 verlassen, der Schlüssel 18:10 zurückgegeben;
      Frist 18:15. Die geliehenen Becher werden wie vereinbart am Montag zurückgegeben."
  write:
    kind: message
    part: b1-schreiben-1
    title: Einem Freund vom Treff erzählen
    text: Ihr Freund Jonas konnte nicht teilnehmen und fragt, wie der FördeTreff war. Antworten Sie
      ihm.
    points:
      - Wo und wie der Treff stattgefunden hat
      - Eine Änderung erklären und die Lösung nennen
      - Ein konkretes Gespräch oder Erlebnis schildern
      - Einen nächsten Schritt vorschlagen und nach seiner Meinung fragen
    sample:
      - Lieber Jonas, unser FördeTreff hat in Raum C im Nachbarschaftshaus stattgefunden. Die
        kleine Küche war dabei sehr hilfreich. Am Nachmittag regnete es, deshalb brachten wir
        die Fotos und Becher mit dem Bus. Haukes Zug war pünktlich, und er konnte den Schlüssel
        wie geplant abholen. Besonders schön fand ich das Gespräch mit Lina über die Bilder.
        Zuerst war eine Bildunterschrift unklar, danach erzählte sie von ihrer eigenen Reise.
        Insgesamt haben wir 78 Euro ausgegeben und den Schlüssel rechtzeitig zurückgegeben.
        Beim nächsten Mal könnten wir mehr Zeit für solche Gespräche einplanen. Was meinst du?
        Hättest du Lust, dann mitzukommen? Viele Grüße Dana
  talk:
    kind: card
    part: b1-sprechen-3
    title: Ein neues Vorhaben ohne fertigen Musterplan
    theme: Ein kleines Treffen für neue Nachbarn
    word: Ziel · Termin · Aufgaben · Alternative · Bestätigung
    situation: Planen Sie eine neue kleine Veranstaltung für Nachbarn. Eine Person hat
      Samstagvormittag Zeit, die andere nur Sonntagnachmittag. Finden Sie gemeinsam einen
      anderen passenden Zeitraum oder eine realistische Aufgabenverteilung. Sie dürfen nicht
      einfach den alten Plan wiederholen.
    roles:
      - title: Person A
        text: Sie können Samstagvormittag Materialien vorbereiten. Am Sonntag können Sie erst ab 16 Uhr
          da sein. Sie möchten eine einfache Begrüßung und ein Gespräch über Fotos.
      - title: Person B
        text: Sie haben Sonntag 14–18 Uhr Zeit und könnten vorher den Raum öffnen. Am Samstag sind Sie
          beschäftigt. Schlagen Sie einen gemeinsamen Beginn und eine Vorbereitung vor.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Встреча FördeTreff состоялась в Raum C. Утром пошёл дождь, поэтому материалы привезли
          автобусом; поезд Хауке пришёл вовремя. Теперь команда сверяет итог и вспоминает
          ключевые действия дня. Нужно объяснить гостю альбом, сохранить роли и передать
          результат без лишних обещаний. Все нужные условия даны в сцене: знания географии,
          настоящих цен или расписаний не требуются. Сначала попробуйте понять, какого
          результата добиваются друзья, затем слушайте реплики. На новом уровне важно не только
          найти число или знакомое слово, но и связать несколько сведений."
        point: Проводим встречу и передаём подтверждённый итог
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "В финальной истории нет нового большого правила. Знакомые формы нужны для связного
          результата: поезд был вовремя, дождь привёл к автобусу, материалы доставлены, ключ
          возвращён. Сначала сопоставьте факты из плана и отчёта. Затем объясните их так, чтобы
          человек, который не участвовал в подготовке, понял, что изменилось и чем закончился
          день."
        point: "Интеграция B1: объяснение, изменение, мнение и общий план"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: Итог не должен превращаться ни в список случайных деталей, ни в обещание, что теперь всё
          всегда будет легко. Назовите событие, одно изменение, решение и результат. Слова
          отчёта помогают передать конкретный опыт и попросить обратную связь. Для следующей
          встречи пригодятся не только удачные решения, но и понятный вопрос о том, что
          участникам хочется изменить.
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Интеграция B1: объяснение, изменение, мнение и общий план"
    beats:
      - read: В итоговом рассказе не достаточно перечислить дождь и автобус рядом. Deshalb показывает,
          как одно повлияло на другое. Здесь условный вариант из прошлой главы стал действием,
          потому что дождь действительно начался. Поезд при этом пришёл вовремя, поэтому
          запасной вариант с Даной не понадобился. Сохраняйте разные линии событий, не
          объединяя их в одну общую «всё изменилось».
        point: Причина и результат связывают рассказ.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: До встречи была договорённость, после неё появился факт проведения. Для нового читателя
          полезно коротко назвать обе стадии и важное изменение помещения. Можно пользоваться
          знакомым Perfekt или Präteritum. Не требуется собирать в одном предложении как можно
          больше сложных форм. Задача — ясно передать порядок и результат, а не показать все
          таблицы сразу.
        point: От подтверждения к проведённому событию — разные стадии.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "В разговоре с гостем нужно услышать непонятное место, ответить по источнику и проверить
          понимание. Если гость добавляет личный опыт, задайте вопрос и отреагируйте на ответ.
          В совместном плане после предложения требуется согласовать действия и роли. Эти
          навыки возвращаются в самостоятельной работе: содержание там новое, поэтому готовая
          реплика из этой сцены не заменит понимание."
        point: Уточнение и реакция важнее заученного монолога.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Начало с результата связывает итоговый рассказ с причиной. Личный глагол после deshalb
          остаётся на второй позиции, а место и объект добавляются в обычной рамке. Затем можно
          отдельным предложением назвать доставленные материалы и участников. Связность
          получается из понятных отношений между фразами, а не только из длины предложения.
        point: "*Deshalb haben wir die Materialien mit dem Bus gebracht.*"
        set:
          view: sentence
          rows:
            - de:
                - Deshalb
                - haben wir
                - die Materialien mit dem Bus
                - gebracht.
              ru: Поэтому мы привезли материалы автобусом.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Условный запасной план с Даной точно был выполнен?
        read: Нет. Он зависел от опоздания поезда. В итоговом сообщении Хауке говорит, что приехал
          вовремя и получил ключ сам. Поэтому сам факт существования запасного варианта не
          означает его использование. Для отчёта нужны результаты дня, а для следующего раза
          полезно сохранить и подготовленную альтернативу.
        point: Сработало условие дождя, но не условие задержки.
        set:
          view: table
          table: rule
      - question: Письмо об итоге должно перечислить все правила B1?
        read: "Нет. Оно должно выполнить конкретную задачу: объяснить событие, изменение, опыт и
          следующий шаг. Выбирайте формы, которые помогают передать этот смысл. В
          самостоятельном письме раскройте четыре пункта и проверьте связность, обращение и
          понятный результат. Количество использованных названий грамматических правил не
          является целью разговора."
        point: Формы служат смыслу и выполнению задачи.
        set:
          view: table
          table: rule
  - id: exam-plan
    chapter: exam
    title: Plan vor der Öffnung · Ausschnitt
    beats:
      - read: "Восстановите исходные роли и сроки. Это план до открытия, а не отчёт о выполнении. Он
          пригодится для сравнения с результатом и для игрового распределения. Грамматические
          формы знакомы: используйте их, чтобы не перепутать, кто получил ключ, кто встречал
          гостей и какие действия зависели от дождя."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: plan
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: plan
        set:
          view: task
          task: plan
          solved: true
  - id: exam-album
    chapter: exam
    title: Kleine Hilfe zum Album · Ausschnitt
    beats:
      - read: Эта короткая памятка помогает ответить новому гостю. Сопоставьте город, гавань и
          ландшафт, затем объясните одну подпись своими словами. Не обязательно повторять
          длинную Genitiv-группу. Важно сохранить место и дать собеседнику возможность задать
          встречный вопрос или поделиться своим опытом.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: album
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: album
        set:
          view: task
          task: album
          solved: true
  - id: exam-result
    chapter: exam
    title: Bestätigter Rückblick · Ausschnitt
    beats:
      - read: Теперь сравните план с выполнением. Дождь подтвердился, задержка поезда — нет. Сумма
          состоит из трёх названных расходов, кухня входит в аренду, стаканы получены бесплатно
          во временное пользование. Возврат ключа выполнен в срок, возврат стаканов ещё
          запланирован на понедельник. У этих действий разные статусы.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: result
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: result
        set:
          view: task
          task: result
          solved: true
  - id: exam-write
    chapter: exam
    title: Einem Freund vom Treff erzählen
    beats:
      - read: У друга нет всей переписки подготовки. Кратко объясните место, изменение и решение, затем
          расскажите об одном разговоре и предложите следующий шаг. Все четыре пункта
          обязательны. Не превращайте письмо в полный журнал расходов или список правил. После
          черновика проверьте, поймёт ли человек историю без чтения предыдущих уроков.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: write
          reveal: 0
      - question: Готовы сверить своё решение с источником?
