    lines:
      - E: Ich wähle drei Fotos aus, um die Geschichte kurz zu erzählen.
        ru: Я выбираю три фотографии, чтобы коротко рассказать историю.
      - D: Wir schreiben einfache Texte, damit auch neue Gäste alles verstehen.
        ru: Мы пишем простые тексты, чтобы и новые гости всё поняли.
      - H: Auf einem Foto sieht man die Häuser in Haithabu.
        ru: На одной фотографии видны дома в Хайтабу.
      - M: Ich bringe eine Karte mit, damit die Gäste den Ort finden.
        ru: Я принесу карту, чтобы гости нашли это место.
      - E: Wir brauchen nicht viele Fachwörter, um neugierig zu machen.
        ru: Нам не нужно много специальных слов, чтобы заинтересовать.
      - D: Ich lese die Texte laut, um schwierige Stellen zu finden.
        ru: Я прочитаю тексты вслух, чтобы найти трудные места.
      - H: Danach teste ich die kleine Bilderaufgabe mit einem Nachbarn.
        ru: Потом проверю небольшое задание по картинкам с соседом.
      - M: Gut. Er soll den Ort erkennen und eine Frage stellen können.
        ru: Хорошо. Он должен суметь узнать место и задать вопрос.
