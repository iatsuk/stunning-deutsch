  voices:
    kind: worksheet
    part: b1-hoeren-1
    format: article
    title: Fünf Meinungen zu kleinen Ausstellungen
    recordings:
      - voice: Anna
        text: Ich gehe gern in kleine Ausstellungen, um mit anderen ins Gespräch zu kommen. Lange Texte
          lese ich selten. Eine persönliche Frage neben dem Bild finde ich oft interessanter
          als viele technische Angaben.
      - voice: Reed
        text: Für mich sind kurze Texte gut, aber ganz ohne Informationen möchte ich die Bilder nicht
          sehen. Ich möchte wissen, wo und wann ein Foto entstanden ist. Danach kann ich besser
          Fragen stellen.
      - voice: Flo
        text: Ich fotografiere selbst und sehe mir gern Details an. Trotzdem muss eine Ausstellung
          nicht nur für Fachleute sein. Ich finde einfache Erklärungen hilfreich, damit auch
          Anfänger etwas mitnehmen.
      - voice: Grandpa
        text: Ich brauche in einer Ausstellung Ruhe. Wenn an jedem Bild jemand etwas erklärt, kann ich
          mich schlecht konzentrieren. Ich lese lieber allein und spreche erst am Ende über
          meine Eindrücke.
      - voice: Shelley
        text: Mit meinen Kindern wähle ich Ausstellungen mit kleinen Aufgaben. Wir suchen zum Beispiel
          einen Ort auf einer Karte. Dabei möchte ich ihnen nicht ständig die richtige Antwort
          vorsagen.
    questions:
