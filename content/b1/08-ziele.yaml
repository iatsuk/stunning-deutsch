          Besucher ins Gespräch. Zu lange Texte machen mich müde.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Для раздела о Шлезвиге друзья выбирают собственные фотографии поездки к домам викингов в
          Хайтабу. Одним гостям интересны детали, другим нужен короткий рассказ без специальных
          слов. Нужно подготовить подписи и задания так, чтобы люди действительно поняли
          материал. Все нужные условия даны в сцене: знания географии, настоящих цен или
          расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Объясняем цель и готовим понятную выставку
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "В этой главе важен результат для посетителя. Um ... zu связывает действие с целью того
          же действующего лица. Damit позволяет явно назвать, кто должен получить результат: мы
          пишем, гости понимают. При этом damit можно использовать и с тем же участником. Не
          выбирайте союз только по русскому «чтобы»: сначала найдите, кто действует в каждой
          части."
        point: "Цель: um … zu / damit; отличие от причины weil"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Выставка не должна превращаться в список сложных терминов. Карта помогает найти место,
          подпись — понять фотографию, вопрос — начать разговор. В игре каждый элемент
          выбирается ради конкретной цели. Исторические факты мы не придумываем: упражнение
          описывает действия организаторов, а фотографии остаются материалом, которому нужна
          понятная подпись и указанное авторство."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Цель: um … zu / damit; отличие от причины weil"
    beats:
      - read: "Читает и ищет трудные места один человек. Поэтому во второй части не требуется новое
          подлежащее: после um стоит нужное дополнение, а в конце — zu finden. Это развитие уже
          знакомой инфинитивной группы. Цель отвечает на вопрос «для чего?». Она ещё не
          доказывает, что желаемый результат действительно получен; после чтения всё равно
          нужно проверить текст."
        point: "um … zu: цель того же действующего лица."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Пишем мы, а понять должны гости. В части с damit действующее лицо названо явно, глагол
          получает личную форму и стоит в конце. Damit допустимо и при одном участнике: *Ich
          lese laut, damit ich Fehler finde*. Не превращайте полезное различие в неверное
          правило, будто damit разрешено только для разных людей."
        point: damit + подлежащее; личный глагол в конце.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Причина объясняет, почему решение принято: старый текст слишком трудный. Цель описывает,
          чего хотим достичь: чтобы гости поняли. Одно действие может иметь и причину, и цель.
          В игре не достаточно найти знакомый союз: свяжите его с фактом или ожидаемым
          результатом. В обеих моделях затем проверьте правильное положение глагола."
        point: "weil: причина; damit / um … zu: желаемая цель."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "В этом предложении подлежащее меняется: мы подготавливаем текст для гостей. Поэтому в
          конце стоит личная форма verstehen, а не zu verstehen без названного участника. Перед
          сборкой переведите связь простыми словами: кто делает материал и кому он помогает?
          Форма должна сохранить эту связь, иначе получатель помощи исчезнет из реплики."
        point: "*Wir schreiben einfach, damit die Gäste alles verstehen.*"
        set:
          view: sentence
          rows:
            - de:
                - Wir schreiben einfach,
                - damit
                - die Gäste alles
                - verstehen.
              ru: Мы пишем просто, чтобы гости всё поняли.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Можно ли использовать damit, когда участник один?
        read: "Да. Можно сказать *Ich lese laut, damit ich Fehler finde*. Конструкция um ... zu в этом
          случае короче, но damit не становится ошибкой. Главное — сохранить понятную цель и
          правильно построить выбранную модель. Различие особенно полезно, когда действующие
          лица разные: тогда их нельзя незаметно объединить в одну инфинитивную группу."
        point: При одном участнике возможны обе модели.
        set:
          view: table
          table: rule
      - question: «Damit alle verstehen» уже подтверждает, что все поняли?
        read: "Нет. Это цель организаторов. Чтобы узнать результат, нужно проверить материал с
          посетителем и услышать его ответ. В этой истории Хауке тестирует задание с соседом.
          Не записывайте намерение как достигнутый результат: короткий текст может всё ещё
          содержать незнакомые слова или непонятную связь между картой и фотографией."
        point: Цель нужно отдельно проверить действием.
        set:
          view: table
          table: rule
  - id: exam-materials
    chapter: exam
    title: Material für drei Ziele · Ausschnitt
    beats:
      - read: Сравните три результата для посетителей. Для каждого выберите материал, который помогает
          именно этому действию. Карта не заменяет подпись к фотографии, а подпись не
          гарантирует начало разговора. Это дополнительный фрагмент чтения для игры; полную
          экзаменационную часть он не имитирует. Позже перенесите выбранную цель в свою
          реплику.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: materials
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: materials
        set:
          view: task
          task: materials
          solved: true
  - id: exam-gaps
    chapter: exam
    title: "Zehn Lücken: Warum und wozu?"
    beats:
      - read: "В общем банке пятнадцать слов, а пропусков десять. Используйте каждый выбранный вариант
          не более одного раза. Контекст вернёт после новой модели также weil и nachdem.
          Сначала прочитайте весь план, затем проверьте соседние слова у каждого пропуска:
          предлог, личная форма и причастие дают разные подсказки."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: gaps
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
