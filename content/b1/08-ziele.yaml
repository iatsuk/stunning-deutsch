exercises:
  - type: choice
    q: Ich lese laut, ___ Fehler zu finden.
    options:
      - weil
      - um
      - damit
    answer: 1
    why: Одна цель одного участника.
  - type: choice
    q: Wir erklären einfach, ___ die Gäste alles verstehen.
    options:
      - zu
      - damit
      - um
    answer: 1
    why: Вторая часть с подлежащим и личным глаголом.
  - type: choice
    q: Um die Texte besser ___ verstehen.
    options:
      - damit
      - für
      - zu
    answer: 2
    why: Инфинитивная группа.
  - type: choice
    q: Damit die Gäste den Ort ___.
    options:
      - gefunden
      - finden
      - zu finden
    answer: 1
    why: Личная форма в конце.
  - type: choice
    q: Weil der Text zu schwer ist — это…
    options:
      - Место
      - Причина
      - Подтверждённый результат
    answer: 1
    why: Объясняет принятое решение.
  - type: choice
    q: Damit при одном участнике…
    options:
      - Всегда запрещено
      - Только о прошлом
      - Возможно
    answer: 2
    why: Umzu короче, но damit тоже возможно.
  - type: order
    de: Ich lese laut, um Fehler zu finden.
    ru: Я читаю вслух, чтобы найти ошибки.
  - type: order
    de: Wir schreiben einfach, damit alle die Bilder verstehen.
    ru: Мы пишем просто, чтобы все поняли фотографии.
  - type: order
    de: Ich bringe eine Karte mit.
    ru: Я принесу карту.
  - type: order
    de: Die Gäste sollen den Ort erkennen.
    ru: Гости должны узнать место.
  - type: order
    de: Wir testen die Aufgabe mit einem Nachbarn.
    ru: Мы проверим задание с соседом.
  - type: order
    de: Die Markierung ist zu klein.
    ru: Метка слишком маленькая.
case:
  title: Ein Ziel ist noch kein Ergebnis
  ru: Сверка дневника
  intro: Проверьте, что хотел сделать организатор и что подтвердил посетитель.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wir schreiben einfache Texte, damit alle die Bilder verstehen.
          ru: Мы пишем простые тексты, чтобы все поняли фото.
      question: Это уже результат проверки?
      options:
        - Да, музей открыт
        - Нет, это цель
        - Да, все поняли
      answer: 1
      right: Damit выражает желаемый результат.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Der Nachbar erkennt die zweite Markierung zuerst nicht.
          ru: Сосед сначала не узнаёт вторую метку.
      question: Что стоит изменить?
      options:
        - Сделать метку заметнее
        - Объявить гостя невнимательным
        - Убрать карту без замены
      answer: 0
      right: Реплика показывает конкретную трудность материала.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Jetzt erkenne ich beide Orte.
          ru: Теперь я узнаю оба места.
      question: Что подтверждено?
      options:
        - Все будущие гости всё поймут
        - Все материалы идеальны
        - Этот посетитель нашёл оба места
      answer: 2
      right: Ответ подтверждает конкретную проверку.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Цель, трудность и проверенный результат записаны отдельно. Материал улучшен по действию
    посетителя.
adventure:
  kind: sequence
  title: Сделайте материал полезным посетителю
  intro: Для раздела о Шлезвиге друзья выбирают собственные фотографии поездки к домам викингов в
    Хайтабу. Одним гостям интересны детали, другим нужен короткий рассказ без специальных слов.
    Нужно подготовить подписи и задания так, чтобы люди действительно поняли материал.
  ending: "У трёх материалов есть понятные цели: найти место, понять фото и начать разговор.
    Намерение отделено от результата; подготовленный вариант ещё нужно попробовать с гостем."
  challenges:
    - id: goals
      kind: match
      title: Материал должен помогать действию
      intro: Свяжите материал с задачей посетителя.
      mode: reading
      clue:
        task: materials
      slots:
        - id: a
          label: Karte mit markierten Orten
          answer: finden
        - id: b
          label: Kurze Bildunterschrift
          answer: verstehen
        - id: c
          label: Offene Reisefrage
          answer: sprechen
      options:
        - id: finden
          label: Ort finden
        - id: verstehen
          label: Foto verstehen
        - id: sprechen
          label: ins Gespräch kommen
      success: Выбрана функция каждого элемента.
      wrong: Сравните цель A, B и C.
    - id: purpose
      kind: order
      title: Скажите, для кого вы упрощаете текст
      intro: Сохраните разных участников.
      label: Реплика для команды
      tokens:
        - Wir schreiben einfach,
        - damit
        - die Gäste alles
        - verstehen.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: kit
      kind: pack
      title: Соберите набор под три цели
      intro: Нужны место, понятное фото и разговор.
      mode: reading
      clue:
        task: materials
      options:
        - id: o0
          label: Карта с отмеченными местами
        - id: o1
          label: Короткая подпись
        - id: o2
          label: Открытый вопрос о поездке
        - id: o3
          label: Только длинный текст с терминами
      answer:
        - o0
        - o1
        - o2
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: same
      kind: select
      title: Один человек читает и ищет ошибки
      intro: Как выразить цель без смены действующего лица?
      options:
        - id: good
          label: Ich lese laut, um Fehler zu finden.
        - id: bad
          label: Ich lese laut, damit die Gäste Fehler zu finden.
        - id: reason
          label: Ich lese laut, weil Fehler.
      answer:
        - good
      success: "Читаю и ищу я сам: um ... zu подходит."
      wrong: В damit нужна личная форма, а weil вводит причину.
    - id: test
      kind: negotiation
      title: Проверьте, работает ли замысел
      intro: Не считайте цель достигнутой до ответа гостя.
      start: a
      nodes:
        - id: a
          text: "Nachbar: Ich sehe die Karte. Was soll ich suchen?"
          choices:
            - label: Finden Sie bitte Schleswig und Haithabu.
              next: b
              feedback: Посетителю дано конкретное действие.
        - id: b
          text: "Nachbar: Schleswig finde ich. Wo ist die zweite Markierung?"
          choices:
            - label: Die Markierung ist zu klein. Ich mache sie deutlicher.
              next: end
              feedback: Материал улучшен по реальной трудности.
        - id: end
          text: "Nachbar: Jetzt erkenne ich beide Orte. Danke."
          terminal: true
          choices: []
      success: Понимание подтверждено ответом, а не намерением.
      wrong: Уточните трудность посетителя.
