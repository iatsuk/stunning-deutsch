id: b1-ziele
order: 8
title: Wir schreiben kurze Texte, damit alle die Bilder verstehen.
ru: Объясняем цель и готовим понятную выставку
lede: Для раздела о Шлезвиге друзья выбирают собственные фотографии поездки к домам викингов в
  Хайтабу. Одним гостям интересны детали, другим нужен короткий рассказ без специальных слов.
  Нужно подготовить подписи и задания так, чтобы люди действительно поняли материал.
goals:
  - Выразить цель своего действия через um … zu
  - Назвать цель для другого человека через damit
  - Отличить причину от цели
  - Сопоставить разные мнения о выставках
grammar:
  - "Цель: um … zu / damit; отличие от причины weil"
exam:
  - b1-lesen-2
  - b1-sprachbausteine-2
  - b1-hoeren-1
  - b1-sprechen-2
