          Danach stelle ich Fragen. Eine gute Karte ist für mich wichtiger als ein lautes
          Video.
      - title: Person B · Jonas
        text: Ich merke mir mehr, wenn ich selbst etwas herausfinden muss. Letzte Woche suchte ich in
