    lines:
      - E: Ich finde auf dem Computer nur die Bilder vom Nachmittag.
        ru: На компьютере я нахожу только фотографии второй половины дня.
      - D: Du hattest am Vormittag mit dem Handy fotografiert.
        ru: Утром ты фотографировала на телефон.
      - E: Stimmt. Ich hatte die Kamera zu Hause vergessen.
        ru: Верно. Я забыла камеру дома.
      - M: Und ich hatte das Brot schon am Abend vorbereitet.
        ru: А я подготовил хлеб ещё вечером.
      - H: Nachdem wir in Lübeck angekommen waren, frühstückten wir am Wasser.
