spy:
  - de: "Sie hatte die Kamera vergessen."
    wrong: "Sie war die Kamera vergessen."
    why: "*vergessen* образует Plusquamperfekt с *hatte*."
  - de: "Wir waren in Lübeck angekommen."
    wrong: "Wir hatten in Lübeck angekommen."
    why: "*ankommen* — движение к цели: *waren*."
  - de: "Nachdem wir angekommen waren, frühstückten wir."
    wrong: "Nachdem wir angekommen sind, frühstückten wir."
    why: "То, что было раньше прошлого, — Plusquamperfekt: *waren*."
  - de: "Ich hatte die Bilder noch nicht kopiert."
    wrong: "Ich hatte die Bilder noch nicht gekopiert."
    why: "У глаголов на *-ieren* нет *ge-*: *kopiert*."

