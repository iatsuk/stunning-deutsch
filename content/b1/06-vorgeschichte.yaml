adventure:
  kind: sequence
  title: Восстановите историю фотографий
  intro: Элиф ищет снимки поездки в Любек. В заметке написано, что камера пропала и утренних
    фотографий нет. Нужно восстановить, что произошло до поездки, во время неё и после
    возвращения. Только тогда можно правильно обновить альбом.
  ending: Утренние снимки найдены на телефоне. Камера оставалась дома, а не пропала в поезде. В
    альбом идут копии после разрешения авторов; происхождение фотографий записано.
  challenges:
    - id: past
      kind: pack
      title: Что уже было сделано до поездки?
      intro: Прочитайте статью и отберите два действия.
      mode: reading
      clue:
        task: article
      options:
        - id: o0
          label: Куплены билеты в музей
        - id: o1
          label: Подготовлен хлеб
        - id: o2
          label: Скопированы все фото в общую папку
        - id: o3
          label: Потеряна камера в поезде
      answer:
        - o0
        - o1
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: aux
      kind: match
      title: Выберите знакомый вспомогательный глагол
      intro: Восстановите формы по Perfekt.
      slots:
        - id: a
          label: sie … fotografiert
          answer: hatte
        - id: b
          label: wir … angekommen
          answer: waren
        - id: c
          label: sie … die Kamera vergessen
          answer: hatte
      options:
        - id: hatte
          label: hatte
        - id: waren
          label: waren
      success: Вспомогательный глагол сохраняет выбор haben/sein.
      wrong: Ankommen использует sein; fotografieren и vergessen — haben.
    - id: before
      kind: order
      title: Свяжите прибытие и завтрак
      intro: Сначала группа приехала.
      label: Реплика для команды
      tokens:
        - Nachdem wir
        - angekommen waren,
        - frühstückten
        - wir.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: timeline
      kind: order
      title: Расставьте события по времени
      intro: Расположите четыре подтверждённых события, от самого раннего к позднему.
      label: Реплика для команды
      tokens:
        - "Freitag: Karten gekauft."
        - "Samstagabend: Kamera hingelegt."
        - "Sonntag: mit dem Handy fotografiert."
        - "Heute: Bilder kopiert."
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: ask
      kind: negotiation
      title: Получите разрешение на снимки
      intro: Объясните находку и уточните право использования.
      start: a
      nodes:
        - id: a
          text: "Dana: Sind die Fotos jetzt gefunden?"
          choices:
            - label: Ja. Ich hatte zuerst nur auf dem Computer gesucht.
              next: b
              feedback: Причина первоначального отсутствия объяснена.
        - id: b
          text: "Dana: Auf meinem Handy sind auch zwei Strandfotos."
          choices:
            - label: Darf ich sie mit deinem Namen im Album verwenden?
              next: end
              feedback: Перед передачей запрошено разрешение.
        - id: end
          text: "Dana: Ja, gern. Schreib bitte „Pause am Strand — Foto: Dana“."
          terminal: true
          choices: []
      success: Согласованы использование и подпись.
      wrong: Сначала уточните разрешение.
