id: b1-vorgeschichte
order: 6
title: Sie hatte die Kamera zu Hause vergessen.
ru: Восстанавливаем предысторию по источникам
lede: Элиф ищет снимки поездки в Любек. В заметке написано, что камера пропала и утренних
  фотографий нет. Нужно восстановить, что произошло до поездки, во время неё и после
  возвращения. Только тогда можно правильно обновить альбом.
goals:
  - Узнать действие, предшествующее другому прошлому событию
  - Выбрать hatte или war по знакомому Perfekt
  - Связать события с nachdem
  - Написать объяснение и просьбу по четырём пунктам
grammar:
  - "Plusquamperfekt: hatte/war + Partizip II; nachdem"
exam:
  - b1-lesen-2
  - b1-schreiben-1
