tasks:
  article:
    kind: worksheet
    part: b1-lesen-2
    format: article
    title: Warum die Bilder zuerst fehlten
    text: >-
      Für das Album sucht Elif Bilder von einem früheren Ausflug nach Lübeck. Zuerst findet sie
      nur Fotos vom Nachmittag. Dana erinnert sich noch gut an den Vormittag. Bevor die Gruppe
      zum Museum ging, saß sie am Wasser. Das Museum war nicht spontan ausgewählt: Elif hatte
      die Karten schon am Freitag gekauft. Am Sonntag trafen sich die Freunde am Bahnhof. Mateo
      hatte zu Hause Brot vorbereitet und brachte es in einer Tasche mit.


      Nach dem Frühstück bemerkte Elif, dass ihre Kamera nicht im Rucksack war. Sie war nicht
      im Zug verloren gegangen. Elif hatte die Kamera am Vorabend auf den Schreibtisch gelegt
      und morgens dort vergessen. Deshalb fotografierte sie mit dem Handy. Die anderen machten
      ebenfalls Bilder. Nachdem sie am Abend nach Kiel zurückgekommen waren, hatte niemand
      Lust, alle Dateien sofort zu sortieren.


      Heute schaut Elif noch einmal nach. Auf dem Handy sind die Bilder vom Vormittag
      vorhanden. Sie hatte zuerst nur den Ordner auf dem Computer geöffnet. Dort waren die
      Handyfotos noch nicht gespeichert. Nun kopiert sie sie in den gemeinsamen Ordner. Für das
      Album fehlen also keine Bilder. Elif notiert die Herkunft der Fotos und fragt die anderen
      vor einer Weitergabe um Erlaubnis. Der Eintrag über eine angeblich verlorene Kamera wird
      korrigiert.
    questions:
      - prompt: Wann kaufte Elif die Museumskarten?
        options:
          - Am Freitag
          - Erst im Museum
          - Nach der Reise
        answers:
          - Am Freitag
      - prompt: Wo war die Kamera?
        options:
          - Im Museum
          - Im Zug
          - Zu Hause
        answers:
          - Zu Hause
      - prompt: Womit fotografierte Elif?
        options:
          - Mit Mateos Kamera
          - Gar nicht
          - Mit dem Handy
        answers:
          - Mit dem Handy
      - prompt: Warum fand sie zuerst keine Vormittagsbilder?
        options:
          - Sie öffnete nur den Computerordner.
          - Die Kamera war gestohlen.
          - Das Handy war kaputt.
        answers:
          - Sie öffnete nur den Computerordner.
      - prompt: Was macht sie vor der Weitergabe?
        options:
          - Sie nennt alle Bilder ihre eigenen.
          - Sie fragt um Erlaubnis.
          - Sie löscht die Originale.
        answers:
          - Sie fragt um Erlaubnis.
  timeline:
    kind: message
    part: b1-lesen-2
    title: Vier Zeitpunkte · Ausschnitt
    text: "Freitag: Elif kauft die Museumskarten. Samstagabend: Sie legt die Kamera auf den
      Schreibtisch. Sonntagvormittag: Sie fotografiert mit dem Handy. Heute: Sie kopiert die
      Bilder in den gemeinsamen Ordner. Das sind verschiedene Zeitpunkte; die Kamera wurde
      nicht im Zug verloren."
  letter:
    kind: message
    part: b1-schreiben-1
    title: Die Fotos erklären und um Erlaubnis bitten
    text: Schreiben Sie Dana. Sie haben die Bilder vom Vormittag gefunden und möchten zwei ihrer
      Fotos in das gemeinsame Album aufnehmen.
    points:
      - Warum die Bilder zuerst nicht zu sehen waren
      - Was bei der Reise mit der Kamera passiert war
      - Welche Fotos Sie jetzt benutzen möchten
      - Bitte um Erlaubnis und Frage nach einer Bildunterschrift
    situation: Antworten Sie auf alle vier Punkte mit Anrede und Gruß. Erklären Sie die
      Vorgeschichte in verständlichen Sätzen.
    sample:
      - Liebe Dana, ich habe die Bilder vom Vormittag gefunden. Ich hatte zuerst nur den Ordner
        auf meinem Computer geöffnet. Die Handyfotos waren dort noch nicht gespeichert. In
        Lübeck habe ich mit dem Handy fotografiert, weil ich meine Kamera zu Hause vergessen
        hatte. Für unser Album möchte ich gern auch zwei deiner Strandfotos verwenden. Sie
        zeigen unsere gemeinsame Pause sehr schön. Bist du damit einverstanden? Welche
        Bildunterschrift passt für dich? Bitte schreib mir, wie ich deinen Namen nennen soll.
        Vielen Dank und liebe Grüße Elif
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Элиф ищет снимки поездки в Любек. В заметке написано, что камера пропала и утренних
          фотографий нет. Нужно восстановить, что произошло до поездки, во время неё и после
          возвращения. Только тогда можно правильно обновить альбом. Все нужные условия даны в
          сцене: знания географии, настоящих цен или расписаний не требуются. Сначала
          попробуйте понять, какого результата добиваются друзья, затем слушайте реплики. На
          новом уровне важно не только найти число или знакомое слово, но и связать несколько
          сведений."
        point: Восстанавливаем предысторию по источникам
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Здесь есть точка в прошлом и то, что произошло раньше неё. В момент поиска снимков
          выясняется, что Элиф до поездки оставила камеру дома, а после поездки ещё не
          перенесла фотографии. Plusquamperfekt помогает показать этот шаг назад. Само
          отсутствие файла в одной папке не означает потерю: вывод нужно проверить по другим
          источникам."
        point: "Plusquamperfekt: hatte/war + Partizip II; nachdem"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Названия устройств и действий нужны, чтобы найти снимки, а не выучить технический
          словарь. *Kopieren* не равняется *löschen*: перенос копии не удаляет оригинал.
          *Vorhanden* сообщает о наличии, *verloren* — о потере. В письме понадобится понятно
          объяснить происхождение фотографий и спросить разрешение перед их передачей группе."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Plusquamperfekt: hatte/war + Partizip II; nachdem"
    beats:
      - read: От знакомого Perfekt *sie hat vergessen* переходим к *sie hatte vergessen*.
          Вспомогательный глагол становится прошедшим, причастие сохраняется. Эта форма
          показывает действие раньше уже описываемого прошлого момента. Не нужно заменять ею
          все прошедшие события. Сначала выберите точку рассказа, затем решите, действительно
          ли требуется шаг назад.
        point: "Plusquamperfekt: hatte + Partizip II."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Если Perfekt строится с sein, для Plusquamperfekt используем war: *wir sind angekommen →
          wir waren angekommen*. Для фотографирования остаётся haben: *hat fotografiert → hatte
          fotografiert*. Выбор вспомогательного глагола не зависит от давности. Он опирается на
          уже знакомую модель конкретного глагола, поэтому повторяйте выражение вместе с
          формой."
        point: "Как в Perfekt: sein → war; haben → hatte."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Nachdem означает «после того как». В этой модели прошлой истории сначала завершается
          прибытие, затем происходит завтрак. Придаточная часть заканчивается вспомогательным
          глаголом *waren*. После запятой личный глагол главной части стоит сразу. Важно
          различить порядок слов в фразе и настоящий порядок событий: они не всегда перечислены
          одинаково."
        point: "nachdem: более раннее событие в придаточной части."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: В сочетании *angekommen waren* причастие находится перед личным вспомогательным глаголом.
          Главное действие начинается после завершения прибытия. В игре сначала определите,
          какое событие было раньше, и только потом собирайте фразу. Если поменять местами
          завтрак и прибытие по смыслу, получится другая история, даже при правильных
          окончаниях.
        point: "*Nachdem wir angekommen waren, frühstückten wir.*"
        set:
          view: sentence
          rows:
            - de:
                - Nachdem wir
                - angekommen waren,
                - frühstückten
                - wir.
              ru: После прибытия мы позавтракали.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: «Sie hatte fotografiert» означает действие позже поиска?
        read: "Нет. Это шаг назад относительно выбранного прошлого момента. Во время поиска фотографий
          мы говорим о снимках, уже сделанных в поездке. Чтобы не запутаться, назовите два
          события простыми словами: сначала фотографирование, потом поиск. Затем вернитесь к
          форме и найдите причастие с hatte."
        point: Сначала фотографирование, потом поиск.
        set:
          view: table
          table: rule
      - question: Почему angekommen waren, а не angekommen hatten?
        read: "У ankommen знакомое Perfekt строится с sein: *wir sind angekommen*. В более раннем
          прошлом меняется форма этого же вспомогательного глагола — *wir waren angekommen*. Не
          выбирайте hatte автоматически для каждого причастия. Сравните с *wir hatten
          fotografiert*: там исходная модель использует haben."
        point: "*sind angekommen → waren angekommen*."
        set:
          view: table
          table: rule
  - id: exam-article
    chapter: exam
    title: Warum die Bilder zuerst fehlten
    beats:
      - read: "Прочитайте весь текст до выбора ответа. Отдельно отметьте предысторию и сегодняшнюю
          находку: почему снимки сначала казались отсутствующими? В пяти вопросах есть
          варианты, которые звучат правдоподобно, но расширяют исходное сообщение. Для каждого
          решения найдите конкретную фразу, а не опирайтесь на первую заметку о якобы
          потерянной камере."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: article
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: article
        set:
          view: task
          task: article
          solved: true
  - id: exam-timeline
    chapter: exam
    title: Vier Zeitpunkte · Ausschnitt
    beats:
      - read: "Эта короткая шкала — опора для игры, а не полная экзаменационная часть. Сравните
          календарный порядок с грамматическими формами в длинной статье. Карточки не нужно
          угадывать по словам «сначала» и «потом»: даты и описанные действия позволяют
          восстановить цепочку. Проверьте, к какому прошлому моменту относится каждое более
          раннее событие."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: timeline
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
