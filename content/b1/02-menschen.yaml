tasks:
  profiles:
    kind: message
    part: b1-lesen-2
    title: Interessen der Gruppe · Leseausschnitt
    text: Dana hört gern zu und begrüßt neue Gäste. Mateo erzählt gern von Reisen, hat aber
      samstags keine freie Zeit. Elif wählt Fotos aus und erklärt ihre Auswahl. Hauke hat beim
      Club nachgefragt, aber noch keine Raumzusage bekommen. Für Sonntag sucht die Gruppe
      jemanden, der Geschichten erzählt. Die Person, die die Fotos erklärt, ist Elif.
