  talk:
    kind: card
    part: b1-sprechen-2
    title: Freizeit gemeinsam oder allein?
    theme: Gemeinsame Interessen
    word: Berichten · Meinung · eigenes Beispiel · Rückfrage
    situation: Lesen Sie nur Ihre Karte. Berichten Sie Ihrem Gegenüber über die Meinung. Sagen Sie
      dann Ihre eigene Meinung und erzählen Sie von einer Erfahrung.
    roles:
      - title: Person A
        text: "Eine Person schreibt: Ich verbringe freie Zeit gern mit anderen. Eine Gruppe, die
          ähnliche Interessen hat, gibt mir neue Ideen. Ich muss nicht alles allein
          organisieren. Wichtig ist, dass jeder mitentscheiden kann."
      - title: Person B
        text: "Eine andere Person schreibt: Ich mache in meiner Freizeit gern etwas allein. Dann kann
          ich selbst entscheiden, wie lange ich bleibe. In einer großen Gruppe dauert die
          Planung oft zu lange. Manchmal treffe ich aber gern einen Freund."
    sample:
      - Auf meiner Karte geht es um gemeinsame Freizeit. Die Person bekommt in einer Gruppe
        neue Ideen.
      - Ich verstehe das. Mir ist auch wichtig, dass jeder mitentscheiden kann. Wie ist das bei
        dir?
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Для FördeTreff нужны люди с разными интересами. Дана помогает найти подходящего
          собеседника для новых гостей. Читатель связывает описание человека с задачей, не
          делая выводов по имени или происхождению. Все нужные условия даны в сцене: знания
          географии, настоящих цен или расписаний не требуются. Сначала попробуйте понять,
          какого результата добиваются друзья, затем слушайте реплики. На новом уровне важно не
          только найти число или знакомое слово, но и связать несколько сведений."
        point: Описываем людей и выбираем помощника
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Описание не является ярлыком. Из реплик нужно понять, кто любит рассказывать, кто
          слушает и какая помощь действительно нужна. Относительная часть уточняет
          существительное: *eine Person, die zuhört*. Род берём из этого существительного, а
          роль местоимения определяем внутри новой части. Один человек может подходить
          нескольким задачам. Сначала используйте подтверждённые интересы, затем уточните
          согласие."
        point: "Относительные предложения: der, die, das, den"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Полезно описывать действие вместо общей оценки «хороший человек»: слушает, объясняет,
          рассказывает. *Jemanden um Hilfe bitten* — попросить кого-то о помощи. Это готовая
          фраза; сейчас важен объект *jemanden*, который в относительной части станет *den*.
          Слова обозначают реальные действия в игре, поэтому возвращайтесь к ним при выборе
          собеседника."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 16
  - id: grammar
    chapter: grammar
    title: "Относительные предложения: der, die, das, den"
    beats:
      - read: Один и тот же человек может быть *ein Helfer* или *eine Person*. Поэтому форма меняется
          не из-за биологического пола, а из-за выбранного существительного. После *Person*
          ставим *die*, после *Helfer* — *der*. Относительная часть уточняет, о каком человеке
          идёт речь. Не отделяйте её от существительного так далеко, чтобы слушатель потерял
          связь.
        point: Род определяет существительное перед запятой.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Внутри части *ich kenne den Helfer* подлежащее — *ich*, помощник является объектом.
          Поэтому мужской род получает *den*. Сравните: *der mich kennt* — он знает меня; *den
          ich kenne* — я знаю его. Для выбора помощника это разная информация. Внешний падеж
          существительного не нужно механически копировать в относительную часть."
        point: Падеж задаёт роль внутри относительной части.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Рамку относительной части выделяют запятые. В ней *wir* является подлежащим, фотографии
          — объектом, *zeigen* закрывает часть. Основное предложение продолжается после второй
          запятой. Сначала прочитайте его без уточнения: *Die Fotos sind aus Kiel*. Затем
          верните информацию о том, какие именно фотографии показывает группа."
        point: Личный глагол относительной части стоит в конце.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "В главной части сообщаем, что ищем помощника. В уточнении говорим, какое действие он
          выполняет: *der gern erzählt*. Оставьте личный глагол в конце относительной части.
          Чтобы проверить падеж, восстановите простую фразу: *Der Helfer erzählt*. Здесь нужен
          Nominativ. Если действие выполняю я — *ich kenne ihn* — модель изменится."
        point: "*Wir suchen einen Helfer, der gern erzählt.*"
        set:
          view: sentence
          rows:
            - de:
                - Wir
                - suchen
                - einen Helfer, der gern
                - erzählt.
              ru: Мы ищем помощника, который любит рассказывать.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: «Der mich kennt» и «den ich kenne» описывают одну связь?
        read: "Нет. В первом случае он знает меня, во втором я знаю его. Не ориентируйтесь только на
          знакомое существительное: найдите, кто выполняет действие внутри уточнения. Это
          поможет не отправить просьбу человеку, о котором в источнике сказано совсем другое."
        point: "*der mich kennt* ≠ *den ich kenne*."
        set:
          view: table
          table: rule
      - question: Почему о мужчине можно сказать «eine Person, die …»?
        read: "Потому что относительное местоимение согласуется с существительным *Person*, а не
          выбирается по полу человека. Та же логика работает с *das Mitglied*: средний род
          слова не сообщает пол участника. Используйте форму выбранного существительного, затем
          определите падеж внутри новой части."
        point: Род слова и роль внутри части проверяются отдельно.
        set:
          view: table
          table: rule
  - id: exam-profiles
    chapter: exam
    title: Interessen der Gruppe · Leseausschnitt
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: profiles
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: profiles
        set:
          view: task
          task: profiles
          solved: true
