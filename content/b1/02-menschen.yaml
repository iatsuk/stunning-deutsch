case:
  title: Wer kennt wen?
  ru: Сверка дневника
  intro: В пересказе перепутали того, кто знает человека, и того, кого знают. Проверьте связи.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Das ist ein Helfer, den Dana kennt.
          ru: Это помощник, которого знает Дана.
      question: Кто кого знает?
      options:
