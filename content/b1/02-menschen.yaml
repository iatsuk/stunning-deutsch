id: b1-menschen
order: 2
title: Wir suchen jemanden, der gern erzählt.
ru: Описываем людей и выбираем помощника
lede: Для FördeTreff нужны люди с разными интересами. Дана помогает найти подходящего
  собеседника для новых гостей. Читатель связывает описание человека с задачей, не делая
  выводов по имени или происхождению.
goals:
  - Описать человека через действие
  - Различить род исходного существительного и падеж внутри относительной части
  - Найти адресата по нескольким признакам
  - Пересказать чужое мнение о совместном досуге
grammar:
  - "Относительные предложения: der, die, das, den"
exam:
  - b1-lesen-2
  - b1-sprachbausteine-1
  - b1-sprechen-2
dialogues:
  scene:
    title: Wir suchen jemanden, der gern erzählt.
    ru: Описываем людей и выбираем помощника
    place: Kiel · клуб · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Wir suchen jemanden, der gern mit neuen Gästen spricht.
        ru: Мы ищем кого-то, кто любит разговаривать с новыми гостями.
      - H: Dana ist eine Person, die gut zuhört.
        ru: Дана — человек, который умеет слушать.
      - D: Danke. Ich brauche aber auch jemanden, den ich um Hilfe bitten kann.
        ru: Спасибо. Но мне также нужен кто-то, кого я могу попросить о помощи.
      - E: Mateo kann am Sonntag helfen. Er erzählt gern von seinen Reisen.
        ru: Матео может помочь в воскресенье. Он любит рассказывать о поездках.
      - M: Ja. Aber die Fotos, die wir zeigen, wählen wir zusammen aus.
        ru: Да. Но фотографии, которые мы покажем, выберем вместе.
      - H: Das ist ein Projekt, das viele kleine Beiträge braucht.
        ru: Это проект, которому нужно много небольших вкладов.
      - D: Dann fragen wir zuerst nach den Interessen und erst danach nach einer Aufgabe.
        ru: Тогда сначала спросим об интересах, а уже потом о задаче.
      - E: Gut. Niemand muss eine Rolle übernehmen, die nicht passt.
        ru: Хорошо. Никто не обязан брать роль, которая ему не подходит.
