      [[4]] die Auswahl erklärt. Das Treffen, [[5]] wir planen, hat noch keinen Termin. Mateo
      kann helfen, [[6]] er am Sonntag frei hat. Deshalb [[7]] wir ihn zuerst. Ich finde, [[8]]
      jeder eine kleine Aufgabe übernehmen kann. Zuerst sammeln wir Ideen, [[9]] schreiben wir
