id: b1-lernen
order: 3
title: In einem passenden Kurs lerne ich besser.
ru: Выбираем обучение по условиям
lede: "Матео хочет увереннее разговаривать с гостями ресторана. Он ищет практический курс в
  свободный понедельник, до обеда и не дороже 30 евро. Школа помогает сравнить предложения. Это
  отдельная учебная запись: вопрос о помещении FördeTreff пока остаётся открытым."
goals:
  - Описать условия курса с прилагательным в Dativ
  - Выбрать предложение по всем ограничениям
  - Понять уточнение из короткого сообщения
  - Задать встречный вопрос об учёбе
grammar:
  - "Прилагательные в Dativ: dem kleinen, einem passenden, neuen Kursen"
exam:
  - b1-lesen-3
  - b1-lesen-2
  - b1-hoeren-3
  - b1-sprechen-1
dialogues:
  scene:
    title: In einem passenden Kurs lerne ich besser.
    ru: Выбираем обучение по условиям
    place: Kiel · Sprachschule Förde · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      P:
        name: Frau Petersen
        voice: Sandy
    lines:
      - M: Ich möchte mit meinen Gästen sicherer sprechen. Gibt es einen passenden Kurs?
        ru: Я хочу увереннее разговаривать с гостями. Есть подходящий курс?
      - P: Ja. In einem praktischen Kurs üben Sie Gespräche aus dem Alltag.
        ru: Да. На практическом курсе вы тренируете повседневные разговоры.
      - M: Ich habe am Montagvormittag Zeit. Mehr als dreißig Euro möchte ich nicht ausgeben.
        ru: У меня есть время в понедельник до обеда. Больше тридцати евро я не хочу тратить.
      - P: Dann passt Angebot A. Der Kurs beginnt um neun Uhr und kostet fünfundzwanzig Euro.
        ru: Тогда подходит предложение A. Курс начинается в девять и стоит двадцать пять евро.
      - M: Wie viele Menschen lernen in der Gruppe?
        ru: Сколько человек в группе?
      - P: In der kleinen Gruppe sind acht Personen. Im Unterricht arbeiten Sie mit praktischen
          Beispielen.
        ru: В маленькой группе восемь человек. На занятиях вы работаете с практическими примерами.
      - M: Gut. Ich möchte mich für diesen Kurs anmelden.
        ru: Хорошо. Я хочу записаться на этот курс.
      - P: Ich bestätige Ihre Anmeldung für Montag um neun in der Sprachschule.
        ru: Подтверждаю вашу запись на понедельник в девять в языковой школе.
