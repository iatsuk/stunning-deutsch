spy:
  - de: "Ich lerne in einer kleinen Gruppe."
    wrong: "Ich lerne in einer kleine Gruppe."
    why: "В дательном падеже прилагательное получает *-en*: *kleinen*."
  - de: "Wir arbeiten mit neuen Beispielen."
    wrong: "Wir arbeiten mit neue Beispielen."
    why: "Дательный падеж мн. ч. без артикля: *neuen*."
  - de: "In einem praktischen Kurs üben wir Gespräche."
    wrong: "In einem praktischer Kurs üben wir Gespräche."
    why: "*in einem* — дательный падеж: *praktischen*."
  - de: "Ich möchte mit neuen Kontakten sprechen."
    wrong: "Ich möchte mit neuen Kontakte sprechen."
    why: "В дательном падеже мн. ч. существительное получает *-n*: *Kontakten*."

