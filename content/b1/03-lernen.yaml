steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Матео хочет увереннее разговаривать с гостями ресторана. Он ищет практический курс в
          свободный понедельник, до обеда и не дороже 30 евро. Школа помогает сравнить
          предложения. Это отдельная учебная запись: вопрос о помещении FördeTreff пока
          остаётся открытым. Все нужные условия даны в сцене: знания географии, настоящих цен
          или расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Выбираем обучение по условиям
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Глагол *lernen* остаётся знакомым, но описание условий становится точнее: в подходящем
          курсе, в маленькой группе, с новыми примерами. Сначала найдите предлог и артикль,
          затем окончание прилагательного. В этой теме не нужно заучивать сразу все падежные
          таблицы. Задача — использовать Dativ в повторяющихся бытовых сочетаниях и выбрать
          курс по трём условиям."
        point: "Прилагательные в Dativ: dem kleinen, einem passenden, neuen Kursen"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: Объявления часто похожи по теме, но не по условиям. *Vormittag* ограничивает часть суток,
          *kostenlos* означает отсутствие платы, *praktisch* описывает способ занятий. Самая
          низкая цена не компенсирует неподходящий день. В игре условия Матео даны явно, а в
          разговоре вы сможете сформулировать собственную цель и спросить об удобном времени.
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 16
  - id: grammar
    chapter: grammar
    title: "Прилагательные в Dativ: dem kleinen, einem passenden, neuen Kursen"
    beats:
      - read: "Dativ мужского и среднего рода уже виден в артикле *dem/einem*. Прилагательное в этих
          сочетаниях получает *-en*. Сравните знакомое *ein kleiner Raum* и *in einem kleinen
          Raum*. Меняется функция всей группы слов: мы описываем, где проходит занятие. Не
          добавляйте новое окончание только потому, что слово незнакомо; определите форму
          группы."
        point: После dem/einem прилагательное получает -en.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: В этой группе *der* обозначает Dativ женского рода. Оно не превращает слово *Gruppe* в
          мужской род. Существительное остаётся женского рода, а прилагательное получает *-en*.
          Сравните *die kleine Gruppe* с *in der kleinen Gruppe*. Контекст и предлог помогают
          отличить одинаково написанные формы артикля.
        point: После der/einer в Dativ тоже -en.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Без артикля во множественном Dativ прилагательное получает *-en*. У существительных
          часто появляется дополнительное *-n*: *Beispiele → Beispielen*, *Kurse → Kursen*.
          Если форма уже заканчивается на n или s, не добавляйте его механически. Здесь важно
          передать условия обучения, поэтому читайте сочетание целиком, а не отдельное
          окончание."
        point: "Во множественном Dativ: -en; проверьте и существительное."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Сочетание *in einem praktischen Kurs* занимает первую позицию целиком. Сразу после него
          идёт личный глагол *üben*, затем подлежащее *wir*. Порядок главного предложения не
          меняется из-за того, что обстоятельство стало длиннее. Если трудно, сначала соберите
          *Wir üben Gespräche*, затем добавьте описание места и условий.
        point: "*In einem praktischen Kurs üben wir Gespräche.*"
        set:
          view: sentence
          rows:
            - de:
                - In einem praktischen Kurs
                - üben
                - wir Gespräche.
                - ""
              ru: На практическом курсе мы тренируем разговоры.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: В «in der kleinen Gruppe» слово Gruppe стало мужского рода?
        read: "Нет. Это Dativ женского рода. Сравните с исходным *die Gruppe*. Род существительного
          сохраняется, а форма артикля зависит от функции сочетания. Полезно произнести пару
          целиком: *die kleine Gruppe — in der kleinen Gruppe*. Так вы связываете форму с
          действием, а не с отдельной буквой."
        point: "*die Gruppe → in der kleinen Gruppe*."
        set:
          view: table
          table: rule
      - question: Бесплатный курс в среду подходит запросу на понедельник?
        read: Нет. В запросе день является обязательным условием. Сначала исключаем неподходящее время,
          затем сравниваем оставшиеся условия. Для другого человека среда может быть идеальной.
          Игра проверяет понимание конкретного запроса, а не общую привлекательность курса.
        point: Все обязательные условия должны совпасть.
        set:
          view: table
          table: rule
  - id: exam-offers
    chapter: exam
    title: Zehn Situationen und zwölf Angebote
    beats:
      - read: "Сначала прочитайте ситуацию и определите, какие сведения требуется получить. Выполните
          задание самостоятельно до раскрытия образца. Игровые подсказки помогают учиться, но
          для проверки навыка попробуйте обойтись без них. После ответа сравните его с исходным
          текстом: объясните, какой фрагмент подтверждает каждое решение."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: offers
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
