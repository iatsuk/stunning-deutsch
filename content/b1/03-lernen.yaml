case:
  title: Zwei verschiedene Bestätigungen
  ru: Сверка дневника
  intro: В заметке о проекте использовали ответ о другом событии. Разделите курс и помещение встречи.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Montag 9–11 Uhr, Service-Deutsch, 25 Euro.
          ru: Понедельник 9–11, немецкий для обслуживания, 25 евро.
      question: Соответствует запросу Матео?
      options:
        - Да
        - Нет, нужен вечер
        - Нет, больше бюджета
      answer: 0
      right: День, цель и бюджет совпадают.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die Anmeldung zum Sprachkurs ist bestätigt.
          ru: Запись на языковой курс подтверждена.
      question: Что подтверждено?
      options:
        - Помещение FördeTreff
        - Все планы команды
        - Курс
      answer: 2
      right: Подтверждение относится к названному курсу.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Für den Raum des FördeTreffs gibt es noch keine Zusage.
          ru: Для помещения FördeTreff пока нет согласия.
      question: Какая запись верна?
      options:
        - Матео не записан на курс
        - Все помещения получены
        - Проектный запрос остаётся открытым
      answer: 2
      right: Разные запросы нужно учитывать отдельно.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Запись исправлена по источникам. В следующей главе команда воспользуется
    подтверждёнными сведениями для нового решения.
adventure:
  kind: sequence
  title: Подберите курс под жизнь человека
  intro: "Матео хочет увереннее разговаривать с гостями ресторана. Он ищет практический курс в
    свободный понедельник, до обеда и не дороже 30 евро. Школа помогает сравнить предложения.
    Это отдельная учебная запись: вопрос о помещении FördeTreff пока остаётся открытым."
  ending: Курс выбран и подтверждён по своим условиям. Подтверждение учебной записи не решает
    вопрос помещения праздника. Теперь команда может составить отдельный запрос для FördeTreff.
  challenges:
    - id: offer
      kind: select
      title: Сопоставьте три условия
      intro: Нужны понедельник до обеда, Service-Deutsch и цена не выше 30 евро.
      mode: reading
      clue:
        task: offers
      options:
        - id: o0
          label: a
        - id: o1
          label: b
        - id: o2
          label: c
        - id: o3
          label: d
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: forms
      kind: match
      title: Соберите описания условий
      intro: Соедините начало группы с правильным окончанием.
      slots:
        - id: r
          label: in einem … Raum
          answer: small
        - id: g
          label: in einer … Gruppe
          answer: small
        - id: b
          label: mit … Beispielen
          answer: new
      options:
        - id: small
          label: kleinen
        - id: new
          label: neuen
        - id: other
          label: kleiner
      success: Во всех этих моделях Dativ прилагательное заканчивается на -en.
      wrong: После einem/einer нужен -en; во множественном mit тоже.
    - id: sentence
      kind: order
      title: Объясните способ учёбы
      intro: Начните с условий курса.
      label: Реплика для команды
      tokens:
        - In einem praktischen Kurs
        - üben
        - wir
        - Gespräche.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: clock
      kind: clock
      title: Запишите начало подтверждённого курса
      intro: Используйте отдельное подтверждение курса.
      mode: reading
      clue:
        task: confirmation
      answer: 09:00
      initial: 08:00
      minuteStep: 5
      success: Курс начинается в 09:00.
      wrong: В подтверждении курса указано 9–11.
    - id: place
      kind: note
      title: Отделите курс от проекта
      intro: Где проходит подтверждённый курс? Это не бронь помещения FördeTreff.
      mode: reading
      clue:
        task: confirmation
      fields:
        - label: Ort des Kurses
          answers:
            - Sprachschule Förde
            - in der Sprachschule Förde
            - Sprachschule
      success: Учебная запись сохранена отдельно от проектного запроса.
      wrong: В подтверждении названа Sprachschule Förde.
