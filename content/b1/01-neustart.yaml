tasks:
  status:
    kind: message
    part: b1-lesen-2
    title: Was steht schon fest?
    text: "September, erste Besprechung: Das Küstenlogbuch ist fertig. Der Name FördeTreff steht
      fest. Die Gruppe möchte neue Menschen kennenlernen und ihre Sommerberichte zeigen. Hauke
      hat beim Club nachgefragt. Der Raum ist noch nicht bestätigt. Auch der Termin steht noch
      nicht fest. Mateo kann am Sonntag helfen, weil er frei hat. Dana kann die Gäste begrüßen.
      Elif würde gern die Bilder zeigen. Das sind Angebote für den gemeinsamen Plan, noch keine
      vollständige Aufgabenliste."
  headlines:
    kind: worksheet
    part: b1-lesen-1
    format: matching
    title: Fünf Texte, zehn Überschriften
    situation: Lesen Sie die fünf Texte. Wählen Sie für jeden Text die passende Überschrift. Jede
      Überschrift passt höchstens einmal. Alle Einrichtungen und Angebote sind erfundene
      Lernbeispiele.
    text: >-
      1. Ein Lernclub in Kiel plant einen Fotoabend. Die Mitglieder haben im Sommer Bilder am
      Wasser gemacht und kurze Geschichten dazu gesammelt. Jetzt möchten sie ihre Nachbarn
      einladen. Die Bilder hängen für einen Abend im Gemeinschaftsraum. Eintritt und Getränke
      sind kostenlos. Die Gäste können Fragen stellen und von ihren eigenen Erlebnissen
      erzählen. Es geht nicht um einen Fotowettbewerb, sondern um neue Kontakte im Stadtteil.


      2. Nach ihrer Arbeit haben viele Erwachsene nur wenig Zeit, Deutsch zu üben. Eine Gruppe trifft
      sich deshalb dienstags um 19 Uhr im Lernraum. Die Teilnehmer sprechen über ihren Alltag
      und erklären einander kurze Nachrichten. Eine Lehrerin hilft bei Fragen. Niemand muss vor
      dem Treffen lange Wortlisten lernen. Auch ohne Hausaufgaben kann man mitmachen. Am
      wichtigsten ist, dass jeder etwas sagt und den anderen zuhört.


      3. Einige neue Bewohner verstehen Alltagssprache, aber Briefe von einer Behörde sind für
      sie noch schwierig. Im Lernzentrum können sie deshalb einmal pro Woche gemeinsam solche
      Texte lesen. Die Helfer erklären Wörter und suchen mit den Besuchern die wichtigen
      Termine. Sie entscheiden nicht über Anträge und geben keine Rechtsberatung. Bei einer
      offenen Frage hilft die Gruppe, eine verständliche Rückfrage an die zuständige Stelle zu
      formulieren.


      4. Ein Treffpunkt am Hafen organisiert kleine Fahrten in die Umgebung. Vor jeder Fahrt
      vergleicht die Gruppe Preise, Interessen und freie Zeiten. Eine Person sucht eine
      Verbindung, eine andere fragt nach dem Museum. Danach entscheiden alle zusammen. Niemand
      muss sich mit Booten auskennen. Auch Menschen ohne Auto können teilnehmen. Die Gruppe
      möchte die Gegend kennenlernen und unterwegs miteinander sprechen, statt nur ein fertiges
      Programm zu bekommen.


      5. Die Lernbibliothek hat ihre Öffnungszeiten geändert. Früher war sie am Mittwochabend
      geschlossen. Jetzt kann man dort mittwochs bis 20 Uhr Bücher ausleihen. Gespräche sind im
      Eingangsbereich möglich; im Leseraum soll es ruhig bleiben. Wer ein Buch länger braucht,
      kann vorher eine Nachricht schreiben. Für Gruppen gibt es weiterhin einen eigenen Raum.
      Diesen Raum muss man reservieren. Die Änderungen gelten für alle Besucher, nicht nur für
      neue Mitglieder.
    uniqueOptions: true
    questions:
      - prompt: Text 1
        options: &a1
          - a · Neue Regeln für eine Bibliothek
          - b · Ausflüge gemeinsam vorbereiten
          - c · Nach der Arbeit zusammen Deutsch lernen
          - d · Hilfe beim Lesen amtlicher Briefe
          - e · Eine Fotoausstellung im Stadtteil
          - f · Ein neues Restaurant sucht Personal
          - g · Allein auf eine lange Reise gehen
          - h · Computer für eine Schule kaufen
          - i · Ein Kurs für die Führerscheinprüfung
          - j · Jeden Tag allein zu Hause lernen
        answers:
          - e · Eine Fotoausstellung im Stadtteil
      - prompt: Text 2
        options: *a1
        answers:
          - c · Nach der Arbeit zusammen Deutsch lernen
      - prompt: Text 3
        options: *a1
        answers:
          - d · Hilfe beim Lesen amtlicher Briefe
      - prompt: Text 4
        options: *a1
        answers:
          - b · Ausflüge gemeinsam vorbereiten
      - prompt: Text 5
        options: *a1
        answers:
          - a · Neue Regeln für eine Bibliothek
  voices:
    kind: worksheet
    part: b1-hoeren-1
    format: article
    title: Fünf Stimmen zum Mitmachen
    situation: "Hören Sie jede Stimme einmal und entscheiden Sie: richtig oder falsch. Im Lernmodus
      können Sie danach nochmals hören oder den Text öffnen."
    recordings:
      - voice: Anna
        text: Inzwischen kann ich im Alltag vieles selbst erledigen. Bei langen Briefen brauche ich
          manchmal noch Hilfe. Deshalb lese ich schwierige Texte gern mit anderen. Beim Treffen
          kann ich neue Gäste begrüßen. Einen Vortrag über medizinische Themen möchte ich dort
          nicht halten.
      - voice: Reed
        text: Ich arbeite weiterhin im Restaurant in Holtenau. Samstagabend habe ich normalerweise
          keine Zeit. Am Sonntag bin ich frei. Deshalb kann ich an diesem Tag beim Treffen
          helfen. Ich könnte etwas zu essen vorbereiten, aber zuerst möchte ich wissen, wie
          viele Gäste kommen.
      - voice: Flo
        text: Im Sommer haben wir viele Fotos gesammelt. Zuerst möchte ich mit der Gruppe eine kleine
          Auswahl machen. Danach können wir die Bilder beim Treffen zeigen. Die Reihenfolge
          steht noch nicht fest. Ich möchte deshalb noch kein fertiges Programm verschicken.
      - voice: Rocko
        text: Ich wohne in Hamburg und komme nicht jeden Tag nach Kiel. Für ein gemeinsames Treffen
          fahre ich aber gern dorthin. Ich habe beim Club nach einem Raum gefragt. Bisher habe
          ich keine Antwort bekommen. Deshalb kann ich den Ort noch nicht bestätigen.
      - voice: Shelley
        text: Beim Sprachenlernen möchte ich vor allem Gespräche führen. Eine Wortliste kann mir
          manchmal helfen, aber allein damit lerne ich nicht gern. Ich brauche eine Aufgabe und
          eine Antwort von einem anderen Menschen. Deshalb finde ich einen gemeinsamen Abend
          interessanter als einen Wettbewerb mit Vokabeln.
    questions:
      - prompt: Dana möchte beim Treffen einen medizinischen Vortrag halten.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Mateo kann am Sonntag helfen.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Elif möchte zuerst Fotos auswählen und sie danach zeigen.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Hauke hat schon eine Zusage für den Raum bekommen.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Die letzte Sprecherin lernt am liebsten nur mit Wortlisten.
        options:
          - richtig
          - falsch
        answers:
          - falsch
  self:
    kind: card
    part: b1-sprechen-1
    title: Einander kennenlernen
    theme: Neu im Team
    word: Name · Wohnort · Arbeit oder Studium · Sprachen · Erfahrung · Interesse
    situation: Lernen Sie eine andere Person kennen. Erzählen Sie etwas über sich, hören Sie zu und
      fragen Sie nach. Berichten Sie auch von einem Erlebnis. Sie sprechen über sich selbst;
      Sie müssen keine Biografie auswendig lernen.
    roles:
      - title: Person A
        text: Beginnen Sie mit zwei oder drei Informationen über sich. Fragen Sie dann, warum Ihr
          Gegenüber Deutsch lernt und was es gern in einer Gruppe macht. Reagieren Sie auf eine
          Antwort.
      - title: Person B
        text: Antworten Sie und erzählen Sie etwas über sich. Fragen Sie nach einem Erlebnis oder
          Interesse der anderen Person. Wechseln Sie danach die Rollen.
    sample:
      - Ich wohne in Kiel und lerne Deutsch, weil ich mich im Alltag sicherer fühlen möchte.
      - Im Sommer habe ich mit Freunden eine Fahrt geplant. Zuerst haben wir die Zeiten
        verglichen. Danach haben wir zusammen entschieden.
      - Und was machst du gern in einer Gruppe?
      - Du hast von einer Fahrt erzählt. Wohin seid ihr gefahren?
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Летний Küstenlogbuch закончен. В сентябре Дана, Матео, Элиф и Хауке обсуждают осенний
          FördeTreff: встречу с фотографиями, рассказами и едой. Прежде чем брать задачи, нужно
          понять опыт друзей, их возможности и то, что пока осталось только идеей. Все нужные
          условия даны в сцене: знания географии, настоящих цен или расписаний не требуются.
          Сначала попробуйте понять, какого результата добиваются друзья, затем слушайте
          реплики. На новом уровне важно не только найти число или знакомое слово, но и связать
          несколько сведений."
        point: Связный рассказ и новое общее дело
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "На A2 вы уже находили нужное время и выбирали вариант по условиям. Теперь важно связать
          сведения: что команда сделала, почему появилась новая идея и какие вопросы ещё
          открыты. *Zuerst* и *danach* связывают события по времени. *Deshalb* связывает
          причину с последствием. Уверенное название встречи не означает, что уже подтверждены
          помещение и дата. В следующей реплике ищите не просто знакомое слово, а то, что оно
          добавляет к общей истории."
        point: zuerst → danach → deshalb; повтор weil и dass
        set:
          reveal: 10
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Выбирайте роль по возможностям и интересу. *Etwas beitragen* означает внести свой вклад. *Eine Aufgabe übernehmen* означает взять на
          себя задачу, *eine Rückmeldung bekommen* — получить ответ. Между обещанием помочь и
          уже выполненным делом остаётся разница. В новых текстах встретятся слова *Beitrag*,
          *Erfahrung* и *Austausch*: они помогают говорить об участии, прошлом опыте и общении.
          Для начала достаточно понять их в контексте задачи, а не воспроизвести всю словарную
          группу."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 20
  - id: grammar
    chapter: grammar
    title: zuerst → danach → deshalb; повтор weil и dass
    beats:
      - read: "Эти слова помогают слушателю восстановить порядок, даже если он не был с вами. После
          обстоятельства личный глагол остаётся на второй позиции: *Danach haben wir …*. Между
          обстоятельством и глаголом не нужно добавлять подлежащее. В разговоре необязательно
          перечислять каждую минуту: выберите события, без которых собеседник не поймёт, как
          команда пришла к своей идее."
        point: zuerst / danach связывают события по времени.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Первая фраза сообщает причину, вторая — её результат. *Deshalb* занимает первую позицию,
          поэтому *kann* идёт сразу за ним, а *er* — после глагола. *Helfen* остаётся в конце
          модальной рамки. Не всякое следующее событие является последствием предыдущего:
          свободное воскресенье объясняет возможность помочь, но не доказывает, что помещение
          уже получено."
        point: deshalb называет последствие; после него — глагол.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Это знакомая связь из A2. Сравните две версии: *Er hat frei. Deshalb kann er helfen* и
          *Er kann helfen, weil er frei hat*. Смысл причины сохраняется, но предложения
          устроены по-разному. Не переносите порядок слов после *weil* в часть с *deshalb*.
          Ваша цель — выбрать подходящую связь и сделать сообщение понятным, а не вставить как
          можно больше союзов."
        point: "weil: причина в придаточном, глагол в конце."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
      - read: "Элиф предлагает распределить небольшие задачи. Это её мнение о совместной работе, а не
          уже готовый список обязанностей. После *dass* знакомый порядок: подлежащее,
          дополнение, инфинитив и личная модальная форма. Используйте эту рамку для собственной
          мысли. Если ответ длинный, разделите его на две понятные фразы вместо одного
          предложения с несколькими вложенными частями."
        point: dass передаёт мысль; личный глагол остаётся в конце.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
            - 3
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Начните со следствия: *Deshalb kann Mateo am Sonntag helfen*. Слово *deshalb* занимает
          первую позицию целиком, *kann* — вторую, а инфинитив *helfen* закрывает рамку. Если
          начать с имени, получится *Mateo kann deshalb am Sonntag helfen*. Обе версии
          подходят. В игре начальное слово задано, чтобы вы потренировали перестройку, а не
          угадали единственный возможный способ выразить мысль."
        point: "*Deshalb kann Mateo am Sonntag helfen.*"
        set:
          view: sentence
          rows:
            - de:
                - Deshalb
                - kann
                - Mateo am Sonntag
                - helfen.
              ru: Поэтому Матео может помочь в воскресенье.
      - read: "Теперь вернитесь к завершённому событию: *Danach haben wir die Fotos gesammelt*.
          Вспомогательный глагол стоит сразу после обстоятельства, а причастие — в конце. Эта
          рамка уже знакома. Новая задача состоит в выборе связи: *danach* показывает, что было
          потом, но не утверждает, что сбор фотографий был необходимым следствием первого
          действия."
        point: "*Danach haben wir die Fotos gesammelt.*"
        set:
          view: sentence
          rows:
            - de:
                - Danach
                - haben
                - wir die Fotos
                - gesammelt.
              ru: После этого мы собрали фотографии.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: После deshalb нужно «Mateo kann» или «kann Mateo»?
        read: "Если *deshalb* стоит в начале главного предложения, сразу после него нужен личный
          глагол: *Deshalb kann Mateo helfen*. Это та же вторая позиция, что и после *danach*.
          В русском порядок не подсказывает форму автоматически, поэтому перед продолжением
          найдите первую позицию, затем глагол, затем подлежащее."
        point: "*Deshalb kann Mateo helfen.*"
        set:
          view: table
          table: rule
      - question: «Я уточнил в клубе» означает, что помещение уже подтверждено?
        read: "Нет. Хауке сделал запрос, но отдельно сказал, что ответа пока нет. Для подтверждения
          нужен ответ клуба. В отчёте это две разные строки: действие выполнено, результат ещё
          неизвестен. Слова о возможности и желании тоже не стоит превращать в готовую
          договорённость."
        point: Запрос отправлен ≠ положительный ответ получен.
        set:
          view: table
          table: rule
      - question: В тексте упомянуто кафе. Значит ли это, что текст о еде?
        read: Не обязательно. Встреча может проходить в кафе, но главной темой быть знакомство или
          изучение языка. Заголовок должен описывать смысл целого текста. Проверьте, зачем люди
          встречаются и какой результат хотят получить. Место, время и пример помогают понять
          содержание, но не всегда являются его главной мыслью.
        point: Заголовок отражает главную мысль, а не случайную деталь.
        set:
          view: table
          table: rule
