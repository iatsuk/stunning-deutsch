case:
  title: Was steht fest — und was fehlt noch?
  ru: Проверка пересказа
  intro: "После первой встречи появился слишком уверенный пересказ. Восстановите точную версию:
    что произошло, почему Матео может помочь и что клуб действительно ответил."
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Zuerst haben wir Fahrten geplant. Danach haben wir Fotos gesammelt.
          ru: Сначала мы планировали поездки. После этого собрали фотографии.
      question: Какая связь дана прямо?
      options:
        - Временная последовательность
        - Фотографии вызвали поездки
        - Бронь помещения
      answer: 0
      right: Zuerst и danach задают порядок, не обещая причинной связи.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Mateo hat am Sonntag frei. Deshalb kann er helfen.
          ru: В воскресенье Матео свободен. Поэтому он может помочь.
      question: Что является следствием?
      options:
        - Возможность помочь
        - Рабочая смена в субботу
        - Подтверждение помещения
      answer: 0
      right: Свободное воскресенье объясняет возможность, но не решает вопрос помещения.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Hauke hat beim Club nachgefragt. Eine Antwort hat er noch nicht bekommen.
          ru: Хауке уточнил в клубе. Ответа он пока не получил.
      question: Какую строку допустимо внести в отчёт?
      options:
        - Помещение подтверждено
        - Запрос отправлен, ответ ожидается
        - Клуб отказал
      answer: 1
      right: Ожидание ответа не равно ни согласию, ни отказу.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: "Пересказ исправлен: опыт, возможность и подтверждение разделены. Теперь о следующем
    шаге можно говорить уверенно, не придумывая готовую программу."
adventure:
  kind: sequence
  title: Соберите первый план FördeTreff
  intro: "Летний Küstenlogbuch закончен. В сентябре Дана, Матео, Элиф и Хауке обсуждают осенний
    FördeTreff: встречу с фотографиями, рассказами и едой. Прежде чем брать задачи, нужно
    понять опыт друзей, их возможности и то, что пока осталось только идеей."
  ending: Команда отделила опыт от обещаний, записала открытые вопросы и нашла посильные роли.
    Первое решение — подготовить предложения, не выдавая их за утверждённую программу. Дальше
    предстоит точнее описать людей и задачи.
  challenges:
    - id: timeline
      kind: match
      title: Разделите результат, цель и открытый вопрос
      intro: Сопоставьте сообщения с тем, что они добавляют к общему рассказу.
      mode: reading
      clue:
        task: status
      slots:
        - id: past
          label: Das Küstenlogbuch ist fertig.
          answer: done
        - id: idea
          label: Wir möchten neue Menschen kennenlernen.
          answer: wish
        - id: room
          label: Der Raum ist noch nicht bestätigt.
          answer: open
      options:
        - id: done
          label: завершённый результат
        - id: wish
          label: цель новой встречи
        - id: open
          label: вопрос без подтверждения
      success: Готовый дневник, новая цель и незакрытый вопрос не смешались.
      wrong: Готовность дневника не подтверждает помещение. Желание познакомиться — цель.
    - id: heading
      kind: select
      title: Выберите главную мысль сообщения
      intro: Текст описывает новую инициативу команды. Какая формулировка охватывает весь замысел?
      mode: reading
      clue:
        task: status
      options:
        - id: o0
          label: Die Gruppe plant einen gemeinsamen Abend und klärt noch die Bedingungen.
        - id: o1
          label: Die Gruppe sucht ein neues Restaurant für Mateo.
        - id: o2
          label: Alle Termine und Räume sind schon bestätigt.
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: consequence
      kind: order
      title: Объясните возможность Матео
      intro: "Начните с Deshalb: «Поэтому Матео может помочь в воскресенье»."
      label: Реплика для команды
      tokens:
        - Deshalb
        - kann
        - Mateo am Sonntag
        - helfen.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: role
      kind: negotiation
      title: Выберите посильную роль
      intro: Вы можете помочь с фотографиями или приветствием гостей. Оба пути допустимы; узнайте и
        подтвердите следующий шаг.
      start: start
      success: Вы взяли конкретную задачу и подтвердили следующий шаг без неподтверждённых обещаний.
      wrong: Сначала уточните задачу и подтверждение, не обещайте готовую программу.
      nodes:
        - id: start
          text: "Elif: Wir brauchen Hilfe mit den Fotos und beim Begrüßen der Gäste. Was möchtest du
            machen?"
          choices:
            - label: Ich möchte die Fotos auswählen.
              next: photos
              feedback: Вы выбрали подготовку изображений.
            - label: Ich möchte neue Gäste begrüßen.
              next: guests
              feedback: Вы выбрали общение с гостями.
        - id: photos
          text: "Elif: Gut. Aber zuerst wählen wir die Bilder aus. Können wir schon eine fertige
            Ausstellung ankündigen?"
          choices:
            - label: Ja, alles ist schon fertig.
              next: retry
              feedback: Изображения ещё не выбраны, помещение не подтверждено.
            - label: Nein. Zuerst wählen wir die Fotos aus, danach planen wir die Ausstellung.
              next: end-photos
              feedback: Последовательность соответствует фактам.
        - id: retry
          text: "Elif: Die Auswahl ist noch nicht fertig. Was machen wir zuerst?"
          choices:
            - label: Zuerst wählen wir die Bilder aus.
              next: end-photos
              feedback: Вы вернулись к реальному следующему шагу.
        - id: guests
          text: "Dana: Gut. Dann sammeln wir zuerst Fragen für die Gäste. Den Ort können wir noch nicht
            bestätigen."
          choices:
            - label: Ich bereite Fragen vor. Danach klären wir den Ort.
              next: end-guests
              feedback: Задача понятна, место не выдумано.
        - id: end-photos
          text: "Elif: Abgemacht. Wir beginnen mit der Auswahl."
          terminal: true
          choices: []
        - id: end-guests
          text: "Dana: Abgemacht. Wir bereiten das Gespräch vor."
          terminal: true
          choices: []
    - id: note
      kind: note
      title: Оставьте надёжную заметку
      intro: Запишите известное название встречи и статус помещения. Для статуса подходит «ещё не
        подтверждено» по-немецки.
      mode: reading
      clue:
        task: status
      fields:
        - label: Name des Treffens
          answers:
            - FördeTreff
            - Foerdetreff
        - label: "Raum: Status"
          answers:
            - noch nicht bestätigt
            - nicht bestätigt
            - noch offen
            - offen
      success: Название подтверждено, помещение остаётся открытым вопросом. В заметке нет вымышленной
        брони.
      wrong: Название — FördeTreff. Помещение ещё не подтверждено; открытый вопрос не означает
        «помещение открыто».
