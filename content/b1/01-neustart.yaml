id: b1-neustart
order: 1
title: Was können wir gemeinsam beitragen?
ru: Связный рассказ и новое общее дело
lede: "Летний Küstenlogbuch закончен. В сентябре Дана, Матео, Элиф и Хауке обсуждают осенний
  FördeTreff: встречу с фотографиями, рассказами и едой. Прежде чем брать задачи, нужно понять
  опыт друзей, их возможности и то, что пока осталось только идеей."
goals:
  - Связать события словами zuerst и danach, а причину — с последствием через deshalb
  - Различить выполненное действие, возможность и неподтверждённое предложение
  - Найти главную мысль короткого текста, не отвлекаясь на отдельную деталь
  - Выбрать посильную роль и уточнить задачу собеседника
  - Рассказать о себе и поддержать знакомство встречными вопросами
grammar:
  - zuerst → danach → deshalb; повтор weil и dass
exam:
  - b1-lesen-2
  - b1-lesen-1
  - b1-hoeren-1
  - b1-sprechen-1
dialogues:
  scene:
    title: Was können wir gemeinsam beitragen?
    ru: Связный рассказ и новое общее дело
    place: Kiel · клуб на Kiellinie · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - D: Im Sommer haben wir viel zusammen erlebt. Zuerst haben wir kleine Fahrten geplant.
        ru: Летом мы многое пережили вместе. Сначала мы планировали небольшие поездки.
      - E: Danach haben wir Fotos und kurze Berichte gesammelt. Unser Küstenlogbuch ist fertig.
        ru: Потом мы собрали фотографии и короткие отчёты. Наш дневник закончен.
      - H: Die Berichte sind interessant. Deshalb möchte ich neue Leute zu einem Fotoabend einladen.
        ru: Рассказы интересные. Поэтому я хочу пригласить новых людей на фотовечер.
      - M: Ich kann am Sonntag helfen, weil ich dann frei habe. Am Samstag arbeite ich.
        ru: Я могу помочь в воскресенье, потому что тогда свободен. В субботу я работаю.
      - D: Ich kann die Gäste begrüßen und mit ihnen sprechen. Das habe ich im Sommer oft gemacht.
        ru: Я могу встречать гостей и разговаривать с ними. Летом я часто это делала.
      - E: Ich würde gern die Bilder zeigen. Zuerst möchte ich aber wissen, ob wir den Raum bekommen.
        ru: Я бы хотела показать фотографии. Но сначала хочу узнать, получим ли мы помещение.
      - H: Ich habe beim Club nachgefragt. Eine Antwort haben wir noch nicht.
        ru: Я уточнил в клубе. Ответа пока нет.
      - M: Dann sammeln wir zuerst unsere Ideen. Danach schreiben wir einen gemeinsamen Plan.
        ru: Тогда сначала соберём наши идеи. Потом напишем общий план.
      - D: Gut. Wir nennen das Treffen FördeTreff. Der Name steht fest, aber den Termin müssen wir noch
          klären.
        ru: Хорошо. Назовём встречу FördeTreff. Название решено, но дату нам ещё нужно уточнить.
      - E: Ich finde, dass jeder eine kleine Aufgabe übernehmen kann. Was möchtest du beitragen?
        ru: Думаю, каждый может взять небольшую задачу. А какой вклад хочешь внести ты?
