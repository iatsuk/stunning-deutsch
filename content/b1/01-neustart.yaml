spy:
  - de: "Deshalb kann Mateo am Sonntag helfen."
    wrong: "Deshalb Mateo kann am Sonntag helfen."
    why: "*deshalb* занимает первую позицию, глагол идёт сразу за ним."
  - de: "Mateo kann helfen, weil er am Sonntag frei hat."
    wrong: "Mateo kann helfen, weil er hat am Sonntag frei."
    why: "После *weil* глагол уходит в конец: *frei hat*."
  - de: "Ich finde, dass jeder eine Aufgabe übernehmen kann."
    wrong: "Ich finde, dass jeder kann eine Aufgabe übernehmen."
    why: "После *dass* спрягаемый глагол уходит в конец: *übernehmen kann*."
  - de: "Danach haben wir die Fotos gesammelt."
    wrong: "Danach wir haben die Fotos gesammelt."
    why: "После *danach* сразу идёт глагол: *haben wir*."

