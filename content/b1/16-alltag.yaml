case:
  title: Nicht nötig ist kein Verbot und keine Erledigung
  ru: Сверка дневника
  intro: Проверьте необходимость, ответственность и реальный результат.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Du brauchst keine Becher zu kaufen. Elif leiht sie am Freitag aus.
          ru: Не нужно покупать стаканы. Элиф возьмёт их в пятницу.
      question: Покупку Матео запрещают?
      options:
        - Да, это прямой запрет
        - Он уже купил стаканы
        - Нет, она не требуется по плану
      answer: 2
      right: Brauchen с отрицанием снимает необходимость.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Elif meldet sich nach der Abholung.
          ru: Элиф сообщит после получения.
      question: Статус сейчас — стаканы уже получены?
      options:
        - Элиф отказалась
        - Нет, ждём подтверждения выполнения
        - Да
      answer: 1
      right: Нужно реальное сообщение после действия.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Raum verlassen 18:00. Schlüssel zurück bis 18:15.
          ru: Выйти из помещения 18:00. Вернуть ключ до 18:15.
      question: Можно использовать зал до 18:15?
      options:
        - Нет, это срок ключа
        - Да
        - Только после уборки
      answer: 0
      right: Разные сроки относятся к разным действиям.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Снятая необходимость, новая ответственность и выполненная задача больше не смешиваются.
    План учитывает рабочее время участников.
adventure:
  kind: sequence
  title: Снимите лишние задачи, сохранив нужные
  intro: "Матео работает со вторника по субботу 17–23 и пытается взять ещё несколько задач
    подготовки. Команда проверяет список: что обязательно, что уже предусмотрено, а что можно
    поручить другому. Raum C и кухня подтверждены; встреча остаётся 18 октября 15–18 часов."
  ending: Задачи распределены по времени и подтверждены участниками. Матео не покупает лишние
    стаканы и не дублирует получение ключа; выполненные пункты будут отмечены после реальных
    сообщений.
  challenges:
    - id: meaning
      kind: match
      title: Не нужно, нельзя или только это?
      intro: Определите смысл фразы, а не только отрицание.
      slots:
        - id: a
          label: Du brauchst nicht zu kommen.
          answer: optional
        - id: b
          label: Du darfst nicht kommen.
          answer: forbidden
        - id: c
          label: Du brauchst nur die Liste zu prüfen.
          answer: limited
      options:
        - id: optional
          label: не требуется
        - id: forbidden
          label: запрещено
        - id: limited
          label: ограниченная задача
      success: Необходимость, запрет и объём различены.
      wrong: Brauchen с отрицанием снимает необходимость; dürfen запрещает.
    - id: alone
      kind: order
      title: Снимите перегрузку понятной фразой
      intro: Сохраните zu в письменной модели.
      label: Реплика для команды
      tokens:
        - Du brauchst
        - nicht
        - alles allein
        - zu machen.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: todo
      kind: select
      title: Что остаётся у Матео?
      intro: Прочитайте список распределения.
      mode: reading
      clue:
        task: plan
      options:
        - id: o0
          label: Проверить ингредиенты и организовать еду
        - id: o1
          label: Самому купить стаканы
        - id: o2
          label: Лично забрать ключ вместо Хауке
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: return
      kind: clock
      title: Крайний срок возврата ключа
      intro: Не перепутайте его с выходом из зала.
      mode: reading
      clue:
        task: plan
      answer: 18:15
      initial: 18:00
      minuteStep: 5
      success: Из зала выходят 18:00, ключ возвращают до 18:15.
      wrong: Нужно 18:15 — срок ключа, не 18:00 — выход.
    - id: delegate
      kind: negotiation
      title: Получите реальную помощь, а не новое обещание за другого
      intro: Матео работает в пятницу. Согласуйте другой вариант.
      start: a
      nodes:
        - id: a
          text: "Mateo: Am Freitag arbeite ich ab 17 Uhr. Die zusätzliche Abholung schaffe ich nicht."
          choices:
            - label: Dann fragen wir Elif nach der Abholung.
              next: c
              feedback: Вы предлагаете проверить другую возможность.
            - label: Du solltest trotzdem alles selbst abholen.
              next: b
              feedback: Это не учитывает названное ограничение.
        - id: b
          text: "Mateo: Dann komme ich nicht rechtzeitig zur Arbeit. Wir brauchen eine andere
            Verteilung."
          choices:
            - label: Stimmt. Wir fragen Elif, statt die Aufgabe einfach festzulegen.
              next: c
              feedback: Вы исправили предложение после возражения.
        - id: c
          text: "Elif: Ich kann die Becher am Freitag holen und danach eine Nachricht schicken."
          choices:
            - label: Danke. Dann braucht Mateo keine Becher zu kaufen. Wir warten auf deine Rückmeldung.
              next: end
              feedback: Есть согласие, задача и проверка выполнения.
        - id: end
          text: "Elif: Einverstanden. Nach der Abholung bestätige ich, dass die Becher da sind."
          terminal: true
          choices: []
      success: Помощь подтверждена, её выполнение ещё будет проверено.
      wrong: Учтите смену и дождитесь согласия другого участника.
