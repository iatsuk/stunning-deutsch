tasks:
  plan:
    kind: message
    part: b1-lesen-2
    title: Was bleibt für wen? · Ausschnitt
    text: "Bestätigt: Raum C mit Küche, 18. Oktober 15–18 Uhr, 40 Euro. Hauke holt den Schlüssel
      14:30 ab und gibt ihn bis 18:15 in die Schlüsselbox zurück. Ab 17:40 räumen alle
      gemeinsam auf; 18:00 verlassen sie den Raum. Elif leiht am Freitag Mehrwegbecher aus. Bis
      Donnerstag prüft Mateo nur die Zutatenliste. Am Sonntag organisiert er das Essen. Er
      braucht keine Becher zu kaufen und den Schlüssel nicht selbst abzuholen. Abholung der
      Becher ist eine Aufgabe, noch kein erledigter Punkt."
  gaps:
    kind: worksheet
    part: b1-sprachbausteine-1
    format: cloze
    title: Eine Nachricht zur Entlastung
    text: Hallo Mateo, du [[1]] die Becher nicht [[2]] kaufen. Elif übernimmt das, [[3]] du am
      Freitag arbeitest. Der Raum [[4]] letzte Woche bestätigt. Hauke spricht mit [[5]]
      Hausmeister. Das sind Menschen, mit [[6]] wir die Übergabe klären. [[7]] wir losgehen,
      prüfen wir die Liste. Es ist wichtig, [[8]] alle ihren Teil kennen. Du brauchst [[9]] die
      Zutaten zu prüfen. Wir helfen [[10]] gegenseitig. Viele Grüße, Dana
    questions:
      - prompt: Lücke 1
        options:
          - hast
          - brauchst
          - darfst
        answers:
