id: b1-alltag
order: 16
title: Du brauchst nicht alles allein zu machen.
ru: Разгружаем план и различаем необходимость и запрет
lede: "Матео работает со вторника по субботу 17–23 и пытается взять ещё несколько задач
  подготовки. Команда проверяет список: что обязательно, что уже предусмотрено, а что можно
  поручить другому. Raum C и кухня подтверждены; встреча остаётся 18 октября 15–18 часов."
goals:
  - Понять отсутствие необходимости через nicht brauchen … zu
  - Отличить его от запрета nicht dürfen
  - Объяснить ограниченную задачу через nur
  - Согласовать посильное распределение и возврат ключа
grammar:
  - nicht brauchen … zu / nur brauchen … zu; совет и обязанность
exam:
  - b1-lesen-2
  - b1-sprachbausteine-1
  - b1-hoeren-3
  - b1-schreiben-1
  - b1-sprechen-3
dialogues:
  scene:
    title: Du brauchst nicht alles allein zu machen.
    ru: Разгружаем план и различаем необходимость и запрет
    place: Kiel · последняя неделя подготовки · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - M: Ich muss am Freitag auch noch die Becher kaufen.
        ru: Мне ещё нужно в пятницу купить стаканы.
      - E: Du brauchst die Becher nicht zu kaufen. Ich leihe Mehrwegbecher aus.
        ru: Тебе не нужно покупать стаканы. Я возьму многоразовые напрокат.
      - D: Du brauchst nicht alles allein zu machen. Du kümmerst dich um das Essen.
        ru: Не нужно делать всё одному. Ты занимаешься едой.
      - H: Ich hole den Schlüssel um halb drei ab. Du brauchst dafür nicht extra zu kommen.
        ru: Я заберу ключ в половине третьего. Тебе не нужно ради этого специально приходить.
      - M: Dann brauche ich nur die Zutatenliste zu prüfen.
        ru: Тогда мне нужно только проверить список ингредиентов.
      - E: Genau. Am Freitag arbeitest du ab fünf. Wir stimmen die Abholung ohne dich ab.
        ru: Верно. В пятницу ты работаешь с пяти. Самовывоз согласуем без тебя.
      - D: Wir sollten auch kurze Pausen einplanen und die Aufgaben wechseln.
        ru: Нам стоит предусмотреть и короткие перерывы и меняться задачами.
      - H: Um zwanzig vor sechs räumen wir gemeinsam auf. Den Schlüssel gebe ich bis Viertel nach sechs
          zurück.
        ru: В без двадцати шесть начнём убирать вместе. Ключ я верну до четверти седьмого.
