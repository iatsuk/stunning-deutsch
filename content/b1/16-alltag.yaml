  notices:
    kind: worksheet
    part: b1-hoeren-3
    format: article
    title: Fünf Hinweise für die Vorbereitung
    recordings:
      - voice: Sandy
        text: Sie brauchen keine eigenen Teller mitzubringen. Achtzehn Teller werden in der Küche
          bereitgestellt. Lebensmittel und Getränke organisieren Sie weiterhin selbst.
      - voice: Flo
        text: Hier ist Elif. Die Becher hole ich am Freitag ab. Mateo braucht dafür nicht vor seiner
          Arbeit durch die Stadt zu fahren. Ich melde mich nach der Abholung noch einmal.
      - voice: Eddy
        text: Die Schlüsselbox wird am Sonntag bis Viertel nach sechs kontrolliert. Bitte geben Sie
          Ihren Schlüssel spätestens dann zurück. Bitte verlassen Sie den Raum schon um sechs.
      - voice: Shelley
        text: Sie brauchen den Raum nicht allein aufzuräumen. Die Gruppe hat gemeinsame Hilfe ab
          zwanzig vor sechs eingeplant. Bitte räumen Sie eigene Sachen trotzdem selbst weg.
      - voice: Grandpa
        text: "Bitte beachten Sie: Sie dürfen keine Sachen vor dem Seiteneingang abstellen. Das ist
          keine freiwillige Empfehlung. Der Zugang soll frei bleiben."
    questions:
      - prompt: Eigene Teller sind unbedingt notwendig.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Elif meldet sich erst nach der tatsächlichen Abholung zurück.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Der Raum darf bis 18:15 benutzt werden.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Für das Aufräumen ist gemeinsame Hilfe vorgesehen.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Sachen vor dem Seiteneingang sind nur nicht notwendig, aber erlaubt.
        options:
          - richtig
          - falsch
        answers:
          - falsch
  write:
    kind: message
    part: b1-schreiben-1
    title: Einen überlasteten Helfer informieren
    text: Mateo glaubt, dass er alle Aufgaben zusätzlich zur Arbeit allein erledigen muss.
      Schreiben Sie ihm nach dem gemeinsamen Gespräch.
    points:
      - Seine Situation aufgreifen
      - Zwei Aufgaben nennen, die er nicht selbst machen muss
      - Seine verbleibende Aufgabe und die Hilfe erklären
      - Zeit für eine Rückmeldung vorschlagen und nachfragen
    sample:
      - "Hallo Mateo, du arbeitest diese Woche viel und brauchst nicht alles allein zu machen.
        Elif holt am Freitag die Mehrwegbecher ab. Du brauchst also keine neuen Becher zu
        kaufen. Auch den Schlüssel musst du nicht selbst holen: Das übernimmt Hauke am Sonntag
        um 14:30. Bis Donnerstag brauchst du nur die Zutatenliste zu prüfen. Am Sonntag
        organisierst du das Essen. Wenn du dabei Hilfe brauchst, sag bitte Bescheid. Beim
        Aufräumen helfen wir ab 17:40 alle zusammen. Könntest du uns bis Donnerstag sagen, ob
        die Zutatenliste vollständig ist? Passt das für dich? Viele Grüße Dana"
  talk:
    kind: card
    part: b1-sprechen-3
    title: Arbeit und Vorbereitung vereinbaren
    theme: Aufgaben ohne Überlastung
    word: Zeit · notwendige Aufgabe · Hilfe · Rückmeldung
    situation: Eine Person arbeitet Freitag 17–23 Uhr und kann keine zusätzliche Abholung
      übernehmen. Verteilen Sie Becher, Essen, Schlüssel und Aufräumen realistisch. Bestätigen
      Sie, was nicht mehr nötig ist.
    roles:
      - title: Person A
        text: Sie kümmern sich um das Essen und prüfen die Zutaten. Am Freitag müssen Sie arbeiten. Sie
          möchten wissen, welche Zusatzaufgaben wegfallen.
      - title: Person B
        text: Sie können die Becher abholen. Hauke übernimmt den Schlüssel. Für das Aufräumen gibt es
          gemeinsame Hilfe. Fragen Sie nach dem Stand der Zutatenliste.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Матео работает со вторника по субботу 17–23 и пытается взять ещё несколько задач
          подготовки. Команда проверяет список: что обязательно, что уже предусмотрено, а что
          можно поручить другому. Raum C и кухня подтверждены; встреча остаётся 18 октября
          15–18 часов. Все нужные условия даны в сцене: знания географии, настоящих цен или
          расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Разгружаем план и различаем необходимость и запрет
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: Brauchen с отрицанием и инфинитивом означает отсутствие необходимости. Это не запрет и не
          сообщение о уже выполненном деле. Если Элиф возьмёт стаканы, Матео не нужно покупать
          новые; из этого ещё не следует, что стаканы уже получены. Сначала разберите статус
          каждого действия, затем выбирайте посильный следующий шаг и человека, который его
          подтвердит.
        point: nicht brauchen … zu / nur brauchen … zu; совет и обязанность
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Организация встречи включает небольшие, но разные задачи: список продуктов, получение
          вещей, подготовка зала и возврат ключа. Их не стоит без проверки складывать на одного
          человека. Здесь немецкий помогает перераспределить конкретное действие по времени.
          Личный отдых и смена задач становятся частью согласованного плана, а не
          неопределённой просьбой «как-нибудь не уставать»."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: nicht brauchen … zu / nur brauchen … zu; совет и обязанность
    beats:
      - read: В нашей письменной модели brauchen соединяется с отрицанием и инфинитивом с zu. Смысл
          близок к *Du musst die Becher nicht kaufen*. Это снимает необходимость покупки, а не
          запрещает любые стаканы. В разговорной речи можно услышать и вариант без zu; здесь
          тренируем явную письменную рамку. Обязательно проверьте, почему действие не требуется
          и какая задача остаётся.
        point: nicht brauchen … zu = не нужно, не обязательно.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: С nur человек получает небольшую конкретную задачу вместо всего списка. В примере нужно
          проверить ингредиенты, а стаканы и ключ берут другие. Такая фраза не говорит, что
          список уже проверен. Для общей работы всё равно потребуется подтвердить выполнение.
          Не добавляйте новые обязанности в пересказ только потому, что человек остаётся
          ответственным за еду.
        point: "nur ограничивает объём: нужно только это действие."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Первая фраза сообщает, что приход не нужен. Вторая запрещает приходить. Знакомое *nicht
          müssen* тоже снимает необходимость, но не запрещает действие. В игре это различие
          меняет решение: не нужно тратить лишнее время на ключ, если его получает Хауке. Само
          отсутствие необходимости не даёт права нарушать отдельно объявленные правила доступа
          к помещению."
        point: Отсутствие необходимости не равно запрету.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Отрицание стоит перед инфинитивной группой, но относится к необходимости действия.
          Основной глагол machen остаётся в конце с zu. Сначала назовите задачу, которую
          снимают с человека, затем проверьте новый ответственный пункт в плане. Одна
          поддерживающая фраза без распределения дел не решает практическую проблему.
        point: "*Du brauchst nicht alles allein zu machen.*"
        set:
          view: sentence
          rows:
            - de:
                - Du brauchst
                - nicht
                - alles allein
                - zu machen.
              ru: Тебе не нужно делать всё одному.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: «Du brauchst nicht zu kommen» означает запрет приходить?
        read: "Нет. Приход не требуется, но эта фраза сама по себе его не запрещает. Для запрета
          используется nicht dürfen. Сверьте контекст: Хауке получает ключ, поэтому Матео не
          нужно отдельно ехать ради той же задачи. Не превращайте помощь с распределением
          работы в новое ограничение для человека."
        point: Не нужно ≠ нельзя.
        set:
          view: table
          table: rule
      - question: Элиф обещала взять стаканы. Значит, они уже получены?
        read: Нет. Это назначенная задача и согласованное будущее действие. В дневнике можно указать
          ответственного и время проверки, но статус «получены» потребует сообщения о
          выполнении. Такое различие помогает не забыть важный предмет к встрече. В конце
          подготовки команда ещё раз сверит реальные результаты.
        point: Делегирование не равно выполнению.
        set:
          view: table
          table: rule
  - id: exam-plan
    chapter: exam
    title: Was bleibt für wen? · Ausschnitt
    beats:
      - read: "Разделите подтверждённые условия, распределённые задачи и уже выполненные действия. В
          списке есть разные времена: получение ключа, начало уборки, выход из помещения и
          возврат ключа. Они не заменяют друг друга. Для игры важен объём ответственности
          Матео, а не попытка назначить ему всё, что относится к еде или кухне."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: plan
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: plan
        set:
          view: task
          task: plan
          solved: true
  - id: exam-gaps
    chapter: exam
    title: Eine Nachricht zur Entlastung
    beats:
      - read: Письмо связывает освобождение от лишних дел с причиной и оставшейся задачей. После
          brauchen в этой модели нужен инфинитив с zu. Затем возвращаются Passiv в прошлом,
          слабое существительное и relative denen. Сначала поймите распределение, потом
          проверьте форму каждого пропуска в контексте связного сообщения.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: gaps
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: gaps
        set:
          view: task
          task: gaps
          solved: true
  - id: exam-notices
    chapter: exam
    title: Fünf Hinweise für die Vorbereitung
    beats:
      - read: Прослушайте пять сообщений дважды. Слова «не нужно» и «нельзя» меняют решение по-разному.
          Также различите выход из помещения и крайний срок возврата ключа. После попытки
          откройте текст и найдите точную формулировку обязанности, отсутствия необходимости
          или запрета. Не добавляйте обещанный результат к уже выполненным пунктам.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
