  - type: choice
    q: "Не нужно приходить:"
    options:
      - Du darfst nicht kommen.
      - Du musst kommen.
      - Du brauchst nicht zu kommen.
    answer: 2
    why: Brauchen снимает необходимость.
  - type: choice
    q: "Запрет:"
    options:
      - Du darfst nicht kommen.
      - Du brauchst nicht zu kommen.
      - Du musst nicht kommen.
    answer: 0
    why: Nicht dürfen.
  - type: choice
    q: Du brauchst nur die Liste ___ prüfen.
    options:
