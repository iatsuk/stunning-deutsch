tables:
  rule:
    title: nicht brauchen … zu / nur brauchen … zu; совет и обязанность
    ru: Опора для решения
    head:
      - Beispiel
      - Смысл и форма
    ruCols:
      - 1
    rows:
      - - Du brauchst die Becher nicht zu kaufen.
        - nicht brauchen … zu = не нужно, не обязательно.
