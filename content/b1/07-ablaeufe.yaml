adventure:
  kind: sequence
  title: Соберите день без спешки
  intro: Друзья собирают для альбома фотографии и короткие истории из Плёна. Нужно успеть к
    обратному автобусу, не превращая прогулку в гонку. Часть дел можно распределить между
    участниками, но проверку обратного пути следует сделать до выхода к воде. Расписание урока
    вымышленное.
  ending: Распределены параллельные дела и общий перерыв. После сообщения о закрытом причале
    команда остаётся на открытом береговом пути. Обратное время сохранено.
  challenges:
    - id: first
      kind: order
      title: Что сделать до выхода?
      intro: Расположите два действия по условию bevor.
      label: Реплика для команды
      tokens:
        - Rückfahrt prüfen und Brot einpacken.
        - Zum See gehen.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: parallel
      kind: match
      title: Разделите параллельные дела
      intro: Используйте исходный план.
      mode: reading
      clue:
        task: plan
      slots:
        - id: h
          label: Hauke
          answer: weg
        - id: d
          label: Dana
          answer: wasser
        - id: e
          label: Elif am Steg
          answer: foto
      options:
        - id: weg
          label: den Weg prüfen
        - id: wasser
          label: Wasser holen
        - id: foto
          label: fotografieren
      success: У каждого участника своё действие.
      wrong: Сравните имена и глаголы в плане.
    - id: while
      kind: order
      title: Согласуйте одновременность
      intro: Начните с действия Хауке.
      label: Реплика для команды
      tokens:
        - Während Hauke den Weg
        - prüft,
        - holt
        - Dana Wasser.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: bus
      kind: clock
      title: Сохраните отправление автобуса
      intro: Не перепутайте приход группы и отправление.
      mode: reading
      clue:
        task: plan
      answer: 13:20
      initial: 13:00
      minuteStep: 5
      success: Группа приходит в 13:00, автобус уходит в 13:20.
      wrong: Нужно время отправления, а не прибытия группы.
    - id: closed
      kind: select
      title: После объявления о Steg
      intro: Прочитайте Update am See в плане. Что остаётся допустимым?
      mode: reading
      clue:
        task: plan
      options:
        - id: o0
          label: Прогулка по береговому пути
        - id: o1
          label: Выход на закрытый причал
        - id: o2
          label: Отмена всего дня
