steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Друзья собирают для альбома фотографии и короткие истории из Плёна. Нужно успеть к
          обратному автобусу, не превращая прогулку в гонку. Часть дел можно распределить между
          участниками, но проверку обратного пути следует сделать до выхода к воде. Расписание
          урока вымышленное. Все нужные условия даны в сцене: знания географии, настоящих цен
          или расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Согласуем последовательность и параллельные дела
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "В плане есть дела, которые должны предшествовать друг другу, и дела, которые можно
          выполнять одновременно. Bevor ставит границу до действия, während показывает
          пересечение во времени. Участники могут быть разными: один проверяет путь, другая
          набирает воду. Сначала восстановите смысл пары действий, потом проверьте положение
          личного глагола в придаточной части."
        point: "bevor и während: до действия и одновременно"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: Причал, берег и обратный путь связывают морскую тему с обычной поездкой. В игре задача не
          в том, чтобы выполнить как можно больше пунктов, а в том, чтобы сохранить
          обязательные условия и оставить время для людей. Названия учреждений и расписание
          здесь служат учебными данными. По ним нужно ориентироваться внутри истории, а не
          планировать настоящую поездку.
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "bevor и während: до действия и одновременно"
    beats:
      - read: Порядок частей фразы не обязан совпадать с порядком событий. Bevor wir losgehen стоит
          первым, но выход происходит после проверки. Найдите два действия и назовите, какое
          нужно завершить раньше. В игре правильная последовательность зависит от союза, а не
          от того, какое слово написано первым. Личный глагол придаточного уходит в конец.
        point: "bevor: сначала проверка, потом выход."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: Während связывает два действия, которые пересекаются во времени. Они не обязаны
          начинаться и заканчиваться в одну секунду. В нашей сцене один участник проверяет
          путь, другая получает воду. Это позволяет распределить задачи без потери смысла. Если
          действия требуют одного и того же человека одновременно, нужно дополнительно
          проверить, реалистичен ли план.
        point: "während: действия идут одновременно."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Когда главная часть стоит первой, её порядок остаётся знакомым: wir packen ... ein.
          После bevor начинается придаточная часть, заканчивающаяся losgehen. Сравните два
          варианта одного плана и убедитесь, что реальная последовательность не изменилась.
          Перестановка частей предложения сама по себе не переносит упаковку хлеба на время
          после выхода."
        point: Главная часть может стоять перед придаточной.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Оба участника названы явно, поэтому параллельный план можно проверить. Во второй части
          личный глагол следует сразу после запятой: *holt Dana*. Сочетание *während Hauke den
          Weg prüft* занимает первую позицию целиком. Сначала произнесите простые реплики о
          каждом участнике, затем соедините их и сохраните нужную временную связь."
        point: "*Während Hauke den Weg prüft, holt Dana Wasser.*"
        set:
          view: sentence
          rows:
            - de:
                - Während Hauke den Weg
                - prüft,
                - holt
                - Dana Wasser.
              ru: Пока Хауке проверяет путь, Дана берёт воду.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: "«Bevor wir losgehen, packen wir Brot ein»: что раньше?"
        read: Раньше упаковывают хлеб, потом выходят. Часть с bevor называет действие, до которого
          нужно сделать другое. Не читайте предложение как список действий слева направо.
          Представьте два момента на линии времени и проверьте, можно ли выйти с неупакованным
          хлебом по этому условию. Это помогает выбрать последовательность без перевода каждого
          слова.
        point: Сначала *einpacken*, потом *losgehen*.
        set:
          view: table
          table: rule
      - question: Во время еды Элиф пишет подписи. Это запрет на её перерыв?
        read: "Нет. Während описывает совпадение действий во времени, но не устанавливает постоянную
          обязанность. В сцене друзья затем меняются. Для согласования нужно слышать не только
          грамматику, но и весь разговор: участник может помочь сейчас и отдохнуть позже. Не
          превращайте один временной отрезок в правило на весь день."
        point: Одновременность не означает постоянную обязанность.
        set:
          view: table
          table: rule
  - id: exam-plan
    chapter: exam
    title: Der gemeinsame Tagesplan · Ausschnitt
    beats:
      - read: "Найдите обязательный срок и отдельно предложение о параллельных действиях. Это короткий
          фрагмент, а не полный Lesen 2. Используйте его как источник в игре: кто делает что и
          когда участники должны быть у остановки? Не добавляйте несуществующую лодочную
          экскурсию только из-за слова Steg."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: plan
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: plan
        set:
          view: task
          task: plan
          solved: true
