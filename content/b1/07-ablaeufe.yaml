    beats:
      - read: "Пять объявлений относятся к разным местам. Сначала прочитайте утверждение, затем
          слушайте соответствующую запись дважды. Проверяйте границы: закрытый причал не
          означает закрытый береговой путь. Во время учебной попытки можно открыть текст и
