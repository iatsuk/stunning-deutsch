tasks:
  plan:
    kind: message
    part: b1-lesen-2
    title: Der gemeinsame Tagesplan · Ausschnitt
    text: "Vor dem Weg zum See: Rückfahrt prüfen und Brot einpacken. Während Hauke den Weg prüft,
      holt Dana Wasser. Am Steg fotografiert Elif; die anderen machen eine kurze Pause. Danach
      wechseln sie. Spätestens um 13 Uhr sind alle an der Haltestelle. Abfahrt: 13:20 Uhr. Der
      Steg ist kein Einstieg für eine gebuchte Bootsfahrt. Update am See: Der kleine Steg ist
      während der Arbeiten gesperrt. Der Uferweg bleibt offen."
