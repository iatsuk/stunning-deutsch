id: b1-ablaeufe
order: 7
title: Während Elif fotografiert, prüft Hauke den Weg.
ru: Согласуем последовательность и параллельные дела
lede: Друзья собирают для альбома фотографии и короткие истории из Плёна. Нужно успеть к
  обратному автобусу, не превращая прогулку в гонку. Часть дел можно распределить между
  участниками, но проверку обратного пути следует сделать до выхода к воде. Расписание урока
  вымышленное.
goals:
  - Отличить действие до другого от одновременного
  - Согласовать задачи разных участников
  - Понять пять объявлений об изменениях
  - Проверить план по общему времени
grammar:
  - "bevor и während: до действия и одновременно"
exam:
  - b1-lesen-2
  - b1-hoeren-3
  - b1-sprachbausteine-1
  - b1-sprechen-3
dialogues:
  scene:
    title: Während Elif fotografiert, prüft Hauke den Weg.
    ru: Согласуем последовательность и параллельные дела
    place: Plön · прогулка у озера · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - H: Bevor wir zum See gehen, prüfen wir die Rückfahrt.
        ru: Прежде чем пойдём к озеру, проверим обратную дорогу.
      - E: Unser Bus fährt um dreizehn Uhr zwanzig.
        ru: Наш автобус отправляется в тринадцать двадцать.
      - D: Während du den Weg prüfst, hole ich Wasser.
        ru: Пока ты проверяешь путь, я возьму воду.
      - M: Ich packe das Brot ein, bevor wir losgehen.
        ru: Я упакую хлеб, прежде чем мы выйдем.
      - H: Am Steg machen wir nur eine kurze Pause.
        ru: На причале сделаем только короткую остановку.
      - E: Während ihr esst, schreibe ich die Bildunterschriften.
        ru: Пока вы едите, я напишу подписи к фотографиям.
      - D: Dann wechseln wir. Du brauchst auch eine Pause.
        ru: Потом поменяемся. Тебе тоже нужен перерыв.
      - M: Gut. Um dreizehn Uhr sind wir wieder an der Haltestelle.
        ru: Хорошо. В тринадцать мы снова у остановки.
