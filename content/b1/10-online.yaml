id: b1-online
order: 10
title: Worauf wartest du? Darauf, dass die Antwort kommt.
ru: Уточняем ссылки и сведения в переписке
lede: Хауке работает в Гамбурге и следит за подготовкой через сообщения. В группу попала старая
  пересылка о другом помещении. Нужно найти, к чему относятся короткие ответы, и обновить общий
  документ по действующему источнику, сохранив открытые вопросы.
goals:
  - Связать darauf/dafür с названной темой
  - Задать вопрос worauf/wofür/womit
  - Отличить вопрос о человеке от вопроса о вещи
  - Проверить десять деталей длинного разговора
grammar:
  - wo(r)- / da(r)- с предлогом; вопросы о вещах и людях
exam:
  - b1-lesen-2
  - b1-hoeren-2
  - b1-sprechen-2
dialogues:
  scene:
    title: Worauf wartest du? Darauf, dass die Antwort kommt.
    ru: Уточняем ссылки и сведения в переписке
    place: Hamburg / Kiel · общий документ команды · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - H: Worauf wartest du noch?
        ru: Чего ты ещё ждёшь?
      - D: Auf die Antwort zur Küche. Darauf warten wir seit Montag.
        ru: Ответа о кухне. Этого мы ждём с понедельника.
      - E: Wofür braucht Mateo die Liste?
        ru: Для чего Матео нужен список?
      - D: Für den Vergleich der Angebote. Dafür hat er am Montag Zeit.
        ru: Для сравнения предложений. Для этого у него есть время в понедельник.
      - H: Und für wen ist die Kopie der Liste?
        ru: А для кого копия списка?
      - D: Für Elif. Mit ihr vergleicht Mateo die Angebote.
        ru: Для Элиф. С ней Матео сравнит предложения.
      - E: Ich bearbeite die Bilder am Computer. Damit geht es für mich leichter.
        ru: Я обрабатываю снимки на компьютере. На нём мне это делать проще.
      - H: Gut. Wir sprechen darüber, wenn die gültigen Angaben im Dokument stehen.
        ru: Хорошо. Обсудим это, когда действующие данные появятся в документе.
  interview:
    title: Überblick im digitalen Projekt
    ru: Как не потерять сведения в переписке
    place: Kiel / Hamburg · учебное интервью
    people:
      H:
        name: Hauke
        voice: Rocko
      E:
        name: Elif
        voice: Flo
    lines:
      - H: Wie behältst du bei vielen Nachrichten den Überblick?
        ru: Как ты сохраняешь обзор при большом числе сообщений?
      - E: Ich lese die Projektgruppe zweimal am Tag. Benachrichtigungen sind meistens aus. Sonst
          schaue ich auch während des Kurses ständig auf das Handy.
        ru: Я читаю группу проекта дважды в день. Уведомления обычно выключены. Иначе постоянно смотрю
          в телефон даже на курсе.
      - H: Worauf achtest du bei einer weitergeleiteten Nachricht?
        ru: На что ты обращаешь внимание в пересланном сообщении?
      - E: Auf den ursprünglichen Absender und das Datum. Gestern stand in einer alten Nachricht ein
          anderer Raum. Das war nur eine frühere Idee.
        ru: На исходного отправителя и дату. Вчера в старом сообщении было другое помещение. Это была
          только прежняя идея.
      - H: Wo stehen die gültigen Angaben?
        ru: Где находятся действующие данные?
      - E: In unserem gemeinsamen Dokument. Dort trennen wir Angebot, Entscheidung und offene Frage.
          Die Küche ist immer noch offen, und die Gruppe hat den Raum noch nicht gebucht.
        ru: В общем документе. Там мы разделяем предложение, решение и открытый вопрос. Кухня ещё не
          решена, и группа пока не забронировала помещение.
      - H: Womit bearbeitest du die Bilder?
        ru: На чём ты обрабатываешь фотографии?
      - E: Am liebsten am Computer. Mit dem Handy wähle ich unterwegs nur Bilder aus. Die Originale
          bleiben erhalten. Für die Ausstellung mache ich kleinere Kopien.
        ru: Предпочитаю компьютер. На телефоне я только выбираю фото в дороге. Оригиналы сохраняются.
          Для выставки делаю уменьшенные копии.
      - H: Für wen ist der kurze Text neben der Karte?
        ru: Для кого короткий текст рядом с картой?
      - E: Für neue Gäste. Sie kennen die Orte vielleicht noch nicht. Deshalb erklären wir die Namen
          und stellen eine persönliche Frage.
        ru: Для новых гостей. Возможно, они ещё не знают эти места. Поэтому объясняем названия и задаём
          личный вопрос.
      - H: Und was passiert, wenn jemand einen Fehler findet?
        ru: А что происходит, если кто-то находит ошибку?
      - E: Dann ändern wir das gemeinsame Dokument. Eine private Nachricht allein reicht nicht. Danach
          informieren wir die Gruppe über die Änderung, damit alle denselben Stand kennen.
        ru: Тогда меняем общий документ. Одного личного сообщения недостаточно. Потом сообщаем группе
          об изменении, чтобы у всех были одинаковые данные.
