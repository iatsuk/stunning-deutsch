tasks:
  article:
    kind: worksheet
    part: b1-lesen-2
    format: article
    title: Eine alte Nachricht im neuen Plan
    text: >-
      Hauke arbeitet in Hamburg und liest die Projektgruppe oft erst am Abend. Am Dienstag
      findet er eine weitergeleitete Nachricht über einen Raum am Hafen. Dort steht: „Der
      Termin passt.“ Auf den ersten Blick klingt das wie eine Buchung. Elif prüft den
      ursprünglichen Absender und das Datum. Die Nachricht stammt aus dem Sommer und gehört zu
      einer anderen Veranstaltung.


      Für den FördeTreff gilt ein neuer Entwurf. Im gemeinsamen Dokument steht das aktuelle
      Angebot: 18. Oktober, 15–18 Uhr, 60 Euro ohne Küche. Die Gruppe hat das Angebot noch
      nicht angenommen. Dana wartet auf die Antwort zur Küche. Darauf wartet sie seit Montag.
      Mateo vergleicht mit Elif die Angebote für das Essen. Dafür braucht er die Liste mit den
      Preisen. Die Kopie der Liste ist für Elif.


      Die Gruppe beschließt, Änderungen zuerst im gemeinsamen Dokument einzutragen und danach
      kurz im Chat zu nennen. So müssen die Helfer nicht zwischen vielen privaten Nachrichten
      suchen. Alte Entwürfe bleiben als solche markiert. Wer eine Information nicht versteht,
      fragt nach dem konkreten Gegenstand oder der Person. Eine kurze Rückfrage kostet weniger
      Zeit als ein Einkauf nach einem veralteten Plan.
    questions:
      - prompt: Wozu gehört die weitergeleitete Nachricht?
        options:
          - Zur aktuellen Buchung
          - Zu Mateos Kurs
          - Zu einer anderen Veranstaltung
        answers:
          - Zu einer anderen Veranstaltung
      - prompt: Was steht zum aktuellen Raum fest?
        options:
          - Es gibt ein Angebot, aber keine Annahme.
          - Er ist schon gebucht.
          - Die Küche ist kostenlos.
        answers:
          - Es gibt ein Angebot, aber keine Annahme.
      - prompt: Worauf bezieht sich darauf im zweiten Absatz?
        options:
          - Auf den Sommer
          - Auf die Antwort zur Küche
          - Auf Elif
        answers:
          - Auf die Antwort zur Küche
      - prompt: Wofür braucht Mateo die Liste?
        options:
          - Für einen Segelkurs
          - Für die Raumreinigung
          - Für den Preisvergleich
        answers:
          - Für den Preisvergleich
      - prompt: Wo sollen Änderungen zuerst stehen?
        options:
          - Im gemeinsamen Dokument
          - Nur privat
          - In einer alten Weiterleitung
        answers:
          - Im gemeinsamen Dokument
  interview:
    kind: worksheet
    part: b1-hoeren-2
    format: article
    dialogue: interview
    title: Zehn Details aus einem Gespräch
    situation: Hören Sie das Gespräch zweimal. Entscheiden Sie bei allen zehn Aussagen richtig oder
      falsch.
    questions:
      - prompt: Elif liest die Projektgruppe zweimal am Tag.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Ihre Benachrichtigungen sind immer eingeschaltet.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Bei Weiterleitungen prüft sie Absender und Datum.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Die alte Nachricht enthielt eine endgültige neue Buchung.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Die Gruppe trennt Angebot, Entscheidung und offene Frage.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Die Küche ist bereits bestätigt.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Elif bearbeitet Bilder am liebsten am Computer.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Sie löscht die Originale nach der Auswahl.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Der Text neben der Karte ist für neue Gäste.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Eine Korrektur nur in einer privaten Nachricht reicht aus.
        options:
          - richtig
          - falsch
        answers:
          - falsch
  opinions:
    kind: card
    part: b1-sprechen-2
    title: Wie viele Nachrichten sind hilfreich?
    theme: Digitale Gruppen im Alltag
    word: Meinung · Erfahrung · Vor- und Nachteil
    situation: Geben Sie die Meinung Ihrer Person wieder. Sprechen Sie anschließend über eigene
      Erfahrungen mit Gruppen und fragen Sie nach der Erfahrung des Partners.
    roles:
      - title: Person A · Karin
        text: Ich finde Gruppenchats praktisch, weil neue Informationen schnell alle erreichen. Eine
          kurze Nachricht ist leichter als viele einzelne Anrufe. Für wichtige Entscheidungen
          benutze ich zusätzlich ein gemeinsames Dokument. Sonst finde ich nach drei Tagen die
          richtige Nachricht nicht mehr.
      - title: Person B · Jonas
        text: Mir werden Gruppen schnell zu laut. Ich stelle die Benachrichtigungen aus und lese nur
          abends. Manchmal verpasse ich dadurch eine schnelle Änderung. Bei wirklich dringenden
          Fragen möchte ich lieber einen kurzen Anruf bekommen.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Хауке работает в Гамбурге и следит за подготовкой через сообщения. В группу попала
          старая пересылка о другом помещении. Нужно найти, к чему относятся короткие ответы, и
          обновить общий документ по действующему источнику, сохранив открытые вопросы. Все
          нужные условия даны в сцене: знания географии, настоящих цен или расписаний не
          требуются. Сначала попробуйте понять, какого результата добиваются друзья, затем
          слушайте реплики. На новом уровне важно не только найти число или знакомое слово, но
          и связать несколько сведений."
        point: Уточняем ссылки и сведения в переписке
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Короткие ответы экономят слова, но требуют понятной ссылки. Darauf заменяет уже
          названную вещь или тему после auf. Wofür спрашивает о цели или предмете с für, а für
          wen — о человеке. Если в переписке несколько тем, полезно назвать существительное ещё
          раз. Угадавать ссылку по последнему знакомому слову опасно: сначала найдите
          управляющий глагол и предлог."
        point: wo(r)- / da(r)- с предлогом; вопросы о вещах и людях
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Старое сообщение может быть настоящим и всё же не описывать текущий план. Проверьте
          отправителя, дату и статус: предложение, решение или открытая задача. Общий документ
          помогает участникам из разных городов работать с одними сведениями. В игре важна не
          скорость чтения уведомлений, а точная связь между коротким местоименным ответом и его
          предметом."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: wo(r)- / da(r)- с предлогом; вопросы о вещах и людях
    beats:
      - read: "Возвращаем управление из прошлого урока. Предлог auf сохраняется, но вместо названия
          вещи используем darauf. Вопрос — worauf. Буква r появляется между da/wo и предлогом,
          начинающимся на гласную: darüber, worüber тоже подчиняются этой модели. Сначала
          восстановите полное сочетание с существительным; тогда короткая форма перестанет быть
          отдельным словом для зубрёжки."
        point: "Перед гласной добавляется r: darauf, worauf."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Для людей используйте предлог с вопросительным или личным местоимением: für wen, mit
          wem, für sie. Формы dafür и damit обычно отсылают к вещам, средствам или ситуации. В
          нашей сцене копия для Элиф, а время — для сравнения предложений. Не заменяйте имя
          человека короткой формой по одному только совпадению предлога."
        point: "О человеке: für wen? / für sie; о теме: wofür? / dafür."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: В *Ich arbeite damit* слово damit означает «с этим, при помощи этого» и занимает место
          предложной группы. В *damit alle verstehen* оно начинает придаточную часть цели.
          Значение становится понятно по конструкции, поэтому не пытайтесь присвоить слову один
          перевод на все случаи. В упражнении сначала найдите, есть ли после damit отдельное
          подлежащее и личный глагол.
        point: "damit: средство или союз цели — смотрите на строение."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Darauf может заранее указывать на содержание следующей части с dass. Мы ждём не
          абстрактного предмета, а того, что администрация ответит. Само darauf относится к
          глаголу warten, а придаточное раскрывает ожидаемое событие. Постройте сначала полную
          мысль простыми словами, затем проверьте глагол antwortet в конце части с dass.
        point: "*Wir warten darauf, dass die Verwaltung antwortet.*"
        set:
          view: sentence
          rows:
            - de:
                - Wir warten
                - darauf,
                - dass die Verwaltung
                - antwortet.
              ru: Мы ждём, что администрация ответит.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Копия предназначена Элиф. Спросить wofür или für wen?
        read: "Für wen: спрашиваем о человеке. Wofür подходит для цели или темы, например для чего
          нужен список. В ответе *für Elif* можно затем сказать *für sie*. Если заменить это на
          dafür, связь с человеком потеряется или станет неясной. В переписке лучше повторить
          имя, когда обсуждаются несколько списков и адресатов."
        point: "Человек: *für wen — für Elif — für sie*."
        set:
          view: table
          table: rule
      - question: Любое damit вводит цель?
        read: Нет. В *Ich arbeite damit* это указание на средство, например компьютер. После слова нет
          отдельного придаточного предложения. В *damit die Gäste verstehen* есть подлежащее и
          личная форма глагола в конце. Сравните конструкции целиком; перевод одного слова без
          соседей не позволяет выбрать значение.
        point: "*damit arbeiten* ≠ *damit jemand versteht*."
        set:
          view: table
          table: rule
  - id: exam-article
    chapter: exam
    title: Eine alte Nachricht im neuen Plan
    beats:
      - read: "Прочитайте сообщение до конца и проследите две разные линии: старая пересылка и нынешний
          проект. Для darauf и dafür восстановите полное сочетание с существительным. Вопрос о
          статусе помещения требует учитывать и цену, и отсутствие согласия. Не превращайте
          знакомую фразу «срок подходит» из другого события в подтверждение нового."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: article
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: article
        set:
          view: task
          task: article
          solved: true
  - id: exam-interview
    chapter: exam
    title: Zehn Details aus einem Gespräch
    beats:
      - read: "Это полный набор из десяти утверждений к одному разговору, а не десять отдельных
          объявлений. Сначала просмотрите все утверждения, затем слушайте разговор дважды.
          Проверьте слова «всегда», «уже» и «достаточно»: они меняют смысл. Учебное раскрытие
          текста используйте после самостоятельной попытки, чтобы найти конкретную причину
          ошибки."
