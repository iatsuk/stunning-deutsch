tables:
  rule:
    title: wo(r)- / da(r)- с предлогом; вопросы о вещах и людях
    ru: Опора для решения
    head:
      - Beispiel
      - Смысл и форма
    ruCols:
      - 1
    rows:
      - - Auf die Antwort warten → darauf warten. Worauf?
        - "Перед гласной добавляется r: darauf, worauf."
      - - Für den Vergleich → dafür. Für Elif → für sie.
        - "О человеке: für wen? / für sie; о теме: wofür? / dafür."
