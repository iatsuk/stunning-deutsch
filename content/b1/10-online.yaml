case:
  title: Eine echte Nachricht kann veraltet sein
  ru: Сверка дневника
  intro: Проверьте дату, предмет и адресата, прежде чем менять общий план.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die weitergeleitete Nachricht stammt aus dem Sommer und gehört zu einer anderen
            Veranstaltung.
          ru: Пересылка относится к другому летнему событию.
      question: Она подтверждает осеннюю бронь?
      options:
        - Да
        - Только кухню
        - Нет
      answer: 2
      right: Другой срок и другое событие.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Dana wartet auf die Antwort zur Küche. Darauf wartet sie seit Montag.
          ru: Дана ждёт ответа о кухне с понедельника.
      question: На что ссылается darauf?
      options:
        - На список цен
        - На ответ о кухне
        - На Элиф
      answer: 1
      right: Сохраняется связка warten auf.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die Kopie ist für Elif. Die Liste braucht Mateo für den Vergleich.
          ru: Копия для Элиф. Список нужен Матео для сравнения.
      question: Как спросить об адресате?
      options:
        - Für wen?
        - Wofür?
        - Womit?
      answer: 0
      right: Спрашиваем о человеке.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Ссылки и статусы уточнены. Новое решение не выводится из старого сообщения о другой встрече.
adventure:
  kind: sequence
  title: Расшифруйте короткие ответы команды
  intro: Хауке работает в Гамбурге и следит за подготовкой через сообщения. В группу попала
    старая пересылка о другом помещении. Нужно найти, к чему относятся короткие ответы, и
    обновить общий документ по действующему источнику, сохранив открытые вопросы.
  ending: Старая пересылка отделена от текущего предложения. Для коротких darauf/dafür найдены
    точные темы, а копия списка отправляется названному человеку. Общий документ остаётся
    источником текущего плана.
  challenges:
    - id: links
      kind: match
      title: Восстановите полную ссылку
      intro: Сначала определите, спрашивают о теме, человеке или средстве.
      slots:
        - id: a
          label: Worauf wartet Dana?
          answer: antwort
        - id: b
          label: Für wen ist die Kopie?
          answer: elif
        - id: c
          label: Womit bearbeitet Elif die Bilder?
          answer: computer
      options:
        - id: antwort
          label: auf die Antwort zur Küche
        - id: elif
          label: für Elif
        - id: computer
          label: mit dem Computer
      success: Ссылки восстановлены по смыслу и предлогу.
      wrong: Для человека нужен für wen, для средства womit.
    - id: darauf
      kind: order
      title: Назовите ожидаемое событие
      intro: Соберите полную мысль с dass.
      label: Реплика для команды
      tokens:
        - Wir warten
        - darauf,
        - dass die Verwaltung
        - antwortet.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: source
      kind: select
      title: Выберите актуальный статус
      intro: Сверьте старую пересылку с текущим документом.
      mode: reading
      clue:
        task: article
      options:
        - id: o0
          label: Есть предложение 60 евро; согласия ещё нет
        - id: o1
          label: Есть бесплатная бронь с кухней
        - id: o2
          label: Любая пересылка равна подтверждению
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: reference
      kind: note
      title: Замените darauf точным названием
      intro: Чего ждёт Дана? Введите предмет ожидания из второго абзаца.
      mode: reading
      clue:
        task: article
      fields:
        - label: Dana wartet auf …
          answers:
            - die Antwort zur Küche
            - Antwort zur Küche
            - die Antwort zur Küchennutzung
      success: Короткая ссылка раскрыта.
      wrong: Ожидается ответ о кухне, не сама Элиф.
    - id: recipient
      kind: negotiation
      title: Уточните адресата копии
      intro: Короткий ответ должен сохранить человека.
      start: a
      nodes:
        - id: a
          text: "Hauke: Für wen ist die Kopie der Liste?"
          choices:
            - label: Für Elif. Mit ihr vergleicht Mateo die Angebote.
              next: end
              feedback: Названы человек и его связь с задачей.
        - id: end
          text: "Hauke: Danke. Ich schicke sie an Elif und aktualisiere das Dokument."
          terminal: true
          choices: []
      success: Копия направлена конкретному адресату.
      wrong: Не заменяйте человека формой dafür.
