case:
  title: Eine Erwartung ist noch kein beobachteter Tag
  ru: Сверка дневника
  intro: Проверьте источник, обещание и условие запасного варианта.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Es wird wahrscheinlich regnen.
          ru: Вероятно, будет дождь.
      question: Это наблюдение погоды уже прошедшего дня?
      options:
        - Нет, прогноз
        - Да
        - Подтверждение брони
      answer: 0
      right: Вероятность и будущее не описывают наблюдаемый результат.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Ich werde die Gruppe informieren.
          ru: Я сообщу группе.
      question: Группа уже уведомлена?
      options:
        - Да
        - Сообщение отменено
        - Нет, это обещание действия
      answer: 2
      right: Нужно подтверждение факта отправки.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wenn der Zug verspätet ist, holt Dana den Schlüssel. Bisher keine Verspätungsmeldung.
          ru: Если поезд опоздает, ключ получит Дана. Пока задержка не объявлена.
      question: Как записать статус?
      options:
        - Отмена Raum C
        - Условный запасной план
        - Подтверждённое опоздание
      answer: 1
      right: Wenn задаёт условие, а второе сообщение сохраняет текущий статус.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: В дневнике сохранены подтверждённые условия и отдельно — прогнозы, обещания и действия
    на случай изменения.
adventure:
  kind: sequence
  title: Подготовьте завтра без выдуманных гарантий
  intro: Перед встречей Хауке проверяет поезд из Гамбурга, а Дана — подтверждение Raum C. Учебный
    прогноз обещает вероятный дождь. Нужно подготовить запасной вариант доставки и получения
    ключа, сохранив разницу между вероятностью и уже подтверждёнными условиями. Все данные
    прогноза и расписания вымышлены.
  ending: Подтверждение, ожидание и условие разделены. Команда готова к возможному дождю и
    задержке, но не записывает их как случившиеся события. Утренняя проверка и сообщение
    назначены.
  challenges:
    - id: status
      kind: match
      title: Какой статус у сообщения?
      intro: Опирайтесь на источник и слова вероятности.
      mode: reading
      clue:
        task: status
      slots:
        - id: room
          label: Raum C ist schriftlich bestätigt.
          answer: confirmed
        - id: weather
          label: Es wird wahrscheinlich regnen.
          answer: forecast
        - id: key
          label: Wenn der Zug spät ist, holt Dana den Schlüssel.
          answer: condition
      options:
        - id: confirmed
          label: подтверждённое условие
        - id: forecast
          label: прогноз
        - id: condition
          label: условный план
      success: Разные типы сведений сохранены.
      wrong: Вероятность и wenn не равны факту наступившего события.
    - id: future
      kind: order
      title: Пообещайте следующую проверку
      intro: Соберите Futur I с инфинитивом.
      label: Реплика для команды
      tokens:
        - Ich
        - werde
        - die Verbindung noch einmal
        - prüfen.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: form
      kind: match
      title: Futur I или Passiv?
      intro: Посмотрите на форму второго глагола.
      slots:
        - id: a
          label: Wir werden die Fotos prüfen.
          answer: future
        - id: b
          label: Die Fotos werden geprüft.
          answer: passive
        - id: c
          label: Es wird regnen.
          answer: future
      options:
        - id: future
          label: Futur I · Infinitiv
        - id: passive
          label: Passiv · Partizip II
      success: Определена вся рамка, а не одно слово werden.
      wrong: Prüfen/regnen — инфинитивы; geprüft — причастие.
    - id: known
      kind: select
      title: Что уже известно наверняка по источнику?
      intro: Не превращайте предположение в факт.
      mode: reading
      clue:
        task: status
      options:
        - id: o0
          label: Raum C и время 15–18 подтверждены
        - id: o1
          label: Поезд уже опаздывает
        - id: o2
          label: Завтра весь день точно дождь
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: backup
      kind: negotiation
      title: Передайте условие без лишнего вывода
      intro: Дана уточняет, когда ей понадобится получать ключ.
      start: a
      nodes:
        - id: a
          text: "Dana: Soll ich den Schlüssel jetzt in jedem Fall holen?"
          choices:
            - label: Nur wenn mein Zug verspätet ist. Bisher ist keine Verspätung gemeldet.
              next: b
              feedback: Сохранено условие и текущий статус.
        - id: b
          text: "Dana: Dann warte ich auf deine Nachricht. Wann prüfst du noch einmal?"
          choices:
            - label: Am Vormittag. Ich werde dir rechtzeitig Bescheid sagen.
              next: end
              feedback: Названы следующая проверка и уведомление.
        - id: end
          text: "Dana: Gut. Dann behandeln wir die Alternative noch nicht als eingetretenen Fall."
          terminal: true
          choices: []
      success: План подготовлен без ложного сообщения о задержке.
      wrong: Условие не должно стать уже свершившимся фактом.
