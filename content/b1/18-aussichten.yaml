  write:
    kind: message
    part: b1-schreiben-1
    title: Die Gruppe vor dem nächsten Tag informieren
    text: Schreiben Sie der Gruppe nach dem Gespräch. Noch gibt es weder beobachteten Regen noch
      eine bestätigte Zugverspätung.
    points:
      - Die bestätigten Angaben zum Raum nennen
      - Den Wetterausblick als Prognose erklären
      - Die Bedingungen für Transport und Schlüssel darstellen
      - Eine nächste Prüfung und Rückmeldung vereinbaren
    sample:
      - Hallo zusammen, Raum C mit Küche bleibt für morgen von 15 bis 18 Uhr bestätigt. Die
        Miete beträgt 40 Euro, den Schlüssel bekommen wir ab 14:30. Laut Vorhersage wird es
        wahrscheinlich regnen. Deshalb halten wir den Bus für den Materialtransport bereit. Bei
        trockenem Wetter bleibt auch das Fahrrad möglich. Haukes Zug soll planmäßig um 13:50 in
        Kiel ankommen. Wenn der Zug verspätet ist, holt unsere Freundin Dana den Schlüssel.
        Bisher ist keine Verspätung gemeldet. Hauke wird am Vormittag noch einmal prüfen und
        rechtzeitig Bescheid sagen. Bitte schreibt bis 13 Uhr, ob sich bei euch etwas ändert.
        Viele Grüße Elif
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Перед встречей Хауке проверяет поезд из Гамбурга, а Дана — подтверждение Raum C. Учебный
          прогноз обещает вероятный дождь. Нужно подготовить запасной вариант доставки и
          получения ключа, сохранив разницу между вероятностью и уже подтверждёнными условиями.
          Все данные прогноза и расписания вымышлены. Все нужные условия даны в сцене: знания
          географии, настоящих цен или расписаний не требуются. Сначала попробуйте понять,
          какого результата добиваются друзья, затем слушайте реплики. На новом уровне важно не
          только найти число или знакомое слово, но и связать несколько сведений."
        point: Различаем прогноз, план и подтверждение
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "В одной переписке встречаются разные виды будущего и разная достоверность. Futur I
          строится через werden и инфинитив: werde prüfen. Passiv Präsens использует werden и
          причастие: werden geprüft. Но грамматическая форма сама не доказывает истинность
          сообщения. Вероятность дождя видна из wahrscheinlich и ссылки на прогноз, а
          подтверждение комнаты — из ответа администрации."
        point: "Futur I: werden + Infinitiv; отличие от Passiv и статуса сведений"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: Запасной план нужен до того, как произойдёт изменение. Если поезд опоздает, ключ получит
          Дана; это ещё не означает, что поезд уже опаздывает. Если пойдёт дождь, материалы
          повезут автобусом; сухая погода сохраняет обе прежние возможности. Язык помогает
          подготовить действие без превращения предположения в уже случившийся факт.
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Futur I: werden + Infinitiv; отличие от Passiv и статуса сведений"
    beats:
      - read: Вторая часть рамки — инфинитив prüfen или regnen. Личную форму получает werden. Futur I
          можно использовать для намерения, обещания или прогноза; его нельзя считать
          автоматическим знаком гарантии. Сначала определите, кто и что сообщает. Для
          уверенности нужны источник и формулировка, а не только слово wird в начале рамки.
        point: "Futur I: личная форма werden + Infinitiv."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: В первом примере фотографии являются предметом проверки, а geprüft — причастие. Во втором
          мы собираемся проверять, prüfen — инфинитив. Оба предложения могут относиться по
          смыслу к будущему времени, если это указано в контексте. Смотрите на форму и роль
          участников. Не определяйте конструкцию только по слову werden или слову morgen.
        point: "Passiv: Partizip II; Futur I: Infinitiv."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: Для будущего часто достаточно Präsens и указания времени. Оно встречается и в
          договорённости, и в предположении. Поэтому в игре подтверждение проверяется по ответу
          администрации, а прогноз — по словам вероятности. Условие wenn описывает, что сделать
          при определённом событии; оно ещё не доказывает, что событие уже наступило.
        point: Präsens тоже описывает будущее; статус зависит от контекста.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: Сначала назван действующий человек, затем личная форма werde и содержание будущего
          действия. Инфинитив informieren завершает рамку. Эта фраза передаёт обещание
          сообщить, но не сам факт отправки сообщения. Для отметки «группа уведомлена»
          понадобится отдельное подтверждение выполненного действия. Это та же точность
          статуса, которую вы уже применяли к брони и самовывозу.
        point: "*Ich werde die Gruppe rechtzeitig informieren.*"
        set:
          view: sentence
          rows:
            - de:
                - Ich
                - werde
                - die Gruppe rechtzeitig
                - informieren.
              ru: Я своевременно сообщу группе.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: Всё с morgen и werden — обязательно Futur I?
        read: Нет. Morgen указывает время, а конструкция определяется второй частью глагольной рамки.
          *Die Fotos werden morgen geprüft* — Passiv Präsens с причастием. *Wir werden die
          Fotos morgen prüfen* — Futur I с инфинитивом. Обе фразы могут говорить о будущем
          действии. Не смешивайте грамматическое время и значение будущего в конкретном
          контексте.
        point: Проверяем Infinitiv или Partizip II.
        set:
          view: table
          table: rule
      - question: Если Дана заберёт ключ при опоздании, поезд уже опаздывает?
        read: Нет. Это условная договорённость на случай опоздания. Пока действует расписание, а Хауке
          обещал проверить его утром. Чтобы записать реальную задержку, нужно новое сообщение о
          ней. Условный план полезен именно потому, что готовит действие заранее, не выдавая
          событие за произошедшее.
        point: Условие ещё не подтверждённый факт.
        set:
          view: table
          table: rule
  - id: exam-status
    chapter: exam
    title: Drei Arten von Angaben · Ausschnitt
    beats:
      - read: Разделите три вида сведений по источнику. Подтверждение комнаты, прогноз погоды и
          условный запасной план не являются одинаковыми фактами. Не определяйте достоверность
          только по времени глагола. Для игры нужно сохранить и известное время, и условие
          действия, и обещанную повторную проверку. Все исходные данные даны в этой учебной
          карточке.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: status
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: status
        set:
          view: task
          task: status
          solved: true
  - id: exam-gaps
    chapter: exam
    title: Zehn Lücken zum nächsten Tag
    beats:
      - read: В банке есть разные личные формы werden. Согласуйте их с подлежащим и проверьте инфинитив
          в конце. Затем восстановите условие, следствие и знакомые предлоги. Каждый вариант
          используйте один раз. После заполнения перечитайте письмо и убедитесь, что вероятный
          дождь не стал уже наблюдаемой погодой следующего дня.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
