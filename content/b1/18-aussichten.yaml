id: b1-aussichten
order: 18
title: Es wird wahrscheinlich regnen. Was ist schon bestätigt?
ru: Различаем прогноз, план и подтверждение
lede: Перед встречей Хауке проверяет поезд из Гамбурга, а Дана — подтверждение Raum C. Учебный
  прогноз обещает вероятный дождь. Нужно подготовить запасной вариант доставки и получения
  ключа, сохранив разницу между вероятностью и уже подтверждёнными условиями. Все данные
  прогноза и расписания вымышлены.
goals:
  - Построить Futur I с инфинитивом
  - Отличить Futur от Passiv по форме второго глагола
  - Разделить прогноз, подтверждение и условный план
  - Сообщить группе, что проверить ещё раз
grammar:
  - "Futur I: werden + Infinitiv; отличие от Passiv и статуса сведений"
exam:
  - b1-lesen-2
  - b1-sprachbausteine-2
  - b1-hoeren-3
  - b1-schreiben-1
dialogues:
  scene:
    title: Es wird wahrscheinlich regnen. Was ist schon bestätigt?
    ru: Различаем прогноз, план и подтверждение
    place: Hamburg / Kiel · накануне FördeTreff · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - H: Laut Vorhersage wird es morgen wahrscheinlich regnen.
        ru: По прогнозу завтра, вероятно, будет дождь.
      - D: Der Raum ist bestätigt. Der Treff beginnt um fünfzehn Uhr.
        ru: Помещение подтверждено. Встреча начинается в пятнадцать.
      - E: Wenn es regnet, bringen wir die Materialien mit dem Bus.
        ru: Если пойдёт дождь, повезём материалы автобусом.
      - M: Und bei trockenem Wetter bleiben beide Transportmöglichkeiten offen.
        ru: А в сухую погоду оба способа доставки остаются доступными.
      - H: Ich werde am Vormittag noch einmal die Zugverbindung prüfen.
        ru: Утром я ещё раз проверю поезд.
      - D: Wenn dein Zug verspätet ist, hole ich den Schlüssel ab. Sag mir rechtzeitig Bescheid.
        ru: Если твой поезд опоздает, я заберу ключ. Сообщи мне заранее.
      - E: Die Fotos werden heute geprüft. Ich melde mich danach bei der Gruppe.
        ru: Фотографии сегодня проверяют. После этого я сообщу группе.
      - H: Genau. Ich werde die Gruppe informieren, wenn ich neue Angaben habe.
        ru: Верно. Я сообщу группе, когда у меня будут новые сведения.
