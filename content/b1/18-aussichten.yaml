  notices:
    kind: worksheet
    part: b1-hoeren-3
    format: article
    title: Fünf Informationen vor dem Treff
    recordings:
      - voice: Shelley
        text: Laut Vorhersage sind morgen Schauer wahrscheinlich. Am Vormittag kann es auch trocken
          bleiben. Prüfen Sie den Stand noch einmal am Morgen. Die Aussage ist eine Erwartung,
          keine Beobachtung des nächsten Tages.
      - voice: Eddy
        text: Nach dem aktuellen Fahrplan kommt der Zug um dreizehn Uhr fünfzig in Kiel an. Bisher
          liegt keine Verspätungsmeldung vor. Hauke wird die Verbindung vor der Abfahrt erneut
          prüfen.
      - voice: Sandy
        text: Ihre Buchung von Raum C bleibt bestätigt. Die Veranstaltung findet von fünfzehn bis
          achtzehn Uhr statt. Den Schlüssel können Sie ab halb drei im Seitenbüro abholen. Der
          Wetterbericht ändert diese Buchung nicht.
      - voice: Flo
        text: Ich werde die letzten Bildunterschriften heute noch prüfen. Danach melde ich mich bei der
          Gruppe. Bitte markiert die Prüfung noch nicht als fertig, bevor meine Rückmeldung da
          ist.
      - voice: Anna
        text: Wenn Haukes Zug verspätet ist, werde ich den Schlüssel holen. Wir haben diese Alternative
          vereinbart. Im Moment gibt es aber noch keine Nachricht über eine tatsächliche
          Verspätung.
