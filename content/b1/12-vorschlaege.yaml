id: b1-vorschlaege
order: 12
title: Ein kleinerer Raum wäre auch möglich.
ru: Находим компромисс и подтверждаем условия
lede: "Для FördeTreff нужен зал на 18 гостей с маленькой кухней. Общий бюджет 80 евро, еда
  стоит 30. Первое предложение 60 евро без кухни не подходит. Появилась альтернатива: Raum B за
  40 евро с кухней. Нужно обсудить её, согласовать итог и получить подтверждение."
goals:
  - Предложить вариант через könnte/würde
  - Сформулировать желание с hätte и оценку с wäre
  - Отличить предложение от подтверждённого решения
  - Учесть полный бюджет и написать ответ
grammar:
  - "Konjunktiv II настоящего: wäre, hätte, würde, könnte, sollte"
exam:
  - b1-lesen-2
  - b1-sprachbausteine-2
  - b1-schreiben-1
  - b1-sprechen-3
dialogues:
  scene:
    title: Ein kleinerer Raum wäre auch möglich.
    ru: Находим компромисс и подтверждаем условия
    place: Kiel · Nachbarschaftshaus · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      P:
        name: Frau Petersen
        voice: Sandy
    lines:
      - D: Ich hätte gern einen Raum mit einer kleinen Küche.
        ru: Я хотела бы помещение с маленькой кухней.
      - M: Wir könnten einen kleineren Raum nehmen. Achtzehn Plätze reichen uns.
        ru: Мы могли бы взять помещение поменьше. Нам хватит восемнадцати мест.
      - H: Ich würde beide Angebote noch einmal vergleichen.
        ru: Я бы ещё раз сравнил оба предложения.
      - P: Raum B hat achtzehn Plätze. Die kleine Küche ist im Preis von vierzig Euro enthalten.
        ru: В помещенииB восемнадцать мест. Маленькая кухня включена в цену сорок евро.
      - E: Das wäre günstiger. Mit dreißig Euro für Essen wären es insgesamt siebzig Euro.
        ru: Это было бы дешевле. С тридцатью евро на еду получится всего семьдесят.
      - D: Wir sollten den Termin und die Küche schriftlich bestätigen lassen.
        ru: Нам стоит получить письменное подтверждение срока и кухни.
      - H: Dann nehmen wir Raum B am achtzehnten Oktober von fünfzehn bis achtzehn Uhr.
        ru: Тогда берём помещение B восемнадцатого октября с пятнадцати до восемнадцати.
      - P: Ich bestätige Raum B mit Küche für diesen Termin. Die Miete beträgt vierzig Euro.
        ru: Подтверждаю помещение B с кухней на этот срок. Аренда составляет сорок евро.
