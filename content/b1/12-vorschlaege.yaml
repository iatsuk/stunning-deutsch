case:
  title: Vorschlag, Annahme oder Bestätigung?
  ru: Сверка дневника
  intro: В дневнике правильно записывают не только условия, но и стадию решения.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Wir könnten Raum B nehmen.
          ru: Мы могли бы взять помещение B.
      question: Это уже письменная бронь?
      options:
        - Нет, предложение
        - Да
        - Отмена встречи
      answer: 0
      right: Könnten предлагает вариант.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: "Raum B: 40 Euro mit Küche. Essen: 30 Euro."
          ru: ПомещениеB40 евро с кухней. Еда 30 евро.
      question: Общий бюджет 80 соблюдён?
      options:
        - Нет, 90
        - Кухня не включена
        - Да, всего 70
      answer: 2
      right: 40+30=70, кухня включена.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Ich bestätige Raum B mit Küche am 18. Oktober 15–18 Uhr für 18 Gäste.
          ru: Подтверждаю помещение B с кухней 18 октября 15–18 для 18 гостей.
      question: Какая запись теперь допустима?
      options:
        - Еда уже заказана
        - B с кухней подтверждён на названный срок
        - Любой зал бесплатно
      answer: 1
      right: Ответ подтверждает только перечисленные условия.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Пожелание, принятое решение и письменное подтверждение различены. Встреча получила
    помещение и срок; задачи по еде и ключу продолжаются.
adventure:
  kind: sequence
  title: От пожелания к подтверждённому компромиссу
  intro: "Для FördeTreff нужен зал на 18 гостей с маленькой кухней. Общий бюджет 80 евро, еда
    стоит 30. Первое предложение 60 евро без кухни не подходит. Появилась альтернатива: Raum B
    за 40 евро с кухней. Нужно обсудить её, согласовать итог и получить подтверждение."
  ending: Выбран и письменно подтверждён Raum B с кухней на 18 октября 15–18 часов для 18 гостей.
    Аренда 40 и еда 30 составляют 70 евро. Еда ещё не заказана; ключ и возврат уточняются
    отдельно.
  challenges:
    - id: conditions
      kind: pack
      title: Сохраните обязательные требования
      intro: Что должно войти в решение?
      mode: reading
      clue:
        task: offers
      options:
        - id: o0
          label: 18 мест
        - id: o1
          label: Маленькая кухня
        - id: o2
          label: Аренда и еда не дороже 80 евро
        - id: o3
          label: Самое большое помещение
      answer:
        - o0
        - o1
        - o2
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: could
      kind: order
      title: Предложите альтернативу
      intro: Соберите вежливый вариант.
      label: Реплика для команды
      tokens:
        - Wir
        - könnten
        - einen kleineren Raum
        - nehmen.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: budget
      kind: pack
      title: Соберите выполнимый набор
      intro: Нужно одно помещение и еда; кухня обязательна, общий бюджет 80.
      mode: reading
      clue:
        task: offers
      options:
        - id: a
          label: Raum A · 60 € · без кухни
        - id: b
          label: Raum B · 40 € · с кухней
        - id: food
          label: Essen · 30 €
      answer:
        - b
        - food
      success: 40 + 30=70, кухня есть, 18 мест хватает.
      wrong: A не имеет кухни и вместе с едой стоит 90; нужен B и еда.
    - id: agree
      kind: negotiation
      title: Согласуйте предложение с администрацией
      intro: Дойдите от обсуждения до явного принятия условий.
      start: a
      nodes:
        - id: a
          text: "Petersen: Raum A ist größer. Möchten Sie lieber diesen Raum?"
          choices:
            - label: Wir brauchen die Küche und würden lieber Raum B nehmen.
              next: b
              feedback: Сохранены кухня и бюджет.
            - label: Wäre die Küche bei Raum B wirklich im Preis?
              next: c
              feedback: Вы уточняете обязательное условие.
        - id: c
          text: "Petersen: Ja, bei B ist die kleine Küche enthalten."
          choices:
            - label: Dann möchten wir Raum B für den 18. Oktober 15–18 Uhr nehmen.
              next: b
              feedback: Выбран конкретный вариант и срок.
        - id: b
          text: "Petersen: 18 Plätze, 40 Euro mit Küche. Soll ich B für den 18. Oktober 15–18 Uhr
            bestätigen?"
          choices:
            - label: Ja, bitte bestätigen Sie genau diese Bedingungen schriftlich.
              next: end
              feedback: Условия явно приняты.
        - id: end
          text: "Petersen: Raum B ist mit Küche für diesen Termin bestätigt."
          terminal: true
          choices: []
      success: Предложение стало согласованной бронью.
      wrong: Проверьте кухню, цену и срок до согласия.
    - id: total
      kind: note
      title: Сохраните общий бюджет
      intro: Введите общую стоимость аренды B и еды, без выдуманных дополнительных услуг.
      mode: reading
      clue:
        task: confirmed
      fields:
        - label: Gesamtkosten in Euro
          answers:
            - "70"
            - siebzig
            - 70 Euro
      success: Записаны 70 евро; из 80 остаётся 10.
      wrong: 40 аренда плюс 30 еда =70.
