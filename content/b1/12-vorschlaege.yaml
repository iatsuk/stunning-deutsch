  write:
    kind: message
    part: b1-schreiben-1
    title: Das passende Angebot annehmen
    text: Sie haben zwei Raumangebote erhalten und möchten Angebot B annehmen. Schreiben Sie Frau
      Petersen vor der Bestätigung.
    points:
      - Für die Angebote danken und den gewählten Raum nennen
      - Warum B zu Gästen und Budget passt
      - Termin und enthaltene Küche ausdrücklich bestätigen lassen
      - Nach Schlüsselübergabe und Rückgabe fragen
    sample:
      - Sehr geehrte Frau Petersen, vielen Dank für Ihre beiden Angebote. Wir möchten gern Raum
        B nehmen. Achtzehn Plätze reichen für unsere Gruppe, und die kleine Küche ist für uns
        wichtig. Mit der Miete von 40 Euro und 30 Euro für Essen bleiben wir unter unserem
        Budget. Bitte bestätigen Sie Raum B für Sonntag, den 18. Oktober, von 15 bis 18 Uhr.
        Ist die Nutzung der Küche wirklich im Preis enthalten? Außerdem würden wir gern wissen,
        wann wir den Schlüssel bekommen und wie wir ihn zurückgeben sollen. Vielen Dank für
        Ihre Hilfe. Mit freundlichen Grüßen Hauke
