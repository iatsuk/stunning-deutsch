steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Для FördeTreff нужен зал на 18 гостей с маленькой кухней. Общий бюджет 80 евро, еда
          стоит 30. Первое предложение 60 евро без кухни не подходит. Появилась альтернатива:
          Raum B за 40 евро с кухней. Нужно обсудить её, согласовать итог и получить
          подтверждение. Все нужные условия даны в сцене: знания географии, настоящих цен или
          расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Находим компромисс и подтверждаем условия
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "До решения обсуждаются возможности, желания и советы. После него появляется конкретное
          согласие и ответ администрации. Konjunktiv II не означает, что событие уже произошло
          или невозможно: здесь он смягчает предложение. Поэтому статус меняется только после
          реплик nehmen и bestätige, а не после wäre günstig. Восстановите этот переход в
          разговоре."
        point: "Konjunktiv II настоящего: wäre, hätte, würde, könnte, sollte"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: Сравнивать нужно полную стоимость и обязательные условия. Цена помещения без кухни не
          равна цене всего мероприятия. В этой задаче важны восемнадцать мест, кухня, срок и
          суммарный бюджет. Все суммы являются учебными данными. Компромисс должен сохранять
          реальные потребности участников, а не просто выбирать самое дешёвое слово в
          объявлении.
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Konjunktiv II настоящего: wäre, hätte, würde, könnte, sollte"
    beats:
      - read: "Эти формы позволяют обсудить желаемый вариант, не выдавая его за факт. В *Raum B wäre
          günstiger* сравнение ещё находится в обсуждении. В *Ich hätte gern eine Küche*
          человек выражает потребность. Затем источник должен подтвердить, что кухня
          действительно есть. В нашей теме не требуется нереальное прошлое: работаем с
          нынешними предложениями и будущим планом."
        point: sein → wäre; haben → hätte для оценки и желания.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Модель würde с инфинитивом помогает предложить действие: я бы сравнил предложения.
          Инфинитив остаётся в конце, как в знакомой модальной рамке. Не добавляйте zu после
          würde. Для sein и haben обычно используйте короткие wäre и hätte. Сначала решите,
          какую задачу предлагает человек, затем проверьте, кто должен её выполнить."
        point: würde + Infinitiv; личное окончание только у würde.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Könnten вы уже встречали в вежливых вопросах. Теперь используем ту же форму для
          вариантов совместного плана. Sollten предлагает разумный шаг, а не доказывает, что он
          выполнен. В обеих моделях основной инфинитив стоит без zu. После обсуждения нужен
          явный итог: что именно выбрали, кто подтвердил и какие условия входят в цену."
        point: "könnte: возможный вариант; sollte: совет."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Мы обсуждаем одно возможное действие, поэтому личную форму получает könnten, а nehmen
          остаётся инфинитивом. Обстоятельство и объект помещаются между ними. Фраза ещё не
          подтверждает бронирование. В игре после предложения нужно пройти уточнение и получить
          ответ администрации с теми же условиями: помещение B, кухня, срок и цена."
        point: "*Wir könnten einen kleineren Raum nehmen.*"
        set:
          view: sentence
          rows:
            - de:
                - Wir
                - könnten
                - einen kleineren Raum
                - nehmen.
              ru: Мы могли бы взять помещение поменьше.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: «Wir sollten nachfragen» означает, что уже спросили?
        read: Нет. Это совет или предложенный следующий шаг. Выполненное действие можно назвать
          знакомым Perfekt, а подтверждение — отдельной репликой источника. В игре нужно
          проследить переход от совета к действию. Не заполняйте дневник желаемыми результатами
          только потому, что участник предложил разумную идею.
        point: Совет ещё не выполненное действие.
        set:
          view: table
          table: rule
      - question: Цена зала 60 и еда 30 подходят бюджету 80?
        read: "Нет: сумма девяносто превышает бюджет даже без кухни. Нужно проверить весь набор
          условий. Альтернатива B стоит сорок с кухней, вместе с едой выходит семьдесят. Не
          сравнивайте только аренду; иначе план окажется формально дешёвым в одном пункте, но
          невыполнимым целиком. Граница бюджета включает равную ей сумму."
        point: Проверяем общую сумму, кухню и число мест.
        set:
          view: table
          table: rule
  - id: exam-offers
    chapter: exam
    title: Zwei Räume · vollständige Lernbedingungen
    beats:
      - read: Перед обсуждением выпишите обязательные условия. Затем считайте общую сумму аренды и еды.
          Кухня — требование, а не необязательная деталь. В этой задаче объявлены все
          необходимые данные, поэтому не нужно искать настоящие цены или знать устройство
          здания. Выбор объясняется условиями, а не названием помещения.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: offers
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: offers
        set:
          view: task
          task: offers
          solved: true
  - id: exam-confirmed
    chapter: exam
    title: Die schriftliche Bestätigung · Ausschnitt
    beats:
      - read: Найдите, какие условия администрация подтвердила письменно. Письмо говорит только об
          аренде и кухне; еду команда организует сама. Сравните его с выбранным предложением до
          записи результата. Эта карточка — источник для завершения игры, а не ещё одно
          неподтверждённое предположение о будущем.
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: confirmed
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: confirmed
        set:
          view: task
          task: confirmed
          solved: true
  - id: exam-gaps
    chapter: exam
    title: Zehn Lücken in einer vorsichtigen Anfrage
    beats:
      - read: "В банке есть формы для разных лиц: мы могли бы, я бы, тебе стоит. Согласуйте их с
          подлежащим и типом продолжения. Оценка wäre не требует инфинитива, а würde требует.
