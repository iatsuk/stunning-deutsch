case:
  title: Ein schöner Ausschnitt ist nicht die ganze Region
  ru: Сверка дневника
  intro: Проверьте место, автора впечатления и недостающую деталь.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die Fotos des Hafens stammen aus Flensburg.
          ru: Фотографии гавани из Фленсбурга.
      question: Они показывают гавань Любека?
      options:
        - Да
        - Они из Raum C
        - Нет
      answer: 2
      right: Источник прямо называет Flensburg.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Der Preis des Eintritts steht nicht in den Notizen.
          ru: Цена входа не указана в заметках.
      question: Можно записать бесплатный вход?
      options:
        - Только в воскресенье
        - Нет
        - Да
      answer: 1
      right: Отсутствие цены не равно нулю.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Dana beschreibt ihren ruhigen Spaziergang. Ein Freund mag lieber lebendige Städte.
          ru: Дана описывает свою спокойную прогулку. Другой друг предпочитает оживлённые города.
      question: Это противоречие, которое нужно устранить?
      options:
        - Нет, разные личные впечатления
        - Да, один должен ошибаться
        - Нужно удалить оба рассказа
      answer: 0
      right: Мнения о разном личном опыте могут сосуществовать.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Альбом передаёт источники и личные истории без выдуманной цены, перепутанного места и
    ложного общего правила.
adventure:
  kind: sequence
  title: Соберите альбом без лишних выводов
  intro: Для финальной встречи друзья собирают подписи и короткие рассказы о регионе. В альбоме
    есть Любек, Фленсбург и воспоминание Даны о Люнебургской пустоши. Нужно понять, какие слова
    относятся друг к другу, кто выражает мнение и какую деталь нельзя добавлять без источника.
  ending: Фотографии сопоставлены с местами и источниками. Отсутствующая цена не придумана,
    разные впечатления сохранены. Альбом готов к разговору с гостями на финальной встрече.
  challenges:
    - id: groups
      kind: match
      title: К чему относится группа Genitiv?
      intro: Восстановите исходное слово зависимой группы.
      slots:
        - id: museum
          label: des Museums
          answer: museum
        - id: city
          label: der Stadt
          answer: city
        - id: friends
          label: der Freunde
          answer: friends
      options:
        - id: museum
          label: das Museum
        - id: city
          label: die Stadt
        - id: friends
          label: die Freunde
      success: Род и число восстановлены без изменения смысла.
      wrong: Des — мужской/средний; der здесь женский или множественный.
    - id: harbor
      kind: order
      title: Сопоставьте гавань с местом
      intro: Соберите подтверждённую подпись.
      label: Реплика для команды
      tokens:
        - Die Fotos des Hafens
        - stammen
        - aus
        - Flensburg.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: places
      kind: match
      title: Разделите три истории
      intro: Используйте заметки, а не близость фотографий в альбоме.
      mode: reading
      clue:
        task: sources
      slots:
        - id: l
          label: Lübeck
          answer: museum
        - id: f
          label: Flensburg
          answer: harbor
        - id: h
          label: Lüneburger Heide
          answer: landscape
      options:
        - id: museum
          label: Museum und Pause am Wasser
        - id: harbor
          label: Hafen und Cafégespräch
        - id: landscape
          label: Danas ruhiger Spaziergang
      success: Каждая история получила свой источник.
      wrong: Проверьте название места рядом с заметкой.
    - id: unknown
      kind: select
      title: Как поступить с ценой музея?
      intro: В заметках цены нет.
      mode: reading
      clue:
        task: sources
      options:
        - id: o0
          label: "Сохранить: цена не указана"
        - id: o1
          label: "Написать: бесплатно"
        - id: o2
          label: Придумать похожую цену другого музея
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: retell
      kind: negotiation
      title: Перескажите проще, сохранив факт
      intro: Гость просит объяснить подпись.
      start: a
      nodes:
        - id: a
          text: "Gast: Ich verstehe „nach dem Besuch des Museums“ noch nicht. Was habt ihr gemacht?"
          choices:
            - label: Wir haben das Museum besucht und saßen danach am Wasser.
              next: b
              feedback: Связь передана знакомой формой.
        - id: b
          text: "Gast: War der Eintritt kostenlos?"
          choices:
            - label: Das steht nicht in unseren Notizen. Den Preis kann ich daraus nicht nennen.
              next: end
              feedback: Недостающая деталь не выдумана.
        - id: end
          text: "Gast: Danke. Dann weiß ich, was eure Quelle wirklich erzählt."
          terminal: true
          choices: []
      success: Пересказ понятен и не добавляет недостающий факт.
      wrong: Упростите форму, но сохраните границы источника.
