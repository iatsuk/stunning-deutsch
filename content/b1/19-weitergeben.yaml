tasks:
  article:
    kind: worksheet
    part: b1-lesen-2
    format: article
    title: Drei Orte, verschiedene Erinnerungen
    text: >-
      Für den FördeTreff wählen die Freunde Bilder aus unterschiedlichen Ausflügen. Die Fotos
      der Stadt Lübeck zeigen Straßen und eine gemeinsame Pause am Wasser. Nach dem Besuch des
      Museums hatten die Freunde Zeit für ein Gespräch. Der Preis des Eintritts steht nicht in
      ihren Notizen. Deshalb gehört keine erfundene Zahl in die Bildunterschrift.


      Die Bilder des Hafens stammen aus Flensburg. Obwohl das Wetter grau war, machte die
      Gruppe eine kurze Runde und ging danach ins Café. Mateo erinnert sich besonders an ein
      Gespräch auf Deutsch. Die zweisprachige Karte half ihm bei der Auswahl. Daraus folgt
      weder, dass jedes Café dieselbe Karte hat, noch dass Gäste dort immer dieselbe Sprache
      sprechen. Im Album wird sein persönlicher Eindruck wiedergegeben.


      Die Fotos der Lüneburger Heide bringt Dana mit. Ihr Bericht beschreibt einen ruhigen
      Spaziergang und eine Pause im Grünen. Sie möchte damit einen anderen Teil ihrer
      regionalen Erfahrungen zeigen. Ein Freund bevorzugt lebendige Städte, Dana an diesem Tag
      die Landschaft. Die unterschiedlichen Eindrücke der Freunde werden nebeneinander
      dargestellt.


      Bei jedem Foto prüfen sie den Namen des Fotografen, den Ort und die passende Aussage. Für
      die Beschriftung reicht oft ein kurzer Satz. Im Gespräch mit Gästen erzählen sie dann mit
      eigenen Worten weiter. Elif achtet darauf, dass ein schöner Ausschnitt nicht zur
      Behauptung über eine ganze Region wird. Der Bericht einer Person kann neugierig machen;
      er ist keine Garantie für jede spätere Reise.
    questions:
      - prompt: Woher stammen die Hafenbilder?
        options:
          - Aus Lübeck
          - Aus dem Raum C
          - Aus Flensburg
        answers:
          - Aus Flensburg
      - prompt: Welche Zahl fehlt im Quellentext?
        options:
          - Der Eintrittspreis des Museums
          - Die Zahl der drei Orte
          - Der Preis des Raums
        answers:
          - Der Eintrittspreis des Museums
      - prompt: Was darf man aus Mateos Erlebnis schließen?
        options:
          - Dort wird immer nur eine Sprache gesprochen.
          - Er hatte in dieser Situation ein Gespräch auf Deutsch.
          - Alle Cafés haben dieselbe Karte.
        answers:
          - Er hatte in dieser Situation ein Gespräch auf Deutsch.
      - prompt: Warum kommen Bilder der Heide ins Album?
        options:
          - Alle Freunde müssen Landschaften lieber mögen.
          - Die Stadtfotos wurden gelöscht.
          - Dana zeigt eine weitere eigene Erfahrung.
        answers:
          - Dana zeigt eine weitere eigene Erfahrung.
      - prompt: Was wird bei jedem Foto geprüft?
        options:
          - Autor, Ort und passende Aussage
          - Nur die schönste Farbe
          - Eine erfundene Eintrittsgebühr
        answers:
          - Autor, Ort und passende Aussage
  sources:
    kind: message
    part: b1-lesen-2
    title: Drei Bildquellen · Ausschnitt
    text: "Lübeck: Fotos der Stadt, Besuch des Museums, danach Pause am Wasser. Kein Eintrittspreis
      notiert. Flensburg: Fotos des Hafens, kurzer Spaziergang, persönliches Gespräch im Café.
      Lüneburger Heide: Danas Bilder der Landschaft und ihr Eindruck eines ruhigen
      Spaziergangs. Diese Notizen nennen keine allgemeine Regel für jeden Besuch."
  interview:
    kind: worksheet
    part: b1-hoeren-2
    format: article
    dialogue: interview
    title: Zehn Aussagen zur Weitergabe von Erinnerungen
    situation: Hören Sie das Gespräch zweimal und unterscheiden Sie Quelle, Eindruck und Ergänzung.
    questions:
