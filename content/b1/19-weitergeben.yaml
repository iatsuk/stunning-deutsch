  opinions:
    kind: card
    part: b1-sprechen-2
    title: Stadt oder Landschaft?
    theme: Wie Sie einen freien Tag verbringen
    word: Position wiedergeben · eigener Ausflug · Rückfrage
    situation: Erzählen Sie die Meinung Ihrer Person und vergleichen Sie mit einem eigenen
      Erlebnis. Fragen Sie den Partner nach einer Erinnerung, die ihm wichtig ist.
    roles:
      - title: Person A · Nora
        text: Ich verbringe freie Tage gern in einer Stadt. Ich mag sowohl kleine Museen als auch
          Cafés. Eine ruhige Straße kann mich genauso interessieren wie eine bekannte
          Sehenswürdigkeit. Zu viel Programm möchte ich aber nicht. Meine schönste Erinnerung
          ist oft ein zufälliges Gespräch.
      - title: Person B · Jonas
        text: Für mich ist eine Landschaft oft erholsamer. Ich brauche nicht viele Angebote, um einen
          schönen Tag zu haben. Ein Spaziergang mit Freunden reicht mir manchmal. Trotzdem
          plane ich Rückfahrt und Pausen vorher. Meine Vorliebe bedeutet nicht, dass Städte für
          alle schlechter sind.
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Для финальной встречи друзья собирают подписи и короткие рассказы о регионе. В альбоме
          есть Любек, Фленсбург и воспоминание Даны о Люнебургской пустоши. Нужно понять, какие
          слова относятся друг к другу, кто выражает мнение и какую деталь нельзя добавлять без
          источника. Все нужные условия даны в сцене: знания географии, настоящих цен или
          расписаний не требуются. Сначала попробуйте понять, какого результата добиваются
          друзья, затем слушайте реплики. На новом уровне важно не только найти число или
          знакомое слово, но и связать несколько сведений."
        point: Понимаем источник и пересказываем историю региона
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: "Genitiv связывает два существительных: снимки чего, имя кого, посещение какого места. В
          чтении важно узнать связь, а не сразу строить все формы самому. Des Museums относится
          к Museum, der Stadt — к Stadt. Род и число видны у зависимого слова. После понимания
          можно пересказать мысль знакомыми фразами, например назвать место отдельно или
          использовать von."
        point: "Узнавание Genitiv: des Museums, des Hafens, der Stadt, der Freunde"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "У альбома есть разные виды сведений: место снимка, имя автора, описанное событие и
          личное впечатление. Они не взаимозаменяемы. Гавань во Фленсбурге не становится частью
          Любека только потому, что фотографии стоят рядом. Спокойное воспоминание Даны не
          обещает одинакового опыта всем гостям. Эти слова помогают передать историю точно и
          оставить место для собственного мнения."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Узнавание Genitiv: des Museums, des Hafens, der Stadt, der Freunde"
    beats:
      - read: "В этих частых группах des указывает на зависимое слово мужского или среднего рода. К
          Hafen добавляется-s, к Museum тоже-s. Сначала найдите основное слово: фотографии или
          посещение. Затем установите, к какому месту оно относится. В этой главе цель — чтение
          и пересказ, а не заучивание всех исключений Genitiv или сложных цепочек
          существительных. Для знакомой слабой группы действует другое окончание: *des
          Fotografen*, как *des Kollegen*. Не добавляйте к этим словам обычное-s."
        point: des + мужской/средний род; обычно-s или-es у существительного.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: Форма der здесь не делает Stadt мужским словом. Это Genitiv женского рода; у Freunde —
          Genitiv множественного. Не добавляйте в этом случае существительному окончание-s по
          аналогии с des Hafens. Полезно восстановить исходные формы *die Stadt, die Freunde*,
          затем прочитать зависимую группу целиком. Контекст показывает, о чём или о ком идёт
          речь.
        point: "der: женский род или множественное число в Genitiv."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "В одной группе могут встретиться разные падежи: nach dem Besuch содержит Dativ после
          nach, а des Museums относится к Besuch. Не нужно превращать весь пересказ в такую же
          длинную группу. Можно сказать *Wir besuchten das Museum und saßen danach am Wasser*.
          Сохраняйте смысл и порядок событий. Понятный пересказ важнее количества
          использованных Genitiv-форм."
        point: После понимания можно пересказать знакомой конструкцией.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "Группа des Hafens уточняет, какие фотографии имеются в виду. Личный глагол stammen
          остаётся вторым после всего подлежащего. Если нужная форма в устном рассказе пока не
          получается, назовите место отдельным предложением: *Das ist Flensburg. Dort haben wir
          die Fotos gemacht*. Такой пересказ сохраняет факт, не требуя новой большой падежной
          таблицы."
        point: "*Die Fotos des Hafens stammen aus Flensburg.*"
        set:
          view: sentence
          rows:
            - de:
                - Die Fotos des Hafens
                - stammen
                - aus
                - Flensburg.
              ru: Фотографии гавани из Фленсбурга.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: В «die Bilder der Stadt» Stadt стала мужского рода?
        read: "Нет. Stadt остаётся женского рода, а der здесь указывает на Genitiv. Слово Bilder
          является главным, Stadt уточняет его. Сравните исходное die Stadt и группу der Stadt.
          Не определяйте род по одной форме артикля вне контекста: одинаковые формы могут
          выполнять разные падежные функции."
        point: Род не меняется из-за формы Genitiv.
        set:
          view: table
          table: rule
      - question: Нужно ли при пересказе обязательно повторить «nach dem Besuch des Museums»?
        read: Нет. Можно сказать *Wir besuchten das Museum* или знакомое Perfekt и затем назвать
          следующее событие. Умение узнать источник не означает обязательное использование той
