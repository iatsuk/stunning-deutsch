id: b1-weitergeben
order: 19
title: Die Bilder der Stadt erzählen nicht die ganze Reise.
ru: Понимаем источник и пересказываем историю региона
lede: Для финальной встречи друзья собирают подписи и короткие рассказы о регионе. В альбоме
  есть Любек, Фленсбург и воспоминание Даны о Люнебургской пустоши. Нужно понять, какие слова
  относятся друг к другу, кто выражает мнение и какую деталь нельзя добавлять без источника.
goals:
  - Узнать частые Genitiv-группы в тексте
  - Различить des и der по описываемому слову
  - Пересказать источник понятным знакомым языком
  - Передать два разных мнения без ложного обобщения
grammar:
  - "Узнавание Genitiv: des Museums, des Hafens, der Stadt, der Freunde"
exam:
  - b1-lesen-2
  - b1-hoeren-2
  - b1-sprechen-2
dialogues:
  scene:
    title: Die Bilder der Stadt erzählen nicht die ganze Reise.
    ru: Понимаем источник и пересказываем историю региона
    place: Lübeck / Flensburg / Lüneburger Heide · альбом команды · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
    lines:
      - E: Die Bilder der Stadt zeigen nur einen Teil unseres Ausflugs.
        ru: Снимки города показывают только часть нашей поездки.
      - H: Welche Stadt ist hier gemeint?
        ru: Какой город здесь имеется в виду?
      - E: Lübeck. Nach dem Besuch des Museums saßen wir am Wasser.
        ru: Любек. После посещения музея мы сидели у воды.
      - D: Die Fotos des Hafens stammen dagegen aus Flensburg.
        ru: Фотографии гавани, напротив, из Фленсбурга.
      - M: Die Eindrücke der Freunde waren unterschiedlich. Ich erinnere mich gern an das Gespräch im
          Café.
        ru: Впечатления друзей различались. Я с удовольствием вспоминаю разговор в кафе.
      - D: Und die Bilder der Lüneburger Heide gehören zu meinem Bericht über einen ruhigen
          Spaziergang.
        ru: А снимки Люнебургской пустоши относятся к моему рассказу о спокойной прогулке.
      - H: Wir sollten den Namen des Fotografen bei jedem Bild nennen.
        ru: Нам стоит указать имя фотографа у каждого снимка.
      - E: Genau. Und beim Erzählen können wir einfach sagen, von wem das Foto ist und was wir erlebt
          haben.
        ru: Верно. А в рассказе можно просто сказать, чьё фото и что мы пережили.
  interview:
    title: Wie das Album entsteht
    ru: Как собирается альбом
    place: Kiel · учебный разговор
    people:
      H:
        name: Hauke
        voice: Rocko
      E:
        name: Elif
        voice: Flo
    lines:
      - H: Wie habt ihr die Fotos für das regionale Album ausgewählt?
        ru: Как вы выбирали фотографии для регионального альбома?
      - E: Zuerst haben wir den Ort und den Namen des Fotografen notiert. Dann haben wir gemeinsam
          überlegt, welche Geschichte das Bild erzählt. Ein schönes Bild allein erklärt noch
          nicht den ganzen Ausflug.
        ru: Сначала записали место и имя фотографа. Потом вместе подумали, какую историю рассказывает
          снимок. Одна красивая картинка ещё не объясняет всю поездку.
      - H: Was zeigen die Bilder aus Lübeck?
        ru: Что показывают снимки из Любека?
      - E: Sie zeigen Straßen und eine Pause am Wasser. Wir hatten auch ein Museum besucht. Aber aus
          dem Text geht nicht hervor, wie hoch der Eintritt damals war. Eine Zahl erfinden wir
          deshalb nicht.
        ru: Улицы и перерыв у воды. Мы также посетили музей. Но из текста не ясно, сколько тогда стоил
          вход. Поэтому число не придумываем.
      - H: Und die Fotos des Hafens in Flensburg?
        ru: А фотографии гавани во Фленсбурге?
      - E: Auf ihnen sieht man unseren kurzen Spaziergang. Danach waren wir im Café. Die zweisprachige
          Karte half Mateo, trotzdem bestellte er auf Deutsch. Das war seine persönliche
          Erfahrung in dieser Situation.
        ru: На них видна наша короткая прогулка. Потом мы были в кафе. Двуязычное меню помогло Матео,
          но он заказал на немецком. Это был его личный опыт в той ситуации.
      - H: Warum gehören auch Bilder der Lüneburger Heide dazu?
        ru: Почему есть и снимки Люнебургской пустоши?
      - E: Weil die Gruppe nicht nur Städte zeigen möchte. Dana hat eine ruhige Erinnerung an einen
          Spaziergang dort mitgebracht. Wir nennen das als ihren Eindruck, nicht als
          Versprechen für jeden zukünftigen Besuch.
        ru: Группа хочет показать не только города. Дана принесла спокойное воспоминание о прогулке
          там. Мы передаём её впечатление, а не обещание каждому будущему посетителю.
      - H: Muss man im eigenen Bericht viele Genitivformen benutzen?
        ru: В собственном рассказе нужно использовать много форм Genitiv?
      - E: Nein. Man soll die Gruppen im Quellentext verstehen. Beim Sprechen kann man oft auch mit von
          formulieren. Wichtiger ist, dass Ort, Person und Aussage erhalten bleiben.
        ru: Нет. Нужно понять группы в источнике. В речи часто можно использовать von. Важнее сохранить
          место, человека и смысл.
      - H: Was macht ihr mit zwei unterschiedlichen Eindrücken?
        ru: Что делаете с разными впечатлениями?
      - E: Wir geben beide wieder. Eine Freundin mag ruhige Landschaften, ein anderer Freund lebendige
          Städte. Für den Treff ist das ein guter Anfang für ein Gespräch. Eine gemeinsame
          Lieblingsregion ist nicht nötig.
        ru: Передаём оба. Подруга любит спокойные пейзажи, другой друг — оживлённые города. Для встречи
          это хорошее начало разговора. Не обязательно иметь один любимый регион.
