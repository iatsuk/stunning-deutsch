        answers:
          - richtig
      - prompt: Ein schönes Bild erklärt nach Elifs Meinung bereits den ganzen Ausflug.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Der Eintrittspreis des Museums ist in den Notizen genannt.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Die Hafenfotos stammen aus Flensburg.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Mateos Gespräch ist ein persönliches Erlebnis.
        options:
          - richtig
          - falsch
        answers:
          - richtig
      - prompt: Die Gruppe zeigt ausschließlich Städte.
        options:
          - richtig
          - falsch
        answers:
          - falsch
      - prompt: Danas ruhiger Eindruck gilt automatisch für jeden zukünftigen Besuch.
        options:
