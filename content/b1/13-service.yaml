        der Veranstaltung zurückgeben sollen? Vielen Dank und mit freundlichen Grüßen Hauke
steps:
  - id: start
    chapter: scene
    title: Новое дело команды
    beats:
      - read: "Администрация сообщает о ремонте подтверждённого Raum B. Для встречи предлагают Raum C с
          той же кухней и ценой. Нужно проверить замену, получить письменное подтверждение и не
          перепутать 15:00 начало встречи с 14:30 выдачей ключа. Все нужные условия даны в
          сцене: знания географии, настоящих цен или расписаний не требуются. Сначала
          попробуйте понять, какого результата добиваются друзья, затем слушайте реплики. На
          новом уровне важно не только найти число или знакомое слово, но и связать несколько
          сведений."
        point: Уточняем изменение и сохраняем нужные условия
        set:
          view: dialogue
          dialogue: scene
          reveal: 4
      - read: В объявлениях часто важнее действие над предметом, чем имя исполнителя. Der Raum wird
          renoviert сообщает, что с помещением происходит ремонт. Кто выполняет работу, здесь
          не назван. Это не повод угадывать исполнителя или обвинять участника команды. После
          сообщения о ремонте нужно отдельно проверить, какие условия замены подтверждены и что
          осталось прежним.
        point: "Passiv Präsens: werden + Partizip II"
        set:
          reveal: 8
  - id: words
    chapter: words
    title: Слова, которые понадобятся
    beats:
      - read: "Сервисное сообщение может менять одно условие и сохранять остальные. В нашем случае
          меняется помещение, но не срок и не цена. Выдача ключа относится к подготовке до
          начала встречи. Эти слова понадобятся для понятного вопроса администрации и выбора
          помощи из объявлений. Знание устройства настоящего здания не требуется: все нужные
          данные приведены в уроке."
        point: Сначала используйте слово для решения; словарь остаётся справочником.
        set:
          view: words
          words: useful
          reveal: 6
      - read: "Прочитайте остальные выражения и найдите знакомые части сложных слов. Затем вернитесь к
          ситуации: какие слова обозначают человека, место, условие или уже выполненное
          действие? Не требуется запомнить всю группу перед игрой. Когда нужное слово
          встретится снова в записке или разговоре, попробуйте восстановить его смысл до
          подсказки."
        point: Возвращайтесь к выражениям в сообщениях и новых действиях.
        set:
          reveal: 15
  - id: grammar
    chapter: grammar
    title: "Passiv Präsens: werden + Partizip II"
    beats:
      - read: "Passiv меняет фокус: говорим о предмете и действии над ним. В активной фразе *Die Firma
          renoviert den Raum* подлежащее — исполнитель. В Passiv подлежащим становится Raum, а
          действие выражается wird renoviert. Личная форма werden стоит на обычном месте,
          причастие — в конце. Называть исполнителя не обязательно, если сообщение его не
          содержит."
        point: werden в личной форме + Partizip II.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: "Согласуйте личную форму с новым подлежащим. Küche одна, поэтому wird; Schlüssel во
          множественном числе, поэтому werden. Причастие при этом не получает окончания
          множественного числа. Сначала найдите, что проверяют, ремонтируют или выдают. В этой
          теме отрабатываем Präsens, а не все времена Passiv сразу: прошлые изменения появятся
          в следующем уроке."
        point: "Единственное число: wird; множественное: werden."
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
      - read: При преобразовании сохраняйте действие и предмет, не добавляя неизвестного исполнителя.
          Активная фраза называет администрацию, пассивная может оставить её за кадром. Но из
          одной пассивной фразы нельзя восстановить имя конкретного человека без источника. Для
          ответа на практический вопрос важнее понять, отправляют ли подтверждение и какие
          условия оно содержит.
        point: Актив и Passiv могут описывать одно действие с разным фокусом.
        set:
          view: table
          table: rule
          focus:
            - 0
            - 1
            - 2
  - id: frames
    chapter: grammar
    title: Как устроена реплика
    beats:
      - read: "В этой рамке главный участник предложения — помещение C. Wird показывает единственное
          число и Präsens, vorbereitet остаётся причастием в конце. Слово heute относится ко
          времени действия, но не превращает конструкцию в Futur. Позже мы отдельно сравним эти
          модели. Сейчас восстановите простую мысль: что именно готовят и когда."
        point: "*Raum C wird heute vorbereitet.*"
        set:
          view: sentence
          rows:
            - de:
                - Raum C
                - wird
                - heute
                - vorbereitet.
              ru: ПомещениеC сегодня подготавливают.
  - id: check
    chapter: practice
    title: Проверьте смысл до подсказки
    beats:
      - question: В «Der Raum wird renoviert» назван конкретный исполнитель?
        read: Нет. Мы знаем предмет и действие, но имя работника не названо. Нельзя записывать в
          дневник, что ремонт делает Матео, только потому, что он участвует в проекте. При
          необходимости спросите администрацию отдельно. В этой задаче для решения достаточно
          понять недоступность B и проверить предложенную замену C.
        point: Passiv без исполнителя не разрешает угадывать имя.
        set:
          view: table
          table: rule
      - question: Почему «Die Schlüssel werden ausgegeben», а не wird?
        read: Schlüssel здесь обозначает несколько ключей. Новое подлежащее управляет формой werden так
          же, как любое подлежащее управляет личным глаголом. Сравните один Schlüssel wird и
          несколько Schlüssel werden. Причастие ausgegeben при этом одинаковое. Эта проверка
          помогает понять объявление даже при незнакомом названии услуги.
        point: "*ein Schlüssel wird / die Schlüssel werden*."
        set:
          view: table
          table: rule
  - id: exam-update
    chapter: exam
    title: Schriftliche Änderung der Buchung · Ausschnitt
    beats:
      - read: "Сопоставьте изменённое помещение и сохранённые условия. Ключ выдаётся до начала встречи:
          это отдельное событие для подготовки. Не расширяйте изменение до отмены всего дня.
          Письменный текст подтверждает C, срок, кухню и цену; по нему можно уточнить итог в
          игре. Возврат ключа ещё нужно спросить отдельно."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: update
      - question: Готовы сверить своё решение с источником?
        read: "Сверьте все пункты. Если ответ отличается, найдите место в тексте или записи, которое вы
          поняли иначе. Для письма и разговора образец не является единственным допустимым
          ответом: важны понятный смысл, выполнение задания и подходящее обращение. Попробуйте
          сказать тот же смысл своими словами, прежде чем идти дальше."
        point: Сначала самостоятельная попытка, затем разбор.
        before:
          view: task
          task: update
        set:
          view: task
          task: update
          solved: true
  - id: exam-offers
    chapter: exam
    title: Zehn Anliegen bei verschiedenen Diensten
    beats:
      - read: "Десять запросов относятся к разным услугам. Сравните день и вид работы: компьютерная
          помощь не равна ремонту камеры. Одно объявление используйте один раз; при отсутствии
          подходящего выбирайте x. Пассивные формулировки помогут узнать услугу, но не сообщают
          больше, чем прямо написано в объявлении."
        point: Ищите подтверждение в источнике, а не совпадение отдельного слова.
        set:
          view: task
          task: offers
