id: b1-service
order: 13
title: Der Raum wird renoviert. Was bleibt vereinbart?
ru: Уточняем изменение и сохраняем нужные условия
lede: Администрация сообщает о ремонте подтверждённого Raum B. Для встречи предлагают Raum C с
  той же кухней и ценой. Нужно проверить замену, получить письменное подтверждение и не
  перепутать 15:00 начало встречи с 14:30 выдачей ключа.
goals:
  - Понять действие в Passiv Präsens
  - Согласовать wird/werden с предметом действия
  - Уточнить замену без потери условий
  - Написать ответ и извлечь время выдачи ключа
grammar:
  - "Passiv Präsens: werden + Partizip II"
exam:
  - b1-lesen-2
  - b1-lesen-3
  - b1-hoeren-3
  - b1-schreiben-1
dialogues:
  scene:
    title: Der Raum wird renoviert. Was bleibt vereinbart?
    ru: Уточняем изменение и сохраняем нужные условия
    place: Kiel · Nachbarschaftshaus · вымышленная учебная ситуация
    people:
      D:
        name: Dana
        voice: Anna
      M:
        name: Mateo
        voice: Reed
      E:
        name: Elif
        voice: Flo
      H:
        name: Hauke
        voice: Rocko
      P:
        name: Frau Petersen
        voice: Sandy
    lines:
      - P: Raum B wird zurzeit renoviert. Wir bieten Ihnen Raum C an.
        ru: ПомещениеB сейчас ремонтируется. Мы предлагаем помещение C.
      - H: Wird dort auch die kleine Küche genutzt?
        ru: Там также используют маленькую кухню?
      - P: Ja. Die Küche wird heute gereinigt. Raum C hat ebenfalls achtzehn Plätze.
        ru: Да. Кухню сегодня убирают. В помещенииC также восемнадцать мест.
      - D: Bleiben die Miete und der Termin gleich?
        ru: Стоимость и срок остаются прежними?
      - P: Ja. Vierzig Euro mit Küche, am achtzehnten Oktober von fünfzehn bis achtzehn Uhr.
        ru: Да. Сорок евро с кухней, восемнадцатого октября с пятнадцати до восемнадцати.
      - M: Dann könnten wir Raum C nehmen. Wann bekommen wir den Schlüssel?
        ru: Тогда мы могли бы взять помещение C. Когда получим ключ?
      - P: Die Schlüssel werden ab halb drei im Seitenbüro ausgegeben. Der Aufbau ist dann möglich.
        ru: Ключи выдают с половины третьего в боковом офисе. Тогда можно начинать подготовку.
      - H: Gut. Bitte bestätigen Sie den Wechsel schriftlich.
        ru: Хорошо. Пожалуйста, подтвердите замену письменно.
