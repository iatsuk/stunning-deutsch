    sample:
      - Sehr geehrte Frau Petersen, vielen Dank für Ihre Nachricht. Wir haben verstanden, dass
        Raum B renoviert wird und unsere Veranstaltung in Raum C stattfindet. Bitte beachten
        Sie, dass wir weiterhin 18 Plätze und die kleine Küche brauchen. Laut Ihrer Bestätigung
