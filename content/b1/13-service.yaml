      b) Druckstudio. Kleine Mengen von Karten und Bildunterschriften werden bis Samstag
      gedruckt. Datei per E-Mail.

      c) Hilfe nach dem Fest. Sonntag 18–20 Uhr werden Räume gereinigt. Vorher anmelden.

      d) Aufbauhilfe. Sonntag 14 Uhr werden Tische und Stühle aufgestellt. Keine Hilfe nach 18
      Uhr.

      e) Schlüsselbüro. Sonntag 14:30–14:45 Uhr im Seitenbüro. Nur Schlüsselübergabe, keine
      Raumführung.

      f) Ersatzraum C. Sonntag 15–18 Uhr, 18 Plätze und kleine Küche, 40 Euro. Aufbau ab 14:30
      möglich.

      g) Großer Saal.25 Plätze, 60 Euro, ohne Küche.

      h) Mehrwegbecher. Abholung Freitag, Rückgabe Montag. Kein Getränkeservice.

      i) Sprachhilfe. Private kurze Texte werden auf Deutsch und Russisch erklärt, keine
      amtliche Übersetzung.

      j) Computerhilfe. Dienstag 18 Uhr, kleine Gruppe, keine Reparatur von Kameras.

      k) Fotos ausstellen. Eigene Fotos werden in einem monatlichen offenen Treffen besprochen.

      l) Getränke liefern. Sonntag 14–15 Uhr, Lieferung nur nach vorheriger Bestellung.

