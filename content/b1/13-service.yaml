    text: "Ihre Buchung wird geändert: Raum C ersetzt Raum B. Bestätigt bleiben Sonntag, 18.
      Oktober, 15–18 Uhr, 18 Plätze und kleine Küche. Die Raummiete bleibt 40 Euro. Die
      Schlüssel werden 14:30–14:45 Uhr im Seitenbüro ausgegeben. Ab 14:30 ist Aufbau erlaubt.
      Zugang über den Seiteneingang. Essen organisieren Sie wie vereinbart selbst. Frau
      Petersen"
