spy:
  - de: "Die Küche wird heute gereinigt."
    wrong: "Die Küche wird heute reinigt."
    why: "Passiv: *wird* + причастие *gereinigt*."
  - de: "Die Schlüssel werden im Seitenbüro ausgegeben."
    wrong: "Die Schlüssel wird im Seitenbüro ausgegeben."
    why: "Подлежащее во мн. ч.: *werden*."
  - de: "Raum B wird zurzeit renoviert."
    wrong: "Raum B wird zurzeit gerenoviert."
    why: "У глаголов на *-ieren* нет *ge-*: *renoviert*."
  - de: "Der Brief wird verschickt."
    wrong: "Der Brief wird geverschickt."
    why: "У глаголов с приставкой *ver-* нет *ge-*: *verschickt*."

