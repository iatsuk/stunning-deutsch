case:
  title: Die Änderung hat klare Grenzen
  ru: Сверка дневника
  intro: Не превращайте ремонт одного помещения в отмену или подорожание всего проекта.
  people: {}
  steps:
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Raum B wird renoviert. Raum C ersetzt ihn.
          ru: ПомещениеB ремонтируется. Его заменяетC.
      question: Кто именно делает ремонт?
      options:
        - Матео
        - Дана
        - В этой фразе не назван
      answer: 2
      right: Passiv не содержит имени исполнителя.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Die Miete bleibt 40 Euro einschließlich Küche.
          ru: Аренда остаётся 40 евро с кухней.
      question: Кухня стала дополнительной платной услугой?
      options:
        - Еду тоже оплатили
        - Нет
        - Да
      answer: 1
      right: Кухня включена, цена не изменилась.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
    - read: Сверьте запись с исходным сообщением.
      evidence:
        - note: Schlüssel 14:30–14:45. Beginn 15:00. Seiteneingang.
          ru: Ключ 14:30–14:45. Начало 15:00. Боковой вход.
      question: Какой порядок подходит?
      options:
        - Получить ключ, подготовить зал, встретить гостей
        - Прийти к выдаче ключа в 15:00
        - Отменить встречу
      answer: 0
      right: Выдача до начала, не в момент прихода гостей.
      wrong: Этот вывод не подтверждается исходным сообщением. Сверьте время, отрицание и связь между
        частями.
  ending: Уточнены действие, границы изменения и последовательность подготовки. Источник не
    использован для выдуманного обвинения или лишнего платежа.
adventure:
  kind: sequence
  title: Сохраните договорённость после изменения
  intro: Администрация сообщает о ремонте подтверждённого Raum B. Для встречи предлагают Raum C с
    той же кухней и ценой. Нужно проверить замену, получить письменное подтверждение и не
    перепутать 15:00 начало встречи с 14:30 выдачей ключа.
  ending: Вместо B подтверждён Raum C с кухней на прежний срок и за 40 евро. Ключ получают
    14:30–14:45 через боковой офис; встреча начинается 15:00. Продукты и возврат ключа остаются
    отдельными задачами.
  challenges:
    - id: change
      kind: select
      title: Что действительно изменилось?
      intro: Прочитайте письменное изменение.
      mode: reading
      clue:
        task: update
      options:
        - id: o0
          label: Помещение B заменено на C
        - id: o1
          label: Встреча перенесена на 19 октября
        - id: o2
          label: Аренда стала 60 евро
      answer:
        - o0
      success: Выбор согласуется со всеми условиями сообщения. Остальные варианты нарушают хотя бы
        одно из них.
      wrong: "Вернитесь к условиям: совпадения одного слова недостаточно. Проверьте время, отрицание
        и адресата."
    - id: agreement
      kind: match
      title: О чём идёт действие?
      intro: Подберите форму по числу подлежащего.
      slots:
        - id: r
          label: Der Raum … renoviert.
          answer: wird
        - id: k
          label: Die Küche … gereinigt.
          answer: wird
        - id: s
          label: Die Schlüssel … ausgegeben.
          answer: werden
      options:
        - id: wird
          label: wird
        - id: werden
          label: werden
      success: Форма согласована с предметом действия.
      wrong: Raum и Küche — единственное; Schlüssel здесь множественное.
    - id: passive
      kind: order
      title: Сохраните фокус на помещении
      intro: Соберите Passiv Präsens.
      label: Реплика для команды
      tokens:
        - Raum C
        - wird
        - heute
        - vorbereitet.
      success: Реплика передаёт нужный смысл. Сравните порядок слов с правилом в разборе.
      wrong: "Проверьте положение глагола и конец предложения: используйте все фрагменты."
    - id: key
      kind: clock
      title: Когда начинается выдача ключа?
      intro: Используйте письменное изменение, а не время начала встречи.
      mode: reading
      clue:
        task: update
      answer: 14:30
      initial: 14:00
      minuteStep: 5
      success: Ключ получают с 14:30, до начала встречи.
      wrong: Встреча в 15:00; выдача ключа с 14:30.
    - id: record
      kind: note
      title: Обновите помещение и цену
      intro: Запишите новое помещение и прежнюю арендную плату.
      mode: reading
      clue:
        task: update
      fields:
        - label: Raum
          answers:
            - C
            - Raum C
        - label: Miete in Euro
          answers:
            - "40"
            - vierzig
            - 40 Euro
      success: Заменён только нужный пункт; цена сохранена.
      wrong: Подтверждены C и 40 евро.
